, at, source, ctxHash: l.ctxHash };\n      sum[r.hit ? 'hit' : 'miss']++;\n    }\n  }\n  doc.meta = { ...doc.meta, updatedAt: at, exec: { ...sum, at, source, command } };\n  persist(root, doc);\n  writeHtml(root, doc);\n  return { id: doc.id, ...sum };\n}\n\nconst MAX_FILE_BYTES = 512 * 1024;\nconst MAX_TOTAL_BYTES = 8 * 1024 * 1024;\n\n/** Snapshot of every referenced file, embedded in the viewer (code tabs, gutter markers). */\nexport function collectFiles(root, doc) {\n  const files = {};\n  let total = 0;\n  const paths = [...new Set(doc.traces.flatMap((t) => t.locations.map((l) => l.path)))];\n  for (const rel of paths) {\n    try {\n      const abs = safeJoin(root, rel);\n      const st = fs.statSync(abs);\n      if (!st.isFile() || st.size > MAX_FILE_BYTES || total + st.size > MAX_TOTAL_BYTES) continue;\n      const text = fs.readFileSync(abs, 'utf8');\n      if (text.indexOf(String.fromCharCode(0)) !== -1) continue; // binary\n      files[rel] = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));\n      total += st.size;\n    } catch {\n      /* missing file: the viewer falls back to the stored snippet */\n    }\n  }\n  return files;\n}\n\nconst sha = (s) => crypto.createHash('sha1').update(s).digest('hex').slice(0, 12);\nconst storyHash = (doc) => sha(doc.traces.map((t) => traceHash(t)).join('|'));\n\n/**\n * Records, for every node / trace / the story, a hash of the code the prose was written for.\n * force=true overwrites (prose just written); otherwise only fills missing baselines (old maps).\n */\nexport function baselineNarrative(doc, { force = false, nodes = null, traces = null, story = false } = {}) {\n  for (const t of doc.traces) {\n    for (const l of t.locations) {\n      if (!l.ctxHash) continue;\n      if (force || !l.narrativeHash || (nodes && nodes.has(l.id))) l.narrativeHash = l.ctxHash;\n    }\n    if (force || !t.narrativeHash || (traces && traces.has(t.id))) t.narrativeHash = traceHash(t);\n  }\n  if (force || !doc.narrativeHash || story) doc.narrativeHash = storyHash(doc);\n  return doc;\n}\n\n/**\n * Narrative drift: prose written for code that has since changed (anchors may still be fine).\n * Uses the stored ctxHash of each node (refreshed by create/verify --fix/annotate).\n */\nexport function narrativeDrift(doc) {\n  const nodes = [];\n  const traces = [];\n  for (const t of doc.traces) {\n    for (const l of t.locations) if (l.narrativeHash && l.ctxHash && l.narrativeHash !== l.ctxHash) nodes.push(l.id);\n    if (t.narrativeHash && t.narrativeHash !== traceHash(t)) traces.push(t.id);\n  }\n  const story = !!doc.narrativeHash && doc.narrativeHash !== storyHash(doc);\n  return { nodes, traces, story, stale: nodes.length > 0 || traces.length > 0 || story };\n}\n\n/** Which narrative fields are still empty (drives the \"fill with waymark_annotate\" hint). */\nexport function narrativeGaps(doc) {\n  const gaps = { story: !doc.story, motivation: [], details: [], explanation: [] };\n  for (const t of doc.traces) {\n    if (!t.motivation) gaps.motivation.push(t.id);\n    if (!t.details) gaps.details.push(t.id);\n    for (const l of t.locations) if (!l.explanation) gaps.explanation.push(l.id);\n  }\n  gaps.complete = !gaps.story && !gaps.motivation.length && !gaps.details.length && !gaps.explanation.length;\n  return gaps;\n}\n\n/**\n * Patches prose on an existing map without re-anchoring: story/description/title at map level,\n * title/description/diagramTitle/motivation/details per trace, title/description/explanation per location.\n */\nexport function annotateMap(root, id, patch) {\n  const doc = loadMap(root, id);\n  const unknown = [];\n  let changed = 0;\n  const set = (obj, key, val) => {\n    if (typeof val === 'string' && obj[key] !== val) {\n      if (key === 'title' || key === 'diagramTitle') Title.parse(val);\n      obj[key] = val;\n      changed++;\n      return true;\n    }\n    return false;\n  };\n  const touchedNodes = new Set();\n  const touchedTraces = new Set();\n  let touchedStory = false;\n  // Prose confirmed accurate without edits: re-baseline it so it stops being flagged.\n  for (const r of patch.reviewed || []) {\n    if (r === 'story') touchedStory = true;\n    else if (String(r).startsWith('trace:')) touchedTraces.add(String(r).slice(6));\n    else touchedNodes.add(String(r));\n  }\n  for (const k of ['title', 'description', 'story', 'language']) if (set(doc, k, patch[k]) && k === 'story') touchedStory = true;\n  for (const tp of patch.traces || []) {\n    const t = doc.traces.find((x) => x.id === String(tp.id));\n    if (!t) {\n      unknown.push(`trace ${tp.id}`);\n      continue;\n    }\n    for (const k of ['title', 'description', 'diagramTitle', 'motivation', 'details']) if (set(t, k, tp[k])) touchedTraces.add(t.id);\n  }\n  for (const lp of patch.locations || []) {\n    const l = doc.traces.flatMap((t) => t.locations).find((x) => x.id === lp.id);\n    if (!l) {\n      unknown.push(`location ${lp.id}`);\n      continue;\n    }\n    for (const k of ['title', 'description', 'explanation']) if (set(l, k, lp[k])) touchedNodes.add(l.id);\n  }\n  if (Array.isArray(patch.links)) {\n    // Cross-trace links are prose too (labels): replace the whole list, validating the ends.\n    const ids = new Set(doc.traces.flatMap((t) => t.locations.map((l) => l.id)));\n    const bad = patch.links.filter((k) => !ids.has(k.from) || !ids.has(k.to));\n    if (bad.length) throw new Error(`Links reference unknown nodes: ${bad.map((k) => `${k.from}->${k.to}`).join(', ')}`);\n    doc.links = patch.links.map(({ from, to, label }) => (label ? { from, to, label } : { from, to }));\n    changed++;\n  }\n  for (const t of doc.traces) {\n    if (t.guide && !t.details) t.details = t.guide;\n    delete t.guide;\n  }\n  // Rewritten prose now describes the current code: refresh context hashes and re-baseline it.\n  refreshContextHashes(root, doc);\n  baselineNarrative(doc, { nodes: touchedNodes, traces: touchedTraces, story: touchedStory });\n  const drift = narrativeDrift(doc);\n  doc.meta = {\n    ...doc.meta,\n    updatedAt: new Date().toISOString(),\n    narrativeDrift: drift.stale ? { nodes: drift.nodes, traces: drift.traces, story: drift.story } : undefined,\n  };\n  persist(root, doc);\n  const htmlPath = writeHtml(root, doc);\n  return { id: doc.id, changed, unknown, narrative: narrativeGaps(doc), drift, htmlPath };\n}\n\nexport function persist(root, doc) {\n  fs.writeFileSync(filePath(root, doc.id), JSON.stringify(doc, null, 2));\n}\n\nexport function loadMap(root, id, { quiet = false } = {}) {\n  let p;\n  try {\n    p = filePath(root, id);\n  } catch (e) {\n    if (quiet) return null;\n    throw e;\n  }\n  if (!fs.existsSync(p)) {\n    // Allow unique prefix lookups (\"auth-flow\" -> \"auth-flow-1a2b3c\").\n    const hit = listMaps(root).filter((m) => m.id.startsWith(id));\n    if (hit.length === 1) return loadMap(root, hit[0].id);\n    if (quiet) return null;\n    throw new Error(\n      hit.length > 1 ? `Ambiguous waymark id \"${id}\": ${hit.map((h) => h.id).join(', ')}` : `Waymark \"${id}\" not found`,\n    );\n  }\n  return JSON.parse(fs.readFileSync(p, 'utf8'));\n}\n\nexport function listMaps(root) {\n  const dir = mapDir(root);\n  if (!fs.existsSync(dir)) return [];\n  return fs\n    .readdirSync(dir)\n    .filter((f) => f.endsWith('.json'))\n    .map((f) => {\n      try {\n        const d = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));\n        return {\n          id: d.id,\n          title: d.title,\n          description: d.description,\n          query: d.query,\n          traces: d.traces.length,\n          locations: d.traces.reduce((n, t) => n + t.locations.length, 0),\n          updatedAt: d.meta?.updatedAt,\n          commit: d.meta?.commit?.slice(0, 8),\n          tags: d.tags,\n          kind: d.kind || 'flow',\n          check: checkSummary(d),\n          exec: d.meta?.exec ? { hit: d.meta.exec.hit, miss: d.meta.exec.miss, unknown: d.meta.exec.unknown } : null,\n          drift: narrativeDrift(d).nodes.length,\n          mapRefs: d.traces.flatMap((t) => t.locations).filter((l) => l.mapRef).map((l) => l.mapRef.split('#')[0]),\n        };\n      } catch {\n        return null;\n      }\n    })\n    .filter(Boolean)\n    .sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));\n}\n\n/** Recomputes each node's ctxHash at its stored line (no re-anchoring). */\nexport function refreshContextHashes(root, doc) {\n  const cache = new FileCache(root);\n  for (const t of doc.traces) {\n    for (const l of t.locations) {\n      const f = cache.read(l.path);\n      if (f) l.ctxHash = contextHash(f.lines, Math.min(Math.max(l.lineNumber - 1, 0), f.lines.length - 1));\n    }\n  }\n  return doc;\n}\n\nexport function deleteMap(root, id) {\n  const doc = loadMap(root, id);\n  for (const ext of ['json', 'html']) {\n    const p = filePath(root, doc.id, ext);\n    if (fs.existsSync(p)) fs.unlinkSync(p);\n  }\n  return doc.id;\n}\n","src/anchor.js":"import fs from 'node:fs';\nimport path from 'node:path';\nimport crypto from 'node:crypto';\nimport { trackedFiles } from './git.js';\n\nconst MAX_FILE_BYTES = 4 * 1024 * 1024;\nconst SNIPPET_BEFORE = 3;\nconst SNIPPET_AFTER = 14;\n\nconst norm = (s) => (s || '').trim().replace(/\\s+/g, ' ');\n\n/** Resolves a repo-relative path, refusing anything that escapes the root. */\nexport function safeJoin(root, rel) {\n  const abs = path.resolve(root, rel);\n  const relBack = path.relative(root, abs);\n  if (relBack.startsWith('..') || path.isAbsolute(relBack)) {\n    throw new Error(`Path \"${rel}\" is outside the repository root`);\n  }\n  return abs;\n}\n\nexport class FileCache {\n  constructor(root) {\n    this.root = root;\n    this.files = new Map();\n    this._tracked = undefined;\n  }\n\n  read(rel) {\n    if (this.files.has(rel)) return this.files.get(rel);\n    let entry = null;\n    try {\n      const abs = safeJoin(this.root, rel);\n      const stat = fs.statSync(abs);\n      if (stat.isFile() && stat.size \u003c= MAX_FILE_BYTES) {\n        const text = fs.readFileSync(abs, 'utf8');\n        entry = {\n          lines: text.split(/\\r?\\n/),\n          hash: crypto.createHash('sha1').update(text.replace(/\\r\\n/g, '\\n')).digest('hex').slice(0, 12),\n        };\n      }\n    } catch {\n      entry = null;\n    }\n    this.files.set(rel, entry);\n    return entry;\n  }\n\n  /** Finds a moved/renamed file by basename when the original path is gone. */\n  findByBasename(rel) {\n    if (this._tracked === undefined) this._tracked = trackedFiles(this.root);\n    if (!this._tracked) return null;\n    const base = path.posix.basename(rel);\n    const hits = this._tracked.filter((f) => path.posix.basename(f) === base);\n    if (hits.length === 1) return hits[0];\n    // Prefer the candidate sharing the longest path suffix.\n    const parts = rel.split('/');\n    let best = null;\n    let bestScore = 0;\n    for (const h of hits) {\n      const hp = h.split('/');\n      let s = 0;\n      while (s \u003c parts.length && s \u003c hp.length && parts[parts.length - 1 - s] === hp[hp.length - 1 - s]) s++;\n      if (s > bestScore) [best, bestScore] = [h, s];\n      else if (s === bestScore) best = null;\n    }\n    return bestScore > 1 ? best : null;\n  }\n}\n\nfunction nearest(indices, target) {\n  return indices.reduce((a, b) => (Math.abs(b - target) \u003c Math.abs(a - target) ? b : a));\n}\n\n/**\n * Checks a location against the working tree and corrects its line number.\n * status: ok | moved (same text, other line) | fuzzy (partial match) | relocated (file moved)\n *         | unresolved (text not found) | missing (file not found)\n */\nexport function anchorLocation(cache, loc) {\n  let relPath = loc.path;\n  let file = cache.read(relPath);\n  let relocatedFrom = null;\n  if (!file) {\n    const alt = cache.findByBasename(relPath);\n    if (alt && (file = cache.read(alt))) {\n      relocatedFrom = relPath;\n      relPath = alt;\n    }\n  }\n  if (!file) {\n    return { ...loc, status: 'missing', note: `File not found: ${loc.path}` };\n  }\n\n  const { lines } = file;\n  const wanted = norm(loc.lineContent);\n  const idx0 = Math.min(Math.max(loc.lineNumber - 1, 0), lines.length - 1);\n  let idx = -1;\n  let status = 'unresolved';\n\n  if (!wanted || norm(lines[idx0]) === wanted) {\n    idx = idx0;\n    status = 'ok';\n  } else {\n    const exact = [];\n    lines.forEach((l, i) => norm(l) === wanted && exact.push(i));\n    if (exact.length) {\n      idx = nearest(exact, idx0);\n      status = 'moved';\n    } else {\n      const partial = [];\n      if (wanted.length >= 6) {\n        lines.forEach((l, i) => {\n          const n = norm(l);\n          if (n.length >= 6 && (n.includes(wanted) || wanted.includes(n))) partial.push(i);\n        });\n      }\n      if (!partial.length && loc.symbol) {\n        const re = new RegExp(`\\\\b${loc.symbol.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')}\\\\b`);\n        lines.forEach((l, i) => re.test(l) && partial.push(i));\n      }\n      if (partial.length) {\n        idx = nearest(partial, idx0);\n        status = 'fuzzy';\n      }\n    }\n  }\n  if (relocatedFrom && (status === 'ok' || status === 'moved')) status = 'relocated';\n\n  const anchorIdx = idx >= 0 ? idx : idx0;\n  const start = Math.max(0, anchorIdx - SNIPPET_BEFORE);\n  const end = Math.min(lines.length, anchorIdx + SNIPPET_AFTER + 1);\n  const result = {\n    ...loc,\n    path: relPath,\n    lineNumber: anchorIdx + 1,\n    status,\n    fileHash: file.hash,\n    ctxHash: contextHash(lines, anchorIdx),\n    snippet: { startLine: start + 1, code: lines.slice(start, end).join('\\n') },\n  };\n  if (idx >= 0) result.lineContent = lines[anchorIdx].trim();\n  const notes = [];\n  if (relocatedFrom) notes.push(`file moved from ${relocatedFrom}`);\n  if (status !== 'ok' && status !== 'unresolved' && loc.lineNumber !== anchorIdx + 1) {\n    notes.push(`line ${loc.lineNumber} -> ${anchorIdx + 1}`);\n  }\n  if (status === 'fuzzy') notes.push('partial text match; double-check');\n  if (status === 'unresolved') notes.push(`line content not found in ${relPath}: \"${loc.lineContent}\"`);\n  if (notes.length) result.note = notes.join('; ');\n  else delete result.note;\n  return result;\n}\n\nconst CTX_MAX = 60;\nconst CTX_SIBLINGS = 4;\nconst indentOf = (l) => (l.match(/^\\s*/)[0].replace(/\\t/g, '    ').length);\nconst isCloser = (l) => /^[\\s)\\]}>;,]*(end\\b.*)?$/i.test(l) && l.trim().length > 0;\n\n/**\n * The code a node talks about: its line plus the block it opens (more-indented lines and the\n * closing bracket), or — for a single statement — a few sibling lines after it.\n */\nexport function contextBlock(lines, idx) {\n  return contextIndices(lines, idx).map((i) => lines[i]);\n}\n\n/** 0-based line indices of the block a node talks about (see contextBlock). */\nexport function contextIndices(lines, idx) {\n  if (idx \u003c 0 || idx >= lines.length) return [];\n  const base = indentOf(lines[idx]);\n  const out = [idx];\n  for (let i = idx + 1; i \u003c lines.length && out.length \u003c CTX_MAX; i++) {\n    const l = lines[i];\n    if (!l.trim()) continue;\n    if (indentOf(l) > base) out.push(i);\n    else {\n      if (out.length > 1 && isCloser(l)) out.push(i);\n      break;\n    }\n  }\n  if (out.length === 1) {\n    // A plain statement: include the next sibling lines at the same indentation.\n    for (let j = idx + 1, n = 0; j \u003c lines.length && n \u003c CTX_SIBLINGS; j++) {\n      const l = lines[j];\n      if (!l.trim()) continue;\n      if (indentOf(l) \u003c base) break;\n      out.push(j);\n      n++;\n    }\n  }\n  return out;\n}\n\n/** 1-based [first, last] line range of a node's block (used to match diffs against nodes). */\nexport function contextRange(lines, idx) {\n  const ix = contextIndices(lines, idx);\n  return ix.length ? [ix[0] + 1, ix[ix.length - 1] + 1] : null;\n}\n\n/**\n * Hash of the code a node talks about (whitespace-insensitive). Moving the block keeps the\n * hash; editing it changes it — that is how \"narrative drift\" (prose describing old code)\n * is detected, independently of whether the anchor line itself still exists.\n */\nexport function contextHash(lines, idx) {\n  const body = contextBlock(lines, idx).map((l) => norm(l)).join('\\n');\n  return crypto.createHash('sha1').update(body).digest('hex').slice(0, 12);\n}\n\n/** Combined hash of a trace's node contexts (its guide is stale when this changes). */\nexport function traceHash(trace) {\n  const all = trace.locations.map((l) => l.ctxHash || '').join('|');\n  return crypto.createHash('sha1').update(all).digest('hex').slice(0, 12);\n}\n\n/** Anchors every location of a normalized map in place; returns a summary report. */\nexport function anchorMap(root, map) {\n  const cache = new FileCache(root);\n  const report = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0, issues: [] };\n  for (const trace of map.traces) {\n    trace.locations = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      report[r.status]++;\n      if (r.status !== 'ok') report.issues.push({ id: r.id, status: r.status, path: r.path, note: r.note });\n      return r;\n    });\n  }\n  report.total = map.traces.reduce((n, t) => n + t.locations.length, 0);\n  report.healthy = report.unresolved === 0 && report.missing === 0;\n  return report;\n}\n\n/** Search helper for agents: lines in a file matching a regex or literal, with numbers. */\nexport function findInFile(root, rel, pattern, { regex = false, limit = 20 } = {}) {\n  const cache = new FileCache(root);\n  const file = cache.read(rel.replace(/\\\\/g, '/'));\n  if (!file) throw new Error(`File not found or unreadable: ${rel}`);\n  const re = regex ? new RegExp(pattern) : null;\n  const hits = [];\n  file.lines.forEach((l, i) => {\n    if (hits.length \u003c limit && (re ? re.test(l) : l.includes(pattern))) {\n      hits.push({ lineNumber: i + 1, lineContent: l.trim() });\n    }\n  });\n  return { path: rel, totalLines: file.lines.length, hits };\n}\n","src/render/html.js":"import fs from 'node:fs';\nimport path from 'node:path';\nimport { fileURLToPath } from 'node:url';\nimport { renderMermaid } from './mermaid.js';\nimport { renderMarkdown } from './markdown.js';\nimport { checkState, execState } from '../state.js';\n\nconst HERE = path.dirname(fileURLToPath(import.meta.url));\nconst CSS = fs.readFileSync(path.join(HERE, 'viewer.css'), 'utf8');\nconst CLIENT = fs.readFileSync(path.join(HERE, 'viewer.client.js'), 'utf8');\nconst BS = String.fromCharCode(92);\n\nconst escHtml = (s) =>\n  String(s ?? '').replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n\n// JSON inside \u003cscript type=\"application/json\">: only \"\u003c\" must be neutralized (no \"\u003c/script>\").\nconst inlineJson = (v) => JSON.stringify(v).split('\u003c').join(BS + 'u003c');\nconst inlineScript = (s) => s.replace(/\u003c\\/script/gi, '\u003c' + BS + '/script');\n\n/**\n * Self-contained, shareable viewer (no network): map pane with story, guides and\n * explanations; code view with embedded files; interactive SVG diagram.\n * `files` is a snapshot { path: content } of the referenced files.\n */\nexport function renderHtml(doc, { files = {}, maps = [] } = {}) {\n  const data = {\n    doc,\n    files,\n    maps,\n    // Precomputed per-node state (fact-check verdict validity needs hashes the browser can't do sync).\n    states: Object.fromEntries(\n      doc.traces.flatMap((t) => t.locations.map((l) => [l.id, { check: checkState(l), exec: execState(l) }])),\n    ),\n    markdown: renderMarkdown(doc, { detail: 'full' }),\n    // Smaller context blocks for \"copy trace / node as context\".\n    traceMd: Object.fromEntries(doc.traces.map((t) => [t.id, renderMarkdown(doc, { trace: t.id })])),\n    nodeMd: Object.fromEntries(doc.traces.flatMap((t) => t.locations.map((l) => [l.id, renderMarkdown(doc, { node: l.id })]))),\n    mermaid: renderMermaid({ ...doc, diagram: undefined }),\n  };\n  return `\u003c!doctype html>\n\u003chtml lang=\"${escHtml(doc.language || 'en')}\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"generator\" content=\"waymark\">\n\u003ctitle>Waymark · ${escHtml(doc.title)}\u003c/title>\n\u003cstyle>${CSS}\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"app\">\n  \u003cheader id=\"topbar\">\n    \u003cspan class=\"brand\">WAYMARK\u003c/span>\u003cspan class=\"brand-sep\">\u003c/span>\n    \u003cspan class=\"top-title\">\u003c/span>\n    \u003cdiv class=\"search\">\n      \u003cinput id=\"search\" type=\"search\" placeholder=\"Search nodes…  ( / )\" autocomplete=\"off\" spellcheck=\"false\" aria-label=\"Search nodes\">\n      \u003cdiv id=\"searchResults\" hidden>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"seg\" role=\"tablist\" aria-label=\"View\">\n      \u003cbutton id=\"vCode\" role=\"tab\" title=\"Code view (d)\">Code\u003c/button>\n      \u003cbutton id=\"vDiagram\" role=\"tab\" title=\"Diagram view (d)\">Diagram\u003c/button>\n    \u003c/div>\n    \u003ca class=\"tbtn\" id=\"allMaps\" href=\"index.html\" title=\"All maps in this repository\">All maps\u003c/a>\n    \u003cbutton class=\"tbtn\" id=\"copyCtx\" title=\"Copy the map as markdown context for an agent\">Copy context\u003c/button>\n    \u003cbutton class=\"tbtn\" id=\"settingsBtn\" title=\"Editor link settings\">⚙\u003c/button>\n  \u003c/header>\n  \u003cdiv id=\"settings\" hidden>\n    \u003clabel>Local repo path \u003cinput id=\"setRoot\" spellcheck=\"false\">\u003c/label>\n    \u003clabel>Editor\n      \u003cselect id=\"setEditor\">\n        \u003coption value=\"vscode\">VS Code\u003c/option>\u003coption value=\"cursor\">Cursor\u003c/option>\n        \u003coption value=\"windsurf\">Windsurf / Devin Desktop\u003c/option>\u003coption value=\"idea\">JetBrains\u003c/option>\n      \u003c/select>\n    \u003c/label>\n  \u003c/div>\n  \u003cdiv id=\"main\">\n    \u003caside id=\"mapPane\" aria-label=\"Map\">\u003c/aside>\n    \u003cdiv id=\"splitter\" role=\"separator\" aria-orientation=\"vertical\" title=\"Drag to resize\">\u003c/div>\n    \u003csection id=\"rightPane\">\n      \u003cdiv id=\"codeView\">\n        \u003cdiv id=\"fileTabs\">\u003c/div>\n        \u003cdiv id=\"codeScroll\">\u003cdiv id=\"code\">\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"diagramView\" hidden>\n        \u003cdiv class=\"dg-toolbar\">\n          \u003cdiv class=\"legend\" id=\"legend\">\u003c/div>\n          \u003cdiv class=\"zoom\">\n            \u003cbutton id=\"zin\" title=\"Zoom in\">+\u003c/button>\n            \u003cbutton id=\"zout\" title=\"Zoom out\">−\u003c/button>\n            \u003cbutton id=\"zfit\" title=\"Fit all (f)\">⤢\u003c/button>\n            \u003cbutton id=\"zsel\" title=\"Center selected node\">◎\u003c/button>\n            \u003cbutton id=\"copyMmd\" title=\"Copy the diagram as Mermaid source\">⧉\u003c/button>\n            \u003cbutton id=\"exportSvg\" title=\"Download the diagram as SVG\">⤓\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003csvg id=\"mini\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Minimap\">\u003cg id=\"miniContent\">\u003c/g>\u003crect id=\"miniView\"/>\u003c/svg>\n        \u003csvg id=\"dg\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Interactive diagram\">\n          \u003cdefs>\n            \u003cmarker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\" style=\"color:var(--muted)\"/>\u003c/marker>\n            \u003cmarker id=\"arr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\" style=\"color:var(--ink2)\"/>\u003c/marker>\n          \u003c/defs>\n          \u003cg id=\"vp\">\u003c/g>\n        \u003c/svg>\n        \u003cdiv id=\"dgTip\" hidden>\u003c/div>\n        \u003cdiv id=\"dgCard\" hidden>\u003c/div>\n        \u003cdiv class=\"dg-hint\">Drag to pan · wheel to zoom · click a node to focus its path · double-click to open the code\u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/div>\n\u003c/div>\n\u003cscript id=\"waymark-data\" type=\"application/json\">${inlineJson(data)}\u003c/script>\n\u003cscript>${inlineScript(CLIENT)}\u003c/script>\n\u003c/body>\n\u003c/html>`;\n}\n\nconst pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '—');\n\n/** .waymark/index.html: overview maps first, then flows; health badges per map; text filter. */\nexport function renderIndex(maps, { root = '' } = {}) {\n  const sorted = [...maps].sort((a, b) => (a.kind === 'overview' ? 0 : 1) - (b.kind === 'overview' ? 0 : 1) || String(b.updatedAt).localeCompare(String(a.updatedAt)));\n  const cards = sorted\n    .map((m) => {\n      const c = m.check || {};\n      const badges = [\n        m.kind === 'overview' ? '\u003cspan class=\"b ov\">overview\u003c/span>' : '',\n        `\u003cspan class=\"b\">${m.traces} traces · ${m.locations} nodes\u003c/span>`,\n        c.total && c.total - c.unchecked - c.stale ? `\u003cspan class=\"b ${c.unsupported ? 'bad' : 'ok'}\" title=\"fact-checked nodes\">✓ ${pct(c.supported, c.total)} verified${c.unsupported ? ` · ${c.unsupported} unsupported` : ''}\u003c/span>` : '',\n        m.exec ? `\u003cspan class=\"b ok\" title=\"nodes executed by the tests\">▶ ${m.exec.hit}/${m.exec.hit + m.exec.miss} executed\u003c/span>` : '',\n        m.drift ? `\u003cspan class=\"b warn\">◔ ${m.drift} to review\u003c/span>` : '',\n      ].join('');\n      const text = escHtml([m.title, m.description, m.id, m.query].join(' ').toLowerCase());\n      return `\u003ca class=\"card\" href=\"${escHtml(m.id)}.html\" data-text=\"${text}\">\u003ch2>${escHtml(m.title)}\u003c/h2>\u003cp>${escHtml(m.description || '')}\u003c/p>\u003cdiv class=\"bs\">${badges}\u003c/div>\u003cdiv class=\"id\">${escHtml(m.id)} · ${escHtml(String(m.updatedAt || '').slice(0, 10))}\u003c/div>\u003c/a>`;\n    })\n    .join('');\n  return `\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Waymark · maps\u003c/title>\n\u003cstyle>\n:root{--bg:#1b1c1f;--panel:#232428;--ink:#e4e5e8;--muted:#8f949c;--line:#36383e;--accent:#5b8cff;--ok:#3fae6a;--warn:#e0a43a;--bad:#e5646b;color-scheme:dark}\n@media (prefers-color-scheme:light){:root{--bg:#f6f6f4;--panel:#fff;--ink:#1d1f23;--muted:#6b7078;--line:#e3e3df;--accent:#3a5ccc;color-scheme:light}}\nbody{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,\"Segoe UI\",Inter,sans-serif}\nheader{display:flex;gap:16px;align-items:center;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--panel)}\n.brand{font:700 12px/1 sans-serif;letter-spacing:.14em;color:var(--accent)}\nh1{font-size:18px;margin:0;flex:1}\ninput{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:260px}\nmain{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding:22px 28px}\n.card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card:hover{border-color:var(--accent)}\n.card h2{font-size:15px;margin:0 0 6px}.card p{margin:0 0 10px;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}\n.bs{display:flex;flex-wrap:wrap;gap:6px}.b{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}\n.b.ov{color:var(--accent);border-color:var(--accent)}.b.ok{color:var(--ok);border-color:var(--ok)}.b.warn{color:va e(key, x.m.nodes[i].id);\n}\nfunction stepNode(dir) {\n  const a = activeMap();\n  if (!a) return vscode.window.showInformationMessage('Waymark: no maps in this workspace.');\n  const ed = vscode.window.activeTextEditor;\n  let from = state.lastIndex;\n  const info = ed && relOf(ed.document.uri);\n  if (info) {\n    const here = M.nodeAt(a.m, info.rel, ed.selection.active.line + 1);\n    if (here >= 0) from = here;\n  }\n  const i = M.step(a.m, from, dir);\n  if (i \u003c 0) return vscode.window.setStatusBarMessage(`Waymark: ${dir > 0 ? 'last' : 'first'} node of the map`, 2500);\n  return gotoIndex(a.key, i);\n}\n\n// ------------------------------------------------------------------ viewer webview (two-way sync)\nfunction postToViewer(key, msg) {\n  if (state.panel && state.panelKey === key) {\n    if (msg.type === 'select') state.lastPosted = msg.id;\n    state.panel.webview.postMessage(msg);\n  }\n}\nfunction viewerHtml(x) {\n  const file = path.join(x.w.root, '.waymark', `${x.m.id}.html`);\n  if (!fs.existsSync(file)) return null;\n  return fs.readFileSync(file, 'utf8');\n}\nasync function openViewer(key, id, { explain = false } = {}) {\n  if (!key) {\n    const pick = await pickMap();\n    if (!pick) return;\n    key = pick;\n  }\n  const x = findMap(key);\n  if (!x) return;\n  const html = viewerHtml(x);\n  if (!html) return vscode.window.showWarningMessage(`Waymark: viewer not found for ${x.m.id}. Run \"waymark render ${x.m.id}\".`);\n  setActive(key);\n  if (!state.panel) {\n    state.panel = vscode.window.createWebviewPanel('waymark.viewer', 'Waymark', { viewColumn: vscode.ViewColumn.Beside, preserveFocus: true }, {\n      enableScripts: true,\n      retainContextWhenHidden: true,\n    });\n    state.panel.onDidDispose(() => {\n      state.panel = null;\n      state.panelKey = null;\n    });\n    state.panel.webview.onDidReceiveMessage((m) => {\n      if (!m || !state.panelKey) return;\n      if (m.type === 'select' && cfg().get('viewer.syncEditor', true)) th} nodes`, detail: x.m.id, key: x.key }));\n  if (!items.length) {\n    vscode.window.showInformationMessage('Waymark: no maps in this workspace yet.');\n    return null;\n  }\n  const pick = await vscode.window.showQuickPick(items, { placeHolder: 'Choose a Waymark map' });\n  return pick ? pick.key : null;\n}\n\n// ------------------------------------------------------------------ agent commands (Claude Code in the terminal)\nfunction runAgent(prompt) {\n  const cmd = cfg().get('agentCommand', 'claude');\n  const t = vscode.window.createTerminal({ name: 'Waymark', cwd: state.workspaces[0]?.root || (vscode.workspace.workspaceFolders || [])[0]?.uri.fsPath });\n  t.show();\n  t.sendText(`${cmd} ${JSON.stringify(prompt)}`);\n}\nfunction mapArg(arg) {\n  if (typeof arg === 'string') return findMap(arg);\n  if (arg && arg.key) return findMap(arg.key);\n  return activeMap();\n}\n\n// ------------------------------------------------------------------ human notes and links between maps\nasync function addNote(key, id) {\n  const x = findMap(key);\n  if (!x) return;\n  const n = x.m.nodes.find((y) => y.id === id);\n  const text = await vscode.window.showInputBox({ prompt: `Team note for [${id}] ${n ? n.title : ''} (not AI-generated, kept across map updates)`, placeHolder: 'Gotcha, decision, link…' });\n  if (!text) return;\n  try {\n    const lib = await waymarkLib();\n    lib.noteMap(x.w.root, x.m.id, id, { text });\n    vscode.window.setStatusBarMessage(`Waymark: note added to [${id}]`, 3000);\n    reload(); // watcher would also catch it; reload now so the viewer updates immediately\n  } catch (e) {\n    vscode.window.showErrorMessage(`Waymark: could not save the note (${e.message})`);\n  }\n}\n\nfunction openMapRef(fromKey, ref) {\n  const from = findMap(fromKey);\n  if (!from || !ref) return;\n  const [id, node] = String(ref).split('#');\n  const target = keyOf(from.w, { id });\n  if (!findMap(target)) return vscode.window.showWarningMessage(`Waymark: map \"${id}\" not found.`);\n  state.panelKey = null; // force loading the other map in the panel\n  openViewer(target, node);\n}\n\n// ------------------------------------------------------------------ self-update from GitHub Releases\nconst RELEASES_API = 'https://api.github.com/repos/h0w4r/waymark/releases/latest';\nconst DAY = 24 * 60 * 60 * 1000;\n\nasync function checkForUpdates(context, { manual = false } = {}) {\n  if (!manual) {\n    if (!cfg().get('updates.check', true)) return;\n    const last = context.globalState.get('waymark.lastUpdateCheck', 0);\n    if (Date.now() - last \u003c DAY) return;\n  }\n  await context.globalState.update('waymark.lastUpdateCheck', Date.now());\n  const current = context.extension?.packageJSON?.version || '0.0.0';\n  let info = null;\n  try {\n    const res = await fetch(RELEASES_API, { headers: { Accept: 'application/vnd.github+json', 'User-Agent': 'waymark-vscode' } });\n    if (res.ok) info = M.releaseInfo(await res.json());\n  } catch (e) {\n    if (manual) vscode.window.showWarningMessage(`Waymark: could not check for updates (${e.message}).`);\n    return;\n  }\n  if (!info || !M.isNewer(info.version, current)) {\n    if (manual) vscode.window.showInformationMessage(`Waymark ${current} is up to date.`);\n    return;\n  }\n  const choice = await vscode.window.showInformationMessage(\n    `Waymark ${info.version} is available (installed: ${current}).`,\n    'Install',\n    'Release notes',\n    'Later',\n  );\n  if (choice === 'Release notes') return vscode.env.openExternal(vscode.Uri.parse(info.notes));\n  if (choice !== 'Install') return;\n  await vscode.window.withProgress({ location: vscode.ProgressLocation.Notification, title: `Installing Waymark ${info.version}…` }, async () => {\n    const res = await fetch(info.url, { headers: { 'User-Agent': 'waymark-vscode' } });\n    if (!res.ok) throw new Error(`download failed (${res.status})`);\n    const file = path.join(require('os').tmpdir(), info.name);\n    fs.writeFileSync(file, Buffer.from(await res.arrayBuffer()));\n    await vscode.commands.executeCommand('workbench.extensions.installExtension', vscode.Uri.file(file));\n  });\n  const reload = await vscode.window.showInformationMessage(`Waymark ${info.version} installed. Reload the window to use it.`, 'Reload');\n  if (reload === 'Reload') vscode.commands.executeCommand('workbench.action.reloadWindow');\n}\n\n// ------------------------------------------------------------------ lifecycle\nfunction reload() {\n  state.workspaces = (vscode.workspace.workspaceFolders || []).map((f) => M.loadWorkspace(f.uri.fsPath));\n  if (state.activeKey && !findMap(state.activeKey)) state.activeKey = null;\n  vscode.commands.executeCommand('setContext', 'waymark.hasMaps', allMaps().length > 0);\n  tree.refresh();\n  lenses.fire();\n  refreshDecorations();\n  updateStatus();\n  if (state.panel && state.panelKey) {\n    const x = findMap(state.panelKey);\n    const html = x && viewerHtml(x);\n    if (html && html !== state.panel.webview.html) state.panel.webview.html = html;\n  }\n}\n\nfunction activate(context) {\n  lineType = vscode.window.createTextEditorDecorationType({\n    isWholeLine: true,\n    backgroundColor: new vscode.ThemeColor('editor.rangeHighlightBackground'),\n  });\n  status = vscode.window.createStatusBarItem(vscode.StatusBarAlignment.Left, 50);\n  status.command = 'waymark.setActiveMap';\n  context.subscriptions.push(lineType, status);\n\n  context.subscriptions.push(\n    vscode.window.registerTreeDataProvider('waymark.maps', tree),\n    vscode.languages.registerCodeLensProvider({ scheme: 'file' }, lenses),\n    vscode.commands.registerCommand('waymark.refresh', reload),\n    vscode.commands.registerCommand('waymark.revealNode', (key, id) => revealNode(key, id)),\n    vscode.commands.registerCommand('waymark.goto', (key, i) => gotoIndex(key, i)),\n    vscode.commands.registerCommand('waymark.next', () => stepNode(1)),\n    vscode.commands.registerCommand('waymark.prev', () => stepNode(-1)),\n    vscode.commands.registerCommand('waymark.openViewer', (key, id) => openViewer(typeof key === 'string' ? key : key?.key, id)),\n    vscode.commands.registerCommand('waymark.explain', (key, id) => openViewer(key, id, { explain: true })),\n    vscode.commands.registerCommand('waymark.setActiveMap', async (arg) => {\n      const key = arg?.key || (typeof arg === 'string' ? arg : await pickMap());\n      if (key) setActive(key);\n    }),\n    vscode.commands.registerCommand('waymark.explainAtCursor', () => {\n      const ed = vscode.window.activeTextEditor;\n      const info = ed && relOf(ed.document.uri);\n      if (!info) return;\n      const line = ed.selection.active.line + 1;\n      const nodes = info.w.byFile.get(info.rel) || [];\n      if (!nodes.length) return vscode.window.showInformationMessage('Waymark: no map covers this file.');\n      const n = nodes.reduce((a, b) => (Math.abs(b.line - line) \u003c Math.abs(a.line - line) ? b : a));\n      openViewer(info.w.root + '::' + n.mapId, n.id, { explain: true });\n    }),\n    vscode.commands.registerCommand('waymark.createMap', async () => {\n      const topic = await vscode.window.showInputBox({ prompt: 'What should the map explain?', placeHolder: 'e.g. how does checkout payment work?' });\n      if (topic) runAgent(`/waymark ${topic}`);\n    }),\n    vscode.commands.registerCommand('waymark.enrichMap', (arg) => {\n      const x = mapArg(arg);\n      if (x) runAgent(`/waymark enrich ${x.m.id}`);\n    }),\n    vscode.commands.registerCommand('waymark.refreshNarrative', (arg) => {\n      const x = mapArg(arg);\n      if (x) runAgent(`/waymark refresh ${x.m.id}`);\n    }),\n    vscode.commands.registerCommand('waymark.verifyMaps', () => runAgent('/waymark verify')),\n    vscode.commands.registerCommand('waymark.addNote', async (key, id) => {\n      if (key && id) return addNote(key, id);\n      const ed = vscode.window.activeTextEditor;\n      const info = ed && relOf(ed.document.uri);\n      const nodes = info ? info.w.byFile.get(info.rel) || [] : [];\n      if (!nodes.length) return vscode.window.showInformationMessage('Waymark: no map node in this file.');\n      const line = ed.selection.active.line + 1;\n      const n = nodes.reduce((a, b) => (Math.abs(b.line - line) \u003c Math.abs(a.line - line) ? b : a));\n      return addNote(info.w.root + '::' + n.mapId, n.id);\n    }),\n    vscode.commands.registerCommand('waymark.openMapRef', (key, ref) => openMapRef(key, ref)),\n    vscode.commands.registerCommand('waymark.checkMap', (arg) => {\n      const x = mapArg(arg);\n      if (x) runAgent(`/waymark check ${x.m.id}`);\n    }),\n    vscode.commands.registerCommand('waymark.checkForUpdates', () =>\n      checkForUpdates(context, { manual: true }).catch((e) => vscode.window.showErrorMessage(`Waymark update failed: ${e.message}`)),\n    ),\n    vscode.window.onDidChangeVisibleTextEditors(refreshDecorations),\n    vscode.window.onDidChangeTextEditorSelection(onSelection),\n    vscode.window.onDidChangeActiveTextEditor((ed) => {\n      if (!ed || !cfg().get('history.enabled', true)) return;\n      const info = relOf(ed.document.uri);\n      if (info && !info.rel.startsWith('.waymark/')) {\n        try {\n          M.recordVisit(info.w.root, info.rel);\n        } catch {\n          /* history is best effort */\n        }\n      }\n    }),\n    vscode.workspace.onDidChangeConfiguration((e) => {\n      if (e.affectsConfiguration('waymark')) {\n        lenses.fire();\n        refreshDecorations();\n      }\n    }),\n    vscode.workspace.onDidChangeWorkspaceFolders(reload),\n  );\n\n  let timer = null;\n  const later = () => {\n    clearTimeout(timer);\n    timer = setTimeout(reload, 300);\n  };\n  const watcher = vscode.workspace.createFileSystemWatcher('**/.waymark/*.{json,html}');\n  watcher.onDidChange(later);\n  watcher.onDidCreate(later);\n  watcher.onDidDelete(later);\n  context.subscriptions.push(watcher);\n\n  reload();\n  // Daily, silent unless an update exists; never blocks activation.\n  const upd = setTimeout(() => checkForUpdates(context).catch(() => {}), 5000);\n  if (upd.unref) upd.unref();\n  // Lightweight introspection for tests / troubleshooting.\n  return { state, reload, allMaps };\n}\n\nfunction deactivate() {\n  for (const t of iconTypes.values()) t.dispose();\n}\n\nmodule.exports = { activate, deactivate };\n","src/verify.js":"import { FileCache, anchorLocation } from './anchor.js';\nimport { headCommit } from './git.js';\nimport { loadMap, persist, writeHtml, narrativeDrift, baselineNarrative } from './store.js';\n\n/**\n * Re-checks every anchor of a stored waymark against the current working tree, and\n * whether the prose still describes the code it was written for (narrative drift).\n * With fix=true, corrected line numbers/snippets/context hashes are written back\n * (narrative baselines are kept, so drifted prose stays flagged until it is rewritten).\n */\nexport function verifyMap(root, id, { fix = false } = {}) {\n  const doc = loadMap(root, id);\n  const cache = new FileCache(root);\n  const changes = [];\n  const changedFiles = new Set();\n  const counts = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0 };\n  let ctxChanged = false;\n\n  const fresh = { ...doc, traces: [] };\n  for (const trace of doc.traces) {\n    const results = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      counts[r.status]++;\n      if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      if (r.ctxHash !== loc.ctxHash) ctxChanged = true;\n      if (r.status !== 'ok' || r.lineNumber !== loc.lineNumber || r.path !== loc.path) {\n        changes.push({\n          id: loc.id,\n          status: r.status,\n          from: `${loc.path}:${loc.lineNumber}`,\n          to: `${r.path}:${r.lineNumber}`,\n          note: r.note,\n        });\n      }\n      return r;\n    });\n    fresh.traces.push({ ...trace, locations: results });\n    if (fix) trace.locations = results;\n  }\n\n  // Maps created before narrative tracking get a baseline instead of a false alarm.\n  baselineNarrative(fresh);\n  const drift = narrativeDrift(fresh);\n\n  const broken = counts.unresolved + counts.missing;\n  const result = {\n    id: doc.id,\n    title: doc.title,\n    mapCommit: doc.meta?.commit?.slice(0, 8) || null,\n    headCommit: headCommit(root)?.slice(0, 8) || null,\n    counts,\n    changedFiles: [...changedFiles],\n    changes,\n    narrative: drift,\n    stale: changes.length > 0 || changedFiles.size > 0,\n    broken,\n    fixed: false,\n  };\n  const needsBaseline = doc.traces.some((t) => !t.narrativeHash || t.locations.some((l) => !l.narrativeHash));\n  if (fix && (changes.length || changedFiles.size || ctxChanged || needsBaseline)) {\n    baselineNarrative(doc);\n    doc.meta = {\n      ...doc.meta,\n      verifiedAt: new Date().toISOString(),\n      commit: headCommit(root),\n      anchors: { ...counts },\n      narrativeDrift: drift.stale ? { nodes: drift.nodes, traces: drift.traces, story: drift.story } : undefined,\n    };\n    persist(root, doc);\n    writeHtml(root, doc);\n    result.fixed = true;\n  }\n  return result;\n}\n",".github/workflows/waymark-pr.yml":"name: waymark-pr\n# Comments on each pull request with the documented flows (Waymark maps) the change touches.\non: pull_request\npermissions:\n  contents: read\n  pull-requests: write\njobs:\n  maps:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v5\n        with:\n          fetch-depth: 0\n      - uses: actions/setup-node@v5\n        with:\n          node-version: 22\n      - run: npm ci\n      - run: node src/cli.js diff \"origin/${{ github.base_ref }}\" --range > waymark-report.md\n      - name: Comment (updates the previous Waymark comment)\n        env:\n          GH_TOKEN: ${{ github.token }}\n          PR: ${{ github.event.pull_request.number }}\n        run: gh pr comment \"$PR\" --body-file waymark-report.md --edit-last 2>/dev/null || gh pr comment \"$PR\" --body-file waymark-report.md\n"},"maps":[{"id":"fact-check-diff-de-impacto-para-prs-y-verificaci-8746b6","title":"Fact-check, diff de impacto para PRs y verificación por cobertura en Waymark","kind":"flow"},{"id":"waymark-create-flow","title":"waymark_create: from tool call to shareable viewer","kind":"flow"},{"id":"visor-html-de-waymark-render-y-sincronizacion-de-64112a","title":"Visor HTML de Waymark: render y sincronización de panel, código y diagrama","kind":"flow"},{"id":"verificacion-de-deriva-y-reanclaje-de-waymark-8c8a2e","title":"Verificación de deriva y reanclaje de Waymark","kind":"flow"}],"states":{"1a":{"check":"unchecked","exec":"unknown"},"1b":{"check":"unchecked","exec":"unknown"},"1c":{"check":"unchecked","exec":"unknown"},"1d":{"check":"unchecked","exec":"unknown"},"1e":{"check":"unchecked","exec":"unknown"},"2a":{"check":"unchecked","exec":"unknown"},"2b":{"check":"unchecked","exec":"unknown"},"2c":{"check":"unchecked","exec":"unknown"},"2d":{"check":"unchecked","exec":"unknown"},"3a":{"check":"unchecked","exec":"unknown"},"3b":{"check":"unchecked","exec":"unknown"},"3c":{"check":"unchecked","exec":"unknown"},"3d":{"check":"unchecked","exec":"unknown"}},"markdown":"# Waymark: Arquitectura general de Waymark: del agente al visor, el editor y CI\n\nUn agente arranca con `waymark_start` [1b] y envía su mapa a `waymark_create` [1c]; `saveMap` [1d] lo ancla al código [1e] y lo guarda en `.waymark/`. Desde ahí lo consumen el visor HTML [2a, 2b], la extensión de VS Code [2c, 2d] y CI mediante `verify` [3a, 3b] y `diff` sobre PRs [3c, 3d].\n\n_id: `arquitectura-general-de-waymark-del-agente-al-vi-798dd7` · commit 9fce4e38 (main) · updated 2026-10-20_\n\n## The story\n\n## Qué problema resuelve\n\nWaymark guarda mapas narrados de cómo se ejecuta el código: trazas de nodos anclados a líneas exactas, con prosa para un compañero nuevo. El reto es que esos mapas sigan siendo fieles cuando el código cambia, y que lleguen a donde se trabaja: el navegador, el editor y los pull requests.\n\n## El viaje de un mapa\n\nTodo empieza en el agente. La CLI levanta el servidor MCP [1a], el agente pide el procedimiento con `waymark_start` [1b], explora el repo y envía el mapa a `waymark_create` [1c]. El handler delega en `saveMap` [1d], el único punto de escritura: normaliza, ancla cada ubicación con `anchorMap` [1e] (los números de línea del LLM son pistas, el texto de la línea es la verdad) y escribe el JSON en `.waymark/`.\n\nEse mismo `saveMap` dispara `writeHtml` [2a], que empaqueta mapa, archivos citados, CSS y cliente en un HTML autocontenido vía `renderHtml` [2b]. En paralelo, la extensión de VS Code lee los mismos JSON con `loadWorkspace` [2c] y, desde `activate` [2d], los muestra como árbol, CodeLens y resaltado en el editor.\n\nPor último, CI vigila la deriva. `waymark verify` [3a] llama a `verifyMap` [3b] para re-anclar y detectar cambios de código o de narrativa; `waymark diff` [3c] cruza un `git diff` con los nodos y la Action `waymark-pr` [3d] publica el reporte como comentario en cada PR.\n\n## Cómo encajan\n\nEl JSON en `.waymark/` es el contrato entre todas las piezas: el MCP y la CLI lo escriben, el visor y la extensión lo leen, y verify/diff lo comparan con el árbol de trabajo. No hay base de datos ni servidor persistente.\n\n**Takeaways:** cualquier escritura debe pasar por `saveMap` [1d] o `persist`, o el HTML quedará desfasado; si cambias el algoritmo de anclaje [1e], cambian a la vez la creación, verify y diff.\n\n## Maps to create next\n\n- **Extensión de VS Code**: `loadWorkspace` [2c], `activate` [2d], CodeLens y navegación entre nodos.\n- **CLI y orquestación de agentes**: `runAgent`, `generate`/`generateParallel` y el flujo paralelo `waymark_plan → add_trace → finalize`.\n- **Instalación y plugin**: `src/install.js`, `plugin/` y `.claude-plugin/`.\n\n## Trace 1: Creación: del agente al almacén\n\nCómo un agente, vía MCP, convierte una exploración en un mapa anclado y guardado.\n\n### Motivation\n\nLos agentes escriben mapas, pero sus números de línea no son fiables. Hace falta una única puerta de entrada que valide, ancle y persista.\n\n### Details\n\nLa CLI arranca el servidor MCP [1a]. El agente llama a `waymark_start` [1b] para recibir el procedimiento y luego a `waymark_create` [1c], que delega en `saveMap` [1d]. Allí `anchorMap` [1e] busca cada ubicación por su texto exacto y genera el reporte de anclas que vuelve al agente.\n\n### Del agente a .waymark/\n\n```text\n└── [1a] Arranque del MCP  src/cli.js:295\n    ├── (primera llamada) [1b] waymark_start  src/mcp.js:55\n    ├── El agente explora el repo (solo lectura)\n    └── (mapa JSON) [1c] waymark_create  src/mcp.js:126\n        └── [1d] saveMap  src/store.js:35\n            ├── (ubicaciones) [1e] anchorMap  src/anchor.js:218\n            └── Escribe .waymark/\u003cid>.json\n```\n\n- **[1a] Arranque del MCP** — `src/cli.js:295`\n  El subcomando `mcp` de la CLI levanta el servidor stdio.\n  Claude Code o Codex ejecutan `waymark mcp` según `.mcp.json`. La importación es perezosa para que el resto de comandos no carguen el SDK de MCP. Desde aquí todas las tools quedan disponibles para el agente.\n  ```\n     292    if (!cmd || opt.help) return out(HELP);\n     293    switch (cmd) {\n     294      case 'mcp': {\n  >  295        const { startStdio } = await import('./mcp.js');\n     296        return startStdio();\n     297      }\n     298      case 'generate':\n     299        return generate(rest.join(' '));\n     300      case 'enrich':\n     301        return enrich(rest[0]);\n     302      case 'refresh':\n     303        return refresh(rest[0]);\n     304      case 'lint': {\n     305        const r = root();\n     306        const ids = rest[0] ? [loadMap(r, rest[0]).id] : listMaps(r).map((m) => m.id);\n     307        const mapIds = new Set(listMaps(r).map((m) => m.id));\n     308        const results = ids.map((i) => lintMap(loadMap(r, i), { mapIds }));\n     309
