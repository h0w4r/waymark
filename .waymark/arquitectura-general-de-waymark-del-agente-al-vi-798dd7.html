<script id="waymark-data" type="application/json">{"doc":{"schemaVersion":1,"id":"arquitectura-general-de-waymark-del-agente-al-vi-798dd7","title":"Arquitectura general de Waymark: del agente al visor, el editor y CI","description":"Un agente arranca con `waymark_start` [1b] y envía su mapa a `waymark_create` [1c]; `saveMap` [1d] lo ancla al código [1e] y lo guarda en `.waymark/`. Desde ahí lo consumen el visor HTML [2a, 2b], la extensión de VS Code [2c, 2d] y CI mediante `verify` [3a, 3b] y `diff` sobre PRs [3c, 3d].","story":"## Qué problema resuelve\n\nWaymark guarda mapas narrados de cómo se ejecuta el código: trazas de nodos anclados a líneas exactas, con prosa para un compañero nuevo. El reto es que esos mapas sigan siendo fieles cuando el código cambia, y que lleguen a donde se trabaja: el navegador, el editor y los pull requests.\n\n## El viaje de un mapa\n\nTodo empieza en el agente. La CLI levanta el servidor MCP [1a], el agente pide el procedimiento con `waymark_start` [1b], explora el repo y envía el mapa a `waymark_create` [1c]. El handler delega en `saveMap` [1d], el único punto de escritura: normaliza, ancla cada ubicación con `anchorMap` [1e] (los números de línea del LLM son pistas, el texto de la línea es la verdad) y escribe el JSON en `.waymark/`.\n\nEse mismo `saveMap` dispara `writeHtml` [2a], que empaqueta mapa, archivos citados, CSS y cliente en un HTML autocontenido vía `renderHtml` [2b]. En paralelo, la extensión de VS Code lee los mismos JSON con `loadWorkspace` [2c] y, desde `activate` [2d], los muestra como árbol, CodeLens y resaltado en el editor.\n\nPor último, CI vigila la deriva. `waymark verify` [3a] llama a `verifyMap` [3b] para re-anclar y detectar cambios de código o de narrativa; `waymark diff` [3c] cruza un `git diff` con los nodos y la Action `waymark-pr` [3d] publica el reporte como comentario en cada PR.\n\n## Cómo encajan\n\nEl JSON en `.waymark/` es el contrato entre todas las piezas: el MCP y la CLI lo escriben, el visor y la extensión lo leen, y verify/diff lo comparan con el árbol de trabajo. No hay base de datos ni servidor persistente.\n\n**Takeaways:** cualquier escritura debe pasar por `saveMap` [1d] o `persist`, o el HTML quedará desfasado; si cambias el algoritmo de anclaje [1e], cambian a la vez la creación, verify y diff.\n\n## Maps to create next\n\n- **Extensión de VS Code**: `loadWorkspace` [2c], `activate` [2d], CodeLens y navegación entre nodos.\n- **CLI y orquestación de agentes**: `runAgent`, `generate`/`generateParallel` y el flujo paralelo `waymark_plan → add_trace → finalize`.\n- **Instalación y plugin**: `src/install.js`, `plugin/` y `.claude-plugin/`.","language":"es","traces":[{"id":"1","title":"Creación: del agente al almacén","description":"Cómo un agente, vía MCP, convierte una exploración en un mapa anclado y guardado.","diagramTitle":"Del agente a .waymark/","motivation":"Los agentes escriben mapas, pero sus números de línea no son fiables. Hace falta una única puerta de entrada que valide, ancle y persista.","details":"La CLI arranca el servidor MCP [1a]. El agente llama a `waymark_start` [1b] para recibir el procedimiento y luego a `waymark_create` [1c], que delega en `saveMap` [1d]. Allí `anchorMap` [1e] busca cada ubicación por su texto exacto y genera el reporte de anclas que vuelve al agente.","locations":[{"id":"1a","title":"Arranque del MCP","description":"El subcomando `mcp` de la CLI levanta el servidor stdio.","explanation":"Claude Code o Codex ejecutan `waymark mcp` según `.mcp.json`. La importación es perezosa para que el resto de comandos no carguen el SDK de MCP. Desde aquí todas las tools quedan disponibles para el agente.","path":"src/cli.js","lineNumber":295,"lineContent":"const { startStdio } = await import('./mcp.js');","status":"ok","fileHash":"80692f4e5655","ctxHash":"b05f48fbab4b","snippet":{"startLine":292,"code":"  if (!cmd || opt.help) return out(HELP);\n  switch (cmd) {\n    case 'mcp': {\n      const { startStdio } = await import('./mcp.js');\n      return startStdio();\n    }\n    case 'generate':\n      return generate(rest.join(' '));\n    case 'enrich':\n      return enrich(rest[0]);\n    case 'refresh':\n      return refresh(rest[0]);\n    case 'lint': {\n      const r = root();\n      const ids = rest[0] ? [loadMap(r, rest[0]).id] : listMaps(r).map((m) => m.id);\n      const mapIds = new Set(listMaps(r).map((m) => m.id));\n      const results = ids.map((i) => lintMap(loadMap(r, i), { mapIds }));\n      if (opt.json) return out(results);"},"narrativeHash":"b05f48fbab4b"},{"id":"1b","title":"waymark_start","description":"Entrega el procedimiento, pistas del repo y mapas existentes.","explanation":"Es la primera llamada del agente. Según el modo (fast, smart, overview, parallel) devuelve una guía distinta, más puntos de entrada y archivos recientes. Así el agente reutiliza mapas en lugar de duplicarlos.","path":"src/mcp.js","lineNumber":55,"lineContent":"'waymark_start',","status":"ok","fileHash":"2b0b28761299","ctxHash":"fc29f61bf60c","snippet":{"startLine":52,"code":"  );\n\n  server.registerTool(\n    'waymark_start',\n    {\n      title: 'Start a waymark',\n      description:\n        'Begin generating a waymark map for a topic/question. Returns the Waymark agent procedure (structure + storytelling rules), the input format, repo hints (recent files, entry points) and existing maps. Call this first, then explore the code and submit with waymark_create.',\n      inputSchema: {\n        query: z.string().describe('Topic or question, e.g. \"how does checkout payment work?\"'),\n        mode: z\n          .enum(['fast', 'smart', 'overview', 'parallel'])\n          .optional()\n          .describe('fast: short map quickly; smart (default): thorough map with full storytelling; overview: map of the whole system linking to detailed maps; parallel: plan traces for parallel builders'),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },"},"narrativeHash":"fc29f61bf60c"},{"id":"1c","title":"waymark_create","description":"El handler resuelve la raíz y delega en saveMap.","explanation":"El agente envía el mapa completo y recibe un reporte de anclas, huecos de narrativa y lint. Si algo falla, el campo `next` le dice cómo corregir y reenviar con el mismo id.","path":"src/mcp.js","lineNumber":126,"lineContent":"const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });","mapRef":"waymark-create-flow#1b","status":"ok","fileHash":"2b0b28761299","ctxHash":"5a4b4e7ff99f","snippet":{"startLine":123,"code":"    },\n    safe(async ({ id, root, ...map }) => {\n      const r = rootOf(root);\n      const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });\n      server.sendResourceListChanged();\n      const next = [];\n      if (!report.healthy) {\n        next.push('Some locations could not be verified. Fix them (waymark_find_anchor helps) and call waymark_create again with id=\"' + doc.id + '\".');\n      }\n      if (!narrative.complete) {\n        next.push('Narrative is incomplete (see \"narrative\"). Fill the story, trace motivation/details and per-location explanations with waymark_annotate(id=\"' + doc.id + '\").');\n      }\n      const lint = lintMap(doc, { mapIds: new Set(listMaps(r).map((m) => m.id)) });\n      if (lint.errors) next.push('Lint found ' + lint.errors + ' error(s) (e.g. references to unknown nodes): fix them with waymark_annotate.');\n      if (!next.length) next.push('All anchors verified and narrative complete. Share the HTML file or reference waymark://' + doc.id);\n      return text({\n        id: doc.id,\n        resource: `waymark://${doc.id}`,"},"narrativeHash":"5a4b4e7ff99f"},{"id":"1d","title":"saveMap","description":"Normaliza, ancla, conserva metadatos y escribe JSON y HTML.","explanation":"Es el único punto de escritura de mapas nuevos. Mezcla datos previos si se reescribe un id, sella commit y rama, escribe el JSON y llama a `writeHtml` [2a]. Todo lo que lee el resto del sistema sale de aquí.","path":"src/store.js","lineNumber":35,"lineContent":"export function saveMap(root, input, { id, html = true } = {}) {","mapRef":"waymark-create-flow#1d","status":"ok","fileHash":"3c9966c81adf","ctxHash":"45159e8044ab","snippet":{"startLine":32,"code":"}\n\n/** Validates, anchors against the working tree, persists JSON (+ HTML viewer). */\nexport function saveMap(root, input, { id, html = true } = {}) {\n  const map = normalizeMap(input);\n  const report = anchorMap(root, map);\n  baselineNarrative(map, { force: true });\n  const existing = id ? loadMap(root, id, { quiet: true }) : null;\n  if (existing) carryOver(existing, map);\n  const now = new Date().toISOString();\n  const doc = {\n    schemaVersion: SCHEMA_VERSION,\n    id: id || `${slugify(map.title)}-${crypto.randomBytes(3).toString('hex')}`,\n    ...map,\n    meta: {\n      createdAt: existing?.meta?.createdAt || now,\n      updatedAt: now,\n      root,"},"narrativeHash":"45159e8044ab"},{"id":"1e","title":"anchorMap","description":"Ancla cada ubicación contra el árbol de trabajo y genera el reporte.","explanation":"Usa una caché de archivos compartida y clasifica cada ubicación como ok, moved, fuzzy, relocated, unresolved o missing. El mismo algoritmo lo reutilizan verify [3b] y diff [3c], por eso es el corazón del sistema.","path":"src/anchor.js","lineNumber":218,"lineContent":"export function anchorMap(root, map) {","mapRef":"waymark-create-flow#2a","status":"ok","fileHash":"bb82554c2c45","ctxHash":"3e16c9c5c719","snippet":{"startLine":215,"code":"}\n\n/** Anchors every location of a normalized map in place; returns a summary report. */\nexport function anchorMap(root, map) {\n  const cache = new FileCache(root);\n  const report = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0, issues: [] };\n  for (const trace of map.traces) {\n    trace.locations = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      report[r.status]++;\n      if (r.status !== 'ok') report.issues.push({ id: r.id, status: r.status, path: r.path, note: r.note });\n      return r;\n    });\n  }\n  report.total = map.traces.reduce((n, t) => n + t.locations.length, 0);\n  report.healthy = report.unresolved === 0 && report.missing === 0;\n  return report;\n}"},"narrativeHash":"3e16c9c5c719"}],"tree":[{"ref":"1a","children":[{"ref":"1b","via":"primera llamada"},{"label":"El agente explora el repo (solo lectura)"},{"ref":"1c","via":"mapa JSON","children":[{"ref":"1d","children":[{"ref":"1e","via":"ubicaciones"},{"label":"Escribe .waymark/\u003cid>.json"}]}]}]}],"narrativeHash":"26395bd0e9fc"},{"id":"2","title":"Consumo: visor HTML y editor","description":"Cómo humanos leen el mapa en el navegador y dentro de VS Code.","diagramTitle":"Del JSON a las superficies de lectura","motivation":"Un mapa solo sirve si se lee donde se trabaja. El HTML se comparte sin servidor; la extensión lleva los nodos al propio código.","details":"Tras guardar, `writeHtml` [2a] llama a `renderHtml` [2b], que incrusta el mapa, los archivos citados y el cliente en un único HTML. La extensión de VS Code, en cambio, lee directamente los JSON con `loadWorkspace` [2c] y registra árbol, CodeLens y comandos en `activate` [2d].","locations":[{"id":"2a","title":"writeHtml","description":"Escribe el HTML del mapa y regenera el índice.","explanation":"Recoge una instantánea de los archivos referenciados y la lista de otros mapas para los enlaces `mapRef`. También regenera `.waymark/index.html`, la portada de todos los mapas.","path":"src/store.js","lineNumber":62,"lineContent":"export function writeHtml(root, doc) {","mapRef":"visor-html-de-waymark-render-y-sincronizacion-de-64112a#1a","status":"ok","fileHash":"3c9966c81adf","ctxHash":"0c82983102a5","snippet":{"startLine":59,"code":"  return { doc, report, narrative: narrativeGaps(doc), jsonPath: filePath(root, doc.id), htmlPath };\n}\n\nexport function writeHtml(root, doc) {\n  const p = filePath(root, doc.id, 'html');\n  fs.writeFileSync(p, renderHtml(doc, { files: collectFiles(root, doc), maps: mapIndex(root, doc.id) }));\n  writeIndex(root);\n  return p;\n}\n\n/** Light index of the other maps (for mapRef links between maps). */\nfunction mapIndex(root, selfId) {\n  return listMaps(root)\n    .filter((m) => m.id !== selfId)\n    .map((m) => ({ id: m.id, title: m.title, kind: m.kind }));\n}\n\n/** .waymark/index.html: every map with its health, linking to each viewer. */"},"narrativeHash":"0c82983102a5"},{"id":"2b","title":"renderHtml","description":"Genera el visor autocontenido con datos, CSS y cliente.","explanation":"Produce un HTML que funciona offline: panel del mapa, vista de código y diagrama sincronizados en el navegador. Como todo va embebido, el archivo se puede adjuntar o publicar tal cual.","path":"src/render/html.js","lineNumber":25,"lineContent":"export function renderHtml(doc, { files = {}, maps = [] } = {}) {","mapRef":"visor-html-de-waymark-render-y-sincronizacion-de-64112a#1e","status":"ok","fileHash":"8417b34b8047","ctxHash":"0922e822543f","snippet":{"startLine":22,"code":" * explanations; code view with embedded files; interactive SVG diagram.\n * `files` is a snapshot { path: content } of the referenced files.\n */\nexport function renderHtml(doc, { files = {}, maps = [] } = {}) {\n  const data = {\n    doc,\n    files,\n    maps,\n    // Precomputed per-node state (fact-check verdict validity needs hashes the browser can't do sync).\n    states: Object.fromEntries(\n      doc.traces.flatMap((t) => t.locations.map((l) => [l.id, { check: checkState(l), exec: execState(l) }])),\n    ),\n    markdown: renderMarkdown(doc, { detail: 'full' }),\n    // Smaller context blocks for \"copy trace / node as context\".\n    traceMd: Object.fromEntries(doc.traces.map((t) => [t.id, renderMarkdown(doc, { trace: t.id })])),\n    nodeMd: Object.fromEntries(doc.traces.flatMap((t) => t.locations.map((l) => [l.id, renderMarkdown(doc, { node: l.id })]))),\n    mermaid: renderMermaid({ ...doc, diagram: undefined }),\n  };"},"narrativeHash":"0922e822543f"},{"id":"2c","title":"loadWorkspace","description":"La extensión carga todos los mapas y los indexa por archivo.","explanation":"Lee cada JSON de `.waymark/` y construye un índice archivo → nodos. Así puede decorar líneas y mostrar CodeLens sin pasar por el MCP ni por la CLI.","path":"vscode/lib/model.js","lineNumber":10,"lineContent":"function loadWorkspace(root) {","status":"ok","fileHash":"78baee532c18","ctxHash":"1237b07c146e","snippet":{"startLine":7,"code":"const PALETTE = ['#5b8cff', '#e8803a', '#3fae6a', '#c04fd0', '#d4a72c', '#2fb3c4', '#e0566b', '#8a7dff', '#7fb800', '#ff6fa8'];\n\n/** Loads every map in \u003croot>/.waymark and indexes its nodes by file. */\nfunction loadWorkspace(root) {\n  const dir = path.join(root, '.waymark');\n  const maps = [];\n  let names = [];\n  try {\n    names = fs.readdirSync(dir).filter((f) => f.endsWith('.json'));\n  } catch {\n    return { root, maps, byFile: new Map() };\n  }\n  for (const f of names) {\n    try {\n      const doc = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));\n      if (!doc || !Array.isArray(doc.traces)) continue;\n      maps.push(normalize(doc));\n    } catch {"},"narrativeHash":"1237b07c146e"},{"id":"2d","title":"activate","description":"Registra árbol de mapas, CodeLens, decoraciones y comandos.","explanation":"Punto de entrada de la extensión. Varios comandos (crear, enriquecer, verificar) no hacen el trabajo ellos mismos: lanzan al agente con `/waymark ...`, que vuelve a pasar por [1c].","path":"vscode/extension.js","lineNumber":430,"lineContent":"function activate(context) {","status":"ok","fileHash":"ce9fd11a40cd","ctxHash":"c4bad1cda8aa","snippet":{"startLine":427,"code":"  }\n}\n\nfunction activate(context) {\n  lineType = vscode.window.createTextEditorDecorationType({\n    isWholeLine: true,\n    backgroundColor: new vscode.ThemeColor('editor.rangeHighlightBackground'),\n  });\n  status  verifyMap(root, id, { fix = false } = {}) {\n  const doc = loadMap(root, id);\n  const cache = new FileCache(root);\n  const changes = [];\n  const changedFiles = new Set();\n  const counts = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0 };\n  let ctxChanged = false;\n\n  const fresh = { ...doc, traces: [] };\n  for (const trace of doc.traces) {\n    const results = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      counts[r.status]++;\n      if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      if (r.ctxHash !== loc.ctxHash) ctxChanged = true;"},"narrativeHash":"471a1a97a020"},{"id":"3c","title":"CLI diff","description":"Cruza un git diff con los nodos y renderiza el reporte.","explanation":"Llama a `diffMaps` y devuelve markdown o JSON. `--fail-on` permite que CI falle si se tocan nodos, se rompen anclas o hay deriva.","path":"src/cli.js","lineNumber":349,"lineContent":"const rep = diffMaps(root(), rest[0] || 'HEAD', { range: !!opt.range });","mapRef":"fact-check-diff-de-impacto-para-prs-y-verificaci-8746b6#3a","status":"ok","fileHash":"80692f4e5655","ctxHash":"7c7e0f122c92","snippet":{"startLine":346,"code":"      return;\n    }\n    case 'diff': {\n      const rep = diffMaps(root(), rest[0] || 'HEAD', { range: !!opt.range });\n      out(opt.format === 'json' ? rep : renderDiff(rep));\n      const f = opt['fail-on'];\n      if (\n        (f === 'touched' && rep.maps.some((m) => m.touched.length)) ||\n        (f === 'broken' && rep.maps.some((m) => m.broken.length)) ||\n        (f === 'drift' && rep.maps.some((m) => m.drift.stale || m.broken.length))\n      ) process.exitCode = 1;\n      return;\n    }\n    case 'exec': {\n      const r = root();\n      const sep = process.argv.indexOf('--');\n      let coverage;\n      let source;"},"narrativeHash":"7c7e0f122c92"},{"id":"3d","title":"Action waymark-pr","description":"Ejecuta diff contra la rama base en cada pull request.","explanation":"La Action instala dependencias, genera el reporte contra `origin/\u003cbase>` y lo publica con `gh pr comment`, editando el comentario anterior para no llenar el PR de ruido.","path":".github/workflows/waymark-pr.yml","lineNumber":18,"lineContent":"- run: node src/cli.js diff \"origin/${{ github.base_ref }}\" --range > waymark-report.md","mapRef":"fact-check-diff-de-impacto-para-prs-y-verificaci-8746b6","status":"ok","fileHash":"1d16869d0389","ctxHash":"0bd8bc4f2aea","snippet":{"startLine":15,"code":"        with:\n          node-version: 22\n      - run: npm ci\n      - run: node src/cli.js diff \"origin/${{ github.base_ref }}\" --range > waymark-report.md\n      - name: Comment (updates the previous Waymark comment)\n        env:\n          GH_TOKEN: ${{ github.token }}\n          PR: ${{ github.event.pull_request.number }}\n        run: gh pr comment \"$PR\" --body-file waymark-report.md --edit-last 2>/dev/null || gh pr comment \"$PR\" --body-file waymark-report.md\n"},"narrativeHash":"0bd8bc4f2aea"}],"tree":[{"ref":"3a","children":[{"ref":"3b","via":"por cada mapa"}]},{"ref":"3d","children":[{"ref":"3c","via":"base del PR","children":[{"label":"Comentario markdown en el PR"}]}]}],"narrativeHash":"a43fcd580847"}],"links":[{"from":"1d","to":"2a","label":"genera el visor"},{"from":"1e","to":"3b","label":"mismo algoritmo de anclaje"},{"from":"2d","to":"1c","label":"lanza al agente"}],"tags":["overview","architecture"],"kind":"overview","narrativeHash":"8c77f5d47802","meta":{"createdAt":"2026-10-20T03:59:40.706Z","updatedAt":"2026-10-20T04:00:59.279Z","root":"C:\\DATOS\\codemaps-custom","commit":"9fce4e38f8797d3e72d7948c3f5e3646a2783d12","branch":"main","remote":"https://github.com/h0w4r/waymark","anchors":{"ok":13,"moved":0,"fuzzy":0,"relocated":0,"unresolved":0,"missing":0},"verifiedAt":"2026-10-20T04:02:57.560Z"}},"files":{"src/cli.js":"#!/usr/bin/env node\nimport fs from 'node:fs';\nimport os from 'node:os';\nimport path from 'node:path';\nimport { spawn } from 'node:child_process';\nimport { parseArgs } from 'node:util';\nimport { fileURLToPath } from 'node:url';\nimport { resolveRoot } from './git.js';\nimport { saveMap, loadMap, listMaps, writeHtml, deleteMap, mapDir, annotateMap, narrativeGaps, noteMap, checkSummary, writeIndex } from './store.js';\nimport { resolveCommand } from './bin.js';\nimport { verifyMap } from './verify.js';\nimport { suggestTopics } from './suggest.js';\nimport { waymarkGuide, enrichGuide, refreshGuide } from './guide.js';\nimport { checkGuide, planGuide, traceGuide, finalizeGuide, overviewGuide } from './procedures.js';\nimport { listDrafts, loadPlan, draftStatus } from './parallel.js';\nimport { diffMaps, renderDiff } from './diff.js';\nimport { applyCoverage, parseLcov, runWithV8Coverage } from './coverage.js';\nimport { lintMap } from './lint.js';\nimport { mapsForFile, renderFileContext } from './context.js';\nimport { renderMarkdown } from './render/markdown.js';\nimport { renderMermaid } from './render/mermaid.js';\nimport { openFile } from './open.js';\nimport { install } from './install.js';\n\nconst HERE = path.dirname(fileURLToPath(import.meta.url));\n\nconst HELP = `waymark — hierarchical, line-anchored maps of how code executes\n\nUsage: waymark \u003ccommand> [options]\n\n  generate \"\u003ctopic>\"     Build a map headlessly with an agent CLI\n                         [--engine claude|codex] (default: claude if installed, else codex)\n                         [--mode fast|smart] [--model \u003cm>] [--open] [--max-turns \u003cn> (claude)] [--approval \u003cmode> (codex)]\n                         [--parallel [--jobs 4] [--coordinator-model sonnet]]  plan → one agent per trace at once\n                         → finalize (a faster model for plan/finalize cuts the fixed overhead)\n                         [--overview]  map of the whole system whose nodes link to detailed maps\n  check \u003cid>             Fact-check every claim against the code (separate agent), record verdicts\n  note \u003cid> \u003cnode> \"\u003ctext>\"   Add a human note to a node [--author \u003cname>] [--remove \u003cindex>]\n  notes \u003cid>             List the human notes of a map\n  diff [base]            Nodes touched, anchors broken and prose outdated by a change set\n                         (default: uncommitted vs HEAD) [--range: base...HEAD] [--format markdown|json]\n                         [--fail-on touched|broken|drift]\n  exec [id] (--lcov \u003cfile> | -- \u003ctest command>)\n                         Mark nodes executed by the tests (LCOV from any language, or V8 for Node)\n  index                  Rebuild .waymark/index.html (list of all maps)\n  enrich \u003cid>            Add storytelling (story, Motivation/Details, per-node explanations) to an\n                         existing map with an agent CLI [--engine claude|codex] [--model \u003cm>] [--open]\n  annotate \u003cid> \u003cpatch.json>  Apply prose fields (story, traces[].motivation|details, locations[].explanation)\n  create \u003cfile.json>     Validate, anchor and store a map written as JSON [--id \u003cid>] [--open]\n  list                   List maps in the repo [--json]\n  show \u003cid>              Print a map [--format markdown|compact|json|mermaid]\n  verify [id]            Check anchors and narrative drift against current code [--fix] [--strict]\n                         exit 1 if anchors are broken (--strict: also if stale; --strict-narrative:\n                         also if prose was written for code that has since changed)\n  refresh \u003cid>           Rewrite only the prose whose code changed (agent CLI) [--engine] [--model] [--open]\n  lint [id]              Quality checks: unknown [refs], missing narrative, uncited nodes… [--strict] [--json]\n  for-file \u003cpath> [line] Maps/traces/nodes covering a file [--json]\n  hook \u003ckind>            Claude Code hook entry point (pre-edit | post-edit | post-read), reads stdin JSON\n  update                 Update this checkout: git pull --ff-only, npm ci if the lockfile changed, then\n                         re-install what you ask for [--claude-global] [--vscode] [--target \u003crepo>] [--no-pull]\n  render \u003cid>            Regenerate the HTML viewer [--open]\n  delete \u003cid>            Delete a map\n  suggest                Suggest topics from recent work [--json]\n  guide [\"\u003ctopic>\"]      Print the Waymark agent procedure (for any harness)\n  install                Wire into a repo for Claude Code + Codex (CLI, IDE, desktop) + AGENTS.md\n                         [--target \u003cdir>] [--no-claude] [--no-codex] [--no-agents-md] [--no-hooks]\n                         [--claude-global] also register for every project: claude mcp add -s user + ~/.claude/skills|agents\n                         [--codex-global]  also register in ~/.codex/config.toml + ~/.agents/skills\n                         [--global]        both of the above\n                         [--global-bin]    use the waymark-mcp bin instead of an absolute path\n                         [--vscode]        package and install the VS Code extension (vscode/)\n                         [--pr-action]     add .github/workflows/waymark-pr.yml (PR comment with affected flows)\n  mcp                    Run the MCP server on stdio\n\nGlobal: --root \u003cdir>  repository root (default: git toplevel of cwd)\n`;\n\nconst { values: opt, positionals } = parseArgs({\n  allowPositionals: true,\n  options: {\n    root: { type: 'string' },\n    id: { type: 'string' },\n    format: { type: 'string' },\n    model: { type: 'string' },\n    'max-turns': { type: 'string' },\n    parallel: { type: 'boolean' },\n    jobs: { type: 'string' },\n    'coordinator-model': { type: 'string' },\n    overview: { type: 'boolean' },\n    range: { type: 'boolean' },\n    'fail-on': { type: 'string' },\n    lcov: { type: 'string' },\n    author: { type: 'string' },\n    remove: { type: 'string' },\n    engine: { type: 'string' },\n    mode: { type: 'string' },\n    approval: { type: 'string' },\n    'no-codex': { type: 'boolean' },\n    'codex-global': { type: 'boolean' },\n    'claude-global': { type: 'boolean' },\n    global: { type: 'boolean' },\n    target: { type: 'string' },\n    open: { type: 'boolean' },\n    fix: { type: 'boolean' },\n    strict: { type: 'boolean' },\n    'strict-narrative': { type: 'boolean' },\n    json: { type: 'boolean' },\n    'no-claude': { type: 'boolean' },\n    'no-agents-md': { type: 'boolean' },\n    'no-hooks': { type: 'boolean' },\n    'global-bin': { type: 'boolean' },\n    vscode: { type: 'boolean' },\n    'pr-action': { type: 'boolean' },\n    'no-pull': { type: 'boolean' },\n    help: { type: 'boolean', short: 'h' },\n  },\n});\n\nconst [cmd, ...rest] = positionals;\nconst root = () => resolveRoot(opt.root);\nconst out = (v) => console.log(typeof v === 'string' ? v : JSON.stringify(v, null, 2));\n\nfunction printReport(res) {\n  const a = res.report;\n  out(`✔ ${res.doc.id}  (${a.total} locations: ${a.ok} ok, ${a.moved + a.relocated} re-anchored, ${a.fuzzy} approx, ${a.unresolved + a.missing} unverified)`);\n  for (const i of a.issues) out(`  ${i.status.padEnd(10)} [${i.id}] ${i.path}  ${i.note || ''}`);\n  out(`  json: ${res.jsonPath}\\n  html: ${res.htmlPath}`);\n}\n\nconst SELF = fileURLToPath(import.meta.url);\nconst BUNDLED = !/[\\\\/]cli\\.js$/.test(SELF);\nconst MCP_ARGS = BUNDLED ? [SELF, 'mcp'] : [path.join(HERE, 'mcp.js')];\nconst MCP_ENTRY = MCP_ARGS[0];\nconst fwd = (p) => p.replace(/\\\\/g, '/');\n\n/** Claude Code headless: only read tools + waymark MCP are allowed. */\nfunction claudeInvocation(r, prompt, model = opt.model) {\n  const cfgPath = path.join(os.tmpdir(), `waymark-mcp-${process.pid}-${Math.random().toString(36).slice(2)}.json`);\n  fs.writeFileSync(\n    cfgPath,\n    JSON.stringify({ mcpServers: { waymark: { command: process.execPath, args: MCP_ARGS, env: { WAYMARK_ROOT: r } } } }),\n  );\n  const args = ['-p', prompt, '--mcp-config', cfgPath, '--strict-mcp-config', '--allowedTools', 'Read,Grep,Glob,mcp__waymark', '--permission-mode', 'dontAsk'];\n  if (model) args.push('--model', model);\n  if (opt['max-turns']) args.push('--max-turns', opt['max-turns']);\n  return { bin: resolveCommand('claude'), args, stdin: null, cleanup: () => fs.rmSync(cfgPath, { force: true }) };\n}\n\n/** Codex headless (codex exec): read-only sandbox; the MCP server (outside the sandbox) does the writing. */\nfunction codexInvocation(r, prompt, model = opt.model) {\n  const toml = JSON.stringify;\n  const args = [\n    'exec',\n    '--sandbox', 'read-only',\n    '--skip-git-repo-check',\n    '--color', 'never',\n    '-C', r,\n    '-c', `mcp_servers.waymark.command=${toml(fwd(process.execPath))}`,\n    '-c', `mcp_servers.waymark.args=[${MCP_ARGS.map((a) => toml(fwd(a))).join(',')}]`,\n    '-c', `mcp_servers.waymark.env={WAYMARK_ROOT=${toml(fwd(r))}}`,\n    '-c', 'mcp_servers.waymark.startup_timeout_sec=20',\n    '-c', 'mcp_servers.waymark.tool_timeout_sec=120',\n    '-c', `mcp_servers.waymark.default_tools_approval_mode=${toml(opt['approval'] || 'approve')}`,\n  ];\n  if (model) args.push('-m', model);\n  args.push('-'); // prompt from stdin: avoids command-line length/quoting limits\n  return { bin: resolveCommand('codex'), args, stdin: prompt, cleanup: () => {} };\n}\n\nfunction pickEngine() {\n  const e = opt.engine || 'auto';\n  if (e === 'claude' || e === 'codex') return e;\n  if (e !== 'auto') throw new Error(`Unknown engine \"${e}\" (use claude | codex)`);\n  return resolveCommand('claude') ? 'claude' : 'codex';\n}\n\n/** Runs Claude Code or Codex headlessly with only read tools + the waymark MCP server. */\nasync function runAgent(r, task, { log = null, label = '', model = opt.model } = {}) {\n  const engine = pickEngine();\n  const tools = engine === 'codex' ? 'read-only shell commands (rg, sed -n, git grep, ls)' : 'Read/Grep/Glob';\n  const prompt =\n    task +\n    `\\n\\nRepository root: ${r}\\nWork autonomously: do not ask questions. Explore with ${tools} only. ` +\n    `Always pass root=\"${fwd(r)}\" to waymark_* tools. When done, answer with the map id and a short summary.`;\n  const inv = engine === 'codex' ? codexInvocation(r, prompt, model) : claudeInvocation(r, prompt, model);\n  if (!inv.bin) throw new Error(`\"${engine}\" CLI not found on PATH`);\n  out(`waymark: running ${engine}${label ? ' — ' + label : ''}…`);\n  const fd = log ? fs.openSync(log, 'w') : null;\n  const code = await new Promise((res, rej) => {\n    const p = spawn(inv.bin.command, [...inv.bin.args, ...inv.args], {\n      cwd: r,\n      stdio: [inv.stdin ? 'pipe' : 'ignore', fd ?? 'inherit', fd ?? 'inherit'],\n      shell: !!inv.bin.shell,\n    });\n    p.on('error', (e) => rej(new Error(`Could not run ${engine}: ${e.message}`)));\n    p.on('close', res);\n    if (inv.stdin) p.stdin.end(inv.stdin);\n  }).finally(() => {\n    inv.cleanup();\n    if (fd != null) fs.closeSync(fd);\n  });\n  return code ?? 1;\n}\n\nasync function generate(topic) {\n  if (!topic) throw new Error('Usage: waymark generate \"\u003ctopic>\" [--engine claude|codex] [--mode fast|smart]');\n  const r = root();\n  const before = new Set(listMaps(r).map((m) => m.id));\n  const mode = opt.mode === 'fast' ? 'fast' : 'smart';\n  const t0 = Date.now();\n  const code = opt.parallel\n    ? await generateParallel(r, topic, mode)\n    : await runAgent(r, opt.overview ? overviewGuide(topic) + '\\n\\n' + waymarkGuide(topic, { mode: 'fast' }) : waymarkGuide(topic, { mode }));\n  out(`waymark: finished in ${Math.round((Date.now() - t0) / 1000)}s`);\n  const created = listMaps(r).filter((m) => !before.has(m.id));\n  if (created[0]) {\n    const html = path.join(mapDir(r), `${created[0].id}.html`);\n    const gaps = narrativeGaps(loadMap(r, created[0].id));\n    out(`\\nwaymark: ${created[0].id}\\nhtml: ${html}`);\n    if (!gaps.complete) out(`narrative incomplete — run: waymark enrich ${created[0].id}`);\n    if (opt.open) openFile(html);\n  } else if (code === 0) {\n    out('\\n(no new map was stored; the agent may have updated an existing one)');\n  }\n  process.exitCode = code;\n}\n\n/** plan (1 agent) → one builder agent per trace, concurrently → finalize (1 agent). */\nasync function generateParallel(r, topic, mode) {\n  const before = new Set(listDrafts(r).map((d) => d.draft));\n  let code = await runAgent(r, planGuide(topic, { mode, kind: opt.overview ? 'overview' : 'flow' }), { label: 'planning', model: opt['coordinator-model'] || opt.model });\n  const draft = listDrafts(r).find((d) => !before.has(d.draft));\n  if (!draft) throw new Error('The planner did not register a plan (waymark_plan).');\n  const plan = loadPlan(r, draft.draft);\n  const jobs = Math.max(1, Number(opt.jobs) || 4);\n  const logDir = path.join(mapDir(r), '.drafts', draft.draft);\n  out(`waymark: plan ${draft.draft} with ${plan.traces.length} traces → ${Math.min(jobs, plan.traces.length)} builders in parallel (logs in ${logDir})`);\n  const queue = [...plan.traces];\n  const worker = async () => {\n    for (let t = queue.shift(); t; t = queue.shift()) {\n      const c = await runAgent(r, traceGuide(draft.draft, t.n, plan), { log: path.join(logDir, `trace-${t.n}.log`), label: `trace ${t.n}: ${t.title}` });\n      out(`waymark: trace ${t.n} ${c === 0 ? 'done' : 'failed (' + c + ')'}`);\n    }\n  };\n  await Promise.all(Array.from({ length: Math.min(jobs, plan.traces.length) }, worker));\n  const st = draftStatus(r, draft.draft);\n  if (st.missing.length) out(`waymark: traces not built: ${st.missing.join(', ')} (continuing with the rest)`);\n  code = await runAgent(r, finalizeGuide(draft.draft), { label: 'finalizing', model: opt['coordinator-model'] || opt.model });\n  return code;\n}\n\nasync function check(id) {\n  if (!id) throw new Error('Usage: waymark check \u003cid> [--engine claude|codex]');\n  const r = root();\n  const doc = loadMap(r, id);\n  const code = await runAgent(r, checkGuide(doc.id) + '\\n\\nStart by calling waymark_check(id: \"' + doc.id + '\") to get the map with its code snippets.', { label: 'fact-check' });\n  const s = checkSummary(loadMap(r, doc.id));\n  out(`\\nwaymark: ${doc.id} fact-check → ${s.supported} supported, ${s.partial} partial, ${s.unsupported} unsupported, ${s.unchecked + s.stale} unchecked (of ${s.total})`);\n  if (opt.open) openFile(path.join(mapDir(r), `${doc.id}.html`));\n  process.exitCode = code || (s.unsupported ? 1 : 0);\n}\n\nasync function enrich(id) {\n  if (!id) throw new Error('Usage: waymark enrich \u003cid> [--engine claude|codex]');\n  const r = root();\n  const doc = loadMap(r, id);\n  const code = await runAgent(r, enrichGuide(doc.id));\n  const gaps = narrativeGaps(loadMap(r, doc.id));\n  const html = path.join(mapDir(r), `${doc.id}.html`);\n  out(`\\nwaymark: ${doc.id}  narrative ${gaps.complete ? 'complete' : 'still incomplete: ' + JSON.stringify(gaps)}\\nhtml: ${html}`);\n  if (opt.open) openFile(html);\n  process.exitCode = code;\n}\n\nasync function refresh(id) {\n  if (!id) throw new Error('Usage: waymark refresh \u003cid> [--engine claude|codex]');\n  const r = root();\n  const v = verifyMap(r, id, { fix: true });\n  if (!v.narrative.stale && !v.broken) {\n    out(`waymark: ${v.id} narrative is in sync with the code; nothing to refresh.`);\n    return;\n  }\n  const brokenIds = v.changes.filter((c) => c.status === 'unresolved' || c.status === 'missing').map((c) => c.id);\n  const code = await runAgent(r, refreshGuide(v.id, v.narrative, brokenIds));\n  const after = verifyMap(r, v.id);\n  out(`\\nwaymark: ${v.id}  narrative ${after.narrative.stale ? 'still flagged: ' + JSON.stringify(after.narrative) : 'in sync'}`);\n  if (opt.open) openFile(path.join(mapDir(r), `${v.id}.html`));\n  process.exitCode = code;\n}\n\nasync function main() {\n  if (!cmd || opt.help) return out(HELP);\n  switch (cmd) {\n    case 'mcp': {\n      const { startStdio } = await import('./mcp.js');\n      return startStdio();\n    }\n    case 'generate':\n      return generate(rest.join(' '));\n    case 'enrich':\n      return enrich(rest[0]);\n    case 'refresh':\n      return refresh(rest[0]);\n    case 'lint': {\n      const r = root();\n      const ids = rest[0] ? [loadMap(r, rest[0]).id] : listMaps(r).map((m) => m.id);\n      const mapIds = new Set(listMaps(r).map((m) => m.id));\n      const results = ids.map((i) => lintMap(loadMap(r, i), { mapIds }));\n      if (opt.json) return out(results);\n      let bad = false;\n      for (const res of results) {\n        out(`${res.errors ? 'ERRORS ' : res.warnings ? 'WARN   ' : 'OK     '} ${res.id}  (${res.errors} errors, ${res.warnings} warnings)`);\n        for (const i of res.issues) out(`        ${i.level.padEnd(5)} ${i.where}: ${i.message}`);\n        if (res.errors || (opt.strict && res.warnings)) bad = true;\n      }\n      if (bad) process.exitCode = 1;\n      return;\n    }\n    case 'for-file': {\n      if (!rest[0]) throw new Error('Usage: waymark for-file \u003cpath> [line]');\n      const res = mapsForFile(root(), rest[0], { line: rest[1] ? Number(rest[1]) : null });\n      if (opt.json) return out({ path: res.path, maps: res.maps.map(({ doc, ...m }) => m) });\n      return out(renderFileContext(res, { maxChars: 20000 }) || `No waymark map covers ${res.path}.`);\n    }\n    case 'update': {\n      const { selfUpdate } = await import('./update.js');\n      return out(\n        selfUpdate({\n          pull: !opt['no-pull'],\n          claudeGlobal: !!(opt['claude-global'] || opt.global),\n          vscode: !!opt.vscode,\n          target: opt.target ? resolveRoot(opt.target) : null,\n        }),\n      );\n    }\n    case 'check':\n      return check(rest[0]);\n    case 'note': {\n      if (!rest[0] || !rest[1]) throw new Error('Usage: waymark note \u003cid> \u003cnode> \"\u003ctext>\" [--author \u003cname>] [--remove \u003cindex>]');\n      const res = noteMap(root(), rest[0], rest[1], { text: rest.slice(2).join(' '), author: opt.author, remove: opt.remove != null ? Number(opt.remove) : null });\n      return out(`✔ ${res.id} [${res.node}]: ${res.notes.length} note(s)`);\n    }\n    case 'notes': {\n      const doc = loadMap(root(), rest[0]);\n      for (const t of doc.traces) for (const l of t.locations) (l.notes || []).forEach((n, i) => out(`[${l.id}] #${i} ${n.author} ${String(n.at).slice(0, 10)}: ${n.text}`));\n      return;\n    }\n    case 'diff': {\n      const rep = diffMaps(root(), rest[0] || 'HEAD', { range: !!opt.range });\n      out(opt.format === 'json' ? rep : renderDiff(rep));\n      const f = opt['fail-on'];\n      if (\n        (f === 'touched' && rep.maps.some((m) => m.touched.length)) ||\n        (f === 'broken' && rep.maps.some((m) => m.broken.length)) ||\n        (f === 'drift' && rep.maps.some((m) => m.drift.stale || m.broken.length))\n      ) process.exitCode = 1;\n      return;\n    }\n    case 'exec': {\n      const r = root();\n      const sep = process.argv.indexOf('--');\n      let coverage;\n      let source;\n      let command = '';\n      if (opt.lcov) {\n        coverage = parseLcov(fs.readFileSync(opt.lcov, 'utf8'), r);\n        source = 'lcov';\n        command = opt.lcov;\n      } else if (sep > -1 && process.argv[sep + 1]) {\n        const cmdArgs = process.argv.slice(sep + 1);\n        command = cmdArgs.join(' ');\n        out(`waymark: running ${command} with V8 coverage…`);\n        const res = runWithV8Coverage(r, cmdArgs[0], cmdArgs.slice(1));\n        if (res.status) out(`waymark: the command exited with ${res.status} (coverage is still applied)`);\n        coverage = res.coverage;\n        source = 'v8';\n      } else throw new Error('Usage: waymark exec [id] --lcov \u003clcov.info>   |   waymark exec [id] -- \u003ctest command>');\n      // A map id may precede \"--\": `waymark exec my-map -- npm test`.\n      const head = sep > -1 ? process.argv.slice(process.argv.indexOf('exec') + 1, sep).filter((a) => !a.startsWith('-')) : rest;\n      const ids = head[0] ? [head[0]] : null;\n      for (const x of applyCoverage(r, coverage, { ids, source, command })) {\n        out(`▶ ${x.id}: ${x.hit} executed, ${x.miss} not executed, ${x.unknown} without coverage`);\n      }\n      return;\n    }\n    case 'index':\n      return out(writeIndex(root()) || 'no maps');\n    case 'hook': {\n      const { runHook } = await import('./hooks.js');\n      return runHook(rest[0]);\n    }\n    case 'annotate': {\n      if (!rest[0] || !rest[1]) throw new Error('Usage: waymark annotate \u003cid> \u003cpatch.json|->');\n      const raw = rest[1] === '-' ? fs.readFileSync(0, 'utf8') : fs.readFileSync(rest[1], 'utf8');\n      const res = annotateMap(root(), rest[0], JSON.parse(raw));\n      out(`✔ ${res.id}: ${res.changed} fields changed${res.unknown.length ? '; unknown: ' + res.unknown.join(', ') : ''}`);\n      if (!res.narrative.complete) out('  still missing: ' + JSON.stringify(res.narrative));\n      out('  html: ' + res.htmlPath);\n      return;\n    }\n    case 'create': {\n      if (!rest[0]) throw new Error('Usage: waymark create \u003cfile.json|->');\n      const raw = rest[0] === '-' ? fs.readFileSync(0, 'utf8') : fs.readFileSync(rest[0], 'utf8');\n      const res = saveMap(root(), JSON.parse(raw), { id: opt.id });\n      printReport(res);\n      if (opt.open) openFile(res.htmlPath);\n      if (!res.report.healthy) process.exitCode = 2;\n      return;\n    }\n    case 'list': {\n      const maps = listMaps(root());\n      if (opt.json) return out(maps);\n      if (!maps.length) return out('No waymark yet. Try: waymark generate \"how does X work?\"');\n      for (const m of maps) out(`${m.id.padEnd(44)} ${String(m.locations).padStart(3)} nodes  ${(m.updatedAt || '').slice(0, 10)}  ${m.title}`);\n      return;\n    }\n    case 'show': {\n      const doc = loadMap(root(), rest[0]);\n      const f = opt.format || 'markdown';\n      return out(f === 'json' ? doc : f === 'mermaid' ? renderMermaid(doc) : renderMarkdown(doc, { detail: f === 'compact' ? 'compact' : 'full' }));\n    }\n    case 'verify': {\n      const r = root();\n      const ids = rest[0] ? [rest[0]] : listMaps(r).map((m) => m.id);\n      let bad = false;\n      for (const id of ids) {\n        const v = verifyMap(r, id, { fix: opt.fix });\n        const state = v.broken ? 'BROKEN' : v.stale ? 'STALE' : 'OK';\n        out(`${state.padEnd(7)} ${v.id}  map@${v.mapCommit || '?'} head@${v.headCommit || '?'}${v.fixed ? '  (fixed)' : ''}`);\n        for (const c of v.changes) out(`        ${c.status.padEnd(10)} [${c.id}] ${c.from} -> ${c.to}${c.note ? '  ' + c.note : ''}`);\n        if (v.narrative.stale) {\n          const parts = [];\n          if (v.narrative.nodes.length) parts.push('nodes ' + v.narrative.nodes.map((n) => `[${n}]`).join(', '));\n          if (v.narrative.traces.length) parts.push('trace guides ' + v.narrative.traces.join(', '));\n          if (v.narrative.story) parts.push('story');\n          out(`        narrative  review ${parts.join('; ')} (code changed since written) → waymark refresh ${v.id}`);\n        }\n        if (v.broken || (opt.strict && v.stale && !v.fixed) || (opt['strict-narrative'] && v.narrative.stale)) bad = true;\n      }\n      if (bad) process.exitCode = 1;\n      return;\n    }\n    case 'render': {\n      const r = root();\n      const p = writeHtml(r, loadMap(r, rest[0]));\n      out(p);\n      if (opt.open) openFile(p);\n      return;\n    }\n    case 'delete':\n      return out(`deleted ${deleteMap(root(), rest[0])}`);\n    case 'suggest': {\n      const s = suggestTopics(root());\n      if (opt.json) return out(s);\n      s.suggestions.forEach((x, i) => out(`${i + 1}. ${x.topic}\\n   ${x.reason}`));\n      return;\n    }\n    case 'guide':\n      return out(waymarkGuide(rest.join(' ')));\n    case 'install':\n      return out(\n        install({\n          target: resolveRoot(opt.target || opt.root),\n          claude: !opt['no-claude'],\n          codex: !opt['no-codex'],\n          codexGlobal: !!(opt['codex-global'] || opt.global),\n          claudeGlobal: !!(opt['claude-global'] || opt.global),\n          vscode: !!opt.vscode,\n          prAction: !!opt['pr-action'],\n          agentsMd: !opt['no-agents-md'],\n          hooks: !opt['no-hooks'],\n          useGlobalBin: !!opt['global-bin'],\n        }),\n      );\n    default:\n      throw new Error(`Unknown command \"${cmd}\". Run waymark --help`);\n  }\n}\n\nmain().catch((e) => {\n  console.error(`waymark: ${e.message}`);\n  process.exit(1);\n});\n","src/mcp.js":"#!/usr/bin/env node\nimport * as z from 'zod';\nimport { McpServer, ResourceTemplate } from '@modelcontextprotocol/sdk/server/mcp.js';\nimport { StdioServerTransport } from '@modelcontextprotocol/sdk/server/stdio.js';\nimport { MapInput } from './schema.js';\nimport { fileURLToPath } from 'node:url';\nimport { resolveRoot } from './git.js';\nimport { saveMap, loadMap, listMaps, writeHtml, deleteMap, annotateMap, narrativeGaps } from './store.js';\nimport { lintMap } from './lint.js';\nimport { noteMap, recordCheck } from './store.js';\nimport { diffMaps, renderDiff } from './diff.js';\nimport { applyCoverage, parseLcov, runWithV8Coverage } from './coverage.js';\nimport { createPlan, addTrace, draftStatus, draftTraces, finalizeDraft, listDrafts } from './parallel.js';\nimport { checkGuide, planGuide, traceGuide, finalizeGuide, overviewGuide } from './procedures.js';\nimport { TraceInput, LinkInput } from './schema.js';\nimport fsSync from 'node:fs';\nimport { mapsForFile, renderFileContext, forFileSummary } from './context.js';\nimport { verifyMap } from './verify.js';\nimport { findInFile } from './anchor.js';\nimport { suggestTopics } from './suggest.js';\nimport { waymarkGuide, enrichGuide, refreshGuide } from './guide.js';\nimport { renderMarkdown } from './render/markdown.js';\nimport { renderMermaid } from './render/mermaid.js';\nimport { openFile } from './open.js';\n\nconst VERSION = '0.3.0';\nconst rootArg = z.string().optional().describe('Repository root. Defaults to the server working directory / WAYMARK_ROOT');\n\nconst text = (t) => ({ content: [{ type: 'text', text: typeof t === 'string' ? t : JSON.stringify(t, null, 2) }] });\nconst fail = (e) => ({ isError: true, content: [{ type: 'text', text: String(e?.message || e) }] });\nconst safe = (fn) => async (args) => {\n  try {\n    return await fn(args);\n  } catch (e) {\n    return fail(e);\n  }\n};\n\n// Workspace announced by the client (MCP roots). Lets a globally installed server\n// (e.g. ~/.codex/config.toml used by Codex desktop) target the open project.\nlet clientRoot = null;\nconst rootOf = (root) => resolveRoot(root || process.env.WAYMARK_ROOT || clientRoot || undefined);\n\nexport function createServer() {\n  const server = new McpServer(\n    { name: 'waymark', version: VERSION },\n    {\n      instructions:\n        'Waymark: hierarchical, line-anchored, narrated maps of how code executes. To create one, call waymark_start(query) and follow the returned procedure, then waymark_create (or the parallel flow waymark_plan → waymark_add_trace × N → waymark_finalize). Fact-check with waymark_check. ' +\n        'To use an existing map as context, read resource waymark://\u003cid> or call waymark_get. Run waymark_verify before trusting an old map.',\n    },\n  );\n\n  server.registerTool(\n    'waymark_start',\n    {\n      title: 'Start a waymark',\n      description:\n        'Begin generating a waymark map for a topic/question. Returns the Waymark agent procedure (structure + storytelling rules), the input format, repo hints (recent files, entry points) and existing maps. Call this first, then explore the code and submit with waymark_create.',\n      inputSchema: {\n        query: z.string().describe('Topic or question, e.g. \"how does checkout payment work?\"'),\n        mode: z\n          .enum(['fast', 'smart', 'overview', 'parallel'])\n          .optional()\n          .describe('fast: short map quickly; smart (default): thorough map with full storytelling; overview: map of the whole system linking to detailed maps; parallel: plan traces for parallel builders'),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ query, mode, root }) => {\n      const r = rootOf(root);\n      const hints = suggestTopics(r, { limit: 5 });\n      const existing = listMaps(r).slice(0, 15).map(({ id, title, query: q, updatedAt }) => ({ id, title, query: q, updatedAt }));\n      return text(\n        `${mode === 'overview' ? overviewGuide(query) + '\\n\\n' + waymarkGuide(query, { mode: 'fast' }) : mode === 'parallel' ? planGuide(query) : waymarkGuide(query, { mode })}\\n## Repository\\n\\nroot: ${r}\\n\\n` +\n          `Entry points: ${hints.entryPoints.join(', ') || '(none detected)'}\\n\\n` +\n          (hints.viewedFiles.length ? `Recently viewed in the editor: ${hints.viewedFiles.map((f) => f.file).join(', ')}\\n\\n` : '') +\n          `Recently touched: ${hints.recentFiles.slice(0, 12).map((f) => f.file).join(', ') || '(none)'}\\n\\n` +\n          `Existing waymark (reuse/update instead of duplicating): ${existing.length ? JSON.stringify(existing) : 'none'}`,\n      );\n    }),\n  );\n\n  server.registerTool(\n    'waymark_suggest_topics',\n    {\n      title: 'Suggest waymark topics',\n      description: 'Suggests waymark topics from recent work (uncommitted and recently committed files, commit subjects) and detected entry points.',\n      inputSchema: { root: rootArg, limit: z.number().int().min(1).max(20).optional() },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ root, limit }) => text(suggestTopics(rootOf(root), { limit }))),\n  );\n\n  server.registerTool(\n    'waymark_find_anchor',\n    {\n      title: 'Find anchor lines',\n      description: 'Returns line numbers and exact line text in a file matching a literal string or regex. Use it to get precise lineNumber/lineContent for locations.',\n      inputSchema: {\n        path: z.string().describe('File path relative to repo root'),\n        pattern: z.string(),\n        regex: z.boolean().optional(),\n        limit: z.number().int().min(1).max(100).optional(),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ path, pattern, regex, limit, root }) => text(findInFile(rootOf(root), path, pattern, { regex, limit }))),\n  );\n\n  server.registerTool(\n    'waymark_create',\n    {\n      title: 'Create or update a waymark',\n      description:\n        'Validates a waymark, verifies every location against the working tree (auto-correcting shifted line numbers), stores it under .waymark/ and writes a shareable HTML viewer. Pass `id` to overwrite an existing map. Returns an anchor report: fix any unresolved/missing locations and resubmit.',\n      inputSchema: {\n        ...MapInput.shape,\n        id: z.string().optional().describe('Existing waymark id to overwrite'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...map }) => {\n      const r = rootOf(root);\n      const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });\n      server.sendResourceListChanged();\n      const next = [];\n      if (!report.healthy) {\n        next.push('Some locations could not be verified. Fix them (waymark_find_anchor helps) and call waymark_create again with id=\"' + doc.id + '\".');\n      }\n      if (!narrative.complete) {\n        next.push('Narrative is incomplete (see \"narrative\"). Fill the story, trace motivation/details and per-location explanations with waymark_annotate(id=\"' + doc.id + '\").');\n      }\n      const lint = lintMap(doc, { mapIds: new Set(listMaps(r).map((m) => m.id)) });\n      if (lint.errors) next.push('Lint found ' + lint.errors + ' error(s) (e.g. references to unknown nodes): fix them with waymark_annotate.');\n      if (!next.length) next.push('All anchors verified and narrative complete. Share the HTML file or reference waymark://' + doc.id);\n      return text({\n        id: doc.id,\n        resource: `waymark://${doc.id}`,\n        html: htmlPath,\n        json: jsonPath,\n        anchors: report,\n        narrative,\n        lint: { errors: lint.errors, warnings: lint.warnings, issues: lint.issues.slice(0, 15) },\n        next,\n      });\n    }),\n  );\n\n  const prose = () => z.string().optional();\n  server.registerTool(\n    'waymark_annotate',\n    {\n      title: 'Annotate a waymark (narrative)',\n      description:\n        'Adds or rewrites the prose of an existing map without re-sending or re-anchoring it: map story/description/title, trace motivation/details/description/diagramTitle, location explanation/description/title. Only the fields you pass change. Regenerates the HTML viewer and returns which narrative fields are still missing.',\n      inputSchema: {\n        id: z.string().describe('Map id (a unique prefix is enough)'),\n        title: prose(),\n        description: prose().describe('Map summary citing nodes as [1a]'),\n        story: prose().describe('Holistic storytelling narrative (markdown)'),\n        language: prose(),\n        traces: z\n          .array(\n            z.object({\n              id: z.string(),\n              title: prose(),\n              description: prose(),\n              diagramTitle: prose(),\n              motivation: prose().describe('Why this part exists (markdown)'),\n              details: prose().describe('Narrative walkthrough citing nodes (markdown)'),\n            }),\n          )\n          .optional(),\n        locations: z\n          .array(\n            z.object({\n              id: z.string(),\n              title: prose(),\n              description: prose().describe('One sentence \u003c= 15 words'),\n              explanation: prose().describe('Storytelling explanation, 3-6 sentences (markdown)'),\n            }),\n          )\n          .optional(),\n        links: z.array(LinkInput).optional().describe('Replaces the whole list of cross-trace links (fix labels or ends)'),\n        reviewed: z\n          .array(z.string())\n          .optional()\n          .describe('Prose confirmed still accurate after a code change: node ids (\"2b\"), \"trace:\u003cid>\" or \"story\"'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...patch }) => text(annotateMap(rootOf(root), id, patch))),\n  );\n\n  server.registerTool(\n    'waymark_enrich',\n    {\n      title: 'Enrich a waymark with storytelling',\n      description:\n        'Returns the procedure to upgrade an existing map with full storytelling (holistic story, Motivation/Details guides per trace, an explanation per location), the list of missing narrative and the map itself. Follow it and save with waymark_annotate.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const doc = loadMap(rootOf(root), id);\n      return text(\n        enrichGuide(doc.id) +\n          '\\n\\n## Missing narrative\\n\\n' +\n          JSON.stringify(narrativeGaps(doc)) +\n          '\\n\\n## Current map\\n\\n' +\n          renderMarkdown(doc, { detail: 'full' }),\n      );\n    }),\n  );\n\n  server.registerTool(\n    'waymark_list',\n    {\n      title: 'List waymark',\n      description: 'Lists waymark stored in the repository (.waymark/).',\n      inputSchema: { root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ root }) => text(listMaps(rootOf(root)))),\n  );\n\n  server.registerTool(\n    'waymark_get',\n    {\n      title: 'Get a waymark',\n      description:\n        'Returns a map for use as context. format: \"markdown\" (narrative + structure + snippets, default), \"compact\" (structure + one-line descriptions), \"json\", \"mermaid\". Pass trace (\"2\") or node (\"2b\") to get only that part — much smaller context.',\n      inputSchema: {\n        id: z.string().describe('Map id (a unique prefix is enough)'),\n        format: z.enum(['markdown', 'compact', 'json', 'mermaid']).optional(),\n        trace: z.string().optional().describe('Only this trace, e.g. \"2\"'),\n        node: z.string().optional().describe('Only this node with its trace context, e.g. \"2b\"'),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, format = 'markdown', trace, node, root }) => {\n      const doc = loadMap(rootOf(root), id);\n      if (format === 'json') return text(doc);\n      if (format === 'mermaid') return text(renderMermaid(doc));\n      return text(renderMarkdown(doc, { detail: format === 'compact' ? 'compact' : 'full', trace, node }));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_for_file',\n    {\n      title: 'Maps covering a file',\n      description:\n        'Lists the maps, traces and nodes that cover a file (optionally the node nearest to a line), with their one-line descriptions, the explanation of the nearest node and a flag when the code changed since a node was explained. Call it before modifying a file to understand the flow it belongs to.',\n      inputSchema: {\n        path: z.string().describe('File path (absolute or relative to the repo root)'),\n        line: z.number().int().positive().optional(),\n        format: z.enum(['markdown', 'json']).optional(),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ path: file, line, format = 'markdown', root }) => {\n      const res = mapsForFile(rootOf(root), file, { line });\n      if (format === 'json') return text(forFileSummary(res));\n      return text(renderFileContext(res, { maxChars: 12000 }) || `No waymark map covers ${res.path}.`);\n    }),\n  );\n\n  server.registerTool(\n    'waymark_lint',\n    {\n      title: 'Lint maps',\n      description:\n        'Static quality checks on maps: references to unknown nodes (errors), missing narrative, nodes not cited in their trace details, nodes missing from the tree, over-long titles/descriptions, very short explanations. Omit id to lint all maps.',\n      inputSchema: { id: z.string().optional(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const r = rootOf(root);\n      const ids = id ? [loadMap(r, id).id] : listMaps(r).map((m) => m.id);\n      const mapIds = new Set(listMaps(r).map((m) => m.id));\n      return text(ids.map((i) => lintMap(loadMap(r, i), { mapIds })));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_refresh',\n    {\n      title: 'Refresh outdated narrative',\n      description:\n        'Finds prose whose code changed since it was written (narrative drift: nodes, trace guides, story) and returns the procedure to bring it back in sync with waymark_annotate (or mark it reviewed). Use after code changes in areas covered by a map.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const r = rootOf(root);\n      const v = verifyMap(r, id);\n      const doc = loadMap(r, v.id);\n      if (!v.narrative.stale && !v.broken) return text(`Map ${v.id}: narrative is in sync with the code. Nothing to refresh.`);\n      const brokenIds = v.changes.filter((c) => c.status === 'unresolved' || c.status === 'missing').map((c) => c.id);\n      const nodes = [...new Set([...brokenIds, ...v.narrative.nodes])].map((n) => renderMarkdown(doc, { node: n })).join('\\n\\n---\\n\\n');\n      return text(\n        refreshGuide(v.id, v.narrative, brokenIds) +\n          (nodes ? '\\n\\n## Stale nodes (stored prose + last snippet)\\n\\n' + nodes : ''),\n      );\n    }),\n  );\n\n  // ---------------- fact-checking\n  server.registerTool(\n    'waymark_check',\n    {\n      title: 'Fact-check a map',\n      description:\n        'Returns the fact-checking procedure for a map plus the full map (prose + code snippets). A skeptical verifier checks every claim against the code, fixes wrong prose with waymark_annotate and records verdicts with waymark_record_check. Best run by a fresh agent/subagent that did not write the map.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const doc = loadMap(rootOf(root), id);\n      return text(checkGuide(doc.id) + '\\n\\n## Map to check\\n\\n' + renderMarkdown(doc, { detail: 'full' }));\n    }),\n  );\n\n  const verdict = z.enum(['supported', 'partial', 'unsupported']);\n  server.registerTool(\n    'waymark_record_check',\n    {\n      title: 'Record fact-check verdicts',\n      description:\n        'Stores fact-check verdicts. A verdict stays valid while the node\\'s code block and prose are unchanged; it becomes \"stale\" otherwise. unsupported verdicts are lint errors.',\n      inputSchema: {\n        id: z.string(),\n        nodes: z.array(z.object({ id: z.string(), verdict, issues: z.array(z.string()).optional() })).optional(),\n        traces: z.array(z.object({ id: z.string(), verdict, issues: z.array(z.string()).optional() })).optional(),\n        story: z.object({ verdict, issues: z.array(z.string()).optional() }).optional(),\n        checker: z.string().optional().describe('Who checked (model/agent name)'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...v }) => text(recordCheck(rootOf(root), id, v))),\n  );\n\n  // ---------------- human notes\n  server.registerTool(\n    'waymark_note',\n    {\n      title: 'Add or remove a human note',\n      description:\n        'Adds a human note to a node (team knowledge: gotchas, decisions, links). Notes are never rewritten by agents and survive map regeneration. Use only when the user asks to record something. remove=\u003cindex> deletes one.',\n      inputSchema: {\n        id: z.string(),\n        node: z.string(),\n        text: z.string().optional(),\n        author: z.string().optional(),\n        remove: z.number().int().min(0).optional(),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, node, text: t, author, remove, root }) => text(noteMap(rootOf(root), id, node, { text: t, author, remove }))),\n  );\n\n  // ---------------- change impact (PRs)\n  server.registerTool(\n    'waymark_diff',\n    {\n      title: 'Impact of changes on the maps',\n      description:\n        'Which map nodes a change set touches (their code blocks intersect changed lines), which anchors it breaks and which prose it leaves outdated. base \"HEAD\" (default) = uncommitted changes; with range=true compares base...HEAD (a branch or PR).',\n      inputSchema: {\n        base: z.string().optional(),\n        range: z.boolean().optional(),\n        format: z.enum(['markdown', 'json']).optional(),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ base = 'HEAD', range = false, format = 'markdown', root }) => {\n      const rep = diffMaps(rootOf(root), base, { range });\n      return text(format === 'json' ? rep : renderDiff(rep));\n    }),\n  );\n\n  // ---------------- verification by execution\n  server.registerTool(\n    'waymark_exec',\n    {\n      title: 'Mark nodes executed by tests',\n      description:\n        'Marks which nodes actually ran, from coverage: pass lcov (path to an lcov.info from any language) or command (a test command run with NODE_V8_COVERAGE, Node/JS only). Results show as ▶ in viewers and in context.',\n      inputSchema: {\n        id: z.string().optional().describe('Map id; omit for all maps'),\n        lcov: z.string().optional(),\n        command: z.string().optional().describe('e.g. \"npm test\"'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, lcov, command, root }) => {\n      const r = rootOf(root);\n      let coverage;\n      let source;\n      if (lcov) {\n        coverage = parseLcov(fsSync.readFileSync(lcov, 'utf8'), r);\n        source = 'lcov';\n      } else if (command) {\n        const parts = command.split(' ');\n        const res = runWithV8Coverage(r, parts[0], parts.slice(1));\n        coverage = res.coverage;\n        source = 'v8';\n      } else throw new Error('Pass lcov or command');\n      return text(applyCoverage(r, coverage, { ids: id ? [id] : null, source, command: command || lcov }));\n    }),\n  );\n\n  // ---------------- parallel generation\n  server.registerTool(\n    'waymark_plan',\n    {\n      title: 'Plan a map for parallel builders',\n      description:\n        'Phase 1 of parallel generation: registers the traces to build (title, focus, hints) and returns a draft id plus one ready-to-use builder prompt per trace. Launch one builder (subagent) per trace in parallel; each submits with waymark_add_trace; then waymark_finalize.',\n      inputSchema: {\n        query: z.string(),\n        title: z.string(),\n        language: z.string().optional(),\n        kind: z.enum(['flow', 'overview']).optional(),\n        traces: z.array(z.object({ title: z.string(), focus: z.string(), hints: z.array(z.string()).optional() })).min(1),\n        root: rootArg,\n      },\n    },\n    safe(async ({ root, ...p }) => {\n      const r = rootOf(root);\n      const plan = createPlan(r, p);\n      return text({\n        draft: plan.draft,\n        traces: plan.traces.map((t) => ({ n: t.n, title: t.title, builderPrompt: traceGuide(plan.draft, t.n, plan) })),\n        next: 'Run one builder per trace in parallel (e.g. one waymark subagent each, all in the same message), then call waymark_finalize after reading waymark_draft.',\n      });\n    }),\n  );\n\n  server.registerTool(\n    'waymark_add_trace',\n    {\n      title: 'Submit one trace of a draft',\n      description: 'Phase 2: validates, renumbers (ids \u003cn>a, \u003cn>b…) and anchors ONE trace of a planned draft. Safe to call from parallel builders.',\n      inputSchema: { draft: z.string(), n: z.number().int().positive(), trace: TraceInput, root: rootArg },\n    },\n    safe(async ({ draft, n, trace, root }) => text(addTrace(rootOf(root), draft, n, trace))),\n  );\n\n  server.registerTool(\n    'waymark_draft',\n    {\n      title: 'Read a draft',\n      description: 'Status of a draft (finished/missing traces) and the finished traces as markdown, for the finalize step. Omit draft to list drafts.',\n      inputSchema: { draft: z.string().optional(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ draft, root }) => {\n      const r = rootOf(root);\n      if (!draft) return text(listDrafts(r).map(({ plan, ...d }) => d));\n      const st = draftStatus(r, draft);\n      const traces = draftTraces(r, draft);\n      const md = traces.length\n        ? renderMarkdown({ id: draft, title: st.title, description: '', traces }, { detail: 'compact' })\n        : '(no finished traces yet)';\n      const { plan, ...rest } = st;\n      return text(JSON.stringify(rest, null, 2) + '\\n\\n' + md);\n    }),\n  );\n\n  server.registerTool(\n    'waymark_finalize',\n    {\n      title: 'Finalize a parallel draft',\n      description: 'Phase 3: merges the finished traces into a regular map with the map-level description, story and cross-trace links, then removes the draft.',\n      inputSchema: {\n        draft: z.string(),\n        title: z.string().optional(),\n        description: z.string(),\n        story: z.string().optional(),\n        language: z.string().optional(),\n        links: z.array(LinkInput).optional(),\n        id: z.string().optional(),\n        root: rootArg,\n      },\n    },\n    safe(async ({ draft, root, ...rest }) => {\n      const r = rootOf(root);\n      const { doc, report, narrative, htmlPath } = finalizeDraft(r, draft, rest);\n      server.sendResourceListChanged();\n      return text({ id: doc.id, html: htmlPath, anchors: report, narrative, lint: lintMap(doc, { mapIds: new Set(listMaps(r).map((m) => m.id)) }) });\n    }),\n  );\n\n  server.registerTool(\n    'waymark_verify',\n    {\n      title: 'Verify waymark anchors',\n      description:\n        'Re-checks waymark locations against the current code: detects moved lines, renamed files and removed code. With fix=true, writes corrected anchors back. Omit id to verify all maps.',\n      inputSchema: { id: z.string().optional(), fix: z.boolean().optional(), root: rootArg },\n    },\n    safe(async ({ id, fix, root }) => {\n      const r = rootOf(root);\n      const ids = id ? [id] : listMaps(r).map((m) => m.id);\n      return text(ids.map((i) => verifyMap(r, i, { fix })));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_render',\n    {\n      title: 'Render waymark viewer',\n      description: 'Regenerates the self-contained HTML viewer of a waymark and optionally opens it in the default browser.',\n      inputSchema: { id: z.string(), open: z.boolean().optional(), root: rootArg },\n    },\n    safe(async ({ id, open, root }) => {\n      const r = rootOf(root);\n      const p = writeHtml(r, loadMap(r, id));\n      if (open) openFile(p);\n      return text({ html: p });\n    }),\n  );\n\n  server.registerTool(\n    'waymark_delete',\n    {\n      title: 'Delete a waymark',\n      description: 'Deletes a waymark (JSON and HTML) from .waymark/. Only use when the user asks.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { destructiveHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const removed = deleteMap(rootOf(root), id);\n      server.sendResourceListChanged();\n      return text({ deleted: removed });\n    }),\n  );\n\n  // @-mentionable context: waymark://\u003cid>\n  server.registerResource(\n    'waymark',\n    new ResourceTemplate('waymark://{id}', {\n      list: async () => ({\n        resources: listMaps(rootOf()).map((m) => ({\n          uri: `waymark://${m.id}`,\n          name: m.title,\n          description: m.description,\n          mimeType: 'text/markdown',\n        })),\n      }),\n      complete: { id: (v) => listMaps(rootOf()).map((m) => m.id).filter((i) => i.startsWith(v)) },\n    }),\n    { title: 'Waymark', description: 'A waymark rendered as markdown context', mimeType: 'text/markdown' },\n    async (uri, { id }) => ({\n      contents: [{ uri: uri.href, mimeType: 'text/markdown', text: renderMarkdown(loadMap(rootOf(), String(id))) }],\n    }),\n  );\n\n  // @-mention a single trace or node: waymark://\u003cid>/\u003ctrace> or waymark://\u003cid>/\u003cnode>\n  server.registerResource(\n    'waymark-part',\n    new ResourceTemplate('waymark://{id}/{part}', {\n      list: async () => ({\n        resources: listMaps(rootOf()).flatMap((m) => {\n          try {\n            return loadMap(rootOf(), m.id).traces.map((t) => ({\n              uri: `waymark://${m.id}/${t.id}`,\n              name: `${m.title} › ${t.id}. ${t.title}`,\n              description: t.description,\n              mimeType: 'text/markdown',\n            }));\n          } catch {\n            return [];\n          }\n        }),\n      }),\n    }),\n    { title: 'Waymark trace or node', description: 'One trace (\"2\") or one node (\"2b\") of a map, as markdown context', mimeType: 'text/markdown' },\n    async (uri, { id, part }) => {\n      const doc = loadMap(rootOf(), String(id));\n      const isTrace = doc.traces.some((t) => t.id === String(part));\n      const md = renderMarkdown(doc, isTrace ? { trace: String(part) } : { node: String(part) });\n      return { contents: [{ uri: uri.href, mimeType: 'text/markdown', text: md }] };\n    },\n  );\n\n  server.registerPrompt(\n    'create_waymark',\n    {\n      title: 'Create a waymark',\n      description: 'Generate a hierarchical waymark of how the code works for a topic',\n      argsSchema: { query: z.string().describe('Topic or question') },\n    },\n    ({ query }) => ({ messages: [{ role: 'user', content: { type: 'text', text: waymarkGuide(query) } }] }),\n  );\n\n  server.server.oninitialized = async () => {\n    if (!server.server.getClientCapabilities()?.roots) return;\n    try {\n      const { roots } = await server.server.listRoots();\n      const first = roots.find((x) => x.uri.startsWith('file://'));\n      if (first) clientRoot = fileURLToPath(first.uri);\n    } catch {\n      /* client advertised roots but failed to list them: fall back to cwd */\n    }\n  };\n\n  return server;\n}\n\nexport async function startStdio() {\n  const server = createServer();\n  await server.connect(new StdioServerTransport());\n}\n\nif (import.meta.url === `file://${process.argv[1]}` || process.argv[1]?.endsWith('mcp.js')) {\n  startStdio().catch((e) => {\n    console.error(e);\n    process.exit(1);\n  });\n}\n","src/store.js":"import fs from 'node:fs';\nimport path from 'node:path';\nimport crypto from 'node:crypto';\nimport { normalizeMap, Title } from './schema.js';\nimport { anchorMap, safeJoin, FileCache, contextHash, traceHash } from './anchor.js';\nimport { headCommit, currentBranch, remoteWebUrl } from './git.js';\nimport { renderHtml, renderIndex } from './render/html.js';\nimport { execFileSync } from 'node:child_process';\nimport { proseHash, checkState } from './state.js';\nexport { proseHash, checkState };\n\nexport const SCHEMA_VERSION = 1;\n\nexport function mapDir(root) {\n  return path.join(root, process.env.WAYMARK_DIR || '.waymark');\n}\n\nconst slugify = (s) =>\n  s\n    .normalize('NFKD')\n    .replace(/[̀-ͯ]/g, '')\n    .toLowerCase()\n    .replace(/[^a-z0-9]+/g, '-')\n    .replace(/^-|-$/g, '')\n    .slice(0, 48) || 'waymark';\n\nconst validId = (id) => /^[a-z0-9][a-z0-9-]{0,80}$/.test(id);\n\nfunction filePath(root, id, ext = 'json') {\n  if (!validId(id)) throw new Error(`Invalid waymark id \"${id}\"`);\n  return path.join(mapDir(root), `${id}.${ext}`);\n}\n\n/** Validates, anchors against the working tree, persists JSON (+ HTML viewer). */\nexport function saveMap(root, input, { id, html = true } = {}) {\n  const map = normalizeMap(input);\n  const report = anchorMap(root, map);\n  baselineNarrative(map, { force: true });\n  const existing = id ? loadMap(root, id, { quiet: true }) : null;\n  if (existing) carryOver(existing, map);\n  const now = new Date().toISOString();\n  const doc = {\n    schemaVersion: SCHEMA_VERSION,\n    id: id || `${slugify(map.title)}-${crypto.randomBytes(3).toString('hex')}`,\n    ...map,\n    meta: {\n      createdAt: existing?.meta?.createdAt || now,\n      updatedAt: now,\n      root,\n      commit: headCommit(root),\n      branch: currentBranch(root),\n      remote: remoteWebUrl(root),\n      anchors: { ...report, issues: undefined },\n    },\n  };\n  fs.mkdirSync(mapDir(root), { recursive: true });\n  fs.writeFileSync(filePath(root, doc.id), JSON.stringify(doc, null, 2));\n  const htmlPath = html ? writeHtml(root, doc) : null;\n  return { doc, report, narrative: narrativeGaps(doc), jsonPath: filePath(root, doc.id), htmlPath };\n}\n\nexport function writeHtml(root, doc) {\n  const p = filePath(root, doc.id, 'html');\n  fs.writeFileSync(p, renderHtml(doc, { files: collectFiles(root, doc), maps: mapIndex(root, doc.id) }));\n  writeIndex(root);\n  return p;\n}\n\n/** Light index of the other maps (for mapRef links between maps). */\nfunction mapIndex(root, selfId) {\n  return listMaps(root)\n    .filter((m) => m.id !== selfId)\n    .map((m) => ({ id: m.id, title: m.title, kind: m.kind }));\n}\n\n/** .waymark/index.html: every map with its health, linking to each viewer. */\nexport function writeIndex(root) {\n  const maps = listMaps(root);\n  if (!maps.length) return null;\n  const p = path.join(mapDir(root), 'index.html');\n  fs.writeFileSync(p, renderIndex(maps, { root }));\n  return p;\n}\n\n/**\n * Human notes always survive re-creation (matched by node id); fact-check verdicts and\n * execution results survive only while the node's code block is unchanged.\n */\nfunction carryOver(prev, next) {\n  const old = new Map(prev.traces.flatMap((t) => t.locations).map((l) => [l.id, l]));\n  for (const t of next.traces) {\n    const pt = prev.traces.find((x) => x.id === t.id);\n    if (pt?.check && pt.check.hash === traceHash(t)) t.check = pt.check;\n    for (const l of t.locations) {\n      const o = old.get(l.id);\n      if (!o) continue;\n      if (o.notes?.length) l.notes = o.notes;\n      if (o.check && o.check.ctxHash === l.ctxHash && o.check.proseHash === proseHash(l)) l.check = o.check;\n      if (o.exec && o.exec.ctxHash === l.ctxHash) l.exec = o.exec;\n    }\n  }\n}\n\n\n/** Adds (or removes, with remove=index) a human note on a node. Not AI prose: never rewritten by agents. */\nexport function noteMap(root, id, nodeId, { text = '', author = '', remove = null } = {}) {\n  const doc = loadMap(root, id);\n  const l = doc.traces.flatMap((t) => t.locations).find((x) => x.id === nodeId);\n  if (!l) throw new Error(`Node \"${nodeId}\" not found in ${doc.id}`);\n  l.notes = l.notes || [];\n  if (remove != null) {\n    if (!l.notes[remove]) throw new Error(`Note #${remove} not found on [${nodeId}]`);\n    l.notes.splice(remove, 1);\n  } else {\n    if (!String(text).trim()) throw new Error('Empty note');\n    l.notes.push({ text: String(text).trim(), author: author || gitUser(root) || 'unknown', at: new Date().toISOString(), ctxHash: l.ctxHash });\n  }\n  if (!l.notes.length) delete l.notes;\n  doc.meta = { ...doc.meta, updatedAt: new Date().toISOString() };\n  persist(root, doc);\n  writeHtml(root, doc);\n  return { id: doc.id, node: nodeId, notes: l.notes || [] };\n}\n\nfunction gitUser(root) {\n  try {\n    return execFileSync('git', ['config', 'user.name'], { cwd: root, encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }).trim();\n  } catch {\n    return '';\n  }\n}\n\nconst VERDICTS = new Set(['supported', 'partial', 'unsupported']);\n\n/**\n * Records fact-check verdicts (from a verifier agent). A verdict is tied to the code block and\n * the prose it judged: editing either makes it \"stale\" (shown as unchecked).\n */\nexport function recordCheck(root, id, { nodes = [], traces = [], story = null, checker = '' } = {}) {\n  const doc = loadMap(root, id);\n  refreshContextHashes(root, doc);\n  const at = new Date().toISOString();\n  const unknown = [];\n  const byId = new Map(doc.traces.flatMap((t) => t.locations).map((l) => [l.id, l]));\n  for (const v of nodes) {\n    const l = byId.get(v.id);\n    if (!l || !VERDICTS.has(v.verdict)) {\n      unknown.push(v.id);\n      continue;\n    }\n    l.check = { verdict: v.verdict, issues: v.issues || [], at, checker, ctxHash: l.ctxHash, proseHash: proseHash(l) };\n  }\n  for (const v of traces) {\n    const t = doc.traces.find((x) => x.id === String(v.id));\n    if (!t || !VERDICTS.has(v.verdict)) {\n      unknown.push(`trace ${v.id}`);\n      continue;\n    }\n    t.check = { verdict: v.verdict, issues: v.issues || [], at, checker, hash: traceHash(t) };\n  }\n  if (story && VERDICTS.has(story.verdict)) doc.storyCheck = { verdict: story.verdict, issues: story.issues || [], at, checker };\n  doc.meta = { ...doc.meta, updatedAt: at, check: checkSummary(doc) };\n  persist(root, doc);\n  writeHtml(root, doc);\n  return { id: doc.id, unknown, summary: doc.meta.check };\n}\n\nexport function checkSummary(doc) {\n  const out = { supported: 0, partial: 0, unsupported: 0, unchecked: 0, stale: 0, total: 0 };\n  for (const t of doc.traces) for (const l of t.locations) {\n    out[checkState(l)]++;\n    out.total++;\n  }\n  return out;\n}\n\n/** Stores execution results ({ nodeId: { hit, count } }) from coverage. */\nexport function recordExec(root, id, results, { source = 'coverage', command = '' } = {}) {\n  const doc = loadMap(root, id);\n  refreshContextHashes(root, doc);\n  const at = new Date().toISOString();\n  const sum = { hit: 0, miss: 0, unknown: 0 };\n  for (const t of doc.traces) {\n    for (const l of t.locations) {\n      const r = results[l.id];\n      if (!r) {\n        delete l.exec;\n        sum.unknown++;\n        continue;\n      }\n      l.exec = { hit: r.hit, count: r.count
