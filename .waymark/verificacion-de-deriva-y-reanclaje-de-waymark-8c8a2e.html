<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="waymark">
<title>Waymark · Verificación de deriva y reanclaje de Waymark</title>
<style>:root {
  --bg: #1b1c1f; --panel: #232428; --panel2: #2a2b30; --ink: #e4e5e8; --ink2: #c9cbd0; --muted: #8f949c;
  --line: #36383e; --accent: #5b8cff; --accent-soft: rgba(91, 140, 255, .14); --code-bg: #18191c;
  --hl: rgba(240, 196, 66, .14); --hl-line: rgba(240, 196, 66, .55); --warn: #e0a43a; --bad: #e5646b;
  --kw: #c792ea; --str: #9ccc65; --com: #6b7280; --num: #f2a65a; --fn: #82aaff;
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  --shadow: 0 8px 28px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --panel2: #f3f3f1; --ink: #1d1f23; --ink2: #33363c; --muted: #6b7078;
    --line: #e3e3df; --accent: #3a5ccc; --accent-soft: rgba(58, 92, 204, .1); --code-bg: #fbfbfa;
    --hl: rgba(240, 196, 66, .22); --hl-line: rgba(200, 150, 20, .7); --warn: #b26b00; --bad: #c23b3b;
    --kw: #8a3ab9; --str: #2e7d32; --com: #8b8f97; --num: #b5520b; --fn: #2a5bd7;
    --shadow: 0 8px 28px rgba(0, 0, 0, .12);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13.5px/1.55 var(--sans); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }
#app { display: flex; flex-direction: column; height: 100%; }

/* ---------- top bar ---------- */
#topbar { display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; }
.brand { font: 700 12px/1 var(--sans); letter-spacing: .14em; color: var(--accent); }
.brand-sep { width: 1px; height: 20px; background: var(--line); }
.top-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; color: var(--ink2); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; color: var(--muted); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tbtn { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; color: var(--ink2); }
.tbtn:hover, .seg button:hover { color: var(--ink); border-color: var(--accent); }
#settings { display: flex; flex-wrap: wrap; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 12.5px; }
#settings[hidden] { display: none; }
#settings input, #settings select { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: 12px var(--mono); }
#settings input { width: 380px; max-width: 70vw; }

/* ---------- layout ---------- */
#main { flex: 1; min-height: 0; display: flex; }
#mapPane { width: var(--map-w, 42%); min-width: 300px; max-width: 75%; overflow: auto; background: var(--panel); padding: 0 0 80px; }
#splitter { width: 5px; cursor: col-resize; background: var(--line); flex-shrink: 0; opacity: .6; }
#splitter:hover, #splitter.drag { background: var(--accent); opacity: 1; }
#rightPane { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; background: var(--code-bg); }

/* ---------- map pane ---------- */
.mp-head { padding: 16px 18px 14px; border-bottom: 1px solid var(--line); }
.mp-head h1 { font-size: 17px; margin: 0 0 6px; line-height: 1.3; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
.chip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.bad { color: var(--bad); border-color: currentColor; } .chip.warn { color: var(--warn); border-color: currentColor; }
.summary { color: var(--ink2); }
.mp-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.pill { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; color: var(--ink2); }
.pill:hover { border-color: var(--accent); color: var(--ink); }
.pill.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.story { margin-top: 14px; padding: 14px 16px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); }
.story[hidden] { display: none; }
.ai-label { font-size: 11px; letter-spacing: .04em; color: var(--muted); font-style: italic; margin-bottom: 6px; }

.trace { border-bottom: 1px solid var(--line); }
.tr-head { display: flex; gap: 10px; padding: 12px 18px 10px; cursor: pointer; align-items: flex-start; }
.tr-head:hover { background: var(--panel2); }
.tr-num { font-weight: 700; color: var(--tc); min-width: 14px; }
.tr-text { flex: 1; min-width: 0; }
.tr-title { font-weight: 650; }
.tr-desc { color: var(--muted); font-size: 12.5px; }
.see-more { background: none; border: 0; padding: 0; color: var(--ink2); text-decoration: underline; font-size: 12.5px; }
.see-more:hover { color: var(--accent); }
.caret { color: var(--muted); transition: transform .15s; }
.trace.closed .caret { transform: rotate(-90deg); }
.trace.closed .tr-body, .trace.closed .guide { display: none; }
.guide { margin: 0 18px 12px; padding: 12px 16px; border-left: 3px solid var(--tc); background: var(--panel2); border-radius: 0 10px 10px 0; }
.guide[hidden] { display: none; }
.guide h4 { margin: 10px 0 4px; font-size: 14px; }
.guide h4:first-of-type { margin-top: 2px; }
.tr-body { padding: 2px 14px 14px 18px; }
.tree-title { font-weight: 650; margin: 4px 0 4px; color: var(--ink2); }

/* annotated tree */
.tt { list-style: none; margin: 0; padding-left: 14px; position: relative; }
.tr-body > .tt { padding-left: 4px; }
.tt li { position: relative; padding-left: 12px; margin: 2px 0; }
.tt li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1px solid var(--line); }
.tt li:last-child::before { bottom: auto; height: 14px; }
.tt li::after { content: ""; position: absolute; left: 0; top: 14px; width: 9px; border-top: 1px solid var(--line); }
.lbl { color: var(--ink2); padding: 3px 4px; font-size: 12.5px; }
.via { display: inline-block; font-size: 11px; color: var(--muted); font-style: italic; margin: 2px 0 0 4px; }
.loc { border-radius: 8px; padding: 6px 8px; cursor: pointer; border: 1px solid transparent; outline: none; }
.loc:hover { background: var(--panel2); }
.loc.sel { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.loc:focus-visible { border-color: var(--accent); }
.loc-top { display: flex; align-items: baseline; gap: 8px; }
.lid { font: 700 11.5px/1 var(--mono); color: var(--tc, var(--accent)); min-width: 22px; }
.lt { font-weight: 600; flex: 1; min-width: 0; }
.lf { font: 11.5px var(--mono); color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.st { font-size: 11px; } .st.fuzzy { color: var(--warn); } .st.unresolved, .st.missing { color: var(--bad); }
.loc-code { display: flex; gap: 10px; margin: 4px 0 0 30px; font: 12px/1.5 var(--mono); color: var(--ink2); overflow: hidden; }
.loc-code .ln { color: var(--muted); min-width: 28px; text-align: right; }
.loc-code code { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: inherit; }
.loc.ref-again { padding: 3px 8px; }
.loc.ref-again .lt { font-weight: 500; color: var(--ink2); }
.loc-more { display: none; margin: 8px 0 2px 30px; }
.loc.sel .loc-more, .loc.open .loc-more, body.explain-all .loc-more { display: block; }
.loc-desc { color: var(--ink2); font-size: 12.5px; }
.explain { margin-top: 6px; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--ink2); }
.explain:hover, .explain.on { border-color: var(--accent); color: var(--accent); }
.expl { margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: var(--panel2); border-left: 3px solid var(--tc); font-size: 13px; }
.expl[hidden] { display: none; }
.expl .empty { color: var(--muted); font-style: italic; }

/* markdown */
.md p { margin: 0 0 8px; } .md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 4px 0 8px; padding-left: 20px; }
.md h5 { font-size: 13.5px; margin: 10px 0 4px; }
.md code, .summary code, .tr-desc code, .loc-desc code, .anno code { font: 12px var(--mono); background: var(--code-bg); border: 1px solid var(--line); padding: 0 4px; border-radius: 4px; }
.md pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow: auto; font: 12px/1.5 var(--mono); }
.md pre code { border: 0; padding: 0; background: none; }
.refs { white-space: nowrap; }
a.ref { color: var(--accent); text-decoration: none; cursor: pointer; font-weight: 600; }
a.ref:hover { text-decoration: underline; }

/* ---------- code view ---------- */
#codeView { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#codeView[hidden], #diagramView[hidden] { display: none; }
#fileTabs { display: flex; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; scrollbar-width: thin; }
.ftab { background: none; border: 0; border-right: 1px solid var(--line); padding: 9px 14px; font: 12.5px var(--mono); color: var(--muted); white-space: nowrap; }
.ftab.on { color: var(--ink); background: var(--code-bg); box-shadow: inset 0 2px 0 var(--accent); }
.ftab .cnt { font-size: 10.5px; color: var(--muted); margin-left: 6px; }
#codeScroll { flex: 1; overflow: auto; position: relative; }
#code { font: 12.5px/1.6 var(--mono); padding: 8px 0 50vh; }
.cl { display: flex; min-height: 20px; }
.cl .gut { width: 44px; flex-shrink: 0; display: flex; gap: 2px; justify-content: flex-end; padding-right: 4px; }
.gm { font: 700 10px/20px var(--mono); color: var(--tc); text-decoration: none; cursor: pointer; }
.cl .no { width: 48px; flex-shrink: 0; text-align: right; padding-right: 14px; color: var(--muted); user-select: none; }
.cl .tx { white-space: pre-wrap; word-break: break-word; flex: 1; padding-right: 16px; tab-size: 4; }
.cl.anchored { background: color-mix(in srgb, var(--hl) 45%, transparent); }
.cl.hl { background: var(--hl); box-shadow: inset 3px 0 0 var(--hl-line); }
.gap { color: var(--muted); padding: 2px 0 2px 92px; }
.code-note { margin: 0 16px 8px; padding: 6px 10px; border-radius: 6px; font: 12px var(--sans); color: var(--warn); border: 1px dashed currentColor; }
.anno { display: flex; align-items: center; gap: 10px; margin: 6px 16px 4px 92px; padding: 6px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--tc); font: 12.5px/1.4 var(--sans); box-shadow: var(--shadow); position: relative; }
.anno .lid { color: var(--tc); }
.anno .ad { flex: 1; color: var(--ink); }
.anno .an { display: flex; gap: 10px; white-space: nowrap; }
.anno .an a { color: var(--muted); cursor: pointer; text-decoration: none; }
.anno .an a:hover { color: var(--accent); }
.anno .xbtn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 11.5px; color: var(--ink2); }
.anno-expl { margin: 0 16px 8px 92px; padding: 10px 12px; border-radius: 8px; background: var(--panel2); border-left: 3px solid var(--tc); font: 13px/1.55 var(--sans); }
.tk-k { color: var(--kw); } .tk-s { color: var(--str); } .tk-c { color: var(--com); font-style: italic; } .tk-n { color: var(--num); } .tk-f { color: var(--fn); }

/* ---------- diagram ---------- */
#diagramView { flex: 1; min-height: 0; position: relative; overflow: hidden; background:
  radial-gradient(circle, color-mix(in srgb, var(--muted) 22%, transparent) 1px, transparent 1px) 0 0 / 22px 22px, var(--bg); }
#dg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; touch-action: none; }
#dg.panning { cursor: grabbing; }
.dg-toolbar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; align-items: flex-start; pointer-events: none; z-index: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; pointer-events: auto; flex: 1; }
.lg { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 6px; font-size: 12px; color: var(--ink2); max-width: 260px; }
.lg .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tc); flex-shrink: 0; }
.lg span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg.off { opacity: .4; } .lg.off .dot { background: transparent; border: 1px solid var(--tc); }
.zoom { display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
.zoom button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 15px; color: var(--ink2); }
.zoom button:hover { color: var(--accent); border-color: var(--accent); }
.dg-hint { position: absolute; left: 12px; bottom: 10px; font-size: 11.5px; color: var(--muted); pointer-events: none; }

svg .cluster rect.box { fill: color-mix(in srgb, var(--tc) 9%, transparent); stroke: color-mix(in srgb, var(--tc) 55%, transparent); stroke-width: 1.2; }
svg .cluster .chead { cursor: pointer; }
svg .cluster .chead rect { fill: color-mix(in srgb, var(--tc) 22%, transparent); }
svg .cluster text { fill: var(--ink); font: 600 13px var(--sans); }
svg .edge { fill: none; stroke: var(--muted); stroke-width: 1.4; opacity: .85; }
svg .link { fill: none; stroke-width: 1.6; stroke-dasharray: 6 5; opacity: .9; }
svg .elabel { font: italic 11px var(--sans); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
svg .llabel rect { fill: var(--panel); stroke: var(--line); }
svg .llabel text { font: 11px var(--sans); fill: var(--ink2); }
.dn { width: 100%; height: 100%; border-radius: 9px; border: 1.5px solid color-mix(in srgb, var(--tc) 70%, var(--line)); background: var(--panel); padding: 6px 9px; font: 12px/1.3 var(--sans); color: var(--ink); cursor: pointer; overflow: hidden; display: flex; flex-direction: column; justify-content: center; transition: opacity .15s, box-shadow .15s; }
.dn:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 35%, transparent); }
.dn .h { display: flex; gap: 6px; align-items: baseline; }
.dn .i { font: 700 11px var(--mono); color: var(--tc); }
.dn .t { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dn .v { font: italic 10.5px var(--sans); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px; }
.dn .f { font: 10.5px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.dn.label { border-style: dashed; background: color-mix(in srgb, var(--panel) 75%, transparent); color: var(--ink2); font-size: 11.5px; text-align: center; align-items: center; cursor: default; }
.dn.label .t { font-weight: 500; }
.dn.again { border-style: dotted; opacity: .85; }
.dn.sel { box-shadow: 0 0 0 3px var(--accent); border-color: var(--accent); }
svg.focus .node.dim .dn, svg.focus .edge.dim, svg.focus .link.dim, svg.focus .elabel.dim, svg.focus .llabel.dim { opacity: .18; }
svg .hid { display: none; }

#dgTip { position: absolute; z-index: 5; max-width: 340px; padding: 8px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 12.5px; pointer-events: none; }
#dgTip[hidden], #dgCard[hidden] { display: none; }
#dgTip b { color: var(--tc); font-family: var(--mono); margin-right: 6px; }
#dgCard { position: absolute; right: 12px; bottom: 34px; width: min(420px, calc(100% - 72px)); max-height: 46%; overflow: auto; z-index: 4; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--tc); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; }
#dgCard .ch { display: flex; align-items: baseline; gap: 8px; }
#dgCard .ch .lid { font-size: 13px; }
#dgCard .ch h3 { margin: 0; font-size: 15px; flex: 1; }
#dgCard .x { background: none; border: 0; color: var(--muted); font-size: 18px; line-height: 1; }
#dgCard .where { font: 11.5px var(--mono); color: var(--accent); margin: 2px 0 8px; }
#dgCard .cdesc { color: var(--ink2); margin-bottom: 8px; }
#dgCard pre { margin: 8px 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 0; overflow: auto; font: 11.5px/1.5 var(--mono); }
#dgCard pre .r { display: block; padding: 0 10px; white-space: pre; }
#dgCard pre .r.hl { background: var(--hl); }
#dgCard pre .r .n { color: var(--muted); display: inline-block; width: 36px; }
#dgCard .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* ---------- search ---------- */
.search { position: relative; }
#search { width: 220px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font: 12.5px var(--sans); outline: none; }
#search:focus { border-color: var(--accent); width: 300px; }
#searchResults { position: absolute; top: 34px; left: 0; width: 380px; max-height: 60vh; overflow: auto; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; }
#searchResults[hidden] { display: none; }
.sr { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
.sr.on, .sr[data-ref]:hover { background: var(--accent-soft); }
.sr .lid { color: var(--tc); }
.srt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srf { font: 11px var(--mono); color: var(--muted); }
.sr.more { color: var(--muted); cursor: default; font-size: 12px; }
body.searching .loc[data-id]:not(.match) { opacity: .35; }
body.searching .loc.match { box-shadow: inset 3px 0 0 var(--accent); }
svg.searching .node.nomatch .dn { opacity: .15; }

/* ---------- narrative drift ---------- */
.st.drift, .dn .dr { color: var(--warn); font-size: 12px; margin-left: 4px; }
.drift-note { margin: 0 0 8px; padding: 6px 10px; border-radius: 8px; border: 1px dashed var(--warn); color: var(--warn); font: 12px/1.45 var(--sans); }
.drift-note code { color: inherit; }
.dn.drift { border-color: var(--warn); }

/* ---------- copy buttons ---------- */
.tcopy { background: none; border: 1px solid transparent; border-radius: 6px; color: var(--muted); padding: 0 6px; font-size: 13px; }
.tcopy:hover { color: var(--accent); border-color: var(--line); }

/* ---------- minimap ---------- */
#mini { position: absolute; left: 12px; bottom: 30px; z-index: 3; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; cursor: crosshair; box-shadow: var(--shadow); }
#miniView { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }

/* ---------- narrow screens ---------- */
@media (max-width: 900px) {
  body { overflow: auto; }
  #main { flex-direction: column; }
  #mapPane { width: auto !important; max-width: none; max-height: 48vh; }
  #splitter { display: none; }
  #rightPane { min-height: 60vh; }
  .top-title { display: none; }
  #search, #search:focus { width: 150px; }
  #searchResults { width: min(380px, 90vw); }
  #mini { display: none; }
  .anno, .anno-expl { margin-left: 16px; }
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <span class="brand">WAYMARK</span><span class="brand-sep"></span>
    <span class="top-title"></span>
    <div class="search">
      <input id="search" type="search" placeholder="Search nodes…  ( / )" autocomplete="off" spellcheck="false" aria-label="Search nodes">
      <div id="searchResults" hidden></div>
    </div>
    <div class="seg" role="tablist" aria-label="View">
      <button id="vCode" role="tab" title="Code view (d)">Code</button>
      <button id="vDiagram" role="tab" title="Diagram view (d)">Diagram</button>
    </div>
    <button class="tbtn" id="copyCtx" title="Copy the map as markdown context for an agent">Copy context</button>
    <button class="tbtn" id="settingsBtn" title="Editor link settings">⚙</button>
  </header>
  <div id="settings" hidden>
    <label>Local repo path <input id="setRoot" spellcheck="false"></label>
    <label>Editor
      <select id="setEditor">
        <option value="vscode">VS Code</option><option value="cursor">Cursor</option>
        <option value="windsurf">Windsurf / Devin Desktop</option><option value="idea">JetBrains</option>
      </select>
    </label>
  </div>
  <div id="main">
    <aside id="mapPane" aria-label="Map"></aside>
    <div id="splitter" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
    <section id="rightPane">
      <div id="codeView">
        <div id="fileTabs"></div>
        <div id="codeScroll"><div id="code"></div></div>
      </div>
      <div id="diagramView" hidden>
        <div class="dg-toolbar">
          <div class="legend" id="legend"></div>

<script id="waymark-data" type="application/json">{"doc":{"schemaVersion":1,"id":"verificacion-de-deriva-y-reanclaje-de-waymark-8c8a2e","title":"Verificación de deriva y reanclaje de Waymark","description":"Explica cómo Waymark detecta deriva de anclas [1d, 1g] y de narrativa [1h], reubica anclas [2d, 2i] y guarda correcciones opcionales [3a, 3b].","story":"Un mapa Waymark conserva rutas, líneas, texto y hashes que pueden quedar desfasados cuando cambia el código, y también prosa que puede dejar de describir ese código. La CLI [1a] y el MCP [1b] reúnen los mapas solicitados y entregan cada uno a `verifyMap` [1c]; este contrasta sus ubicaciones [1d] con el árbol de trabajo mediante `anchorLocation` [2a]. Si la ruta desapareció, se busca otra entre archivos rastreados por Git [2b]; después se intenta la línea previa [2d], el mismo texto en otra línea [2e] y, como último recurso, una coincidencia parcial o de símbolo [2f]. Cada resultado trae además un `ctxHash` del bloque de código alrededor del ancla [2i].\n\nEl informe separa tres señales: los hashes de archivo y los cambios de ubicación determinan `stale` [1e] [1f] [1g]; `unresolved` o `missing` determinan `broken` [1g]; y la comparación entre el `ctxHash` actual y el que tenía el código cuando se escribió la prosa produce la deriva narrativa por nodo, trazo e historia [1h]. Un ancla puede seguir `ok` y aun así su explicación estar desactualizada.\n\nSin `fix`, se informa la deriva sin persistir nuevos anclajes [3a]; con `fix`, se guardan el JSON y el visor HTML si hubo cambios de ancla, de hash o de contexto, o si faltaban líneas base narrativas [3b] [3c] [3d] [3e]. Las líneas base existentes no se sobrescriben, de modo que la prosa desfasada sigue marcada hasta reescribirla. La CLI muestra el estado, una línea de revisión narrativa y fija su salida según anclas rotas, `--strict` y `--strict-narrative` [3f] [3g]; un estado `fuzzy` merece revisión porque la cercanía textual no demuestra identidad semántica [2g].","language":"es","query":"How does waymark verify detect drift and re-anchor locations after code changes?","traces":[{"id":"1","title":"Entrada y diagnóstico de deriva","description":"Selecciona mapas, verifica ubicaciones y resume deriva de anclas, narrativa o anclas rotas.","motivation":"Los mapas son fotografías de ubicaciones del código y de la prosa que las explica; antes de usarlos, Waymark necesita saber si esas referencias todavía apuntan al mismo lugar y si la explicación sigue describiendo el código actual. Esta etapa concentra las dos entradas públicas y produce un diagnóstico común, para que CLI y MCP apliquen las mismas reglas de verificación.","details":"La CLI toma un ID o enumera todos los mapas [1a]; el MCP hace la misma selección y devuelve los informes como texto estructurado [1b]. `verifyMap` carga el JSON persistido y crea una `FileCache` compartida [1c], luego envía cada ubicación a `anchorLocation`, cuenta sus estados y detecta si cambió el `ctxHash` del bloque anclado [1d]. Para cada ubicación compara el hash de archivo guardado con el actual [1e] y registra movimientos, cambios de ruta o estados distintos de `ok` [1f].\n\nCon los resultados frescos, `narrativeDrift` determina qué nodos, guías de trazo e historia fueron escritos para código que ya cambió [1h]. `stale` se activa por cambios de ancla o de hash, mientras `broken` suma solo `unresolved` y `missing` [1g]; la deriva narrativa viaja aparte en `narrative`, así que un archivo puede estar cambiado o una explicación desfasada aunque todas las líneas ancladas sigan coincidiendo.","locations":[{"id":"1a","title":"Entrada CLI verify","description":"La CLI selecciona mapas y pasa la opción `fix` a `verifyMap`.","explanation":"El comando `verify` toma el primer argumento como ID; si falta, `listMaps` aporta todos los IDs. Cada ID llega a `verifyMap` con `opt.fix`, de modo que la selección no altera la lógica de cotejo. Después, la CLI traduce el informe a una línea de estado y cambios visibles [3f]. Si se verifican varios mapas, acumula fallos para decidir una sola salida [3g].","path":"src/cli.js","lineNumber":284,"lineContent":"const ids = rest[0] ? [rest[0]] : listMaps(r).map((m) => m.id);","status":"ok","fileHash":"ee028fc18c7e","ctxHash":"bca6983752e2","snippet":{"startLine":281,"code":"    }\n    case 'verify': {\n      const r = root();\n      const ids = rest[0] ? [rest[0]] : listMaps(r).map((m) => m.id);\n      let bad = false;\n      for (const id of ids) {\n        const v = verifyMap(r, id, { fix: opt.fix });\n        const state = v.broken ? 'BROKEN' : v.stale ? 'STALE' : 'OK';\n        out(`${state.padEnd(7)} ${v.id}  map@${v.mapCommit || '?'} head@${v.headCommit || '?'}${v.fixed ? '  (fixed)' : ''}`);\n        for (const c of v.changes) out(`        ${c.status.padEnd(10)} [${c.id}] ${c.from} -> ${c.to}${c.note ? '  ' + c.note : ''}`);\n        if (v.narrative.stale) {\n          const parts = [];\n          if (v.narrative.nodes.length) parts.push('nodes ' + v.narrative.nodes.map((n) => `[${n}]`).join(', '));\n          if (v.narrative.traces.length) parts.push('trace guides ' + v.narrative.traces.join(', '));\n          if (v.narrative.story) parts.push('story');\n          out(`        narrative  review ${parts.join('; ')} (code changed since written) → waymark refresh ${v.id}`);\n        }\n        if (v.broken || (opt.strict && v.stale && !v.fixed) || (opt['strict-narrative'] && v.narrative.stale)) bad = true;"},"narrativeHash":"bca6983752e2"},{"id":"1b","title":"Entrada MCP verify","description":"El MCP verifica un mapa o todos y devuelve sus informes.","explanation":"El controlador MCP resuelve primero la raíz indicada por el cliente y obtiene el ID solicitado o todos los IDs guardados. Invoca `verifyMap` para cada uno con el mismo valor `fix` que recibe la herramienta. Los objetos resultantes se devuelven mediante `text`, sin la presentación `OK`/`STALE`/`BROKEN` de la CLI. Por ello los consumidores MCP deben interpretar `stale`, `broken`, `counts` y `changes` del informe [1g].","path":"src/mcp.js","lineNumber":312,"lineContent":"return text(ids.map((i) => verifyMap(r, i, { fix })));","status":"ok","fileHash":"9337d0b00c21","ctxHash":"6983bf27cfdc","snippet":{"startLine":309,"code":"    safe(async ({ id, fix, root }) => {\n      const r = rootOf(root);\n      const ids = id ? [id] : listMaps(r).map((m) => m.id);\n      return text(ids.map((i) => verifyMap(r, i, { fix })));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_render',\n    {\n      title: 'Render waymark viewer',\n      description: 'Regenerates the self-contained HTML viewer of a waymark and optionally opens it in the default browser.',\n      inputSchema: { id: z.string(), open: z.boolean().optional(), root: rootArg },\n    },\n    safe(async ({ id, open, root }) => {\n      const r = rootOf(root);\n      const p = writeHtml(r, loadMap(r, id));\n      if (open) openFile(p);"},"narrativeHash":"6983bf27cfdc"},{"id":"1c","title":"Carga del mapa","description":"`verifyMap` carga el mapa y prepara caché, cambios y conteos.","explanation":"`loadMap` lee el documento JSON persistido que contiene los trazos y sus ubicaciones. `verifyMap` crea una `FileCache` por ejecución, además de listas para cambios, archivos con hash distinto y estados contados. La misma caché alimenta todas las llamadas posteriores a `anchorLocation` [1d], evitando releer rutas repetidas. Si el ID no identifica un mapa guardado, la carga falla antes de inspeccionar código.","path":"src/verify.js","lineNumber":12,"lineContent":"const doc = loadMap(root, id);","status":"ok","fileHash":"0d87234eb5bf","ctxHash":"d579683f241f","snippet":{"startLine":9,"code":" * (narrative baselines are kept, so drifted prose stays flagged until it is rewritten).\n */\nexport function verifyMap(root, id, { fix = false } = {}) {\n  const doc = loadMap(root, id);\n  const cache = new FileCache(root);\n  const changes = [];\n  const changedFiles = new Set();\n  const counts = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0 };\n  let ctxChanged = false;\n\n  const fresh = { ...doc, traces: [] };\n  for (const trace of doc.traces) {\n    const results = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      counts[r.status]++;\n      if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      if (r.ctxHash !== loc.ctxHash) ctxChanged = true;\n      if (r.status !== 'ok' || r.lineNumber !== loc.lineNumber || r.path !== loc.path) {"},"narrativeHash":"d579683f241f"},{"id":"1d","title":"Comprueba cada ubicación","description":"Cada ubicación pasa por `anchorLocation`, suma un estado y compara su `ctxHash`.","explanation":"`verifyMap` recorre `doc.traces` y transforma cada `trace.locations` con `map`. Para cada `loc`, `anchorLocation` contrasta el ancla guardada con el archivo de trabajo y devuelve un resultado `r` con ruta, línea, hashes y fragmento [2i]. Ese estado incrementa `counts`, que después determina `broken` [1g]. Además compara el `ctxHash` nuevo con el guardado: si el bloque alrededor del ancla cambió, activa `ctxChanged`, que obliga a reescribir con `fix` aunque el ancla no se haya movido [3b]. La función siempre devuelve `r`; los resultados forman una copia `fresh` del mapa y solo reemplazan las ubicaciones guardadas con `fix` [3a].","path":"src/verify.js","lineNumber":22,"lineContent":"const r = anchorLocation(cache, loc);","status":"ok","fileHash":"0d87234eb5bf","ctxHash":"d0cea763382a","snippet":{"startLine":19,"code":"  const fresh = { ...doc, traces: [] };\n  for (const trace of doc.traces) {\n    const results = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      counts[r.status]++;\n      if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      if (r.ctxHash !== loc.ctxHash) ctxChanged = true;\n      if (r.status !== 'ok' || r.lineNumber !== loc.lineNumber || r.path !== loc.path) {\n        changes.push({\n          id: loc.id,\n          status: r.status,\n          from: `${loc.path}:${loc.lineNumber}`,\n          to: `${r.path}:${r.lineNumber}`,\n          note: r.note,\n        });\n      }\n      return r;\n    });"},"narrativeHash":"d0cea763382a"},{"id":"1e","title":"Detecta hash cambiado","description":"Un hash diferente registra el archivo en `changedFiles`.","explanation":"La ubicación conserva `loc.fileHash` y el nuevo anclaje devuelve `r.fileHash` del archivo leído [2a]. Si ambos existen y difieren, se añade `r.path` a un `Set`, por lo que una ruta aparece una sola vez aunque tenga varias ubicaciones. Ese conjunto contribuye a `stale` [1g] incluso cuando el texto de todas las líneas ancladas aún coincide. Es una señal más gruesa que el `ctxHash` de [1d]: cualquier edición del archivo la activa, aunque ocurra lejos de los bloques anclados. Al faltar cualquiera de los hashes, esta comparación no registra cambio.","path":"src/verify.js","lineNumber":24,"lineContent":"if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);","status":"ok","fileHash":"0d87234eb5bf","ctxHash":"73b0834c9c3a","snippet":{"startLine":21,"code":"    const results = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      counts[r.status]++;\n      if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      if (r.ctxHash !== loc.ctxHash) ctxChanged = true;\n      if (r.status !== 'ok' || r.lineNumber !== loc.lineNumber || r.path !== loc.path) {\n        changes.push({\n          id: loc.id,\n          status: r.status,\n          from: `${loc.path}:${loc.lineNumber}`,\n          to: `${r.path}:${r.lineNumber}`,\n          note: r.note,\n        });\n      }\n      return r;\n    });\n    fresh.traces.push({ ...trace, locations: results });\n    if (fix) trace.locations = results;"},"narrativeHash":"73b0834c9c3a"},{"id":"1f","title":"Registra cambios de ubicación","description":"Registra estado, origen y destino cuando cambia una ubicación.","explanation":"Después del reanclaje [1d], `verifyMap` compara estado, línea y ruta con la ubicación almacenada. Si algo difiere, añade a `changes` el ID, estado, origen, destino y nota que produjo `anchorLocation`. Esos cambios alimentan `stale` [1g] y las líneas de detalle de la CLI [3f]. Un `fuzzy` se registra aunque conserve ruta y línea, porque su estado ya no es `ok` [2g].","path":"src/verify.js","lineNumber":26,"lineContent":"if (r.status !== 'ok' || r.lineNumber !== loc.lineNumber || r.path !== loc.path) {","status":"ok","fileHash":"0d87234eb5bf","ctxHash":"4f860b1c24c7","snippet":{"startLine":23,"code":"      counts[r.status]++;\n      if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      if (r.ctxHash !== loc.ctxHash) ctxChanged = true;\n      if (r.status !== 'ok' || r.lineNumber !== loc.lineNumber || r.path !== loc.path) {\n        changes.push({\n          id: loc.id,\n          status: r.status,\n          from: `${loc.path}:${loc.lineNumber}`,\n          to: `${r.path}:${r.lineNumber}`,\n          note: r.note,\n        });\n      }\n      return r;\n    });\n    fresh.traces.push({ ...trace, locations: results });\n    if (fix) trace.locations = results;\n  }\n"},"narrativeHash":"4f860b1c24c7"},{"id":"1h","title":"Detecta deriva narrativa","description":"Compara las líneas base narrativas con los `ctxHash` actuales del mapa fresco.","explanation":"Antes de medir, `baselineNarrative(fresh)` asigna línea base a nodos, trazos o historia que no la tenían, para que los mapas creados antes del seguimiento narrativo no den falsas alarmas. `narrativeDrift` marca un nodo cuando su `narrativeHash` (el `ctxHash` del código cuando se escribió la prosa) difiere del `ctxHash` actual [1d]; un trazo cuando cambia el hash combinado de sus nodos; y la historia cuando cambia el de todos los trazos. El resultado viaja en `narrative` y no altera `stale` ni `broken` [1g]. La CLI lo muestra como revisión pendiente [3f], puede fallar con `--strict-narrative` [3g] y, con `fix`, se guarda en los metadatos [3c].","path":"src/verify.js","lineNumber":43,"lineContent":"const drift = narrativeDrift(fresh);","symbol":"narrativeDrift","status":"ok","fileHash":"0d87234eb5bf","ctxHash":"429cd4bcfcfa","snippet":{"startLine":40,"code":"\n  // Maps created before narrative tracking get a baseline instead of a false alarm.\n  baselineNarrative(fresh);\n  const drift = narrativeDrift(fresh);\n\n  const broken = counts.unresolved + counts.missing;\n  const result = {\n    id: doc.id,\n    title: doc.title,\n    mapCommit: doc.meta?.commit?.slice(0, 8) || null,\n    headCommit: headCommit(root)?.slice(0, 8) || null,\n    counts,\n    changedFiles: [...changedFiles],\n    changes,\n    narrative: drift,\n    stale: changes.length > 0 || changedFiles.size > 0,\n    broken,\n    fixed: false,"},"narrativeHash":"429cd4bcfcfa"},{"id":"1g","title":"Calcula estado global","description":"`stale` marca deriva y `broken` cuenta anclas sin resolver.","explanation":"El informe considera `broken` la suma de ubicaciones `unresolved` y `missing`, contadas durante el recorrido [1d]. Considera `stale` cualquier entrada en `changes` [1f] o cualquier archivo con hash diferente [1e]. Así, `moved`, `relocated` y `fuzzy` pueden señalar deriva sin sumar a `broken`; `fuzzy` sigue requiriendo juicio humano [2g]. La deriva narrativa [1h] se reporta aparte en `narrative`. La CLI prioriza `BROKEN` al mostrar el resultado [3f].","path":"src/verify.js","lineNumber":55,"lineContent":"stale: changes.length > 0 || changedFiles.size > 0,","status":"ok","fileHash":"0d87234eb5bf","ctxHash":"98e7c2e224a2","snippet":{"startLine":52,"code":"    changedFiles: [...changedFiles],\n    changes,\n    narrative: drift,\n    stale: changes.length > 0 || changedFiles.size > 0,\n    broken,\n    fixed: false,\n  };\n  const needsBaseline = doc.traces.some((t) => !t.narrativeHash || t.locations.some((l) => !l.narrativeHash));\n  if (fix && (changes.length || changedFiles.size || ctxChanged || needsBaseline)) {\n    baselineNarrative(doc);\n    doc.meta = {\n      ...doc.meta,\n      verifiedAt: new Date().toISOString(),\n      commit: headCommit(root),\n      anchors: { ...counts },\n      narrativeDrift: drift.stale ? { nodes: drift.nodes, traces: drift.traces, story: drift.story } : undefined,\n    };\n    persist(root, doc);"},"narrativeHash":"98e7c2e224a2"}],"tree":[{"label":"Entradas","children":[{"ref":"1a"},{"ref":"1b"}]},{"ref":"1c","children":[{"ref":"1d","children":[{"ref":"1e"},{"ref":"1f"}]},{"ref":"1h"},{"ref":"1g"}]}],"narrativeHash":"82ca6fab619e"},{"id":"2","title":"Búsqueda y clasificación del ancla","description":"Busca cada ancla en el código actual y clasifica el resultado.","motivation":"Un número de línea aislado envejece en cuanto alguien inserta o mueve código. Esta etapa busca evidencia textual en el archivo actual y distingue coincidencias seguras de aproximaciones que deben inspeccionarse.","details":"`FileCache` lee el archivo dentro del repositorio, reutiliza la lectura y calcula un hash normalizado [2a]. Si no puede leer la ruta original, intenta localizar un archivo Git con el mismo nombre base [2b]; sin archivo legible devuelve `missing` [2c]. Con el archivo disponible, `anchorLocation` compara primero la línea anterior tras normalizar espacios [2d], luego el texto exacto más cercano [2e]. Si no hay coincidencia exacta, prueba inclusión parcial y después el símbolo [2f], clasificando el resultado como `fuzzy` [2g]. Una ruta alternativa con coincidencia `ok` o `moved` se marca `relocated` [2h]; al final devuelve ruta, línea, estado, hash de archivo, `ctxHash` del bloque anclado, fragmento y notas para el diagnóstico, la deriva narrativa o la corrección [2i].","locations":[{"id":"2a","title":"Lee archivo actual","description":"`FileCache` lee UTF-8, divide líneas y calcula un hash normalizado.","explanation":"`cache.read` resuelve la ruta bajo la raíz mediante `safeJoin` y acepta solo archivos de hasta 4 MiB. Lee UTF-8, separa líneas y calcula SHA-1 abreviado tras normalizar CRLF a LF; guarda el resultado para futuras ubicaciones del mismo archivo. `anchorLocation` consume esas líneas para buscar texto [2d] y devuelve el hash a la comparación global [1e]. Un archivo grande, ilegible o fuera de la raíz produce una entrada nula y puede terminar como `missing` [2c].","path":"src/anchor.js","lineNumber":36,"lineContent":"const text = fs.readFileSync(abs, 'utf8');","status":"ok","fileHash":"ca1778435482","ctxHash":"e42b5167ebb4","snippet":{"startLine":33,"code":"      const abs = safeJoin(this.root, rel);\n      const stat = fs.statSync(abs);\n      if (stat.isFile() && stat.size \u003c= MAX_FILE_BYTES) {\n        const text = fs.readFileSync(abs, 'utf8');\n        entry = {\n          lines: text.split(/\\r?\\n/),\n          hash: crypto.createHash('sha1').update(text.replace(/\\r\\n/g, '\\n')).digest('hex').slice(0, 12),\n        };\n      }\n    } catch {\n      entry = null;\n    }\n    this.files.set(rel, entry);\n    return entry;\n  }\n\n  /** Finds a moved/renamed file by basename when the original path is gone. */\n  findByBasename(rel) {"},"narrativeHash":"e42b5167ebb4"},{"id":"2b","title":"Busca archivo trasladado","description":"Si falla la ruta, busca entre archivos Git con igual nombre base.","explanation":"`anchorLocation` recurre a `findByBasename` únicamente cuando `cache.read` no pudo leer la ruta original [2a]. La búsqueda usa archivos rastreados por Git; admite un único nombre base o un candidato distinguible por sufijo de ruta, y luego intenta leerlo. Si lo logra, conserva la ruta antigua en `relocatedFrom` y continúa buscando el texto dentro de la alternativa [2d]. Un cambio de nombre base o candidatos ambiguos pueden impedir la recuperación y desembocar en `missing` [2c].","path":"src/anchor.js","lineNumber":85,"lineContent":"const alt = cache.findByBasename(relPath);","status":"ok","fileHash":"ca1778435482","ctxHash":"6ea2b704c68a","snippet":{"startLine":82,"code":"  let file = cache.read(relPath);\n  let relocatedFrom = null;\n  if (!file) {\n    const alt = cache.findByBasename(relPath);\n    if (alt && (file = cache.read(alt))) {\n      relocatedFrom = relPath;\n      relPath = alt;\n    }\n  }\n  if (!file) {\n    return { ...loc, status: 'missing', note: `File not found: ${loc.path}` };\n  }\n\n  const { lines } = file;\n  const wanted = norm(loc.lineContent);\n  const idx0 = Math.min(Math.max(loc.lineNumber - 1, 0), lines.length - 1);\n  let idx = -1;\n  let status = 'unresolved';"},"narrativeHash":"6ea2b704c68a"},{"id":"2c","title":"Marca archivo ausente","description":"Sin archivo legible, devuelve `missing` antes de buscar texto.","explanation":"Si fallan tanto la ruta original como la alternativa [2b], `anchorLocation` retorna una copia de `loc` con estado `missing` y una nota. No calcula un hash nuevo ni examina líneas, porque no hay contenido que comparar. `verifyMap` cuenta este estado como ancla rota [1g] y lo incluye en `changes` [1f]. La causa puede ser ausencia real, tamaño superior al límite o error de lectura [2a].","path":"src/anchor.js","lineNumber":92,"lineContent":"return { ...loc, status: 'missing', note: `File not found: ${loc.path}` };","status":"ok","fileHash":"ca1778435482","ctxHash":"faca0f3de148","snippet":{"startLine":89,"code":"    }\n  }\n  if (!file) {\n    return { ...loc, status: 'missing', note: `File not found: ${loc.path}` };\n  }\n\n  const { lines } = file;\n  const wanted = norm(loc.lineContent);\n  const idx0 = Math.min(Math.max(loc.lineNumber - 1, 0), lines.length - 1);\n  let idx = -1;\n  let status = 'unresolved';\n\n  if (!wanted || norm(lines[idx0]) === wanted) {\n    idx = idx0;\n    status = 'ok';\n  } else {\n    const exact = [];\n    lines.forEach((l, i) => norm(l) === wanted && exact.push(i));"},"narrativeHash":"faca0f3de148"},{"id":"2d","title":"Comprueba línea original","description":"Compara primero el texto normalizado en la línea anterior.","explanation":"Con el archivo abierto, `anchorLocation` normaliza `loc.lineContent` y acota `loc.lineNumber` al rango de líneas actual. Si la línea indicada coincide tras colapsar espacios, marca `ok` y evita búsquedas más costosas. Si `lineContent` está vacío también acepta esa posición, una limitación importante porque falta evidencia textual. Cuando no coincide, busca la misma línea en otra posición [2e].","path":"src/anchor.js","lineNumber":101,"lineContent":"if (!wanted || norm(lines[idx0]) === wanted) {","status":"ok","fileHash":"ca1778435482","ctxHash":"e0d62e67aaa5","snippet":{"startLine":98,"code":"  let idx = -1;\n  let status = 'unresolved';\n\n  if (!wanted || norm(lines[idx0]) === wanted) {\n    idx = idx0;\n    status = 'ok';\n  } else {\n    const exact = [];\n    lines.forEach((l, i) => norm(l) === wanted && exact.push(i));\n    if (exact.length) {\n      idx = nearest(exact, idx0);\n      status = 'moved';\n    } else {\n      const partial = [];\n      if (wanted.length >= 6) {\n        lines.forEach((l, i) => {\n          const n = norm(l);\n          if (n.length >= 6 && (n.includes(wanted) || wanted.includes(n))) partial.push(i);"},"narrativeHash":"e0d62e67aaa5"},{"id":"2e","title":"Busca texto exacto","description":"Busca el texto exacto normalizado más cercano y marca `moved`.","explanation":"Si la línea anterior ya no coincide [2d], la función reúne todas las líneas cuyo texto normalizado iguala `wanted`. `nearest` elige la más cercana al índice guardado y clasifica el resultado como `moved`. La proximidad reduce ambigüedad cuando el mismo texto aparece varias veces, pero no prueba que sea la misma instrucción lógica. Si no hay igualdad exacta, el proceso pasa a la búsqueda aproximada [2f].","path":"src/anchor.js","lineNumber":108,"lineContent":"idx = nearest(exact, idx0);","status":"ok","fileHash":"ca1778435482","ctxHash":"2e6ea77bb67b","snippet":{"startLine" atus === 'moved')) status = 'relocated';\n\n  const anchorIdx = idx >= 0 ? idx : idx0;\n  const start = Math.max(0, anchorIdx - SNIPPET_BEFORE);\n  const end = Math.min(lines.length, anchorIdx + SNIPPET_AFTER + 1);"},"narrativeHash":"33b796cf156b"},{"id":"2g","title":"Clasifica coincidencia aproximada","description":"La coincidencia aproximada más cercana recibe estado `fuzzy`.","explanation":"La lista de candidatos parciales o por símbolo [2f] se reduce al índice más cercano a la línea anterior. El estado `fuzzy` distingue esta pista de una igualdad textual y genera una nota para comprobarla. `verifyMap` registra el estado como cambio [1f], pero no lo suma a `broken` [1g]. Antes de aceptar `fix`, conviene revisar el fragmento devuelto [2i], porque la cercanía no garantiza la misma función.","path":"src/anchor.js","lineNumber":124,"lineContent":"status = 'fuzzy';","status":"ok","fileHash":"ca1778435482","ctxHash":"9486745b2c6a","snippet":{"startLine":121,"code":"      }\n      if (partial.length) {\n        idx = nearest(partial, idx0);\n        status = 'fuzzy';\n      }\n    }\n  }\n  if (relocatedFrom && (status === 'ok' || status === 'moved')) status = 'relocated';\n\n  const anchorIdx = idx >= 0 ? idx : idx0;\n  const start = Math.max(0, anchorIdx - SNIPPET_BEFORE);\n  const end = Math.min(lines.length, anchorIdx + SNIPPET_AFTER + 1);\n  const result = {\n    ...loc,\n    path: relPath,\n    lineNumber: anchorIdx + 1,\n    status,\n    fileHash: file.hash,"},"narrativeHash":"9486745b2c6a"},{"id":"2h","title":"Marca archivo reubicado","description":"Una ruta alternativa con coincidencia segura se clasifica `relocated`.","explanation":"Cuando se usó una ruta alternativa [2b] y la búsqueda terminó en `ok` o `moved`, el estado pasa a `relocated`. Así el informe expresa el cambio de archivo aunque el texto permanezca idéntico. Una coincidencia `fuzzy` en un archivo trasladado mantiene su estado aproximado y conserva una nota sobre la ruta antigua [2i]. Si se aplica `fix`, la nueva ruta pasa al mapa persistido [3a] [3d].","path":"src/anchor.js","lineNumber":128,"lineContent":"if (relocatedFrom && (status === 'ok' || status === 'moved')) status = 'relocated';","status":"ok","fileHash":"ca1778435482","ctxHash":"66cbece11b49","snippet":{"startLine":125,"code":"      }\n    }\n  }\n  if (relocatedFrom && (status === 'ok' || status === 'moved')) status = 'relocated';\n\n  const anchorIdx = idx >= 0 ? idx : idx0;\n  const start = Math.max(0, anchorIdx - SNIPPET_BEFORE);\n  const end = Math.min(lines.length, anchorIdx + SNIPPET_AFTER + 1);\n  const result = {\n    ...loc,\n    path: relPath,\n    lineNumber: anchorIdx + 1,\n    status,\n    fileHash: file.hash,\n    ctxHash: contextHash(lines, anchorIdx),\n    snippet: { startLine: start + 1, code: lines.slice(start, end).join('\\n') },\n  };\n  if (idx >= 0) result.lineContent = lines[anchorIdx].trim();"},"narrativeHash":"66cbece11b49"},{"id":"2i","title":"Devuelve ancla actualizada","description":"Devuelve ruta, línea, estado, hashes, fragmento y notas del ancla.","explanation":"`anchorLocation` construye el resultado a partir de `loc`, sustituyendo ruta, línea, estado, hash del archivo, `ctxHash` y un fragmento alrededor del candidato. `ctxHash` lo calcula `contextHash` sobre el bloque de código del ancla, ignorando espacios: mover el bloque lo conserva, editarlo lo cambia, y eso alimenta la detección de cambios de contexto [1d] y de deriva narrativa [1h]. Solo actualiza `lineContent` cuando encontró una posición; si quedó `unresolved`, usa la línea previa acotada para mostrar contexto sin fingir coincidencia. Las notas explican traslado, desplazamiento, coincidencia parcial o texto ausente, y viajan a `changes` [1f]. Con `fix`, ese resultado se convierte en la ubicación guardada [3a].","path":"src/anchor.js","lineNumber":133,"lineContent":"const result = {","status":"ok","fileHash":"ca1778435482","ctxHash":"218db3045bd7","snippet":{"startLine":130,"code":"  const anchorIdx = idx >= 0 ? idx : idx0;\n  const start = Math.max(0, anchorIdx - SNIPPET_BEFORE);\n  const end = Math.min(lines.length, anchorIdx + SNIPPET_AFTER + 1);\n  const result = {\n    ...loc,\n    path: relPath,\n    lineNumber: anchorIdx + 1,\n    status,\n    fileHash: file.hash,\n    ctxHash: contextHash(lines, anchorIdx),\n    snippet: { startLine: start + 1, code: lines.slice(start, end).join('\\n') },\n  };\n  if (idx >= 0) result.lineContent = lines[anchorIdx].trim();\n  const notes = [];\n  if (relocatedFrom) notes.push(`file moved from ${relocatedFrom}`);\n  if (status !== 'ok' && status !== 'unresolved' && loc.lineNumber !== anchorIdx + 1) {\n    notes.push(`line ${loc.lineNumber} -> ${anchorIdx + 1}`);\n  }"},"narrativeHash":"218db3045bd7"}],"tree":[{"ref":"2a","children":[{"ref":"2b","children":[{"ref":"2c"}]},{"ref":"2d","children":[{"ref":"2e","children":[{"ref":"2f","children":[{"ref":"2g"}]}]}]},{"ref":"2h"},{"ref":"2i"}]}],"narrativeHash":"2b5e8ae2dea3"},{"id":"3","title":"Corrección, escritura y salida","description":"Aplica correcciones opcionales, actualiza archivos y comunica el resultado.","motivation":"Verificar debe servir tanto para inspección sin cambios como para mantener el mapa alineado con el código. Esta etapa controla cuándo se persisten los resultados, cómo se conserva la señal de prosa desfasada y cómo se interpreta el diagnóstico desde la CLI.","details":"Los resultados calculados reemplazan las ubicaciones del documento en memoria solo si se solicitó `fix` [3a]. La escritura se activa cuando esa opción coincide con algún cambio de ancla, de hash de archivo o de `ctxHash`, o con líneas base narrativas ausentes [3b]; entonces se completan esas líneas base sin sobrescribir las existentes, se registran hora de verificación, commit, conteos y deriva narrativa [3c], se persiste el JSON [3d] y se regenera el visor HTML [3e].\n\nLa CLI muestra `BROKEN`, `STALE` u `OK`, en ese orden de prioridad, además de cada cambio y, si procede, una línea de revisión narrativa [3f]. Su código de salida falla por anclas rotas, por deriva sin fijar bajo `--strict` o por narrativa desfasada bajo `--strict-narrative` [3g]. El indicador `fixed` significa que hubo persistencia, pero no certifica que las ubicaciones `unresolved` o `missing` hayan quedado resueltas ni que la prosa esté al día [1g] [1h] [3b].","locations":[{"id":"3a","title":"Aplica resultados con fix","description":"Solo con `fix` las ubicaciones del documento se reemplazan por las recalculadas.","explanation":"Cada trazo produce `results`, el arreglo de anclas recalculadas por [1d], que siempre se copia al mapa `fresh` para medir la deriva narrativa contra el código actual [1h]. Solo con `fix` se reemplaza `trace.locations` en el documento cargado, de modo que lo que se persistirá lleva rutas, líneas, `ctxHash` y fragmentos nuevos. Sin `fix`, `doc` queda intacto y el informe describe la deriva sin tocar archivos. El reemplazo en memoria no basta para escribir: también debe cumplirse la condición de [3b].","path":"src/verify.js","lineNumber":38,"lineContent":"if (fix) trace.locations = results;","status":"ok","fileHash":"0d87234eb5bf","ctxHash":"e0883cd801ce","snippet":{"startLine":35,"code":"      return r;\n    });\n    fresh.traces.push({ ...trace, locations: results });\n    if (fix) trace.locations = results;\n  }\n\n  // Maps created before narrative tracking get a baseline instead of a false alarm.\n  baselineNarrative(fresh);\n  const drift = narrativeDrift(fresh);\n\n  const broken = counts.unresolved + counts.missing;\n  const result = {\n    id: doc.id,\n    title: doc.title,\n    mapCommit: doc.meta?.commit?.slice(0, 8) || null,\n    headCommit: headCommit(root)?.slice(0, 8) || null,\n    counts,\n    changedFiles: [...changedFiles],"},"narrativeHash":"e0883cd801ce"},{"id":"3b","title":"Guarda solo con cambios","description":"Con `fix` y cambios de ancla, hash o contexto, persiste mapa y visor.","explanation":"El bloque de escritura requiere `fix` y alguna de cuatro señales: cambios de ubicación [1f], archivos con hash distinto [1e], un `ctxHash` distinto aunque el ancla no se moviera (`ctxChanged`, [1d]) o nodos y trazos sin `narrativeHash` (`needsBaseline`, mapas anteriores al seguimiento narrativo). Sin ninguna, el mapa no se reescribe. Al entrar, `baselineNarrative(doc)` solo rellena líneas base ausentes; no sobrescribe las existentes, así que la prosa desfasada sigue marcada hasta reescribirla con `waymark_annotate` [1h]. Luego actualiza metadatos [3c], guarda JSON [3d], regenera HTML [3e] y marca `fixed: true`, incluso si quedan ubicaciones `unresolved` o `missing` [1g].","path":"src/verify.js","lineNumber":60,"lineContent":"if (fix && (changes.length || changedFiles.size || ctxChanged || needsBaseline)) {","status":"ok","fileHash":"0d87234eb5bf","ctxHash":"f81a8e6757e1","snippet":{"startLine":57,"code":"    fixed: false,\n  };\n  const needsBaseline = doc.traces.some((t) => !t.narrativeHash || t.locations.some((l) => !l.narrativeHash));\n  if (fix && (changes.length || changedFiles.size || ctxChanged || needsBaseline)) {\n    baselineNarrative(doc);\n    doc.meta = {\n      ...doc.meta,\n      verifiedAt: new Date().toISOString(),\n      commit: headCommit(root),\n      anchors: { ...counts },\n      narrativeDrift: drift.stale ? { nodes: drift.nodes, traces: drift.traces, story: drift.story } : undefined,\n    };\n    persist(root, doc);\n    writeHtml(root, doc);\n    result.fixed = true;\n  }\n  return result;\n}"},"narrativeHash":"f81a8e6757e1"},{"id":"3c","title":"Actualiza metadatos","description":"Actualiza hora, commit, conteos y deriva narrativa antes de persistir.","explanation":"Al entrar al bloque de corrección [3b], `verifyMap` conserva los metadatos existentes y añade `verifiedAt`. También reemplaza el commit registrado por `headCommit(root)`, guarda una copia de `counts` y, si hay deriva narrativa [1h], la lista de nodos, trazos e historia en `narrativeDrift` (o `undefined` si no la hay). Esos datos acompañan a las ubicaciones corregidas en el JSON [3d]. El commit identifica HEAD, mientras la comparación de archivos se hizo contra el árbol de trabajo, que puede incluir cambios no confirmados.","path":"src/verify.js","lineNumber":62,"lineContent":"doc.meta = {","status":"ok","fileHash":"0d87234eb5bf","ctxHash":"b357c4392222","snippet":{"startLine":59,"code":"  const needsBaseline = doc.traces.some((t) => !t.narrativeHash || t.locations.some((l) => !l.narrativeHash));\n  if (fix && (changes.length || changedFiles.size || ctxChanged || needsBaseline)) {\n    baselineNarrative(doc);\n    doc.meta = {\n      ...doc.meta,\n      verifiedAt: new Date().toISOString(),\n      commit: headCommit(root),\n      anchors: { ...counts },\n      narrativeDrift: drift.stale ? { nodes: drift.nodes, traces: drift.traces, story: drift.story } : undefined,\n    };\n    persist(root, doc);\n    writeHtml(root, doc);\n    result.fixed = true;\n  }\n  return result;\n}\n"},"narrativeHash":"b357c4392222"},{"id":"3d","title":"Persiste mapa JSON","description":"`persist` escribe el documento corregido en el JSON del mapa.","explanation":"Tras actualizar las ubicaciones [3a] y los metadatos [3c], `persist` serializa el documento completo en `.waymark/\u003cid>.json`. Ese archivo será la referencia almacenada que cargará una verificación futura [1c]. La escritura ocurre incluso cuando la única deriva detectada fue un hash o un cambio de contexto, porque [3b] acepta varias señales. No hay una validación adicional que convierta un resultado `fuzzy` en coincidencia segura antes de guardar.","path":"src/verify.js","lineNumber":69,"lineContent":"persist(root, doc);","status":"ok","fileHash":"0d87234eb5bf","ctxHash":"5e85a3a05217","snippet":{"startLine":66,"code":"      anchors: { ...counts },\n      narrativeDrift: drift.stale ? { nodes: drift.nodes, traces: drift.traces, story: drift.story } : undefined,\n    };\n    persist(root, doc);\n    writeHtml(root, doc);\n    result.fixed = true;\n  }\n  return result;\n}\n"},"narrativeHash":"5e85a3a05217"},{"id":"3e","title":"Regenera visor HTML","description":"Regenera el visor HTML desde el documento actualizado.","explanation":"Después de persistir el JSON [3d], `writeHtml` renderiza `.waymark/\u003cid>.html` con el documento actualizado. El visor refleja las rutas y fragmentos que `anchorLocation` entregó [2i] y puede incorporar una instantánea de archivos referenciados. Mantener ambos artefactos sincronizados evita que el lector vea anclas antiguas en el HTML. Si falta un archivo para la instantánea, el visor usa el fragmento almacenado.","path":"src/verify.js","lineNumber":70,"lineContent":"writeHtml(root, doc);","status":"ok","fileHash":"0d87234eb5bf","ctxHash":"e22c26eebdd3","snippet":{"startLine":67,"code":"      narrativeDrift: drift.stale ? { nodes: drift.nodes, traces: drift.traces, story: drift.story } : undefined,\n    };\n    persist(root, doc);\n    writeHtml(root, doc);\n    result.fixed = true;\n  }\n  return result;\n}\n"},"narrativeHash":"e22c26eebdd3"},{"id":"3f","title":"Reporta estado CLI","description":"La CLI muestra `BROKEN`, `STALE` u `OK`, los cambios y la revisión narrativa.","explanation":"Para cada informe de `verifyMap` [1a], la CLI elige `BROKEN` si `broken` es positivo, luego `STALE` si `stale` es verdadero y, si no, `OK`. Imprime el ID, commits del mapa y HEAD y la marca `(fixed)` cuando hubo escritura. También muestra cada entrada de `changes` con estado, origen, destino y nota [1f]. Si `narrative.stale`, añade una línea `narrative review` que enumera nodos, guías de trazo e historia afectados y sugiere `waymark refresh \u003cid>` [1h]. El rótulo puede seguir diciendo `STALE` en la ejecución que aplicó `fix`, porque `stale` describe la deriva detectada antes de guardar.","path":"src/cli.js","lineNumber":288,"lineContent":"const state = v.broken ? 'BROKEN' : v.stale ? 'STALE' : 'OK';","status":"ok","fileHash":"ee028fc18c7e","ctxHash":"afab7a169973","snippet":{"startLine":285,"code":"      let bad = false;\n      for (const id of ids) {\n        const v = verifyMap(r, id, { fix: opt.fix });\n        const state = v.broken ? 'BROKEN' : v.stale ? 'STALE' : 'OK';\n        out(`${state.padEnd(7)} ${v.id}  map@${v.mapCommit || '?'} head@${v.headCommit || '?'}${v.fixed ? '  (fixed)' : ''}`);\n        for (const c of v.changes) out(`        ${c.status.padEnd(10)} [${c.id}] ${c.from} -> ${c.to}${c.note ? '  ' + c.note : ''}`);\n        if (v.narrative.stale) {\n          const parts = [];\n          if (v.narrative.nodes.length) parts.push('nodes ' + v.narrative.nodes.map((n) => `[${n}]`).join(', '));\n          if (v.narrative.traces.length) parts.push('trace guides ' + v.narrative.traces.join(', '));\n          if (v.narrative.story) parts.push('story');\n          out(`        narrative  review ${parts.join('; ')} (code changed since written) → waymark refresh ${v.id}`);\n        }\n        if (v.broken || (opt.strict && v.stale && !v.fixed) || (opt['strict-narrative'] && v.narrative.stale)) bad = true;\n      }\n      if (bad) process.exitCode = 1;\n      return;\n    }"},"narrativeHash":"afab7a169973"},{"id":"3g","title":"Decide código de salida","description":"Falla por anclas rotas, deriva estricta sin fijar o narrativa desfasada.","explanation":"La CLI acumula `bad` mientras procesa uno o varios mapas [1a]. Lo activa si el informe tiene `broken`, si `--strict` encuentra `stale` sin `fixed`, o si `--strict-narrative` encuentra deriva narrativa [1h]. Al terminar, establece `process.exitCode = 1` solo cuando `bad` es verdadero, lo que permite usar la verificación en automatizaciones. `--fix` puede suprimir el fallo estricto por deriva de anclas guardada, pero no un fallo por anclas rotas [1g] ni por narrativa desfasada, que persiste hasta reescribir la prosa.","path":"src/cli.js","lineNumber":298,"lineContent":"if (v.broken || (opt.strict && v.stale && !v.fixed) || (opt['strict-narrative'] && v.narrative.stale)) bad = true;","status":"
