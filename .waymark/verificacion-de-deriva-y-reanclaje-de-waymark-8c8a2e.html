>= 0 ? idx : idx0;\n  const start = Math.max(0, anchorIdx - SNIPPET_BEFORE);\n  const end = Math.min(lines.length, anchorIdx + SNIPPET_AFTER + 1);\n  const result = {\n    ...loc,\n    path: relPath,\n    lineNumber: anchorIdx + 1,\n    status,\n    fileHash: file.hash,"},"explanation":"La lista de candidatos parciales o por símbolo [2f] se reduce al índice más cercano a la línea anterior. El estado `fuzzy` distingue esta pista de una igualdad textual y genera una nota para comprobarla. `verifyMap` registra el estado como cambio [1f], pero no lo suma a `broken` [1g]. Antes de aceptar `fix`, conviene revisar el fragmento devuelto [2i], porque la cercanía no garantiza la misma función."},{"id":"2h","title":"Marca archivo reubicado","description":"Una ruta alternativa con coincidencia segura se clasifica `relocated`.","path":"src/anchor.js","lineNumber":128,"lineContent":"if (relocatedFrom && (status === 'ok' || status === 'moved')) status = 'relocated';","status":"ok","fileHash":"dfa36f28dad8","snippet":{"startLine":125,"code":"      }\n    }\n  }\n  if (relocatedFrom && (status === 'ok' || status === 'moved')) status = 'relocated';\n\n  const anchorIdx = idx >= 0 ? idx : idx0;\n  const start = Math.max(0, anchorIdx - SNIPPET_BEFORE);\n  const end = Math.min(lines.length, anchorIdx + SNIPPET_AFTER + 1);\n  const result = {\n    ...loc,\n    path: relPath,\n    lineNumber: anchorIdx + 1,\n    status,\n    fileHash: file.hash,\n    snippet: { startLine: start + 1, code: lines.slice(start, end).join('\\n') },\n  };\n  if (idx >= 0) result.lineContent = lines[anchorIdx].trim();\n  const notes = [];"},"explanation":"Cuando se usó una ruta alternativa [2b] y la búsqueda terminó en `ok` o `moved`, el estado pasa a `relocated`. Así el informe expresa el cambio de archivo aunque el texto permanezca idéntico. Una coincidencia `fuzzy` en un archivo trasladado mantiene su estado aproximado y conserva una nota sobre la ruta antigua [2i]. Si se aplica `fix`, la nueva ruta pasa al mapa persistido [3a] [3d]."},{"id":"2i","title":"Devuelve ancla actualizada","description":"Devuelve ruta, línea, estado, hash, fragmento y notas del ancla.","path":"src/anchor.js","lineNumber":133,"lineContent":"const result = {","status":"ok","fileHash":"dfa36f28dad8","snippet":{"startLine":130,"code":"  const anchorIdx = idx >= 0 ? idx : idx0;\n  const start = Math.max(0, anchorIdx - SNIPPET_BEFORE);\n  const end = Math.min(lines.length, anchorIdx + SNIPPET_AFTER + 1);\n  const result = {\n    ...loc,\n    path: relPath,\n    lineNumber: anchorIdx + 1,\n    status,\n    fileHash: file.hash,\n    snippet: { startLine: start + 1, code: lines.slice(start, end).join('\\n') },\n  };\n  if (idx >= 0) result.lineContent = lines[anchorIdx].trim();\n  const notes = [];\n  if (relocatedFrom) notes.push(`file moved from ${relocatedFrom}`);\n  if (status !== 'ok' && status !== 'unresolved' && loc.lineNumber !== anchorIdx + 1) {\n    notes.push(`line ${loc.lineNumber} -> ${anchorIdx + 1}`);\n  }\n  if (status === 'fuzzy') notes.push('partial text match; double-check');"},"explanation":"`anchorLocation` construye el resultado a partir de `loc`, sustituyendo ruta, línea, estado, hash y un fragmento alrededor del candidato. Solo actualiza `lineContent` cuando encontró una posición; si quedó `unresolved`, usa la línea previa acotada para mostrar contexto sin fingir coincidencia. Las notas explican traslado, desplazamiento, coincidencia parcial o texto ausente, y viajan a `changes` [1f]. Con `fix`, ese resultado se convierte en la ubicación guardada [3a]."}],"tree":[{"ref":"2a","children":[{"ref":"2b","children":[{"ref":"2c"}]},{"ref":"2d","children":[{"ref":"2e","children":[{"ref":"2f","children":[{"ref":"2g"}]}]}]},{"ref":"2h"},{"ref":"2i"}]}],"motivation":"Un número de línea aislado envejece en cuanto alguien inserta o mueve código. Esta etapa busca evidencia textual en el archivo actual y distingue coincidencias seguras de aproximaciones que deben inspeccionarse.","details":"`FileCache` lee el archivo dentro del repositorio, reutiliza la lectura y calcula un hash normalizado [2a]. Si no puede leer la ruta original, intenta localizar un archivo Git con el mismo nombre base [2b]; sin archivo legible devuelve `missing` [2c]. Con el archivo disponible, `anchorLocation` compara primero la línea anterior tras normalizar espacios [2d], luego el texto exacto más cercano [2e]. Si no hay coincidencia exacta, prueba inclusión parcial y después el símbolo [2f], clasificando el resultado como `fuzzy` [2g]. Una ruta alternativa con coincidencia `ok` o `moved` se marca `relocated` [2h]; al final devuelve ruta, línea, estado, hash, fragmento y notas para el diagnóstico o la corrección [2i]."},{"id":"3","title":"Corrección, escritura y salida","description":"Aplica correcciones opcionales, actualiza archivos y comunica el resultado.","locations":[{"id":"3a","title":"Aplica resultados con fix","description":"`fix` decide si reemplaza cada ubicación por el ancla calculada.","path":"src/verify.js","lineNumber":30,"lineContent":"return fix ? r : loc;","status":"ok","fileHash":"214d66bfa2c2","snippet":{"startLine":27,"code":"          note: r.note,\n        });\n      }\n      return fix ? r : loc;\n    });\n  }\n\n  const broken = counts.unresolved + counts.missing;\n  const result = {\n    id: doc.id,\n    title: doc.title,\n    mapCommit: doc.meta?.commit?.slice(0, 8) || null,\n    headCommit: headCommit(root)?.slice(0, 8) || null,\n    counts,\n    changedFiles: [...changedFiles],\n    changes,\n    stale: changes.length > 0 || changedFiles.size > 0,\n    broken,"},"explanation":"La función de mapeo de `verifyMap` ya tiene el resultado actual `r` de `anchorLocation` [1d]. Con `fix`, devuelve `r` y deja las ubicaciones corregidas en el documento en memoria; sin él, conserva `loc`. Esta separación permite inspeccionar `counts`, `changes` y `stale` sin persistir nuevos anclajes. El reemplazo en memoria no basta para escribir archivos: también debe cumplirse la condición de [3b]."},{"id":"3b","title":"Guarda solo con cambios","description":"Con `fix` y deriva, persiste el mapa y su visor.","path":"src/verify.js","lineNumber":47,"lineContent":"if (fix && (changes.length || changedFiles.size)) {","status":"ok","fileHash":"214d66bfa2c2","snippet":{"startLine":44,"code":"    broken,\n    fixed: false,\n  };\n  if (fix && (changes.length || changedFiles.size)) {\n    doc.meta = { ...doc.meta, verifiedAt: new Date().toISOString(), commit: headCommit(root), anchors: { ...counts } };\n    persist(root, doc);\n    writeHtml(root, doc);\n    result.fixed = true;\n  }\n  return result;\n}\n"},"explanation":"El bloque de escritura requiere `fix` y al menos un cambio de ubicación o de hash [1e] [1f]. Esto evita reescribir el mapa cuando la verificación no detectó diferencias. Si entra, actualiza metadatos [3c], guarda JSON [3d], regenera HTML [3e] y marca `fixed: true`. Esa marca indica persistencia, incluso si algunas ubicaciones continúan `unresolved` o `missing` [1g]."},{"id":"3c","title":"Actualiza metadatos","description":"Actualiza hora, commit y conteos antes de persistir.","path":"src/verify.js","lineNumber":48,"lineContent":"doc.meta = { ...doc.meta, verifiedAt: new Date().toISOString(), commit: headCommit(root), anchors: { ...counts } };","status":"ok","fileHash":"214d66bfa2c2","snippet":{"startLine":45,"code":"    fixed: false,\n  };\n  if (fix && (changes.length || changedFiles.size)) {\n    doc.meta = { ...doc.meta, verifiedAt: new Date().toISOString(), commit: headCommit(root), anchors: { ...counts } };\n    persist(root, doc);\n    writeHtml(root, doc);\n    result.fixed = true;\n  }\n  return result;\n}\n"},"explanation":"Al entrar al bloque de corrección [3b], `verifyMap` conserva los metadatos existentes y añade `verifiedAt`. También reemplaza el commit registrado por `headCommit(root)` y guarda una copia de `counts`. Esos datos acompañan a las ubicaciones corregidas en el JSON [3d]. El commit identifica HEAD, mientras la comparación de archivos se hizo contra el árbol de trabajo, que puede incluir cambios no confirmados."},{"id":"3d","title":"Persiste mapa JSON","description":"`persist` escribe el documento corregido en el JSON del mapa.","path":"src/verify.js","lineNumber":49,"lineContent":"persist(root, doc);","status":"ok","fileHash":"214d66bfa2c2","snippet":{"startLine":46,"code":"  };\n  if (fix && (changes.length || changedFiles.size)) {\n    doc.meta = { ...doc.meta, verifiedAt: new Date().toISOString(), commit: headCommit(root), anchors: { ...counts } };\n    persist(root, doc);\n    writeHtml(root, doc);\n    result.fixed = true;\n  }\n  return result;\n}\n"},"explanation":"Tras actualizar las ubicaciones [3a] y los metadatos [3c], `persist` serializa el documento completo en `.waymark/\u003cid>.json`. Ese archivo será la referencia almacenada que cargará una verificación futura [1c]. La escritura ocurre incluso cuando la única deriva detectada fue un hash, porque [3b] usa ambas señales. No hay una validación adicional que convierta un resultado `fuzzy` en coincidencia segura antes de guardar."},{"id":"3e","title":"Regenera visor HTML","description":"Regenera el visor HTML desde el documento actualizado.","path":"src/verify.js","lineNumber":50,"lineContent":"writeHtml(root, doc);","status":"ok","fileHash":"214d66bfa2c2","snippet":{"startLine":47,"code":"  if (fix && (changes.length || changedFiles.size)) {\n    doc.meta = { ...doc.meta, verifiedAt: new Date().toISOString(), commit: headCommit(root), anchors: { ...counts } };\n    persist(root, doc);\n    writeHtml(root, doc);\n    result.fixed = true;\n  }\n  return result;\n}\n"},"explanation":"Después de persistir el JSON [3d], `writeHtml` renderiza `.waymark/\u003cid>.html` con el documento actualizado. El visor refleja las rutas y fragmentos que `anchorLocation` entregó [2i] y puede incorporar una instantánea de archivos referenciados. Mantener ambos artefactos sincronizados evita que el lector vea anclas antiguas en el HTML. Si falta un archivo para la instantánea, el visor usa el fragmento almacenado."},{"id":"3f","title":"Reporta estado CLI","description":"La CLI muestra `BROKEN`, `STALE` u `OK` y los cambios.","path":"src/cli.js","lineNumber":235,"lineContent":"const state = v.broken ? 'BROKEN' : v.stale ? 'STALE' : 'OK';","status":"moved","fileHash":"0b9ef6b90b08","snippet":{"startLine":232,"code":"      let bad = false;\n      for (const id of ids) {\n        const v = verifyMap(r, id, { fix: opt.fix });\n        const state = v.broken ? 'BROKEN' : v.stale ? 'STALE' : 'OK';\n        out(`${state.padEnd(7)} ${v.id}  map@${v.mapCommit || '?'} head@${v.headCommit || '?'}${v.fixed ? '  (fixed)' : ''}`);\n        for (const c of v.changes) out(`        ${c.status.padEnd(10)} [${c.id}] ${c.from} -> ${c.to}${c.note ? '  ' + c.note : ''}`);\n        if (v.broken || (opt.strict && v.stale && !v.fixed)) bad = true;\n      }\n      if (bad) process.exitCode = 1;\n      return;\n    }\n    case 'render': {\n      const r = root();\n      const p = writeHtml(r, loadMap(r, rest[0]));\n      out(p);\n      if (opt.open) openFile(p);\n      return;\n    }"},"note":"line 199 -> 235","explanation":"Para cada informe de `verifyMap` [1a], la CLI elige `BROKEN` si `broken` es positivo, luego `STALE` si `stale` es verdadero y, si no, `OK`. Imprime el ID, commits del mapa y HEAD y la marca `(fixed)` cuando hubo escritura. También muestra cada entrada de `changes` con estado, origen, destino y nota [1f]. El rótulo puede seguir diciendo `STALE` en la ejecución que aplicó `fix`, porque `stale` describe la deriva detectada antes de guardar."},{"id":"3g","title":"Decide código de salida","description":"Falla por anclas rotas o deriva estricta sin fijar.","path":"src/cli.js","lineNumber":238,"lineContent":"if (v.broken || (opt.strict && v.stale && !v.fixed)) bad = true;","status":"moved","fileHash":"0b9ef6b90b08","snippet":{"startLine":235,"code":"        const state = v.broken ? 'BROKEN' : v.stale ? 'STALE' : 'OK';\n        out(`${state.padEnd(7)} ${v.id}  map@${v.mapCommit || '?'} head@${v.headCommit || '?'}${v.fixed ? '  (fixed)' : ''}`);\n        for (const c of v.changes) out(`        ${c.status.padEnd(10)} [${c.id}] ${c.from} -> ${c.to}${c.note ? '  ' + c.note : ''}`);\n        if (v.broken || (opt.strict && v.stale && !v.fixed)) bad = true;\n      }\n      if (bad) process.exitCode = 1;\n      return;\n    }\n    case 'render': {\n      const r = root();\n      const p = writeHtml(r, loadMap(r, rest[0]));\n      out(p);\n      if (opt.open) openFile(p);\n      return;\n    }\n    case 'delete':\n      return out(`deleted ${deleteMap(root(), rest[0])}`);\n    case 'suggest': {"},"note":"line 202 -> 238","explanation":"La CLI acumula `bad` mientras procesa uno o varios mapas [1a]. Lo activa si el informe tiene `broken`, o si `--strict` encuentra `stale` sin `fixed`. Al terminar, establece `process.exitCode = 1` solo cuando `bad` es verdadero, lo que permite usar la verificación en automatizaciones. `--fix` puede suprimir el fallo estricto por deriva guardada, pero no elimina un fallo por anclas rotas [1g]."}],"tree":[{"ref":"3a","children":[{"ref":"3b","children":[{"ref":"3c","children":[{"ref":"3d"},{"ref":"3e"}]}]}]},{"ref":"3f","children":[{"ref":"3g"}]}],"motivation":"Verificar debe servir tanto para inspección sin cambios como para mantener el mapa alineado con el código. Esta etapa controla cuándo se persisten los resultados y cómo se interpreta el diagnóstico desde la CLI.","details":"El resultado calculado reemplaza la ubicación en memoria solo si se solicitó `fix` [3a]. La escritura se activa únicamente cuando esa opción coincide con algún cambio de ancla o hash [3b]; entonces se registran hora de verificación, commit y conteos [3c], se persiste el JSON [3d] y se regenera el visor HTML [3e]. La CLI muestra `BROKEN`, `STALE` u `OK`, en ese orden de prioridad, además de cada cambio [3f]. Su código de salida falla por anclas rotas o por deriva sin fijar bajo `--strict` [3g]. El indicador `fixed` significa que hubo persistencia, pero no certifica que las ubicaciones `unresolved` o `missing` hayan quedado resueltas [1g] [3b]."}],"links":[{"from":"1d","to":"2a","label":"anchorLocation(cache, loc)"},{"from":"2i","to":"3a","label":"resultado de reanclaje"}],"tags":["verify","drift","anchors"],"meta":{"createdAt":"2026-10-01T17:03:45.835Z","updatedAt":"2026-10-20T01:57:22.107Z","root":"C:\\DATOS\\codemaps-custom","commit":"92eefc332fc861c3d1deda83e2180271900b86ec","branch":null,"remote":null,"anchors":{"ok":19,"moved":4,"fuzzy":0,"relocated":0,"unresolved":0,"missing":0},"verifiedAt":"2026-10-20T01:53:35.082Z"},"story":"Un mapa Waymark conserva rutas, líneas, texto y hashes que pueden quedar desfasados cuando cambia el código. La CLI [1a] y el MCP [1b] reúnen los mapas solicitados y entregan cada uno a `verifyMap` [1c]; este contrasta sus ubicaciones [1d] con el árbol de trabajo mediante `anchorLocation` [2a]. Si la ruta desapareció, se busca otra entre archivos rastreados por Git [2b]; después se intenta la línea previa [2d], el mismo texto en otra línea [2e] y, como último recurso, una coincidencia parcial o de símbolo [2f]. El resultado separa dos señales: los hashes y cambios de ubicación determinan `stale` [1e] [1f] [1g], mientras `unresolved` o `missing` determinan `broken` [1g]. Sin `fix`, se informa la deriva sin persistir nuevos anclajes [3a]; con `fix`, se guardan el JSON y el visor HTML si hubo cambios [3b] [3d] [3e]. La CLI muestra el estado y fija su salida según anclas rotas y `--strict` [3f] [3g]; un estado `fuzzy` merece revisión porque la cercanía textual no demuestra identidad semántica [2g]."},"files":{"src/cli.js":"#!/usr/bin/env node\nimport fs from 'node:fs';\nimport os from 'node:os';\nimport path from 'node:path';\nimport { spawn } from 'node:child_process';\nimport { parseArgs } from 'node:util';\nimport { fileURLToPath } from 'node:url';\nimport { resolveRoot } from './git.js';\nimport { saveMap, loadMap, listMaps, writeHtml, deleteMap, mapDir, annotateMap, narrativeGaps } from './store.js';\nimport { resolveCommand } from './bin.js';\nimport { verifyMap } from './verify.js';\nimport { suggestTopics } from './suggest.js';\nimport { waymarkGuide, enrichGuide } from './guide.js';\nimport { renderMarkdown } from './render/markdown.js';\nimport { renderMermaid } from './render/mermaid.js';\nimport { openFile } from './open.js';\nimport { install } from './install.js';\n\nconst HERE = path.dirname(fileURLToPath(import.meta.url));\n\nconst HELP = `waymark — hierarchical, line-anchored maps of how code executes\n\nUsage: waymark \u003ccommand> [options]\n\n  generate \"\u003ctopic>\"     Build a map headlessly with an agent CLI\n                         [--engine claude|codex] (default: claude if installed, else codex)\n                         [--mode fast|smart] [--model \u003cm>] [--open] [--max-turns \u003cn> (claude)] [--approval \u003cmode> (codex)]\n  enrich \u003cid>            Add storytelling (story, Motivation/Details, per-node explanations) to an\n                         existing map with an agent CLI [--engine claude|codex] [--model \u003cm>] [--open]\n  annotate \u003cid> \u003cpatch.json>  Apply prose fields (story, traces[].motivation|details, locations[].explanation)\n  create \u003cfile.json>     Validate, anchor and store a map written as JSON [--id \u003cid>] [--open]\n  list                   List maps in the repo [--json]\n  show \u003cid>              Print a map [--format markdown|compact|json|mermaid]\n  verify [id]            Check anchors against current code [--fix] [--strict]\n                         exit 1 if anchors are broken (with --strict: also if stale)\n  render \u003cid>            Regenerate the HTML viewer [--open]\n  delete \u003cid>            Delete a map\n  suggest                Suggest topics from recent work [--json]\n  guide [\"\u003ctopic>\"]      Print the Waymark agent procedure (for any harness)\n  install                Wire into a repo for Claude Code + Codex (CLI, IDE, desktop) + AGENTS.md\n                         [--target \u003cdir>] [--no-claude] [--no-codex] [--no-agents-md]\n                         [--claude-global] also register for every project: claude mcp add -s user + ~/.claude/skills|agents\n                         [--codex-global]  also register in ~/.codex/config.toml + ~/.agents/skills\n                         [--global]        both of the above\n                         [--global-bin]    use the waymark-mcp bin instead of an absolute path\n  mcp                    Run the MCP server on stdio\n\nGlobal: --root \u003cdir>  repository root (default: git toplevel of cwd)\n`;\n\nconst { values: opt, positionals } = parseArgs({\n  allowPositionals: true,\n  options: {\n    root: { type: 'string' },\n    id: { type: 'string' },\n    format: { type: 'string' },\n    model: { type: 'string' },\n    'max-turns': { type: 'string' },\n    engine: { type: 'string' },\n    mode: { type: 'string' },\n    approval: { type: 'string' },\n    'no-codex': { type: 'boolean' },\n    'codex-global': { type: 'boolean' },\n    'claude-global': { type: 'boolean' },\n    global: { type: 'boolean' },\n    target: { type: 'string' },\n    open: { type: 'boolean' },\n    fix: { type: 'boolean' },\n    strict: { type: 'boolean' },\n    json: { type: 'boolean' },\n    'no-claude': { type: 'boolean' },\n    'no-agents-md': { type: 'boolean' },\n    'global-bin': { type: 'boolean' },\n    help: { type: 'boolean', short: 'h' },\n  },\n});\n\nconst [cmd, ...rest] = positionals;\nconst root = () => resolveRoot(opt.root);\nconst out = (v) => console.log(typeof v === 'string' ? v : JSON.stringify(v, null, 2));\n\nfunction printReport(res) {\n  const a = res.report;\n  out(`✔ ${res.doc.id}  (${a.total} locations: ${a.ok} ok, ${a.moved + a.relocated} re-anchored, ${a.fuzzy} approx, ${a.unresolved + a.missing} unverified)`);\n  for (const i of a.issues) out(`  ${i.status.padEnd(10)} [${i.id}] ${i.path}  ${i.note || ''}`);\n  out(`  json: ${res.jsonPath}\\n  html: ${res.htmlPath}`);\n}\n\nconst MCP_ENTRY = path.join(HERE, 'mcp.js');\nconst fwd = (p) => p.replace(/\\\\/g, '/');\n\n/** Claude Code headless: only read tools + waymark MCP are allowed. */\nfunction claudeInvocation(r, prompt) {\n  const cfgPath = path.join(os.tmpdir(), `waymark-mcp-${process.pid}.json`);\n  fs.writeFileSync(\n    cfgPath,\n    JSON.stringify({ mcpServers: { waymark: { command: process.execPath, args: [MCP_ENTRY], env: { WAYMARK_ROOT: r } } } }),\n  );\n  const args = ['-p', prompt, '--mcp-config', cfgPath, '--strict-mcp-config', '--allowedTools', 'Read,Grep,Glob,mcp__waymark', '--permission-mode', 'dontAsk'];\n  if (opt.model) args.push('--model', opt.model);\n  if (opt['max-turns']) args.push('--max-turns', opt['max-turns']);\n  return { bin: resolveCommand('claude'), args, stdin: null, cleanup: () => fs.rmSync(cfgPath, { force: true }) };\n}\n\n/** Codex headless (codex exec): read-only sandbox; the MCP server (outside the sandbox) does the writing. */\nfunction codexInvocation(r, prompt) {\n  const toml = JSON.stringify;\n  const args = [\n    'exec',\n    '--sandbox', 'read-only',\n    '--skip-git-repo-check',\n    '--color', 'never',\n    '-C', r,\n    '-c', `mcp_servers.waymark.command=${toml(fwd(process.execPath))}`,\n    '-c', `mcp_servers.waymark.args=[${toml(fwd(MCP_ENTRY))}]`,\n    '-c', `mcp_servers.waymark.env={WAYMARK_ROOT=${toml(fwd(r))}}`,\n    '-c', 'mcp_servers.waymark.startup_timeout_sec=20',\n    '-c', 'mcp_servers.waymark.tool_timeout_sec=120',\n    '-c', `mcp_servers.waymark.default_tools_approval_mode=${toml(opt['approval'] || 'approve')}`,\n  ];\n  if (opt.model) args.push('-m', opt.model);\n  args.push('-'); // prompt from stdin: avoids command-line length/quoting limits\n  return { bin: resolveCommand('codex'), args, stdin: prompt, cleanup: () => {} };\n}\n\nfunction pickEngine() {\n  const e = opt.engine || 'auto';\n  if (e === 'claude' || e === 'codex') return e;\n  if (e !== 'auto') throw new Error(`Unknown engine \"${e}\" (use claude | codex)`);\n  return resolveCommand('claude') ? 'claude' : 'codex';\n}\n\n/** Runs Claude Code or Codex headlessly with only read tools + the waymark MCP server. */\nasync function runAgent(r, task) {\n  const engine = pickEngine();\n  const tools = engine === 'codex' ? 'read-only shell commands (rg, sed -n, git grep, ls)' : 'Read/Grep/Glob';\n  const prompt =\n    task +\n    `\\n\\nRepository root: ${r}\\nWork autonomously: do not ask questions. Explore with ${tools} only. ` +\n    `Always pass root=\"${fwd(r)}\" to waymark_* tools. When done, answer with the map id and a short summary.`;\n  const inv = engine === 'codex' ? codexInvocation(r, prompt) : claudeInvocation(r, prompt);\n  if (!inv.bin) throw new Error(`\"${engine}\" CLI not found on PATH`);\n  out(`waymark: running ${engine}…`);\n  const code = await new Promise((res, rej) => {\n    const p = spawn(inv.bin.command, [...inv.bin.args, ...inv.args], {\n      cwd: r,\n      stdio: [inv.stdin ? 'pipe' : 'ignore', 'inherit', 'inherit'],\n      shell: !!inv.bin.shell,\n    });\n    p.on('error', (e) => rej(new Error(`Could not run ${engine}: ${e.message}`)));\n    p.on('close', res);\n    if (inv.stdin) p.stdin.end(inv.stdin);\n  }).finally(inv.cleanup);\n  return code ?? 1;\n}\n\nasync function generate(topic) {\n  if (!topic) throw new Error('Usage: waymark generate \"\u003ctopic>\" [--engine claude|codex] [--mode fast|smart]');\n  const r = root();\n  const before = new Set(listMaps(r).map((m) => m.id));\n  const mode = opt.mode === 'fast' ? 'fast' : 'smart';\n  const code = await runAgent(r, waymarkGuide(topic, { mode }));\n  const created = listMaps(r).filter((m) => !before.has(m.id));\n  if (created[0]) {\n    const html = path.join(mapDir(r), `${created[0].id}.html`);\n    const gaps = narrativeGaps(loadMap(r, created[0].id));\n    out(`\\nwaymark: ${created[0].id}\\nhtml: ${html}`);\n    if (!gaps.complete) out(`narrative incomplete — run: waymark enrich ${created[0].id}`);\n    if (opt.open) openFile(html);\n  } else if (code === 0) {\n    out('\\n(no new map was stored; the agent may have updated an existing one)');\n  }\n  process.exitCode = code;\n}\n\nasync function enrich(id) {\n  if (!id) throw new Error('Usage: waymark enrich \u003cid> [--engine claude|codex]');\n  const r = root();\n  const doc = loadMap(r, id);\n  const code = await runAgent(r, enrichGuide(doc.id));\n  const gaps = narrativeGaps(loadMap(r, doc.id));\n  const html = path.join(mapDir(r), `${doc.id}.html`);\n  out(`\\nwaymark: ${doc.id}  narrative ${gaps.complete ? 'complete' : 'still incomplete: ' + JSON.stringify(gaps)}\\nhtml: ${html}`);\n  if (opt.open) openFile(html);\n  process.exitCode = code;\n}\n\nasync function main() {\n  if (!cmd || opt.help) return out(HELP);\n  switch (cmd) {\n    case 'mcp': {\n      const { startStdio } = await import('./mcp.js');\n      return startStdio();\n    }\n    case 'generate':\n      return generate(rest.join(' '));\n    case 'enrich':\n      return enrich(rest[0]);\n    case 'annotate': {\n      if (!rest[0] || !rest[1]) throw new Error('Usage: waymark annotate \u003cid> \u003cpatch.json|->');\n      const raw = rest[1] === '-' ? fs.readFileSync(0, 'utf8') : fs.readFileSync(rest[1], 'utf8');\n      const res = annotateMap(root(), rest[0], JSON.parse(raw));\n      out(`✔ ${res.id}: ${res.changed} fields changed${res.unknown.length ? '; unknown: ' + res.unknown.join(', ') : ''}`);\n      if (!res.narrative.complete) out('  still missing: ' + JSON.stringify(res.narrative));\n      out('  html: ' + res.htmlPath);\n      return;\n    }\n    case 'create': {\n      if (!rest[0]) throw new Error('Usage: waymark create \u003cfile.json|->');\n      const raw = rest[0] === '-' ? fs.readFileSync(0, 'utf8') : fs.readFileSync(rest[0], 'utf8');\n      const res = saveMap(root(), JSON.parse(raw), { id: opt.id });\n      printReport(res);\n      if (opt.open) openFile(res.htmlPath);\n      if (!res.report.healthy) process.exitCode = 2;\n      return;\n    }\n    case 'list': {\n      const maps = listMaps(root());\n      if (opt.json) return out(maps);\n      if (!maps.length) return out('No waymark yet. Try: waymark generate \"how does X work?\"');\n      for (const m of maps) out(`${m.id.padEnd(44)} ${String(m.locations).padStart(3)} nodes  ${(m.updatedAt || '').slice(0, 10)}  ${m.title}`);\n      return;\n    }\n    case 'show': {\n      const doc = loadMap(root(), rest[0]);\n      const f = opt.format || 'markdown';\n      return out(f === 'json' ? doc : f === 'mermaid' ? renderMermaid(doc) : renderMarkdown(doc, { detail: f === 'compact' ? 'compact' : 'full' }));\n    }\n    case 'verify': {\n      const r = root();\n      const ids = rest[0] ? [rest[0]] : listMaps(r).map((m) => m.id);\n      let bad = false;\n      for (const id of ids) {\n        const v = verifyMap(r, id, { fix: opt.fix });\n        const state = v.broken ? 'BROKEN' : v.stale ? 'STALE' : 'OK';\n        out(`${state.padEnd(7)} ${v.id}  map@${v.mapCommit || '?'} head@${v.headCommit || '?'}${v.fixed ? '  (fixed)' : ''}`);\n        for (const c of v.changes) out(`        ${c.status.padEnd(10)} [${c.id}] ${c.from} -> ${c.to}${c.note ? '  ' + c.note : ''}`);\n        if (v.broken || (opt.strict && v.stale && !v.fixed)) bad = true;\n      }\n      if (bad) process.exitCode = 1;\n      return;\n    }\n    case 'render': {\n      const r = root();\n      const p = writeHtml(r, loadMap(r, rest[0]));\n      out(p);\n      if (opt.open) openFile(p);\n      return;\n    }\n    case 'delete':\n      return out(`deleted ${deleteMap(root(), rest[0])}`);\n    case 'suggest': {\n      const s = suggestTopics(root());\n      if (opt.json) return out(s);\n      s.suggestions.forEach((x, i) => out(`${i + 1}. ${x.topic}\\n   ${x.reason}`));\n      return;\n    }\n    case 'guide':\n      return out(waymarkGuide(rest.join(' ')));\n    case 'install':\n      return out(\n        install({\n          target: resolveRoot(opt.target || opt.root),\n          claude: !opt['no-claude'],\n          codex: !opt['no-codex'],\n          codexGlobal: !!(opt['codex-global'] || opt.global),\n          claudeGlobal: !!(opt['claude-global'] || opt.global),\n          agentsMd: !opt['no-agents-md'],\n          useGlobalBin: !!opt['global-bin'],\n        }),\n      );\n    default:\n      throw new Error(`Unknown command \"${cmd}\". Run waymark --help`);\n  }\n}\n\nmain().catch((e) => {\n  console.error(`waymark: ${e.message}`);\n  process.exit(1);\n});\n","src/mcp.js":"#!/usr/bin/env node\nimport * as z from 'zod';\nimport { McpServer, ResourceTemplate } from '@modelcontextprotocol/sdk/server/mcp.js';\nimport { StdioServerTransport } from '@modelcontextprotocol/sdk/server/stdio.js';\nimport { MapInput } from './schema.js';\nimport { fileURLToPath } from 'node:url';\nimport { resolveRoot } from './git.js';\nimport { saveMap, loadMap, listMaps, writeHtml, deleteMap, annotateMap, narrativeGaps } from './store.js';\nimport { verifyMap } from './verify.js';\nimport { findInFile } from './anchor.js';\nimport { suggestTopics } from './suggest.js';\nimport { waymarkGuide, enrichGuide } from './guide.js';\nimport { renderMarkdown } from './render/markdown.js';\nimport { renderMermaid } from './render/mermaid.js';\nimport { openFile } from './open.js';\n\nconst VERSION = '0.1.0';\nconst rootArg = z.string().optional().describe('Repository root. Defaults to the server working directory / WAYMARK_ROOT');\n\nconst text = (t) => ({ content: [{ type: 'text', text: typeof t === 'string' ? t : JSON.stringify(t, null, 2) }] });\nconst fail = (e) => ({ isError: true, content: [{ type: 'text', text: String(e?.message || e) }] });\nconst safe = (fn) => async (args) => {\n  try {\n    return await fn(args);\n  } catch (e) {\n    return fail(e);\n  }\n};\n\n// Workspace announced by the client (MCP roots). Lets a globally installed server\n// (e.g. ~/.codex/config.toml used by Codex desktop) target the open project.\nlet clientRoot = null;\nconst rootOf = (root) => resolveRoot(root || process.env.WAYMARK_ROOT || clientRoot || undefined);\n\nexport function createServer() {\n  const server = new McpServer(\n    { name: 'waymark', version: VERSION },\n    {\n      instructions:\n        'Waymark: hierarchical, line-anchored maps of how code executes. To create one, call waymark_start(query) and follow the returned procedure, then waymark_create. ' +\n        'To use an existing map as context, read resource waymark://\u003cid> or call waymark_get. Run waymark_verify before trusting an old map.',\n    },\n  );\n\n  server.registerTool(\n    'waymark_start',\n    {\n      title: 'Start a waymark',\n      description:\n        'Begin generating a waymark map for a topic/question. Returns the Waymark agent procedure (structure + storytelling rules), the input format, repo hints (recent files, entry points) and existing maps. Call this first, then explore the code and submit with waymark_create.',\n      inputSchema: {\n        query: z.string().describe('Topic or question, e.g. \"how does checkout payment work?\"'),\n        mode: z.enum(['fast', 'smart']).optional().describe('fast: short map quickly; smart (default): thorough map with full storytelling'),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ query, mode, root }) => {\n      const r = rootOf(root);\n      const hints = suggestTopics(r, { limit: 5 });\n      const existing = listMaps(r).slice(0, 15).map(({ id, title, query: q, updatedAt }) => ({ id, title, query: q, updatedAt }));\n      return text(\n        `${waymarkGuide(query, { mode })}\\n## Repository\\n\\nroot: ${r}\\n\\n` +\n          `Entry points: ${hints.entryPoints.join(', ') || '(none detected)'}\\n\\n` +\n          `Recently touched: ${hints.recentFiles.slice(0, 12).map((f) => f.file).join(', ') || '(none)'}\\n\\n` +\n          `Existing waymark (reuse/update instead of duplicating): ${existing.length ? JSON.stringify(existing) : 'none'}`,\n      );\n    }),\n  );\n\n  server.registerTool(\n    'waymark_suggest_topics',\n    {\n      title: 'Suggest waymark topics',\n      description: 'Suggests waymark topics from recent work (uncommitted and recently committed files, commit subjects) and detected entry points.',\n      inputSchema: { root: rootArg, limit: z.number().int().min(1).max(20).optional() },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ root, limit }) => text(suggestTopics(rootOf(root), { limit }))),\n  );\n\n  server.registerTool(\n    'waymark_find_anchor',\n    {\n      title: 'Find anchor lines',\n      description: 'Returns line numbers and exact line text in a file matching a literal string or regex. Use it to get precise lineNumber/lineContent for locations.',\n      inputSchema: {\n        path: z.string().describe('File path relative to repo root'),\n        pattern: z.string(),\n        regex: z.boolean().optional(),\n        limit: z.number().int().min(1).max(100).optional(),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ path, pattern, regex, limit, root }) => text(findInFile(rootOf(root), path, pattern, { regex, limit }))),\n  );\n\n  server.registerTool(\n    'waymark_create',\n    {\n      title: 'Create or update a waymark',\n      description:\n        'Validates a waymark, verifies every location against the working tree (auto-correcting shifted line numbers), stores it under .waymark/ and writes a shareable HTML viewer. Pass `id` to overwrite an existing map. Returns an anchor report: fix any unresolved/missing locations and resubmit.',\n      inputSchema: {\n        ...MapInput.shape,\n        id: z.string().optional().describe('Existing waymark id to overwrite'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...map }) => {\n      const r = rootOf(root);\n      const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });\n      server.sendResourceListChanged();\n      const next = [];\n      if (!report.healthy) {\n        next.push('Some locations could not be verified. Fix them (waymark_find_anchor helps) and call waymark_create again with id=\"' + doc.id + '\".');\n      }\n      if (!narrative.complete) {\n        next.push('Narrative is incomplete (see \"narrative\"). Fill the story, trace motivation/details and per-location explanations with waymark_annotate(id=\"' + doc.id + '\").');\n      }\n      if (!next.length) next.push('All anchors verified and narrative complete. Share the HTML file or reference waymark://' + doc.id);\n      return text({ id: doc.id, resource: `waymark://${doc.id}`, html: htmlPath, json: jsonPath, anchors: report, narrative, next });\n    }),\n  );\n\n  const prose = () => z.string().optional();\n  server.registerTool(\n    'waymark_annotate',\n    {\n      title: 'Annotate a waymark (narrative)',\n      description:\n        'Adds or rewrites the prose of an existing map without re-sending or re-anchoring it: map story/description/title, trace motivation/details/description/diagramTitle, location explanation/description/title. Only the fields you pass change. Regenerates the HTML viewer and returns which narrative fields are still missing.',\n      inputSchema: {\n        id: z.string().describe('Map id (a unique prefix is enough)'),\n        title: prose(),\n        description: prose().describe('Map summary citing nodes as [1a]'),\n        story: prose().describe('Holistic storytelling narrative (markdown)'),\n        language: prose(),\n        traces: z\n          .array(\n            z.object({\n              id: z.string(),\n              title: prose(),\n              description: prose(),\n              diagramTitle: prose(),\n              motivation: prose().describe('Why this part exists (markdown)'),\n              details: prose().describe('Narrative walkthrough citing nodes (markdown)'),\n            }),\n          )\n          .optional(),\n        locations: z\n          .array(\n            z.object({\n              id: z.string(),\n              title: prose(),\n              description: prose().describe('One sentence \u003c= 15 words'),\n              explanation: prose().describe('Storytelling explanation, 3-6 sentences (markdown)'),\n            }),\n          )\n          .optional(),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...patch }) => text(annotateMap(rootOf(root), id, patch))),\n  );\n\n  server.registerTool(\n    'waymark_enrich',\n    {\n      title: 'Enrich a waymark with storytelling',\n      description:\n        'Returns the procedure to upgrade an existing map with full storytelling (holistic story, Motivation/Details guides per trace, an explanation per location), the list of missing narrative and the map itself. Follow it and save with waymark_annotate.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const doc = loadMap(rootOf(root), id);\n      return text(\n        enrichGuide(doc.id) +\n          '\\n\\n## Missing narrative\\n\\n' +\n          JSON.stringify(narrativeGaps(doc)) +\n          '\\n\\n## Current map\\n\\n' +\n          renderMarkdown(doc, { detail: 'full' }),\n      );\n    }),\n  );\n\n  server.registerTool(\n    'waymark_list',\n    {\n      title: 'List waymark',\n      description: 'Lists waymark stored in the repository (.waymark/).',\n      inputSchema: { root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ root }) => text(listMaps(rootOf(root)))),\n  );\n\n  server.registerTool(\n    'waymark_get',\n    {\n      title: 'Get a waymark',\n      description:\n        'Returns a waymark for use as context. format: \"markdown\" (structure + code snippets, default), \"compact\" (structure + anchor lines only), \"json\", \"mermaid\".',\n      inputSchema: {\n        id: z.string().describe('Waymark id (a unique prefix is enough)'),\n        format: z.enum(['markdown', 'compact', 'json', 'mermaid']).optional(),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, format = 'markdown', root }) => {\n      const doc = loadMap(rootOf(root), id);\n      if (format === 'json') return text(doc);\n      if (format === 'mermaid') return text(renderMermaid(doc));\n      return text(renderMarkdown(doc, { detail: format === 'compact' ? 'compact' : 'full' }));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_verify',\n    {\n      title: 'Verify waymark anchors',\n      description:\n        'Re-checks waymark locations against the current code: detects moved lines, renamed files and removed code. With fix=true, writes corrected anchors back. Omit id to verify all maps.',\n      inputSchema: { id: z.string().optional(), fix: z.boolean().optional(), root: rootArg },\n    },\n    safe(async ({ id, fix, root }) => {\n      const r = rootOf(root);\n      const ids = id ? [id] : listMaps(r).map((m) => m.id);\n      return text(ids.map((i) => verifyMap(r, i, { fix })));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_render',\n    {\n      title: 'Render waymark viewer',\n      description: 'Regenerates the self-contained HTML viewer of a waymark and optionally opens it in the default browser.',\n      inputSchema: { id: z.string(), open: z.boolean().optional(), root: rootArg },\n    },\n    safe(async ({ id, open, root }) => {\n      const r = rootOf(root);\n      const p = writeHtml(r, loadMap(r, id));\n      if (open) openFile(p);\n      return text({ html: p });\n    }),\n  );\n\n  server.registerTool(\n    'waymark_delete',\n    {\n      title: 'Delete a waymark',\n      description: 'Deletes a waymark (JSON and HTML) from .waymark/. Only use when the user asks.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { destructiveHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const removed = deleteMap(rootOf(root), id);\n      server.sendResourceListChanged();\n      return text({ deleted: removed });\n    }),\n  );\n\n  // @-mentionable context: waymark://\u003cid>\n  server.registerResource(\n    'waymark',\n    new ResourceTemplate('waymark://{id}', {\n      list: async () => ({\n        resources: listMaps(rootOf()).map((m) => ({\n          uri: `waymark://${m.id}`,\n          name: m.title,\n          description: m.description,\n          mimeType: 'text/markdown',\n        })),\n      }),\n      complete: { id: (v) => listMaps(rootOf()).map((m) => m.id).filter((i) => i.startsWith(v)) },\n    }),\n    { title: 'Waymark', description: 'A waymark rendered as markdown context', mimeType: 'text/markdown' },\n    async (uri, { id }) => ({\n      contents: [{ uri: uri.href, mimeType: 'text/markdown', text: renderMarkdown(loadMap(rootOf(), String(id))) }],\n    }),\n  );\n\n  server.registerPrompt(\n    'create_waymark',\n    {\n      title: 'Create a waymark',\n      description: 'Generate a hierarchical waymark of how the code works for a topic',\n      argsSchema: { query: z.string().describe('Topic or question') },\n    },\n    ({ query }) => ({ messages: [{ role: 'user', content: { type: 'text', text: waymarkGuide(query) } }] }),\n  );\n\n  server.server.oninitialized = async () => {\n    if (!server.server.getClientCapabilities()?.roots) return;\n    try {\n      const { roots } = await server.server.listRoots();\n      const first = roots.find((x) => x.uri.startsWith('file://'));\n      if (first) clientRoot = fileURLToPath(first.uri);\n    } catch {\n      /* client advertised roots but failed to list them: fall back to cwd */\n    }\n  };\n\n  return server;\n}\n\nexport async function startStdio() {\n  const server = createServer();\n  await server.connect(new StdioServerTransport());\n}\n\nif (import.meta.url === `file://${process.argv[1]}` || process.argv[1]?.endsWith('mcp.js')) {\n  startStdio().catch((e) => {\n    console.error(e);\n    process.exit(1);\n  });\n}\n","src/verify.js":"import { FileCache, anchorLocation } from './anchor.js';\nimport { headCommit } from './git.js';\nimport { loadMap, persist, writeHtml } from './store.js';\n\n/**\n * Re-checks every anchor of a stored waymark against the current working tree.\n * With fix=true, corrected line numbers/snippets are written back.\n */\nexport function verifyMap(root, id, { fix = false } = {}) {\n  const doc = loadMap(root, id);\n  const cache = new FileCache(root);\n  const changes = [];\n  const changedFiles = new Set();\n  const counts = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0 };\n\n  for (const trace of doc.traces) {\n    trace.locations = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      counts[r.status]++;\n      if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      if (r.status !== 'ok' || r.lineNumber !== loc.lineNumber || r.path !== loc.path) {\n        changes.push({\n          id: loc.id,\n          status: r.status,\n          from: `${loc.path}:${loc.lineNumber}`,\n          to: `${r.path}:${r.lineNumber}`,\n          note: r.note,\n        });\n      }\n      return fix ? r : loc;\n    });\n  }\n\n  const broken = counts.unresolved + counts.missing;\n  const result = {\n    id: doc.id,\n    title: doc.title,\n    mapCommit: doc.meta?.commit?.slice(0, 8) || null,\n    headCommit: headCommit(root)?.slice(0, 8) || null,\n    counts,\n    changedFiles: [...changedFiles],\n    changes,\n    stale: changes.length > 0 || changedFiles.size > 0,\n    broken,\n    fixed: false,\n  };\n  if (fix && (changes.length || changedFiles.size)) {\n    doc.meta = { ...doc.meta, verifiedAt: new Date().toISOString(), commit: headCommit(root), anchors: { ...counts } };\n    persist(root, doc);\n    writeHtml(root, doc);\n    result.fixed = true;\n  }\n  return result;\n}\n","src/anchor.js":"import fs from 'node:fs';\nimport path from 'node:path';\nimport crypto from 'node:crypto';\nimport { trackedFiles } from './git.js';\n\nconst MAX_FILE_BYTES = 4 * 1024 * 1024;\nconst SNIPPET_BEFORE = 3;\nconst SNIPPET_AFTER = 14;\n\nconst norm = (s) => (s || '').trim().replace(/\\s+/g, ' ');\n\n/** Resolves a repo-relative path, refusing anything that escapes the root. */\nexport function safeJoin(root, rel) {\n  const abs = path.resolve(root, rel);\n  const relBack = path.relative(root, abs);\n  if (relBack.startsWith('..') || path.isAbsolute(relBack)) {\n    throw new Error(`Path \"${rel}\" is outside the repository root`);\n  }\n  return abs;\n}\n\nexport class FileCache {\n  constructor(root) {\n    this.root = root;\n    this.files = new Map();\n    this._tracked = undefined;\n  }\n\n  read(rel) {\n    if (this.files.has(rel)) return this.files.get(rel);\n    let entry = null;\n    try {\n      const abs = safeJoin(this.root, rel);\n      const stat = fs.statSync(abs);\n      if (stat.isFile() && stat.size \u003c= MAX_FILE_BYTES) {\n        const text = fs.readFileSync(abs, 'utf8');\n        entry = {\n          lines: text.split(/\\r?\\n/),\n          hash: crypto.createHash('sha1').update(text.replace(/\\r\\n/g, '\\n')).digest('hex').slice(0, 12),\n        };\n      }\n    } catch {\n      entry = null;\n    }\n    this.files.set(rel, entry);\n    return entry;\n  }\n\n  /** Finds a moved/renamed file by basename when the original path is gone. */\n  findByBasename(rel) {\n    if (this._tracked === undefined) this._tracked = trackedFiles(this.root);\n    if (!this._tracked) return null;\n    const base = path.posix.basename(rel);\n    const hits = this._tracked.filter((f) => path.posix.basename(f) === base);\n    if (hits.length === 1) return hits[0];\n    // Prefer the candidate sharing the longest path suffix.\n    const parts = rel.split('/');\n    let best = null;\n    let bestScore = 0;\n    for (const h of hits) {\n      const hp = h.split('/');\n      let s = 0;\n      while (s \u003c parts.length && s \u003c hp.length && parts[parts.length - 1 - s] === hp[hp.length - 1 - s]) s++;\n      if (s > bestScore) [best, bestScore] = [h, s];\n      else if (s === bestScore) best = null;\n    }\n    return bestScore > 1 ? best : null;\n  }\n}\n\nfunction nearest(indices, target) {\n  return indices.reduce((a, b) => (Math.abs(b - target) \u003c Math.abs(a - target) ? b : a));\n}\n\n/**\n * Checks a location against the working tree and corrects its line number.\n * status: ok | moved (same text, other line) | fuzzy (partial match) | relocated (file moved)\n *         | unresolved (text not found) | missing (file not found)\n */\nexport function anchorLocation(cache, loc) {\n  let relPath = loc.path;\n  let file = cache.read(relPath);\n  let relocatedFrom = null;\n  if (!file) {\n    const alt = cache.findByBasename(relPath);\n    if (alt && (file = cache.read(alt))) {\n      relocatedFrom = relPath;\n      relPath = alt;\n    }\n  }\n  if (!file) {\n    return { ...loc, status: 'missing', note: `File not found: ${loc.path}` };\n  }\n\n  const { lines } = file;\n  const wanted = norm(loc.lineContent);\n  const idx0 = Math.min(Math.max(loc.lineNumber - 1, 0), lines.length - 1);\n  let idx = -1;\n  let status = 'unresolved';\n\n  if (!wanted || norm(lines[idx0]) === wanted) {\n    idx = idx0;\n    status = 'ok';\n  } else {\n    const exact = [];\n    lines.forEach((l, i) => norm(l) === wanted && exact.push(i));\n    if (exact.length) {\n      idx = nearest(exact, idx0);\n      status = 'moved';\n    } else {\n      const partial = [];\n      if (wanted.length >= 6) {\n        lines.forEach((l, i) => {\n          const n = norm(l);\n          if (n.length >= 6 && (n.includes(wanted) || wanted.includes(n))) partial.push(i);\n        });\n      }\n      if (!partial.length && loc.symbol) {\n        const re = new RegExp(`\\\\b${loc.symbol.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')}\\\\b`);\n        lines.forEach((l, i) => re.test(l) && partial.push(i));\n      }\n      if (partial.length) {\n        idx = nearest(partial, idx0);\n        status = 'fuzzy';\n      }\n    }\n  }\n  if (relocatedFrom && (status === 'ok' || status === 'moved')) status = 'relocated';\n\n  const anchorIdx = idx >= 0 ? idx : idx0;\n  const start = Math.max(0, anchorIdx - SNIPPET_BEFORE);\n  const end = Math.min(lines.length, anchorIdx + SNIPPET_AFTER + 1);\n  const result = {\n    ...loc,\n    path: relPath,\n    lineNumber: anchorIdx + 1,\n    status,\n    fileHash: file.hash,\n    snippet: { startLine: start + 1, code: lines.slice(start, end).join('\\n') },\n  };\n  if (idx >= 0) result.lineContent = lines[anchorIdx].trim();\n  const notes = [];\n  if (relocatedFrom) notes.push(`file moved from ${relocatedFrom}`);\n  if (status !== 'ok' && status !== 'unresolved' && loc.lineNumber !== anchorIdx + 1) {\n    notes.push(`line ${loc.lineNumber} -> ${anchorIdx + 1}`);\n  }\n  if (status === 'fuzzy') notes.push('partial text match; double-check');\n  if (status === 'unresolved') notes.push(`line content not found in ${relPath}: \"${loc.lineContent}\"`);\n  if (notes.length) result.note = notes.join('; ');\n  else delete result.note;\n  return result;\n}\n\n/** Anchors every location of a normalized map in place; returns a summary report. */\nexport function anchorMap(root, map) {\n  const cache = new FileCache(root);\n  const report = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0, issues: [] };\n  for (const trace of map.traces) {\n    trace.locations = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      report[r.status]++;\n      if (r.status !== 'ok') report.issues.push({ id: r.id, status: r.status, path: r.path, note: r.note });\n      return r;\n    });\n  }\n  report.total = map.traces.reduce((n, t) => n + t.locations.length, 0);\n  report.healthy = report.unresolved === 0 && report.missing === 0;\n  return report;\n}\n\n/** Search helper for agents: lines in a file matching a regex or literal, with numbers. */\nexport function findInFile(root, rel, pattern, { regex = false, limit = 20 } = {}) {\n  const cache = new FileCache(root);\n  const file = cache.read(rel.replace(/\\\\/g, '/'));\n  if (!file) throw new Error(`File not found or unreadable: ${rel}`);\n  const re = regex ? new RegExp(pattern) : null;\n  const hits = [];\n  file.lines.forEach((l, i) => {\n    if (hits.length \u003c limit && (re ? re.test(l) : l.includes(pattern))) {\n      hits.push({ lineNumber: i + 1, lineContent: l.trim() });\n    }\n  });\n  return { path: rel, totalLines: file.lines.length, hits };\n}\n"},"markdown":"# Waymark: Verificación de deriva y reanclaje de Waymark\n\nExplica cómo Waymark detecta deriva, reubica anclas y guarda correcciones opcionales.\n\n_id: `verificacion-de-deriva-y-reanclaje-de-waymark-8c8a2e` · commit 92eefc33 · updated 2026-10-20 · query: \"How does waymark verify detect drift and re-anchor locations after code changes?\"_\n\n## The story\n\nUn mapa Waymark conserva rutas, líneas, texto y hashes que pueden quedar desfasados cuando cambia el código. La CLI [1a] y el MCP [1b] reúnen los mapas solicitados y entregan cada uno a `verifyMap` [1c]; este contrasta sus ubicaciones [1d] con el árbol de trabajo mediante `anchorLocation` [2a]. Si la ruta desapareció, se busca otra entre archivos rastreados por Git [2b]; después se intenta la línea previa [2d], el mismo texto en otra línea [2e] y, como último recurso, una coincidencia parcial o de símbolo [2f]. El resultado separa dos señales: los hashes y cambios de ubicación determinan `stale` [1e] [1f] [1g], mientras `unresolved` o `missing` determinan `broken` [1g]. Sin `fix`, se informa la deriva sin persistir nuevos anclajes [3a]; con `fix`, se guardan el JSON y el visor HTML si hubo cambios [3b] [3d] [3e]. La CLI muestra el estado y fija su salida según anclas rotas y `--strict` [3f] [3g]; un estado `fuzzy` merece revisión porque la cercanía textual no demuestra identidad semántica [2g].\n\n## Trace 1: Entrada y diagnóstico de deriva\n\nSelecciona mapas, verifica ubicaciones y resume deriva o anclas rotas.\n\n### Motivation\n\nLos mapas son fotografías de ubicaciones del código; antes de usarlos, Waymark necesita saber si esas referencias todavía apuntan al mismo lugar. Esta etapa concentra las dos entradas públicas y produce un diagnóstico común, para que CLI y MCP apliquen las mismas reglas de verificación.\n\n### Details\n\nLa CLI toma un ID o enumera todos los mapas [1a]; el MCP hace la misma selección y devuelve los informes como texto estructurado [1b]. `verifyMap` carga el JSON persistido y crea una `FileCache` compartida [1c], luego envía cada ubicación a `anchorLocation` y cuenta sus estados [1d]. Para cada ubicación compara el hash guardado con el actual [1e] y registra movimientos, cambios de ruta o estados distintos de `ok` [1f]. `stale` se activa por cambios de ancla o de hash, mientras `broken` suma solo `unresolved` y `missing` [1g]; por eso un archivo puede estar cambiado aunque todas sus líneas ancladas sigan coincidiendo.\n\n### Tree\n\n```text\n├── Entradas\n│   ├── [1a] Entrada CLI verify  src/cli.js:231\n│   └── [1b] Entrada MCP verify  src/mcp.js:232\n└── [1c] Carga del mapa  src/verify.js:10\n    ├── [1d] Comprueba cada ubicación  src/verify.js:18\n    │   ├── [1e] Detecta hash cambiado  src/verify.js:20\n    │   └── [1f] Registra cambios de ubicación  src/verify.js:21\n    └── [1g] Calcula estado global  src/verify.js:43\n```\n\n- **[1a] Entrada CLI verify** — `src/cli.js:231`\n  La CLI selecciona mapas y pasa la opción `fix` a `verifyMap`.\n  El comando `verify` toma el primer argumento como ID; si falta, `listMaps` aporta todos los IDs. Cada ID llega a `verifyMap` con `opt.fix`, de modo que la selección no altera la lógica de cotejo. Después, la CLI traduce el informe a una línea de estado y cambios visibles [3f]. Si se verifican varios mapas, acumula fallos para decidir una sola salida [3g].\n  ```\n     228      }\n     229      case 'verify': {\n     230        const r = root();\n  >  231        const ids = rest[0] ? [rest[0]] : listMaps(r).map((m) => m.id);\n     232        let bad = false;\n     233        for (const id of ids) {\n     234          const v = verifyMap(r, id, { fix: opt.fix });\n     235          const state = v.broken ? 'BROKEN' : v.stale ? 'STALE' : 'OK';\n     236          out(`${state.padEnd(7)} ${v.id}  map@${v.mapCommit || '?'} head@${v.headCommit || '?'}${v.fixed ? '  (fixed)' : ''}`);\n     237          for (const c of v.changes) out(`        ${c.status.padEnd(10)} [${c.id}] ${c.from} -> ${c.to}${c.note ? '  ' + c.note : ''}`);\n     238          if (v.broken || (opt.strict && v.stale && !v.fixed)) bad = true;\n     239        }\n     240        if (bad) process.exitCode = 1;\n     241        return;\n     242      }\n     243      case 'render': {\n     244        const r = root();\n     245        const p = writeHtml(r, loadMap(r, rest[0]));\n  ```\n- **[1b] Entrada MCP verify** — `src/mcp.js:232`\n  El MCP verifica un mapa o todos y devuelve sus informes.\n  El controlador MCP resuelve primero la raíz indicada por el cliente y obtiene el ID solicitado o todos los IDs guardados. Invoca `verifyMap` para cada uno con el mismo valor `fix` que recibe la herramienta. Los objetos resultantes se devuelven mediante `text`, sin la presentación `OK`/`STALE`/`BROKEN` de la CLI. Por ello los consumidores MCP deben interpretar `stale`, `broken`, `counts` y `changes` del informe [1g].\n  ```\n     229      safe(async ({ id, fix, root }) => {\n     230        const r = rootOf(root);\n     231        const ids = id ? [id] : listMaps(r).map((m) => m.id);\n  >  232        return text(ids.map((i) => verifyMap(r, i, { fix })));\n     233      }),\n     234    );\n     235  \n     236    server.registerTool(\n     237      'waymark_render',\n     238      {\n     239        title: 'Render waymark viewer',\n     240        description: 'Regenerates the self-contained HTML viewer of a waymark and optionally opens it in the default browser.',\n     241        inputSchema: { id: z.string(), open: z.boolean().optional(), root: rootArg },\n     242      },\n     243      safe(async ({ id, open, root }) => {\n     244        const r = rootOf(root);\n     245        const p = writeHtml(r, loadMap(r, id));\n     246        if (open) openFile(p);\n  ```\n- **[1c] Carga del mapa** — `src/verify.js:10`\n  `verifyMap` carga el mapa y prepara caché, cambios y conteos.\n  `loadMap` lee el documento JSON persistido que contiene los trazos y sus ubicaciones. `verifyMap` crea una `FileCache` por ejecución, además de listas para cambios, archivos con hash distinto y estados contados. La misma caché alimenta todas las llamadas posteriores a `anchorLocation` [1d], evitando releer rutas repetidas. Si el ID no identifica un mapa guardado, la carga falla antes de inspeccionar código.\n  ```\n       7   * With fix=true, corrected line numbers/snippets are written back.\n       8   */\n       9  export function verifyMap(root, id, { fix = false } = {}) {\n  >   10    const doc = loadMap(root, id);\n      11    const cache = new FileCache(root);\n      12    const changes = [];\n      13    const changedFiles = new Set();\n      14    const counts = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0 };\n      15  \n      16    for (const trace of doc.traces) {\n      17      trace.locations = trace.locations.map((loc) => {\n      18        const r = anchorLocation(cache, loc);\n      19        counts[r.status]++;\n      20        if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      21        if (r.status !== 'ok' || r.lineNumber !== loc.lineNumber || r.path !== loc.path) {\n      22          changes.push({\n      23            id: loc.id,\n      24            status: r.status,\n  ```\n- **[1d] Comprueba cada ubicación** — `src/verify.js:18`\n  Cada ubicación pasa por `anchorLocation` y suma un estado.\n  `verifyMap` recorre `doc.traces` y transforma cada `trace.locations` con `map`. Para cada `loc`, `anchorLocation` contrasta el ancla guardada con el archivo de trabajo y devuelve un resultado `r` [2i]. Ese estado incrementa `counts`, que después determina `broken` y queda en el informe [1g]. La transformación devuelve la ubicación original sin `fix`, o el resultado calculado con `fix` [3a].\n  ```\n      15  \n      16    for (const trace of doc.traces) {\n      17      trace.locations = trace.locations.map((loc) => {\n  >   18        const r = anchorLocation(cache, loc);\n      19        counts[r.status]++;\n      20        if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      21        if (r.status !== 'ok' || r.lineNumber !== loc.lineNumber || r.path !== loc.path) {\n      22          changes.push({\n      23            id: loc.id,\n      24            status: r.status,\n      25            from: `${loc.path}:${loc.lineNumber}`,\n      26            to: `${r.path}:${r.lineNumber}`,\n      27            note: r.note,\n      28          });\n      29        }\n      30        return fix ? r : loc;\n      31      });\n      32    }\n  ```\n- **[1e] Detecta hash cambiado** — `src/verify.js:20`\n  Un hash diferente registra el archivo en `changedFiles`.\n  La ubicación conserva `loc.fileHash` y el nuevo anclaje devuelve `r.fileHash` del archivo leído [2a]. Si ambos existen y difieren, se añade `r.path` a un `Set`, por lo que una ruta aparece una sola vez aunque tenga varias ubicaciones. Ese conjunto contribuye a `stale` [1g] incluso cuando el texto de todas las líneas ancladas aún coincide. Al faltar cualquiera de los hashes, esta comparación no registra cambio.\n  ```\n      17      trace.locations = trace.locations.map((loc) => {\n      18        const r = anchorLocation(cache, loc);\n      19        counts[r.status]++;\n  >   20        if (loc.fileHash && r.fileHash && in resolver.\n  El informe considera `broken` la suma de ubicaciones `unresolved` y `missing`, contadas durante el recorrido [1d]. Considera `stale` cualquier entrada en `changes` [1f] o cualquier archivo con hash diferente [1e]. Así, `moved`, `relocated` y `fuzzy` pueden señalar deriva sin sumar a `broken`; `fuzzy` sigue requiriendo juicio humano [2g]. La CLI prioriza `BROKEN` al mostrar el resultado [3f].\n  ```\n      40      counts,\n      41      changedFiles: [...changedFiles],\n      42      changes,\n  >   43      stale: changes.length > 0 || changedFiles.size > 0,\n      44      broken,\n      45      fixed: false,\n      46    };\n      47    if (fix && (changes.length || changedFiles.size)) {\n      48      doc.meta = { ...doc.meta, verifiedAt: new Date().toISOString(), commit: headCommit(root), anchors: { ...counts } };\n      49      persist(root, doc);\n      50      writeHtml(root, doc);\n      51      result.fixed = true;\n      52    }\n      53    return result;\n      54  }\n      55  \n  ```\n\n## Trace 2: Búsqueda y clasificación del ancla\n\nBusca cada ancla en el código actual y clasifica el resultado.\n\n### Motivation\n\nUn número de línea aislado envejece en cuanto alguien inserta o mueve código. Esta etapa busca evidencia textual en el archivo actual y distingue coincidencias seguras de aproximaciones que deben inspeccionarse.\n\n### Details\n\n`FileCache` lee el archivo dentro del repositorio, reutiliza la lectura y calcula un hash normalizado [2a]. Si no puede leer la ruta original, intenta localizar un archivo Git con el mismo nombre base [2b]; sin archivo legible devuelve `missing` [2c]. Con el archivo disponible, `anchorLocation` compara primero la línea anterior tras normalizar espacios [2d], luego el texto exacto más cercano [2e]. Si no hay coincidencia exacta, prueba inclusión parcial y después el símbolo [2f], clasificando el resultado como `fuzzy` [2g]. Una ruta alternativa con coincidencia `ok` o `moved` se marca `relocated` [2h
