n.js';\nimport { verifyMap } from './verify.js';\nimport { suggestTopics } from './suggest.js';\nimport { waymarkGuide, enrichGuide, refreshGuide } from './guide.js';\nimport { lintMap } from './lint.js';\nimport { mapsForFile, renderFileContext } from './context.js';\nimport { renderMarkdown } from './render/markdown.js';\nimport { renderMermaid } from './render/mermaid.js';\nimport { openFile } from './open.js';\nimport { install } from './install.js';\n\nconst HERE = path.dirname(fileURLToPath(import.meta.url));\n\nconst HELP = `waymark — hierarchical, line-anchored maps of how code executes\n\nUsage: waymark \u003ccommand> [options]\n\n  generate \"\u003ctopic>\"     Build a map headlessly with an agent CLI\n                         [--engine claude|codex] (default: claude if installed, else codex)\n                         [--mode fast|smart] [--model \u003cm>] [--open] [--max-turns \u003cn> (claude)] [--approval \u003cmode> (codex)]\n  enrich \u003cid>            Add storytelling (story, Motivation/Details, per-node explanations) to an\n                         existing map with an agent CLI [--engine claude|codex] [--model \u003cm>] [--open]\n  annotate \u003cid> \u003cpatch.json>  Apply prose fields (story, traces[].motivation|details, locations[].explanation)\n  create \u003cfile.json>     Validate, anchor and store a map written as JSON [--id \u003cid>] [--open]\n  list                   List maps in the repo [--json]\n  show \u003cid>              Print a map [--format markdown|compact|json|mermaid]\n  verify [id]            Check anchors and narrative drift against current code [--fix] [--strict]\n                         exit 1 if anchors are broken (--strict: also if stale; --strict-narrative:\n                         also if prose was written for code that has since changed)\n  refresh \u003cid>           Rewrite only the prose whose code changed (agent CLI) [--engine] [--model] [--open]\n  lint [id]              Quality checks: unknown [refs], missing narrative, uncited nodes… [--strict] [--json]\n  for-file \u003cpath> [line] Maps/traces/nodes covering a file [--json]\n  hook \u003ckind>            Claude Code hook entry point (pre-edit | post-edit | post-read), reads stdin JSON\n  render \u003cid>            Regenerate the HTML viewer [--open]\n  delete \u003cid>            Delete a map\n  suggest                Suggest topics from recent work [--json]\n  guide [\"\u003ctopic>\"]      Print the Waymark agent procedure (for any harness)\n  install                Wire into a repo for Claude Code + Codex (CLI, IDE, desktop) + AGENTS.md\n                         [--target \u003cdir>] [--no-claude] [--no-codex] [--no-agents-md] [--no-hooks]\n                         [--claude-global] also register for every project: claude mcp add -s user + ~/.claude/skills|agents\n                         [--codex-global]  also register in ~/.codex/config.toml + ~/.agents/skills\n                         [--global]        both of the above\n                         [--global-bin]    use the waymark-mcp bin instead of an absolute path\n                         [--vscode]        package and install the VS Code extension (vscode/)\n  mcp                    Run the MCP server on stdio\n\nGlobal: --root \u003cdir>  repository root (default: git toplevel of cwd)\n`;\n\nconst { values: opt, positionals } = parseArgs({\n  allowPositionals: true,\n  options: {\n    root: { type: 'string' },\n    id: { type: 'string' },\n    format: { type: 'string' },\n    model: { type: 'string' },\n    'max-turns': { type: 'string' },\n    engine: { type: 'string' },\n    mode: { type: 'string' },\n    approval: { type: 'string' },\n    'no-codex': { type: 'boolean' },\n    'codex-global': { type: 'boolean' },\n    'claude-global': { type: 'boolean' },\n    global: { type: 'boolean' },\n    target: { type: 'string' },\n    open: { type: 'boolean' },\n    fix: { type: 'boolean' },\n    strict: { type: 'boolean' },\n    'strict-narrative': { type: 'boolean' },\n    json: { type: 'boolean' },\n    'no-claude': { type: 'boolean' },\n    'no-agents-md': { type: 'boolean' },\n    'no-hooks': { type: 'boolean' },\n    'global-bin': { type: 'boolean' },\n    vscode: { type: 'boolean' },\n    help: { type: 'boolean', short: 'h' },\n  },\n});\n\nconst [cmd, ...rest] = positionals;\nconst root = () => resolveRoot(opt.root);\nconst out = (v) => console.log(typeof v === 'string' ? v : JSON.stringify(v, null, 2));\n\nfunction printReport(res) {\n  const a = res.report;\n  out(`✔ ${res.doc.id}  (${a.total} locations: ${a.ok} ok, ${a.moved + a.relocated} re-anchored, ${a.fuzzy} approx, ${a.unresolved + a.missing} unverified)`);\n  for (const i of a.issues) out(`  ${i.status.padEnd(10)} [${i.id}] ${i.path}  ${i.note || ''}`);\n  out(`  json: ${res.jsonPath}\\n  html: ${res.htmlPath}`);\n}\n\nconst MCP_ENTRY = path.join(HERE, 'mcp.js');\nconst fwd = (p) => p.replace(/\\\\/g, '/');\n\n/** Claude Code headless: only read tools + waymark MCP are allowed. */\nfunction claudeInvocation(r, prompt) {\n  const cfgPath = path.join(os.tmpdir(), `waymark-mcp-${process.pid}.json`);\n  fs.writeFileSync(\n    cfgPath,\n    JSON.stringify({ mcpServers: { waymark: { command: process.execPath, args: [MCP_ENTRY], env: { WAYMARK_ROOT: r } } } }),\n  );\n  const args = ['-p', prompt, '--mcp-config', cfgPath, '--strict-mcp-config', '--allowedTools', 'Read,Grep,Glob,mcp__waymark', '--permission-mode', 'dontAsk'];\n  if (opt.model) args.push('--model', opt.model);\n  if (opt['max-turns']) args.push('--max-turns', opt['max-turns']);\n  return { bin: resolveCommand('claude'), args, stdin: null, cleanup: () => fs.rmSync(cfgPath, { force: true }) };\n}\n\n/** Codex headless (codex exec): read-only sandbox; the MCP server (outside the sandbox) does the writing. */\nfunction codexInvocation(r, prompt) {\n  const toml = JSON.stringify;\n  const args = [\n    'exec',\n    '--sandbox', 'read-only',\n    '--skip-git-repo-check',\n    '--color', 'never',\n    '-C', r,\n    '-c', `mcp_servers.waymark.command=${toml(fwd(process.execPath))}`,\n    '-c', `mcp_servers.waymark.args=[${toml(fwd(MCP_ENTRY))}]`,\n    '-c', `mcp_servers.waymark.env={WAYMARK_ROOT=${toml(fwd(r))}}`,\n    '-c', 'mcp_servers.waymark.startup_timeout_sec=20',\n    '-c', 'mcp_servers.waymark.tool_timeout_sec=120',\n    '-c', `mcp_servers.waymark.default_tools_approval_mode=${toml(opt['approval'] || 'approve')}`,\n  ];\n  if (opt.model) args.push('-m', opt.model);\n  args.push('-'); // prompt from stdin: avoids command-line length/quoting limits\n  return { bin: resolveCommand('codex'), args, stdin: prompt, cleanup: () => {} };\n}\n\nfunction pickEngine() {\n  const e = opt.engine || 'auto';\n  if (e === 'claude' || e === 'codex') return e;\n  if (e !== 'auto') throw new Error(`Unknown engine \"${e}\" (use claude | codex)`);\n  return resolveCommand('claude') ? 'claude' : 'codex';\n}\n\n/** Runs Claude Code or Codex headlessly with only read tools + the waymark MCP server. */\nasync function runAgent(r, task) {\n  const engine = pickEngine();\n  const tools = engine === 'codex' ? 'read-only shell commands (rg, sed -n, git grep, ls)' : 'Read/Grep/Glob';\n  const prompt =\n    task +\n    `\\n\\nRepository root: ${r}\\nWork autonomously: do not ask questions. Explore with ${tools} only. ` +\n    `Always pass root=\"${fwd(r)}\" to waymark_* tools. When done, answer with the map id and a short summary.`;\n  const inv = engine === 'codex' ? codexInvocation(r, prompt) : claudeInvocation(r, prompt);\n  if (!inv.bin) throw new Error(`\"${engine}\" CLI not found on PATH`);\n  out(`waymark: running ${engine}…`);\n  const code = await new Promise((res, rej) => {\n    const p = spawn(inv.bin.command, [...inv.bin.args, ...inv.args], {\n      cwd: r,\n      stdio: [inv.stdin ? 'pipe' : 'ignore', 'inherit', 'inherit'],\n      shell: !!inv.bin.shell,\n    });\n    p.on('error', (e) => rej(new Error(`Could not run ${engine}: ${e.message}`)));\n    p.on('close', res);\n    if (inv.stdin) p.stdin.end(inv.stdin);\n  }).finally(inv.cleanup);\n  return code ?? 1;\n}\n\nasync function generate(topic) {\n  if (!topic) throw new Error('Usage: waymark generate \"\u003ctopic>\" [--engine claude|codex] [--mode fast|smart]');\n  const r = root();\n  const before = new Set(listMaps(r).map((m) => m.id));\n  const mode = opt.mode === 'fast' ? 'fast' : 'smart';\n  const code = await runAgent(r, waymarkGuide(topic, { mode }));\n  const created = listMaps(r).filter((m) => !before.has(m.id));\n  if (created[0]) {\n    const html = path.join(mapDir(r), `${created[0].id}.html`);\n    const gaps = narrativeGaps(loadMap(r, created[0].id));\n    out(`\\nwaymark: ${created[0].id}\\nhtml: ${html}`);\n    if (!gaps.complete) out(`narrative incomplete — run: waymark enrich ${created[0].id}`);\n    if (opt.open) openFile(html);\n  } else if (code === 0) {\n    out('\\n(no new map was stored; the agent may have updated an existing one)');\n  }\n  process.exitCode = code;\n}\n\nasync function enrich(id) {\n  if (!id) throw new Error('Usage: waymark enrich \u003cid> [--engine claude|codex]');\n  const r = root();\n  const doc = loadMap(r, id);\n  const code = await runAgent(r, enrichGuide(doc.id));\n  const gaps = narrativeGaps(loadMap(r, doc.id));\n  const html = path.join(mapDir(r), `${doc.id}.html`);\n  out(`\\nwaymark: ${doc.id}  narrative ${gaps.complete ? 'complete' : 'still incomplete: ' + JSON.stringify(gaps)}\\nhtml: ${html}`);\n  if (opt.open) openFile(html);\n  process.exitCode = code;\n}\n\nasync function refresh(id) {\n  if (!id) throw new Error('Usage: waymark refresh \u003cid> [--engine claude|codex]');\n  const r = root();\n  const v = verifyMap(r, id, { fix: true });\n  if (!v.narrative.stale && !v.broken) {\n    out(`waymark: ${v.id} narrative is in sync with the code; nothing to refresh.`);\n    return;\n  }\n  const brokenIds = v.changes.filter((c) => c.status === 'unresolved' || c.status === 'missing').map((c) => c.id);\n  const code = await runAgent(r, refreshGuide(v.id, v.narrative, brokenIds));\n  const after = verifyMap(r, v.id);\n  out(`\\nwaymark: ${v.id}  narrative ${after.narrative.stale ? 'still flagged: ' + JSON.stringify(after.narrative) : 'in sync'}`);\n  if (opt.open) openFile(path.join(mapDir(r), `${v.id}.html`));\n  process.exitCode = code;\n}\n\nasync function main() {\n  if (!cmd || opt.help) return out(HELP);\n  switch (cmd) {\n    case 'mcp': {\n      const { startStdio } = await import('./mcp.js');\n      return startStdio();\n    }\n    case 'generate':\n      return generate(rest.join(' '));\n    case 'enrich':\n      return enrich(rest[0]);\n    case 'refresh':\n      return refresh(rest[0]);\n    case 'lint': {\n      const r = root();\n      const ids = rest[0] ? [loadMap(r, rest[0]).id] : listMaps(r).map((m) => m.id);\n      const results = ids.map((i) => lintMap(loadMap(r, i)));\n      if (opt.json) return out(results);\n      let bad = false;\n      for (const res of results) {\n        out(`${res.errors ? 'ERRORS ' : res.warnings ? 'WARN   ' : 'OK     '} ${res.id}  (${res.errors} errors, ${res.warnings} warnings)`);\n        for (const i of res.issues) out(`        ${i.level.padEnd(5)} ${i.where}: ${i.message}`);\n        if (res.errors || (opt.strict && res.warnings)) bad = true;\n      }\n      if (bad) process.exitCode = 1;\n      return;\n    }\n    case 'for-file': {\n      if (!rest[0]) throw new Error('Usage: waymark for-file \u003cpath> [line]');\n      const res = mapsForFile(root(), rest[0], { line: rest[1] ? Number(rest[1]) : null });\n      if (opt.json) return out({ path: res.path, maps: res.maps.map(({ doc, ...m }) => m) });\n      return out(renderFileContext(res, { maxChars: 20000 }) || `No waymark map covers ${res.path}.`);\n    }\n    case 'hook': {\n      const { runHook } = await import('./hooks.js');\n      return runHook(rest[0]);\n    }\n    case 'annotate': {\n      if (!rest[0] || !rest[1]) throw new Error('Usage: waymark annotate \u003cid> \u003cpatch.json|->');\n      const raw = rest[1] === '-' ? fs.readFileSync(0, 'utf8') : fs.readFileSync(rest[1], 'utf8');\n      const res = annotateMap(root(), rest[0], JSON.parse(raw));\n      out(`✔ ${res.id}: ${res.changed} fields changed${res.unknown.length ? '; unknown: ' + res.unknown.join(', ') : ''}`);\n      if (!res.narrative.complete) out('  still missing: ' + JSON.stringify(res.narrative));\n      out('  html: ' + res.htmlPath);\n      return;\n    }\n    case 'create': {\n      if (!rest[0]) throw new Error('Usage: waymark create \u003cfile.json|->');\n      const raw = rest[0] === '-' ? fs.readFileSync(0, 'utf8') : fs.readFileSync(rest[0], 'utf8');\n      const res = saveMap(root(), JSON.parse(raw), { id: opt.id });\n      printReport(res);\n      if (opt.open) openFile(res.htmlPath);\n      if (!res.report.healthy) process.exitCode = 2;\n      return;\n    }\n    case 'list': {\n      const maps = listMaps(root());\n      if (opt.json) return out(maps);\n      if (!maps.length) return out('No waymark yet. Try: waymark generate \"how does X work?\"');\n      for (const m of maps) out(`${m.id.padEnd(44)} ${String(m.locations).padStart(3)} nodes  ${(m.updatedAt || '').slice(0, 10)}  ${m.title}`);\n      return;\n    }\n    case 'show': {\n      const doc = loadMap(root(), rest[0]);\n      const f = opt.format || 'markdown';\n      return out(f === 'json' ? doc : f === 'mermaid' ? renderMermaid(doc) : renderMarkdown(doc, { detail: f === 'compact' ? 'compact' : 'full' }));\n    }\n    case 'verify': {\n      const r = root();\n      const ids = rest[0] ? [rest[0]] : listMaps(r).map((m) => m.id);\n      let bad = false;\n      for (const id of ids) {\n        const v = verifyMap(r, id, { fix: opt.fix });\n        const state = v.broken ? 'BROKEN' : v.stale ? 'STALE' : 'OK';\n        out(`${state.padEnd(7)} ${v.id}  map@${v.mapCommit || '?'} head@${v.headCommit || '?'}${v.fixed ? '  (fixed)' : ''}`);\n        for (const c of v.changes) out(`        ${c.status.padEnd(10)} [${c.id}] ${c.from} -> ${c.to}${c.note ? '  ' + c.note : ''}`);\n        if (v.narrative.stale) {\n          const parts = [];\n          if (v.narrative.nodes.length) parts.push('nodes ' + v.narrative.nodes.map((n) => `[${n}]`).join(', '));\n          if (v.narrative.traces.length) parts.push('trace guides ' + v.narrative.traces.join(', '));\n          if (v.narrative.story) parts.push('story');\n          out(`        narrative  review ${parts.join('; ')} (code changed since written) → waymark refresh ${v.id}`);\n        }\n        if (v.broken || (opt.strict && v.stale && !v.fixed) || (opt['strict-narrative'] && v.narrative.stale)) bad = true;\n      }\n      if (bad) process.exitCode = 1;\n      return;\n    }\n    case 'render': {\n      const r = root();\n      const p = writeHtml(r, loadMap(r, rest[0]));\n      out(p);\n      if (opt.open) openFile(p);\n      return;\n    }\n    case 'delete':\n      return out(`deleted ${deleteMap(root(), rest[0])}`);\n    case 'suggest': {\n      const s = suggestTopics(root());\n      if (opt.json) return out(s);\n      s.suggestions.forEach((x, i) => out(`${i + 1}. ${x.topic}\\n   ${x.reason}`));\n      return;\n    }\n    case 'guide':\n      return out(waymarkGuide(rest.join(' ')));\n    case 'install':\n      return out(\n        install({\n          target: resolveRoot(opt.target || opt.root),\n          claude: !opt['no-claude'],\n          codex: !opt['no-codex'],\n          codexGlobal: !!(opt['codex-global'] || opt.global),\n          claudeGlobal: !!(opt['claude-global'] || opt.global),\n          vscode: !!opt.vscode,\n          agentsMd: !opt['no-agents-md'],\n          hooks: !opt['no-hooks'],\n          useGlobalBin: !!opt['global-bin'],\n        }),\n      );\n    default:\n      throw new Error(`Unknown command \"${cmd}\". Run waymark --help`);\n  }\n}\n\nmain().catch((e) => {\n  console.error(`waymark: ${e.message}`);\n  process.exit(1);\n});\n","src/mcp.js":"#!/usr/bin/env node\nimport * as z from 'zod';\nimport { McpServer, ResourceTemplate } from '@modelcontextprotocol/sdk/server/mcp.js';\nimport { StdioServerTransport } from '@modelcontextprotocol/sdk/server/stdio.js';\nimport { MapInput } from './schema.js';\nimport { fileURLToPath } from 'node:url';\nimport { resolveRoot } from './git.js';\nimport { saveMap, loadMap, listMaps, writeHtml, deleteMap, annotateMap, narrativeGaps } from './store.js';\nimport { lintMap } from './lint.js';\nimport { mapsForFile, renderFileContext, forFileSummary } from './context.js';\nimport { verifyMap } from './verify.js';\nimport { findInFile } from './anchor.js';\nimport { suggestTopics } from './suggest.js';\nimport { waymarkGuide, enrichGuide, refreshGuide } from './guide.js';\nimport { renderMarkdown } from './render/markdown.js';\nimport { renderMermaid } from './render/mermaid.js';\nimport { openFile } from './open.js';\n\nconst VERSION = '0.1.0';\nconst rootArg = z.string().optional().describe('Repository root. Defaults to the server working directory / WAYMARK_ROOT');\n\nconst text = (t) => ({ content: [{ type: 'text', text: typeof t === 'string' ? t : JSON.stringify(t, null, 2) }] });\nconst fail = (e) => ({ isError: true, content: [{ type: 'text', text: String(e?.message || e) }] });\nconst safe = (fn) => async (args) => {\n  try {\n    return await fn(args);\n  } catch (e) {\n    return fail(e);\n  }\n};\n\n// Workspace announced by the client (MCP roots). Lets a globally installed server\n// (e.g. ~/.codex/config.toml used by Codex desktop) target the open project.\nlet clientRoot = null;\nconst rootOf = (root) => resolveRoot(root || process.env.WAYMARK_ROOT || clientRoot || undefined);\n\nexport function createServer() {\n  const server = new McpServer(\n    { name: 'waymark', version: VERSION },\n    {\n      instructions:\n        'Waymark: hierarchical, line-anchored maps of how code executes. To create one, call waymark_start(query) and follow the returned procedure, then waymark_create. ' +\n        'To use an existing map as context, read resource waymark://\u003cid> or call waymark_get. Run waymark_verify before trusting an old map.',\n    },\n  );\n\n  server.registerTool(\n    'waymark_start',\n    {\n      title: 'Start a waymark',\n      description:\n        'Begin generating a waymark map for a topic/question. Returns the Waymark agent procedure (structure + storytelling rules), the input format, repo hints (recent files, entry points) and existing maps. Call this first, then explore the code and submit with waymark_create.',\n      inputSchema: {\n        query: z.string().describe('Topic or question, e.g. \"how does checkout payment work?\"'),\n        mode: z.enum(['fast', 'smart']).optional().describe('fast: short map quickly; smart (default): thorough map with full storytelling'),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ query, mode, root }) => {\n      const r = rootOf(root);\n      const hints = suggestTopics(r, { limit: 5 });\n      const existing = listMaps(r).slice(0, 15).map(({ id, title, query: q, updatedAt }) => ({ id, title, query: q, updatedAt }));\n      return text(\n        `${waymarkGuide(query, { mode })}\\n## Repository\\n\\nroot: ${r}\\n\\n` +\n          `Entry points: ${hints.entryPoints.join(', ') || '(none detected)'}\\n\\n` +\n          (hints.viewedFiles.length ? `Recently viewed in the editor: ${hints.viewedFiles.map((f) => f.file).join(', ')}\\n\\n` : '') +\n          `Recently touched: ${hints.recentFiles.slice(0, 12).map((f) => f.file).join(', ') || '(none)'}\\n\\n` +\n          `Existing waymark (reuse/update instead of duplicating): ${existing.length ? JSON.stringify(existing) : 'none'}`,\n      );\n    }),\n  );\n\n  server.registerTool(\n    'waymark_suggest_topics',\n    {\n      title: 'Suggest waymark topics',\n      description: 'Suggests waymark topics from recent work (uncommitted and recently committed files, commit subjects) and detected entry points.',\n      inputSchema: { root: rootArg, limit: z.number().int().min(1).max(20).optional() },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ root, limit }) => text(suggestTopics(rootOf(root), { limit }))),\n  );\n\n  server.registerTool(\n    'waymark_find_anchor',\n    {\n      title: 'Find anchor lines',\n      description: 'Returns line numbers and exact line text in a file matching a literal string or regex. Use it to get precise lineNumber/lineContent for locations.',\n      inputSchema: {\n        path: z.string().describe('File path relative to repo root'),\n        pattern: z.string(),\n        regex: z.boolean().optional(),\n        limit: z.number().int().min(1).max(100).optional(),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ path, pattern, regex, limit, root }) => text(findInFile(rootOf(root), path, pattern, { regex, limit }))),\n  );\n\n  server.registerTool(\n    'waymark_create',\n    {\n      title: 'Create or update a waymark',\n      description:\n        'Validates a waymark, verifies every location against the working tree (auto-correcting shifted line numbers), stores it under .waymark/ and writes a shareable HTML viewer. Pass `id` to overwrite an existing map. Returns an anchor report: fix any unresolved/missing locations and resubmit.',\n      inputSchema: {\n        ...MapInput.shape,\n        id: z.string().optional().describe('Existing waymark id to overwrite'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...map }) => {\n      const r = rootOf(root);\n      const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });\n      server.sendResourceListChanged();\n      const next = [];\n      if (!report.healthy) {\n        next.push('Some locations could not be verified. Fix them (waymark_find_anchor helps) and call waymark_create again with id=\"' + doc.id + '\".');\n      }\n      if (!narrative.complete) {\n        next.push('Narrative is incomplete (see \"narrative\"). Fill the story, trace motivation/details and per-location explanations with waymark_annotate(id=\"' + doc.id + '\").');\n      }\n      const lint = lintMap(doc);\n      if (lint.errors) next.push('Lint found ' + lint.errors + ' error(s) (e.g. references to unknown nodes): fix them with waymark_annotate.');\n      if (!next.length) next.push('All anchors verified and narrative complete. Share the HTML file or reference waymark://' + doc.id);\n      return text({\n        id: doc.id,\n        resource: `waymark://${doc.id}`,\n        html: htmlPath,\n        json: jsonPath,\n        anchors: report,\n        narrative,\n        lint: { errors: lint.errors, warnings: lint.warnings, issues: lint.issues.slice(0, 15) },\n        next,\n      });\n    }),\n  );\n\n  const prose = () => z.string().optional();\n  server.registerTool(\n    'waymark_annotate',\n    {\n      title: 'Annotate a waymark (narrative)',\n      description:\n        'Adds or rewrites the prose of an existing map without re-sending or re-anchoring it: map story/description/title, trace motivation/details/description/diagramTitle, location explanation/description/title. Only the fields you pass change. Regenerates the HTML viewer and returns which narrative fields are still missing.',\n      inputSchema: {\n        id: z.string().describe('Map id (a unique prefix is enough)'),\n        title: prose(),\n        description: prose().describe('Map summary citing nodes as [1a]'),\n        story: prose().describe('Holistic storytelling narrative (markdown)'),\n        language: prose(),\n        traces: z\n          .array(\n            z.object({\n              id: z.string(),\n              title: prose(),\n              description: prose(),\n              diagramTitle: prose(),\n              motivation: prose().describe('Why this part exists (markdown)'),\n              details: prose().describe('Narrative walkthrough citing nodes (markdown)'),\n            }),\n          )\n          .optional(),\n        locations: z\n          .array(\n            z.object({\n              id: z.string(),\n              title: prose(),\n              description: prose().describe('One sentence \u003c= 15 words'),\n              explanation: prose().describe('Storytelling explanation, 3-6 sentences (markdown)'),\n            }),\n          )\n          .optional(),\n        reviewed: z\n          .array(z.string())\n          .optional()\n          .describe('Prose confirmed still accurate after a code change: node ids (\"2b\"), \"trace:\u003cid>\" or \"story\"'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...patch }) => text(annotateMap(rootOf(root), id, patch))),\n  );\n\n  server.registerTool(\n    'waymark_enrich',\n    {\n      title: 'Enrich a waymark with storytelling',\n      description:\n        'Returns the procedure to upgrade an existing map with full storytelling (holistic story, Motivation/Details guides per trace, an explanation per location), the list of missing narrative and the map itself. Follow it and save with waymark_annotate.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const doc = loadMap(rootOf(root), id);\n      return text(\n        enrichGuide(doc.id) +\n          '\\n\\n## Missing narrative\\n\\n' +\n          JSON.stringify(narrativeGaps(doc)) +\n          '\\n\\n## Current map\\n\\n' +\n          renderMarkdown(doc, { detail: 'full' }),\n      );\n    }),\n  );\n\n  server.registerTool(\n    'waymark_list',\n    {\n      title: 'List waymark',\n      description: 'Lists waymark stored in the repository (.waymark/).',\n      inputSchema: { root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ root }) => text(listMaps(rootOf(root)))),\n  );\n\n  server.registerTool(\n    'waymark_get',\n    {\n      title: 'Get a waymark',\n      description:\n        'Returns a map for use as context. format: \"markdown\" (narrative + structure + snippets, default), \"compact\" (structure + one-line descriptions), \"json\", \"mermaid\". Pass trace (\"2\") or node (\"2b\") to get only that part — much smaller context.',\n      inputSchema: {\n        id: z.string().describe('Map id (a unique prefix is enough)'),\n        format: z.enum(['markdown', 'compact', 'json', 'mermaid']).optional(),\n        trace: z.string().optional().describe('Only this trace, e.g. \"2\"'),\n        node: z.string().optional().describe('Only this node with its trace context, e.g. \"2b\"'),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, format = 'markdown', trace, node, root }) => {\n      const doc = loadMap(rootOf(root), id);\n      if (format === 'json') return text(doc);\n      if (format === 'mermaid') return text(renderMermaid(doc));\n      return text(renderMarkdown(doc, { detail: format === 'compact' ? 'compact' : 'full', trace, node }));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_for_file',\n    {\n      title: 'Maps covering a file',\n      description:\n        'Lists the maps, traces and nodes that cover a file (optionally the node nearest to a line), with their one-line descriptions, the explanation of the nearest node and a flag when the code changed since a node was explained. Call it before modifying a file to understand the flow it belongs to.',\n      inputSchema: {\n        path: z.string().describe('File path (absolute or relative to the repo root)'),\n        line: z.number().int().positive().optional(),\n        format: z.enum(['markdown', 'json']).optional(),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ path: file, line, format = 'markdown', root }) => {\n      const res = mapsForFile(rootOf(root), file, { line });\n      if (format === 'json') return text(forFileSummary(res));\n      return text(renderFileContext(res, { maxChars: 12000 }) || `No waymark map covers ${res.path}.`);\n    }),\n  );\n\n  server.registerTool(\n    'waymark_lint',\n    {\n      title: 'Lint maps',\n      description:\n        'Static quality checks on maps: references to unknown nodes (errors), missing narrative, nodes not cited in their trace details, nodes missing from the tree, over-long titles/descriptions, very short explanations. Omit id to lint all maps.',\n      inputSchema: { id: z.string().optional(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const r = rootOf(root);\n      const ids = id ? [loadMap(r, id).id] : listMaps(r).map((m) => m.id);\n      return text(ids.map((i) => lintMap(loadMap(r, i))));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_refresh',\n    {\n      title: 'Refresh outdated narrative',\n      description:\n        'Finds prose whose code changed since it was written (narrative drift: nodes, trace guides, story) and returns the procedure to bring it back in sync with waymark_annotate (or mark it reviewed). Use after code changes in areas covered by a map.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const r = rootOf(root);\n      const v = verifyMap(r, id);\n      const doc = loadMap(r, v.id);\n      if (!v.narrative.stale && !v.broken) return text(`Map ${v.id}: narrative is in sync with the code. Nothing to refresh.`);\n      const brokenIds = v.changes.filter((c) => c.status === 'unresolved' || c.status === 'missing').map((c) => c.id);\n      const nodes = [...new Set([...brokenIds, ...v.narrative.nodes])].map((n) => renderMarkdown(doc, { node: n })).join('\\n\\n---\\n\\n');\n      return text(\n        refreshGuide(v.id, v.narrative, brokenIds) +\n          (nodes ? '\\n\\n## Stale nodes (stored prose + last snippet)\\n\\n' + nodes : ''),\n      );\n    }),\n  );\n\n  server.registerTool(\n    'waymark_verify',\n    {\n      title: 'Verify waymark anchors',\n      description:\n        'Re-checks waymark locations against the current code: detects moved lines, renamed files and removed code. With fix=true, writes corrected anchors back. Omit id to verify all maps.',\n      inputSchema: { id: z.string().optional(), fix: z.boolean().optional(), root: rootArg },\n    },\n    safe(async ({ id, fix, root }) => {\n      const r = rootOf(root);\n      const ids = id ? [id] : listMaps(r).map((m) => m.id);\n      return text(ids.map((i) => verifyMap(r, i, { fix })));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_render',\n    {\n      title: 'Render waymark viewer',\n      description: 'Regenerates the self-contained HTML viewer of a waymark and optionally opens it in the default browser.',\n      inputSchema: { id: z.string(), open: z.boolean().optional(), root: rootArg },\n    },\n    safe(async ({ id, open, root }) => {\n      const r = rootOf(root);\n      const p = writeHtml(r, loadMap(r, id));\n      if (open) openFile(p);\n      return text({ html: p });\n    }),\n  );\n\n  server.registerTool(\n    'waymark_delete',\n    {\n      title: 'Delete a waymark',\n      description: 'Deletes a waymark (JSON and HTML) from .waymark/. Only use when the user asks.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { destructiveHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const removed = deleteMap(rootOf(root), id);\n      server.sendResourceListChanged();\n      return text({ deleted: removed });\n    }),\n  );\n\n  // @-mentionable context: waymark://\u003cid>\n  server.registerResource(\n    'waymark',\n    new ResourceTemplate('waymark://{id}', {\n      list: async () => ({\n        resources: listMaps(rootOf()).map((m) => ({\n          uri: `waymark://${m.id}`,\n          name: m.title,\n          description: m.description,\n          mimeType: 'text/markdown',\n        })),\n      }),\n      complete: { id: (v) => listMaps(rootOf()).map((m) => m.id).filter((i) => i.startsWith(v)) },\n    }),\n    { title: 'Waymark', description: 'A waymark rendered as markdown context', mimeType: 'text/markdown' },\n    async (uri, { id }) => ({\n      contents: [{ uri: uri.href, mimeType: 'text/markdown', text: renderMarkdown(loadMap(rootOf(), String(id))) }],\n    }),\n  );\n\n  // @-mention a single trace or node: waymark://\u003cid>/\u003ctrace> or waymark://\u003cid>/\u003cnode>\n  server.registerResource(\n    'waymark-part',\n    new ResourceTemplate('waymark://{id}/{part}', {\n      list: async () => ({\n        resources: listMaps(rootOf()).flatMap((m) => {\n          try {\n            return loadMap(rootOf(), m.id).traces.map((t) => ({\n              uri: `waymark://${m.id}/${t.id}`,\n              name: `${m.title} › ${t.id}. ${t.title}`,\n              description: t.description,\n              mimeType: 'text/markdown',\n            }));\n          } catch {\n            return [];\n          }\n        }),\n      }),\n    }),\n    { title: 'Waymark trace or node', description: 'One trace (\"2\") or one node (\"2b\") of a map, as markdown context', mimeType: 'text/markdown' },\n    async (uri, { id, part }) => {\n      const doc = loadMap(rootOf(), String(id));\n      const isTrace = doc.traces.some((t) => t.id === String(part));\n      const md = renderMarkdown(doc, isTrace ? { trace: String(part) } : { node: String(part) });\n      return { contents: [{ uri: uri.href, mimeType: 'text/markdown', text: md }] };\n    },\n  );\n\n  server.registerPrompt(\n    'create_waymark',\n    {\n      title: 'Create a waymark',\n      description: 'Generate a hierarchical waymark of how the code works for a topic',\n      argsSchema: { query: z.string().describe('Topic or question') },\n    },\n    ({ query }) => ({ messages: [{ role: 'user', content: { type: 'text', text: waymarkGuide(query) } }] }),\n  );\n\n  server.server.oninitialized = async () => {\n    if (!server.server.getClientCapabilities()?.roots) return;\n    try {\n      const { roots } = await server.server.listRoots();\n      const first = roots.find((x) => x.uri.startsWith('file://'));\n      if (first) clientRoot = fileURLToPath(first.uri);\n    } catch {\n      /* client advertised roots but failed to list them: fall back to cwd */\n    }\n  };\n\n  return server;\n}\n\nexport async function startStdio() {\n  const server = createServer();\n  await server.connect(new StdioServerTransport());\n}\n\nif (import.meta.url === `file://${process.argv[1]}` || process.argv[1]?.endsWith('mcp.js')) {\n  startStdio().catch((e) => {\n    console.error(e);\n    process.exit(1);\n  });\n}\n","src/verify.js":"import { FileCache, anchorLocation } from './anchor.js';\nimport { headCommit } from './git.js';\nimport { loadMap, persist, writeHtml, narrativeDrift, baselineNarrative } from './store.js';\n\n/**\n * Re-checks every anchor of a stored waymark against the current working tree, and\n * whether the prose still describes the code it was written for (narrative drift).\n * With fix=true, corrected line numbers/snippets/context hashes are written back\n * (narrative baselines are kept, so drifted prose stays flagged until it is rewritten).\n */\nexport function verifyMap(root, id, { fix = false } = {}) {\n  const doc = loadMap(root, id);\n  const cache = new FileCache(root);\n  const changes = [];\n  const changedFiles = new Set();\n  const counts = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0 };\n  let ctxChanged = false;\n\n  const fresh = { ...doc, traces: [] };\n  for (const trace of doc.traces) {\n    const results = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      counts[r.status]++;\n      if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      if (r.ctxHash !== loc.ctxHash) ctxChanged = true;\n      if (r.status !== 'ok' || r.lineNumber !== loc.lineNumber || r.path !== loc.path) {\n        changes.push({\n          id: loc.id,\n          status: r.status,\n          from: `${loc.path}:${loc.lineNumber}`,\n          to: `${r.path}:${r.lineNumber}`,\n          note: r.note,\n        });\n      }\n      return r;\n    });\n    fresh.traces.push({ ...trace, locations: results });\n    if (fix) trace.locations = results;\n  }\n\n  // Maps created before narrative tracking get a baseline instead of a false alarm.\n  baselineNarrative(fresh);\n  const drift = narrativeDrift(fresh);\n\n  const broken = counts.unresolved + counts.missing;\n  const result = {\n    id: doc.id,\n    title: doc.title,\n    mapCommit: doc.meta?.commit?.slice(0, 8) || null,\n    headCommit: headCommit(root)?.slice(0, 8) || null,\n    counts,\n    changedFiles: [...changedFiles],\n    changes,\n    narrative: drift,\n    stale: changes.length > 0 || changedFiles.size > 0,\n    broken,\n    fixed: false,\n  };\n  const needsBaseline = doc.traces.some((t) => !t.narrativeHash || t.locations.some((l) => !l.narrativeHash));\n  if (fix && (changes.length || changedFiles.size || ctxChanged || needsBaseline)) {\n    baselineNarrative(doc);\n    doc.meta = {\n      ...doc.meta,\n      verifiedAt: new Date().toISOString(),\n      commit: headCommit(root),\n      anchors: { ...counts },\n      narrativeDrift: drift.stale ? { nodes: drift.nodes, traces: drift.traces, story: drift.story } : undefined,\n    };\n    persist(root, doc);\n    writeHtml(root, doc);\n    result.fixed = true;\n  }\n  return result;\n}\n","src/anchor.js":"import fs from 'node:fs';\nimport path from 'node:path';\nimport crypto from 'node:crypto';\nimport { trackedFiles } from './git.js';\n\nconst MAX_FILE_BYTES = 4 * 1024 * 1024;\nconst SNIPPET_BEFORE = 3;\nconst SNIPPET_AFTER = 14;\n\nconst norm = (s) => (s || '').trim().replace(/\\s+/g, ' ');\n\n/** Resolves a repo-relative path, refusing anything that escapes the root. */\nexport function safeJoin(root, rel) {\n  const abs = path.resolve(root, rel);\n  const relBack = path.relative(root, abs);\n  if (relBack.startsWith('..') || path.isAbsolute(relBack)) {\n    throw new Error(`Path \"${rel}\" is outside the repository root`);\n  }\n  return abs;\n}\n\nexport class FileCache {\n  constructor(root) {\n    this.root = root;\n    this.files = new Map();\n    this._tracked = undefined;\n  }\n\n  read(rel) {\n    if (this.files.has(rel)) return this.files.get(rel);\n    let entry = null;\n    try {\n      const abs = safeJoin(this.root, rel);\n      const stat = fs.statSync(abs);\n      if (stat.isFile() && stat.size \u003c= MAX_FILE_BYTES) {\n        const text = fs.readFileSync(abs, 'utf8');\n        entry = {\n          lines: text.split(/\\r?\\n/),\n          hash: crypto.createHash('sha1').update(text.replace(/\\r\\n/g, '\\n')).digest('hex').slice(0, 12),\n        };\n      }\n    } catch {\n      entry = null;\n    }\n    this.files.set(rel, entry);\n    return entry;\n  }\n\n  /** Finds a moved/renamed file by basename when the original path is gone. */\n  findByBasename(rel) {\n    if (this._tracked === undefined) this._tracked = trackedFiles(this.root);\n    if (!this._tracked) return null;\n    const base = path.posix.basename(rel);\n    const hits = this._tracked.filter((f) => path.posix.basename(f) === base);\n    if (hits.length === 1) return hits[0];\n    // Prefer the candidate sharing the longest path suffix.\n    const parts = rel.split('/');\n    let best = null;\n    let bestScore = 0;\n    for (const h of hits) {\n      const hp = h.split('/');\n      let s = 0;\n      while (s \u003c parts.length && s \u003c hp.length && parts[parts.length - 1 - s] === hp[hp.length - 1 - s]) s++;\n      if (s > bestScore) [best, bestScore] = [h, s];\n      else if (s === bestScore) best = null;\n    }\n    return bestScore > 1 ? best : null;\n  }\n}\n\nfunction nearest(indices, target) {\n  return indices.reduce((a, b) => (Math.abs(b - target) \u003c Math.abs(a - target) ? b : a));\n}\n\n/**\n * Checks a location against the working tree and corrects its line number.\n * status: ok | moved (same text, other line) | fuzzy (partial match) | relocated (file moved)\n *         | unresolved (text not found) | missing (file not found)\n */\nexport function anchorLocation(cache, loc) {\n  let relPath = loc.path;\n  let file = cache.read(relPath);\n  let relocatedFrom = null;\n  if (!file) {\n    const alt = cache.findByBasename(relPath);\n    if (alt && (file = cache.read(alt))) {\n      relocatedFrom = relPath;\n      relPath = alt;\n    }\n  }\n  if (!file) {\n    return { ...loc, status: 'missing', note: `File not found: ${loc.path}` };\n  }\n\n  const { lines } = file;\n  const wanted = norm(loc.lineContent);\n  const idx0 = Math.min(Math.max(loc.lineNumber - 1, 0), lines.length - 1);\n  let idx = -1;\n  let status = 'unresolved';\n\n  if (!wanted || norm(lines[idx0]) === wanted) {\n    idx = idx0;\n    status = 'ok';\n  } else {\n    const exact = [];\n    lines.forEach((l, i) => norm(l) === wanted && exact.push(i));\n    if (exact.length) {\n      idx = nearest(exact, idx0);\n      status = 'moved';\n    } else {\n      const partial = [];\n      if (wanted.length >= 6) {\n        lines.forEach((l, i) => {\n          const n = norm(l);\n          if (n.length >= 6 && (n.includes(wanted) || wanted.includes(n))) partial.push(i);\n        });\n      }\n      if (!partial.length && loc.symbol) {\n        const re = new RegExp(`\\\\b${loc.symbol.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')}\\\\b`);\n        lines.forEach((l, i) => re.test(l) && partial.push(i));\n      }\n      if (partial.length) {\n        idx = nearest(partial, idx0);\n        status = 'fuzzy';\n      }\n    }\n  }\n  if (relocatedFrom && (status === 'ok' || status === 'moved')) status = 'relocated';\n\n  const anchorIdx = idx >= 0 ? idx : idx0;\n  const start = Math.max(0, anchorIdx - SNIPPET_BEFORE);\n  const end = Math.min(lines.length, anchorIdx + SNIPPET_AFTER + 1);\n  const result = {\n    ...loc,\n    path: relPath,\n    lineNumber: anchorIdx + 1,\n    status,\n    fileHash: file.hash,\n    ctxHash: contextHash(lines, anchorIdx),\n    snippet: { startLine: start + 1, code: lines.slice(start, end).join('\\n') },\n  };\n  if (idx >= 0) result.lineContent = lines[anchorIdx].trim();\n  const notes = [];\n  if (relocatedFrom) notes.push(`file moved from ${relocatedFrom}`);\n  if (status !== 'ok' && status !== 'unresolved' && loc.lineNumber !== anchorIdx + 1) {\n    notes.push(`line ${loc.lineNumber} -> ${anchorIdx + 1}`);\n  }\n  if (status === 'fuzzy') notes.push('partial text match; double-check');\n  if (status === 'unresolved') notes.push(`line content not found in ${relPath}: \"${loc.lineContent}\"`);\n  if (notes.length) result.note = notes.join('; ');\n  else delete result.note;\n  return result;\n}\n\nconst CTX_MAX = 60;\nconst CTX_SIBLINGS = 4;\nconst indentOf = (l) => (l.match(/^\\s*/)[0].replace(/\\t/g, '    ').length);\nconst isCloser = (l) => /^[\\s)\\]}>;,]*(end\\b.*)?$/i.test(l) && l.trim().length > 0;\n\n/**\n * The code a node talks about: its line plus the block it opens (more-indented lines and the\n * closing bracket), or — for a single statement — a few sibling lines after it.\n */\nexport function contextBlock(lines, idx) {\n  if (idx \u003c 0 || idx >= lines.length) return [];\n  const base = indentOf(lines[idx]);\n  const out = [lines[idx]];\n  let i = idx + 1;\n  for (; i \u003c lines.length && out.length \u003c CTX_MAX; i++) {\n    const l = lines[i];\n    if (!l.trim()) continue;\n    if (indentOf(l) > base) out.push(l);\n    else {\n      if (out.length > 1 && isCloser(l)) out.push(l);\n      break;\n    }\n  }\n  if (out.length === 1) {\n    // A plain statement: include the next sibling lines at the same indentation.\n    for (let j = idx + 1, n = 0; j \u003c lines.length && n \u003c CTX_SIBLINGS; j++) {\n      const l = lines[j];\n      if (!l.trim()) continue;\n      if (indentOf(l) \u003c base) break;\n      out.push(l);\n      n++;\n    }\n  }\n  return out;\n}\n\n/**\n * Hash of the code a node talks about (whitespace-insensitive). Moving the block keeps the\n * hash; editing it changes it — that is how \"narrative drift\" (prose describing old code)\n * is detected, independently of whether the anchor line itself still exists.\n */\nexport function contextHash(lines, idx) {\n  const body = contextBlock(lines, idx).map((l) => norm(l)).join('\\n');\n  return crypto.createHash('sha1').update(body).digest('hex').slice(0, 12);\n}\n\n/** Combined hash of a trace's node contexts (its guide is stale when this changes). */\nexport function traceHash(trace) {\n  const all = trace.locations.map((l) => l.ctxHash || '').join('|');\n  return crypto.createHash('sha1').update(all).digest('hex').slice(0, 12);\n}\n\n/** Anchors every location of a normalized map in place; returns a summary report. */\nexport function anchorMap(root, map) {\n  const cache = new FileCache(root);\n  const report = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0, issues: [] };\n  for (const trace of map.traces) {\n    trace.locations = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      report[r.status]++;\n      if (r.status !== 'ok') report.issues.push({ id: r.id, status: r.status, path: r.path, note: r.note });\n      return r;\n    });\n  }\n  report.total = map.traces.reduce((n, t) => n + t.locations.length, 0);\n  report.healthy = report.unresolved === 0 && report.missing === 0;\n  return report;\n}\n\n/** Search helper for agents: lines in a file matching a regex or literal, with numbers. */\nexport function findInFile(root, rel, pattern, { regex = false, limit = 20 } = {}) {\n  const cache = new FileCache(root);\n  const file = cache.read(rel.replace(/\\\\/g, '/'));\n  if (!file) throw new Error(`File not found or unreadable: ${rel}`);\n  const re = regex ? new RegExp(pattern) : null;\n  const hits = [];\n  file.lines.forEach((l, i) => {\n    if (hits.length \u003c limit && (re ? re.test(l) : l.includes(pattern))) {\n      hits.push({ lineNumber: i + 1, lineContent: l.trim() });\n    }\n  });\n  return { path: rel, totalLines: file.lines.length, hits };\n}\n"},"markdown":"# Waymark: Verificación de deriva y reanclaje de Waymark\n\nExplica cómo Waymark detecta deriva de anclas [1d, 1g] y de narrativa [1h], reubica anclas [2d, 2i] y guarda correcciones opcionales [3a, 3b].\n\n_id: `verificacion-de-deriva-y-reanclaje-de-waymark-8c8a2e` · commit 8a8e4b94 (main) · updated 2026-10-20 · query: \"How does waymark verify detect drift and re-anchor locations after code changes?\"_\n\n## The story\n\nUn mapa Waymark conserva rutas, líneas, texto y hashes que pueden quedar desfasados cuando cambia el código, y también prosa que puede dejar de describir ese código. La CLI [1a] y el MCP [1b] reúnen los mapas solicitados y entregan cada uno a `verifyMap` [1c]; este contrasta sus ubicaciones [1d] con el árbol de trabajo mediante `anchorLocation` [2a]. Si la ruta desapareció, se busca otra entre archivos rastreados por Git [2b]; después se intenta la línea previa [2d], el mismo texto en otra línea [2e] y, como último recurso, una coincidencia parcial o de símbolo [2f]. Cada resultado trae además un `ctxHash` del bloque de código alrededor del ancla [2i].\n\nEl informe separa tres señales: los hashes de archivo y los cambios de ubicación determinan `stale` [1e] [1f] [1g]; `unresolved` o `missing` determinan `broken` [1g]; y la comparación entre el `ctxHash` actual y el que tenía el código cuando se escribió la prosa produce la deriva narrativa por nodo, trazo e historia [1h]. Un ancla puede seguir `ok` y aun así su explicación estar desactualizada.\n\nSin `fix`, se informa la deriva sin persistir nuevos anclajes [3a]; con `fix`, se guardan el JSON y el visor HTML si hubo cambios de ancla, de hash o de contexto, o si faltaban líneas base narrativas [3b] [3c] [3d] [3e]. Las líneas base existentes no se sobrescriben, de modo que la prosa desfasada sigue marcada hasta reescribirla. La CLI muestra el estado, una línea de revisión narrativa y fija su salida según anclas rotas, `--strict` y `--strict-narrative` [3f] [3g]; un estado `fuzzy` merece revisión porque la cercanía textual no demuestra identidad semántica [2g].\n\n## Trace 1: Entrada y diagnóstico de deriva\n\nSelecciona mapas, verifica ubicaciones y resume deriva de anclas, narrativa o anclas rotas.\n\n### Motivation\n\nLos mapas son fotografías de ubicaciones del código y de la prosa que las explica; antes de usarlos, Waymark necesita saber si esas referencias todavía apuntan al mismo lugar y si la explicación sigue describiendo el código actual. Esta etapa concentra las dos entradas públicas y produce un diagnóstico común, para que CLI y MCP apliquen las mismas reglas de verificación.\n\n### Details\n\nLa CLI toma un ID o enumera todos los mapas [1a]; el MCP hace la misma selección y devuelve los informes como texto estructurado [1b]. `verifyMap` carga el JSON persistido y crea una `FileCache` compartida [1c], luego envía cada ubicación a `anchorLocation`, cuenta sus estados y detecta si cambió el `ctxHash` del bloque anclado [1d]. Para cada ubicación compara el hash de archivo guardado con el actual [1e] y registra movimientos, cambios de ruta o estados distintos de `ok` [1f].\n\nCon los resultados frescos, `narrativeDrift` determina qué nodos, guías de trazo e historia fueron escritos para código que ya cambió [1h]. `stale` se activa por cambios de ancla o de hash, mientras `broken` suma solo `unresolved` y `missing` [1g]; la deriva narrativa viaja aparte en `narrative`, así que un archivo puede estar cambiado o una explicación desfasada aunque todas las líneas ancladas sigan coincidiendo.\n\n### Tree\n\n```text\n├── Entradas\n│   ├── [1a] Entrada CLI verify  src/cli.js:284\n│   └── [1b] Entrada MCP verify  src/mcp.js:312\n└── [1c] Carga del mapa  src/verify.js:12\n    ├── [1d] Comprueba cada ubicación  src/verify.js:22\n    │   ├── [1e] Detecta hash cambiado  src/verify.js:24\n    │   └── [1f] Registra cambios de ubicación  src/verify.js:26\n    ├── [1h] Detecta deriva narrativa  src/verify.js:43\n    └── [1g] Calcula estado global  src/verify.js:55\n```\n\n- **[1a] Entrada CLI verify** — `src/cli.js:284`\n  La CLI selecciona mapas y pasa la opción `fix` a `verifyMap`.\n  El comando `verify` toma el primer argumento como ID; si falta, `listMaps` aporta todos los IDs. Cada ID llega a `verifyMap` con `opt.fix`, de modo que la selección no altera la lógica de cotejo. Después, la CLI traduce el informe a una línea de estado y cambios visibles [3f]. Si se verifican varios mapas, acumula fallos para decidir una sola salida [3g].\n  ```\n     281      }\n     282      case 'verify': {\n     283        const r = root();\n  >  284        const ids = rest[0] ? [rest[0]] : listMaps(r).map((m) => m.id);\n     285        let bad = false;\n     286        for (const id of ids) {\n     287          const v = verifyMap(r, id, { fix: opt.fix });\n     288          const state = v.broken ? 'BROKEN' : v.stale ? 'STALE' : 'OK';\n     289          out(`${state.padEnd(7)} ${v.id}  map@${v.mapCommit || '?'} head@${v.headCommit || '?'}${v.fixed ? '  (fixed)' : ''}`);\n     290          for (const c of v.changes) out(`        ${c.status.padEnd(10)} [${c.id}] ${c.from} -> ${c.to}${c.note ? '  ' + c.note : ''}`);\n     291          if (v.narrative.stale) {\n     292            const parts = [];\n     293            if (v.narrative.nodes.length) parts.push('nodes ' + v.narrative.nodes.map((n) => `[${n}]`).join(', '));\n     294            if (v.narrative.traces.length) parts.push('trace guides ' + v.narrative.traces.join(', '));\n     295            if (v.narrative.story) parts.push('story');\n     296            out(`        narrative  review ${parts.join('; ')} (code changed since written) → waymark refresh ${v.id}`);\n     297          }\n     298          if (v.broken || (opt.strict && v.stale && !v.fixed) || (opt['strict-narrative'] && v.narrative.stale)) bad = true;\n  ```\n- **[1b] Entrada MCP verify** — `src/mcp.js:312`\n  El MCP verifica un mapa o todos y devuelve sus informes.\n  El controlador MCP resuelve primero la raíz indicada por el cliente y obtiene el ID solicitado o todos los IDs guardados. Invoca `verifyMap` para cada uno con el mismo valor `fix` que recibe la herramienta. Los objetos resultantes se devuelven mediante `text`, sin la presentación `OK`/`STALE`/`BROKEN` de la CLI. Por ello los consumidores MCP deben interpretar `stale`, `broken`, `counts` y `changes` del informe [1g].\n  ```\n     309      safe(async ({ id, fix, root }) => {\n     310        const r = rootOf(root);\n     311        const ids = id ? [id] : listMaps(r).map((m) => m.id);\n  >  312        return text(ids.map((i) => verifyMap(r, i, { fix })));\n     313      }),\n     314    );\n     315  \n     316    server.registerTool(\n     317      'waymark_render',\n     318      {\n     319        title: 'Render waymark viewer',\n     320        description: 'Regenerates the self-contained HTML viewer of a waymark and optionally opens it in the default browser.',\n     321        inputSchema: { id: z.string(), open: z.boolean().optional(), root: rootArg },\n     322      },\n     323      safe(async ({ id, open, root }) => {\n     324        const r = rootOf(root);\n     325        const p = writeHtml(r, loadMap(r, id));\n     326        if (open) openFile(p);\n  ```\n- **[1c] Carga del mapa** — `src/verify.js:12`\n  `verifyMap` carga el mapa y prepara caché, cambios y conteos.\n  `loadMap` lee el documento JSON persistido que contiene los trazos y sus ubicaciones. `verifyMap` crea una `FileCache` por ejecución, además de listas para cambios, archivos con hash distinto y estados contados. La misma caché alimenta todas las llamadas posteriores a `anchorLocation` [1d], evitando releer rutas repetidas. Si el ID no identifica un mapa guardado, la carga falla antes de inspeccionar código.\n  ```\n       9   * (narrative baselines are kept, so drifted prose stays flagged until it is rewritten).\n      10   */\n      11  export function verifyMap(root, id, { fix = false } = {}) {\n  >   12    const doc = loadMap(root, id);\n      13    const cache = new FileCache(root);\n      14    const changes = [];\n      15    const changedFiles = new Set();\n      16    const counts = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0 };\n      17    let ctxChanged = false;\n      18  \n      19    const fresh = { ...doc, traces: [] };\n      20    for (const trace of doc.traces) {\n      21      const results = trace.locations.map((loc) => {\n      22        const r = anchorLocation(cache, loc);\n      23        counts[r.status]++;\n      24        if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      25        if (r.ctxHash !== loc.ctxHash) ctxChanged = true;\n      26        if (r.status !== 'ok' || r.lineNumber !== loc.lineNumber || r.path !== loc.path) {\n  ```\n- **[1d] Comprueba cada ubicación** — `src/verify.js:22`\n  Cada ubicación pasa por `anchorLocation`, suma un estado y compara su `ctxHash`.\n  `verifyMap` recorre `doc.traces` y transforma cada `trace.locations` con `map`. Para cada `loc`, `anchorLocation` contrasta el ancla guardada con el archivo de trabajo y devuelve un resultado `r` con ruta, línea, hashes y fragmento [2i]. Ese estado incrementa `counts`, que después determina `broken` [1g]. Además compara el `ctxHash` nuevo con el guardado: si el bloque alrededor del ancla cambió, activa `ctxChanged`, que obliga a reescribir con `fix` aunque el ancla no se haya movido [3b]. La función siempre devuelve `r`; los resultados forman una copia `fresh` del mapa y solo reemplazan las ubicaciones guardadas con `fix` [3a].\n  ```\n      19    const fresh = { ...doc, traces: [] };\n      20    for (const trace of doc.traces) {\n      21      const results = trace.locations.map((loc) => {\n  >   22        const r = anchorLocation(cache, loc);\n      23        counts[r.status]++;\n      24        if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      25        if (r.ctxHash !== loc.ctxHash) ctxChanged = true;\n      26        if (r.status !== 'ok' || r.lineNumber !== loc.lineNumber || r.path !== loc.path) {\n      27          changes.push({\n      28            id: loc.id,\n      29            status: r.status,\n      30            from: `${loc.path}:${loc.lineNumber}`,\n      31            to: `${r.path}:${r.lineNumber}`,\n      32            note: r.note,\n      33          });\n      34        }\n      35        return r;\n      36      });\n  ```\n- **[1e] Detecta hash cambiado** — `src/verify.js:24`\n  Un hash diferente registra el archivo en `changedFiles`.\n  La ubicación conserva `loc.fileHash` y el nuevo anclaje devuelve `r.fileHash` del archivo leído [2a]. Si ambos existen y difieren, se añade `r.path` a un `Set`, por lo que una ruta aparece una sola vez aunque tenga varias ubicaciones. Ese conjunto contribuye a `stale` [1g] incluso cuando el texto de todas las líneas ancladas aún coincide. Es una señal más gruesa que el `ctxHash` de [1d]: cualquier edición del archivo la activa, aunque ocurra lejos de los bloques anclados. Al faltar cualquiera de los hashes, esta comparación no registra cambio.\n  ```\n      21      const results = trace.locations.map((loc) => {\n      22        const r = anchorLocation(cache, loc);\n      23        counts[r.status]++;\n  >   24        if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      25        if (r.ctxHash !== loc.ctxHash) ctxChanged = true;\n      26        if (r.status !== 'ok' || r.lineNumber !== loc.lineNumber || r.path !== loc.path) {\n      27          changes.push({\n      28            id: loc.id,\n      29            status: r.status,\n      30            from: `${loc.path}:${loc.lineNumber}`,\n      31            to: `${r. <script>/* Waymark viewer — runs inside the self-contained HTML. No dependencies, no network. */
(() => {

  const DRIFT_NOTE = 'The code here changed after this was written — the prose may be outdated. Ask your agent: ';

      const ids = list.split(/\s*,\s*/);
      if (!ids.every((id) => byId.has(id))) return m;
      return '<span class="refs">[' + ids.map((id) => '<a class="ref" data-ref="' + id + '">' + id + '</a>').join(', ') + ']</span>';
    });
  }
  function inline(s) {
    return refs(
      esc(s)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
        .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>'),
    );
  }
  function md(src) {
    const out = [];
    let list = null;
    let para = [];
    let code = null;
    const flushPara = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
    const closeList = () => { if (list) { out.push('</' + list + '>'); list = null; } };
    for (const raw of String(src || '').split(/\r?\n/)) {
      if (code !== null) {
        if (/^\s*```/.test(raw)) { out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); code = null; } else code.push(raw);
        continue;
      }
      if (/^\s*```/.test(raw)) { flushPara(); closeList(); code = []; continue; }
      const h = raw.match(/^#{1,6}\s+(.*)/);
      if (h) { flushPara(); closeList(); out.push('<h5>' + inline(h[1]) + '</h5>'); continue; }
      const li = raw.match(/^\s*([-*]|\d+\.)\s+(.*)/);
      if (li) {
        flushPara();
        const kind = /\d/.test(li[1]) ? 'ol' : 'ul';
        if (list !== kind) { closeList(); out.push('<' + kind + '>'); list = kind; }
        out.push('<li>' + inline(li[2]) + '</li>');
        continue;
      }
      if (!raw.trim()) { flushPara(); closeList(); continue; }
      closeList();
      para.push(raw.trim());
    }
    if (code !== null) out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>');
    flushPara();
    closeList();
    return out.join('');
  }

  // ---------------------------------------------------------------- syntax highlight (tiny, language-agnostic)
  const KW = new Set(('abstract and as async await break case catch class const continue def default defer del delete do elif else enum except export extends ' +
    'false final finally fn for from func function global go if impl implements import in interface is lambda let match mod module mut namespace new nil ' +
    'none None not null of or package pass private protected pub public raise return self static struct super switch this throw throws trait true True ' +
    'False try type typeof use val var void when where while with yield dcl-s dcl-ds dcl-proc dcl-pi end-proc end-ds exec sql select update insert into values set').split(' '));
  const TOK = /(\/\/.*$|#.*$|\/\*.*?\*\/|--.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b\d[\d_.xXa-fA-F]*\b)|([A-Za-z_$][\w$-]*)(\s*\()?/g;
  const HASH = /^(py|rb|sh|bash|zsh|yml|yaml|toml|r|pl|ps1|conf|cfg|ini|dockerfile|makefile|mk|cmake|nim|ex|exs)$/;
  const DASH = /^(sql|lua|hs|elm|ada)$/;
  function hl(line, ext) {
    let out = '';
    let last = 0;
    let m;
    TOK.lastIndex = 0;
    while ((m = TOK.exec(line))) {
      const t = m[0];
      out += esc(line.slice(last, m.index));
      if (m[1] && ((t[0] === '#' && !HASH.test(ext)) || (t.startsWith('--') && !DASH.test(ext)))) {
        out += esc(t[0]);
        TOK.lastIndex = m.index + 1;
        last = m.index + 1;
        continue;
      }
      if (m[1]) out += '<span class="tk-c">' + esc(t) + '</span>';
      else if (m[2]) out += '<span class="tk-s">' + esc(t) + '</span>';
      else if (m[3]) out += '<span class="tk-n">' + esc(t) + '</span>';
      else if (KW.has(m[4])) out += '<span class="tk-k">' + esc(m[4]) + '</span>' + esc(m[5] || '');
      else if (m[5]) out += '<span class="tk-f">' + esc(m[4]) + '</span>' + esc(m[5]);
      else out += esc(t);
      last = m.index + t.length;
    }
    return out + esc(line.slice(last));
  }

  // ---------------------------------------------------------------- links
  function editorUrl(l) {
    if (!prefs.root) return null;
    const abs = prefs.root.replace(/\\/g, '/').replace(/\/$/, '') + '/' + l.path;
    if (prefs.editor === 'idea') return 'idea://open?file=' + encodeURIComponent(abs) + '&line=' + l.lineNumber;
    return prefs.editor + '://file' + encodeURI(abs.startsWith('/') ? abs : '/' + abs) + ':' + l.lineNumber;
  }
  function remoteUrl(l) {
    const r = meta.remote;
    const c = meta.commit;
    if (!r || !c) return null;
    if (/dev\.azure\.com|visualstudio\.com/.test(r)) return r + '?path=/' + l.path + '&version=GC' + c + '&line=' + l.lineNumber + '&lineEnd=' + l.lineNumber + '&lineStartColumn=1&lineEndColumn=1';
    if (/bitbucket\./.test(r)) return r + '/src/' + c + '/' + l.path + '#lines-' + l.lineNumber;
    if (/gitlab\./.test(r)) return r + '/-/blob/' + c + '/' + l.path + '#L' + l.lineNumber;
    return r + '/blob/' + c + '/' + l.path + '#L' + l.lineNumber;
  }
  function explanationHtml(l) {
    if (l.explanation) return (staleNodes.has(l.id) ? driftNote() : '') + md(l.explanation);
    return '<p class="empty">No storytelling explanation stored for this node yet. Ask your agent: <code>/waymark enrich ' + esc(doc.id) + '</code></p>';
  }

  // ---------------------------------------------------------------- map pane
  const STATUS = { fuzzy: '≈', unresolved: '⚠', missing: '⚠' };
  const mapPane = $('#mapPane');

  function renderMapPane() {
    const a = meta.anchors || {};
    const chips = [];
    if (meta.createdAt) chips.push('<span class="chip">Created ' + esc(new Date(meta.createdAt).toLocaleDateString()) + '</span>');
    if (meta.commit) chips.push('<span class="chip" title="' + esc(meta.commit) + '">@ ' + esc(meta.commit.slice(0, 8)) + (meta.branch ? ' · ' + esc(meta.branch) : '') + '</span>');
    chips.push('<span class="chip">' + traces.length + ' traces · ' + locs.length + ' nodes</span>');
    const broken = (a.unresolved || 0) + (a.missing || 0);
    if (broken) chips.push('<span class="chip bad">' + broken + ' unverified anchors</span>');
    if (a.fuzzy) chips.push('<span class="chip warn">' + a.fuzzy + ' approximate</span>');
    if (staleNodes.size) chips.push('<span class="chip warn" title="Code changed after these nodes were explained">' + staleNodes.size + ' explanations to review</span>');

    const head =
      '<div class="mp-head"><h1>' + esc(doc.title) + '</h1><div class="chips">' + chips.join('') + '</div>' +
      '<div class="summary">' + inline(doc.description) + '</div>' +
      '<div class="mp-actions">' +
      (doc.story ? '<button class="pill" id="storyBtn" aria-expanded="false">Read the full story</button>' : '') +
      '<button class="pill" id="explainAllBtn" title="Expand every node with its explanation">Explain all nodes</button>' +
      '<button class="pill" id="guidesBtn" title="Open every trace guide">Open all guides</button>' +
      '</div>' +
      (doc.story ? '<div class="story md" id="story" hidden><div class="ai-label">AI generated story</div>' + (drift.story ? driftNote('story') : '') + md(doc.story) + '</div>' : '') +
      '</div>';

    const seen = new Set();
    const treeHtml = (nodes) => {
      if (!nodes || !nodes.length) return '';
      return '<ul class="tt">' + nodes.map((n) => {
        const l = n.ref && byId.get(n.ref);
        let inner;
        if (l && seen.has(l.id)) {
          inner = '<div class="loc ref-again" data-id="' + l.id + '" style="--tc:' + l.trace.color + '"><div class="loc-top"><span class="lid">' + l.id + '</span><span class="lt">' + esc(n.label || l.title) + '</span></div></div>';
        } else if (l) {
          seen.add(l.id);
          const st =
            (STATUS[l.status] ? '<span class="st ' + l.status + '" title="' + esc(l.note || l.status) + '">' + STATUS[l.status] + '</span>' : '') +
            (staleNodes.has(l.id) ? '<span class="st drift" title="Code changed after this node was explained">◔</span>' : '');
          inner =
            '<div class="loc" data-id="' + l.id + '" tabindex="0" style="--tc:' + l.trace.color + '">' +
            '<div class="loc-top"><span class="lid">' + l.id + '</span><span class="lt">' + esc(n.label || l.title) + '</span>' + st +
            '<span class="lf" title="' + esc(l.path) + '">' + esc(base(l.path)) + '</span></div>' +
            '<div class="loc-code"><span class="ln">' + l.lineNumber + '</span><code>' + hl(l.lineContent || '', extOf(l.path)) + '</code></div>' +
            '<div class="loc-more"><div class="loc-desc">' + inline(l.description) + '</div>' +
            '<button class="explain" data-explain="' + l.id + '">' + (l.explanation ? 'Show explanation' : 'Explain') + '</button> ' +
            '<button class="explain" data-copy-node="' + l.id + '" title="Copy this node (with its trace context) as markdown for an agent">Copy context</button>' +
            '<div class="expl md" hidden></div></div></div>';
        } else {
          inner = '<div class="lbl">' + esc(n.label || '…') + '</div>';
        }
        const via = n.via ? '<div class="via">↳ ' + esc(n.via) + '</div>' : '';
        return '<li>' + via + inner + treeHtml(n.children) + '</li>';
      }).join('') + '</ul>';
    };

    const body = traces.map((t) => {
      const hasGuide = t.motivation || t.details;
      return (
        '<section class="trace" data-trace="' + esc(t.id) + '" style="--tc:' + t.color + '">' +
        '<div class="tr-head" data-toggle="' + esc(t.id) + '"><span class="tr-num">' + esc(t.id) + '</span><div class="tr-text">' +
        '<div class="tr-title">' + esc(t.title) + '</div><div class="tr-desc">' + inline(t.description) +
        (hasGuide ? ' <button class="see-more" data-guide="' + esc(t.id) + '">See more</button>' : '') + '</div></div>' +
        '<button class="tcopy" data-copy-trace="' + esc(t.id) + '" title="Copy this trace as markdown context for an agent">⧉</button>' +
        '<span class="caret">▾</span></div>' +
        (hasGuide
          ? '<div class="guide md" hidden><div class="ai-label">AI generated guide</div>' + (staleTraces.has(t.id) ? driftNote('trace guide') : '') +
            (t.motivation ? '<h4>Motivation</h4>' + md(t.motivation) : '') +
            (t.details ? '<h4>Details</h4>' + md(t.details) : '') + '</div>'
          : '') +
        '<div class="tr-body"><div class="tree-title">' + esc(t.diagramTitle || t.title) + '</div>' + treeHtml(t.tree) + '</div></section>'
      );
    }).join('');
    mapPane.innerHTML = head + body;
  }

  function toggleGuide(tid, force) {
    const sec = $('.trace[data-trace="' + tid + '"]', mapPane);
    if (!sec) return;
    const g = $('.guide', sec);
    const btn = $('.see-more', sec);
    if (!g) return;
    const show = force == null ? g.hidden : force;

    if (btn) btn.textContent = show ? 'See less' : 'See more';

  }

  function toggleExplain(id, force) {
    const card = $('.loc[data-id="' + id + '"]:not(.ref-again)', mapPane);
    if (!card) return;
    const box = $('.expl', card);
    const btn = $('.explain', card);
    const l = byId.get(id);
    const show = force == null ? box.hidden : force;
    if (show && !box.innerHTML) box.innerHTML = explanationHtml(l);
    box.hidden = !show;
    card.classList.toggle('open', show);
    btn.classList.toggle('on', show);

  mapPane.addEventListener('click', (e) => {
    const ct = e.target.closest('[data-copy-trace]');
    if (ct) { e.stopPropagation(); return copy(ct, (DATA.traceMd || {})[ct.dataset.copyTrace] || '', '⧉'); }
    const cn = e.target.closest('[data-copy-node]');
    if (cn) { e.stopPropagation(); return copy(cn, (DATA.nodeMd || {})[cn.dataset.copyNode] || '', 'Copy context'); }
    const r = e.target.closest('[data-ref]');

    const sm = e.target.closest('[data-guide]');

  mapPane.addEventListener('keydown', (e) => {

  // ---------------------------------------------------------------- code view
  const codeEl = $('#code');
  const codeScroll = $('#codeScroll');

  function renderTabs() {
    tabsEl.innerHTML = fileOrder.map((p) => {

      return '<button class="ftab' + (p === state.file ? ' on' : '') + '" data-file="' + esc(p) + '" title="' + esc(p) + '">' + esc(base(p)) + '<span class="cnt">' + n + '</span></button>';
    }).join('');

  tabsEl.addEventListener('click', (e) => {

  });

  function renderFile(p) {
    state.file = p;
    renderTabs();
    const ext = extOf(p);
    const markers = new Map();
    for (const l of locs) if (l.path === p) {
      if (!markers.has(l.lineNumber)) markers.set(l.lineNumber, []);
      markers.get(l.lineNumber).push(l);
    }
    const rows = [];
    const emit = (no, text) => {
      const mk = markers.get(no);
      const gut = mk ? mk.map((l) => '<a class="gm" data-ref="' + l.id + '" style="--tc:' + l.trace.color + '" title="' + esc(l.title) + '">' + l.id + '</a>').join('') : '';
      rows.push('<div class="cl' + (mk ? ' anchored' : '') + '" data-line="' + no + '"><span class="gut">' + gut + '</span><span class="no">' + no + '</span><span class="tx">' + hl(text, ext) + '</span></div>');
    };
    if (FILES[p] != null) {
      FILES[p].split('\n').forEach((t, i) => emit(i + 1, t));
    } else {
      rows.push('<div class="code-note">Only snippets are available for this file (it was missing or too large to embed).</div>');
      const lines = new Map();
      for (const l of locs) if (l.path === p && l.snippet) l.snippet.code.split('\n').forEach((t, i) => lines.set(l.snippet.startLine + i, t));
      if (!lines.size) for (const l of locs) if (l.path === p) lines.set(l.lineNumber, l.lineContent || '');
      let prev = null;
      for (const no of [...lines.keys()].sort((a, b) => a - b)) {
        if (prev !== null && no !== prev + 1) rows.push('<div class="gap">⋯</div>');
        emit(no, lines.get(no));
        prev = no;
      }
    }
    codeEl.innerHTML = rows.join('');
  }

  function showInCode(l) {
    if (state.file !== l.path) renderFile(l.path);
    $$('.cl.hl', codeEl).forEach((e) => e.classList.remove('hl'));
    $$('.anno, .anno-expl', codeEl).forEach((e) => e.remove());
    const row = $('.cl[data-line="' + l.lineNumber + '"]', codeEl);

    row.classList.add('hl');

      (i > 0 ? '<a data-go="' + (i - 1) + '">← prev</a>' : '') + (i < locs.length - 1 ? '<a data-go="' + (i + 1) + '">next →</a>' : '') + '</span>';

  codeEl.addEventListener('click', (e) => {
    const oe = e.target.closest('[data-open-editor]');
    if (oe) return openInHost(oe.dataset.openEditor);
