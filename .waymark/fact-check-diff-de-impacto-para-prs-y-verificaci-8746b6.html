anation":"Por cada mapa con nodos tocados se escribe una tabla markdown: id y título del nodo, el rango de código que lo representa (`path:from-to`) y cuántas líneas cambiadas cayeron dentro. El rango viene ya calculado en `touched`, así que aquí solo se formatea. Para un revisor es la parte más útil: le dice qué paso documentado del flujo está modificando el PR.","path":"src/diff.js","lineNumber":82,"lineContent":"for (const t of m.touched) o.push(`| \\`${t.id}\\` ${t.title} | \\`${t.path}:${t.from}-${t.to}\\` | ${t.lines} |`);","status":"ok","fileHash":"700c633f1c1d","ctxHash":"9cb9c2c8b80e","snippet":{"startLine":79,"code":"    o.push(`**${m.title}** (\\`${m.id}\\`)`);\n    if (m.touched.length) {\n      o.push('', '| Node | Location | Changed lines |', '|---|---|---|');\n      for (const t of m.touched) o.push(`| \\`${t.id}\\` ${t.title} | \\`${t.path}:${t.from}-${t.to}\\` | ${t.lines} |`);\n    }\n    if (m.broken.length) o.push('', `⚠ Anchors no longer found: ${m.broken.map((b) => `\\`${b.id}\\` (${b.from})`).join(', ')}`);\n    const d = m.drift;\n    if (d.stale) {\n      const parts = [];\n      if (d.nodes.length) parts.push(`nodes ${d.nodes.map((n) => `\\`${n}\\``).join(', ')}`);\n      if (d.traces.length) parts.push(`trace guides ${d.traces.join(', ')}`);\n      if (d.story) parts.push('the story');\n      o.push('', `◔ Prose to review (code changed since it was written): ${parts.join('; ')}.`);\n    }\n    o.push('', `→ \\`/waymark refresh ${m.id}\\` updates the map.`, '');\n  }\n  return o.join('\\n');\n}"},"narrativeHash":"9cb9c2c8b80e"},{"id":"4d","title":"Anclas rotas","description":"Advierte de nodos cuyo ancla ya no se encuentra en el código.","explanation":"Si la verificación del mapa marcó ubicaciones como `unresolved` o `missing`, se agrega una línea con ⚠ listando cada id y su ubicación original. Es la señal más grave: el mapa apunta a código que ya no existe tal cual. Esta misma condición es la que la CLI puede usar para fallar con `--fail-on broken` [4i].","path":"src/diff.js","lineNumber":84,"lineContent":"if (m.broken.length) o.push('', `⚠ Anchors no longer found: ${m.broken.map((b) => `\\`${b.id}\\` (${b.from})`).join(', ')}`);","status":"ok","fileHash":"700c633f1c1d","ctxHash":"494734466e65","snippet":{"startLine":81,"code":"      o.push('', '| Node | Location | Changed lines |', '|---|---|---|');\n      for (const t of m.touched) o.push(`| \\`${t.id}\\` ${t.title} | \\`${t.path}:${t.from}-${t.to}\\` | ${t.lines} |`);\n    }\n    if (m.broken.length) o.push('', `⚠ Anchors no longer found: ${m.broken.map((b) => `\\`${b.id}\\` (${b.from})`).join(', ')}`);\n    const d = m.drift;\n    if (d.stale) {\n      const parts = [];\n      if (d.nodes.length) parts.push(`nodes ${d.nodes.map((n) => `\\`${n}\\``).join(', ')}`);\n      if (d.traces.length) parts.push(`trace guides ${d.traces.join(', ')}`);\n      if (d.story) parts.push('the story');\n      o.push('', `◔ Prose to review (code changed since it was written): ${parts.join('; ')}.`);\n    }\n    o.push('', `→ \\`/waymark refresh ${m.id}\\` updates the map.`, '');\n  }\n  return o.join('\\n');\n}\n"},"narrativeHash":"494734466e65"},{"id":"4e","title":"Prosa por revisar","description":"Resume la deriva narrativa: nodos, guías de traza o la historia.","explanation":"Cuando `drift.stale` es verdadero, se juntan las partes cuya narrativa quedó atrás del código: nodos concretos, guías de traza o la historia general del mapa. El código puede seguir anclado bien y aun así la explicación estar desactualizada; esta línea lo hace visible. Se marca con ◔ para distinguirla del aviso de anclas rotas [4d].","path":"src/diff.js","lineNumber":91,"lineContent":"o.push('', `◔ Prose to review (code changed since it was written): ${parts.join('; ')}.`);","status":"ok","fileHash":"700c633f1c1d","ctxHash":"beff452b9731","snippet":{"startLine":88,"code":"      if (d.nodes.length) parts.push(`nodes ${d.nodes.map((n) => `\\`${n}\\``).join(', ')}`);\n      if (d.traces.length) parts.push(`trace guides ${d.traces.join(', ')}`);\n      if (d.story) parts.push('the story');\n      o.push('', `◔ Prose to review (code changed since it was written): ${parts.join('; ')}.`);\n    }\n    o.push('', `→ \\`/waymark refresh ${m.id}\\` updates the map.`, '');\n  }\n  return o.join('\\n');\n}\n"},"narrativeHash":"beff452b9731"},{"id":"4f","title":"Sugerir refresh","description":"Cierra cada mapa con el comando para actualizarlo.","explanation":"Cada bloque de mapa termina con una acción concreta: `/waymark refresh \u003cid>`. Convierte el reporte de un diagnóstico en una tarea ejecutable para el autor del PR o su agente. Al final, las líneas acumuladas en `o` se unen con saltos de línea y se devuelven.","path":"src/diff.js","lineNumber":93,"lineContent":"o.push('', `→ \\`/waymark refresh ${m.id}\\` updates the map.`, '');","status":"ok","fileHash":"700c633f1c1d","ctxHash":"269aa8785dba","snippet":{"startLine":90,"code":"      if (d.story) parts.push('the story');\n      o.push('', `◔ Prose to review (code changed since it was written): ${parts.join('; ')}.`);\n    }\n    o.push('', `→ \\`/waymark refresh ${m.id}\\` updates the map.`, '');\n  }\n  return o.join('\\n');\n}\n"},"narrativeHash":"269aa8785dba"},{"id":"4g","title":"Comando CLI diff","description":"La CLI calcula el reporte con la base y --range opcional.","explanation":"`waymark diff [base]` toma la base del primer argumento (por defecto `HEAD`, es decir, cambios sin commitear) y `--range` para comparar `base...HEAD` como hace un PR. Delega el cálculo en diffMaps (traza 3) y recibe el reporte. Es la puerta que usa tanto el desarrollador en su terminal como la GitHub Action [4l].","path":"src/cli.js","lineNumber":351,"lineContent":"const rep = diffMaps(root(), rest[0] || 'HEAD', { range: !!opt.range });","status":"moved","fileHash":"043887f785f7","ctxHash":"7c7e0f122c92","snippet":{"startLine":348,"code":"      return;\n    }\n    case 'diff': {\n      const rep = diffMaps(root(), rest[0] || 'HEAD', { range: !!opt.range });\n      out(opt.format === 'json' ? rep : renderDiff(rep));\n      const f = opt['fail-on'];\n      if (\n        (f === 'touched' && rep.maps.some((m) => m.touched.length)) ||\n        (f === 'broken' && rep.maps.some((m) => m.broken.length)) ||\n        (f === 'drift' && rep.maps.some((m) => m.drift.stale || m.broken.length))\n      ) process.exitCode = 1;\n      return;\n    }\n    case 'exec': {\n      const r = root();\n      const sep = process.argv.indexOf('--');\n      let coverage;\n      let source;"},"narrativeHash":"7c7e0f122c92","note":"line 349 -> 351"},{"id":"4h","title":"Salida markdown o JSON","description":"Imprime renderDiff o el reporte crudo con --format json.","explanation":"Por defecto imprime el markdown de renderDiff [4a], legible en terminal y listo para pegar en un PR. Con `--format json` saca el reporte estructurado para scripts u otras herramientas. La redirección de esta salida a un archivo es justo lo que hace el workflow [4l].","path":"src/cli.js","lineNumber":352,"lineContent":"out(opt.format === 'json' ? rep : renderDiff(rep));","status":"moved","fileHash":"043887f785f7","ctxHash":"45eecd10550c","snippet":{"startLine":349,"code":"    }\n    case 'diff': {\n      const rep = diffMaps(root(), rest[0] || 'HEAD', { range: !!opt.range });\n      out(opt.format === 'json' ? rep : renderDiff(rep));\n      const f = opt['fail-on'];\n      if (\n        (f === 'touched' && rep.maps.some((m) => m.touched.length)) ||\n        (f === 'broken' && rep.maps.some((m) => m.broken.length)) ||\n        (f === 'drift' && rep.maps.some((m) => m.drift.stale || m.broken.length))\n      ) process.exitCode = 1;\n      return;\n    }\n    case 'exec': {\n      const r = root();\n      const sep = process.argv.indexOf('--');\n      let coverage;\n      let source;\n      let command = '';"},"narrativeHash":"45eecd10550c","note":"line 350 -> 352"},{"id":"4i","title":"Fallar el build","description":"Con --fail-on, marca exitCode 1 según el tipo de impacto.","explanation":"La opción `--fail-on` permite convertir el reporte en una compuerta de CI: `touched` falla si hay nodos tocados, `broken` si hay anclas rotas y `drift` si hay prosa desfasada o anclas rotas. Se usa `process.exitCode` en lugar de `process.exit` para que la salida ya impresa se vacíe completa. El workflow del PR no pasa esta opción, así que allí el diff solo informa.","path":"src/cli.js","lineNumber":358,"lineContent":") process.exitCode = 1;","status":"moved","fileHash":"043887f785f7","ctxHash":"d91c75bac35b","snippet":{"startLine":355,"code":"        (f === 'touched' && rep.maps.some((m) => m.touched.length)) ||\n        (f === 'broken' && rep.maps.some((m) => m.broken.length)) ||\n        (f === 'drift' && rep.maps.some((m) => m.drift.stale || m.broken.length))\n      ) process.exitCode = 1;\n      return;\n    }\n    case 'exec': {\n      const r = root();\n      const sep = process.argv.indexOf('--');\n      let coverage;\n      let source;\n      let command = '';\n      if (opt.lcov) {\n        coverage = parseLcov(fs.readFileSync(opt.lcov, 'utf8'), r);\n        source = 'lcov';\n        command = opt.lcov;\n      } else if (sep > -1 && process.argv[sep + 1]) {\n        const cmdArgs = process.argv.slice(sep + 1);"},"narrativeHash":"d91c75bac35b","note":"line 356 -> 358"},{"id":"4j","title":"Registro waymark_diff","description":"Tool MCP de solo lectura para el impacto de cambios.","explanation":"El servidor MCP registra `waymark_diff` con un esquema de `base`, `range`, `format` y `root`, y la anota como `readOnlyHint` porque no modifica mapas. Así un agente que está editando código puede preguntar qué flujos documentados está tocando antes de abrir el PR. Su descripción explica la misma semántica de base/range que la CLI [4g].","path":"src/mcp.js","lineNumber":369,"lineContent":"'waymark_diff',","symbol":"waymark_diff","status":"ok","fileHash":"2b0b28761299","ctxHash":"1b321e47671c","snippet":{"startLine":366,"code":"\n  // ---------------- change impact (PRs)\n  server.registerTool(\n    'waymark_diff',\n    {\n      title: 'Impact of changes on the maps',\n      description:\n        'Which map nodes a change set touches (their code blocks intersect changed lines), which anchors it breaks and which prose it leaves outdated. base \"HEAD\" (default) = uncommitted changes; with range=true compares base...HEAD (a branch or PR).',\n      inputSchema: {\n        base: z.string().optional(),\n        range: z.boolean().optional(),\n        format: z.enum(['markdown', 'json']).optional(),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ base = 'HEAD', range = false, format = 'markdown', root }) => {\n      const rep = diffMaps(rootOf(root), base, { range });"},"narrativeHash":"1b321e47671c"},{"id":"4k","title":"Handler MCP","description":"Reutiliza diffMaps y renderDiff y devuelve texto.","explanation":"El handler resuelve la raíz, llama a diffMaps con la base y el rango y devuelve el markdown de renderDiff [4a] o el JSON si se pidió. Es el espejo exacto de la CLI [4h], lo que garantiza que el agente y el humano lean el mismo diagnóstico. Va envuelto en `safe`, que convierte excepciones (por ejemplo, una base de git inexistente) en errores de tool.","path":"src/mcp.js","lineNumber":384,"lineContent":"return text(format === 'json' ? rep : renderDiff(rep));","status":"ok","fileHash":"2b0b28761299","ctxHash":"62915b3f0c0e","snippet":{"startLine":381,"code":"    },\n    safe(async ({ base = 'HEAD', range = false, format = 'markdown', root }) => {\n      const rep = diffMaps(rootOf(root), base, { range });\n      return text(format === 'json' ? rep : renderDiff(rep));\n    }),\n  );\n\n  // ---------------- verification by execution\n  server.registerTool(\n    'waymark_exec',\n    {\n      title: 'Mark nodes executed by tests',\n      description:\n        'Marks which nodes actually ran, from coverage: pass lcov (path to an lcov.info from any language) or command (a test command run with NODE_V8_COVERAGE, Node/JS only). Results show as ▶ in viewers and in context.',\n      inputSchema: {\n        id: z.string().optional().describe('Map id; omit for all maps'),\n        lcov: z.string().optional(),\n        command: z.string().optional().describe('e.g. \"npm test\"'),"},"narrativeHash":"62915b3f0c0e"},{"id":"4l","title":"Action ejecuta diff","description":"En cada PR, corre la CLI contra la rama base con --range.","explanation":"El workflow se dispara en `pull_request`, hace checkout con `fetch-depth: 0` (necesario para que exista el merge-base) e instala dependencias. Luego invoca la CLI [4g] comparando `origin/\u003cbase_ref>...HEAD` y redirige el markdown a `waymark-report.md`. No usa `--fail-on`, por lo que el job nunca bloquea el PR: solo informa.","path":".github/workflows/waymark-pr.yml","lineNumber":18,"lineContent":"- run: node src/cli.js diff \"origin/${{ github.base_ref }}\" --range > waymark-report.md","status":"ok","fileHash":"1d16869d0389","ctxHash":"0bd8bc4f2aea","snippet":{"startLine":15,"code":"        with:\n          node-version: 22\n      - run: npm ci\n      - run: node src/cli.js diff \"origin/${{ github.base_ref }}\" --range > waymark-report.md\n      - name: Comment (updates the previous Waymark comment)\n        env:\n          GH_TOKEN: ${{ github.token }}\n          PR: ${{ github.event.pull_request.number }}\n        run: gh pr comment \"$PR\" --body-file waymark-report.md --edit-last 2>/dev/null || gh pr comment \"$PR\" --body-file waymark-report.md\n"},"narrativeHash":"0bd8bc4f2aea"},{"id":"4m","title":"Comentar en el PR","description":"Edita el último comentario o crea uno nuevo con el reporte.","explanation":"Con el token del job (permiso `pull-requests: write`) se publica el reporte usando `gh`. Primero intenta `--edit-last` para actualizar el comentario anterior y no inundar el PR en cada push; si no hay comentario previo, ese intento falla y el `||` crea uno nuevo. El resultado es un único comentario vivo que refleja el impacto del último commit.","path":".github/workflows/waymark-pr.yml","lineNumber":23,"lineContent":"run: gh pr comment \"$PR\" --body-file waymark-report.md --edit-last 2>/dev/null || gh pr comment \"$PR\" --body-file waymark-report.md","status":"ok","fileHash":"1d16869d0389","ctxHash":"da6a4ed0ff78","snippet":{"startLine":20,"code":"        env:\n          GH_TOKEN: ${{ github.token }}\n          PR: ${{ github.event.pull_request.number }}\n        run: gh pr comment \"$PR\" --body-file waymark-report.md --edit-last 2>/dev/null || gh pr comment \"$PR\" --body-file waymark-report.md\n"},"narrativeHash":"da6a4ed0ff78"}],"tree":[{"ref":"4a","via":"recibe reporte de diffMaps","children":[{"ref":"4b","via":"maps vacío"},{"label":"por cada mapa afectado","children":[{"ref":"4c","via":"touched"},{"ref":"4d","via":"broken"},{"ref":"4e","via":"drift.stale"},{"ref":"4f"}]}]},{"label":"Canales de salida","children":[{"ref":"4g","via":"terminal","children":[{"ref":"4h","via":"markdown | json"},{"ref":"4i","via":"--fail-on"}]},{"ref":"4j","via":"agente","children":[{"ref":"4k","via":"renderDiff(rep)"}]},{"label":"GitHub Action (pull_request)","children":[{"ref":"4l","via":"invoca CLI con --range"},{"ref":"4m","via":"waymark-report.md"}]}]}],"narrativeHash":"93b915739149"},{"id":"5","title":"Verificación por ejecución: cobertura V8/lcov a nodos hit/miss","description":"Cómo Waymark convierte la cobertura de una ejecución de tests (V8 o lcov) en marcas ▶/○ por nodo, persistidas y mostradas en todos los consumidores.","diagramTitle":"De la cobertura a los nodos ejecutados","motivation":"Un mapa narrado dice cómo *debería* fluir la ejecución, pero nada garantiza que los tests realmente pasen por esos puntos. La verificación por ejecución cierra ese hueco: toma la cobertura real de una corrida (V8 para Node, lcov para cualquier lenguaje) y marca cada nodo como ejecutado o no, de modo que el lector sepa qué partes del mapa están respaldadas por código que corrió de verdad, y cuándo esa evidencia quedó obsoleta porque el código cambió.","details":"Hay dos puertas de entrada que hacen lo mismo. La CLI, en `case 'exec'` [5a], acepta `--lcov \u003carchivo>` o un comando tras `--`; la tool MCP `waymark_exec` [5b] recibe `lcov` o `command` como parámetros. En ambos casos el resultado intermedio tiene el mismo formato: un `Map(rutaRelativa → Map(línea → conteo))`.\n\nSi llega un lcov, [5c] `parseLcov` recorre las líneas `SF:`/`DA:` y suma conteos por archivo. Si llega un comando, [5d] `runWithV8Coverage` lo lanza con `NODE_V8_COVERAGE` apuntando a un directorio temporal (los procesos hijos también quedan cubiertos) y luego [5e] `parseV8Dir` traduce los rangos de bytes de V8 a líneas, sondeando el último carácter no blanco de cada línea y dejando que los rangos internos sobrescriban a los externos.\n\nCon la cobertura en mano, [5f] `applyCoverage` elige los mapas objetivo (uno o todos) y para cada uno [5g] `execResults` decide hit/miss por nodo, con un pequeño respaldo de hasta tres líneas para declaraciones no instrumentadas. [5h] `recordExec` guarda en cada ubicación un objeto `exec` con el `ctxHash` vigente, actualiza `meta.exec` con el resumen y reescribe JSON y HTML.\n\nLa lectura pasa siempre por [5i] `execState`, que devuelve `hit`, `miss`, `unknown` o `stale` (si el `ctxHash` cambió desde la corrida). El HTML precalcula estos estados en [5j], el visor pinta la insignia ▶/○ en [5k], y la extensión de VS Code replica la misma regla sin dependencias en [5l].","locations":[{"id":"5a","title":"CLI exec","description":"La CLI elige lcov o comando con V8 y aplica la cobertura.","explanation":"Aquí empieza todo cuando alguien escribe `waymark exec`. Si viene `--lcov`, lee el archivo y lo pasa a [5c]; si hay un comando después de `--`, lo ejecuta con [5d] y avisa si terminó con error, aunque la cobertura se aplica igual. Un id de mapa opcional antes de `--` restringe el alcance a un solo mapa. Al final llama a [5f] e imprime por mapa cuántos nodos se ejecutaron, cuántos no y cuántos quedaron sin cobertura.","path":"src/cli.js","lineNumber":361,"lineContent":"case 'exec': {","symbol":"main","status":"moved","fileHash":"043887f785f7","ctxHash":"accf54859b4e","snippet":{"startLine":358,"code":"      ) process.exitCode = 1;\n      return;\n    }\n    case 'exec': {\n      const r = root();\n      const sep = process.argv.indexOf('--');\n      let coverage;\n      let source;\n      let command = '';\n      if (opt.lcov) {\n        coverage = parseLcov(fs.readFileSync(opt.lcov, 'utf8'), r);\n        source = 'lcov';\n        command = opt.lcov;\n      } else if (sep > -1 && process.argv[sep + 1]) {\n        const cmdArgs = process.argv.slice(sep + 1);\n        command = cmdArgs.join(' ');\n        out(`waymark: running ${command} with V8 coverage…`);\n        const res = runWithV8Coverage(r, cmdArgs[0], cmdArgs.slice(1));"},"narrativeHash":"accf54859b4e","note":"line 359 -> 361"},{"id":"5b","title":"MCP waymark_exec","description":"Tool MCP equivalente para agentes: lcov o command.","explanation":"Es la misma operación que [5a] pero expuesta a agentes por MCP. Recibe `lcov` (ruta a un lcov.info) o `command` (por ejemplo `npm test`), que se trocea por espacios y se lanza con [5d]. Sin ninguno de los dos lanza un error explícito. Devuelve como texto el resumen de [5f], así el agente ve de inmediato el resultado por mapa.","path":"src/mcp.js","lineNumber":390,"lineContent":"'waymark_exec',","status":"ok","fileHash":"2b0b28761299","ctxHash":"70c773eee1c1","snippet":{"startLine":387,"code":"\n  // ---------------- verification by execution\n  server.registerTool(\n    'waymark_exec',\n    {\n      title: 'Mark nodes executed by tests',\n      description:\n        'Marks which nodes actually ran, from coverage: pass lcov (path to an lcov.info from any language) or command (a test command run with NODE_V8_COVERAGE, Node/JS only). Results show as ▶ in viewers and in context.',\n      inputSchema: {\n        id: z.string().optional().describe('Map id; omit for all maps'),\n        lcov: z.string().optional(),\n        command: z.string().optional().describe('e.g. \"npm test\"'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, lcov, command, root }) => {\n      const r = rootOf(root);\n      let coverage;"},"narrativeHash":"70c773eee1c1"},{"id":"5c","title":"parseLcov","description":"Convierte lcov.info en mapa archivo → línea → conteo.","explanation":"lcov es el formato común que emiten Jest, c8, coverage.py o conversores de JaCoCo, así que esta función abre Waymark a cualquier lenguaje. Cada `SF:` fija el archivo actual, normalizado a ruta relativa a la raíz; cada `DA:línea,conteo` suma al contador de esa línea; `end_of_record` cierra el bloque. Los archivos fuera del repositorio se ignoran porque `relPath` no devuelve nada. El resultado tiene el mismo formato que [5e], así que el resto del flujo no distingue el origen.","path":"src/coverage.js","lineNumber":19,"lineContent":"export function parseLcov(text, root) {","symbol":"parseLcov","status":"ok","fileHash":"286b18309e5b","ctxHash":"004f74464ba5","snippet":{"startLine":16,"code":" */\n\n/** Parses lcov.info → Map(relPath → Map(line → count)). */\nexport function parseLcov(text, root) {\n  const out = new Map();\n  let cur = null;\n  for (const raw of text.split(/\\r?\\n/)) {\n    const line = raw.trim();\n    if (line.startsWith('SF:')) {\n      const file = line.slice(3);\n      const rel = relPath(root, path.isAbsolute(file) ? file : path.resolve(root, file));\n      cur = rel ? (out.get(rel) || out.set(rel, new Map()).get(rel)) : null;\n    } else if (line.startsWith('DA:') && cur) {\n      const [ln, count] = line.slice(3).split(',');\n      cur.set(Number(ln), (cur.get(Number(ln)) || 0) + Number(count));\n    } else if (line === 'end_of_record') {\n      cur = null;\n    }"},"narrativeHash":"004f74464ba5"},{"id":"5d","title":"runWithV8Coverage","description":"Ejecuta el comando con NODE_V8_COVERAGE y parsea el resultado.","explanation":"Crea un directorio temporal y lanza el comando con `NODE_V8_COVERAGE` apuntando ahí, de modo que Node (y sus procesos hijos) vuelquen su cobertura nativa sin instalar nada. Los nombres como `npm` se resuelven con `resolveCommand` para manejar los shims de Windows. Al terminar pasa el directorio a [5e] y lo borra en el `finally`, devolviendo también el código de salida.","path":"src/coverage.js","lineNumber":93,"lineContent":"export function runWithV8Coverage(root, command, args) {","symbol":"runWithV8Coverage","status":"ok","fileHash":"286b18309e5b","ctxHash":"fe18fdea6c67","snippet":{"startLine":90,"code":"}\n\n/** Runs a command with V8 coverage enabled (children included) and returns the parsed coverage. */\nexport function runWithV8Coverage(root, command, args) {\n  const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'waymark-v8-'));\n  // Absolute executables run directly; names like \"npm\" go through resolveCommand (Windows shims).\n  const bin = fs.existsSync(command) ? { command, args: [] } : resolveCommand(command) || { command, args: [], shell: process.platform === 'win32' };\n  const res = spawnSync(bin.command, argsFor(bin, args), {\n    cwd: root,\n    stdio: 'inherit',\n    shell: !!bin.shell,\n    env: { ...process.env, NODE_V8_COVERAGE: dir },\n  });\n  try {\n    return { status: res.status, coverage: parseV8Dir(dir, root) };\n  } finally {\n    fs.rmSync(dir, { recursive: true, force: true });\n  }"},"narrativeHash":"fe18fdea6c67"},{"id":"5e","title":"parseV8Dir","description":"Traduce rangos de bytes V8 a conteos por línea.","explanation":"V8 reporta rangos de offsets por función, no líneas, así que hay que traducirlos. Para cada línea toma como sonda su último carácter no blanco (en `export function f() {` eso cae en la `{`, dentro del rango de la función). Ordena los rangos de mayor a menor para que los internos, más específicos, sobrescriban a los externos. Descarta `node_modules` y archivos fuera del repo, y suma conteos si varios procesos cargaron el mismo archivo.","path":"src/coverage.js","lineNumber":39,"lineContent":"export function parseV8Dir(dir, root) {","symbol":"parseV8Dir","status":"ok","fileHash":"286b18309e5b","ctxHash":"86c5e4591fac","snippet":{"startLine":36,"code":"}\n\n/** Reads a NODE_V8_COVERAGE directory → Map(relPath → Map(line → count)). Block-level ranges. */\nexport function parseV8Dir(dir, root) {\n  const out = new Map();\n  for (const f of fs.readdirSync(dir).filter((x) => x.endsWith('.json'))) {\n    let json;\n    try {\n      json = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));\n    } catch {\n      continue;\n    }\n    for (const script of json.result || []) {\n      if (!script.url || !script.url.startsWith('file:')) continue;\n      let abs;\n      try {\n        abs = fileURLToPath(script.url);\n      } catch {"},"narrativeHash":"86c5e4591fac"},{"id":"5f","title":"applyCoverage","description":"Elige mapas objetivo y persiste resultados de cada uno.","explanation":"Es el pegamento compartido por [5a] y [5b]. Si se pidió un id lo carga; si no, recorre todos los mapas del repositorio. Para cada uno calcula los veredictos con [5g] y los guarda con [5h], devolviendo la lista de resúmenes que la CLI imprime o el MCP devuelve.","path":"src/coverage.js","lineNumber":129,"lineContent":"export function applyCoverage(root, coverage, { ids = null, source = 'coverage', command = '' } = {}) {","symbol":"applyCoverage","status":"ok","fileHash":"286b18309e5b","ctxHash":"fc13e9016844","snippet":{"startLine":126,"code":"}\n\n/** Applies coverage to the given maps (or all) and persists node exec state. */\nexport function applyCoverage(root, coverage, { ids = null, source = 'coverage', command = '' } = {}) {\n  const targets = ids && ids.length ? ids.map((i) => loadMap(root, i).id) : listMaps(root).map((m) => m.id);\n  return targets.map((id) => recordExec(root, id, execResults(loadMap(root, id), coverage), { source, command }));\n}\n"},"narrativeHash":"fc13e9016844"},{"id":"5g","title":"execResults","description":"Decide hit o miss por nodo según su línea ancla.","explanation":"Recorre cada ubicación del mapa y busca el conteo de su línea en la cobertura. Como las declaraciones a veces no son sentencias instrumentadas, prueba hasta tres líneas siguientes antes de rendirse. Si el archivo no tiene cobertura o ninguna línea cercana está instrumentada, el nodo queda fuera del resultado: será `unknown`, no `miss`. Esa distinción evita acusar de 'no ejecutado' a código que la herramienta simplemente no midió.","path":"src/coverage.js","lineNumber":111,"lineContent":"export function execResults(doc, coverage) {","symbol":"execResults","status":"ok","fileHash":"286b18309e5b","ctxHash":"8ce6750ce696","snippet":{"startLine":108,"code":"}\n\n/** Node-level verdicts for one map: hit if the anchor line ran; miss if instrumented but 0. */\nexport function execResults(doc, coverage) {\n  const results = {};\n  for (const t of doc.traces) {\n    for (const l of t.locations) {\n      const lines = coverage.get(l.path);\n      if (!lines) continue;\n      // Declarations (e.g. \"export function f() {\") may not be a counted statement themselves;\n      // fall back to the first instrumented line of the node's next few lines.\n      let count = lines.get(l.lineNumber);\n      for (let k = 1; count == null && k \u003c= 3; k++) count = lines.get(l.lineNumber + k);\n      if (count == null) continue;\n      results[l.id] = { hit: count > 0, count };\n    }\n  }\n  return results;"},"narrativeHash":"8ce6750ce696"},{"id":"5h","title":"recordExec","description":"Guarda exec por nodo con ctxHash y regenera JSON y HTML.","explanation":"Primero refresca los `ctxHash` del mapa para que la marca quede atada al código tal como está ahora. Luego, por cada nodo, guarda `{ hit, count, at, source, ctxHash }` o borra un `exec` previo si no hubo cobertura. El resumen hit/miss/unknown va a `meta.exec` junto con el origen y el comando, y finalmente se persiste el JSON y se reescribe el visor HTML. Ese `ctxHash` es lo que luego permite a [5i] detectar evidencia vieja.","path":"src/store.js","lineNumber":178,"lineContent":"export function recordExec(root, id, results, { source = 'coverage', command = '' } = {}) {","symbol":"recordExec","status":"ok","fileHash":"3c9966c81adf","ctxHash":"e1a483ff830e","snippet":{"startLine":175,"code":"}\n\n/** Stores execution results ({ nodeId: { hit, count } }) from coverage. */\nexport function recordExec(root, id, results, { source = 'coverage', command = '' } = {}) {\n  const doc = loadMap(root, id);\n  refreshContextHashes(root, doc);\n  const at = new Date().toISOString();\n  const sum = { hit: 0, miss: 0, unknown: 0 };\n  for (const t of doc.traces) {\n    for (const l of t.locations) {\n      const r = results[l.id];\n      if (!r) {\n        delete l.exec;\n        sum.unknown++;\n        continue;\n      }\n      l.exec = { hit: r.hit, count: r.count, at, source, ctxHash: l.ctxHash };\n      sum[r.hit ? 'hit' : 'miss']++;"},"narrativeHash":"e1a483ff830e"},{"id":"5i","title":"execState","description":"Deriva hit, miss, unknown o stale de un nodo.","explanation":"Es la única regla de lectura: sin `exec` el nodo es `unknown`; si el `ctxHash` guardado ya no coincide con el actual, es `stale` porque el código cambió desde la corrida; si no, `hit` o `miss`. Vive en un módulo sin dependencias para que renderers y visor la compartan. Gracias a ella nunca se muestra un ▶ sobre código que ya no es el que se ejecutó.","path":"src/state.js","lineNumber":18,"lineContent":"export function execState(l) {","symbol":"execState","status":"ok","fileHash":"5663d59cddad","ctxHash":"9659dce25658","snippet":{"startLine":15,"code":"}\n\n/** hit | miss | unknown | stale (code changed since coverage was taken). */\nexport function execState(l) {\n  if (!l.exec) return 'unknown';\n  if (l.exec.ctxHash !== l.ctxHash) return 'stale';\n  return l.exec.hit ? 'hit' : 'miss';\n}\n"},"narrativeHash":"9659dce25658"},{"id":"5j","title":"Estados precalculados HTML","description":"El HTML incrusta el estado exec de cada nodo.","explanation":"Al generar el visor, el servidor calcula `execState` [5i] para cada nodo y lo guarda en `states` dentro de los datos incrustados. Así el navegador no necesita recalcular hashes. Lo mismo hace el renderer markdown para agentes, que añade la marca '▶ executed by the tests' junto al nodo.","path":"src/render/html.js","lineNumber":32,"lineContent":"doc.traces.flatMap((t) => t.locations.map((l) => [l.id, { check: checkState(l), exec: execState(l) }])),","symbol":"renderHtml","status":"ok","fileHash":"8417b34b8047","ctxHash":"9db4caf1c6ab","snippet":{"startLine":29,"code":"    maps,\n    // Precomputed per-node state (fact-check verdict validity needs hashes the browser can't do sync).\n    states: Object.fromEntries(\n      doc.traces.flatMap((t) => t.locations.map((l) => [l.id, { check: checkState(l), exec: execState(l) }])),\n    ),\n    markdown: renderMarkdown(doc, { detail: 'full' }),\n    // Smaller context blocks for \"copy trace / node as context\".\n    traceMd: Object.fromEntries(doc.traces.map((t) => [t.id, renderMarkdown(doc, { trace: t.id })])),\n    nodeMd: Object.fromEntries(doc.traces.flatMap((t) => t.locations.map((l) => [l.id, renderMarkdown(doc, { node: l.id })]))),\n    mermaid: renderMermaid({ ...doc, diagram: undefined }),\n  };\n  return `\u003c!doctype html>\n\u003chtml lang=\"${escHtml(doc.language || 'en')}\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"generator\" content=\"waymark\">\n\u003ctitle>Waymark · ${escHtml(doc.title)}\u003c/title>"},"narrativeHash":"9db4caf1c6ab"},{"id":"5k","title":"Insignia ▶/○ en visor","description":"El visor pinta ▶ si se ejecutó y ○ si no.","explanation":"En el cliente del visor, `badges` lee el estado precalculado cuted by the tests (N×)' o '○ not executed' en los tooltips. Si cambias la regla en un lado, hay que cambiarla en el otro.","path":"vscode/lib/model.js","lineNumber":84,"lineContent":"function execState(l) {","symbol":"execState","status":"ok","fileHash":"78baee532c18","ctxHash":"fb312467ec4c","snippet":{"startLine":81,"code":"  if (l.check.ctxHash !== l.ctxHash || l.check.proseHash !== sha([l.title, l.description, l.explanation || ''].join('|'))) return 'stale';\n  return l.check.verdict;\n}\nfunction execState(l) {\n  if (!l.exec) return 'unknown';\n  if (l.exec.ctxHash !== l.ctxHash) return 'stale';\n  return l.exec.hit ? 'hit' : 'miss';\n}\n\n/** Index of the node anchored exactly at (path, line) in a given map, else -1. */\nfunction nodeAt(map, relPath, line) {\n  return map.nodes.findIndex((n) => n.path === relPath && n.line === line);\n}\n\n/** Next/previous node in reading order, starting from the node at the cursor or `fromIndex`. */\nfunction step(map, fromIndex, dir) {\n  if (!map.nodes.length) return -1;\n  if (fromIndex \u003c 0) return dir > 0 ? 0 : map.nodes.length - 1;"},"narrativeHash":"fb312467ec4c"}],"tree":[{"label":"Entradas","children":[{"ref":"5a","children":[{"label":"--lcov \u003carchivo>","children":[{"ref":"5c","via":"texto lcov"}]},{"label":"-- \u003ccomando>","children":[{"ref":"5d","via":"spawn + NODE_V8_COVERAGE","children":[{"ref":"5e","via":"dir temporal"}]}]}]},{"ref":"5b","label":"MCP waymark_exec (lcov | command)"}]},{"ref":"5f","via":"Map(ruta → línea → conteo)","children":[{"label":"por cada mapa (id o todos)","children":[{"ref":"5g","via":"doc + cobertura"},{"ref":"5h","via":"{ nodo: { hit, count } }","children":[{"label":"persist JSON + writeHtml"}]}]}]},{"label":"Lectura del estado","children":[{"ref":"5i","via":"l.exec vs ctxHash","children":[{"ref":"5j","via":"states[id].exec","children":[{"ref":"5k","via":"STATES"}]},{"label":"renderMarkdown: ▶ executed by the tests"}]},{"ref":"5l","label":"copia en vscode/lib/model.js"}]} [--model \u003cm>] [--open]\n  annotate \u003cid> \u003cpatch.json>  Apply prose fields (story, traces[].motivation|details, locations[].explanation)\n  create \u003cfile.json>     Validate, anchor and store a map written as JSON [--id \u003cid>] [--open]\n  list                   List maps in the repo [--json]\n  show \u003cid>              Print a map [--format markdown|compact|json|mermaid]\n  verify [id]            Check anchors and narrative drift against current code [--fix] [--strict]\n                         exit 1 if anchors are broken (--strict: also if stale; --strict-narrative:\n                         also if prose was written for code that has since changed)\n  refresh \u003cid>           Rewrite only the prose whose code changed (agent CLI) [--engine] [--model] [--open]\n  lint [id]              Quality checks: unknown [refs], missing narrative, uncited nodes… [--strict] [--json]\n  for-file \u003cpath> [line] Maps/traces/nodes covering a file [--json]\n  hook \u003ckind>            Claude Code hook entry point (pre-edit | post-edit | post-read), reads stdin JSON\n  update                 Update this checkout: git pull --ff-only, npm ci if the lockfile changed, then\n                         re-install what you ask for [--claude-global] [--vscode] [--target \u003crepo>] [--no-pull]\n  render \u003cid>            Regenerate the HTML viewer [--open]\n  delete \u003cid>            Delete a map\n  suggest                Suggest topics from recent work [--json]\n  guide [\"\u003ctopic>\"]      Print the Waymark agent procedure (for any harness)\n  install                Wire into a repo for Claude Code + Codex (CLI, IDE, desktop) + AGENTS.md\n                         [--target \u003cdir>] [--no-claude] [--no-codex] [--no-agents-md] [--no-hooks]\n                         [--claude-global] also register for every project: claude mcp add -s user + ~/.claude/skills|agents\n                         [--codex-global]  also register in ~/.codex/config.toml + ~/. ean', short: 'h' },\n  },\n});\n\nconst [cmd, ...rest] = positionals;\nconst root = () => resolveRoot(opt.root);\nconst out = (v) => console.log(typeof v === 'string' ? v : JSON.stringify(v, null, 2));\n\nfunction printReport(res) {\n  const a = res.report;\n  out(`✔ ${res.doc.id}  (${a.total} locations: ${a.ok} ok, ${a.moved + a.relocated} re-anchored, ${a.fuzzy} approx, ${a.unresolved + a.missing} unverified)`);\n  for (const i of a.issues) out(`  ${i.status.padEnd(10)} [${i.id}] ${i.path}  ${i.note || ''}`);\n  out(`  json: ${res.jsonPath}\\n  html: ${res.htmlPath}`);\n}\n\nconst SELF = fileURLToPath(import.meta.url);\nconst BUNDLED = !/[\\\\/]cli\\.js$/.test(SELF);\nconst MCP_ARGS = BUNDLED ? [SELF, 'mcp'] : [path.join(HERE, 'mcp.js')];\nconst MCP_ENTRY = MCP_ARGS[0];\nconst fwd = (p) => p.replace(/\\\\/g, '/');\n\n/** Claude Code headless: only read tools + waymark MCP are allowed. */\nfunction claudeInvocation(r, prompt, model = opt.model) {\n  const cfgPath = path.join(os.tmpdir(), `waymark-mcp-${process.pid}-${Math.random().toString(36).slice(2)}.json`);\n  fs.writeFileSync(\n    cfgPath,\n    JSON.stringify({ mcpServers: { waymark: { command: process.execPath, args: MCP_ARGS, env: { WAYMARK_ROOT: r } } } }),\n  );\n  const args = ['-p', prompt, '--mcp-config', cfgPath, '--strict-mcp-config', '--allowedTools', 'Read,Grep,Glob,mcp__waymark', '--permission-mode', 'dontAsk'];\n  if (model) args.push('--model', model);\n  if (opt['max-turns']) args.push('--max-turns', opt['max-turns']);\n  return { bin: resolveCommand('claude'), args, stdin: null, cleanup: () => fs.rmSync(cfgPath, { force: true }) };\n}\n\n/** Codex headless (codex exec): read-only sandbox; the MCP server (outside the sandbox) does the writing. */\nfunction codexInvocation(r, prompt, model = opt.model) {\n  const toml = JSON.stringify;\n  const args = [\n    'exec',\n    '--sandbox', 'read-only',\n    '--skip-git-repo-check',\n    '--color', 'never',\n    '-C', r,\n    '-c', `mcp_servers.waymark.command=${toml(fwd(process.execPath))}`,\n    '-c', `mcp_servers.waymark.args=[${MCP_ARGS.map((a) => toml(fwd(a))).join(',')}]`,\n    '-c', `mcp_servers.waymark.env={WAYMARK_ROOT=${toml(fwd(r))}}`,\n    '-c', 'mcp_servers.waymark.startup_timeout_sec=20',\n    '-c', 'mcp_servers.waymark.tool_timeout_sec=120',\n    '-c', `mcp_servers.waymark.default_tools_approval_mode=${toml(opt['approval'] || 'approve')}`,\n  ];\n  if (model) args.push('-m', model);\n  args.push('-'); // prompt from stdin: avoids command-line length/quoting limits\n  return { bin: resolveCommand('codex'), args, stdin: prompt, cleanup: () => {} };\n}\n\nfunction pickEngine() {\n  const e = opt.engine || 'auto';\n  if (e === 'claude' || e === 'codex') return e;\n  if (e !== 'auto') throw new Error(`Unknown engine \"${e}\" (use claude | codex)`);\n  return resolveCommand('claude') ? 'claude' : 'codex';\n}\n\n/** Runs Claude Code or Codex headlessly with only read tools + the waymark MCP server. */\nasync function runAgent(r, task, { log = null, label = '', model = opt.model } = {}) {\n  const engine = pickEngine();\n  const tools = engine === 'codex' ? 'read-only shell commands (rg, sed -n, git grep, ls)' : 'Read/Grep/Glob';\n  const prompt =\n    task +\n    `\\n\\nRepository root: ${r}\\nWork autonomously: do not ask questions. Explore with ${tools} only. ` +\n    `Always pass root=\"${fwd(r)}\" to waymark_* tools. When done, answer with the map id and a short summary.`;\n  const inv = engine === 'codex' ? codexInvocation(r, prompt, model) : claudeInvocation(r, prompt, model);\n  if (!inv.bin) throw new Error(`\"${engine}\" CLI not found on PATH`);\n  out(`waymark: running ${engine}${label ? ' — ' + label : ''}…`);\n  const fd = log ? fs.openSync(log, 'w') : null;\n  const code = await new Promise((res, rej) => {\n    const p = spawn(inv.bin.command, [...inv.bin.args, ...inv.args], {\n      cwd: r,\n      stdio: [inv.stdin ? 'pipe' : 'ignore', fd ?? 'inherit', fd ?? 'inherit'],\n      shell: !!inv.bin.shell,\n    });\n    p.on('error', (e) => rej(new Error(`Could not run ${engine}: ${e.message}`)));\n    p.on('close', res);\n    if (inv.stdin) p.stdin.end(inv.stdin);\n  }).finally(() => {\n    inv.cleanup();\n    if (fd != null) fs.closeSync(fd);\n  });\n  return code ?? 1;\n}\n\nasync function generate(topic) {\n  if (!topic) throw new Error('Usage: waymark generate \"\u003ctopic>\" [--engine claude|codex] [--mode fast|smart]');\n  const r = root();\n  const before = new Set(listMaps(r).map((m) => m.id));\n  const mode = opt.mode === 'fast' ? 'fast' : 'smart';\n  const t0 = Date.now();\n  const code = opt.parallel\n    ? await generateParallel(r, topic, mode)\n    : await runAgent(r, opt.overview ? overviewGuide(topic) + '\\n\\n' + waymarkGuide(topic, { mode: 'fast' }) : waymarkGuide(topic, { mode }));\n  out(`waymark: finished in ${Math.round((Date.now() - t0) / 1000)}s`);\n  const created = listMaps(r).filter((m) => !before.has(m.id));\n  if (created[0]) {\n    const html = path.join(mapDir(r), `${created[0].id}.html`);\n    const gaps = narrativeGaps(loadMap(r, created[0].id));\n    out(`\\nwaymark: ${created[0].id}\\nhtml: ${html}`);\n    if (!gaps.complete) out(`narrative incomplete — run: waymark enrich ${created[0].id}`);\n    if (opt.open) openFile(html);\n  } else if (code === 0) {\n    out('\\n(no new map was stored; the agent may have updated an existing one)');\n  }\n  process.exitCode = code;\n}\n\n/** plan (1 agent) → one builder agent per trace, concurrently → finalize (1 agent). */\nasync function generateParallel(r, topic, mode) {\n  const before = new Set(listDrafts(r).map((d) => d.draft));\n  let code = await runAgent(r, planGuide(topic, { mode, kind: opt.overview ? 'overview' : 'flow' }), { label: 'planning', model: opt['coordinator-model'] || opt.model });\n  const draft = listDrafts(r).find((d) => !before.has(d.draft));\n  if (!draft) throw new Error('The planner did not register a plan (waymark_plan).');\n  const plan = loadPlan(r, draft.draft);\n  const jobs = Math.max(1, Number(opt.jobs) || 4);\n  const logDir = path.join(mapDir(r), '.drafts', draft.draft);\n  out(`waymark: plan ${draft.draft} with ${plan.traces.length} traces → ${Math.min(jobs, plan.traces.length)} builders in parallel (logs in ${logDir})`);\n  const queue = [...plan.traces];\n  const worker = async () => {\n    for (let t = queue.shift(); t; t = queue.shift()) {\n      const c = await runAgent(r, traceGuide(draft.draft, t.n, plan), { log: path.join(logDir, `trace-${t.n}.log`), label: `trace ${t.n}: ${t.title}` });\n      out(`waymark: trace ${t.n} ${c === 0 ? 'done' : 'failed (' + c + ')'}`);\n    }\n  };\n  await Promise.all(Array.from({ length: Math.min(jobs, plan.traces.length) }, worker));\n  const st = draftStatus(r, draft.draft);\n  if (st.missing.length) out(`waymark: traces not built: ${st.missing.join(', ')} (continuing with the rest)`);\n  code = await runAgent(r, finalizeGuide(draft.draft), { label: 'finalizing', model: opt['coordinator-model'] || opt.model });\n  return code;\n}\n\nasync function check(id) {\n  if (!id) throw new Error('Usage: waymark check \u003cid> [--engine claude|codex]');\n  const r = root();\n  const doc = loadMap(r, id);\n  const code = await runAgent(r, checkGuide(doc.id) + '\\n\\nStart by calling waymark_check(id: \"' + doc.id + '\") to get the map with its code snippets.', { label: 'fact-check' });\n  const s = checkSummary(loadMap(r, doc.id));\n  out(`\\nwaymark: ${doc.id} fact-check → ${s.supported} supported, ${s.partial} partial, ${s.unsupported} unsupported, ${s.unchecked + s.stale} unchecked (of ${s.total})`);\n  if (opt.open) openFile(path.join(mapDir(r), `${doc.id}.html`));\n  process.exitCode = code || (s.unsupported ? 1 : 0);\n}\n\nasync function enrich(id) {\n  if (!id) throw new Error('Usage: waymark enrich \u003cid> [--engine claude|codex]');\n  const r = root();\n  const doc = loadMap(r, id);\n  const code = await runAgent(r, enrichGuide(doc.id));\n  const gaps = narrativeGaps(loadMap(r, doc.id));\n  const html = path.join(mapDir(r), `${doc.id}.html`);\n  out(`\\nwaymark: ${doc.id}  narrative ${gaps.complete ? 'complete' : 'still incomplete: ' + JSON.stringify(gaps)}\\nhtml: ${html}`);\n  if (opt.open) openFile(html);\n  process.exitCode = code;\n}\n\nasync function refresh(id) {\n  if (!id) throw new Error('Usage: waymark refresh \u003cid> [--engine claude|codex]');\n  const r = root();\n  const v = verifyMap(r, id, { fix: true });\n  if (!v.narrative.stale && !v.broken) {\n    out(`waymark: ${v.id} narrative is in sync with the code; nothing to refresh.`);\n    return;\n  }\n  const brokenIds = v.changes.filter((c) => c.status === 'unresolved' || c.status === 'missing').map((c) => c.id);\n  const code = await runAgent(r, refreshGuide(v.id, v.narrative, brokenIds));\n  const after = verifyMap(r, v.id);\n  out(`\\nwaymark: ${v.id}  narrative ${after.narrative.stale ? 'still flagged: ' + JSON.stringify(after.narrative) : 'in sync'}`);\n  if (opt.open) openFile(path.join(mapDir(r), `${v.id}.html`));\n  process.exitCode = code;\n}\n\nasync function main() {\n  if (!cmd || opt.help) return out(HELP);\n  switch (cmd) {\n    case 'mcp': {\n      const { startStdio } = await import('./mcp.js');\n      return startStdio();\n    }\n    case 'generate':\n      return generate(rest.join(' '));\n    case 'enrich':\n      return enrich(rest[0]);\n    case 'refresh':\n      return refresh(rest[0]);\n    case 'lint': {\n      const r = root();\n      const ids = rest[0] ? [loadMap(r, rest[0]).id] : listMaps(r).map((m) => m.id);\n      const mapIds = new Set(listMaps(r).map((m) => m.id));\n      const results = ids.map((i) => lintMap(loadMap(r, i), { mapIds }));\n      if (opt.json) return out(results);\n      let bad = false;\n      for (const res of results) {\n        out(`${res.errors ? 'ERRORS ' : res.warnings ? 'WARN   ' : 'OK     '} ${res.id}  (${res.errors} errors, ${res.warnings} warnings)`);\n        for (const i of res.issues) out(`        ${i.level.padEnd(5)} ${i.where}: ${i.message}`);\n        if (res.errors || (opt.strict && res.warnings)) bad = true;\n      }\n      if (bad) process.exitCode = 1;\n      return;\n    }\n    case 'for-file': {\n      if (!rest[0]) throw new Error('Usage: waymark for-file \u003cpath> [line]');\n      const res = mapsForFile(root(), rest[0], { line: rest[1] ? Number(rest[1]) : null });\n      if (opt.json) return out({ path: res.path, maps: res.maps.map(({ doc, ...m }) => m) });\n      return out(renderFileContext(res, { maxChars: 20000 }) || `No waymark map covers ${res.path}.`);\n    }\n    case 'update': {\n      const { selfUpdate } = await import('./update.js');\n      return out(\n        selfUpdate({\n          pull: !opt['no-pull'],\n          claudeGlobal: !!(opt['claude-global'] || opt.global),\n          vscode: !!opt.vscode,\n          target: opt.target ? resolveRoot(opt.target) : null,\n        }),\n      );\n    }\n    case 'check':\n      return check(rest[0]);\n    case 'note': {\n      if (!rest[0] || !rest[1]) throw new Error('Usage: waymark note \u003cid> \u003cnode> \"\u003ctext>\" [--author \u003cname>] [--remove \u003cindex>]');\n      const res = noteMap(root(), rest[0], rest[1], { text: rest.slice(2).join(' '), author: opt.author, remove: opt.remove != null ? Number(opt.remove) : null });\n      return out(`✔ ${res.id} [${res.node}]: ${res.notes.length} note(s)`);\n    }\n    case 'notes': {\n      const doc = loadMap(root(), rest[0]);\n      for (const t of doc.traces) for (const l of t.locations) (l.notes || []).forEach((n, i) => out(`[${l.id}] #${i} ${n.author} ${String(n.at).slice(0, 10)}: ${n.text}`));\n      return;\n    }\n    case 'diff': {\n      const rep = diffMaps(root(), rest[0] || 'HEAD', { range: !!opt.range });\n      out(opt.format === 'json' ? rep : renderDiff(rep));\n      const f = opt['fail-on'];\n      if (\n        (f === 'touched' && rep.maps.some((m) => m.touched.length)) ||\n        (f === 'broken' && rep.maps.some((m) => m.broken.length)) ||\n        (f === 'drift' && rep.maps.some((m) => m.drift.stale || m.broken.length))\n      ) process.exitCode = 1;\n      return;\n    }\n    case 'exec': {\n      const r = root();\n      const sep = process.argv.indexOf('--');\n      let coverage;\n      let source;\n      let command = '';\n      if (opt.lcov) {\n        coverage = parseLcov(fs.readFileSync(opt.lcov, 'utf8'), r);\n        source = 'lcov';\n        command = opt.lcov;\n      } else if (sep > -1 && process.argv[sep + 1]) {\n        const cmdArgs = process.argv.slice(sep + 1);\n        command = cmdArgs.join(' ');\n        out(`waymark: running ${command} with V8 coverage…`);\n        const res = runWithV8Coverage(r, cmdArgs[0], cmdArgs.slice(1));\n        if (res.status) out(`waymark: the command exited with ${res.status} (coverage is still applied)`);\n        coverage = res.coverage;\n        source = 'v8';\n      } else throw new Error('Usage: waymark exec [id] --lcov \u003clcov.info>   |   waymark exec [id] -- \u003ctest command>');\n      // A map id may precede \"--\": `waymark exec my-map -- npm test`.\n      const head = sep > -1 ? process.argv.slice(process.argv.indexOf('exec') + 1, sep).filter((a) => !a.startsWith('-')) : rest;\n      const ids = head[0] ? [head[0]] : null;\n      for (const x of applyCoverage(r, coverage, { ids, source, command })) {\n        out(`▶ ${x.id}: ${x.hit} executed, ${x.miss} not executed, ${x.unknown} without coverage`);\n      }\n      return;\n    }\n    case 'index':\n      return out(writeIndex(root()) || 'no maps');\n    case 'hook': {\n      const { runHook } = await import('./hooks.js');\n      return runHook(rest[0]);\n    }\n    case 'annotate': {\n      if (!rest[0] || !rest[1]) throw new Error('Usage: waymark annotate \u003cid> \u003cpatch.json|->');\n      const raw = rest[1] === '-' ? fs.readFileSync(0, 'utf8') : fs.readFileSync(rest[1], 'utf8');\n      const res = annotateMap(root(), rest[0], JSON.parse(raw));\n      out(`✔ ${res.id}: ${res.changed} fields changed${res.unknown.length ? '; unknown: ' + res.unknown.join(', ') : ''}`);\n      if (!res.narrative.complete) out('  still missing: ' + JSON.stringify(res.narrative));\n      out('  html: ' + res.htmlPath);\n      return;\n    }\n    case 'create': {\n      if (!rest[0]) throw new Error('Usage: waymark create \u003cfile.json|->');\n      const raw = rest[0] === '-' ? fs.readFileSync(0, 'utf8') : fs.readFileSync(rest[0], 'utf8');\n      const res = saveMap(root(), JSON.parse(raw), { id: opt.id });\n      printReport(res);\n      if (opt.open) openFile(res.htmlPath);\n      if (!res.report.healthy) process.exitCode = 2;\n      return;\n    }\n    case 'list': {\n      const maps = listMaps(root());\n      if (opt.json) return out(maps);\n      if (!maps.length) return out('No waymark yet. Try: waymark generate \"how does X work?\"');\n      for (const m of maps) out(`${m.id.padEnd(44)} ${String(m.locations).padStart(3)} nodes  ${(m.updatedAt || '').slice(0, 10)}  ${m.title}`);\n      return;\n    }\n    case 'show': {\n      const doc = loadMap(root(), rest[0]);\n      const f = opt.format || 'markdown';\n      return out(f === 'json' ? doc : f === 'mermaid' ? renderMermaid(doc) : renderMarkdown(doc, { detail: f === 'compact' ? 'compact' : 'full' }));\n    }\n    case 'verify': {\n      const r = root();\n      const ids = rest[0] ? [rest[0]] : listMaps(r).map((m) => m.id);\n      let bad = false;\n      for (const id of ids) {\n        const v = verifyMap(r, id, { fix: opt.fix });\n        const state = v.broken ? 'BROKEN' : v.stale ? 'STALE' : 'OK';\n        out(`${state.padEnd(7)} ${v.id}  map@${v.mapCommit || '?'} head@${v.headCommit || '?'}${v.fixed ? '  (fixed)' : ''}`);\n        for (const c of v.changes) out(`        ${c.status.padEnd(10)} [${c.id}] ${c.from} -> ${c.to}${c.note ? '  ' + c.note : ''}`);\n        if (v.narrative.stale) {\n          const parts = [];\n          if (v.narrative.nodes.length) parts.push('nodes ' + v.narrative.nodes.map((n) => `[${n}]`).join(', '));\n          if (v.narrative.traces.length) parts.push('trace guides ' + v.narrative.traces.join(', '));\n          if (v.narrative.story) parts.push('story');\n          out(`        narrative  review ${parts.join('; ')} (code changed since written) → waymark refresh ${v.id}`);\n        }\n        if (v.broken || (opt.strict && v.stale && !v.fixed) || (opt['strict-narrative'] && v.narrative.stale)) bad = true;\n      }\n      if (bad) process.exitCode = 1;\n      return;\n    }\n    case 'render': {\n      const r = root();\n      const p = writeHtml(r, loadMap(r, rest[0]));\n      out(p);\n      if (opt.open) openFile(p);\n      return;\n    }\n    case 'delete':\n      return out(`deleted ${deleteMap(root(), rest[0])}`);\n    case 'suggest': {\n      const s = suggestTopics(root());\n      if (opt.json) return out(s);\n      s.suggestions.forEach((x, i) => out(`${i + 1}. ${x.topic}\\n   ${x.reason}`));\n      return;\n    }\n    case 'guide':\n      return out(waymarkGuide(rest.join(' ')));\n    case 'install':\n      return out(\n        install({\n          target: resolveRoot(opt.target || opt.root),\n          claude: !opt['no-claude'],\n          codex: !opt['no-codex'],\n          codexGlobal: !!(opt['codex-global'] || opt.global),\n          claudeGlobal: !!(opt['claude-global'] || opt.global),\n          vscode: !!opt.vscode,\n          prAction: !!opt['pr-action'],\n          skillDir: opt['skill-dir'] || null,\n          agentsMd: !opt['no-agents-md'],\n          hooks: !opt['no-hooks'],\n          useGlobalBin: !!opt['global-bin'],\n        }),\n      );\n    default:\n      throw new Error(`Unknown command \"${cmd}\". Run waymark --help`);\n  }\n}\n\nmain().catch((e) => {\n  console.error(`waymark: ${e.message}`);\n  process.exit(1);\n});\n","src/procedures.js":"// Agent procedures for fact-checking, parallel generation and overview maps.\n// (The base procedure — waymarkGuide — lives in guide.js.)\n\nconst STYLE_REMINDER =\n  'Prose is storytelling for a new teammate, in the language of the query; cite nodes as [1a]. Every anchored node must be a line you actually read (read-only exploration).';\n\n/** Skeptical verifier: checks every claim against the code and records verdicts. */\nexport function checkGuide(id) {\n  return `You are the **Waymark fact-checker** for map \\`${id}\\`. You did NOT write this map; your job is to find what is wrong with it.\n\nWork read-only. For each location (and then each trace guide and the story):\n\n1. Open the code around the anchor (the map below has snippets; read more of the file when needed).\n2. List the concrete claims in its \\`description\\` and \\`explanation\\`: what calls what, what data is passed or returned, conditions and branches, side effects, numbers, names, ordering, \"only/always/never\" statements.\n3. Verify each claim against the code you read. A claim about runtime behaviour you cannot see in code (performance, external services) is *unverifiable*.\n4. If a claim is **wrong**, fix the prose first with \\`waymark_annotate\\` (keep the style and language), then judge the corrected text.\n5. Record verdicts with \\`waymark_record_check\\`:\n   - \\`supported\\` — every claim is backed by code you read;\n   - \\`partial\\` — something is unverifiable or imprecise (say what in \\`issues\\`);\n   - \\`unsupported\\` — a claim is wrong and you could not fix it (say why).\n   Be strict: when unsure, use \\`partial\\`. Put each problem in \\`issues\\` as one short sentence (\"fixed: said X, code does Y\" for corrections).\n6. Check every trace's motivation/details and the story the same way (\\`traces\\` and \\`story\\` in \\`waymark_record_check\\`).\n\nFinish with a summary: how many nodes supported / partial / unsupported and the main corrections you made.`;\n}\n\n/** Phase 1 of parallel generation: plan the traces quickly, without deep exploration. */\nexport function planGuide(query, { mode = 'smart', kind = 'flow' } = {}) {\n  return `You are the **Waymark planner**. Plan a map for:\n\n> ${query}\n\nExplore just enough (entry points, main modules) to split the topic into ${mode === 'fast' ? '2-3' : '3-6'} **independent traces** that separate agents can build in parallel. Each trace is one coherent execution path or component relationship. Do NOT build the traces yourself.\n\nCall \\`waymark_plan\\` with: \\`query\\`, a \\`title\\`, the \\`language\\` of the query, \\`kind: \"${kind}\"\\`, and \\`traces\\`: for each one a \\`title\\`, a \\`focus\\` (2-4 sentences: what this trace must explain, where it starts and ends, what it must NOT cover because another trace does) and \\`hints\\` (entry files/symbols you found). Order the traces as the story unfolds. Then reply with the draft id.`;\n}\n\n/** Phase 2: build exactly one trace of a plan. */\nexport function traceGuide(draft, n, plan) {\n  const t = plan.traces.find((x) => x.n === Number(n));\n  const others = plan.traces.filter((x) => x.n !== Number(n)).map((x) => `${x.n}. ${x.title}`).join('; ');\n  return `You are a **Waymark trace builder**. Build ONLY trace ${n} of the plan for \"${plan.query}\" (draft \\`${draft}\\`).\n\n- Trace ${n}: **${t.title}** — ${t.focus}\n- Start from: ${(t.hints || []).join(', ') || '(find the entry point)'}\n- Other traces (built by other agents, do not cover them): ${others || 'none'}\n\nFollow the Waymark structure for a single trace: ordered \\`locations\\` (ids ${n}a, ${n}b, …; 4-12 nodes; exact \\`lineContent\\`), an annotated \\`tree\\` with label-only intermediate steps and \\`via\\` edge labels, a \\`diagramTitle\\`, a one-sentence \\`description\\`, \\`motivation\\` and \\`details\\` (narrative citing every node), and per location a one-line \\`description\\` and a 3-6 sentence storytelling \\`explanation\\`. ${STYLE_REMINDER} Language: ${plan.language || 'the language of the query'}.\n\nSubmit with \\`waymark_add_trace(draft: \"${draft}\", n: ${n}, trace)\\`. Fix unresolved anchors and resubmit until healthy. Reply with a 2-line summary of the trace.`;\n}\n\n/** Phase 3: merge, then write the map-level prose and the cross-trace links. */\nexport function finalizeGuide(draft) {\n  return `You are the **Waymark editor** for draft \\`${draft}\\`. Several agents built its traces in parallel.\n\n1. Call \\`waymark_draft(draft: \"${draft}\")\\` to read every finished trace (and which, if any, are missing).\n2. Write the map-level prose in the plan's language: \\`description\\` (2-3 sentences citing key nodes), a holistic \\`story\\` (the problem → the journey through the traces in order → how they connect → **Takeaways**), and \\`links\\` between traces (\\`{from, to, label}\\` with the data that flows), using only node ids that exist.\n3. Call \\`waymark_finalize(draft: \"${draft}\", description, story, links)\\`. Then run \\`waymark_lint\\` on the resulting map and fix any error with \\`waymark_annotate\\`.\n4. Reply with the map id and a 3-line summary.`;\n}\n\n/** Overview (\"map of maps\"): the system's architecture, linking to detailed maps. */\nexport function overviewGuide(query) {\n  return `You are the **Waymark agent** building an **overview map** (\"map of maps\")${query ? ` for: ${query}` : ' of this repository'}.\n\nPurpose: a newcomer opens this first. It shows the system's main parts and how a typical request/job flows between them; each part links to the detailed map that explains it.\n\n1. Call \\`waymark_list\\` to see existing maps (their titles/descriptions tell you what is already documented).\n2. Explore the repository structure: entry points, main modules/packages, boundaries (API, workers, storage, UI, CLI…).\n3. Traces = subsystems or layers (2-6). Nodes = the key entry point of each part (anchored lines you read: the router, the main service class, the queue consumer…). Keep each trace short (2-6 nodes).\n4. For every node covered by an existing detailed map, set \\`mapRef\\` to that map's id (or \"id#node\" for a specific node). Use \\`waymark_for_file\\` to find which maps cover a file.\n5. In the \\`story\\`, explain the architecture end to end and finish with a **\"Maps to create next\"** list for important parts that have no detailed map yet.\n6. Submit with \\`waymark_create\\` and \\`kind: \"overview\"\\`. ${STYLE_REMINDER}`;\n}\n","src/mcp.js":"#!/usr/bin/env node\nimport * as z from 'zod';\nimport { McpServer, ResourceTemplate } from '@modelcontextprotocol/sdk/server/mcp.js';\nimport { StdioServerTransport } from '@modelcontextprotocol/sdk/server/stdio.js';\nimport { MapInput } from './schema.js';\nimport { fileURLToPath } from 'node:url';\nimport { resolveRoot } from './git.js';\nimport { saveMap, loadMap, listMaps, writeHtml, deleteMap, annotateMap, narrativeGaps } from './store.js';\nimport { lintMap } from './lint.js';\nimport { noteMap, recordCheck } from './store.js';\nimport { diffMaps, renderDiff } from './diff.js';\nimport { applyCoverage, parseLcov, runWithV8Coverage } from './coverage.js';\nimport { createPlan, addTrace, draftStatus, draftTraces, finalizeDraft, listDrafts } from './parallel.js';\nimport { checkGuide, planGuide, traceGuide, finalizeGuide, overviewGuide } from './procedures.js';\nimport { TraceInput, LinkInput } from './schema.js';\nimport fsSync from 'node:fs';\nimport { mapsForFile, renderFileContext, forFileSummary } from './context.js';\nimport { verifyMap } from './verify.js';\nimport { findInFile } from './anchor.js';\nimport { suggestTopics } from './suggest.js';\nimport { waymarkGuide, enrichGuide, refreshGuide } from './guide.js';\nimport { renderMarkdown } from './render/markdown.js';\nimport { renderMermaid } from './render/mermaid.js';\nimport { openFile } from './open.js';\n\nconst VERSION = '0.3.0';\nconst rootArg = z.string().optional().describe('Repository root. Defaults to the server working directory / WAYMARK_ROOT');\n\nconst text = (t) => ({ content: [{ type: 'text', text: typeof t === 'string' ? t : JSON.stringify(t, null, 2) }] });\nconst fail = (e) => ({ isError: true, content: [{ type: 'text', text: String(e?.message || e) }] });\nconst safe = (fn) => async (args) => {\n  try {\n    return await fn(args);\n  } catch (e) {\n    return fail(e);\n  }\n};\n\n// Workspace announced by the client (MCP roots). Lets a globally installed server\n// (e.g. ~/.codex/config.toml used by Codex desktop) target the open project.\nlet clientRoot = null;\nconst rootOf = (root) => resolveRoot(root || process.env.WAYMARK_ROOT || clientRoot || undefined);\n\nexport function createServer() {\n  const server = new McpServer(\n    { name: 'waymark', version: VERSION },\n    {\n      instructions:\n        'Waymark: hierarchical, line-anchored, narrated maps of how code executes. To create one, call waymark_start(query) and follow the returned procedure, then waymark_create (or the parallel flow waymark_plan → waymark_add_trace × N → waymark_finalize). Fact-check with waymark_check. ' +\n        'To use an existing map as context, read resource waymark://\u003cid> or call waymark_get. Run waymark_verify before trusting an old map.',\n    },\n  );\n\n  server.registerTool(\n    'waymark_start',\n    {\n      title: 'Start a waymark',\n      description:\n        'Begin generating a waymark map for a topic/question. Returns the Waymark agent procedure (structure + storytelling rules), the input format, repo hints (recent files, entry points) and existing maps. Call this first, then explore the code and submit with waymark_create.',\n      inputSchema: {\n        query: z.string().describe('Topic or question, e.g. \"how does checkout payment work?\"'),\n        mode: z\n          .enum(['fast', 'smart', 'overview', 'parallel'])\n          .optional()\n          .describe('fast: short map quickly; smart (default): thorough map with full storytelling; overview: map of the whole system linking to detailed maps; parallel: plan traces for parallel builders'),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ query, mode, root }) => {\n      const r = rootOf(root);\n      const hints = suggestTopics(r, { limit: 5 });\n      const existing = listMaps(r).slice(0, 15).map(({ id, title, query: q, updatedAt }) => ({ id, title, query: q, updatedAt }));\n      return text(\n        `${mode === 'overview' ? overviewGuide(query) + '\\n\\n' + waymarkGuide(query, { mode: 'fast' }) : mode === 'parallel' ? planGuide(query) : waymarkGuide(query, { mode })}\\n## Repository\\n\\nroot: ${r}\\n\\n` +\n          `Entry points: ${hints.entryPoints.join(', ') || '(none detected)'}\\n\\n` +\n          (hints.viewedFiles.length ? `Recently viewed in the editor: ${hints.viewedFiles.map((f) => f.file).join(', ')}\\n\\n` : '') +\n          `Recently touched: ${hints.recentFiles.slice(0, 12).map((f) => f.file).join(', ') || '(none)'}\\n\\n` +\n          `Existing waymark (reuse/update instead of duplicating): ${existing.length ? JSON.stringify(existing) : 'none'}`,\n      );\n    }),\n  );\n\n  server.registerTool(\n    'waymark_suggest_topics',\n    {\n      title: 'Suggest waymark topics',\n      description: 'Suggests waymark topics from recent work (uncommitted and recently committed files, commit subjects) and detected entry points.',\n      inputSchema: { root: rootArg, limit: z.number().int().min(1).max(20).optional() },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ root, limit }) => text(suggestTopics(rootOf(root), { limit }))),\n  );\n\n  server.registerTool(\n    'waymark_find_anchor',\n    {\n      title: 'Find anchor lines',\n      description: 'Returns line numbers and exact line text in a file matching a literal string or regex. Use it to get precise lineNumber/lineContent for locations.',\n      inputSchema: {\n        path: z.string().describe('File path relative to repo root'),\n        pattern: z.string(),\n        regex: z.boolean().optional(),\n        limit: z.number().int().min(1).max(100).optional(),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ path, pattern, regex, limit, root }) => text(findInFile(rootOf(root), path, pattern, { regex, limit }))),\n  );\n\n  server.registerTool(\n    'waymark_create',\n    {\n      title: 'Create or update a waymark',\n      description:\n        'Validates a waymark, verifies every location against the working tree (auto-correcting shifted line numbers), stores it under .waymark/ and writes a shareable HTML viewer. Pass `id` to overwrite an existing map. Returns an anchor report: fix any unresolved/missing locations and resubmit.',\n      inputSchema: {\n        ...MapInput.shape,\n        id: z.string().optional().describe('Existing waymark id to overwrite'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...map }) => {\n      const r = rootOf(root);\n      const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });\n      server.sendResourceListChanged();\n      const next = [];\n      if (!report.healthy) {\n        next.push('Some locations could not be verified. Fix them (waymark_find_anchor helps) and call waymark_create again with id=\"' + doc.id + '\".');\n      }\n      if (!narrative.complete) {\n        next.push('Narrative is incomplete (see \"narrative\"). Fill the story, trace motivation/details and per-location explanations with waymark_annotate(id=\"' + doc.id + '\").');\n      }\n      const lint = lintMap(doc, { mapIds: new Set(listMaps(r).map((m) => m.id)) });\n      if (lint.errors) next.push('Lint found ' + lint.errors + ' error(s) (e.g. references to unknown nodes): fix them with waymark_annotate.');\n      if (!next.length) next.push('All anchors verified and narrative complete. Share the HTML file or reference waymark://' + doc.id);\n      return text({\n        id: doc.id,\n        resource: `waymark://${doc.id}`,\n        html: htmlPath,\n        json: jsonPath,\n        anchors: report,\n        narrative,\n        lint: { errors: lint.errors, warnings: lint.warnings, issues: lint.issues.slice(0, 15) },\n        next,\n      });\n    }),\n  );\n\n  const prose = () => z.string().optional();\n  server.registerTool(\n    'waymark_annotate',\n    {\n      title: 'Annotate a waymark (narrative)',\n      description:\n        'Adds or rewrites the prose of an existing map without re-sending or re-anchoring it: map story/description/title, trace motivation/details/description/diagramTitle, location explanation/description/title. Only the fields you pass change. Regenerates the HTML viewer and returns which narrative fields are still missing.',\n      inputSchema: {\n        id: z.string().describe('Map id (a unique prefix is enough)'),\n        title: prose(),\n        description: prose().describe('Map summary citing nodes as [1a]'),\n        story: prose().describe('Holistic storytelling narrative (markdown)'),\n        language: prose(),\n        traces: z\n          .array(\n            z.object({\n              id: z.string(),\n              title: prose(),\n              description: prose(),\n              diagramTitle: prose(),\n              motivation: prose().describe('Why this part exists (markdown)'),\n              details: prose().describe('Narrative walkthrough citing nodes (markdown)'),\n            }),\n          )\n          .optional(),\n        locations: z\n          .array(\n            z.object({\n              id: z.string(),\n              title: prose(),\n              description: prose().describe('One sentence \u003c= 15 words'),\n              explanation: prose().describe('Storytelling explanation, 3-6 sentences (markdown)'),\n            }),\n          )\n          .optional(),\n        links: z.array(LinkInput).optional().describe('Replaces the whole list of cross-trace links (fix labels or ends)'),\n        reviewed: z\n          .array(z.string())\n          .optional()\n          .describe('Prose confirmed still accurate after a code change: node ids (\"2b\"), \"trace:\u003cid>\" or \"story\"'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...patch }) => text(annotateMap(rootOf(root), id, patch))),\n  );\n\n  server.registerTool(\n    'waymark_enrich',\n    {\n      title: 'Enrich a waymark with storytelling',\n      description:\n        'Returns the procedure to upgrade an existing map with full storytelling (holistic story, Motivation/Details guides per trace, an explanation per location), the list of missing narrative and the map itself. Follow it and save with waymark_annotate.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const doc = loadMap(rootOf(root), id);\n      return text(\n        enrichGuide(doc.id) +\n          '\\n\\n## Missing narrative\\n\\n' +\n          JSON.stringify(narrativeGaps(doc)) +\n          '\\n\\n## Current map\\n\\n' +\n          renderMarkdown(doc, { detail: 'full' }),\n      );\n    }),\n  );\n\n  server.registerTool(\n    'waymark_list',\n    {\n      title: 'List waymark',\n      description: 'Lists waymark stored in the repository (.waymark/).',\n      inputSchema: { root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ root }) => text(listMaps(rootOf(root)))),\n  );\n\n  server.registerTool(\n    'waymark_get',\n    {\n      title: 'Get a waymark',\n      description:\n        'Returns a map for use as context. format: \"markdown\" (narrative + structure + snippets, default), \"compact\" (structure + one-line descriptions), \"json\", \"mermaid\". Pass trace (\"2\") or node (\"2b\") to get only that part — much smaller context.',\n      inputSchema: {\n        id: z.string().describe('Map id (a unique prefix is enough)'),\n        format: z.enum(['markdown', 'compact', 'json', 'mermaid']).optional(),\n        trace: z.string().optional().describe('Only this trace, e.g. \"2\"'),\n        node: z.string().optional().describe('Only this node with its trace context, e.g. \"2b\"'),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, format = 'markdown', trace, node, root }) => {\n      const doc = loadMap(rootOf(root), id);\n      if (format === 'json') return text(doc);\n      if (format === 'mermaid') return text(renderMermaid(doc));\n      return text(renderMarkdown(doc, { detail: format === 'compact' ? 'compact' : 'full', trace, node }));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_for_file',\n    {\n      title: 'Maps covering a file',\n      description:\n        'Lists the maps, traces and nodes that cover a file (optionally the node nearest to a line), with their one-line descriptions, the explanation of the nearest node and a flag when the code changed since a node was explained. Call it before modifying a file to understand the flow it belongs to.',\n      inputSchema: {\n        path: z.string().describe('File path (absolute or relative to the repo root)'),\n        line: z.number().int().positive().optional(),\n        format: z.enum(['markdown', 'json']).optional(),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ path: file, line, format = 'markdown', root }) => {\n      const res = mapsForFile(rootOf(root), file, { line });\n      if (format === 'json') return text(forFileSummary(res));\n      return text(renderFileContext(res, { maxChars: 12000 }) || `No waymark map covers ${res.path}.`);\n    }),\n  );\n\n  server.registerTool(\n    'waymark_lint',\n    {\n      title: 'Lint maps',\n      description:\n        'Static quality checks on maps: references to unknown nodes (errors), missing narrative, nodes not cited in their trace details, nodes missing from the tree, over-long titles/descriptions, very short explanations. Omit id to lint all maps.',\n      inputSchema: { id: z.string().optional(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const r = rootOf(root);\n      const ids = id ? [loadMap(r, id).id] : listMaps(r).map((m) => m.id);\n      const mapIds = new Set(listMaps(r).map((m) => m.id));\n      return text(ids.map((i) => lintMap(loadMap(r, i), { mapIds })));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_refresh',\n    {\n      title: 'Refresh outdated narrative',\n      description:\n        'Finds prose whose code changed since it was written (narrative drift: nodes, trace guides, story) and returns the procedure to bring it back in sync with waymark_annotate (or mark it reviewed). Use after code changes in areas covered by a map.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const r = rootOf(root);\n      const v = verifyMap(r, id);\n      const doc = loadMap(r, v.id);\n      if (!v.narrative.stale && !v.broken) return text(`Map ${v.id}: narrative is in sync with the code. Nothing to refresh.`);\n      const brokenIds = v.changes.filter((c) => c.status === 'unresolved' || c.status === 'missing').map((c) => c.id);\n      const nodes = [...new Set([...brokenIds, ...v.narrative.nodes])].map((n) => renderMarkdown(doc, { node: n })).join('\\n\\n---\\n\\n');\n      return text(\n        refreshGuide(v.id, v.narrative, brokenIds) +\n          (nodes ? '\\n\\n## Stale nodes (stored prose + last snippet)\\n\\n' + nodes : ''),\n      );\n    }),\n  );\n\n  // ---------------- fact-checking\n  server.registerTool(\n    'waymark_check',\n    {\n      title: 'Fact-check a map',\n      description:\n        'Returns the fact-checking procedure for a map plus the full map (prose + code snippets). A skeptical verifier checks every claim against the code, fixes wrong prose with waymark_annotate and records verdicts with waymark_record_check. Best run by a fresh agent/subagent that did not write the map.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const doc = loadMap(rootOf(root), id);\n      return text(checkGuide(doc.id) + '\\n\\n## Map to check\\n\\n' + renderMarkdown(doc, { detail: 'full' }));\n    }),\n  );\n\n  const verdict = z.enum(['supported', 'partial', 'unsupported']);\n  server.registerTool(\n    'waymark_record_check',\n    {\n      title: 'Record fact-check verdicts',\n      description:\n        'Stores fact-check verdicts. A verdict stays valid while the node\\'s code block and prose are unchanged; it becomes \"stale\" otherwise. unsupported verdicts are lint errors.',\n      inputSchema: {\n        id: z.string(),\n        nodes: z.array(z.object({ id: z.string(), verdict, issues: z.array(z.string()).optional() })).optional(),\n        traces: z.array(z.object({ id: z.string(), verdict, issues: z.array(z.string()).optional() })).optional(),\n        story: z.object({ verdict, issues: z.array(z.string()).optional() }).optional(),\n        checker: z.string().optional().describe('Who checked (model/agent name)'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...v }) => text(recordCheck(rootOf(root), id, v))),\n  );\n\n  // ---------------- human notes\n  server.registerTool(\n    'waymark_note',\n    {\n      title: 'Add or remove a human note',\n      description:\n        'Adds a human note to a node (team knowledge: gotchas, decisions, links). Notes are never rewritten by agents and survive map regeneration. Use only when the user asks to record something. remove=\u003cindex> deletes one.',\n      inputSchema: {\n        id: z.string(),\n        node: z.string(),\n        text: z.string().optional(),\n        author: z.string().optional(),\n        remove: z.number().int().min(0).optional(),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, node, text: t, author, remove, root }) => text(noteMap(rootOf(root), id, node, { text: t, author, remove }))),\n  );\n\n  // ---------------- change impact (PRs)\n  server.registerTool(\n    'waymark_diff',\n    {\n      title: 'Impact of changes on the maps',\n      description:\n        'Which map nodes a change set touches (their code blocks intersect changed lines), which anchors it breaks and which prose it leaves outdated. base \"HEAD\" (default) = uncommitted changes; with range=true compares base...HEAD (a branch or PR).',\n      inputSchema: {\n        base: z.string().optional(),\n        range: z.boolean().optional(),\n        format: z.enum(['markdown', 'json']).optional(),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ base = 'HEAD', range = false, format = 'markdown', root }) => {\n      const rep = diffMaps(rootOf(root), base, { range });\n      return text(format === 'json' ? rep : renderDiff(rep));\n    }),\n  );\n\n  // ---------------- verification by execution\n  server.registerTool(\n    'waymark_exec',\n    {\n      title: 'Mark nodes executed by tests',\n      description:\n        'Marks which nodes actually ran, from coverage: pass lcov (path to an lcov.info from any language) or command (a test command run with NODE_V8_COVERAGE, Node/JS only). Results show as ▶ in viewers and in context.',\n      inputSchema: {\n        id: z.string().optional().describe('Map id; omit for all maps'),\n        lcov: z.string().optional(),\n        command: z.string().optional().describe('e.g. \"npm test\"'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, lcov, command, root }) => {\n      const r = rootOf(root);\n      let coverage;\n      let source;\n      if (lcov) {\n        coverage = parseLcov(fsSync.readFileSync(lcov, 'utf8'), r);\n        source = 'lcov';\n      } else if (command) {\n        const parts = command.split(' ');\n        const res = runWithV8Coverage(r, parts[0], parts.slice(1));\n        coverage = res.coverage;\
