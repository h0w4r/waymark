n        source = 'v8';\n      } else throw new Error('Pass lcov or command');\n      return text(applyCoverage(r, coverage, { ids: id ? [id] : null, source, command: command || lcov }));\n    }),\n  );\n\n  // ---------------- parallel generation\n  server.registerTool(\n    'waymark_plan',\n    {\n      title: 'Plan a map for parallel builders',\n      description:\n        'Phase 1 of parallel generation: registers the traces to build (title, focus, hints) and returns a draft id plus one ready-to-use builder prompt per trace. Launch one builder (subagent) per trace in parallel; each submits with waymark_add_trace; then waymark_finalize.',\n      inputSchema: {\n        query: z.string(),\n        title: z.string(),\n        language: z.string().optional(),\n        kind: z.enum(['flow', 'overview']).optional(),\n        traces: z.array(z.object({ title: z.string(), focus: z.string(), hints: z.array(z.string()).optional() })).min(1),\n        root: rootArg,\n      },\n    },\n    safe(async ({ root, ...p }) => {\n      const r = rootOf(root);\n      const plan = createPlan(r, p);\n      return text({\n        draft: plan.draft,\n        traces: plan.traces.map((t) => ({ n: t.n, title: t.title, builderPrompt: traceGuide(plan.draft, t.n, plan) })),\n        next: 'Run one builder per trace in parallel (e.g. one waymark subagent each, all in the same message), then call waymark_finalize after reading waymark_draft.',\n      });\n    }),\n  );\n\n  server.registerTool(\n    'waymark_add_trace',\n    {\n      title: 'Submit one trace of a draft',\n      description: 'Phase 2: validates, renumbers (ids \u003cn>a, \u003cn>b…) and anchors ONE trace of a planned draft. Safe to call from parallel builders.',\n      inputSchema: { draft: z.string(), n: z.number().int().positive(), trace: TraceInput, root: rootArg },\n    },\n    safe(async ({ draft, n, trace, root }) => text(addTrace(rootOf(root), draft, n, trace))),\n  );\n\n  server.registerTool(\n    'waymark_draft',\n    {\n      title: 'Read a draft',\n      description: 'Status of a draft (finished/missing traces) and the finished traces as markdown, for the finalize step. Omit draft to list drafts.',\n      inputSchema: { draft: z.string().optional(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ draft, root }) => {\n      const r = rootOf(root);\n      if (!draft) return text(listDrafts(r).map(({ plan, ...d }) => d));\n      const st = draftStatus(r, draft);\n      const traces = draftTraces(r, draft);\n      const md = traces.length\n        ? renderMarkdown({ id: draft, title: st.title, description: '', traces }, { detail: 'compact' })\n        : '(no finished traces yet)';\n      const { plan, ...rest } = st;\n      return text(JSON.stringify(rest, null, 2) + '\\n\\n' + md);\n    }),\n  );\n\n  server.registerTool(\n    'waymark_finalize',\n    {\n      title: 'Finalize a parallel draft',\n      description: 'Phase 3: merges the finished traces into a regular map with the map-level description, story and cross-trace links, then removes the draft.',\n      inputSchema: {\n        draft: z.string(),\n        title: z.string().optional(),\n        description: z.string(),\n        story: z.string().optional(),\n        language: z.string().optional(),\n        links: z.array(LinkInput).optional(),\n        id: z.string().optional(),\n        root: rootArg,\n      },\n    },\n    safe(async ({ draft, root, ...rest }) => {\n      const r = rootOf(root);\n      const { doc, report, narrative, htmlPath } = finalizeDraft(r, draft, rest);\n      server.sendResourceListChanged();\n      return text({ id: doc.id, html: htmlPath, anchors: report, narrative, lint: lintMap(doc, { mapIds: new Set(listMaps(r).map((m) => m.id)) }) });\n    }),\n  );\n\n  server.registerTool(\n    'waymark_verify',\n    {\n      title: 'Verify waymark anchors',\n      description:\n        'Re-checks waymark locations against the current code: detects moved lines, renamed files and removed code. With fix=true, writes corrected anchors back. Omit id to verify all maps.',\n      inputSchema: { id: z.string().optional(), fix: z.boolean().optional(), root: rootArg },\n    },\n    safe(async ({ id, fix, root }) => {\n      const r = rootOf(root);\n      const ids = id ? [id] : listMaps(r).map((m) => m.id);\n      return text(ids.map((i) => verifyMap(r, i, { fix })));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_render',\n    {\n      title: 'Render waymark viewer',\n      description: 'Regenerates the self-contained HTML viewer of a waymark and optionally opens it in the default browser.',\n      inputSchema: { id: z.string(), open: z.boolean().optional(), root: rootArg },\n    },\n    safe(async ({ id, open, root }) => {\n      const r = rootOf(root);\n      const p = writeHtml(r, loadMap(r, id));\n      if (open) openFile(p);\n      return text({ html: p });\n    }),\n  );\n\n  server.registerTool(\n    'waymark_delete',\n    {\n      title: 'Delete a waymark',\n      description: 'Deletes a waymark (JSON and HTML) from .waymark/. Only use when the user asks.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { destructiveHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const removed = deleteMap(rootOf(root), id);\n      server.sendResourceListChanged();\n      return text({ deleted: removed });\n    }),\n  );\n\n  // @-mentionable context: waymark://\u003cid>\n  server.registerResource(\n    'waymark',\n    new ResourceTemplate('waymark://{id}', {\n      list: async () => ({\n        resources: listMaps(rootOf()).map((m) => ({\n          uri: `waymark://${m.id}`,\n          name: m.title,\n          description: m.description,\n          mimeType: 'text/markdown',\n        })),\n      }),\n      complete: { id: (v) => listMaps(rootOf()).map((m) => m.id).filter((i) => i.startsWith(v)) },\n    }),\n    { title: 'Waymark', description: 'A waymark rendered as markdown context', mimeType: 'text/markdown' },\n    async (uri, { id }) => ({\n      contents: [{ uri: uri.href, mimeType: 'text/markdown', text: renderMarkdown(loadMap(rootOf(), String(id))) }],\n    }),\n  );\n\n  // @-mention a single trace or node: waymark://\u003cid>/\u003ctrace> or waymark://\u003cid>/\u003cnode>\n  server.registerResource(\n    'waymark-part',\n    new ResourceTemplate('waymark://{id}/{part}', {\n      list: async () => ({\n        resources: listMaps(rootOf()).flatMap((m) => {\n          try {\n            return loadMap(rootOf(), m.id).traces.map((t) => ({\n              uri: `waymark://${m.id}/${t.id}`,\n              name: `${m.title} › ${t.id}. ${t.title}`,\n              description: t.description,\n              mimeType: 'text/markdown',\n            }));\n          } catch {\n            return [];\n          }\n        }),\n      }),\n    }),\n    { title: 'Waymark trace or node', description: 'One trace (\"2\") or one node (\"2b\") of a map, as markdown context', mimeType: 'text/markdown' },\n    async (uri, { id, part }) => {\n      const doc = loadMap(rootOf(), String(id));\n      const isTrace = doc.traces.some((t) => t.id === String(part));\n      const md = renderMarkdown(doc, isTrace ? { trace: String(part) } : { node: String(part) });\n      return { contents: [{ uri: uri.href, mimeType: 'text/markdown', text: md }] };\n    },\n  );\n\n  server.registerPrompt(\n    'create_waymark',\n    {\n      title: 'Create a waymark',\n      description: 'Generate a hierarchical waymark of how the code works for a topic',\n      argsSchema: { query: z.string().describe('Topic or question') },\n    },\n    ({ query }) => ({ messages: [{ role: 'user', content: { type: 'text', text: waymarkGuide(query) } }] }),\n  );\n\n  server.server.oninitialized = async () => {\n    if (!server.server.getClientCapabilities()?.roots) return;\n    try {\n      const { roots } = await server.server.listRoots();\n      const first = roots.find((x) => x.uri.startsWith('file://'));\n      if (first) clientRoot = fileURLToPath(first.uri);\n    } catch {\n      /* client advertised roots but failed to list them: fall back to cwd */\n    }\n  };\n\n  return server;\n}\n\nexport async function startStdio() {\n  const server = createServer();\n  await server.connect(new StdioServerTransport());\n}\n\nif (import.meta.url === `file://${process.argv[1]}` || process.argv[1]?.endsWith('mcp.js')) {\n  startStdio().catch((e) => {\n    console.error(e);\n    process.exit(1);\n  });\n}\n","src/render/markdown.js":"import { renderMermaid } from './mermaid.js';\nimport { checkState, execState } from '../state.js';\n\n/** ASCII call tree, e.g. \"├── [1a] handleLogin  auth/login.ts:42\". */\nexport function renderTextTree(trace) {\n  const byId = new Map(trace.locations.map((l) => [l.id, l]));\n  const lines = [];\n  const walk = (nodes, prefix) => {\n    (nodes || []).forEach((n, i) => {\n      const last = i === nodes.length - 1;\n      const loc = n.ref ? byId.get(n.ref) : null;\n      const text = loc\n        ? `[${loc.id}] ${n.label || loc.title}  ${loc.path}:${loc.lineNumber}`\n        : n.label || '(group)';\n      lines.push(`${prefix}${last ? '└── ' : '├── '}${n.via ? `(${n.via}) ` : ''}${text}`);\n      walk(n.children, prefix + (last ? '    ' : '│   '));\n    });\n  };\n  walk(trace.tree, '');\n  return lines.join('\\n');\n}\n\nconst STATUS_MARK = { ok: '', moved: '', relocated: '', fuzzy: ' (~approx)', unresolved: ' (!unverified)', missing: ' (!missing)' };\n\nfunction header(doc, o) {\n  const m = doc.meta || {};\n  o.push(`# Waymark: ${doc.title}`, '', doc.description, '');\n  o.push(\n    `_id: \\`${doc.id}\\`${m.commit ? ` · commit ${m.commit.slice(0, 8)}` : ''}${m.branch ? ` (${m.branch})` : ''}` +\n      `${m.updatedAt ? ` · updated ${m.updatedAt.slice(0, 10)}` : ''}${doc.query ? ` · query: \"${doc.query}\"` : ''}_`,\n  );\n}\n\nfunction renderLoc(loc, o, full, stale) {\n  o.push(\n    `- **[${loc.id}] ${loc.title}** — \\`${loc.path}:${loc.lineNumber}\\`${loc.symbol ? ` (\\`${loc.symbol}\\`)` : ''}${STATUS_MARK[loc.status] || ''}` +\n      `${stale ? ' (⚠ code changed since this was explained)' : ''}`,\n  );\n  o.push(`  ${loc.description}`);\n  const flags = [];\n  const cs = checkState(loc);\n  if (cs === 'supported') flags.push('✓ fact-checked');\n  else if (cs === 'partial') flags.push(`◑ partially verified: ${(loc.check.issues || []).join('; ')}`);\n  else if (cs === 'unsupported') flags.push(`✗ fact-check failed: ${(loc.check.issues || []).join('; ')}`);\n  const es = execState(loc);\n  if (es === 'hit') flags.push(`▶ executed by the tests (${loc.exec.count}×)`);\n  else if (es === 'miss') flags.push('○ not executed by the tests');\n  if (loc.mapRef) flags.push(`→ detailed map: waymark://${loc.mapRef.replace('#', '/')}`);\n  if (flags.length) o.push(`  _${flags.join(' · ')}_`);\n  if (full && loc.explanation) o.push(`  ${loc.explanation.replace(/\\n/g, '\\n  ')}`);\n  for (const n of loc.notes || []) o.push(`  > 📝 Team note (${n.author}, ${String(n.at).slice(0, 10)}): ${n.text}`);\n  if (full && loc.snippet?.code) {\n    const numbered = loc.snippet.code\n      .split('\\n')\n      .map((l, i) => {\n        const n = loc.snippet.startLine + i;\n        return `${n === loc.lineNumber ? '>' : ' '}${String(n).padStart(5)}  ${l}`;\n      })\n      .join('\\n');\n    o.push('  ```', numbered.replace(/^/gm, '  '), '  ```');\n  } else if (loc.lineContent) {\n    o.push(`  \\`${loc.lineContent}\\``);\n  }\n}\n\nfunction renderTrace(trace, o, full, staleNodes) {\n  o.push('', `## Trace ${trace.id}: ${trace.title}`, '', trace.description);\n  if (full && trace.motivation) o.push('', '### Motivation', '', trace.motivation);\n  if (full && (trace.details || trace.guide)) o.push('', '### Details', '', trace.details || trace.guide);\n  o.push('', `### ${trace.diagramTitle || 'Tree'}`, '', '```text', renderTextTree(trace), '```', '');\n  for (const loc of trace.locations) renderLoc(loc, o, full, staleNodes.has(loc.id));\n}\n\n/** Parent and children of a location inside its trace tree (first occurrence). */\nfunction neighbours(trace, id) {\n  let found = null;\n  const walk = (nodes, parent) => {\n    for (const n of nodes || []) {\n      if (found) return;\n      if (n.ref === id) {\n        found = { parent, children: n.children || [] };\n        return;\n      }\n      walk(n.children, n);\n    }\n  };\n  walk(trace.tree, null);\n  return found || { parent: null, children: [] };\n}\n\n/**\n * Context-oriented rendering for agents (what an @-mention injects).\n * detail: \"full\" includes the narrative (story, guides, explanations) and snippets;\n * \"compact\" keeps only structure, one-line descriptions and anchors.\n * trace / node: render only that trace, or one node with its trace context.\n */\nexport function renderMarkdown(doc, { detail = 'full', diagram = false, trace: traceId = null, node: nodeId = null } = {}) {\n  const o = [];\n  const full = detail === 'full';\n  const staleNodes = new Set(doc.meta?.narrativeDrift?.nodes || []);\n  header(doc, o);\n\n  if (nodeId) {\n    const trace = doc.traces.find((t) => t.locations.some((l) => l.id === nodeId));\n    if (!trace) throw new Error(`Node \"${nodeId}\" not found in ${doc.id}`);\n    const loc = trace.locations.find((l) => l.id === nodeId);\n    const byId = new Map(trace.locations.map((l) => [l.id, l]));\n    const label = (n) => (n.ref && byId.get(n.ref) ? `[${n.ref}] ${byId.get(n.ref).title}` : n.label || '(group)');\n    o.push('', `## Trace ${trace.id}: ${trace.title}`, '', trace.description);\n    if (full && trace.motivation) o.push('', '### Motivation', '', trace.motivation);\n    o.push('', `## Node [${loc.id}]`, '');\n    renderLoc(loc, o, true, staleNodes.has(loc.id));\n    const nb = neighbours(trace, nodeId);\n    if (nb.parent) o.push('', `Called from / part of: ${label(nb.parent)}`);\n    if (nb.children.length) o.push(`Next steps: ${nb.children.map((c) => `${c.via ? `(${c.via}) ` : ''}${label(c)}`).join('; ')}`);\n    const links = (doc.links || []).filter((l) => l.from === nodeId || l.to === nodeId);\n    for (const l of links) o.push(`Link: [${l.from}] → [${l.to}]${l.label ? ` (${l.label})` : ''}`);\n    return o.join('\\n');\n  }\n\n  if (traceId) {\n    const trace = doc.traces.find((t) => t.id === String(traceId));\n    if (!trace) throw new Error(`Trace \"${traceId}\" not found in ${doc.id}`);\n    renderTrace(trace, o, full, staleNodes);\n    const ids = new Set(trace.locations.map((l) => l.id));\n    const links = (doc.links || []).filter((l) => ids.has(l.from) || ids.has(l.to));\n    if (links.length) {\n      o.push('', '## Links to other traces', '');\n      for (const l of links) o.push(`- [${l.from}] → [${l.to}]${l.label ? `: ${l.label}` : ''}`);\n    }\n    return o.join('\\n');\n  }\n\n  if (full && doc.story) o.push('', '## The story', '', doc.story);\n  for (const trace of doc.traces) renderTrace(trace, o, full, staleNodes);\n  if (doc.links?.length) {\n    o.push('', '## Cross-trace links', '');\n    for (const l of doc.links) o.push(`- [${l.from}] → [${l.to}]${l.label ? `: ${l.label}` : ''}`);\n  }\n  if (diagram) o.push('', '## Diagram', '', '```mermaid', renderMermaid(doc), '```');\n  return o.join('\\n');\n}\n","src/store.js":"import fs from 'node:fs';\nimport path from 'node:path';\nimport crypto from 'node:crypto';\nimport { normalizeMap, Title } from './schema.js';\nimport { anchorMap, safeJoin, FileCache, contextHash, traceHash } from './anchor.js';\nimport { headCommit, currentBranch, remoteWebUrl } from './git.js';\nimport { renderHtml, renderIndex } from './render/html.js';\nimport { execFileSync } from 'node:child_process';\nimport { proseHash, checkState } from './state.js';\nexport { proseHash, checkState };\n\nexport const SCHEMA_VERSION = 1;\n\nexport function mapDir(root) {\n  return path.join(root, process.env.WAYMARK_DIR || '.waymark');\n}\n\nconst slugify = (s) =>\n  s\n    .normalize('NFKD')\n    .replace(/[̀-ͯ]/g, '')\n    .toLowerCase()\n    .replace(/[^a-z0-9]+/g, '-')\n    .replace(/^-|-$/g, '')\n    .slice(0, 48) || 'waymark';\n\nconst validId = (id) => /^[a-z0-9][a-z0-9-]{0,80}$/.test(id);\n\nfunction filePath(root, id, ext = 'json') {\n  if (!validId(id)) throw new Error(`Invalid waymark id \"${id}\"`);\n  return path.join(mapDir(root), `${id}.${ext}`);\n}\n\n/** Validates, anchors against the working tree, persists JSON (+ HTML viewer). */\nexport function saveMap(root, input, { id, html = true } = {}) {\n  const map = normalizeMap(input);\n  const report = anchorMap(root, map);\n  baselineNarrative(map, { force: true });\n  const existing = id ? loadMap(root, id, { quiet: true }) : null;\n  if (existing) carryOver(existing, map);\n  const now = new Date().toISOString();\n  const doc = {\n    schemaVersion: SCHEMA_VERSION,\n    id: id || `${slugify(map.title)}-${crypto.randomBytes(3).toString('hex')}`,\n    ...map,\n    meta: {\n      createdAt: existing?.meta?.createdAt || now,\n      updatedAt: now,\n      root,\n      commit: headCommit(root),\n      branch: currentBranch(root),\n      remote: remoteWebUrl(root),\n      anchors: { ...report, issues: undefined },\n    },\n  };\n  fs.mkdirSync(mapDir(root), { recursive: true });\n  fs.writeFileSync(filePath(root, doc.id), JSON.stringify(doc, null, 2));\n  const htmlPath = html ? writeHtml(root, doc) : null;\n  return { doc, report, narrative: narrativeGaps(doc), jsonPath: filePath(root, doc.id), htmlPath };\n}\n\nexport function writeHtml(root, doc) {\n  const p = filePath(root, doc.id, 'html');\n  fs.writeFileSync(p, renderHtml(doc, { files: collectFiles(root, doc), maps: mapIndex(root, doc.id) }));\n  writeIndex(root);\n  return p;\n}\n\n/** Light index of the other maps (for mapRef links between maps). */\nfunction mapIndex(root, selfId) {\n  return listMaps(root)\n    .filter((m) => m.id !== selfId)\n    .map((m) => ({ id: m.id, title: m.title, kind: m.kind }));\n}\n\n/** .waymark/index.html: every map with its health, linking to each viewer. */\nexport function writeIndex(root) {\n  const maps = listMaps(root);\n  if (!maps.length) return null;\n  const p = path.join(mapDir(root), 'index.html');\n  fs.writeFileSync(p, renderIndex(maps, { root }));\n  return p;\n}\n\n/**\n * Human notes always survive re-creation (matched by node id); fact-check verdicts and\n * execution results survive only while the node's code block is unchanged.\n */\nfunction carryOver(prev, next) {\n  const old = new Map(prev.traces.flatMap((t) => t.locations).map((l) => [l.id, l]));\n  for (const t of next.traces) {\n    const pt = prev.traces.find((x) => x.id === t.id);\n    if (pt?.check && pt.check.hash === traceHash(t)) t.check = pt.check;\n    for (const l of t.locations) {\n      const o = old.get(l.id);\n      if (!o) continue;\n      if (o.notes?.length) l.notes = o.notes;\n      if (o.check && o.check.ctxHash === l.ctxHash && o.check.proseHash === proseHash(l)) l.check = o.check;\n      if (o.exec && o.exec.ctxHash === l.ctxHash) l.exec = o.exec;\n    }\n  }\n}\n\n\n/** Adds (or removes, with remove=index) a human note on a node. Not AI prose: never rewritten by agents. */\nexport function noteMap(root, id, nodeId, { text = '', author = '', remove = null } = {}) {\n  const doc = loadMap(root, id);\n  const l = doc.traces.flatMap((t) => t.locations).find((x) => x.id === nodeId);\n  if (!l) throw new Error(`Node \"${nodeId}\" not found in ${doc.id}`);\n  l.notes = l.notes || [];\n  if (remove != null) {\n    if (!l.notes[remove]) throw new Error(`Note #${remove} not found on [${nodeId}]`);\n    l.notes.splice(remove, 1);\n  } else {\n    if (!String(text).trim()) throw new Error('Empty note');\n    l.notes.push({ text: String(text).trim(), author: author || gitUser(root) || 'unknown', at: new Date().toISOString(), ctxHash: l.ctxHash });\n  }\n  if (!l.notes.length) delete l.notes;\n  doc.meta = { ...doc.meta, updatedAt: new Date().toISOString() };\n  persist(root, doc);\n  writeHtml(root, doc);\n  return { id: doc.id, node: nodeId, notes: l.notes || [] };\n}\n\nfunction gitUser(root) {\n  try {\n    return execFileSync('git', ['config', 'user.name'], { cwd: root, encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }).trim();\n  } catch {\n    return '';\n  }\n}\n\nconst VERDICTS = new Set(['supported', 'partial', 'unsupported']);\n\n/**\n * Records fact-check verdicts (from a verifier agent). A verdict is tied to the code block and\n * the prose it judged: editing either makes it \"stale\" (shown as unchecked).\n */\nexport function recordCheck(root, id, { nodes = [], traces = [], story = null, checker = '' } = {}) {\n  const doc = loadMap(root, id);\n  refreshContextHashes(root, doc);\n  const at = new Date().toISOString();\n  const unknown = [];\n  const byId = new Map(doc.traces.flatMap((t) => t.locations).map((l) => [l.id, l]));\n  for (const v of nodes) {\n    const l = byId.get(v.id);\n    if (!l || !VERDICTS.has(v.verdict)) {\n      unknown.push(v.id);\n      continue;\n    }\n    l.check = { verdict: v.verdict, issues: v.issues || [], at, checker, ctxHash: l.ctxHash, proseHash: proseHash(l) };\n  }\n  for (const v of traces) {\n    const t = doc.traces.find((x) => x.id === String(v.id));\n    if (!t || !VERDICTS.has(v.verdict)) {\n      unknown.push(`trace ${v.id}`);\n      continue;\n    }\n    t.check = { verdict: v.verdict, issues: v.issues || [], at, checker, hash: traceHash(t) };\n  }\n  if (story && VERDICTS.has(story.verdict)) doc.storyCheck = { verdict: story.verdict, issues: story.issues || [], at, checker };\n  doc.meta = { ...doc.meta, updatedAt: at, check: checkSummary(doc) };\n  persist(root, doc);\n  writeHtml(root, doc);\n  return { id: doc.id, unknown, summary: doc.meta.check };\n}\n\nexport function checkSummary(doc) {\n  const out = { supported: 0, partial: 0, unsupported: 0, unchecked: 0, stale: 0, total: 0 };\n  for (const t of doc.traces) for (const l of t.locations) {\n    out[checkState(l)]++;\n    out.total++;\n  }\n  return out;\n}\n\n/** Stores execution results ({ nodeId: { hit, count } }) from coverage. */\nexport function recordExec(root, id, results, { source = 'coverage', command = '' } = {}) {\n  const doc = loadMap(root, id);\n  refreshContextHashes(root, doc);\n  const at = new Date().toISOString();\n  const sum = { hit: 0, miss: 0, unknown: 0 };\n  for (const t of doc.traces) {\n    for (const l of t.locations) {\n      const r = results[l.id];\n      if (!r) {\n        delete l.exec;\n        sum.unknown++;\n        continue;\n      }\n      l.exec = { hit: r.hit, count: r.count, at, source, ctxHash: l.ctxHash };\n      sum[r.hit ? 'hit' : 'miss']++;\n    }\n  }\n  doc.meta = { ...doc.meta, updatedAt: at, exec: { ...sum, at, source, command } };\n  persist(root, doc);\n  writeHtml(root, doc);\n  return { id: doc.id, ...sum };\n}\n\nconst MAX_FILE_BYTES = 512 * 1024;\nconst MAX_TOTAL_BYTES = 8 * 1024 * 1024;\n\n/** Snapshot of every referenced file, embedded in the viewer (code tabs, gutter markers). */\nexport function collectFiles(root, doc) {\n  const files = {};\n  let total = 0;\n  const paths = [...new Set(doc.traces.flatMap((t) => t.locations.map((l) => l.path)))];\n  for (const rel of paths) {\n    try {\n      const abs = safeJoin(root, rel);\n      const st = fs.statSync(abs);\n      if (!st.isFile() || st.size > MAX_FILE_BYTES || total + st.size > MAX_TOTAL_BYTES) continue;\n      const text = fs.readFileSync(abs, 'utf8');\n      if (text.indexOf(String.fromCharCode(0)) !== -1) continue; // binary\n      files[rel] = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));\n      total += st.size;\n    } catch {\n      /* missing file: the viewer falls back to the stored snippet */\n    }\n  }\n  return files;\n}\n\nconst sha = (s) => crypto.createHash('sha1').update(s).digest('hex').slice(0, 12);\nconst storyHash = (doc) => sha(doc.traces.map((t) => traceHash(t)).join('|'));\n\n/**\n * Records, for every node / trace / the story, a hash of the code the prose was written for.\n * force=true overwrites (prose just written); otherwise only fills missing baselines (old maps).\n */\nexport function baselineNarrative(doc, { force = false, nodes = null, traces = null, story = false } = {}) {\n  for (const t of doc.traces) {\n    for (const l of t.locations) {\n      if (!l.ctxHash) continue;\n      if (force || !l.narrativeHash || (nodes && nodes.has(l.id))) l.narrativeHash = l.ctxHash;\n    }\n    if (force || !t.narrativeHash || (traces && traces.has(t.id))) t.narrativeHash = traceHash(t);\n  }\n  if (force || !doc.narrativeHash || story) doc.narrativeHash = storyHash(doc);\n  return doc;\n}\n\n/**\n * Narrative drift: prose written for code that has since changed (anchors may still be fine).\n * Uses the stored ctxHash of each node (refreshed by create/verify --fix/annotate).\n */\nexport function narrativeDrift(doc) {\n  const nodes = [];\n  const traces = [];\n  for (const t of doc.traces) {\n    for (const l of t.locations) if (l.narrativeHash && l.ctxHash && l.narrativeHash !== l.ctxHash) nodes.push(l.id);\n    if (t.narrativeHash && t.narrativeHash !== traceHash(t)) traces.push(t.id);\n  }\n  const story = !!doc.narrativeHash && doc.narrativeHash !== storyHash(doc);\n  return { nodes, traces, story, stale: nodes.length > 0 || traces.length > 0 || story };\n}\n\n/** Which narrative fields are still empty (drives the \"fill with waymark_annotate\" hint). */\nexport function narrativeGaps(doc) {\n  const gaps = { story: !doc.story, motivation: [], details: [], explanation: [] };\n  for (const t of doc.traces) {\n    if (!t.motivation) gaps.motivation.push(t.id);\n    if (!t.details) gaps.details.push(t.id);\n    for (const l of t.locations) if (!l.explanation) gaps.explanation.push(l.id);\n  }\n  gaps.complete = !gaps.story && !gaps.motivation.length && !gaps.details.length && !gaps.explanation.length;\n  return gaps;\n}\n\n/**\n * Patches prose on an existing map without re-anchoring: story/description/title at map level,\n * title/description/diagramTitle/motivation/details per trace, title/description/explanation per location.\n */\nexport function annotateMap(root, id, patch) {\n  const doc = loadMap(root, id);\n  const unknown = [];\n  let changed = 0;\n  const set = (obj, key, val) => {\n    if (typeof val === 'string' && obj[key] !== val) {\n      if (key === 'title' || key === 'diagramTitle') Title.parse(val);\n      obj[key] = val;\n      changed++;\n      return true;\n    }\n    return false;\n  };\n  const touchedNodes = new Set();\n  const touchedTraces = new Set();\n  let touchedStory = false;\n  // Prose confirmed accurate without edits: re-baseline it so it stops being flagged.\n  for (const r of patch.reviewed || []) {\n    if (r === 'story') touchedStory = true;\n    else if (String(r).startsWith('trace:')) touchedTraces.add(String(r).slice(6));\n    else touchedNodes.add(String(r));\n  }\n  for (const k of ['title', 'description', 'story', 'language']) if (set(doc, k, patch[k]) && k === 'story') touchedStory = true;\n  for (const tp of patch.traces || []) {\n    const t = doc.traces.find((x) => x.id === String(tp.id));\n    if (!t) {\n      unknown.push(`trace ${tp.id}`);\n      continue;\n    }\n    for (const k of ['title', 'description', 'diagramTitle', 'motivation', 'details']) if (set(t, k, tp[k])) touchedTraces.add(t.id);\n  }\n  for (const lp of patch.locations || []) {\n    const l = doc.traces.flatMap((t) => t.locations).find((x) => x.id === lp.id);\n    if (!l) {\n      unknown.push(`location ${lp.id}`);\n      continue;\n    }\n    for (const k of ['title', 'description', 'explanation']) if (set(l, k, lp[k])) touchedNodes.add(l.id);\n  }\n  if (Array.isArray(patch.links)) {\n    // Cross-trace links are prose too (labels): replace the whole list, validating the ends.\n    const ids = new Set(doc.traces.flatMap((t) => t.locations.map((l) => l.id)));\n    const bad = patch.links.filter((k) => !ids.has(k.from) || !ids.has(k.to));\n    if (bad.length) throw new Error(`Links reference unknown nodes: ${bad.map((k) => `${k.from}->${k.to}`).join(', ')}`);\n    doc.links = patch.links.map(({ from, to, label }) => (label ? { from, to, label } : { from, to }));\n    changed++;\n  }\n  for (const t of doc.traces) {\n    if (t.guide && !t.details) t.details = t.guide;\n    delete t.guide;\n  }\n  // Rewritten prose now describes the current code: refresh context hashes and re-baseline it.\n  refreshContextHashes(root, doc);\n  baselineNarrative(doc, { nodes: touchedNodes, traces: touchedTraces, story: touchedStory });\n  const drift = narrativeDrift(doc);\n  doc.meta = {\n    ...doc.meta,\n    updatedAt: new Date().toISOString(),\n    narrativeDrift: drift.stale ? { nodes: drift.nodes, traces: drift.traces, story: drift.story } : undefined,\n  };\n  persist(root, doc);\n  const htmlPath = writeHtml(root, doc);\n  return { id: doc.id, changed, unknown, narrative: narrativeGaps(doc), drift, htmlPath };\n}\n\nexport function persist(root, doc) {\n  fs.writeFileSync(filePath(root, doc.id), JSON.stringify(doc, null, 2));\n}\n\nexport function loadMap(root, id, { quiet = false } = {}) {\n  let p;\n  try {\n    p = filePath(root, id);\n  } catch (e) {\n    if (quiet) return null;\n    throw e;\n  }\n  if (!fs.existsSync(p)) {\n    // Allow unique prefix lookups (\"auth-flow\" -> \"auth-flow-1a2b3c\").\n    const hit = listMaps(root).filter((m) => m.id.startsWith(id));\n    if (hit.length === 1) return loadMap(root, hit[0].id);\n    if (quiet) return null;\n    throw new Error(\n      hit.length > 1 ? `Ambiguous waymark id \"${id}\": ${hit.map((h) => h.id).join(', ')}` : `Waymark \"${id}\" not found`,\n    );\n  }\n  return JSON.parse(fs.readFileSync(p, 'utf8'));\n}\n\nexport function listMaps(root) {\n  const dir = mapDir(root);\n  if (!fs.existsSync(dir)) return [];\n  return fs\n    .readdirSync(dir)\n    .filter((f) => f.endsWith('.json'))\n    .map((f) => {\n      try {\n        const d = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));\n        return {\n          id: d.id,\n          title: d.title,\n          description: d.description,\n          query: d.query,\n          traces: d.traces.length,\n          locations: d.traces.reduce((n, t) => n + t.locations.length, 0),\n          updatedAt: d.meta?.updatedAt,\n          commit: d.meta?.commit?.slice(0, 8),\n          tags: d.tags,\n          kind: d.kind || 'flow',\n          check: checkSummary(d),\n          exec: d.meta?.exec ? { hit: d.meta.exec.hit, miss: d.meta.exec.miss, unknown: d.meta.exec.unknown } : null,\n          drift: narrativeDrift(d).nodes.length,\n          mapRefs: d.traces.flatMap((t) => t.locations).filter((l) => l.mapRef).map((l) => l.mapRef.split('#')[0]),\n        };\n      } catch {\n        return null;\n      }\n    })\n    .filter(Boolean)\n    .sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));\n}\n\n/** Recomputes each node's ctxHash at its stored line (no re-anchoring). */\nexport function refreshContextHashes(root, doc) {\n  const cache = new FileCache(root);\n  for (const t of doc.traces) {\n    for (const l of t.locations) {\n      const f = cache.read(l.path);\n      if (f) l.ctxHash = contextHash(f.lines, Math.min(Math.max(l.lineNumber - 1, 0), f.lines.length - 1));\n    }\n  }\n  return doc;\n}\n\nexport function deleteMap(root, id) {\n  const doc = loadMap(root, id);\n  for (const ext of ['json', 'html']) {\n    const p = filePath(root, doc.id, ext);\n    if (fs.existsSync(p)) fs.unlinkSync(p);\n  }\n  return doc.id;\n}\n","src/state.js":"import crypto from 'node:crypto';\n\n// Small, dependency-free helpers shared by the store and the renderers.\n\nconst sha = (s) => crypto.createHash('sha1').update(s).digest('hex').slice(0, 12);\n\n/** Hash of the prose a fact-check judged (title + description + explanation). */\nexport const proseHash = (l) => sha([l.title, l.description, l.explanation || ''].join('|'));\n\n/** supported | partial | unsupported | unchecked | stale (code or prose changed since the check). */\nexport function checkState(l) {\n  if (!l.check) return 'unchecked';\n  if (l.check.ctxHash !== l.ctxHash || l.check.proseHash !== proseHash(l)) return 'stale';\n  return l.check.verdict;\n}\n\n/** hit | miss | unknown | stale (code changed since coverage was taken). */\nexport function execState(l) {\n  if (!l.exec) return 'unknown';\n  if (l.exec.ctxHash !== l.ctxHash) return 'stale';\n  return l.exec.hit ? 'hit' : 'miss';\n}\n","src/lint.js":"import { treeRefs } from './schema.js';\nimport { narrativeGaps } from './store.js';\nimport { checkState } from './state.js';\nimport { traceHash } from './anchor.js';\n\nconst REF_RE = /\\[((?:\\d+[a-z]{1,2})(?:\\s*,\\s*\\d+[a-z]{1,2})*)\\]/g;\nconst words = (s) => (String(s || '').trim().match(/\\S+/g) || []).length;\n\nfunction refsIn(text) {\n  const out = [];\n  for (const m of String(text || '').matchAll(REF_RE)) out.push(...m[1].split(/\\s*,\\s*/));\n  return out;\n}\n\n/**\n * Static quality checks on a map's prose and structure (no code access needed).\n * error: broken references; warn: missing/weak narrative, uncited nodes, over-long labels.\n */\nexport function lintMap(doc, { mapIds = null } = {}) {\n  const issues = [];\n  const add = (level, where, message) => issues.push({ level, where, message });\n  const ids = new Set(doc.traces.flatMap((t) => t.locations.map((l) => l.id)));\n\n  const checkRefs = (where, text) => {\n    for (const r of refsIn(text)) if (!ids.has(r)) add('error', where, `references unknown node [${r}]`);\n  };\n  checkRefs('description', doc.description);\n  checkRefs('story', doc.story);\n  for (const t of doc.traces) {\n    checkRefs(`trace ${t.id} description`, t.description);\n    checkRefs(`trace ${t.id} motivation`, t.motivation);\n    checkRefs(`trace ${t.id} details`, t.details);\n    for (const l of t.locations) {\n      checkRefs(`[${l.id}] description`, l.description);\n      checkRefs(`[${l.id}] explanation`, l.explanation);\n    }\n  }\n  for (const l of doc.links || []) {\n    if (!ids.has(l.from) || !ids.has(l.to)) add('error', 'links', `link ${l.from} -> ${l.to} references an unknown node`);\n  }\n\n  const gaps = narrativeGaps(doc);\n  if (gaps.story) add('warn', 'story', 'missing holistic story');\n  for (const id of gaps.motivation) add('warn', `trace ${id}`, 'missing motivation');\n  for (const id of gaps.details) add('warn', `trace ${id}`, 'missing details');\n  if (gaps.explanation.length) add('warn', 'explanations', `missing for ${gaps.explanation.map((x) => `[${x}]`).join(', ')}`);\n\n  for (const t of doc.traces) {\n    const cited = new Set(refsIn(t.details));\n    if (t.details) {\n      const uncited = t.locations.filter((l) => !cited.has(l.id)).map((l) => `[${l.id}]`);\n      if (uncited.length) add('warn', `trace ${t.id} details`, `does not cite ${uncited.join(', ')}`);\n    }\n    const inTree = new Set(treeRefs(t.tree));\n    const orphan = t.locations.filter((l) => !inTree.has(l.id)).map((l) => `[${l.id}]`);\n    if (orphan.length) add('warn', `trace ${t.id} tree`, `nodes not placed in the tree: ${orphan.join(', ')}`);\n    for (const l of t.locations) {\n      if (words(l.title) > 6) add('warn', `[${l.id}] title`, `${words(l.title)} words (aim for \u003c= 5)`);\n      if (words(l.description) > 20) add('warn', `[${l.id}] description`, `${words(l.description)} words (aim for one sentence \u003c= 15)`);\n      if (l.explanation && l.explanation.trim().length \u003c 80) add('warn', `[${l.id}] explanation`, 'very short; tell the story (3-6 sentences)');\n    }\n  }\n  for (const t of doc.traces) {\n    for (const l of t.locations) {\n      const st = checkState(l);\n      if (st === 'unsupported') add('error', `[${l.id}] fact-check`, `unsupported: ${(l.check.issues || []).join('; ') || 'see map'}`);\n      else if (st === 'partial') add('warn', `[${l.id}] fact-check`, `partial: ${(l.check.issues || []).join('; ') || 'see map'}`);\n      if (l.mapRef && mapIds && !mapIds.has(l.mapRef.split('#')[0])) add('error', `[${l.id}] mapRef`, `links to unknown map \"${l.mapRef}\"`);\n    }\n    if (t.check?.verdict === 'unsupported' && t.check.hash === traceHash(t)) add('error', `trace ${t.id} fact-check`, `unsupported: ${(t.check.issues || []).join('; ')}`);\n  }\n  if (doc.storyCheck?.verdict === 'unsupported') add('error', 'story fact-check', `unsupported: ${(doc.storyCheck.issues || []).join('; ')}`);\n\n  const errors = issues.filter((i) => i.level === 'error').length;\n  return { id: doc.id, errors, warnings: issues.length - errors, issues, ok: errors === 0 };\n}\n","src/render/html.js":"import fs from 'node:fs';\nimport path from 'node:path';\nimport { fileURLToPath } from 'node:url';\nimport { renderMermaid } from './mermaid.js';\nimport { renderMarkdown } from './markdown.js';\nimport { checkState, execState } from '../state.js';\n\nconst HERE = path.dirname(fileURLToPath(import.meta.url));\nconst CSS = fs.readFileSync(path.join(HERE, 'viewer.css'), 'utf8');\nconst CLIENT = fs.readFileSync(path.join(HERE, 'viewer.client.js'), 'utf8');\nconst BS = String.fromCharCode(92);\n\nconst escHtml = (s) =>\n  String(s ?? '').replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n\n// JSON inside \u003cscript type=\"application/json\">: only \"\u003c\" must be neutralized (no \"\u003c/script>\").\nconst inlineJson = (v) => JSON.stringify(v).split('\u003c').join(BS + 'u003c');\nconst inlineScript = (s) => s.replace(/\u003c\\/script/gi, '\u003c' + BS + '/script');\n\n/**\n * Self-contained, shareable viewer (no network): map pane with story, guides and\n * explanations; code view with embedded files; interactive SVG diagram.\n * `files` is a snapshot { path: content } of the referenced files.\n */\nexport function renderHtml(doc, { files = {}, maps = [] } = {}) {\n  const data = {\n    doc,\n    files,\n    maps,\n    // Precomputed per-node state (fact-check verdict validity needs hashes the browser can't do sync).\n    states: Object.fromEntries(\n      doc.traces.flatMap((t) => t.locations.map((l) => [l.id, { check: checkState(l), exec: execState(l) }])),\n    ),\n    markdown: renderMarkdown(doc, { detail: 'full' }),\n    // Smaller context blocks for \"copy trace / node as context\".\n    traceMd: Object.fromEntries(doc.traces.map((t) => [t.id, renderMarkdown(doc, { trace: t.id })])),\n    nodeMd: Object.fromEntries(doc.traces.flatMap((t) => t.locations.map((l) => [l.id, renderMarkdown(doc, { node: l.id })]))),\n    mermaid: renderMermaid({ ...doc, diagram: undefined }),\n  };\n  return `\u003c!doctype html>\n\u003chtml lang=\"${escHtml(doc.language || 'en')}\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"generator\" content=\"waymark\">\n\u003ctitle>Waymark · ${escHtml(doc.title)}\u003c/title>\n\u003cstyle>${CSS}\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"app\">\n  \u003cheader id=\"topbar\">\n    \u003cspan class=\"brand\">WAYMARK\u003c/span>\u003cspan class=\"brand-sep\">\u003c/span>\n    \u003cspan class=\"top-title\">\u003c/span>\n    \u003cdiv class=\"search\">\n      \u003cinput id=\"search\" type=\"search\" placeholder=\"Search nodes…  ( / )\" autocomplete=\"off\" spellcheck=\"false\" aria-label=\"Search nodes\">\n      \u003cdiv id=\"searchResults\" hidden>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"seg\" role=\"tablist\" aria-label=\"View\">\n      \u003cbutton id=\"vCode\" role=\"tab\" title=\"Code view (d)\">Code\u003c/button>\n      \u003cbutton id=\"vDiagram\" role=\"tab\" title=\"Diagram view (d)\">Diagram\u003c/button>\n    \u003c/div>\n    \u003ca class=\"tbtn\" id=\"allMaps\" href=\"index.html\" title=\"All maps in this repository\">All maps\u003c/a>\n    \u003cbutton class=\"tbtn\" id=\"copyCtx\" title=\"Copy the map as markdown context for an agent\">Copy context\u003c/button>\n    \u003cbutton class=\"tbtn\" id=\"settingsBtn\" title=\"Editor link settings\">⚙\u003c/button>\n  \u003c/header>\n  \u003cdiv id=\"settings\" hidden>\n    \u003clabel>Local repo path \u003cinput id=\"setRoot\" spellcheck=\"false\">\u003c/label>\n    \u003clabel>Editor\n      \u003cselect id=\"setEditor\">\n        \u003coption value=\"vscode\">VS Code\u003c/option>\u003coption value=\"cursor\">Cursor\u003c/option>\n        \u003coption value=\"windsurf\">Windsurf / Devin Desktop\u003c/option>\u003coption value=\"idea\">JetBrains\u003c/option>\n      \u003c/select>\n    \u003c/label>\n  \u003c/div>\n  \u003cdiv id=\"main\">\n    \u003caside id=\"mapPane\" aria-label=\"Map\">\u003c/aside>\n    \u003cdiv id=\"splitter\" role=\"separator\" aria-orientation=\"vertical\" title=\"Drag to resize\">\u003c/div>\n    \u003csection id=\"rightPane\">\n      \u003cdiv id=\"codeView\">\n        \u003cdiv id=\"fileTabs\">\u003c/div>\n        \u003cdiv id=\"codeScroll\">\u003cdiv id=\"code\">\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"diagramView\" hidden>\n        \u003cdiv class=\"dg-toolbar\">\n          \u003cdiv class=\"legend\" id=\"legend\">\u003c/div>\n          \u003cdiv class=\"zoom\">\n            \u003cbutton id=\"zin\" title=\"Zoom in\">+\u003c/button>\n            \u003cbutton id=\"zout\" title=\"Zoom out\">−\u003c/button>\n            \u003cbutton id=\"zfit\" title=\"Fit all (f)\">⤢\u003c/button>\n            \u003cbutton id=\"zsel\" title=\"Center selected node\">◎\u003c/button>\n            \u003cbutton id=\"copyMmd\" title=\"Copy the diagram as Mermaid source\">⧉\u003c/button>\n            \u003cbutton id=\"exportSvg\" title=\"Download the diagram as SVG\">⤓\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003csvg id=\"mini\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Minimap\">\u003cg id=\"miniContent\">\u003c/g>\u003crect id=\"miniView\"/>\u003c/svg>\n        \u003csvg id=\"dg\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Interactive diagram\">\n          \u003cdefs>\n            \u003cmarker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\" style=\"color:var(--muted)\"/>\u003c/marker>\n            \u003cmarker id=\"arr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\" style=\"color:var(--ink2)\"/>\u003c/marker>\n          \u003c/defs>\n          \u003cg id=\"vp\">\u003c/g>\n        \u003c/svg>\n        \u003cdiv id=\"dgTip\" hidden>\u003c/div>\n        \u003cdiv id=\"dgCard\" hidden>\u003c/div>\n        \u003cdiv class=\"dg-hint\">Drag to pan · wheel to zoom · click a node to focus its path · double-click to open the code\u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/div>\n\u003c/div>\n\u003cscript id=\"waymark-data\" type=\"application/json\">${inlineJson(data)}\u003c/script>\n\u003cscript>${inlineScript(CLIENT)}\u003c/script>\n\u003c/body>\n\u003c/html>`;\n}\n\nconst pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '—');\n\n/** .waymark/index.html: overview maps first, then flows; health badges per map; text filter. */\nexport function renderIndex(maps, { root = '' } = {}) {\n  const sorted = [...maps].sort((a, b) => (a.kind === 'overview' ? 0 : 1) - (b.kind === 'overview' ? 0 : 1) || String(b.updatedAt).localeCompare(String(a.updatedAt)));\n  const cards = sorted\n    .map((m) => {\n      const c = m.check || {};\n      const badges = [\n        m.kind === 'overview' ? '\u003cspan class=\"b ov\">overview\u003c/span>' : '',\n        `\u003cspan class=\"b\">${m.traces} traces · ${m.locations} nodes\u003c/span>`,\n        c.total && c.total - c.unchecked - c.stale ? `\u003cspan class=\"b ${c.unsupported ? 'bad' : 'ok'}\" title=\"fact-checked nodes\">✓ ${pct(c.supported, c.total)} verified${c.unsupported ? ` · ${c.unsupported} unsupported` : ''}\u003c/span>` : '',\n        m.exec ? `\u003cspan class=\"b ok\" title=\"nodes executed by the tests\">▶ ${m.exec.hit}/${m.exec.hit + m.exec.miss} executed\u003c/span>` : '',\n        m.drift ? `\u003cspan class=\"b warn\">◔ ${m.drift} to review\u003c/span>` : '',\n      ].join('');\n      const text = escHtml([m.title, m.description, m.id, m.query].join(' ').toLowerCase());\n      return `\u003ca class=\"card\" href=\"${escHtml(m.id)}.html\" data-text=\"${text}\">\u003ch2>${escHtml(m.title)}\u003c/h2>\u003cp>${escHtml(m.description || '')}\u003c/p>\u003cdiv class=\"bs\">${badges}\u003c/div>\u003cdiv class=\"id\">${escHtml(m.id)} · ${escHtml(String(m.updatedAt || '').slice(0, 10))}\u003c/div>\u003c/a>`;\n    })\n    .join('');\n  return `\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Waymark · maps\u003c/title>\n\u003cstyle>\n:root{--bg:#1b1c1f;--panel:#232428;--ink:#e4e5e8;--muted:#8f949c;--line:#36383e;--accent:#5b8cff;--ok:#3fae6a;--warn:#e0a43a;--bad:#e5646b;color-scheme:dark}\n@media (prefers-color-scheme:light){:root{--bg:#f6f6f4;--panel:#fff;--ink:#1d1f23;--muted:#6b7078;--line:#e3e3df;--accent:#3a5ccc;color-scheme:light}}\nbody{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,\"Segoe UI\",Inter,sans-serif}\nheader{display:flex;gap:16px;align-items:center;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--panel)}\n.brand{font:700 12px/1 sans-serif;letter-spacing:.14em;color:var(--accent)}\nh1{font-size:18px;margin:0;flex:1}\ninput{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:260px}\nmain{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding:22px 28px}\n.card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card:hover{border-color:var(--accent)}\n.card h2{font-size:15px;margin:0 0 6px}.card p{margin:0 0 10px;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}\n.bs{display:flex;flex-wrap:wrap;gap:6px}.b{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}\n.b.ov{color:var(--accent);border-color:var(--accent)}.b.ok{color:var(--ok);border-color:var(--ok)}.b.warn{color:var(--warn);border-color:var(--warn)}.b.bad{color:var(--bad);border-color:var(--bad)}\n.id{margin-top:10px;font:11px ui-monospace,Consolas,monospace;color:var(--muted)}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003cspan class=\"brand\">WAYMARK\u003c/span>\u003ch1>Maps${root ? ' · ' + escHtml(String(root).split(/[\\\\/]/).pop()) : ''}\u003c/h1>\u003cinput id=\"q\" type=\"search\" placeholder=\"Filter maps…\">\u003c/header>\n\u003cmain id=\"list\">${cards}\u003c/main>\n\u003cscript>document.getElementById('q').addEventListener('input',function(e){var q=e.target.value.toLowerCase();document.querySelectorAll('.card').forEach(function(c){c.style.display=c.dataset.text.indexOf(q)>-1?'':'none';});});\u003c/script>\n\u003c/body>\u003c/html>`;\n}\n","src/diff.js":"import { execFileSync } from 'node:child_process';\nimport { listMaps, loadMap } from './store.js';\nimport { FileCache, contextRange } from './anchor.js';\nimport { verifyMap } from './verify.js';\n\n/*\n * Impact of a change set on the maps: which nodes' code blocks were touched, which anchors\n * broke and which prose went out of date. Used by `waymark diff`, waymark_diff and the PR action.\n */\n\nfunction git(root, args) {\n  return execFileSync('git', args, { cwd: root, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], maxBuffer: 64 * 1024 * 1024 });\n}\n\n/**\n * Changed line numbers (in the *new* version of each file) between `base` and the working tree\n * (base \"HEAD\" = uncommitted changes) or `base...HEAD` (merge-base) when `range` is true.\n */\nexport function changedLines(root, base = 'HEAD', { range = false } = {}) {\n  const args = ['diff', '--unified=0', '--no-color', '--no-ext-diff', '-M'];\n  args.push(range ? `${base}...HEAD` : base);\n  const out = git(root, args);\n  const files = new Map();\n  let cur = null;\n  for (const line of out.split('\\n')) {\n    if (line.startsWith('+++ ')) {\n      const p = line.slice(4).trim();\n      cur = p === '/dev/null' ? null : p.replace(/^b\\//, '');\n      if (cur && !files.has(cur)) files.set(cur, new Set());\n      continue;\n    }\n    const m = cur && line.match(/^@@ -\\d+(?:,\\d+)? \\+(\\d+)(?:,(\\d+))? @@/);\n    if (m) {\n      const start = Number(m[1]);\n      const count = m[2] == null ? 1 : Number(m[2]);\n      const set = files.get(cur);\n      if (count === 0) {\n        // Pure deletion: mark the lines around the cut.\n        set.add(Math.max(1, start));\n        set.add(start + 1);\n      } else for (let i = 0; i \u003c count; i++) set.add(start + i);\n    }\n  }\n  return files;\n}\n\n/** Report of the maps affected by a change set. */\nexport function diffMaps(root, base = 'HEAD', { range = false } = {}) {\n  const changes = changedLines(root, base, { range });\n  const cache = new FileCache(root);\n  const maps = [];\n  for (const m of listMaps(root)) {\n    const doc = loadMap(root, m.id);\n    const touched = [];\n    for (const t of doc.traces) {\n      for (const l of t.locations) {\n        const changed = changes.get(l.path);\n        if (!changed) continue;\n        const f = cache.read(l.path);\n        if (!f) continue;\n        const r = contextRange(f.lines, Math.min(l.lineNumber - 1, f.lines.length - 1)) || [l.lineNumber, l.lineNumber];\n        const hits = [...changed].filter((n) => n >= r[0] && n \u003c= r[1]);\n        if (hits.length) touched.push({ id: l.id, title: l.title, trace: t.id, path: l.path, from: r[0], to: r[1], lines: hits.length });\n      }\n    }\n    const v = verifyMap(root, doc.id);\n    const broken = v.changes.filter((c) => c.status === 'unresolved' || c.status === 'missing');\n    if (!touched.length && !broken.length && !v.narrative.stale) continue;\n    maps.push({ id: doc.id, title: doc.title, touched, broken, drift: v.narrative });\n  }\n  return { base, range, files: [...changes.keys()], maps };\n}\n\n/** Markdown for PR comments / terminals. */\nexport function renderDiff(rep) {\n  if (!rep.maps.length) return `### Waymark\\n\\nNo documented flow is affected by these changes (${rep.files.length} file(s) changed).`;\n  const o = ['### Waymark — documented flows affected by this change', ''];\n  for (const m of rep.maps) {\n    o.push(`**${m.title}** (\\`${m.id}\\`)`);\n    if (m.touched.length) {\n      o.push('', '| Node | Location | Changed lines |', '|---|---|---|');\n      for (const t of m.touched) o.push(`| \\`${t.id}\\` ${t.title} | \\`${t.path}:${t.from}-${t.to}\\` | ${t.lines} |`);\n    }\n    if (m.broken.length) o.push('', `⚠ Anchors no longer found: ${m.broken.map((b) => `\\`${b.id}\\` (${b.from})`).join(', ')}`);\n    const d = m.drift;\n    if (d.stale) {\n      const parts = [];\n      if (d.nodes.length) parts.push(`nodes ${d.nodes.map((n) => `\\`${n}\\``).join(', ')}`);\n      if (d.traces.length) parts.push(`trace guides ${d.traces.join(', ')}`);\n      if (d.story) parts.push('the story');\n      o.push('', `◔ Prose to review (code changed since it was written): ${parts.join('; ')}.`);\n    }\n    o.push('', `→ \\`/waymark refresh ${m.id}\\` updates the map.`, '');\n  }\n  return o.join('\\n');\n}\n","src/anchor.js":"import fs from 'node:fs';\nimport path from 'node:path';\nimport crypto from 'node:crypto';\nimport { trackedFiles } from './git.js';\n\nconst MAX_FILE_BYTES = 4 * 1024 * 1024;\nconst SNIPPET_BEFORE = 3;\nconst SNIPPET_AFTER = 14;\n\nconst norm = (s) => (s || '').trim().replace(/\\s+/g, ' ');\n\n/** Resolves a repo-relative path, refusing anything that escapes the root. */\nexport function safeJoin(root, rel) {\n  const abs = path.resolve(root, rel);\n  const relBack = path.relative(root, abs);\n  if (relBack.startsWith('..') || path.isAbsolute(relBack)) {\n    throw new Error(`Path \"${rel}\" is outside the repository root`);\n  }\n  return abs;\n}\n\nexport class FileCache {\n  constructor(root) {\n    this.root = root;\n    this.files = new Map();\n    this._tracked = undefined;\n  }\n\n  read(rel) {\n    if (this.files.has(rel)) return this.files.get(rel);\n    let entry = null;\n    try {\n      const abs = safeJoin(this.root, rel);\n      const stat = fs.statSync(abs);\n      if (stat.isFile() && stat.size \u003c= MAX_FILE_BYTES) {\n        const text = fs.readFileSync(abs, 'utf8');\n        entry = {\n          lines: text.split(/\\r?\\n/),\n          hash: crypto.createHash('sha1').update(text.replace(/\\r\\n/g, '\\n')).digest('hex').slice(0, 12),\n        };\n      }\n    } catch {\n      entry = null;\n    }\n    this.files.set(rel, entry);\n    return entry;\n  }\n\n  /** Finds a moved/renamed file by basename when the original path is gone. */\n  findByBasename(rel) {\n    if (this._tracked === undefined) this._tracked = trackedFiles(this.root);\n    if (!this._tracked) return null;\n    const base = path.posix.basename(rel);\n    const hits = this._tracked.filter((f) => path.posix.basename(f) === base);\n    if (hits.length === 1) return hits[0];\n    // Prefer the candidate sharing the longest path suffix.\n    const parts = rel.split('/');\n    let best = null;\n    let bestScore = 0;\n    for (const h of hits) {\n      const hp = h.split('/');\n      let s = 0;\n      while (s \u003c parts.length && s \u003c hp.length && parts[parts.length - 1 - s] === hp[hp.length - 1 - s]) s++;\n      if (s > bestScore) [best, bestScore] = [h, s];\n      else if (s === bestScore) best = null;\n    }\n    return bestScore > 1 ? best : null;\n  }\n}\n\nfunction nearest(indices, target) {\n  return indices.reduce((a, b) => (Math.abs(b - target) \u003c Math.abs(a - target) ? b : a));\n}\n\n/**\n * Checks a location against the working tree and corrects its line number.\n * status: ok | moved (same text, other line) | fuzzy (partial match) | relocated (file moved)\n *         | unresolved (text not found) | missing (file not found)\n */\nexport function anchorLocation(cache, loc) {\n  let relPath = loc.path;\n  let file = cache.read(relPath);\n  let relocatedFrom = null;\n  if (!file) {\n    const alt = cache.findByBasename(relPath);\n    if (alt && (file = cache.read(alt))) {\n      relocatedFrom = relPath;\n      relPath = alt;\n    }\n  }\n  if (!file) {\n    return { ...loc, status: 'missing', note: `File not found: ${loc.path}` };\n  }\n\n  const { lines } = file;\n  const wanted = norm(loc.lineContent);\n  const idx0 = Math.min(Math.max(loc.lineNumber - 1, 0), lines.length - 1);\n  let idx = -1;\n  let status = 'unresolved';\n\n  if (!wanted || norm(lines[idx0]) === wanted) {\n    idx = idx0;\n    status = 'ok';\n  } else {\n    const exact = [];\n    lines.forEach((l, i) => norm(l) === wanted && exact.push(i));\n    if (exact.length) {\n      idx = nearest(exact, idx0);\n      status = 'moved';\n    } else {\n      const partial = [];\n      if (wanted.length >= 6) {\n        lines.forEach((l, i) => {\n          const n = norm(l);\n          if (n.length >= 6 && (n.includes(wanted) || wanted.includes(n))) partial.push(i);\n        });\n      }\n      if (!partial.length && loc.symbol) {\n        const re = new RegExp(`\\\\b${loc.symbol.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')}\\\\b`);\n        lines.forEach((l, i) => re.test(l) && partial.push(i));\n      }\n      if (partial.length) {\n        idx = nearest(partial, idx0);\n        status = 'fuzzy';\n      }\n    }\n  }\n  if (relocatedFrom && (status === 'ok' || status === 'moved')) status = 'relocated';\n\n  const anchorIdx = idx >= 0 ? idx : idx0;\n  const start = Math.max(0, anchorIdx - SNIPPET_BEFORE);\n  const end = Math.min(lines.length, anchorIdx + SNIPPET_AFTER + 1);\n  const result = {\n    ...loc,\n    path: relPath,\n    lineNumber: anchorIdx + 1,\n    status,\n    fileHash: file.hash,\n    ctxHash: contextHash(lines, anchorIdx),\n    snippet: { startLine: start + 1, code: lines.slice(start, end).join('\\n') },\n  };\n  if (idx >= 0) result.lineContent = lines[anchorIdx].trim();\n  const notes = [];\n  if (relocatedFrom) notes.push(`file moved from ${relocatedFrom}`);\n  if (status !== 'ok' && status !== 'unresolved' && loc.lineNumber !== anchorIdx + 1) {\n    notes.push(`line ${loc.lineNumber} -> ${anchorIdx + 1}`);\n  }\n  if (status === 'fuzzy') notes.push('partial text match; double-check');\n  if (status === 'unresolved') notes.push(`line content not found in ${relPath}: \"${loc.lineContent}\"`);\n  if (notes.length) result.note = notes.join('; ');\n  else delete result.note;\n  return result;\n}\n\nconst CTX_MAX = 60;\nconst CTX_SIBLINGS = 4;\nconst indentOf = (l) => (l.match(/^\\s*/)[0].replace(/\\t/g, '    ').length);\nconst isCloser = (l) => /^[\\s)\\]}>;,]*(end\\b.*)?$/i.test(l) && l.trim().length > 0;\n\n/**\n * The code a node talks about: its line plus the block it opens (more-indented lines and the\n * closing bracket), or — for a single statement — a few sibling lines after it.\n */\nexport function contextBlock(lines, idx) {\n  return contextIndices(lines, idx).map((i) => lines[i]);\n}\n\n/** 0-based line indices of the block a node talks about (see contextBlock). */\nexport function contextIndices(lines, idx) {\n  if (idx \u003c 0 || idx >= lines.length) return [];\n  const base = indentOf(lines[idx]);\n  const out = [idx];\n  for (let i = idx + 1; i \u003c lines.length && out.length \u003c CTX_MAX; i++) {\n    const l = lines[i];\n    if (!l.trim()) continue;\n    if (indentOf(l) > base) out.push(i);\n    else {\n      if (out.length > 1 && isCloser(l)) out.push(i);\n      break;\n    }\n  }\n  if (out.length === 1) {\n    // A plain statement: include the next sibling lines at the same indentation.\n    for (let j = idx + 1, n = 0; j \u003c lines.length && n \u003c CTX_SIBLINGS; j++) {\n      const l = lines[j];\n      if (!l.trim()) continue;\n      if (indentOf(l) \u003c base) break;\n      out.push(j);\n      n++;\n    }\n  }\n  return out;\n}\n\n/** 1-based [first, last] line range of a node's block (used to match diffs against nodes). */\nexport function contextRange(lines, idx) {\n  const ix = contextIndices(lines, idx);\n  return ix.length ? [ix[0] + 1, ix[ix.length - 1] + 1] : null;\n}\n\n/**\n * Hash of the code a node talks about (whitespace-insensitive). Moving the block keeps the\n * hash; editing it changes it — that is how \"narrative drift\" (prose describing old code)\n * is detected, independently of whether the anchor line itself still exists.\n */\nexport function contextHash(lines, idx) {\n  const body = contextBlock(lines, idx).map((l) => norm(l)).join('\\n');\n  return crypto.createHash('sha1').update(body).digest('hex').slice(0, 12);\n}\n\n/** Combined hash of a trace's node contexts (its guide is stale when this changes). */\nexport function traceHash(trace) {\n  const all = trace.locations.map((l) => l.ctxHash || '').join('|');\n  return crypto.createHash('sha1').update(all).digest('hex').slice(0, 12);\n}\n\n/** Anchors every location of a normalized map in place; returns a summary report. */\nexport function anchorMap(root, map) {\n  const cache = new FileCache(root);\n  const report = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0, issues: [] };\n  for (const trace of map.traces) {\n    trace.locations = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      report[r.status]++;\n      if (r.status !== 'ok') report.issues.push({ id: r.id, status: r.status, path: r.path, note: r.note });\n      return r;\n    });\n  }\n  report.total = map.traces.reduce((n, t) => n + t.locations.length, 0);\n  report.healthy = report.unresolved === 0 && report.missing === 0;\n  return report;\n}\n\n/** Search helper for agents: lines in a file matching a regex or literal, with numbers. */\nexport function findInFile(root, rel, pattern, { regex = false, limit = 20 } = {}) {\n  const cache = new FileCache(root);\n  const file = cache.read(rel.replace(/\\\\/g, '/'));\n  if (!file) throw new Error(`File not found or unreadable: ${rel}`);\n  const re = regex ? new RegExp(pattern) : null;\n  const hits = [];\n  file.lines.forEach((l, i) => {\n    if (hits.length \u003c limit && (re ? re.test(l) : l.includes(pattern))) {\n      hits.push({ lineNumber: i + 1, lineContent: l.trim() });\n    }\n  });\n  return { path: rel, totalLines: file.lines.length, hits };\n}\n",".github/workflows/waymark-pr.yml":"name: waymark-pr\n# Comments on each pull request with the documented flows (Waymark maps) the change touches.\non: pull_request\npermissions:\n  contents: read\n  pull-requests: write\njobs:\n  maps:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v5\n        with:\n          fetch-depth: 0\n      - uses: actions/setup-node@v5\n        with:\n          node-version: 22\n      - run: npm ci\n      - run: node src/cli.js diff \"origin/${{ github.base_ref }}\" --range > waymark-report.md\n      - name: Comment (updates the previous Waymark comment)\n        env:\n          GH_TOKEN: ${{ github.token }}\n          PR: ${{ github.event.pull_request.number }}\n        run: gh pr comment \"$PR\" --body-file waymark-report.md --edit-last 2>/dev/null || gh pr comment \"$PR\" --body-file waymark-report.md\n","src/coverage.js":"import fs from 'node:fs';\nimport os from 'node:os';\nimport path from 'node:path';\nimport { spawnSync } from 'node:child_process';\nimport { fileURLToPath } from 'node:url';\nimport { listMaps, loadMap, recordExec } from './store.js';\nimport { relPath } from './context.js';\nimport { resolveCommand, argsFor } from './bin.js';\n\n/*\n * \"Verified by execution\": which map nodes actually ran.\n *  - V8 (Node/Deno/Bun-free): run any command with NODE_V8_COVERAGE set — child processes are\n *    covered too — and map V8 byte ranges to lines.\n *  - LCOV: any language/tool that emits lcov.info (Jest, c8, coverage.py, JaCoCo via converters…).\n * Result per file: Map(line → hit count) for the lines the tool instrumented.\n */\n\n/** Parses lcov.info → Map(relPath → Map(line → count)). */\nexport function parseLcov(text, root) {\n  const out = new Map();\n  let cur = null;\n  for (const raw of text.split(/\\r?\\n/)) {\n    const line = raw.trim();\n    if (line.startsWith('SF:')) {\n      const file = line.slice(3);\n      const rel = relPath(root, path.isAbsolute(file) ? file : path.resolve(root, file));\n      cur = rel ? (out.get(rel) || out.set(rel, new Map()).get(rel)) : null;\n    } else if (line.startsWith('DA:') && cur) {\n      const [ln, count] = line.slice(3).split(',');\n      cur.set(Number(ln), (cur.get(Number(ln)) || 0) + Number(count));\n    } else if (line === 'end_of_record') {\n      cur = null;\n    }\n  }\n  return out;\n}\n\n/** Reads a NODE_V8_COVERAGE directory → Map(relPath → Map(line → count)). Block-level ranges. */\nexport function parseV8Dir(dir, root) {\n  const out = new Map();\n  for (const f of fs.readdirSync(dir).filter((x) => x.endsWith('.json'))) {\n    let json;\n    try {\n      json = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));\n    } catch {\n      continue;\n    }\n    for (const script of json.result || []) {\n      if (!script.url || !script.url.startsWith('file:')) continue;\n      let abs;\n      try {\n        abs = fileURLToPath(script.url);\n      } catch {\n        continue;\n      }\n      if (abs.includes(`${path.sep}node_modules${path.sep}`)) continue;\n      const rel = relPath(root, abs);\n      if (!rel) continue;\n      let src;\n      try {\n        src = fs.readFileSync(abs, 'utf8');\n      } catch {\n        continue;\n      }\n      // One probe offset per line: its LAST non-blank character. For \"export function f() {\" that is\n      // the \"{\", inside f's own range (the first character, \"export\", belongs to the module range).\n      const starts = [];\n      let off = 0;\n      for (const l of src.split('\\n')) {\n        const body = l.replace(/\\s+$/, '');\n        starts.push(body.trim() ? off + body.length - 1 : -1);\n        off += l.length + 1;\n      }\n      const lines = out.get(rel) || out.set(rel, new Map()).get(rel);\n      // Outer ranges first so inner (more specific) ranges override their counts.\n      const ranges = (script.functions || []).flatMap((fn) => fn.ranges || []);\n      ranges.sort((a, b) => b.endOffset - b.startOffset - (a.endOffset - a.startOffset));\n      const perScript = new Map();\n      for (const r of ranges) {\n        for (let i = 0; i \u003c starts.length; i++) {\n          const s = starts[i];\n          if (s >= r.startOffset && s \u003c r.endOffset) perScript.set(i + 1, r.count);\n        }\n      }\n      // Several processes may load the same file: sum their counts.\n      for (const [ln, c] of perScript) lines.set(ln, (lines.get(ln) || 0) + c);\n    }\n  }\n  return out;\n}\n\n/** Runs a command with V8 coverage enabled (children included) and returns the parsed coverage. */\nexport function runWithV8Coverage(root, command, args) {\n  const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'waymark-v8-'));\n  // Absolute executables run directly; names like \"npm\" go through resolveCommand (Windows shims).\n  const bin = fs.existsSync(command) ? { command, args: [] } : resolveCommand(command) || { command, args: [], shell: process.platform === 'win32' };\n  const res = spawnSync(bin.command, argsFor(bin, args), {\n    cwd: root,\n    stdio: 'inherit',\n    shell: !!bin.shell,\n    env: { ...process.env, NODE_V8_COVERAGE: dir },\n  });\n  try {\n    return { status: res.status, coverage: parseV8Dir(dir, root) };\n  } finally {\n    fs.rmSync(dir, { recursive: true, force: true });\n  }\n}\n\n/** Node-level verdicts for one map: hit if the anchor line ran; miss if instrumented but 0. */\nexport function execResults(doc, coverage) {\n  const results = {};\n  for (const t of doc.traces) {\n    for (const l of t.locations) {\n      const lines = coverage.get(l.path);\n      if (!lines) continue;\n      // Declarations (e.g. \"export function f() {\") may not be a counted statement themselves;\n      // fall back to the first instrumented line of the node's next few lines.\n      let count = lines.get(l.lineNumber);\n      for (let k = 1; count == null && k \u003c= 3; k++) count = lines.get(l.lineNumber + k);\n      if (count == null) continue;\n      results[l.id] = { hit: count > 0, count };\n    }\n  }\n  return results;\n}\n\n/** Applies coverage to the given maps (or all) and persists node exec state. */\nexport function applyCoverage(root, coverage, { ids = null, source = 'coverage', command = '' } = {}) {\n  const targets = ids && ids.length ? ids.map((i) => loadMap(root, i).id) : listMaps(root).map((m) => m.id);\n  return targets.map((id) => recordExec(root, id, execResults(loadMap(root, id), coverage), { source, command }));\n}\n","src/render/viewer.client.js":"/* Waymark viewer — runs inside the self-contained HTML. No dependencies, no network. */\n(() => {\n  'use strict';\n\n  const DATA = JSON.parse(document.getElementById('waymark-data').textContent);\n  const { doc } = DATA;\n  const FILES = DATA.files || {};\n  const meta = doc.meta || {};\n  const PALETTE = ['#5b8cff', '#e8803a', '#3fae6a', '#c04fd0', '#d4a72c', '#2fb3c4', '#e0566b', '#8a7dff', '#7fb800', '#ff6fa8'];\n  const SVGNS = 'http://www.w3.org/2000/svg';\n\n  const $ = (s, el = document) => el.querySelector(s);\n  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));\n  const esc = (s) =>\n    String(s == null ? '' : s).replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n  const base = (p) => p.split('/').pop();\n  const extOf = (p) => (base(p).includes('.') ? base(p).split('.').pop().toLowerCase() : base(p).toLowerCase());\n  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));\n\n  // ---------------------------------------------------------------- model\n  const traces = doc.traces.map((t, i) => ({ ...t, color: PALETTE[i % PALETTE.length], details: t.details || t.guide }));\n  const locs = [];\n  const byId = new Map();\n  for (const t of traces) for (const l of t.locations) {\n    const x = { ...l, trace: t };\n    locs.push(x);\n    byId.set(l.id, x);\n  }\n  const fileOrder = [...new Set(locs.map((l) => l.path))];\n\n  // Narrative drift: prose written for code that changed afterwards (set by `waymark verify --fix`).\n  const drift = meta.narrativeDrift || { nodes: [], traces: [], story: false };\n  const staleNodes = new Set(drift.nodes || []);\n  for (const l of locs) if (l.narrativeHash && l.ctxHash && l.narrativeHash !== l.ctxHash) staleNodes.add(l.id);\n  const staleTraces = new Set(drift.traces || []);\n  const DRIFT_NOTE = 'The code here changed after this was written — the prose may be outdated. Ask your agent: ';\n  const driftNote = (what) => '\u003cdiv class=\"drift-note\">⚠ ' + esc(DRIFT_NOTE) + '\u003ccode>/waymark refresh ' + esc(doc.id) + '\u003c/code>' + (what ? ' (' + esc(what) + ')' : '') + '\u003c/div>';\n\n  // Embedded in a VS Code webview: talk to the extension instead of opening URLs.\n  const host = typeof acquireVsCodeApi === 'function' ? acquireVsCodeApi() : null;\n\n  // Fact-check verdicts, execution results, links between maps, human notes.\n  const STATES = DATA.states || {};\n  const MAPS = new Map((DATA.maps || []).map((m) => [m.id, m]));\n  const CHECK_BADGE = {\n    supported: ['ck ok', '✓', 'Fact-checked: every claim is backed by the code'],\n    partial: ['ck warn', '◑', 'Partially verified'],\n    unsupported: ['ck bad', '✗', 'Fact-check failed'],\n  };\n  function badges(l) {\n    const st = STATES[l.id] || {};\n    let h = '';\n    const c = CHECK_BADGE[st.check];\n    if (c) h += '\u003cspan class=\"st ' + c[0] + '\" title=\"' + esc(c[2] + ((l.check && l.check.issues && l.check.issues.length) ? ': ' + l.check.issues.join('; ') : '')) + '\">' + c[1] + '\u003c/span>';\n    if (st.exec === 'hit') h += '\u003cspan class=\"st ex\" title=\"Executed by the tests (' + l.exec.count + '×)\">▶\u003c/span>';\n    else if (st.exec === 'miss') h += '\u003cspan class=\"st nx\" title=\"Not executed by the tests\">○\u003c/span>';\n    if (l.mapRef) h += '\u003cspan class=\"st mr\" title=\"Detailed map: ' + esc(mapTitle(l.mapRef)) + '\">↗\u003c/span>';\n    if (l.notes && l.notes.length) h += '\u003cspan class=\"st nt\" title=\"' + l.notes.length + ' team note(s)\">✎\u003c/span>';\n    return h;\n  }\n  function mapTitle(ref) {\n    const m = MAPS.get(String(ref).split('#')[0]);\n    return m ? m.title : ref;\n  }\n  function mapHref(ref) {\n    const [id, node] = String(ref).split('#');\n    return id + '.html' + (node ? '#' + node : '');\n  }\n  function extrasHtml(l) {\n    const st = STATES[l.id] || {};\n    let h = '';\n    if (l.check && (st.check === 'partial' || st.check === 'unsupported') && l.check.issues && l.check.issues.length) {\n      h += '\u003cdiv class=\"ck-issues ' + (st.check === 'unsupported' ? 'bad' : 'warn') + '\">\u003cb>' + (st.check === 'unsupported' ? '✗ Fact-check failed' : '◑ Partially verified') + '\u003c/b>\u003cul>' + l.check.issues.map((i) => '\u003cli>' + inline(i) + '\u003c/li>').join('') + '\u003c/ul>\u003c/div>';\n    } else if (st.check === 'supported') {\n      h += '\u003cdiv class=\"ck-issues ok\">\u003cb>✓ Fact-checked\u003c/b> — every claim was verified against the code' + (l.check.issues && l.check.issues.length ? ' (' + l.check.issues.map(esc).join('; ') + ')' : '') + '\u003c/div>';\n    }\n    if (st.exec === 'hit') h += '\u003cdiv class=\"ex-line\">▶ Executed by the tests (' + l.exec.count + '×, ' + esc(l.exec.source) + ')\u003c/div>';\n    else if (st.exec === 'miss') h += '\u003cdiv class=\"ex-line nx\">○ Not executed by the tests\u003c/div>';\n    if (l.mapRef) {\n      h += host\n        ? '\u003cbutton class=\"pill maplink\" data-open-map=\"' + esc(l.mapRef) + '\">↗ ' + esc(mapTitle(l.mapRef)) + '\u003c/button>'\n        : '\u003ca class=\"pill maplink\" href=\"' + esc(mapHref(l.mapRef)) + '\">↗ ' + esc(mapTitle(l.mapRef)) + '\u003c/a>';\n    }\n    h += '\u003cdiv class=\"notes\">' + (l.notes || []).map((n) => '\u003cdiv class=\"note-item\">✎ ' + inline(n.text) + ' \u003cspan class=\"na\">— ' + esc(n.author) + ', ' + esc(String(n.at).slice(0, 10)) + '\u003c/span>\u003c/div>').join('') +\n      '\u003cbutton class=\"explain\" data-add-note=\"' + l.id + '\" title=\"Add a team note (not AI-generated)\">+ Note\u003c/button>\u003c/div>';\n    return h;\n  }\n  function addNote(id) {\n    if (host) return host.postMessage({ type: 'addNote', id });\n    const text = window.prompt('Team note for [' + id + '] (saved with the CLI):');\n    if (!text) return;\n    const cmd = 'waymark note ' + doc.id + ' ' + id + ' ' + JSON.stringify(text);\n    try { navigator.clipboard.writeText(cmd); } catch (e) { /* no clipboard */ }\n    window.alert('Run this in the repository (copied to the clipboard):\\n\\n' + cmd);\n  }\n\n  const prefsKey = 'waymark:' + doc.id;\n  const prefs = Object.assign({ root: meta.root || '', editor: 'vscode', mapW: null, view: 'code' }, safeJson(localStorage.getItem(prefsKey)));\n  function safeJson(s) { try { return JSON.parse(s) || {}; } catch { return {}; } }\n  const savePrefs = () => { try { localStorage.setItem(prefsKey, JSON.stringify(prefs)); } catch { /* private mode */ } };\n\n  const state = { sel: null, view: prefs.view === 'diagram' ? 'diagram' : 'code', file: null, explainOpen: new Set(), annoExpl: false };\n\n  // ---------------------------------------------------------------- text helpers\n  const REF_RE = /\\[((?:\\d+[a-z]{1,2})(?:\\s*,\\s*\\d+[a-z]{1,2})*)\\]/g;\n  function refs(html) {\n    return html.replace(REF_RE, (m, list) => {\n      const ids = list.split(/\\s*,\\s*/);\n      if (!ids.every((id) => byId.has(id))) return m;\n      return '\u003cspan class=\"refs\">[' + ids.map((id) => '\u003ca class=\"ref\" data-ref=\"' + id + '\">' + id + '\u003c/a>').join(', ') + ']\u003c/span>';\n    });\n  }\n  function inline(s) {\n    return refs(\n      esc(s)\n        .replace(/`([^`]+)`/g, '\u003ccode>$1\u003c/code>')\n        .replace(/\\*\\*([^*]+)\\*\\*/g, '\u003cstrong>$1\u003c/strong>')\n        .replace(/(^|[^*\\w])\\*([^*\\n]+)\\*(?!\\w)/g, '$1\u003cem>$2\u003c/em>')\n        .replace(/\\[([^\\]]+)\\]\\((https?:[^)\\s]+)\\)/g, '\u003ca href=\"$2\" target=\"_blank\" rel=\"noopener\">$1\u003c/a>'),\n    );\n  }\n  function md(src) {\n    const out = [];\n    let list = null;\n    let para = [];\n    let code = null;\n    const flushPara = () => { if (para.length) { out.push('\u003cp>' + inline(para.join(' ')) + '\u003c/p>'); para = []; } };\n    const closeList = () => { if (list) { out.push('\u003c/' + list + '>'); list = null; } };\n    for (const raw of String(src || '').split(/\\r?\\n/)) {\n      if (code !== null) {\n        if (/^\\s*```/.test(raw)) { out.push('\u003cpre>\u003ccode>' + esc(code.join('\\n')) + '\u003c/code>\u003c/pre>'); code = null; } else code.push(raw);\n        continue;\n      }\n      if (/^\\s*```/.test(raw)) { flushPara(); closeList(); code = []; continue; }\n      const h = raw.match(/^#{1,6}\\s+(.*)/);\n      if (h) { flushPara(); closeList(); out.push('\u003ch5>' + inline(h[1]) + '\u003c/h5>'); continue; }\n      const li = raw.match(/^\\s*([-*]|\\d+\\.)\\s+(.*)/);\n      if (li) {\n        flushPara();\n        const kind = /\\d/.test(li[1]) ? 'ol' : 'ul';\n        if (list !== kind) { closeList(); out.push('\u003c' + kind + '>'); list = kind; }\n        out.push('\u003cli>' + inline(li[2]) + '\u003c/li>');\n        continue;\n      }\n      if (!raw.trim()) { flushPara(); closeList();
