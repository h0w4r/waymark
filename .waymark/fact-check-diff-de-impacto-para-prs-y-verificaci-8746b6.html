 Buffer.from(svg).toString('base64');\n}\n\n/** Hover / tooltip markdown for a node (plain markdown; command links added by the caller). */\nfunction nodeMarkdown(n) {\n  const o = [`**${n.id} · ${n.title}** — _${n.mapTitle} › ${n.traceId}. ${n.traceTitle}_`, '', n.description];\n  const flags = [];\n  if (n.check === 'supported') flags.push('✓ fact-checked');\n  if (n.check === 'partial') flags.push('◑ partially verified');\n  if (n.check === 'unsupported') flags.push('✗ fact-check failed');\n  if (n.exec === 'hit') flags.push(`▶ executed by the tests (${n.execCount}×)`);\n  if (n.exec === 'miss') flags.push('○ not executed by the tests');\n  if (n.mapRef) flags.push(`↗ detailed map: ${n.mapRef}`);\n  if (flags.length) o.push('', flags.join(' · '));\n  if (n.issues && n.issues.length && n.check !== 'supported') o.push('', ...n.issues.map((i) => `- ${i}`));\n  if (n.stale) o.push('', '⚠ The code here changed after this node was explained — the prose may be outdated.');\n  if (n.explanation) o.push('', n.explanation);\n  for (const note of n.notes || []) o.push('', `> ✎ ${note.text} — _${note.author}, ${String(note.at).slice(0, 10)}_`);\n  return o.join('\\n');\n}\n\n/**\n * Navigation history (feeds `waymark suggest`): \u003croot>/.waymark/.local/history.json,\n * a self-ignored folder so it never shows up in git.\n */\nfunction recordVisit(root, relPath, now = Date.now()) {\n  const dir = path.join(root, '.waymark', '.local');\n  if (!fs.existsSync(path.join(root, '.waymark'))) return null;\n  fs.mkdirSync(dir, { recursive: true });\n  const ign = path.join(dir, '.gitignore');\n  if (!fs.existsSync(ign)) fs.writeFileSync(ign, '*\\n');\n  const file = path.join(dir, 'history.json');\n  let h = { files: {} };\n  try {\n    h = JSON.parse(fs.readFileSync(file, 'utf8'));\n  } catch {\n    /* new history */\n  }\n  const e = h.files[relPath] || { visits: 0, last: 0 };\n  e.visits += 1;\n  e.last = now;\n  h.files[relPath] = e;\n  const entries = Object.entries(h.files).sort((a, b) => b[1].last - a[1].last).slice(0, 300);\n  h.files = Object.fromEntries(entries);\n  fs.writeFileSync(file, JSON.stringify(h));\n  return e;\n}\n\n/** Semver-ish comparison: is `a` (e.g. \"0.3.0\" or \"v0.3.0\") newer than `b`? Pre-release tags ignored. */\nfunction isNewer(a, b) {\n  const parse = (v) => String(v || '').replace(/^v/, '').split('-')[0].split('.').map((x) => parseInt(x, 10) || 0);\n  const x = parse(a);\n  const y = parse(b);\n  for (let i = 0; i \u003c Math.max(x.length, y.length); i++) {\n    if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0);\n  }\n  return false;\n}\n\n/** From a GitHub \"latest release\" payload: { version, url (vsix), notes } or null. */\nfunction releaseInfo(rel) {\n  if (!rel || !rel.tag_name || !Array.isArray(rel.assets)) return null;\n  const asset = rel.assets.find((a) => /\\.vsix$/i.test(a.name));\n  if (!asset) return null;\n  return { version: rel.tag_name.replace(/^v/, ''), url: asset.browser_download_url, name: asset.name, notes: rel.html_url };\n}\n\nmodule.exports = { PALETTE, loadWorkspace, normalize, nodeAt, step, gutterSvg, nodeMarkdown, recordVisit, isNewer, releaseInfo };\n"},"maps":[{"id":"arquitectura-general-de-waymark-del-agente-al-vi-798dd7","title":"Arquitectura general de Waymark: del agente al visor, el editor y CI","kind":"overview"},{"id":"waymark-create-flow","title":"waymark_create: from tool call to shareable viewer","kind":"flow"},{"id":"visor-html-de-waymark-render-y-sincronizacion-de-64112a","title":"Visor HTML de Waymark: render y sincronización de panel, código y diagrama","kind":"flow"},{"id":"verificacion-de-deriva-y-reanclaje-de-waymark-8c8a2e","title":"Verificación de deriva y reanclaje de Waymark","kind":"flow"}],"states":{"1a":{"check":"unchecked","exec":"unknown"},"1b":{"check":"unchecked","exec":"unknown"},"1c":{"check":"unchecked","exec":"unknown"},"1d":{"check":"unchecked","exec":"unknown"},"1e":{"check":"unchecked","exec":"unknown"},"1f":{"check":"unchecked","exec":"unknown"},"1g":{"check":"unchecked","exec":"unknown"},"1h":{"check":"unchecked","exec":"unknown"},"1i":{"check":"unchecked","exec":"unknown"},"1j":{"check":"unchecked","exec":"unknown"},"1k":{"check":"unchecked","exec":"unknown"},"2a":{"check":"unchecked","exec":"unknown"},"2b":{"check":"unchecked","exec":"unknown"},"2c":{"check":"unchecked","exec":"unknown"},"2d":{"check":"unchecked","exec":"unknown"},"2e":{"check":"unchecked","exec":"unknown"},"2f":{"check":"unchecked","exec":"unknown"},"2g":{"check":"unchecked","exec":"unknown"},"2h":{"check":"unchecked","exec":"unknown"},"2i":{"check":"unchecked","exec":"unknown"},"2j":{"check":"unchecked","exec":"unknown"},"2k":{"check":"unchecked","exec":"unknown"},"2l":{"check":"unchecked","exec":"unknown"},"3a":{"check":"unchecked","exec":"unknown"},"3b":{"check":"unchecked","exec":"unknown"},"3c":{"check":"unchecked","exec":"unknown"},"3d":{"check":"unchecked","exec":"unknown"},"3e":{"check":"unchecked","exec":"unknown"},"3f":{"check":"unchecked","exec":"unknown"},"3g":{"check":"unchecked","exec":"unknown"},"3h":{"check":"unchecked","exec":"unknown"},"3i":{"check":"unchecked","exec":"unknown"},"3j":{"check":"unchecked","exec":"unknown"},"3k":{"check":"unchecked","exec":"unknown"},"3l":{"check":"unchecked","exec":"unknown"},"4a":{"check":"unchecked","exec":"unknown"},"4b":{"check":"unchecked","exec":"unknown"},"4c":{"check":"unchecked","exec":"unknown"},"4d":{"check":"unchecked","exec":"unknown"},"4e":{"check":"unchecked","exec":"unknown"},"4f":{"check":"unchecked","exec":"unknown"},"4g":{"check":"unchecked","exec":"unknown"},"4h":{"check":"unchecked","exec":"unknown"},"4i":{"check":"unchecked","exec":"unknown"},"4j":{"check":"unchecked","exec":"unknown"},"4k":{"check":"unchecked","exec":"unknown"},"4l":{"check":"unchecked","exec":"unknown"},"4m":{"check":"unchecked","exec":"unknown"},"5a":{"check":"unchecked","exec":"unknown"},"5b":{"check":"unchecked","exec":"unknown"},"5c":{"check":"unchecked","exec":"unknown"},"5d":{"check":"unchecked","exec":"unknown"},"5e":{"check":"unchecked","exec":"unknown"},"5f":{"check":"unchecked","exec":"unknown"},"5g":{"check":"unchecked","exec":"unknown"},"5h":{"check":"unchecked","exec":"unknown"},"5i":{"check":"unchecked","exec":"unknown"},"5j":{"check":"unchecked","exec":"unknown"},"5k":{"check":"unchecked","exec":"unknown"},"5l":{"check":"unchecked","exec":"unknown"}},"markdown":"# Waymark: Fact-check, diff de impacto para PRs y verificación por cobertura en Waymark\n\nWaymark tiene tres formas de comprobar que un mapa sigue siendo fiel al código. La primera es un fact-check hecho por un agente escéptico: arranca con `waymark check` [1a] o con la tool `waymark_check` [1g] y sus veredictos se sellan con huellas en `recordCheck` [2c]. La segunda es un diff de impacto: `diffMaps` [3a] cruza las líneas de `git diff` con el bloque de cada nodo, `renderDiff` [4a] arma el reporte y una GitHub Action lo publica como comentario en el PR [4m]. La tercera es la verificación por ejecución, que pasa la cobertura V8/lcov a marcas hit/miss por nodo [5g] [5h].\n\n_id: `fact-check-diff-de-impacto-para-prs-y-verificaci-8746b6` · commit f58dc268 (main) · updated 2026-10-20 · query: \"¿Cómo funcionan en Waymark la verificación de afirmaciones (fact-check), el análisis de impacto de cambios para PRs (diff) y la verificación por ejecución con cobertura?\"_\n\n## The story\n\n**El problema.** Un mapa de Waymark cuenta con prosa cómo se ejecuta el código, y esa prosa puede ser falsa desde el principio o quedarse vieja cuando cambia el código. Además, nadie sabe a priori si esos caminos se ejecutan de verdad. Waymark ataca el problema por tres frentes: un humano o agente que contrasta lo que dice el mapa, el impacto de cada change set y la cobertura real de los tests.\n\n**El recorrido.**\n\n1. **Fact-check: la entrada (traza 1).** `waymark check \u003cid>` [1a] lanza un agente headless [1b] [1c] con el procedimiento de `checkGuide` [1d], que termina pidiendo veredictos [1e]. El agente empieza llamando a `waymark_check` [1f], que le entrega la guía junto con el mapa completo en markdown [1g] [1h], con explicaciones [1i] y snippets numerados [1j] para contrastar cada afirmación con el código.\n2. **Fact-check: los veredictos (traza 2).** El verificador responde con `waymark_record_check` [2a]. `recordCheck` primero refresca los ctxHash [2b] y después sella cada veredicto con dos huellas: la del código (`ctxHash`) y la de la prosa (`proseHash` [2h]) [2c] [2d]. `checkState` [2g] marca como *stale* cualquier veredicto cuyas huellas ya no coinciden. Ese estado derivado alimenta el resumen [2f], el lint [2j], las marcas del markdown [2k] y el HTML [2l]. Al terminar, la CLI imprime ese resumen [1k].\n3. **Diff de impacto (traza 3).** `diffMaps` [3a] ejecuta `git diff --unified=0` [3c] y parsea los hunks [3d], incluidos los borrados puros [3e]. Para cada nodo calcula el bloque de código que narra [3f] con `contextRange`/`contextIndices` [3g] [3h] y lo cruza con las líneas cambiadas [3i]. Después suma las anclas rotas y la deriva narrativa que detecta `verifyMap` [3j], descarta los mapas sanos [3k] y devuelve el reporte [3l].\n4. **Diff en PRs (traza 4).** `renderDiff` [4a] convierte ese reporte en markdown: una tabla de nodos tocados [4c], las anclas rotas [4d], la prosa por revisar [4e] y la sugerencia de refresh [4f]. El mismo reporte sale por tres canales: la CLI, con salida markdown o JSON y `--fail-on` para romper el build [4g]–[4i]; la tool MCP `waymark_diff` [4j] [4k]; y la GitHub Action, que ejecuta `diff --range` [4l] y comenta en el PR [4m].\n5. **Verificación por ejecución (traza 5).** `waymark exec` [5a] o `waymark_exec` [5b] reciben la cobertura, sea como lcov [5c] o como un comando ejecutado con `NODE_V8_COVERAGE` [5d] [5e]. `applyCoverage` [5f] decide hit o miss por línea ancla [5g] y `recordExec` [5h] lo persiste junto al ctxHash. `execState` [5i] aplica la misma regla de caducidad que `checkState`, y su resultado llega al HTML [5j], al visor [5k] y a la extensión de VS Code [5l].\n\n**Cómo se conectan.** Todo gira alrededor de la huella del bloque de código de cada nodo. El fact-check y la cobertura atan sus resultados al `ctxHash` [2c] [5h], y por eso un cambio en el código los vuelve *stale* sin intervención [2g] [5i]. El diff usa la misma noción de bloque [3f] para avisar *antes* del merge qué nodos y veredictos van a caducar. El HTML calcula ambos estados en el mismo punto [2l] [5j].\n\n**Takeaways.**\n- Un veredicto o una marca de ejecución solo valen mientras coincidan las huellas del código (y de la prosa, en el caso del check). Nada se invalida a mano.\n- `diffMaps` [3a] es la única fuente del impacto, y la CLI, el MCP y la Action solo cambian el formato y el destino.\n- El fact-check lo hace un agente externo. Waymark le da el guion [1d] y el material [1g], y se limita a guardar y derivar los estados [2a]–[2g].\n\n## Trace 1: Fact-check: procedimiento y entrada (CLI check / MCP waymark_check)\n\nCómo `waymark check` o la tool MCP `waymark_check` entregan a un verificador escéptico el procedimiento y el mapa completo a contrastar con el código.\n\n### Motivation\n\nUn mapa de Waymark es prosa escrita por un agente, y la prosa puede afirmar cosas que el código no hace. El fact-check existe para que un segundo agente, que **no** escribió el mapa, revise cada afirmación contra el código real. Para que eso funcione hacen falta dos cosas: un procedimiento claro y estricto (qué verificar, cómo corregir, cómo emitir veredictos) y el mapa entero en un formato que un agente lea bien, con narrativa y fragmentos de código. Esta traza muestra cómo se arma ese paquete, tanto desde la CLI como desde el servidor MCP.\n\n### Details\n\nTodo empieza en la CLI: el despachador de comandos enruta `waymark check \u003cid>` a la función `check` [1a]. Esta carga el mapa y lanza un agente headless con el texto de `checkGuide` más la instrucción de empezar llamando a `waymark_check` [1b]. `runAgent` envuelve esa tarea con la raíz del repo y la restricción de herramientas de solo lectura y arranca Claude Code o Codex como proceso hijo [1c].\n\nEl contenido de la tarea lo define `checkGuide` [1d]: presenta al agente como un fact-checker que no escribió el mapa y le da un procedimiento paso a paso, cuyo punto culminante es registrar veredictos `supported` / `partial` / `unsupported` con `waymark_record_check` [1e].\n\nYa dentro del agente, la primera llamada es a la tool MCP `waymark_check` [1f], de solo lectura. Su handler concatena de nuevo el procedimiento con el mapa renderizado en markdown con `detail: 'full'` [1g]. `renderMarkdown` [1h] arma la cabecera y recorre cada traza; por cada ubicación incluye la explicación narrativa [1i] y el fragmento de código numerado, marcando con `>` la línea anclada [1j]. Con eso el verificador tiene todo lo necesario para contrastar.\n\nLa traza termina cuando el verificador llama a `waymark_record_check`. Desde la CLI, cuando el agente termina, `check` vuelve a cargar el mapa y muestra el resumen con `checkSummary` [1k]; cómo se guardan y evalúan esos veredictos es tema de la traza 2.\n\n### Arranque de un fact-check\n\n```text\n├── Entrada humana: waymark check \u003cid>\n│   └── [1a] Comando CLI check  src/cli.js:338\n│       └── (tarea = checkGuide + 'llama waymark_check') [1b] Lanza el agente verificador  src/cli.js:258\n│           ├── (construye el prompt) [1d] checkGuide: rol del verificador  src/procedures.js:8\n│           │   └── (paso final del procedimiento) [1e] Paso: registrar veredictos  src/procedures.js:17\n│           ├── (spawn claude/codex) [1c] runAgent arranca el proceso  src/cli.js:192\n│           └── (agente termina → recarga mapa) [1k] Resumen tras el agente  src/cli.js:259\n└── Entrada agéntica: tool MCP\n    └── (primera llamada del verificador) [1f] Tool MCP waymark_check  src/mcp.js:315\n        └── [1g] Une guía y mapa completo  src/mcp.js:325\n            ├── (mismo guion que la CLI) [1d] checkGuide (procedimiento)  src/procedures.js:8\n            ├── (detail: 'full') [1h] renderMarkdown  src/render/markdown.js:97\n            │   └── renderTrace → renderLoc por nodo\n            │       ├── (narrativa) [1i] Incluye la explicación  src/render/markdown.js:50\n            │       └── (código numerado) [1j] Fragmento de código numerado  src/render/markdown.js:52\n            └── (veredictos) verificador → waymark_record_check (traza 2)\n```\n\n- **[1a] Comando CLI check** — `src/cli.js:338` (`main`)\n  El despachador de la CLI enruta `waymark check \u003cid>` a la función check.\n  Es la puerta de entrada humana al fact-check: el usuario escribe `waymark check \u003cid>` y el `switch` del CLI llega a este caso. Solo pasa el primer argumento posicional (el id del mapa) a `check`, que hace todo el trabajo [1b]. Opciones como `--engine` o `--open` se leen después desde el objeto global `opt`. Si falta el id, `check` lanza un error con el uso correcto.\n  ```\n     335          }),\n     336        );\n     337      }\n  >  338      case 'check':\n     339        return check(rest[0]);\n     340      case 'note': {\n     341        if (!rest[0] || !rest[1]) throw new Error('Usage: waymark note \u003cid> \u003cnode> \"\u003ctext>\" [--author \u003cname>] [--remove \u003cindex>]');\n     342        const res = noteMap(root(), rest[0], rest[1], { text: rest.slice(2).join(' '), author: opt.author, remove: opt.remove != null ? Number(opt.remove) : null });\n     343        return out(`✔ ${res.id} [${res.node}]: ${res.notes.length} note(s)`);\n     344      }\n     345      case 'notes': {\n     346        const doc = loadMap(root(), rest[0]);\n     347        for (const t of doc.traces) for (const l of t.locations) (l.notes || []).forEach((n, i) => out(`[${l.id}] #${i} ${n.author} ${String(n.at).slice(0, 10)}: ${n.text}`));\n     348        return;\n     349      }\n     350      case 'diff': {\n     351        const rep = diffMaps(root(), rest[0] || 'HEAD huellas [2c]; la huella de prosa sale de `proseHash` [2h], que resume título, descripción y explicación. Las trazas reciben su propio `check` con un `traceHash` [2d]. Al final se recalcula `meta.check` con `checkSummary` [2e], que recorre todos los nodos y cuenta cuántos caen en cada estado [2f].\n\nEl estado lo decide `checkState` [2g]: sin `check` es 'unchecked'; si alguna huella no coincide es 'stale'; si no, el veredicto guardado. Cuando el mapa se vuelve a guardar o reanclar, el store solo arrastra el `check` anterior si ambas huellas siguen iguales [2i].\n\nLos consumidores leen siempre a través de `checkState`: `lint` convierte 'unsupported' en error y 'partial' en aviso [2j], el renderer markdown añade marcas ✓/◑/✗ para los agentes [2k] y el renderer HTML precalcula los estados por nodo para que el visor del navegador no tenga que hashear [2l].\n\n### Ciclo de vida de un veredicto de fact-check\n\n```text\n├── [2a] Tool waymark_record_check  src/mcp.js:331\n│   └── (delega) recordCheck(root, id, v)\n│       ├── [2b] Refrescar hashes de contexto  src/store.js:141\n│       ├── por cada nodo / traza\n│       │   ├── (nodo válido) [2c] Sellar veredicto de nodo  src/store.js:151\n│       │   │   └── (huella de prosa) [2h] proseHash  src/state.js:8\n│       │   └── (traza válida) [2d] Sellar veredicto de traza  src/store.js:159\n│       └── [2e] Recalcular meta.check  src/store.js:162\n│           ├── [2f] checkSummary cuenta estados  src/store.js:171\n│           │   └── (estado derivado) [2g] checkState deriva el estado  src/state.js:13\n│           └── persist + writeHtml\n│               └── (states por nodo) [2l] Estados precalculados HTML  src/render/html.js:32\n├── al re-guardar el mapa\n│   └── (mismas huellas) [2i] Arrastre al re-guardar  src/store.js:98\n└── consumidores vía checkState\n    ├── (error / aviso) [2j] Lint de veredictos  src/lint.js:66\n    └── (marcas ✓ ◑ ✗) [2k] Marcas en markdown  src/render/markdown.js:41\n```\n\n- **[2a] Tool waymark_r aciones puras se marcan alrededor del corte [3e] para que un borrado también cuente como impacto.\n\nCon ese `Map\u003carchivo, Set\u003clínea>>`, diffMaps recorre cada mapa, traza y ubicación. Para las ubicaciones de archivos cambiados calcula el rango del bloque que el nodo describe [3f] usando contextRange de anchor.js [3g], que a su vez se apoya en contextIndices [3h]: la línea ancla más su cuerpo indentado (o unas cuantas líneas hermanas si es una sentencia suelta). Las líneas cambiadas que caen dentro de ese rango [3i] convierten al nodo en «tocado».\n\nEl diff de líneas no ve todo: un ancla puede haberse movido o desaparecido, y la prosa puede haber quedado vieja aunque el bloque no esté en el diff. Por eso se ejecuta además verifyMap [3j] y se filtran las anclas `unresolved`/`missing`. Los mapas sin nodos tocados, sin anclas rotas y sin deriva se descartan [3k], y el resultado final es un objeto plano `{ base, range, files, maps }` [3l] listo para que otra capa lo renderice o lo publique en un PR.\n\n### Cálculo de impacto de un change set sobre los mapas\n\n```text\n└── [3a] Entrada diffMaps  src/diff.js:48\n    ├── (base, range) [3b] Pedir líneas cambiadas  src/diff.js:49\n    │   └── (spawn git) [3c] git diff --unified=0  src/diff.js:20\n    │       └── (stdout) por cada línea: +++ fija archivo actual\n    │           └── (@@ hunk) [3d] Parsear cabecera de hunk  src/diff.js:32\n    │               └── (count === 0) [3e] Borrado puro  src/diff.js:37\n    ├── (Map\u003carchivo, Set\u003clínea>>) por cada mapa → traza → ubicación en archivo cambiado\n    │   ├── (líneas del archivo) [3f] Rango del bloque del nodo  src/diff.js:61\n    │   │   └── (idx ancla) [3g] contextRange  src/anchor.js:196\n    │   │       └── (indentación) [3h] contextIndices  src/anchor.js:169\n    │   └── ([desde, hasta]) [3i] Intersección con el diff  src/diff.js:62\n    ├── (doc.id) [3j] Anclas rotas y deriva  src/diff.js:66\n    │   └── (touched, broken, narrative) [3k] Descartar m ue un pipeline pueda bloquear el merge.\n\nPara agentes, la tool MCP `waymark_diff` [4j] acepta `base`, `range` y `format` y su handler [4k] reutiliza exactamente diffMaps + renderDiff, de modo que el agente ve lo mismo que el humano.\n\nFinalmente el workflow `waymark-pr.yml` ejecuta la CLI contra `origin/\u003cbase_ref>` con `--range` y guarda el markdown en un archivo [4l]; luego `gh pr comment --edit-last` actualiza el comentario anterior o, si no existe, crea uno nuevo [4m], evitando llenar el PR de comentarios repetidos.\n\n### Del reporte de impacto al comentario del PR\n\n```text\n├── (recibe reporte de diffMaps) [4a] renderDiff  src/diff.js:75\n│   ├── (maps vacío) [4b] Sin flujos afectados  src/diff.js:76\n│   └── por cada mapa afectado\n│       ├── (touched) [4c] Tabla de nodos tocados  src/diff.js:82\n│       ├── (broken) [4d] Anclas rotas  src/diff.js:84\n│       ├── (drift.stale) [4e] Prosa por revisar  src/diff.js:91\n│       └── [4f] Sugerir refresh  src/diff.js:93\n└── Canales de salida\n    ├── (terminal) [4g] Comando CLI diff  src/cli.js:351\n    │   ├── (markdown | json) [4h] Salida markdown o JSON  src/cli.js:352\n    │   └── (--fail-on) [4i] Fallar el build  src/cli.js:358\n    ├── (agente) [4j] Registro waymark_diff  src/mcp.js:369\n    │   └── (renderDiff(rep)) [4k] Handler MCP  src/mcp.js:384\n    └── GitHub Action (pull_request)\n        ├── (invoca CLI con --range) [4l] Action ejecuta diff  .github/workflows/waymark-pr.yml:18\n        └── (waymark-report.md) [4m] Comentar en el PR  .github/workflows/waymark-pr.yml:23\n```\n\n- **[4a] renderDiff** — `src/diff.js:75` (`renderDiff`)\n  Punto único que convierte el reporte de impacto en markdown.\n  Aquí llega el reporte que produjo diffMaps: la base, los archivos cambiados y la lista de mapas afectados. renderDiff no recalcula nada; solo decide cómo contarlo en markdown. Es la misma función que usan la CLI [4g], la tool MCP [4k] y, a través de la CLI, la GitHub Action [4l]. Mantenerla pura (r s líneas para declaraciones no instrumentadas. [5h] `recordExec` guarda en cada ubicación un objeto `exec` con el `ctxHash` vigente, actualiza `meta.exec` con el resumen y reescribe JSON y HTML.\n\nLa lectura pasa siempre por [5i] `execState`, que devuelve `hit`, `miss`, `unknown` o `stale` (si el `ctxHash` cambió desde la corrida). El HTML precalcula estos estados en [5j], el visor pinta la insignia ▶/○ en [5k], y la extensión de VS Code replica la misma regla sin dependencias en [5l].\n\n### De la cobertura a los nodos ejecutados\n\n```text\n├── Entradas\n│   ├── [5a] CLI exec  src/cli.js:361\n│   │   ├── --lcov \u003carchivo>\n│   │   │   └── (texto lcov) [5c] parseLcov  src/coverage.js:19\n│   │   └── -- \u003ccomando>\n│   │       └── (spawn + NODE_V8_COVERAGE) [5d] runWithV8Coverage  src/coverage.js:93\n│   │           └── (dir temporal) [5e] parseV8Dir  src/coverage.js:39\n│   └── [5b] MCP waymark_exec (lcov | command)  src/mcp.js:390\n├── (Map(ruta → línea → conteo)) [5f] applyCoverage  src/coverage.js:129\n│   └── por cada mapa (id o todos)\n│       ├── (doc + cobertura) [5g] execResults  src/coverage.js:111\n│       └── ({ nodo: { hit, count } }) [5h] recordExec  src/store.js:178\n│           └── persist JSON + writeHtml\n└── Lectura del estado\n    ├── (l.exec vs ctxHash) [5i] execState  src/state.js:18\n    │   ├── (states[id].exec) [5j] Estados precalculados HTML  src/render/html.js:32\n    │   │   └── (STATES) [5k] Insignia ▶/○ en visor  src/render/viewer.client.js:55\n    │   └── renderMarkdown: ▶ executed by the tests\n    └── [5l] copia en vscode/lib/model.js  vscode/lib/model.js:84\n```\n\n- **[5a] CLI exec** — `src/cli.js:361` (`main`)\n  La CLI elige lcov o comando con V8 y aplica la cobertura.\n  Aquí empieza todo cuando alguien escribe `waymark exec`. Si viene `--lcov`, lee el archivo y lo pasa a [5c]; si hay un comando después de `--`, lo ejecuta con [5d] y avisa si terminó con error, aunque la cobertura se aplica igual. Un id de mapa opcional los nodos y cuenta cuántos caen en cada estado [2f].\n\nEl estado lo decide `checkState` [2g]: sin `check` es 'unchecked'; si alguna huella no coincide es 'stale'; si no, el veredicto guardado. Cuando el mapa se vuelve a guardar o reanclar, el store solo arrastra el `check` anterior si ambas huellas siguen iguales [2i].\n\nLos consumidores leen siempre a través de `checkState`: `lint` convierte 'unsupported' en error y 'partial' en aviso [2j], el renderer markdown añade marcas ✓/◑/✗ para los agentes [2k] y el renderer HTML precalcula los estados por nodo para que el visor del navegador no tenga que hashear [2l].\n\n### Ciclo de vida de un veredicto de fact-check\n\n```text\n├── [2a] Tool waymark_record_check  src/mcp.js:331\n│   └── (delega) recordCheck(root, id, v)\n│       ├── [2b] Refrescar hashes de contexto  src/store.js:141\n│       ├── por cada nodo / traza\n│       │   ├── (nodo válido) [2c] Sellar veredicto de nodo  src/store.js:151\n│       │   │   └── (huella de prosa) [2h] proseHash  src/state.js:8\n│       │   └── (traza válida) [2d] Sellar veredicto de traza  src/store.js:159\n│       └── [2e] Recalcular meta.check  src/store.js:162\n│           ├── [2f] checkSummary cuenta estados  src/store.js:171\n│           │   └── (estado derivado) [2g] checkState deriva el estado  src/state.js:13\n│           └── persist + writeHtml\n│               └── (states por nodo) [2l] Estados precalculados HTML  src/render/html.js:32\n├── al re-guardar el mapa\n│   └── (mismas huellas) [2i] Arrastre al re-guardar  src/store.js:98\n└── consumidores vía checkState\n    ├── (error / aviso) [2j] Lint de veredictos  src/lint.js:66\n    └── (marcas ✓ ◑ ✗) [2k] Marcas en markdown  src/render/markdown.js:41\n```\n\n- **[2a] Tool waymark_record_check** — `src/mcp.js:331` (`waymark_record_check`)\n  Registra la tool MCP que recibe veredictos de nodos, trazas e historia.\n  Este es el punto de entrada para el agente verificador, normalmente un subagente nuevo que no escribió el map stado humano de la versión anterior a la nueva, nodo por nodo. Para el fact-check aplica la misma regla que `checkState` [2g]: solo se conserva si código y prosa siguen idénticos. Así un veredicto obsoleto no sobrevive a una regeneración y se descarta en vez de quedarse como 'stale' para siempre. Las trazas usan la comparación equivalente con `traceHash`.\n  ```\n      95        const o = old.get(l.id);\n      96        if (!o) continue;\n      97        if (o.notes?.length) l.notes = o.notes;\n  >   98        if (o.check && o.check.ctxHash === l.ctxHash && o.check.proseHash === proseHash(l)) l.check = o.check;\n      99        if (o.exec && o.exec.ctxHash === l.ctxHash) l.exec = o.exec;\n     100      }\n     101    }\n     102  }\n     103  \n     104  \n     105  /** Adds (or removes, with remove=index) a human note on a node. Not AI prose: never rewritten by agents. */\n     106  export function noteMap(root, id, nodeId, { text = '', author = '', remove = null } = {}) {\n     107    const doc = loadMap(root, id);\n     108    const l = doc.traces.flatMap((t) => t.locations).find((x) => x.id === nodeId);\n     109    if (!l) throw new Error(`Node \"${nodeId}\" not found in ${doc.id}`);\n     110    l.notes = l.notes || [];\n     111    if (remove != null) {\n     112      if (!l.notes[remove]) throw new Error(`Note #${remove} not found on [${nodeId}]`);\n  ```\n- **[2j] Lint de veredictos** — `src/lint.js:66`\n  Lint convierte unsupported en error y partial en aviso.\n  `lint` recorre los nodos y pide su estado a `checkState` [2g]. Un 'unsupported' vigente es un error que hace fallar el lint (y por tanto el CI), con los `issues` del verificador como mensaje; un 'partial' es solo un aviso. Los 'stale' no se reportan aquí: un veredicto viejo no prueba nada en ningún sentido. Para trazas y la historia se aplica lo mismo, comprobando además que el `traceHash` siga coincidiendo.\n  ```\n      63    for (const t of doc.traces) {\n      64      for (const l of t.locatio      44    else if (cs === 'unsupported') flags.push(`✗ fact-check failed: ${(loc.check.issues || []).join('; ')}`);\n      45    const es = execState(loc);\n      46    if (es === 'hit') flags.push(`▶ executed by the tests (${loc.exec.count}×)`);\n      47    else if (es === 'miss') flags.push('○ not executed by the tests');\n      48    if (loc.mapRef) flags.push(`→ detailed map: waymark://${loc.mapRef.replace('#', '/')}`);\n      49    if (flags.length) o.push(`  _${flags.join(' · ')}_`);\n      50    if (full && loc.explanation) o.push(`  ${loc.explanation.replace(/\\n/g, '\\n  ')}`);\n      51    for (const n of loc.notes || []) o.push(`  > 📝 Team note (${n.author}, ${String(n.at).slice(0, 10)}): ${n.text}`);\n      52    if (full && loc.snippet?.code) {\n      53      const numbered = loc.snippet.code\n      54        .split('\\n')\n      55        .map((l, i) => {\n  ```\n- **[2l] Estados precalculados HTML** — `src/render/html.js:32` (`renderHtml`)\n  El visor HTML embebe el estado de cada nodo ya calculado.\n  El navegador no puede calcular SHA-1 de forma síncrona, así que `renderHtml` deriva los estados en el servidor y los mete en `data.states`. El cliente del visor solo lee `states[id].check` para pintar la insignia del nodo. Como `writeHtml` se invoca al final de `recordCheck` [2e], el HTML queda al día en cuanto se registran veredictos; si luego cambia el código, el siguiente render mostrará 'stale'.\n  ```\n      29      maps,\n      30      // Precomputed per-node state (fact-check verdict validity needs hashes the browser can't do sync).\n      31      states: Object.fromEntries(\n  >   32        doc.traces.flatMap((t) => t.locations.map((l) => [l.id, { check: checkState(l), exec: execState(l) }])),\n      33      ),\n      34      markdown: renderMarkdown(doc, { detail: 'full' }),\n      35      // Smaller context blocks for \"copy trace / node as context\".\n      36      traceMd: Object.fromEntries(doc.traces.map((t) => [t.id, renderMarkdown(doc,  a nodos afectados\n\nCómo diffMaps convierte un git diff en la lista de mapas, nodos tocados, anclas rotas y prosa desactualizada.\n\n### Motivation\n\nUn mapa de Waymark es valioso mientras describe el código real; el peligro es que un PR toque justo las líneas que un nodo explica y nadie se entere. diff.js responde a la pregunta «¿qué flujos documentados rompe o desactualiza este cambio?» sin necesidad de un LLM: basta cruzar los números de línea que git reporta con el bloque de código que cada nodo narra, y complementarlo con la verificación de anclas y de deriva narrativa que ya existe.\n\n### Details\n\nTodo arranca en diffMaps [3a], que lo primero que hace es pedir el conjunto de líneas cambiadas [3b]. changedLines lanza `git diff --unified=0` [3c], ya sea contra el working tree (base `HEAD` = cambios sin commitear) o como rango `base...HEAD` contra el merge-base para un PR. Con contexto cero, cada hunk dice exactamente qué líneas de la versión nueva cambiaron; la expresión regular de cabecera de hunk [3d] extrae inicio y cantidad, y las eliminaciones puras se marcan alrededor del corte [3e] para que un borrado también cuente como impacto.\n\nCon ese `Map\u003carchivo, Set\u003clínea>>`, diffMaps recorre cada mapa, traza y ubicación. Para las ubicaciones de archivos cambiados calcula el rango del bloque que el nodo describe [3f] usando contextRange de anchor.js [3g], que a su vez se apoya en contextIndices [3h]: la línea ancla más su cuerpo indentado (o unas cuantas líneas hermanas si es una sentencia suelta). Las líneas cambiadas que caen dentro de ese rango [3i] convierten al nodo en «tocado».\n\nEl diff de líneas no ve todo: un ancla puede haberse movido o desaparecido, y la prosa puede haber quedado vieja aunque el bloque no esté en el diff. Por eso se ejecuta además verifyMap [3j] y se filtran las anclas `unresolved`/`missing`. Los mapas sin nodos tocados, sin anclas rotas y sin deriva se descartan [3k], y el resultado final es un objeto plano `{ base, range, files, maps }` [3l] listo para que otra capa lo renderice o lo publique en un PR.\n\n### Cálculo de impacto de un change set sobre los mapas\n\n```text\n└── [3a] Entrada diffMaps  src/diff.js:48\n    ├── (base, range) [3b] Pedir líneas cambiadas  src/diff.js:49\n    │   └── (spawn git) [3c] git diff --unified=0  src/diff.js:20\n    │       └── (stdout) por cada línea: +++ fija archivo actual\n    │           └── (@@ hunk) [3d] Parsear cabecera de hunk  src/diff.js:32\n    │               └── (count === 0) [3e] Borrado puro  src/diff.js:37\n    ├── (Map\u003carchivo, Set\u003clínea>>) por cada mapa → traza → ubicación en archivo cambiado\n    │   ├── (líneas del archivo) [3f] Rango del bloque del nodo  src/diff.js:61\n    │   │   └── (idx ancla) [3g] contextRange  src/anchor.js:196\n    │   │       └── (indentación) [3h] contextIndices  src/anchor.js:169\n    │   └── ([desde, hasta]) [3i] Intersección con el diff  src/diff.js:62\n    ├── (doc.id) [3j] Anclas rotas y deriva  src/diff.js:66\n    │   └── (touched, broken, narrative) [3k] Descartar mapas sanos  src/diff.js:68\n    └── (maps[]) [3l] Objeto de reporte  src/diff.js:71\n```\n\n- **[3a] Entrada diffMaps** — `src/diff.js:48` (`diffMaps`)\n  Punto de entrada: reporte de mapas afectados por un change set\n  Aquí entra cualquiera que quiera saber el impacto de un cambio: la CLI, el MCP o la Action de PR. Recibe la raíz del repo, una base (por defecto `HEAD`) y la bandera `range`. Con `range=false` compara la base contra el working tree; con `range=true` compara contra el merge-base, que es lo que interesa en un PR. Todo lo demás de la traza ocurre dentro de esta función, hasta el objeto que devuelve en [3l].\n  ```\n      45  }\n      46  \n      47  /** Report of the maps affected by a change set. */\n  >   48  export function diffMaps(root, base = 'HEAD', { range = false } = {}) {\n      49    const changes = changedLines(root, base, { range });\n      50    const cache = new FileCache(root);\n      51 ck, diff de impacto para PRs y verificación por cobertura en Waymark\n\nWaymark tiene tres formas de comprobar que un mapa sigue siendo fiel al código. La primera es un fact-check hecho por un agente escéptico: arranca con `waymark check` [1a] o con la tool `waymark_check` [1g] y sus veredictos se sellan con huellas en `recordCheck` [2c]. La segunda es un diff de impacto: `diffMaps` [3a] cruza las líneas de `git diff` con el bloque de cada nodo, `renderDiff` [4a] arma el reporte y una GitHub Action lo publica como comentario en el PR [4m]. La tercera es la verificación por ejecución, que pasa la cobertura V8/lcov a marcas hit/miss por nodo [5g] [5h].\n\n_id: `fact-check-diff-de-impacto-para-prs-y-verificaci-8746b6` · commit f58dc268 (main) · updated 2026-10-20 · query: \"¿Cómo funcionan en Waymark la verificación de afirmaciones (fact-check), el análisis de impacto de cambios para PRs (diff) y la verificación por ejecución con cobertura?\"_\n\n## Trace 4: Diff en PRs: renderDiff, CLI/MCP y GitHub Action\n\nCómo el reporte de diffMaps se convierte en markdown y llega al terminal, al agente MCP y al comentario del PR.\n\n### Motivation\n\nCalcular qué nodos toca un cambio solo sirve si alguien lo ve en el momento justo: el desarrollador en su terminal, el agente que está editando código y el revisor que abre el PR. Por eso el mismo reporte se expone por tres puertas (CLI, MCP y GitHub Action) y todas comparten un único renderizador de markdown, para que el mensaje sea idéntico donde se lea. La CLI además puede fallar el build si el cambio rompe anclas o deja prosa desfasada.\n\n### Details\n\nTodo empieza con un reporte ya calculado (traza 3) que `renderDiff` [4a] transforma en markdown. Si ningún mapa se ve afectado, devuelve un mensaje corto con el número de archivos cambiados [4b]; si no, recorre cada mapa y arma una tabla de nodos tocados [4c], una advertencia de anclas rotas [4d], una línea de prosa por revisar a partir de la deriva narrativa [4e] y cierra con la cómo *debería* fluir la ejecución, pero nada garantiza que los tests realmente pasen por esos puntos. La verificación por ejecución cierra ese hueco: toma la cobertura real de una corrida (V8 para Node, lcov para cualquier lenguaje) y marca cada nodo como ejecutado o no, de modo que el lector sepa qué partes del mapa están respaldadas por código que corrió de verdad, y cuándo esa evidencia quedó obsoleta porque el código cambió.\n\n### Details\n\nHay dos puertas de entrada que hacen lo mismo. La CLI, en `case 'exec'` [5a], acepta `--lcov \u003carchivo>` o un comando tras `--`; la tool MCP `waymark_exec` [5b] recibe `lcov` o `command` como parámetros. En ambos casos el resultado intermedio tiene el mismo formato: un `Map(rutaRelativa → Map(línea → conteo))`.\n\nSi llega un lcov, [5c] `parseLcov` recorre las líneas `SF:`/`DA:` y suma conteos por archivo. Si llega un comando, [5d] `runWithV8Coverage` lo lanza con `NODE_V8_COVERAGE` apuntando a un directorio temporal (los procesos hijos también quedan cubiertos) y luego [5e] `parseV8Dir` traduce los rangos de bytes de V8 a líneas, sondeando el último carácter no blanco de cada línea y dejando que los rangos internos sobrescriban a los externos.\n\nCon la cobertura en mano, [5f] `applyCoverage` elige los mapas objetivo (uno o todos) y para cada uno [5g] `execResults` decide hit/miss por nodo, con un pequeño respaldo de hasta tres líneas para declaraciones no instrumentadas. [5h] `recordExec` guarda en cada ubicación un objeto `exec` con el `ctxHash` vigente, actualiza `meta.exec` con el resumen y reescribe JSON y HTML.\n\nLa lectura pasa siempre por [5i] `execState`, que devuelve `hit`, `miss`, `unknown` o `stale` (si el `ctxHash` cambió desde la corrida). El HTML precalcula estos estados en [5j], el visor pinta la insignia ▶/○ en [5k], y la extensión de VS Code replica la misma regla sin dependencias en [5l].\n\n### De la cobertura a los nodos ejecutados\n\n```text\n├── Entradas\n│   ├── [5a] CLI exec  src/cli.js:361\n│
