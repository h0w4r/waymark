s = (t.tree || []).map((n) => mk(n, 0, null));\n      // Tidy tree, except that 3+ leaf children are stacked in a column under their parent\n      // (with an elbow spine) instead of being spread horizontally: keeps clusters compact.\n      const stackable = (n) => n.children.length >= 3 && n.children.every((c) => !c.children.length);"},"ctxHash":"374f1928d55d","narrativeHash":"374f1928d55d"},{"id":"5c","title":"Ancho de subárbol","description":"Primera pasada: ancho de cada subárbol; apila 3+ hojas en columna.","explanation":"Una hoja ocupa `NODE_W`; un padre ocupa la suma de sus hijos más los huecos, o `NODE_W` si es más ancho. La excepción es `stackable`: si un nodo tiene tres o más hijos y todos son hojas, no se reparten en horizontal sino que se apilan en columna bajo el padre (`n.stack`), y el subárbol mide solo `NODE_W + STACK_IN`. Sin esa regla, un padre con ocho hojas producía un cluster de casi 2000 px y el diagrama quedaba ilegible al encajarlo. Este cálculo de abajo arriba es la base del «tidy tree»: hace falta saber cuánto mide cada subárbol antes de colocarlo en [5d].","path":"src/render/viewer.client.js","lineNumber":433,"lineContent":"const width = (n) => {","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":430,"code":"      // Tidy tree, except that 3+ leaf children are stacked in a column under their parent\n      // (with an elbow spine) instead of being spread horizontally: keeps clusters compact.\n      const stackable = (n) => n.children.length >= 3 && n.children.every((c) => !c.children.length);\n      const width = (n) => {\n        if (!n.children.length) return (n.w = NODE_W);\n        if (stackable(n)) {\n          n.stack = true;\n          for (const c of n.children) { c.stacked = true; if (c.via) c.h += 14; width(c); }\n          return (n.w = NODE_W + STACK_IN);\n        }\n        const cw = n.children.reduce((s, c) => s + width(c), 0) + HGAP * (n.children.length - 1);\n        return (n.w = Math.max(NODE_W, cw));\n      };\n      const place = (n, left, top) => {\n        n.y = top + (n.stacked ? 0 : (LOC_H - n.h) / 2);\n        if (!n.children.length) { n.x = left + (n.w - NODE_W) / 2; return; }\n        if (n.stack) {\n          n.x = left;"},"ctxHash":"c175eaab4c5a","narrativeHash":"c175eaab4c5a"},{"id":"5d","title":"Colocación centrada","description":"Segunda pasada: coloca hijos en fila o en columna y centra al padre.","explanation":"Recibe la esquina superior (`left`, `top`) del espacio que [5c] reservó. En el caso normal los hijos se colocan de izquierda a derecha una fila más abajo (`top + ROW_H`) y el padre se centra entre el primero y el último hijo. Si el nodo está marcado como `stack`, los hijos van uno debajo de otro con una sangría de `STACK_IN`, y `renderDiagram` los une al padre con un codo que baja por la izquierda; la etiqueta `via` se pinta dentro de la tarjeta porque no hay hueco para ponerla sobre la arista. Como `y` ya no depende de la profundidad sino de dónde termina cada columna, un árbol con hojas apiladas crece hacia abajo en lugar de a lo ancho. El orden de los hijos en el JSON sigue siendo el orden visual, por eso el árbol debe ir en orden de ejecución.","path":"src/render/viewer.client.js","lineNumber":443,"lineContent":"const place = (n, left, top) => {","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":440,"code":"        const cw = n.children.reduce((s, c) => s + width(c), 0) + HGAP * (n.children.length - 1);\n        return (n.w = Math.max(NODE_W, cw));\n      };\n      const place = (n, left, top) => {\n        n.y = top + (n.stacked ? 0 : (LOC_H - n.h) / 2);\n        if (!n.children.length) { n.x = left + (n.w - NODE_W) / 2; return; }\n        if (n.stack) {\n          n.x = left;\n          let cy = top + LOC_H + 22;\n          for (const c of n.children) { place(c, left + STACK_IN, cy); cy += c.h + 12; }\n          return;\n        }\n        const cw = n.children.reduce((s, c) => s + c.w, 0) + HGAP * (n.children.length - 1);\n        let cx = left + (n.w - cw) / 2;\n        for (const c of n.children) { place(c, cx, top + ROW_H); cx += c.w + HGAP; }\n        n.x = (n.children[0].x + n.children[n.children.length - 1].x) / 2;\n      };\n      let x = 0;"},"ctxHash":"6723f3fa9e1c","narrativeHash":"6723f3fa9e1c"},{"id":"5e","title":"Clústeres en filas","description":"Reparte clústeres en filas y calcula coordenadas absolutas.","explanation":"Funciona como el ajuste de línea de un texto: cada clúster se añade a la fila actual hasta que no cabe, y entonces salta a la siguiente. El ancho máximo es 1700 px o el del clúster más ancho. Después se calculan `ax`/`ay` absolutos de cada nodo, que usan aristas, enlaces, `foreignObject` y `centerOn`.","path":"src/render/viewer.client.js","lineNumber":476,"lineContent":"if (cx > 0 && cx + c.w > maxRow) { cx = 0; cy += rowH + CGAP; rowH = 0; }","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":473,"code":"      let rowH = 0;\n      let w = 0;\n      for (const c of clusters) {\n        if (cx > 0 && cx + c.w > maxRow) { cx = 0; cy += rowH + CGAP; rowH = 0; }\n        if (apply) { c.x = cx; c.y = cy; }\n        cx += c.w + CGAP;\n        w = Math.max(w, cx - CGAP);\n        rowH = Math.max(rowH, c.h);\n      }\n      return { w, h: cy + rowH };\n    };\n    const vr = svg.getBoundingClientRect();\n    const vw = vr.width || 1200;\n    const vh = vr.height || 800;\n    const widest = Math.max(...clusters.map((c) => c.w));\n    const total = clusters.reduce((s, c) => s + c.w + CGAP, 0);\n    let best = widest;\n    let bestK = 0;"},"ctxHash":"9febb4922db4","narrativeHash":"9febb4922db4"},{"id":"5f","title":"Índice primary","description":"Mapea id de ubicación a su nodo canónico en el diagrama.","explanation":"Es el equivalente en el diagrama de `byId` [2c]: dado un id, devuelve el nodo donde enfocar o centrar. Los enlaces cruzados de `doc.links` se resuelven contra él y se descartan si algún extremo no existe. `select` [6d] y el botón ◎ lo usan para localizar el nodo seleccionado.","path":"src/render/viewer.client.js","lineNumber":499,"lineContent":"const primary = new Map(nodes.filter((n) => n.kind === 'loc').map((n) => [n.loc.id, n]));","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":496,"code":"    }\n    flow(best, true);\n    for (const c of clusters) for (const n of c.nodes) { n.ax = c.x + c.offX + n.x; n.ay = c.y + c.offY + n.y; }\n    const primary = new Map(nodes.filter((n) => n.kind === 'loc').map((n) => [n.loc.id, n]));\n    const links = (doc.links || []).map((l) => ({ ...l, a: primary.get(l.from), b: primary.get(l.to) })).filter((l) => l.a && l.b);\n    const bounds = { w: Math.max(...clusters.map((c) => c.x + c.w)), h: Math.max(...clusters.map((c) => c.y + c.h)) };\n    return { clusters, nodes, links, primary, bounds, aspect: vw / vh };\n  }\n\n  function el(tag, attrs, parent) {\n    const e = document.createElementNS(SVGNS, tag);\n    for (const k in attrs) e.setAttribute(k, attrs[k]);\n    if (parent) parent.appendChild(e);\n    return e;\n  }\n\n  function renderDiagram() {\n    dg = buildDiagram();"},"ctxHash":"99fb5517579d","narrativeHash":"99fb5517579d"},{"id":"5g","title":"renderDiagram","description":"Dibuja capas SVG: clústeres, aristas, enlaces, nodos, etiquetas.","explanation":"Crea cinco grupos en orden de pintado para controlar el z-index: cajas de clúster al fondo, luego aristas Bézier, enlaces entre trazas, nodos y por último etiquetas encima de todo. Cada elemento lleva `data-t` con su traza para que la leyenda pueda ocultar trazas, y `data-a`/`data-b` para que el enfoque atenúe aristas. Al terminar aplica ocultos y ajusta el zoom con `fit()`.","path":"src/render/viewer.client.js","lineNumber":512,"lineContent":"function renderDiagram() {","symbol":"renderDiagram","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":509,"code":"    return e;\n  }\n\n  function renderDiagram() {\n    dg = buildDiagram();\n    vp.innerHTML = '';\n    const gClusters = el('g', {}, vp);\n    const gEdges = el('g', {}, vp);\n    const gLinks = el('g', {}, vp);\n    const gNodes = el('g', {}, vp);\n    const gLabels = el('g', {}, vp);\n\n    for (const c of dg.clusters) {\n      const g = el('g', { class: 'cluster', 'data-t': c.trace.id, style: '--tc:' + c.trace.color }, gClusters);\n      el('rect', { class: 'box', x: c.x, y: c.y, width: c.w, height: c.h, rx: 14 }, g);\n      const head = el('g', { class: 'chead', 'data-fit': c.trace.id }, g);\n      el('rect', { x: c.x, y: c.y, width: c.w, height: HEAD - 6, rx: 14 }, head);\n      const tx = el('text', { x: c.x + 16, y: c.y + 22 }, head);"},"ctxHash":"81c917ff9dd2","narrativeHash":"81c917ff9dd2"},{"id":"5h","title":"Nodo foreignObject","description":"Cada nodo es HTML dentro de un foreignObject del SVG.","explanation":"El texto en SVG puro no hace saltos de línea ni ellipsis; meter un `\u003cdiv>` en un `foreignObject` permite reutilizar CSS normal. Los nodos de ubicación llevan `data-id`, que es lo que buscan los handlers de clic, hover y doble clic [5j]. Muestran id, título y `archivo:línea`.","path":"src/render/viewer.client.js","lineNumber":575,"lineContent":"const fo = el('foreignObject', { x: n.ax, y: n.ay, width: NODE_W, height: n.h }, g);","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":572,"code":"    }\n    for (const n of dg.nodes) {\n      const g = el('g', { class: 'node', 'data-t': n.trace.id, 'data-key': n.key }, gNodes);\n      const fo = el('foreignObject', { x: n.ax, y: n.ay, width: NODE_W, height: n.h }, g);\n      const div = document.createElement('div');\n      div.style.setProperty('--tc', n.trace.color);\n      if (n.kind === 'label') {\n        div.className = 'dn label';\n        div.innerHTML = '\u003cdiv class=\"t\">' + esc(n.label) + '\u003c/div>';\n      } else {\n        div.className = 'dn ' + n.kind + (staleNodes.has(n.loc.id) ? ' drift' : '');\n        div.dataset.id = n.loc.id;\n        div.innerHTML =\n          (n.stacked && n.via ? '\u003cdiv class=\"v\">↳ ' + esc(n.via) + '\u003c/div>' : '') +\n          '\u003cdiv class=\"h\">\u003cspan class=\"i\">' + (n.kind === 'again' ? '↺ ' : '') + n.loc.id + '\u003c/span>\u003cspan class=\"t\">' + esc(n.label) + '\u003c/span>' +\n          (staleNodes.has(n.loc.id) ? '\u003cspan class=\"dr\" title=\"Code changed after this node was explained\">◔\u003c/span>' : '') + '\u003c/div>' +\n          '\u003cdiv class=\"f\">' + esc(base(n.loc.path)) + ':' + n.loc.lineNumber + '\u003c/div>';\n      }"},"ctxHash":"55b5debcb3fb","narrativeHash":"55b5debcb3fb"},{"id":"5i","title":"focusDiagram","description":"Marca el nodo y atenúa lo que no está en su ruta.","explanation":"Usa `relatedKeys` para reunir ancestros, descendientes y vecinos por enlaces cruzados, y añade `dim` a nodos y aristas fuera de ese conjunto. Marca con `sel` todas las apariciones del id (incluidas las `again`). Devuelve el nodo primario para que `select` [6d] pueda centrarlo; si el id no tiene nodo, simplemente limpia la selección.","path":"src/render/viewer.client.js","lineNumber":796,"lineContent":"function focusDiagram(id) {","symbol":"focusDiagram","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":793,"code":"    }\n    return keys;\n  }\n  function focusDiagram(id) {\n    if (!dg) return;\n    const n = dg.primary.get(id);\n    $$('.dn.sel', svg).forEach((e) => e.classList.remove('sel'));\n    if (!n) return;\n    $$('.dn[data-id=\"' + id + '\"]', svg).forEach((e) => e.classList.add('sel'));\n    const keys = relatedKeys(n);\n    svg.classList.add('focus');\n    $$('.node', svg).forEach((g) => g.classList.toggle('dim', !keys.has(g.dataset.key)));\n    $$('[data-a]', svg).forEach((p) => p.classList.toggle('dim', !(keys.has(p.dataset.a) && keys.has(p.dataset.b))));\n    return n;\n  }\n  function clearFocus() {\n    svg.classList.remove('focus');\n    $$('.dim', svg).forEach((e) => e.classList.remove('dim'));"},"ctxHash":"9e62f7961863","narrativeHash":"9e62f7961863"},{"id":"5j","title":"Clic en nodo","description":"Clic selecciona sin recentrar; clic en cabecera ajusta el clúster.","explanation":"El `from: 'diagram'` le dice a `select` [6e] que no recentre la vista: el usuario acaba de hacer clic ahí y moverla sería desorientador. Hacer clic en la cabecera de un clúster lo encuadra con `fitBox`, y un doble clic selecciona y salta a la vista de código. El arrastre sin movimiento sobre el fondo limpia el enfoque.","path":"src/render/viewer.client.js","lineNumber":773,"lineContent":"if (d) return select(d.dataset.id, { from: 'diagram' });","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":770,"code":"  });\n  svg.addEventListener('click', (e) => {\n    const d = e.target.closest('.dn[data-id]');\n    if (d) return select(d.dataset.id, { from: 'diagram' });\n    const h = e.target.closest('[data-fit]');\n    if (h) {\n      const c = dg.clusters.find((x) => x.trace.id === h.dataset.fit);\n      fitBox(c.x, c.y, c.w, c.h, 1.2);\n    }\n  });\n  svg.addEventListener('dblclick', (e) => {\n    const d = e.target.closest('.dn[data-id]');\n    if (d) { select(d.dataset.id); setView('code'); }\n  });\n\n  function relatedKeys(n) {\n    const keys = new Set([n.key]);\n    for (let p = n.parent; p; p = p.parent) keys.add(p.key);"},"ctxHash":"ee5173ec0f20","narrativeHash":"ee5173ec0f20"},{"id":"5k","title":"renderCard","description":"Tarjeta con explicación, fragmento embebido y enlaces externos.","explanation":"Toma unas diez líneas alrededor del anclaje de `FILES` [1b] (o del `snippet` si el archivo no está embebido) y las resalta. Los botones de acción dependen del entorno: dentro de VS Code «Open in editor» envía un mensaje al host, fuera construye una URL de editor con `prefs.root` [2e]; «Copy context» copia el `nodeMd` del nodo [1f] y «View on remote» usa `meta.remote` + `meta.commit`. «Open in code view» cambia de vista; la selección ya está hecha, así que el código aparece en el sitio correcto.","path":"src/render/viewer.client.js","lineNumber":814,"lineContent":"function renderCard(l) {","symbol":"renderCard","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":811,"code":"    $$('.dn.sel', svg).forEach((e) => e.classList.remove('sel'));\n    dgCard.hidden = true;\n  }\n  function renderCard(l) {\n    const lines = FILES[l.path] != null ? FILES[l.path].split('\\n') : null;\n    let snippet = '';\n    const from = Math.max(1, l.lineNumber - 3);\n    const ext = extOf(l.path);\n    if (lines) {\n      const to = Math.min(lines.length, l.lineNumber + 6);\n      for (let i = from; i \u003c= to; i++) snippet += '\u003cspan class=\"r' + (i === l.lineNumber ? ' hl' : '') + '\">\u003cspan class=\"n\">' + i + '\u003c/span>' + hl(lines[i - 1], ext) + '\u003c/span>';\n    } else if (l.snippet) {\n      l.snippet.code.split('\\n').slice(0, 10).forEach((t, i) => {\n        const no = l.snippet.startLine + i;\n        snippet += '\u003cspan class=\"r' + (no === l.lineNumber ? ' hl' : '') + '\">\u003cspan class=\"n\">' + no + '\u003c/span>' + hl(t, ext) + '\u003c/span>';\n      });\n    }\n    const ed = editorUrl(l);"},"ctxHash":"26d431d2c22e","narrativeHash":"26d431d2c22e"}],"tree":[{"ref":"5g","children":[{"ref":"5a","children":[{"ref":"5b","via":"por traza"},{"ref":"5c"},{"ref":"5d"},{"ref":"5e","via":"clústeres"},{"ref":"5f"}]},{"label":"capas: clusters → edges → links → nodes → labels"},{"ref":"5h","via":"por nodo"},{"label":"applyHidden() · fit()"}]},{"ref":"5j","children":[{"label":"select(id, from: diagram)"},{"ref":"5i","via":"desde select"},{"ref":"5k","via":"si view = diagram"}]}],"narrativeHash":"e08e82eeff96"},{"id":"6","title":"Sincronización: select y setView","description":"Una sola función propaga la selección a panel, código y diagrama.","diagramTitle":"Selection Hub","motivation":"Con tres vistas y media docena de formas de seleccionar (tarjeta, cita, marcador, nodo, teclado, hash), la única manera de que no se desalineen es que todas converjan en un único punto que actualice cada vista de forma idempotente. Ese punto es `select`; `setView` complementa reconciliando al cambiar de vista.","details":"`select` [6a] valida el id contra `byId`, guarda `state.sel` y, si corre dentro de VS Code, notifica la selección a la extensión (salvo que venga del host o del arranque). Luego actualiza cada superficie en orden. En el panel [6b] quita la selección anterior, marca la tarjeta canónica, despliega su traza y hace scroll (salvo que el clic venga del propio panel). Siempre llama a `showInCode` [6c], aunque el código esté oculto, para que el cambio de vista sea instantáneo. Si el diagrama ya existe, lo enfoca [6d]; si además está visible, pinta la tarjeta y centra el nodo salvo que el clic venga del diagrama [6e]. Por último reescribe el `#hash` con `replaceState` para enlaces compartibles sin ensuciar el historial.\n\n`setView` [6f] alterna las vistas, persiste la elección y construye el diagrama perezosamente la primera vez; luego re-aplica la selección actual a la vista recién mostrada. El teclado [6g] añade navegación global: flechas o j/k recorren `locs`, `e` alterna la explicación, `d` cambia de vista, `f` ajusta el diagrama, `/` abre el buscador y Escape limpia el enfoque. Los mensajes `select`, `explain` y `view` de la extensión de VS Code entran por los mismos `select` y `setView`.","locations":[{"id":"6a","title":"select","description":"Punto único que propaga la selección a todas las vistas.","explanation":"Todos los caminos convergen aquí: tarjetas y citas del panel [3g], marcadores y prev/next del código [4g], nodos del diagrama [5j], teclado y buscador [6g], el arranque [2g] y los mensajes de la extensión de VS Code. `opts.from` indica el origen para evitar movimientos bruscos en la vista desde la que se hizo clic y para no hacer eco: si hay `host`, notifica la selección a la extensión salvo que venga del propio host o del arranque. Es idempotente: llamarla dos veces con el mismo id deja el mismo estado, lo que simplifica mucho los handlers.","path":"src/render/viewer.client.js","lineNumber":951,"lineContent":"function select(id, opts = {}) {","symbol":"select","status":"moved","fileHash":"9845fbe7136b","snippet":{"startLine":948,"code":"  }\n\n  // ---------------------------------------------------------------- selection & views\n  function select(id, opts = {}) {\n    const l = byId.get(id);\n    if (!l) return;\n    state.sel = id;\n    if (host && opts.from !== 'host' && opts.from !== 'boot') host.postMessage({ type: 'select', id, path: l.path, line: l.lineNumber });\n    $$('.loc.sel', mapPane).forEach((e) => e.classList.remove('sel'));\n    const card = $('.loc[data-id=\"' + id + '\"]:not(.ref-again)', mapPane);\n    if (card) {\n      card.classList.add('sel');\n      card.closest('.trace').classList.remove('closed');\n      if (opts.from !== 'map') card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n    }\n    showInCode(l);\n    if (dg) {\n      const n = focusDiagram(id);"},"ctxHash":"bfe356e2774e","narrativeHash":"bfe356e2774e","note":"line 945 -> 951"},{"id":"6b","title":"Tarjeta del panel","description":"Marca la tarjeta canónica, despliega la traza y hace scroll.","explanation":"El selector excluye las repeticiones [3c] para tocar siempre la tarjeta canónica. Si la traza estaba plegada se despliega quitando `closed`. El scroll `nearest` + `smooth` solo se omite cuando el clic viene del propio panel, para no hacer saltar lo que el usuario está mirando.","path":"src/render/viewer.client.js","lineNumber":957,"lineContent":"const card = $('.loc[data-id=\"' + id + '\"]:not(.ref-again)', mapPane);","status":"moved","fileHash":"9845fbe7136b","snippet":{"startLine":954,"code":"    state.sel = id;\n    if (host && opts.from !== 'host' && opts.from !== 'boot') host.postMessage({ type: 'select', id, path: l.path, line: l.lineNumber });\n    $$('.loc.sel', mapPane).forEach((e) => e.classList.remove('sel'));\n    const card = $('.loc[data-id=\"' + id + '\"]:not(.ref-again)', mapPane);\n    if (card) {\n      card.classList.add('sel');\n      card.closest('.trace').classList.remove('closed');\n      if (opts.from !== 'map') card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n    }\n    showInCode(l);\n    if (dg) {\n      const n = focusDiagram(id);\n      if (state.view === 'diagram') {\n        renderCard(l);\n        if (n && opts.from !== 'diagram') centerOn(n);\n      }\n    }\n    history.replaceState(null, '', '#' + id);"},"ctxHash":"65a6d1873271","narrativeHash":"65a6d1873271","note":"line 951 -> 957"},{"id":"6c","title":"Sincroniza código","description":"Actualiza la vista de código aunque esté oculta.","explanation":"Delegar en `showInCode` [4e] mantiene el código siempre al día: archivo correcto, línea resaltada y anotación insertada. Como el scroll solo se aplica con la vista visible, hacerlo en segundo plano es barato y evita parpadeos al volver con `setView` [6f].","path":"src/render/viewer.client.js","lineNumber":963,"lineContent":"showInCode(l);","status":"moved","fileHash":"9845fbe7136b","snippet":{"startLine":960,"code":"      card.closest('.trace').classList.remove('closed');\n      if (opts.from !== 'map') card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n    }\n    showInCode(l);\n    if (dg) {\n      const n = focusDiagram(id);\n      if (state.view === 'diagram') {\n        renderCard(l);\n        if (n && opts.from !== 'diagram') centerOn(n);\n      }\n    }\n    history.replaceState(null, '', '#' + id);\n  }\n\n  function setView(v) {\n    state.view = v;\n    prefs.view = v;\n    savePrefs();"},"ctxHash":"3ce7a4886bcb","narrativeHash":"3ce7a4886bcb","note":"line 957 -> 963"},{"id":"6d","title":"Enfoca el diagrama","description":"Si el diagrama existe, marca el nodo y atenúa el resto.","explanation":"La guarda `if (dg)` existe porque el diagrama se construye perezosamente [6f]: mientras el usuario no lo abra, no hay nada que enfocar. Una vez construido, el enfoque se aplica incluso con la vista oculta, así que al cambiar de vista el nodo ya aparece resaltado. `focusDiagram` [5i] devuelve el nodo para centrarlo.","path":"src/render/viewer.client.js","lineNumber":965,"lineContent":"const n = focusDiagram(id);","status":"moved","fileHash":"9845fbe7136b","snippet":{"startLine":962,"code":"    }\n    showInCode(l);\n    if (dg) {\n      const n = focusDiagram(id);\n      if (state.view === 'diagram') {\n        renderCard(l);\n        if (n && opts.from !== 'diagram') centerOn(n);\n      }\n    }\n    history.replaceState(null, '', '#' + id);\n  }\n\n  function setView(v) {\n    state.view = v;\n    prefs.view = v;\n    savePrefs();\n    $('#vCode').classList.toggle('on', v === 'code');\n    $('#vDiagram').classList.toggle('on', v === 'diagram');"},"ctxHash":"87cf3cf76c71","narrativeHash":"87cf3cf76c71","note":"line 959 -> 965"},{"id":"6e","title":"Tarjeta y centrado","description":"Con el diagrama visible, pinta tarjeta y centra el nodo.","explanation":"La tarjeta de detalle [5k] solo se pinta si el diagrama está visible, para no hacer trabajo inútil. El centrado anima el viewport con `animateTo` (curva cúbica de 260 ms), pero se omite cuando el clic vino del diagrama [5j]: el nodo ya está bajo el cursor. Si se seleccionó desde el panel o el teclado, el diagrama «viaja» hasta el nodo.","path":"src/render/viewer.client.js","lineNumber":968,"lineContent":"if (n && opts.from !== 'diagram') centerOn(n);","status":"moved","fileHash":"9845fbe7136b","snippet":{"startLine":965,"code":"      const n = focusDiagram(id);\n      if (state.view === 'diagram') {\n        renderCard(l);\n        if (n && opts.from !== 'diagram') centerOn(n);\n      }\n    }\n    history.replaceState(null, '', '#' + id);\n  }\n\n  function setView(v) {\n    state.view = v;\n    prefs.view = v;\n    savePrefs();\n    $('#vCode').classList.toggle('on', v === 'code');\n    $('#vDiagram').classList.toggle('on', v === 'diagram');\n    $('#codeView').hidden = v !== 'code';\n    $('#diagramView').hi gleExplain` [3f], `d` llama a `setView` [6f], `f` ajusta el diagrama y `/` enfoca el buscador de nodos.","path":"src/render/viewer.client.js","lineNumber":996,"lineContent":"document.addEventListener('keydown', (e) => {","status":"moved","fileHash":"9845fbe7136b","snippet":{"startLine":993,"code":"  $('#vCode').onclick = () => setView('code');\n  $('#vDiagram').onclick = () => setView('diagram');\n\n  document.addEventListener('keydown', (e) => {\n    if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;\n    const i = locs.findIndex((x) => x.id === state.sel);\n    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); if (locs[i + 1]) select(locs[i + 1].id); }\n    else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); if (i > 0) select(locs[i - 1].id); }\n    else if (e.key === 'e' && state.sel) toggleExplain(state.sel);\n    else if (e.key === 'd') setView(state.view === 'code' ? 'diagram' : 'code');\n    else if (e.key === 'f' && state.view === 'diagram') fit(true);\n    else if (e.key === 'Escape') clearFocus();\n    else if (e.key === '/') { e.preventDefault(); searchEl.focus(); searchEl.select(); }\n  });\n\n  // ---------------------------------------------------------------- splitter, settings, copy\n  const splitter = $('#splitter');\n  if (prefs.mapW) document.documentElement.style.setProperty('--map-w', prefs.mapW);"},"ctxHash":"75b6bd533598","narrativeHash":"75b6bd533598","note":"line 990 -> 996"}],"tree":[{"ref":"6a","children":[{"label":"state.sel = id"},{"ref":"6b","via":"panel"},{"ref":"6c","via":"código (siempre)"},{"ref":"6d","via":"si dg existe","children":[{"ref":"6e","via":"si view = diagram"}]},{"label":"history.replaceState('#' + id)"}]},{"ref":"6f","children":[{"label":"toggle #codeView / #diagramView · savePrefs()"},{"label":"focus + renderCard + centerOn","via":"diagram"},{"label":"showInCode(sel)","via":"code"}]},{"ref":"6g","children":[{"label":"↑↓ j k → ng tree, persists JSON (+ HTML viewer). */\nexport function saveMap(root, input, { id, html = true } = {}) {\n  const map = normalizeMap(input);\n  const report = anchorMap(root, map);\n  baselineNarrative(map, { force: true });\n  const existing = id ? loadMap(root, id, { quiet: true }) : null;\n  const now = new Date().toISOString();\n  const doc = {\n    schemaVersion: SCHEMA_VERSION,\n    id: id || `${slugify(map.title)}-${crypto.randomBytes(3).toString('hex')}`,\n    ...map,\n    meta: {\n      createdAt: existing?.meta?.createdAt || now,\n      updatedAt: now,\n      root,\n      commit: headCommit(root),\n      branch: currentBranch(root),\n      remote: remoteWebUrl(root),\n      anchors: { ...report, issues: undefined },\n    },\n  };\n  fs.mkdirSync(mapDir(root), { recursive: true });\n  fs.writeFileSync(filePath(root, doc.id), JSON.stringify(doc, null, 2));\n  const htmlPath = html ? writeHtml(root, doc) : null;\n  return { doc, report, narrative: narrativeGaps(doc), jsonPath: filePath(root, doc.id), htmlPath };\n}\n\nexport function writeHtml(root, doc) {\n  const p = filePath(root, doc.id, 'html');\n  fs.writeFileSync(p, renderHtml(doc, { files: collectFiles(root, doc) }));\n  return p;\n}\n\nconst MAX_FILE_BYTES = 512 * 1024;\nconst MAX_TOTAL_BYTES = 8 * 1024 * 1024;\n\n/** Snapshot of every referenced file, embedded in the viewer (code tabs, gutter markers). */\nexport function collectFiles(root, doc) {\n  const files = {};\n  let total = 0;\n  const paths = [...new Set(doc.traces.flatMap((t) => t.locations.map((l) => l.path)))];\n  for (const rel of paths) {\n    try {\n      const abs = safeJoin(root, rel);\n      const st = fs.statSync(abs);\n      if (!st.isFile() || st.size > MAX_FILE_BYTES || total + st.size > MAX_TOTAL_BYTES) continue;\n      const text = fs.readFileSync(abs, 'utf8');\n      if (text.indexOf(String.fromCharCode(0)) !== -1) continue; // binary\n      files[rel] = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));\n      total += st.size;\n    } catch {\n      /* missing file: the viewer falls back to the stored snippet */\n    }\n  }\n  return files;\n}\n\nconst sha = (s) => crypto.createHash('sha1').update(s).digest('hex').slice(0, 12);\nconst storyHash = (doc) => sha(doc.traces.map((t) => traceHash(t)).join('|'));\n\n/**\n * Records, for every node / trace / the story, a hash of the code the prose was written for.\n * force=true overwrites (prose just written); otherwise only fills missing baselines (old maps).\n */\nexport function baselineNarrative(doc, { force = false, nodes = null, traces = null, story = false } = {}) {\n  for (const t of doc.traces) {\n    for (const l of t.locations) {\n      if (!l.ctxHash) continue;\n      if (force || !l.narrativeHash || (nodes && nodes.has(l.id))) l.narrativeHash = l.ctxHash;\n    }\n    if (force || !t.narrativeHash || (traces && traces.has(t.id))) t.narrativeHash = traceHash(t);\n  }\n  if (force || !doc.narrativeHash || story) doc.narrativeHash = storyHash(doc);\n  return doc;\n}\n\n/**\n * Narrative drift: prose written for code that has since changed (anchors may still be fine).\n * Uses the stored ctxHash of each node (refreshed by create/verify --fix/annotate).\n */\nexport function narrativeDrift(doc) {\n  const nodes = [];\n  const traces = [];\n  for (const t of doc.traces) {\n    for (const l of t.locations) if (l.narrativeHash && l.ctxHash && l.narrativeHash !== l.ctxHash) nodes.push(l.id);\n    if (t.narrativeHash && t.narrativeHash !== traceHash(t)) traces.push(t.id);\n  }\n  const story = !!doc.narrativeHash && doc.narrativeHash !== storyHash(doc);\n  return { nodes, traces, story, stale: nodes.length > 0 || traces.length > 0 || story };\n}\n\n/** Which narrative fields are still empty (drives the \"fill with waymark_annotate\" hint). */\nexport function narrativeGaps(doc) {\n  const gaps = { story: !doc.story, motivation: [], details: [], explanation: [] };\n  for (const t of doc.traces) {\n    if (!t.motivation) gaps.motivation.push(t.id);\n    if (!t.details) gaps.details.push(t.id);\n    for (const l of t.locations) if (!l.explanation) gaps.explanation.push(l.id);\n  }\n  gaps.complete = !gaps.story && !gaps.motivation.length && !gaps.details.length && !gaps.explanation.length;\n  return gaps;\n}\n\n/**\n * Patches prose on an existing map without re-anchoring: story/description/title at map level,\n * title/description/diagramTitle/motivation/details per trace, title/description/explanation per location.\n */\nexport function annotateMap(root, id, patch) {\n  const doc = loadMap(root, id);\n  const unknown = [];\n  let changed = 0;\n  const set = (obj, key, val) => {\n    if (typeof val === 'string' && obj[key] !== val) {\n      obj[key] = val;\n      changed++;\n      return true;\n    }\n    return false;\n  };\n  const touchedNodes = new Set();\n  const touchedTraces = new Set();\n  let touchedStory = false;\n  // Prose confirmed accurate without edits: re-baseline it so it stops being flagged.\n  for (const r of patch.reviewed || []) {\n    if (r === 'story') touchedStory = true;\n    else if (String(r).startsWith('trace:')) touchedTraces.add(String(r).slice(6));\n    else touchedNodes.add(String(r));\n  }\n  for (const k of ['title', 'description', 'story', 'language']) if (set(doc, k, patch[k]) && k === 'story') touchedStory = true;\n  for (const tp of patch.traces || []) {\n    const t = doc.traces.find((x) => x.id === String(tp.id));\n    if (!t) {\n      unknown.push(`trace ${tp.id}`);\n      continue;\n    }\n    for (const k of ['title', 'description', 'diagramTitle', 'motivation', 'details']) if (set(t, k, tp[k])) touchedTraces.add(t.id);\n  }\n  for (const lp of patch.locations || []) {\n    const l = doc.traces.flatMap((t) => t.locations).find((x) => x.id === lp.id);\n    if (!l) {\n      unknown.push(`location ${lp.id}`);\n      continue;\n    }\n    for (const k of ['title', 'description', 'explanation']) if (set(l, k, lp[k])) touchedNodes.add(l.id);\n  }\n  for (const t of doc.traces) {\n    if (t.guide && !t.details) t.details = t.guide;\n    delete t.guide;\n  }\n  // Rewritten prose now describes the current code: refresh context hashes and re-baseline it.\n  refreshContextHashes(root, doc);\n  baselineNarrative(doc, { nodes: touchedNodes, traces: touchedTraces, story: touchedStory });\n  const drift = narrativeDrift(doc);\n  doc.meta = {\n    ...doc.meta,\n    updatedAt: new Date().toISOString(),\n    narrativeDrift: drift.stale ? { nodes: drift.nodes, traces: drift.traces, story: drift.story } : undefined,\n  };\n  persist(root, doc);\n  const htmlPath = writeHtml(root, doc);\n  return { id: doc.id, changed, unknown, narrative: narrativeGaps(doc), drift, htmlPath };\n}\n\nexport function persist(root, doc) {\n  fs.writeFileSync(filePath(root, doc.id), JSON.stringify(doc, null, 2));\n}\n\nexport function loadMap(root, id, { quiet = false } = {}) {\n  let p;\n  try {\n    p = filePath(root, id);\n  } catch (e) {\n    if (quiet) return null;\n    throw e;\n  }\n  if (!fs.existsSync(p)) {\n    // Allow unique prefix lookups (\"auth-flow\" -> \"auth-flow-1a2b3c\").\n    const hit = listMaps(root).filter((m) => m.id.startsWith(id));\n    if (hit.length === 1) return loadMap(root, hit[0].id);\n    if (quiet) return null;\n    throw new Error(\n      hit.length > 1 ? `Ambiguous waymark id \"${id}\": ${hit.map((h) => h.id).join(', ')}` : `Waymark \"${id}\" not found`,\n    );\n  }\n  return JSON.parse(fs.readFileSync(p, 'utf8'));\n}\n\nexport function listMaps(root) {\n  const dir = mapDir(root);\n  if (!fs.existsSync(dir)) return [];\n  return fs\n    .readdirSync(dir)\n    .filter((f) => f.endsWith('.json'))\n    .map((f) => {\n      try {\n        const d = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));\n        return {\n          id: d.id,\n          title: d.title,\n          description: d.description,\n          query: d.query,\n          traces: d.traces.length,\n          locations: d.traces.reduce((n, t) => n + t.locations.length, 0),\n          updatedAt: d.meta?.updatedAt,\n          commit: d.meta?.commit?.slice(0, 8),\n          tags: d.tags,\n        };\n      } catch {\n        return null;\n      }\n    })\n    .filter(Boolean)\n    .sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));\n}\n\n/** Recomputes each node's ctxHash at its stored line (no re-anchoring). */\nexport function refreshContextHashes(root, doc) {\n  const cache = new FileCache(root);\n  for (const t of doc.traces) {\n    for (const l of t.locations) {\n      const f = cache.read(l.path);\n      if (f) l.ctxHash = contextHash(f.lines, Math.min(Math.max(l.lineNumber - 1, 0), f.lines.length - 1));\n    }\n  }\n  return doc;\n}\n\nexport function deleteMap(root, id) {\n  const doc = loadMap(root, id);\n  for (const ext of ['json', 'html']) {\n    const p = filePath(root, doc.id, ext);\n    if (fs.existsSync(p)) fs.unlinkSync(p);\n  }\n  return doc.id;\n}\n","src/render/html.js":"import fs from 'node:fs';\nimport path from 'node:path';\nimport { fileURLToPath } from 'node:url';\nimport { renderMermaid } from './mermaid.js';\nimport { renderMarkdown } from './markdown.js';\n\nconst HERE = path.dirname(fileURLToPath(import.meta.url));\nconst CSS = fs.readFileSync(path.join(HERE, 'viewer.css'), 'utf8');\nconst CLIENT = fs.readFileSync(path.join(HERE, 'viewer.client.js'), 'utf8');\nconst BS = String.fromCharCode(92);\n\nconst escHtml = (s) =>\n  String(s ?? '').replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n\n// JSON inside \u003cscript type=\"application/json\">: only \"\u003c\" must be neutralized (no \"\u003c/script>\").\nconst inlineJson = (v) => JSON.stringify(v).split('\u003c').join(BS + 'u003c');\nconst inlineScript = (s) => s.replace(/\u003c\\/script/gi, '\u003c' + BS + '/script');\n\n/**\n * Self-contained, shareable viewer (no network): map pane with story, guides and\n * explanations; code view with embedded files; interactive SVG diagram.\n * `files` is a snapshot { path: content } of the referenced files.\n */\nexport function renderHtml(doc, { files = {} } = {}) {\n  const data = {\n    doc,\n    files,\n    markdown: renderMarkdown(doc, { detail: 'full' }),\n    // Smaller context blocks for \"copy trace / node as context\".\n    traceMd: Object.fromEntries(doc.traces.map((t) => [t.id, renderMarkdown(doc, { trace: t.id })])),\n    nodeMd: Object.fromEntries(doc.traces.flatMap((t) => t.locations.map((l) => [l.id, renderMarkdown(doc, { node: l.id })]))),\n    mermaid: renderMermaid({ ...doc, diagram: undefined }),\n  };\n  return `\u003c!doctype html>\n\u003chtml lang=\"${escHtml(doc.language || 'en')}\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"generator\" content=\"waymark\">\n\u003ctitle>Waymark · ${escHtml(doc.title)}\u003c/title>\n\u003cstyle>${CSS}\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"app\">\n  \u003cheader id=\"topbar\">\n    \u003cspan class=\"brand\">WAYMARK\u003c/span>\u003cspan class=\"brand-sep\">\u003c/span>\n    \u003cspan class=\"top-title\">\u003c/span>\n    \u003cdiv class=\"search\">\n      \u003cinput id=\"search\" type=\"search\" placeholder=\"Search nodes…  ( / )\" autocomplete=\"off\" spellcheck=\"false\" aria-label=\"Search nodes\">\n      \u003cdiv id=\"searchResults\" hidden>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"seg\" role=\"tablist\" aria-label=\"View\">\n      \u003cbutton id=\"vCode\" role=\"tab\" title=\"Code view (d)\">Code\u003c/button>\n      \u003cbutton id=\"vDiagram\" role=\"tab\" title=\"Diagram view (d)\">Diagram\u003c/button>\n    \u003c/div>\n    \u003cbutton class=\"tbtn\" id=\"copyCtx\" title=\"Copy the map as markdown context for an agent\">Copy context\u003c/button>\n    \u003cbutton class=\"tbtn\" id=\"settingsBtn\" title=\"Editor link settings\">⚙\u003c/button>\n  \u003c/header>\n  \u003cdiv id=\"settings\" hidden>\n    \u003clabel>Local repo path \u003cinput id=\"setRoot\" spellcheck=\"false\">\u003c/label>\n    \u003clabel>Editor\n      \u003cselect id=\"setEditor\">\n        \u003coption value=\"vscode\">VS Code\u003c/option>\u003coption value=\"cursor\">Cursor\u003c/option>\n        \u003coption value=\"windsurf\">Windsurf / Devin Desktop\u003c/option>\u003coption value=\"idea\">JetBrains\u003c/option>\n      \u003c/select>\n    \u003c/label>\n  \u003c/div>\n  \u003cdiv id=\"main\">\n    \u003caside id=\"mapPane\" aria-label=\"Map\">\u003c/aside>\n    \u003cdiv id=\"splitter\" role=\"separator\" aria-orientation=\"vertical\" title=\"Drag to resize\">\u003c/div>\n    \u003csection id=\"rightPane\">\n      \u003cdiv id=\"codeView\">\n        \u003cdiv id=\"fileTabs\">\u003c/div>\n        \u003cdiv id=\"codeScroll\">\u003cdiv id=\"code\">\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"diagramView\" hidden>\n        \u003cdiv class=\"dg-toolbar\">\n          \u003cdiv class=\"legend\" id=\"legend\">\u003c/div>\n          \u003cdiv class=\"zoom\">\n            \u003cbutton id=\"zin\" title=\"Zoom in\">+\u003c/button>\n            \u003cbutton id=\"zout\" title=\"Zoom out\">−\u003c/button>\n            \u003cbutton id=\"zfit\" title=\"Fit all (f)\">⤢\u003c/button>\n            \u003cbutton id=\"zsel\" title=\"Center selected node\">◎\u003c/button>\n            \u003cbutton id=\"copyMmd\" title=\"Copy the diagram as Mermaid source\">⧉\u003c/button>\n            \u003cbutton id=\"exportSvg\" title=\"Download the diagram as SVG\">⤓\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003csvg id=\"mini\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Minimap\">\u003cg id=\"miniContent\">\u003c/g>\u003crect id=\"miniView\"/>\u003c/svg>\n        \u003csvg id=\"dg\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Interactive diagram\">\n          \u003cdefs>\n            \u003cmarker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\" style=\"color:var(--muted)\"/>\u003c/marker>\n            \u003cmarker id=\"arr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\" style=\"color:var(--ink2)\"/>\u003c/marker>\n          \u003c/defs>\n          \u003cg id=\"vp\">\u003c/g>\n        \u003c/svg>\n        \u003cdiv id=\"dgTip\" hidden>\u003c/div>\n        \u003cdiv id=\"dgCard\" hidden>\u003c/div>\n        \u003cdiv class=\"dg-hint\">Drag to pan · wheel to zoom · click a node to focus its path · double-click to open the code\u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/div>\n\u003c/div>\n\u003cscript id=\"waymark-data\" type=\"application/json\">${inlineJson(data)}\u003c/script>\n\u003cscript>${inlineScript(CLIENT)}\u003c/script>\n\u003c/body>\n\u003c/html>`;\n}\n","src/render/viewer.client.js":"/* Waymark viewer — runs inside the self-contained HTML. No dependencies, no network. */\n(() => {\n  'use strict';\n\n  const DATA = JSON.parse(document.getElementById('waymark-data').textContent);\n  const { doc } = DATA;\n  const FILES = DATA.files || {};\n  const meta = doc.meta || {};\n  const PALETTE = ['#5b8cff', '#e8803a', '#3fae6a', '#c04fd0', '#d4a72c', '#2fb3c4', '#e0566b', '#8a7dff', '#7fb800', '#ff6fa8'];\n  const SVGNS = 'http://www.w3.org/2000/svg';\n\n  const $ = (s, el = document) => el.querySelector(s);\n  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));\n  const esc = (s) =>\n    String(s == null ? '' : s).replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n  const base = (p) => p.split('/').pop();\n  const extOf = (p) => (base(p).includes('.') ? base(p).split('.').pop().toLowerCase() : base(p).toLowerCase());\n  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));\n\n  // ---------------------------------------------------------------- model\n  const traces = doc.traces.map((t, i) => ({ ...t, color: PALETTE[i % PALETTE.length], details: t.details || t.guide }));\n  const locs = [];\n  const byId = new Map();\n  for (const t of traces) for (const l of t.locations) {\n    const x = { ...l, trace: t };\n    locs.push(x);\n    byId.set(l.id, x);\n  }\n  const fileOrder = [...new Set(locs.map((l) => l.path))];\n\n  // Narrative drift: prose written for code that changed afterwards (set by `waymark verify --fix`).\n  const drift = meta.narrativeDrift || { nodes: [], traces: [], story: false };\n  const staleNodes = new Set(drift.nodes || []);\n  for (const l of locs) if (l.narrativeHash && l.ctxHash && l.narrativeHash !== l.ctxHash) staleNodes.add(l.id);\n  const staleTraces = new Set(drift.traces || []);\n  const DRIFT_NOTE = 'The code here changed after this was written — the prose may be outdated. Ask your agent: ';\n  const driftNote = (what) => '\u003cdiv class=\"drift-note\">⚠ ' + esc(DRIFT_NOTE) + '\u003ccode>/waymark refresh ' + esc(doc.id) + '\u003c/code>' + (what ? ' (' + esc(what) + ')' : '') + '\u003c/div>';\n\n  // Embedded in a VS Code webview: talk to the extension instead of opening URLs.\n  const host = typeof acquireVsCodeApi === 'function' ? acquireVsCodeApi() : null;\n\n  const prefsKey = 'waymark:' + doc.id;\n  const prefs = Object.assign({ root: meta.root || '', editor: 'vscode', mapW: null, view: 'code' }, safeJson(localStorage.getItem(prefsKey)));\n  function safeJson(s) { try { return JSON.parse(s) || {}; } catch { return {}; } }\n  const savePrefs = () => { try { localStorage.setItem(prefsKey, JSON.stringify(prefs)); } catch { /* private mode */ } };\n\n  const state = { sel: null, view: prefs.view === 'diagram' ? 'diagram' : 'code', file: null, explainOpen: new Set(), annoExpl: false };\n\n  // ---------------------------------------------------------------- text helpers\n  const REF_RE = /\\[((?:\\d+[a-z]{1,2})(?:\\s*,\\s*\\d+[a-z]{1,2})*)\\]/g;\n  function refs(html) {\n    return html.replace(REF_RE, (m, list) => {\n      const ids = list.split(/\\s*,\\s*/);\n      if (!ids.every((id) => byId.has(id))) return m;\n      return '\u003cspan class=\"refs\">[' + ids.map((id) => '\u003ca class=\"ref\" data-ref=\"' + id + '\">' + id + '\u003c/a>').join(', ') + ']\u003c/span>';\n    });\n  }\n  function inline(s) {\n    return refs(\n      esc(s)\n        .replace(/`([^`]+)`/g, '\u003ccode>$1\u003c/code>')\n        .replace(/\\*\\*([^*]+)\\*\\*/g, '\u003cstrong>$1\u003c/strong>')\n        .replace(/(^|[^*\\w])\\*([^*\\n]+)\\*(?!\\w)/g, '$1\u003cem>$2\u003c/em>')\n        .replace(/\\[([^\\]]+)\\]\\((https?:[^)\\s]+)\\)/g, '\u003ca href=\"$2\" target=\"_blank\" rel=\"noopener\">$1\u003c/a>'),\n    );\n  }\n  function md(src) {\n    const out = [];\n    let list = null;\n    let para = [];\n    let code = null;\n    const flushPara = () => { if (para.length) { out.push('\u003cp>' + inline(para.join(' ')) + '\u003c/p>'); para = []; } };\n    const closeList = () => { if (list) { out.push('\u003c/' + list + '>'); list = null; } };\n    for (const raw of String(src || '').split(/\\r?\\n/)) {\n      if (code !== null) {\n        if (/^\\s*```/.test(raw)) { out.push('\u003cpre>\u003ccode>' + esc(code.join('\\n')) + '\u003c/code>\u003c/pre>'); code = null; } else code.push(raw);\n        continue;\n      }\n      if (/^\\s*```/.test(raw)) { flushPara(); closeList(); code = []; continue; }\n      const h = raw.match(/^#{1,6}\\s+(.*)/);\n      if (h) { flushPara(); closeList(); out.push('\u003ch5>' + inline(h[1]) + '\u003c/h5>'); continue; }\n      const li = raw.match(/^\\s*([-*]|\\d+\\.)\\s+(.*)/);\n      if (li) {\n        flushPara();\n        const kind = /\\d/.test(li[1]) ? 'ol' : 'ul';\n        if (list !== kind) { closeList(); out.push('\u003c' + kind + '>'); list = kind; }\n        out.push('\u003cli>' + inline(li[2]) + '\u003c/li>');\n        continue;\n      }\n      if (!raw.trim()) { flushPara(); closeList(); continue; }\n      closeList();\n      para.push(raw.trim());\n    }\n    if (code !== null) out.push('\u003cpre>\u003ccode>' + esc(code.join('\\n')) + '\u003c/code>\u003c/pre>');\n    flushPara();\n    closeList();\n    return out.join('');\n  }\n\n  // ---------------------------------------------------------------- syntax highlight (tiny, language-agnostic)\n  const KW = new Set(('abstract and as async await break case catch class const continue def default defer del delete do elif else enum except export extends ' +\n    'false final finally fn for from func function global go if impl implements import in interface is lambda let match mod module mut namespace new nil ' +\n    'none None not null of or package pass private protected pub public raise return self static struct super switch this throw throws trait true True ' +\n    'False try type typeof use val var void when where while with yield dcl-s dcl-ds dcl-proc dcl-pi end-proc end-ds exec sql select update insert into values set').split(' '));\n  const TOK = /(\\/\\/.*$|#.*$|\\/\\*.*?\\*\\/|--.*$)|(\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*'|`(?:[^`\\\\]|\\\\.)*`)|(\\b\\d[\\d_.xXa-fA-F]*\\b)|([A-Za-z_$][\\w$-]*)(\\s*\\()?/g;\n  const HASH = /^(py|rb|sh|bash|zsh|yml|yaml|toml|r|pl|ps1|conf|cfg|ini|dockerfile|makefile|mk|cmake|nim|ex|exs)$/;\n  const DASH = /^(sql|lua|hs|elm|ada)$/;\n  function hl(line, ext) {\n    let out = '';\n    let last = 0;\n    let m;\n    TOK.lastIndex = 0;\n    while ((m = TOK.exec(line))) {\n      const t = m[0];\n      out += esc(line.slice(last, m.index));\n      if (m[1] && ((t[0] === '#' && !HASH.test(ext)) || (t.startsWith('--') && !DASH.test(ext)))) {\n        out += esc(t[0]);\n        TOK.lastIndex = m.index + 1;\n        last = m.index + 1;\n        continue;\n      }\n      if (m[1]) out += '\u003cspan class=\"tk-c\">' + esc(t) + '\u003c/span>';\n      else if (m[2]) out += '\u003cspan class=\"tk-s\">' + esc(t) + '\u003c/span>';\n      else if (m[3]) out += '\u003cspan class=\"tk-n\">' + esc(t) + '\u003c/span>';\n      else if (KW.has(m[4])) out += '\u003cspan class=\"tk-k\">' + esc(m[4]) + '\u003c/span>' + esc(m[5] || '');\n      else if (m[5]) out += '\u003cspan class=\"tk-f\">' + esc(m[4]) + '\u003c/span>' + esc(m[5]);\n      else out += esc(t);\n      last = m.index + t.length;\n    }\n    return out + esc(line.slice(last));\n  }\n\n  // ---------------------------------------------------------------- links\n  function editorUrl(l) {\n    if (!prefs.root) return null;\n    const abs = prefs.root.replace(/\\\\/g, '/').replace(/\\/$/, '') + '/' + l.path;\n    if (prefs.editor === 'idea') return 'idea://open?file=' + encodeURIComponent(abs) + '&line=' + l.lineNumber;\n    return prefs.editor + '://file' + encodeURI(abs.startsWith('/') ? abs : '/' + abs) + ':' + l.lineNumber;\n  }\n  function remoteUrl(l) {\n    const r = meta.remote;\n    const c = meta.commit;\n    if (!r || !c) return null;\n    if (/dev\\.azure\\.com|visualstudio\\.com/.test(r)) return r + '?path=/' + l.path + '&version=GC' + c + '&line=' + l.lineNumber + '&lineEnd=' + l.lineNumber + '&lineStartColumn=1&lineEndColumn=1';\n    if (/bitbucket\\./.test(r)) return r + '/src/' + c + '/' + l.path + '#lines-' + l.lineNumber;\n    if (/gitlab\\./.test(r)) return r + '/-/blob/' + c + '/' + l.path + '#L' + l.lineNumber;\n    return r + '/blob/' + c + '/' + l.path + '#L' + l.lineNumber;\n  }\n  function explanationHtml(l) {\n    if (l.explanation) return (staleNodes.has(l.id) ? driftNote() : '') + md(l.explanation);\n    return '\u003cp class=\"empty\">No storytelling explanation stored for this node yet. Ask your agent: \u003ccode>/waymark enrich ' + esc(doc.id) + '\u003c/code>\u003c/p>';\n  }\n\n  // ---------------------------------------------------------------- map pane\n  const STATUS = { fuzzy: '≈', unresolved: '⚠', missing: '⚠' };\n  const mapPane = $('#mapPane');\n\n  function renderMapPane() {\n    const a = meta.anchors || {};\n    const chips = [];\n    if (meta.createdAt) chips.push('\u003cspan class=\"chip\">Created ' + esc(new Date(meta.createdAt).toLocaleDateString()) + '\u003c/span>');\n    if (meta.commit) chips.push('\u003cspan class=\"chip\" title=\"' + esc(meta.commit) + '\">@ ' + esc(meta.commit.slice(0, 8)) + (meta.branch ? ' · ' + esc(meta.branch) : '') + '\u003c/span>');\n    chips.push('\u003cspan class=\"chip\">' + traces.length + ' traces · ' + locs.length + ' nodes\u003c/span>');\n    const broken = (a.unresolved || 0) + (a.missing || 0);\n    if (broken) chips.push('\u003cspan class=\"chip bad\">' + broken + ' unverified anchors\u003c/span>');\n    if (a.fuzzy) chips.push('\u003cspan class=\"chip warn\">' + a.fuzzy + ' approximate\u003c/span>');\n    if (staleNodes.size) chips.push('\u003cspan class=\"chip warn\" title=\"Code changed after these nodes were explained\">' + staleNodes.size + ' explanations to review\u003c/span>');\n\n    const head =\n      '\u003cdiv class=\"mp-head\">\u003ch1>' + esc(doc.title) + '\u003c/h1>\u003cdiv class=\"chips\">' + chips.join('') + '\u003c/div>' +\n      '\u003cdiv class=\"summary\">' + inline(doc.description) + '\u003c/div>' +\n      '\u003cdiv class=\"mp-actions\">' +\n      (doc.story ? '\u003cbutton class=\"pill\" id=\"storyBtn\" aria-expanded=\"false\">Read the full story\u003c/button>' : '') +\n      '\u003cbutton class=\"pill\" id=\"explainAllBtn\" title=\"Expand every node with its explanation\">Explain all nodes\u003c/button>' +\n      '\u003cbutton class=\"pill\" id=\"guidesBtn\" title=\"Open every trace guide\">Open all guides\u003c/button>' +\n      '\u003c/div>' +\n      (doc.story ? '\u003cdiv class=\"story md\" id=\"story\" hidden>\u003cdiv class=\"ai-label\">AI generated story\u003c/div>' + (drift.story ? driftNote('story') : '') + md(doc.story) + '\u003c/div>' : '') +\n      '\u003c/div>';\n\n    const seen = new Set();\n    const treeHtml = (nodes  > 0 && !(d && hit.has(d.dataset.id)));\n    });\n    svg.classList.toggle('searching', terms.length > 0);\n    if (!terms.length) { resultsEl.hidden = true; return; }\n    resultsEl.innerHTML = matches.length\n      ? matches.slice(0, 14).map((l, i) =>\n          '\u003cdiv class=\"sr' + (i === 0 ? ' on' : '') + '\" data-ref=\"' + l.id + '\" style=\"--tc:' + l.trace.color + '\">\u003cspan class=\"lid\">' + l.id + '\u003c/span>\u003cspan class=\"srt\">' + esc(l.title) +\n          '\u003c/span>\u003cspan class=\"srf\">' + esc(base(l.path)) + ':' + l.lineNumber + '\u003c/span>\u003c/div>').join('') + (matches.length > 14 ? '\u003cdiv class=\"sr more\">+' + (matches.length - 14) + ' more\u003c/div>' : '')\n      : '\u003cdiv class=\"sr more\">No nodes match\u003c/div>';\n    resultsEl.hidden = false;\n  }\n  searchEl.addEventListener('input', runSearch);\n  searchEl.addEventListener('keydown', (e) => {\n    const items = $$('.sr[data-ref]', resultsEl);\n    const cur = items.findIndex((x) => x.classList.contains('on'));\n    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {\n      e.preventDefault();\n      if (!items.length) return;\n      const next = (cur + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;\n      items.forEach((x, i) => x.classList.toggle('on', i === next));\n      items[next].scrollIntoView({ block: 'nearest' });\n    } else if (e.key === 'Enter') {\n      const it = items[cur >= 0 ? cur : 0];\n      if (it) { select(it.dataset.ref); resultsEl.hidden = true; }\n    } else if (e.key === 'Escape') {\n      searchEl.value = '';\n      runSearch();\n      searchEl.blur();\n    }\n  });\n  resultsEl.addEventListener('mousedown', (e) => {\n    const it = e.target.closest('[data-ref]');\n    if (it) { e.preventDefault(); select(it.dataset.ref); resultsEl.hidden = true; }\n  });\n  searchEl.addEventListener('blur', () => setTimeout(() => (resultsEl.hidden = true), 120));\n  searchEl.addEventListener('focus', () => { if (searchEl.value.trim()) runSearch(); });\n\n  // ---------------------------------------------------------------- VS Code bridge\n  function openInHost(id) {\n    const l = byId.get(id);\n    if (host && l) host.postMessage({ type: 'open', id: l.id, path: l.path, line: l.lineNumber });\n  }\n  if (host) {\n    window.addEventListener('message', (e) => {\n      const m = e.data || {};\n      if (m.type === 'select' && byId.has(m.id) && m.id !== state.sel) select(m.id, { from: 'host' });\n      if (m.type === 'explain' && byId.has(m.id)) {\n        state.annoExpl = true;\n        select(m.id, { from: 'host' });\n        toggleExplain(m.id, true);\n        if (state.view === 'diagram') renderCard(byId.get(m.id));\n      }\n      if (m.type === 'view' && (m.view === 'code' || m.view === 'diagram')) setView(m.view);\n    });\n  }\n\n  // ---------------------------------------------------------------- selection & views\n  function select(id, opts = {}) {\n    const l = byId.get(id);\n    if (!l) return;\n    state.sel = id;\n    if (host && opts.from !== 'host' && opts.from !== 'boot') host.postMessage({ type: 'select', id, path: l.path, line: l.lineNumber });\n    $$('.loc.sel', mapPane).forEach((e) => e.classList.remove('sel'));\n    const card = $('.loc[data-id=\"' + id + '\"]:not(.ref-again)', mapPane);\n    if (card) {\n      card.classList.add('sel');\n      card.closest('.trace').classList.remove('closed');\n      if (opts.from !== 'map') card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n    }\n    showInCode(l);\n    if (dg) {\n      const n = focusDiagram(id);\n      if (state.view === 'diagram') {\n        renderCard(l);\n        if (n && opts.from !== 'diagram') centerOn(n);\n      }\n    }\n    history.replaceState(null, '', '#' + id);\n  }\n\n  function setView(v) {\n    state.view = v;\n    prefs.view = v;\n    savePrefs();\n    $('#vCode').classList.toggle('on', v === 'code');\n    $('#vDiagram').classList.toggle('on', v === 'diagram');\n    $('#codeView').hidden = v !== 'code';\n    $('#diagramView').hidden = v !== 'diagram';\n    if (v === 'diagram') {\n      if (!dg) renderDiagram();\n      if (state.sel) {\n        const n = focusDiagram(state.sel);\n        renderCard(byId.get(state.sel));\n        if (n) centerOn(n);\n      }\n    } else if (state.sel) {\n      showInCode(byId.get(state.sel));\n    }\n  }\n  $('#vCode').onclick = () => setView('code');\n  $('#vDiagram').onclick = () => setView('diagram');\n\n  document.addEventListener('keydown', (e) => {\n    if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;\n    const i = locs.findIndex((x) => x.id === state.sel);\n    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); if (locs[i + 1]) select(locs[i + 1].id); }\n    else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); if (i > 0) select(locs[i - 1].id); }\n    else if (e.key === 'e' && state.sel) toggleExplain(state.sel);\n    else if (e.key === 'd') setView(state.view === 'code' ? 'diagram' : 'code');\n    else if (e.key === 'f' && state.view === 'diagram') fit(true);\n    else if (e.key === 'Escape') clearFocus();\n    else if (e.key === '/') { e.preventDefault(); searchEl.focus(); searchEl.select(); }\n  });\n\n  // ---------------------------------------------------------------- splitter, settings, copy\n  const splitter = $('#splitter');\n  if (prefs.mapW) document.documentElement.style.setProperty('--map-w', prefs.mapW);\n  splitter.addEventListener('pointerdown', (e) => {\n    splitter.setPointerCapture(e.pointerId);\n    splitter.classList.add('drag');\n    const move = (ev) => {\n      const pct = clamp((ev.clientX / window.innerWidth) * 100, 22, 75).toFixed(1) + '%';\n      document.documentElement.style.setProperty('--map-w', pct);\n      prefs.mapW = pct;\n    };\n    const up = () => {\n      splitter.classList.remove('drag');\n      splitter.removeEventListener('pointermove', move);\n      savePrefs();\n      window.dispatchEvent(new Event('resize'));\n    };\n    splitter.addEventListener('pointermove', move);\n    splitter.addEventListener('pointerup', up, { once: true });\n  });\n\n  $('#settingsBtn').onclick = () => { $('#settings').hidden = !$('#settings').hidden; };\n  $('#setRoot').value = prefs.root;\n  $('#setEditor').value = prefs.editor;\n  const onPrefs = () => {\n    prefs.root = $('#setRoot').value.trim();\n    prefs.editor = $('#setEditor').value;\n    savePrefs();\n    if (state.sel && state.view === 'diagram') renderCard(byId.get(state.sel));\n  };\n  $('#setRoot').onchange = onPrefs;\n  $('#setEditor').onchange = onPrefs;\n\n  async function copy(btn, text, label) {\n    try { await navigator.clipboard.writeText(text); btn.textContent = '✓'; } catch { btn.textContent = '✗'; }\n    if (label.length > 2) btn.textContent = btn.textContent === '✓' ? 'Copied ✓' : 'Copy failed';\n    setTimeout(() => (btn.textContent = label), 1400);\n  }\n  $('#copyCtx').onclick = (e) => copy(e.currentTarget, DATA.markdown || '', 'Copy context');\n  $('#copyMmd').onclick = (e) => copy(e.currentTarget, DATA.mermaid || '', '⧉');\n\n  let resizeTimer = null;\n  window.addEventListener('resize', () => {\n    clearTimeout(resizeTimer);\n    resizeTimer = setTimeout(() => {\n      if (!dg) return;\n      const r = svg.getBoundingClientRect();\n      if (!r.width || !r.height) return;\n      // Only re-flow clusters when the viewport shape really changed; keep the user's pan/zoom otherwise.\n      const ratio = r.width / r.height / dg.aspect;\n      if (ratio > 0.75 && ratio \u003c 1.33) return;\n      if (state.view !== 'diagram') { dg = null; return; } // rebuilt with the new aspect on next open\n      renderDiagram();\n      if (state.sel) focusDiagram(state.sel);\n    }, 250);\n  });\n\n  // ---------------------------------------------------------------- boot\n  $('.top-title').textContent = doc.title;\n  document.title = 'Waymark · ' + doc.title;\n  renderMapPane();\n  renderLegend();\n  setView(state.view);\n  const initial = decodeURIComponent(location.hash.slice(1));\n  select(byId.has(initial) ? initial : locs[0].id, { from: 'boot' });\n})();\n"},"markdown":"# Waymark: Visor HTML de Waymark: render y sincronización de panel, código y diagrama\n\nEl servidor guarda cada mapa y genera un HTML autocontenido [1a] que incrusta una instantánea de los archivos referenciados [1c] junto con el documento, el markdown y el Mermaid [1e]. En el navegador, `viewer.client.js` reconstruye un modelo indexado [2a, 2c] y pinta tres superficies — panel del mapa [3a], vista de código [4a] y diagrama SVG [5a] — que quedan sincronizadas por una única función `select` [6a].\n\n_id: `visor-html-de-waymark-render-y-sincronizacion-de-64112a` · commit 8a8e4b94 (main) · updated 2026-10-20 · query: \"¿Cómo renderiza el visor de Waymark un mapa y cómo se sincronizan el panel del mapa, la vista de código con archivos embebidos y el diagrama interactivo?\"_\n\n## The story\n\n## El problema\\n\\nUn mapa de Waymark es un JSON con trazas, ubicaciones ancladas a líneas y mucha prosa. Para que un humano lo use hace falta verlo: leer la historia, saltar al código y entender la forma del flujo. Y debe funcionar al abrir el archivo desde disco, compartirlo por chat, adjuntarlo a un ticket o incrustarlo en un webview de VS Code: sin servidor, sin red, sin dependencias.\\n\\n## Acto 1: empaquetar todo en un solo archivo\\n\\nCada vez que se guarda un mapa, `writeHtml` [1a] llama a `collectFiles` [1b], que lee cada archivo referenciado con límites de tamaño [1c] y normaliza CRLF a LF [1d] para que los números de línea coincidan con los anclajes. `renderHtml` [1e] arma un objeto `data` con el documento, los archivos, el markdown (del mapa, de cada traza y de cada nodo, para copiarlo como contexto) y el Mermaid [1f], lo serializa de forma segura dentro de un `\u003cscript type=\\\"application/json\\\">` [1g, 1h] e inyecta el CSS y el cliente leídos de disco una sola vez al cargar el módulo [1i]. El HTML trae solo el esqueleto vacío [1j]: el cliente lo rellena.\\n\\n## Acto 2: el cliente reconstruye un modelo\\n\\nAl ejecutarse, el cliente parsea el JSON incrustado [2a], asigna un color de paleta por traza [2b] y aplana todas las ubicaciones en `locs` y en el índice `byId` [2c]; el orden de pestañas sale del orden de aparición de archivos [2d], y a la vez se marcan los nodos cuya prosa tiene deriva y se detecta si hay un host de VS Code. Las preferencias (raíz local, editor, ancho del panel, vista) viven en `localStorage` por id de mapa [2e], y el estado mutable se reduce a un objeto `state` [2f]. El arranque [2g] pinta el panel, elige la vista y selecciona la ubicación del `#hash` o la primera.\\n\\n## Acto 3: tres superficies, un solo selector\\n\\nEl panel del mapa [3a] renderiza cabecera, guías y el árbol anotado [3b], distinguiendo primeras apariciones de referencias repetidas [3c] y señalando con ◔ las explicaciones por revisar; toda la prosa pasa por un mini-markdown [3e] que convierte `[1a]` en enlaces clicables [3d]. La vista de código [4a] pinta el archivo embebido con marcadores en el canalón [4b] o cae a fragmentos si no se pudo incrustar [4c, 4d]; `showInCode` [4e] inserta la anotación en línea con prev/next [4f]. El diagrama [5a] es un SVG propio: cada traza se dispone como árbol ordenado [5c, 5d], los clústeres fluyen en filas [5e] y los nodos son `foreignObject` con HTML [5h]. Todos los clics — tarjeta [3g], enlace de referencia, marcador del canalón [4g], nodo del diagrama [5j], teclado o buscador [6g] y mensajes de VS Code — terminan en `select` [6a], que resalta la tarjeta [6b], mueve el código [6c], enfoca el diagrama [6d] y abre su tarjeta [6e].\\n\\n**Takeaways:**\\n- `select` [6a] es el único punto de sincronización; cualquier interacción nueva debe pasar por él o las vistas se desalinean. Dentro de VS Code también es quien avisa a la extensión, usando `opts.from` para no hacer eco.\\n- Los ids de ubicación son la clave compartida: `data-id`, `data-ref`, `byId`, `nodeMd` y `dg.primary` [5f] dependen de ellos.\\n- El diagrama se construye perezosamente [6f]; código que asuma `dg` no nulo rompe en la vista de código.\\n- Si se quita la normalización CRLF [1d] o se superan los límites [1c], el código muestra solo fragmentos y los marcadores pueden caer en líneas incorrectas.\n\n## Trace 1: Generación del HTML autocontenido\n\nCómo el servidor empaqueta mapa, archivos, CSS y cliente en un único HTML.\n\n### Motivation\n\nEl visor debe abrirse desde disco o compartirse como un único archivo, sin servidor ni red. Por eso todo — datos, código fuente referenciado, estilos y lógica — tiene que viajar dentro del HTML, de forma segura frente a inyección de `\u003c/script>` y con un tamaño acotado.\n\n### Details\n\n`writeHtml` [1a] es el punto de entrada: lo invoca el guardado del mapa y escribe `\u003cid>.html` junto al JSON. Antes de renderizar llama a `collectFiles` [1b], que recorre las rutas únicas de todas las ubicaciones. Cada archivo pasa por un filtro [1c] (no regular, >512 KB o presupuesto total de 8 MB agotado → se omite) y luego se normaliza CRLF→LF [1d]; los archivos que faltan simplemente no aparecen y el cliente usará fragmentos.\n\n`renderHtml` [1e] construye el objeto `data` [1f] con `doc`, `files`, el markdown en tres granularidades (mapa completo, por traza y por nodo, para los botones «Copy context») y un Mermaid generado (para «copiar diagrama»). Lo serializa con `inlineJson` [1g], que escapa todo `\u003c` como `\u003c`, y lo incrusta como bloque JSON [1h]. El CSS y el cliente se leyeron de disco al cargar el módulo [1i] y se incrustan directamente. El marcado es solo un esqueleto con barra superior y contenedores vacíos [1j] que el cliente rellenará.\n\n### Server-side HTML Packaging\n\n```text\n└── [1a] writeHtml  src/store.js:58\n    ├── (rutas únicas) [1b] collectFiles  src/store.js:68\n    │   ├── (por archivo) [1c] Límites de tamaño  src/store.js:76\n    │   ├── descartar binarios (byte 0)\n    │   └── (si pasa el filtro) [1d] Normalización CRLF  src/store.js:79\n    └── (doc + files) [1e] renderHtml  src/render/html.js:24\n        ├── [1f] Objeto data  src/render/html.js:25\n        │   ├── renderMarkdown(doc, full)\n        │   └── renderMermaid(doc)\n        ├── [1j] Esqueleto del layout  src/render/html.js:69\n        ├── (serializa data) [1g] inlineJson seguro  src/render/html.js:16\n        │   └── [1h] Bloque de datos  src/render/html.js:103\n        └── (\u003cstyle> + \u003cscript>) [1i] CSS y cliente embebidos  src/render/html.js:9\n```\n\n- **[1a] writeHtml** — `src/store.js:58` (`writeHtml`)\n  Escribe el HTML del mapa junto al JSON, con archivos embebidos.\n  Es la frontera entre la persistencia y el visor: se llama tras guardar el JSON (y también al anotar) para regenerar `\u003cid>.html`. Combina dos ingredientes: el documento ya validado y la instantánea de archivos de `collectFiles` [1b]. Que el HTML se regenere en cada escritura significa que nunca hay que «compilar» el visor aparte. La contrapartida es que la instantánea refleja el árbol de trabajo en ese momento, no el commit.\n  ```\n      55    return { doc, report, narrative: narrativeGaps(doc), jsonPath: filePath(root, doc.id), htmlPath };\n      56  }\n      57  \n  >   58  export function writeHtml(root, doc) {\n      59    const p = filePath(root, doc.id, 'html');\n      60    fs.writeFileSync(p, renderHtml(doc, { files: collectFiles(root, doc) }));\n      61    return p;\n      62  }\n      63  \n      64  const MAX_FILE_BYTES = 512 * 1024;\n      65  const MAX_TOTAL_BYTES = 8 * 1024 * 1024;\n      66  \n      67  /** Snapshot of every referenced file, embedded in the viewer (code tabs, gutter markers). */\n      68  export function collectFiles(root, doc) {\n      69    const files = {};\n      70    let total = 0;\n      71    const paths = [...new Set(doc.traces.flatMap((t) => t.locations.map((l) => l.path)))];\n      72    for (const rel of n\nEl IIFE empieza leyendo el bloque JSON [2a]. A cada traza le asigna un color cíclico de la paleta [2b]; ese color se propaga como variable CSS `--tc` a tarjetas, marcadores y nodos. Luego aplana las ubicaciones en `locs` (orden de lectura, usado por prev/next y teclado) y en `byId` [2c], añadiendo a cada una un puntero a su traza. `fileOrder` [2d] define las pestañas de archivo en orden de primera aparición; a continuación se calculan los nodos y trazas con deriva narrativa y se detecta si el visor corre dentro de un webview de VS Code (`host`).\n\nLas preferencias [2e] se combinan desde valores por defecto, `meta.root` y `localStorage` con clave `waymark:\u003cid>`, así que cada mapa recuerda su vista y ancho. El estado [2f] contiene la selección, la vista activa, el archivo abierto y si la explicación en línea está desplegada. Finalmente el arranque [2g] fija título, pinta panel y leyenda, aplica la vista y selecciona la ubicación indicada en `location.hash` (enlaces profundos) o la primera.\n\n### Client Boot & Model\n\n```text\n└── [2a] Parseo de datos  src/render/viewer.client.js:5\n    ├── [2b] Color por traza  src/render/viewer.client.js:21\n    ├── (aplana trazas) [2c] Índice byId  src/render/viewer.client.js:27\n    │   └── [2d] Orden de archivos  src/render/viewer.client.js:29\n    ├── [2e] Preferencias persistentes  src/render/viewer.client.js:43\n    │   └── localStorage 'waymark:\u003cid>'\n    ├── [2f] Estado compartido  src/render/viewer.client.js:47\n    ├── Boot: renderMapPane() · renderLegend() · setView(state.view)\n    └── (#hash o locs[0]) [2g] Selección inicial  src/render/viewer.client.js:1072\n```\n\n- **[2a] Parseo de datos** — `src/render/viewer.client.js:5`\n  Lee el JSON incrustado por el servidor.\n  Recupera el objeto `data` construido en [1f] e incrustado en [1h]. `JSON.parse` decodifica los `\u003c` de vuelta a `\u003c`, así que los archivos llegan íntegros. A partir de aquí `FILES` y `doc` son de solo lectura: el visor nunca modif s de renderizar llama a `collectFiles` [1b], que recorre las rutas únicas de todas las ubicaciones. Cada archivo pasa por un filtro [1c] (no regular, >512 KB o presupuesto total de 8 MB agotado → se omite) y luego se normaliza CRLF→LF [1d]; los archivos que faltan simplemente no aparecen y el cliente usará fragmentos.\n\n`renderHtml` [1e] construye el objeto `data` [1f] con `doc`, `files`, el markdown en tres granularidades (mapa completo, por traza y por nodo, para los botones «Copy context») y un Mermaid generado (para «copiar diagrama»). Lo serializa con `inlineJson` [1g], que escapa todo `\u003c` como `\u003c`, y lo incrusta como bloque JSON [1h]. El CSS y el cliente se leyeron de disco al cargar el módulo [1i] y se incrustan directamente. El marcado es solo un esqueleto con barra superior y contenedores vacíos [1j] que el cliente rellenará.\n\n### Server-side HTML Packaging\n\n```text\n└── [1a] writeHtml  src/store.js:58\n    ├── (rutas únicas) [1b] collectFiles  src/store.js:68\n    │   ├── (por archivo) [1c] Límites de tamaño  src/store.js:76\n    │   ├── descartar binarios (byte 0)\n    │   └── (si pasa el filtro) [1d] Normalización CRLF  src/store.js:79\n    └── (doc + files) [1e] renderHtml  src/render/html.js:24\n        ├── [1f] Objeto data  src/render/html.js:25\n        │   ├── renderMarkdown(doc, full)\n        │   └── renderMermaid(doc)\n        ├── [1j] Esqueleto del layout  src/render/html.js:69\n        ├── (serializa data) [1g] inlineJson seguro  src/render/html.js:16\n        │   └── [1h] Bloque de datos  src/render/html.js:103\n        └── (\u003cstyle> + \u003cscript>) [1i] CSS y cliente embebidos  src/render/html.js:9\n```\n\n- **[1a] writeHtml** — `src/store.js:58` (`writeHtml`)\n  Escribe el HTML del mapa junto al JSON, con archivos embebidos.\n  Es la frontera entre la persistencia y el visor: se llama tras guardar el JSON (y también al anotar) para regenerar `\u003cid>.html`. Combina dos ingredientes: el documento ya validado y la instant  y selección.\n\n`renderDiagram` [5g] dibuja capas (clústeres, aristas, enlaces, nodos, etiquetas) y crea cada nodo como `foreignObject` con HTML [5h], lo que permite texto con ellipsis y estilos CSS. Al seleccionar, `focusDiagram` [5i] marca el nodo y atenúa todo lo que no esté en su ruta (ancestros, descendientes y vecinos por enlaces). El clic en un nodo [5j] llama a `select` con `from: 'diagram'`, y `renderCard` [5k] muestra la tarjeta con explicación, fragmento de código del archivo embebido, «Copy context» y enlaces al editor (vía VS Code si hay host) o al remoto.\n\n### Interactive Diagram\n\n```text\n├── [5g] renderDiagram  src/render/viewer.client.js:512\n│   ├── [5a] buildDiagram  src/render/viewer.client.js:410\n│   │   ├── (por traza) [5b] mk: nodos del árbol  src/render/viewer.client.js:418\n│   │   ├── [5c] Ancho de subárbol  src/render/viewer.client.js:433\n│   │   ├── [5d] Colocación centrada  src/render/viewer.client.js:443\n│   │   ├── (clústeres) [5e] Clústeres en filas  src/render/viewer.client.js:476\n│   │   └── [5f] Índice primary  src/render/viewer.client.js:499\n│   ├── capas: clusters → edges → links → nodes → labels\n│   ├── (por nodo) [5h] Nodo foreignObject  src/render/viewer.client.js:575\n│   └── applyHidden() · fit()\n└── [5j] Clic en nodo  src/render/viewer.client.js:773\n    ├── select(id, from: diagram)\n    ├── (desde select) [5i] focusDiagram  src/render/viewer.client.js:796\n    └── (si view = diagram) [5k] renderCard  src/render/viewer.client.js:814\n```\n\n- **[5a] buildDiagram** — `src/render/viewer.client.js:410` (`buildDiagram`)\n  Calcula nodos, aristas, clústeres y enlaces con coordenadas.\n  Es pura geometría: no toca el DOM. Devuelve `{ clusters, nodes, links, primary, bounds }`, que `renderDiagram` [5g] traduce a SVG y que `focusDiagram` [5i] y `centerOn` reutilizan. Separar cálculo y dibujo hace que el layout sea fácil de ajustar con las constantes `NODE_W`, `ROW_H`, `HGAP`.\n  ```\n     407    let dg = null;\n     40 n un único punto que actualice cada vista de forma idempotente. Ese punto es `select`; `setView` complementa reconciliando al cambiar de vista.\n\n### Details\n\n`select` [6a] valida el id contra `byId`, guarda `state.sel` y, si corre dentro de VS Code, notifica la selección a la extensión (salvo que venga del host o del arranque). Luego actualiza cada superficie en orden. En el panel [6b] quita la selección anterior, marca la tarjeta canónica, despliega su traza y hace scroll (salvo que el clic venga del propio panel). Siempre llama a `showInCode` [6c], aunque el código esté oculto, para que el cambio de vista sea instantáneo. Si el diagrama ya existe, lo enfoca [6d]; si además está visible, pinta la tarjeta y centra el nodo salvo que el clic venga del diagrama [6e]. Por último reescribe el `#hash` con `replaceState` para enlaces compartibles sin ensuciar el historial.\n\n`setView` [6f] alterna las vistas, persiste la elección y construye el diagrama perezosamente la primera vez; luego re-aplica la selección actual a la vista recién mostrada. El teclado [6g] añade navegación global: flechas o j/k recorren `locs`, `e` alterna la explicación, `d` cambia de vista, `f` ajusta el diagrama, `/` abre el buscador y Escape limpia el enfoque. Los mensajes `select`, `explain` y `view` de la extensión de VS Code entran por los mismos `select` y `setView`.\n\n### Selection Hub\n\n```text\n├── [6a] select  src/render/viewer.client.js:951\n│   ├── state.sel = id\n│   ├── (panel) [6b] Tarjeta del panel  src/render/viewer.client.js:957\n│   ├── (código (siempre)) [6c] Sincroniza código  src/render/viewer.client.js:963\n│   ├── (si dg existe) [6d] Enfoca el diagrama  src/render/viewer.client.js:965\n│   │   └── (si view = diagram) [6e] Tarjeta y centrado  src/render/viewer.client.js:968\n│   └── history.replaceState('#' + id)\n├── [6f] setView perezoso  src/render/viewer.client.js:983\n│   ├── toggle #codeView / #diagramView · savePrefs()\n│   ├── (diagram) focus + renderCard + centerOn\n│   └── (code) showInCode(sel)\n└── [6g] Atajos de teclado  src/render/viewer.client.js:996\n    ├── ↑↓ j k → select(locs[i±1])\n    └── d → setView · e → toggleExplain · Esc → clearFocus\n```\n\n- **[6a] select** — `src/render/viewer.client.js:951` (`select`)\n  Punto único que propaga la selección a todas las vistas.\n  Todos los caminos convergen aquí: tarjetas y citas del panel [3g], marcadores y prev/next del código [4g], nodos del diagrama [5j], teclado y buscador [6g], el arranque [2g] y los mensajes de la extensión de VS Code. `opts.from` indica el origen para evitar movimientos bruscos en la vista desde la que se hizo clic y para no hacer eco: si hay `host`, notifica la selección a la extensión salvo que venga del propio host o del arranque. Es idempotente: llamarla dos veces con el mismo id deja el mismo estado, lo que simplifica mucho los handlers.\n  ```\n     948    }\n     949  \n     950    // ---------------------------------------------------------------- selection & views\n  >  951    function select(id, opts = {}) {\n     952      const l = byId.get(id);\n     953      if (!l) return;\n     954      state.sel = id;\n     955      if (host && opts.from !== 'host' && opts.from !== 'boot') host.postMessage({ type: 'select', id, path: l.path, line: l.lineNumber });\n     956      $$('.loc.sel', mapPane).forEach((e) => e.classList.remove('sel'));\n     957      const card = $('.loc[data-id=\"' + id + '\"]:not(.ref-again)', mapPane);\n     958      if (card) {\n     959        card.classList.add('sel');\n     960        card.closest('.trace').classList.remove('closed');\n     961        if (opts.from !== 'map') card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n     962      }\n     963      showInCode(l);\n     964      if (dg) {\n     965        const n = focusDiagram(id);\n  ```\n- **[6b] Tarjeta del panel** — `src/render/viewer.client.js:957`\n  Marca la tarjeta canónica, despliega la traza y hace scroll.\n  El selector excluye la
