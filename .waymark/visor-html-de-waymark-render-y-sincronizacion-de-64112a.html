* { box-sizing: border-box; }

/* ---------- top bar ---------- */

/* ---------- layout ---------- */
#main { flex: 1; min-height: 0; display: flex; }
#mapPane { width: var(--map-w, 42%); min-width: 300px; max-width: 75%; overflow: auto; background: var(--panel); padding: 0 0 80px; }

/* ---------- map pane ---------- */

.trace.closed .tr-body, .trace.closed .guide { display: none; }

/* annotated tree */
.tt { list-style: none; margin: 0; padding-left: 14px; position: relative; }

.lbl { color: var(--ink2); padding: 3px 4px; font-size: 12.5px; }

.loc { border-radius: 8px; padding: 6px 8px; cursor: pointer; border: 1px solid transparent; outline: none; }
.loc:hover { background: var(--panel2); }

.lt { font-weight: 600; flex: 1; min-width: 0; }

.st { font-size: 11px; } .st.fuzzy { color: var(--warn); } .st.unresolved, .st.missing { color: var(--bad); }
.loc-code { display: flex; gap: 10px; margin: 4px 0 0 30px; font: 12px/1.5 var(--mono); color: var(--ink2); overflow: hidden; }

.loc-more { display: none; margin: 8px 0 2px 30px; }
.loc.sel .loc-more, .loc.open .loc-more, body.explain-all .loc-more { display: block; }
.loc-desc { color: var(--ink2); font-size: 12.5px; }
.explain { margin-top: 6px; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--ink2); }
.explain:hover, .explain.on { border-color: var(--accent); color: var(--accent); }
.expl { margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: var(--panel2); border-left: 3px solid var(--tc); font-size: 13px; }

.md p { margin: 0 0 8px; } .md p:last-child { margin-bottom: 0; }

#codeView { flex: 1; min-height: 0; display: flex; flex-direction: column; }

.cl .gut { width: 44px; flex-shrink: 0; display: flex; gap: 2px; justify-content: flex-end; padding-right: 4px; }
.gm { font: 700 10px/20px var(--mono); color: var(--tc); text-decoration: none; cursor: pointer; }

.tk-k { color: var(--kw); } .tk-s { color: var(--str); } .tk-c { color: var(--com); font-style: italic; } .tk-n { color: var(--num); } .tk-f { color: var(--fn); }

  radial-gradient(circle, color-mix(in srgb, var(--muted) 22%, transparent) 1px, transparent 1px) 0 0 / 22px 22px, var(--bg); }

.lg .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tc); flex-shrink: 0; }
.lg span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg.off { opacity: .4; } .lg.off .dot { background: transparent; border: 1px solid var(--tc); }
.zoom { display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }

svg .cluster rect.box { fill: color-mix(in srgb, var(--tc) 9%, transparent); stroke: color-mix(in srgb, var(--tc) 55%, transparent); stroke-width: 1.2; }

.dn { width: 100%; height: 100%; border-radius: 9px; border: 1.5px solid color-mix(in srgb, var(--tc) 70%, var(--line)); background: var(--panel); padding: 6px 9px; font: 12px/1.3 var(--sans); color: var(--ink); cursor: pointer; overflow: hidden; display: flex; flex-direction: column; justify-content: center; transition: opacity .15s, box-shadow .15s; }

.dn.label .t { font-weight: 500; }
.dn.again { border-style: dotted; opacity: .85; }
.dn.sel { box-shadow: 0 0 0 3px var(--accent); border-color: var(--accent); }
svg.focus .node.dim .dn, svg.focus .edge.dim, svg.focus .link.dim, svg.focus .elabel.dim, svg.focus .llabel.dim { opacity: .18; }
svg .hid { display: none; }

#dgTip { position: absolute; z-index: 5; max-width: 340px; padding: 8px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 12.5px; pointer-events: none; }
#dgTip[hidden], #dgCard[hidden] { display: none; }
#dgTip b { color: var(--tc); font-family: var(--mono); margin-right: 6px; }
#dgCard { position: absolute; right: 12px; bottom: 34px; width: min(420px, calc(100% - 72px)); max-height: 46%; overflow: auto; z-index: 4; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--tc); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; }
#dgCard .ch { display: flex; align-items: baseline; gap: 8px; }

/* ---------- search ---------- */
.search { position: relative; }
#search { width: 220px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font: 12.5px var(--sans); outline: none; }
#search:focus { border-color: var(--accent); width: 300px; }
#searchResults { position: absolute; top: 34px; left: 0; width: 380px; max-height: 60vh; overflow: auto; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; }

.sr { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
.sr.on, .sr[data-ref]:hover { background: var(--accent-soft); }
.sr .lid { color: var(--tc); }
.srt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srf { font: 11px var(--mono); color: var(--muted); }
.sr.more { color: var(--muted); cursor: default; font-size: 12px; }
body.searching .loc[data-id]:not(.match) { opacity: .35; }
body.searching .loc.match { box-shadow: inset 3px 0 0 var(--accent); }
svg.searching .node.nomatch .dn { opacity: .15; }

/* ---------- narrative drift ---------- */
.st.drift, .dn .dr { color: var(--warn); font-size: 12px; margin-left: 4px; }
.drift-note { margin: 0 0 8px; padding: 6px 10px; border-radius: 8px; border: 1px dashed var(--warn); color: var(--warn); font: 12px/1.45 var(--sans); }
.drift-note code { color: inherit; }
.dn.drift { border-color: var(--warn); }

/* ---------- copy buttons ---------- */
.tcopy { background: none; border: 1px solid transparent; border-radius: 6px; color: var(--muted); padding: 0 6px; font-size: 13px; }
.tcopy:hover { color: var(--accent); border-color: var(--line); }

/* ---------- minimap ---------- */
#mini { position: absolute; left: 12px; bottom: 30px; z-index: 3; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; cursor: crosshair; box-shadow: var(--shadow); }
#miniView { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }

/* ---------- narrow screens ---------- */
@media (max-width: 900px) {
  body { overflow: auto; }
  #main { flex-direction: column; }
  #mapPane { width: auto !important; max-width: none; max-height: 48vh; }
  #splitter { display: none; }
  #rightPane { min-height: 60vh; }
  .top-title { display: none; }
  #search, #search:focus { width: 150px; }
  #searchResults { width: min(380px, 90vw); }
  #mini { display: none; }
  .anno, .anno-expl { margin-left: 16px; }
}

<body>
<div id="app">
  <header id="topbar">
    <span class="brand">WAYMARK</span><span class="brand-sep"></span>
    <span class="top-title"></span>
    <div class="search">
      <input id="search" type="search" placeholder="Search nodes…  ( / )" autocomplete="off" spellcheck="false" aria-label="Search nodes">
      <div id="searchResults" hidden></div>
    </div>
    <div class="seg" role="tablist" aria-label="View">
      <button id="vCode" role="tab" title="Code view (d)">Code</button>
      <button id="vDiagram" role="tab" title="Diagram view (d)">Diagram</button>
    </div>
    <button class="tbtn" id="copyCtx" title="Copy the map as markdown context for an agent">Copy context</button>
    <button class="tbtn" id="settingsBtn" title="Editor link settings">⚙</button>
  </header>
  <div id="settings" hidden>
    <label>Local repo path <input id="setRoot" spellcheck="false"></label>
    <label>Editor
      <select id="setEditor">
        <option value="vscode">VS Code</option><option value="cursor">Cursor</option>
        <option value="windsurf">Windsurf / Devin Desktop</option><option value="idea">JetBrains</option>
      </select>
    </label>
  </div>
  <div id="main">
    <aside id="mapPane" aria-label="Map"></aside>
    <div id="splitter" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
    <section id="rightPane">
      <div id="codeView">
        <div id="fileTabs"></div>
        <div id="codeScroll"><div id="code"></div></div>
      </div>
      <div id="diagramView" hidden>
        <div class="dg-toolbar">

<script id="waymark-data" type="application/json">{"doc":{"schemaVersion":1,"id":"visor-html-de-waymark-render-y-sincronizacion-de-64112a","title":"Visor HTML de Waymark: render y sincronización de panel, código y diagrama","description":"El servidor guarda cada mapa y genera un HTML autocontenido [1a] que incrusta una instantánea de los archivos referenciados [1c] junto con el documento, el markdown y el Mermaid [1e]. En el navegador, `viewer.client.js` reconstruye un modelo indexado [2a, 2c] y pinta tres superficies — panel del mapa [3a], vista de código [4a] y diagrama SVG [5a] — que quedan sincronizadas por una única función `select` [6a].","story":"## El problema\\n\\nUn mapa de Waymark es un JSON con trazas, ubicaciones ancladas a líneas y mucha prosa. Para que un humano lo use hace falta verlo: leer la historia, saltar al código y entender la forma del flujo. Y debe funcionar al abrir el archivo desde disco, compartirlo por chat, adjuntarlo a un ticket o incrustarlo en un webview de VS Code: sin servidor, sin red, sin dependencias.\\n\\n## Acto 1: empaquetar todo en un solo archivo\\n\\nCada vez que se guarda un mapa, `writeHtml` [1a] llama a `collectFiles` [1b], que lee cada archivo referenciado con límites de tamaño [1c] y normaliza CRLF a LF [1d] para que los números de línea coincidan con los anclajes. `renderHtml` [1e] arma un objeto `data` con el documento, los archivos, el markdown (del mapa, de cada traza y de cada nodo, para copiarlo como contexto) y el Mermaid [1f], lo serializa de forma segura dentro de un `\u003cscript type=\\\"application/json\\\">` [1g, 1h] e inyecta el CSS y el cliente leídos de disco una sola vez al cargar el módulo [1i]. El HTML trae solo el esqueleto vacío [1j]: el cliente lo rellena.\\n\\n## Acto 2: el cliente reconstruye un modelo\\n\\nAl ejecutarse, el cliente parsea el JSON incrustado [2a], asigna un color de paleta por traza [2b] y aplana todas las ubicaciones en `locs` y en el índice `byId` [2c]; el orden de pestañas sale del orden de aparición de archivos [2d], y a la vez se marcan los nodos cuya prosa tiene deriva y se detecta si hay un host de VS Code. Las preferencias (raíz local, editor, ancho del panel, vista) viven en `localStorage` por id de mapa [2e], y el estado mutable se reduce a un objeto `state` [2f]. El arranque [2g] pinta el panel, elige la vista y selecciona la ubicación del `#hash` o la primera.\\n\\n## Acto 3: tres superficies, un solo selector\\n\\nEl panel del mapa [3a] renderiza cabecera, guías y el árbol anotado [3b], distinguiendo primeras apariciones de referencias repetidas [3c] y señalando con ◔ las explicaciones por revisar; toda la prosa pasa por un mini-markdown [3e] que convierte `[1a]` en enlaces clicables [3d]. La vista de código [4a] pinta el archivo embebido con marcadores en el canalón [4b] o cae a fragmentos si no se pudo incrustar [4c, 4d]; `showInCode` [4e] inserta la anotación en línea con prev/next [4f]. El diagrama [5a] es un SVG propio: cada traza se dispone como árbol ordenado [5c, 5d], los clústeres fluyen en filas [5e] y los nodos son `foreignObject` con HTML [5h]. Todos los clics — tarjeta [3g], enlace de referencia, marcador del canalón [4g], nodo del diagrama [5j], teclado o buscador [6g] y mensajes de VS Code — terminan en `select` [6a], que resalta la tarjeta [6b], mueve el código [6c], enfoca el diagrama [6d] y abre su tarjeta [6e].\\n\\n**Takeaways:**\\n- `select` [6a] es el único punto de sincronización; cualquier interacción nueva debe pasar por él o las vistas se desalinean. Dentro de VS Code también es quien avisa a la extensión, usando `opts.from` para no hacer eco.\\n- Los ids de ubicación son la clave compartida: `data-id`, `data-ref`, `byId`, `nodeMd` y `dg.primary` [5f] dependen de ellos.\\n- El diagrama se construye perezosamente [6f]; código que asuma `dg` no nulo rompe en la vista de código.\\n- Si se quita la normalización CRLF [1d] o se superan los límites [1c], el código muestra solo fragmentos y los marcadores pueden caer en líneas incorrectas.","language":"es","query":"¿Cómo renderiza el visor de Waymark un mapa y cómo se sincronizan el panel del mapa, la vista de código con archivos embebidos y el diagrama interactivo?","traces":[{"id":"1","title":"Generación del HTML autocontenido","description":"Cómo el servidor empaqueta mapa, archivos, CSS y cliente en un único HTML.","diagramTitle":"Server-side HTML Packaging","motivation":"El visor debe abrirse desde disco o compartirse como un único archivo, sin servidor ni red. Por eso todo — datos, código fuente referenciado, estilos y lógica — tiene que viajar dentro del HTML, de forma segura frente a inyección de `\u003c/script>` y con un tamaño acotado.","details":"`writeHtml` [1a] es el punto de entrada: lo invoca el guardado del mapa y escribe `\u003cid>.html` junto al JSON. Antes de renderizar llama a `collectFiles` [1b], que recorre las rutas únicas de todas las ubicaciones. Cada archivo pasa por un filtro [1c] (no regular, >512 KB o presupuesto total de 8 MB agotado → se omite) y luego se normaliza CRLF→LF [1d]; los archivos que faltan simplemente no aparecen y el cliente usará fragmentos.\n\n`renderHtml` [1e] construye el objeto `data` [1f] con `doc`, `files`, el markdown en tres granularidades (mapa completo, por traza y por nodo, para los botones «Copy context») y un Mermaid generado (para «copiar diagrama»). Lo serializa con `inlineJson` [1g], que escapa todo `\u003c` como `\u003c`, y lo incrusta como bloque JSON [1h]. El CSS y el cliente se leyeron de disco al cargar el módulo [1i] y se incrustan directamente. El marcado es solo un esqueleto con barra superior y contenedores vacíos [1j] que el cliente rellenará.","locations":[{"id":"1a","title":"writeHtml","description":"Escribe el HTML del mapa junto al JSON, con archivos embebidos.","explanation":"Es la frontera entre la persistencia y el visor: se llama tras guardar el JSON (y también al anotar) para regenerar `\u003cid>.html`. Combina dos ingredientes: el documento ya validado y la instantánea de archivos de `collectFiles` [1b]. Que el HTML se regenere en cada escritura significa que nunca hay que «compilar» el visor aparte. La contrapartida es que la instantánea refleja el árbol de trabajo en ese momento, no el commit.","path":"src/store.js","lineNumber":58,"lineContent":"export function writeHtml(root, doc) {","symbol":"writeHtml","status":"ok","fileHash":"ac474b197808","snippet":{"startLine":55,"code":"  return { doc, report, narrative: narrativeGaps(doc), jsonPath: filePath(root, doc.id), htmlPath };\n}\n\nexport function writeHtml(root, doc) {\n  const p = filePath(root, doc.id, 'html');\n  fs.writeFileSync(p, renderHtml(doc, { files: collectFiles(root, doc) }));\n  return p;\n}\n\nconst MAX_FILE_BYTES = 512 * 1024;\nconst MAX_TOTAL_BYTES = 8 * 1024 * 1024;\n\n/** Snapshot of every referenced file, embedded in the viewer (code tabs, gutter markers). */\nexport function collectFiles(root, doc) {\n  const files = {};\n  let total = 0;\n  const paths = [...new Set(doc.traces.flatMap((t) => t.locations.map((l) => l.path)))];\n  for (const rel of paths) {"},"ctxHash":"d5769c20f9bf","narrativeHash":"d5769c20f9bf"},{"id":"1b","title":"collectFiles","description":"Toma una instantánea de cada archivo referenciado por el mapa.","explanation":"Deduplica las rutas de todas las ubicaciones de todas las trazas y lee cada una de forma segura con `safeJoin`, evitando escapar de la raíz del repo. El resultado es un diccionario `{ ruta: contenido }` que viaja dentro del HTML y alimenta las pestañas y el canalón de la vista de código [4a]. Los errores de lectura se tragan a propósito: un archivo borrado no debe impedir generar el visor.","path":"src/store.js","lineNumber":68,"lineContent":"export function collectFiles(root, doc) {","symbol":"collectFiles","status":"ok","fileHash":"ac474b197808","snippet":{"startLine":65,"code":"const MAX_TOTAL_BYTES = 8 * 1024 * 1024;\n\n/** Snapshot of every referenced file, embedded in the viewer (code tabs, gutter markers). */\nexport function collectFiles(root, doc) {\n  const files = {};\n  let total = 0;\n  const paths = [...new Set(doc.traces.flatMap((t) => t.locations.map((l) => l.path)))];\n  for (const rel of paths) {\n    try {\n      const abs = safeJoin(root, rel);\n      const st = fs.statSync(abs);\n      if (!st.isFile() || st.size > MAX_FILE_BYTES || total + st.size > MAX_TOTAL_BYTES) continue;\n      const text = fs.readFileSync(abs, 'utf8');\n      if (text.indexOf(String.fromCharCode(0)) !== -1) continue; // binary\n      files[rel] = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));\n      total += st.size;\n    } catch {\n      /* missing file: the viewer falls back to the stored snippet */"},"ctxHash":"cf7819ad6319","narrativeHash":"cf7819ad6319"},{"id":"1c","title":"Límites de tamaño","description":"Omite archivos grandes, binarios o que exceden el presupuesto total.","explanation":"Un HTML con decenas de megas sería inmanejable para compartir, así que hay dos techos: 512 KB por archivo y 8 MB en total. Justo después se descartan binarios detectando un byte nulo. Los archivos omitidos no rompen nada: el cliente detecta su ausencia en `FILES` [4c] y muestra solo los fragmentos guardados. Ojo: el orden de las rutas decide quién entra cuando se agota el presupuesto.","path":"src/store.js","lineNumber":76,"lineContent":"if (!st.isFile() || st.size > MAX_FILE_BYTES || total + st.size > MAX_TOTAL_BYTES) continue;","status":"ok","fileHash":"ac474b197808","snippet":{"startLine":73,"code":"    try {\n      const abs = safeJoin(root, rel);\n      const st = fs.statSync(abs);\n      if (!st.isFile() || st.size > MAX_FILE_BYTES || total + st.size > MAX_TOTAL_BYTES) continue;\n      const text = fs.readFileSync(abs, 'utf8');\n      if (text.indexOf(String.fromCharCode(0)) !== -1) continue; // binary\n      files[rel] = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));\n      total += st.size;\n    } catch {\n      /* missing file: the viewer falls back to the stored snippet */\n    }\n  }\n  return files;\n}\n\nconst sha = (s) => crypto.createHash('sha1').update(s).digest('hex').slice(0, 12);\nconst storyHash = (doc) => sha(doc.traces.map((t) => traceHash(t)).join('|'));\n"},"ctxHash":"c4700c9d3aff","narrativeHash":"c4700c9d3aff"},{"id":"1d","title":"Normalización CRLF","description":"Convierte CRLF a LF para alinear números de línea.","explanation":"El cliente divide el archivo con `split('\\n')` [4c]; si quedaran `\\r` al final de cada línea se verían caracteres extra y el resaltado se ensuciaría. Normalizar aquí mantiene la vista coherente con los hashes de anclaje, que también normalizan finales de línea. El uso de `String.fromCharCode` evita escapes literales en el fuente, una precaución frente a herramientas que reescriben barras invertidas.","path":"src/store.js","lineNumber":79,"lineContent":"files[rel] = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));","status":"ok","fileHash":"ac474b197808","snippet":{"startLine":76,"code":"      if (!st.isFile() || st.size > MAX_FILE_BYTES || total + st.size > MAX_TOTAL_BYTES) continue;\n      const text = fs.readFileSync(abs, 'utf8');\n      if (text.indexOf(String.fromCharCode(0)) !== -1) continue; // binary\n      files[rel] = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));\n      total += st.size;\n    } catch {\n      /* missing file: the viewer falls back to the stored snippet */\n    }\n  }\n  return files;\n}\n\nconst sha = (s) => crypto.createHash('sha1').update(s).digest('hex').slice(0, 12);\nconst storyHash = (doc) => sha(doc.traces.map((t) => traceHash(t)).join('|'));\n\n/**\n * Records, for every node / trace / the story, a hash of the code the prose was written for.\n * force=true overwrites (prose just written); otherwise only fills missing baselines (old maps)."},"ctxHash":"4792dc42ac46","narrativeHash":"4792dc42ac46"},{"id":"1e","title":"renderHtml","description":"Construye el HTML completo a partir del documento y los archivos.","explanation":"Es una función pura: documento + archivos entran, una cadena HTML sale. No contiene lógica de interacción; esa vive en `viewer.client.js`, que se incrusta tal cual. Separar plantilla y cliente permite editar el JS como archivo normal (con resaltado y linters) en lugar de una cadena gigante dentro de un template literal. Además del esqueleto [1j], la plantilla ya trae la barra superior con buscador, selector de vista, «Copy context» y ajustes del editor.","path":"src/render/html.js","lineNumber":24,"lineContent":"export function renderHtml(doc, { files = {} } = {}) {","symbol":"renderHtml","status":"ok","fileHash":"2939d143d2b9","snippet":{"startLine":21,"code":" * explanations; code view with embedded files; interactive SVG diagram.\n * `files` is a snapshot { path: content } of the referenced files.\n */\nexport function renderHtml(doc, { files = {} } = {}) {\n  const data = {\n    doc,\n    files,\n    markdown: renderMarkdown(doc, { detail: 'full' }),\n    // Smaller context blocks for \"copy trace / node as context\".\n    traceMd: Object.fromEntries(doc.traces.map((t) => [t.id, renderMarkdown(doc, { trace: t.id })])),\n    nodeMd: Object.fromEntries(doc.traces.flatMap((t) => t.locations.map((l) => [l.id, renderMarkdown(doc, { node: l.id })]))),\n    mermaid: renderMermaid({ ...doc, diagram: undefined }),\n  };\n  return `\u003c!doctype html>\n\u003chtml lang=\"${escHtml(doc.language || 'en')}\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">"},"ctxHash":"fe95e1cc6e3d","narrativeHash":"fe95e1cc6e3d"},{"id":"1f","title":"Objeto data","description":"Agrupa doc, files, markdown (mapa, traza y nodo) y Mermaid para el cliente.","explanation":"Este objeto es el contrato entre servidor y cliente. `doc` y `files` alimentan las tres vistas. El markdown se precalcula en el servidor en tres granularidades: `markdown` (mapa completo, botón «Copy context»), `traceMd` por id de traza y `nodeMd` por id de ubicación, que usan los botones de copiar traza/nodo del panel [3g] y de la tarjeta del diagrama [5k]. `mermaid` alimenta el botón de copiar diagrama; se pasa `diagram: undefined` para forzar el Mermaid autogenerado aunque el mapa traiga uno manual.","path":"src/render/html.js","lineNumber":25,"lineContent":"const data = {","status":"ok","fileHash":"2939d143d2b9","snippet":{"startLine":22,"code":" * `files` is a snapshot { path: content } of the referenced files.\n */\nexport function renderHtml(doc, { files = {} } = {}) {\n  const data = {\n    doc,\n    files,\n    markdown: renderMarkdown(doc, { detail: 'full' }),\n    // Smaller context blocks for \"copy trace / node as context\".\n    traceMd: Object.fromEntries(doc.traces.map((t) => [t.id, renderMarkdown(doc, { trace: t.id })])),\n    nodeMd: Object.fromEntries(doc.traces.flatMap((t) => t.locations.map((l) => [l.id, renderMarkdown(doc, { node: l.id })]))),\n    mermaid: renderMermaid({ ...doc, diagram: undefined }),\n  };\n  return `\u003c!doctype html>\n\u003chtml lang=\"${escHtml(doc.language || 'en')}\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"generator\" content=\"waymark\">"},"ctxHash":"223142cb7e4c","narrativeHash":"223142cb7e4c"},{"id":"1g","title":"inlineJson seguro","description":"Serializa JSON escapando '\u003c' para no cerrar el script.","explanation":"Dentro de `\u003cscript type=\"application/json\">` el navegador no interpreta HTML, salvo una cosa: la secuencia `\u003c/script>` cierra el bloque. Como los archivos embebidos pueden contener exactamente eso, se reemplaza todo `\u003c` por `\u003c`, que `JSON.parse` [2a] vuelve a decodificar. `inlineScript` hace lo análogo para el cliente JS.","path":"src/render/html.js","lineNumber":16,"lineContent":"const inlineJson = (v) => JSON.stringify(v).split('\u003c').join(BS + 'u003c');","status":"ok","fileHash":"2939d143d2b9","snippet":{"startLine":13,"code":"  String(s ?? '').replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n\n// JSON inside \u003cscript type=\"application/json\">: only \"\u003c\" must be neutralized (no \"\u003c/script>\").\nconst inlineJson = (v) => JSON.stringify(v).split('\u003c').join(BS + 'u003c');\nconst inlineScript = (s) => s.replace(/\u003c\\/script/gi, '\u003c' + BS + '/script');\n\n/**\n * Self-contained, shareable viewer (no network): map pane with story, guides and\n * explanations; code view with embedded files; interactive SVG diagram.\n * `files` is a snapshot { path: content } of the referenced files.\n */\nexport function renderHtml(doc, { files = {} } = {}) {\n  const data = {\n    doc,\n    files,\n    markdown: renderMarkdown(doc, { detail: 'full' }),\n    // Smaller context blocks for \"copy trace / node as context\".\n    traceMd: Object.fromEntries(doc.traces.map((t) => [t.id, renderMarkdown(doc, { trace: t.id })])),"},"ctxHash":"08b02495e0ee","narrativeHash":"08b02495e0ee"},{"id":"1h","title":"Bloque de datos","description":"Incrusta los datos como JSON inerte dentro del documento.","explanation":"Usar un script de tipo JSON en vez de `var DATA = {...}` evita que el navegador evalúe los datos como código y permite parsearlos explícitamente. El cliente lo localiza por id en su primera línea útil [2a]. Va justo antes del script del cliente para que ya exista en el DOM cuando este se ejecute.","path":"src/render/html.js","lineNumber":103,"lineContent":"\u003cscript id=\"waymark-data\" type=\"application/json\">${inlineJson(data)}\u003c/script>","status":"ok","fileHash":"2939d143d2b9","snippet":{"startLine":100,"code":"    \u003c/section>\n  \u003c/div>\n\u003c/div>\n\u003cscript id=\"waymark-data\" type=\"application/json\">${inlineJson(data)}\u003c/script>\n\u003cscript>${inlineScript(CLIENT)}\u003c/script>\n\u003c/body>\n\u003c/html>`;\n}\n"},"ctxHash":"e66b9deeede3","narrativeHash":"e66b9deeede3"},{"id":"1i","title":"CSS y cliente embebidos","description":"Lee viewer.client.js una vez al cargar el módulo.","explanation":"CSS y cliente se leen sincrónicamente al importar el módulo, no en cada render, así que generar muchos HTML es barato. Se resuelven relativos al propio módulo (`HERE`), lo que funciona igual en instalación global o local. La consecuencia: cambios en `viewer.client.js` requieren reiniciar el servidor MCP para verse en HTML nuevos.","path":"src/render/html.js","lineNumber":9,"lineContent":"const CLIENT = fs.readFileSync(path.join(HERE, 'viewer.client.js'), 'utf8');","status":"ok","fileHash":"2939d143d2b9","snippet":{"startLine":6,"code":"\nconst HERE = path.dirname(fileURLToPath(import.meta.url));\nconst CSS = fs.readFileSync(path.join(HERE, 'viewer.css'), 'utf8');\nconst CLIENT = fs.readFileSync(path.join(HERE, 'viewer.client.js'), 'utf8');\nconst BS = String.fromCharCode(92);\n\nconst escHtml = (s) =>\n  String(s ?? '').replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n\n// JSON inside \u003cscript type=\"application/json\">: only \"\u003c\" must be neutralized (no \"\u003c/script>\").\nconst inlineJson = (v) => JSON.stringify(v).split('\u003c').join(BS + 'u003c');\nconst inlineScript = (s) => s.replace(/\u003c\\/script/gi, '\u003c' + BS + '/script');\n\n/**\n * Self-contained, shareable viewer (no network): map pane with story, guides and\n * explanations; code view with embedded files; interactive SVG diagram.\n * `files` is a snapshot { path: content } of the referenced files.\n */"},"ctxHash":"86986bc31409","narrativeHash":"86986bc31409"},{"id":"1j","title":"Esqueleto del layout","description":"Contenedores vacíos: panel del mapa, splitter, código y diagrama.","explanation":"El HTML estático solo define la estructura: `#mapPane` a la izquierda, un `#splitter` redimensionable y `#rightPane` con `#codeView` y `#diagramView` (este último oculto por defecto). Todo el contenido lo generará el cliente: el panel con `renderMapPane` [3a], el código con `renderFile` [4a] y el SVG con `renderDiagram` [5b]. Mantener el marcado mínimo evita duplicar lógica de render entre servidor y cliente.","path":"src/render/html.js","lineNumber":69,"lineContent":"\u003caside id=\"mapPane\" aria-label=\"Map\">\u003c/aside>","status":"ok","fileHash":"2939d143d2b9","snippet":{"startLine":66,"code":"    \u003c/label>\n  \u003c/div>\n  \u003cdiv id=\"main\">\n    \u003caside id=\"mapPane\" aria-label=\"Map\">\u003c/aside>\n    \u003cdiv id=\"splitter\" role=\"separator\" aria-orientation=\"vertical\" title=\"Drag to resize\">\u003c/div>\n    \u003csection id=\"rightPane\">\n      \u003cdiv id=\"codeView\">\n        \u003cdiv id=\"fileTabs\">\u003c/div>\n        \u003cdiv id=\"codeScroll\">\u003cdiv id=\"code\">\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"diagramView\" hidden>\n        \u003cdiv class=\"dg-toolbar\">\n          \u003cdiv class=\"legend\" id=\"legend\">\u003c/div>\n          \u003cdiv class=\"zoom\">\n            \u003cbutton id=\"zin\" title=\"Zoom in\">+\u003c/button>\n            \u003cbutton id=\"zout\" title=\"Zoom out\">−\u003c/button>\n            \u003cbutton id=\"zfit\" title=\"Fit all (f)\">⤢\u003c/button>\n            \u003cbutton id=\"zsel\" title=\"Center selected node\">◎\u003c/button>"},"ctxHash":"8a185d644a29","narrativeHash":"8a185d644a29"}],"tree":[{"ref":"1a","children":[{"ref":"1b","via":"rutas únicas","children":[{"ref":"1c","via":"por archivo"},{"label":"descartar binarios (byte 0)"},{"ref":"1d","via":"si pasa el filtro"}]},{"ref":"1e","via":"doc + files","children":[{"ref":"1f","children":[{"label":"renderMarkdown(doc, full)"},{"label":"renderMermaid(doc)"}]},{"ref":"1j"},{"ref":"1g","via":"serializa data","children":[{"ref":"1h"}]},{"ref":"1i","via":"\u003cstyle> + \u003cscript>"}]}]}],"narrativeHash":"16a66273fbb4"},{"id":"2","title":"Arranque del cliente y modelo","description":"El cliente parsea los datos, indexa ubicaciones, carga preferencias y arranca.","diagramTitle":"Client Boot & Model","motivation":"Las tres vistas necesitan responder rápido a «dame la ubicación 3b» o «qué ubicaciones hay en este archivo». En lugar de recorrer el documento anidado cada vez, el cliente aplana todo una sola vez en estructuras indexadas y guarda un estado mínimo compartido.","details":"El IIFE empieza leyendo el bloque JSON [2a]. A cada traza le asigna un color cíclico de la paleta [2b]; ese color se propaga como variable CSS `--tc` a tarjetas, marcadores y nodos. Luego aplana las ubicaciones en `locs` (orden de lectura, usado por prev/next y teclado) y en `byId` [2c], añadiendo a cada una un puntero a su traza. `fileOrder` [2d] define las pestañas de archivo en orden de primera aparición; a continuación se calculan los nodos y trazas con deriva narrativa y se detecta si el visor corre dentro de un webview de VS Code (`host`).\n\nLas preferencias [2e] se combinan desde valores por defecto, `meta.root` y `localStorage` con clave `waymark:\u003cid>`, así que cada mapa recuerda su vista y ancho. El estado [2f] contiene la selección, la vista activa, el archivo abierto y si la explicación en línea está desplegada. Finalmente el arranque [2g] fija título, pinta panel y leyenda, aplica la vista y selecciona la ubicación indicada en `location.hash` (enlaces profundos) o la primera.","locations":[{"id":"2a","title":"Parseo de datos","description":"Lee el JSON incrustado por el servidor.","explanation":"Recupera el objeto `data` construido en [1f] e incrustado en [1h]. `JSON.parse` decodifica los `\u003c` de vuelta a `\u003c`, así que los archivos llegan íntegros. A partir de aquí `FILES` y `doc` son de solo lectura: el visor nunca modifica el mapa.","path":"src/render/viewer.client.js","lineNumber":5,"lineContent":"const DATA = JSON.parse(document.getElementById('waymark-data').textContent);","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":2,"code":"(() => {\n  'use strict';\n\n  const DATA = JSON.parse(document.getElementById('waymark-data').textContent);\n  const { doc } = DATA;\n  const FILES = DATA.files || {};\n  const meta = doc.meta || {};\n  const PALETTE = ['#5b8cff', '#e8803a', '#3fae6a', '#c04fd0', '#d4a72c', '#2fb3c4', '#e0566b', '#8a7dff', '#7fb800', '#ff6fa8'];\n  const SVGNS = 'http://www.w3.org/2000/svg';\n\n  const $ = (s, el = document) => el.querySelector(s);\n  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));\n  const esc = (s) =>\n    String(s == null ? '' : s).replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n  const base = (p) => p.split('/').pop();\n  const extOf = (p) => (base(p).includes('.') ? base(p).split('.').pop().toLowerCase() : base(p).toLowerCase());\n  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));\n"},"ctxHash":"038bbb023c77","narrativeHash":"038bbb023c77"},{"id":"2b","title":"Color por traza","description":"Asigna un color de paleta a cada traza.","explanation":"El color es la pista visual que une las tres vistas: la misma traza tiene el mismo tono en la tarjeta del panel, en el marcador del canalón y en el clúster del diagrama. También normaliza el alias obsoleto `guide` a `details`, de modo que mapas antiguos siguen mostrando su guía.","path":"src/render/viewer.client.js","lineNumber":21,"lineContent":"const traces = doc.traces.map((t, i) => ({ ...t, color: PALETTE[i % PALETTE.length], details: t.details || t.guide }));","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":18,"code":"  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));\n\n  // ---------------------------------------------------------------- model\n  const traces = doc.traces.map((t, i) => ({ ...t, color: PALETTE[i % PALETTE.length], details: t.details || t.guide }));\n  const locs = [];\n  const byId = new Map();\n  for (const t of traces) for (const l of t.locations) {\n    const x = { ...l, trace: t };\n    locs.push(x);\n    byId.set(l.id, x);\n  }\n  const fileOrder = [...new Set(locs.map((l) => l.path))];\n\n  // Narrative drift: prose written for code that changed afterwards (set by `waymark verify --fix`).\n  const drift = meta.narrativeDrift || { nodes: [], traces: [], story: false };\n  const staleNodes = new Set(drift.nodes || []);\n  for (const l of locs) if (l.narrativeHash && l.ctxHash && l.narrativeHash !== l.ctxHash) staleNodes.add(l.id);\n  const staleTraces = new Set(drift.traces || []);"},"ctxHash":"3e877cbe16d2","narrativeHash":"3e877cbe16d2"},{"id":"2c","title":"Índice byId","description":"Aplana ubicaciones en locs y byId con puntero a la traza.","explanation":"Este índice es la columna vertebral de la sincronización: cada `data-id`/`data-ref` del DOM se resuelve aquí. `locs` conserva el orden global, usado por la navegación prev/next [4f] y las flechas del teclado [6g]. Como cada copia lleva `trace`, cualquier vista obtiene el color y el título de la traza sin búsquedas extra.","path":"src/render/viewer.client.js","lineNumber":27,"lineContent":"byId.set(l.id, x);","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":24,"code":"  for (const t of traces) for (const l of t.locations) {\n    const x = { ...l, trace: t };\n    locs.push(x);\n    byId.set(l.id, x);\n  }\n  const fileOrder = [...new Set(locs.map((l) => l.path))];\n\n  // Narrative drift: prose written for code that changed afterwards (set by `waymark verify --fix`).\n  const drift = meta.narrativeDrift || { nodes: [], traces: [], story: false };\n  const staleNodes = new Set(drift.nodes || []);\n  for (const l of locs) if (l.narrativeHash && l.ctxHash && l.narrativeHash !== l.ctxHash) staleNodes.add(l.id);\n  const staleTraces = new Set(drift.traces || []);\n  const DRIFT_NOTE = 'The code here changed after this was written — the prose may be outdated. Ask your agent: ';\n  const driftNote = (what) => '\u003cdiv class=\"drift-note\">⚠ ' + esc(DRIFT_NOTE) + '\u003ccode>/waymark refresh ' + esc(doc.id) + '\u003c/code>' + (what ? ' (' + esc(what) + ')' : '') + '\u003c/div>';\n\n  // Embedded in a VS Code webview: talk to the extension instead of opening URLs.\n  const host = typeof acquireVsCodeApi === 'function' ? acquireVsCodeApi() : null;\n"},"ctxHash":"8edfb0682b15","narrativeHash":"8edfb0682b15"},{"id":"2d","title":"Orden de archivos","description":"Pestañas en orden de primera aparición de cada ruta.","explanation":"Un `Set` preserva el orden de inserción, de modo que las pestañas siguen el hilo narrativo del mapa y no el orden alfabético. `renderTabs` lo recorre para pintar cada pestaña con su contador de ubicaciones [4a]. Justo después el cliente calcula la deriva narrativa: `staleNodes` y `staleTraces` salen de `meta.narrativeDrift` (o de comparar `narrativeHash` con `ctxHash`) y `driftNote` genera el aviso «/waymark refresh». También detecta si corre dentro de un webview de VS Code (`host`), lo que cambia cómo se abren archivos y se propaga la selección.","path":"src/render/viewer.client.js","lineNumber":29,"lineContent":"const fileOrder = [...new Set(locs.map((l) => l.path))];","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":26,"code":"    locs.push(x);\n    byId.set(l.id, x);\n  }\n  const fileOrder = [...new Set(locs.map((l) => l.path))];\n\n  // Narrative drift: prose written for code that changed afterwards (set by `waymark verify --fix`).\n  const drift = meta.narrativeDrift || { nodes: [], traces: [], story: false };\n  const staleNodes = new Set(drift.nodes || []);\n  for (const l of locs) if (l.narrativeHash && l.ctxHash && l.narrativeHash !== l.ctxHash) staleNodes.add(l.id);\n  const staleTraces = new Set(drift.traces || []);\n  const DRIFT_NOTE = 'The code here changed after this was written — the prose may be outdated. Ask your agent: ';\n  const driftNote = (what) => '\u003cdiv class=\"drift-note\">⚠ ' + esc(DRIFT_NOTE) + '\u003ccode>/waymark refresh ' + esc(doc.id) + '\u003c/code>' + (what ? ' (' + esc(what) + ')' : '') + '\u003c/div>';\n\n  // Embedded in a VS Code webview: talk to the extension instead of opening URLs.\n  const host = typeof acquireVsCodeApi === 'function' ? acquireVsCodeApi() : null;\n\n  const prefsKey = 'waymark:' + doc.id;\n  const prefs = Object.assign({ root: meta.root || '', editor: 'vscode', mapW: null, view: 'code' }, safeJson(localStorage.getItem(prefsKey)));"},"ctxHash":"4e62bd40b386","narrativeHash":"4e62bd40b386"},{"id":"2e","title":"Preferencias persistentes","description":"Combina defaults, meta.root y localStorage por id de mapa.","explanation":"La raíz local y el editor permiten construir enlaces `vscode://` desde la tarjeta del diagrama [5k]; el ancho del panel y la vista se restauran al reabrir. La clave incluye el id del mapa, así que cada visor recuerda lo suyo. `safeJson` y el try/catch de `savePrefs` toleran modo privado o datos corruptos.","path":"src/render/viewer.client.js","lineNumber":43,"lineContent":"const prefs = Object.assign({ root: meta.root || '', editor: 'vscode', mapW: null, view: 'code' }, safeJson(localStorage.getItem(prefsKey)));","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":40,"code":"  const host = typeof acquireVsCodeApi === 'function' ? acquireVsCodeApi() : null;\n\n  const prefsKey = 'waymark:' + doc.id;\n  const prefs = Object.assign({ root: meta.root || '', editor: 'vscode', mapW: null, view: 'code' }, safeJson(localStorage.getItem(prefsKey)));\n  function safeJson(s) { try { return JSON.parse(s) || {}; } catch { return {}; } }\n  const savePrefs = () => { try { localStorage.setItem(prefsKey, JSON.stringify(prefs)); } catch { /* private mode */ } };\n\n  const state = { sel: null, view: prefs.view === 'diagram' ? 'diagram' : 'code', file: null, explainOpen: new Set(), annoExpl: false };\n\n  // ---------------------------------------------------------------- text helpers\n  const REF_RE = /\\[((?:\\d+[a-z]{1,2})(?:\\s*,\\s*\\d+[a-z]{1,2})*)\\]/g;\n  function refs(html) {\n    return html.replace(REF_RE, (m, list) => {\n      const ids = list.split(/\\s*,\\s*/);\n      if (!ids.every((id) => byId.has(id))) return m;\n      return '\u003cspan class=\"refs\">[' + ids.map((id) => '\u003ca class=\"ref\" data-ref=\"' + id + '\">' + id + '\u003c/a>').join(', ') + ']\u003c/span>';\n    });\n  }"},"ctxHash":"3413146249e0","narrativeHash":"3413146249e0"},{"id":"2f","title":"Estado compartido","description":"Selección, vista, archivo abierto y explicaciones desplegadas.","explanation":"Todo el visor gira alrededor de este pequeño objeto. `sel` lo escribe solo `select` [6a]; `view` lo escribe `setView` [6f]; `file` evita re-renderizar el archivo si ya está abierto [4e]; `annoExpl` recuerda si la explicación en línea del código está abierta entre selecciones. Mantener el estado mínimo hace que las vistas sean derivables y fáciles de razonar.","path":"src/render/viewer.client.js","lineNumber":47,"lineContent":"const state = { sel: null, view: prefs.view === 'diagram' ? 'diagram' : 'code', file: null, explainOpen: new Set(), annoExpl: false };","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":44,"code":"  function safeJson(s) { try { return JSON.parse(s) || {}; } catch { return {}; } }\n  const savePrefs = () => { try { localStorage.setItem(prefsKey, JSON.stringify(prefs)); } catch { /* private mode */ } };\n\n  const state = { sel: null, view: prefs.view === 'diagram' ? 'diagram' : 'code', file: null, explainOpen: new Set(), annoExpl: false };\n\n  // ---------------------------------------------------------------- text helpers\n  const REF_RE = /\\[((?:\\d+[a-z]{1,2})(?:\\s*,\\s*\\d+[a-z]{1,2})*)\\]/g;\n  function refs(html) {\n    return html.replace(REF_RE, (m, list) => {\n      const ids = list.split(/\\s*,\\s*/);\n      if (!ids.every((id) => byId.has(id))) return m;\n      return '\u003cspan class=\"refs\">[' + ids.map((id) => '\u003ca class=\"ref\" data-ref=\"' + id + '\">' + id + '\u003c/a>').join(', ') + ']\u003c/span>';\n    });\n  }\n  function inline(s) {\n    return refs(\n      esc(s)\n        .replace(/`([^`]+)`/g, '\u003ccode>$1\u003c/code>')"},"ctxHash":"bde1076d26cc","narrativeHash":"bde1076d26cc"},{"id":"2g","title":"Selección inicial","description":"Selecciona la ubicación del hash o la primera.","explanation":"Es la última línea del arranque, tras `renderMapPane` [3a] y `setView`. Leer `location.hash` permite compartir enlaces del tipo `mapa.html#3b`. Como el arranque pasa por la misma `select` [6a] que cualquier clic, el estado inicial queda sincronizado en las tres vistas sin código especial.","path":"src/render/viewer.client.js","lineNumber":1072,"lineContent":"select(byId.has(initial) ? initial : locs[0].id, { from: 'boot' });","status":"moved","fileHash":"9845fbe7136b","snippet":{"startLine":1069,"code":"  renderLegend();\n  setView(state.view);\n  const initial = decodeURIComponent(location.hash.slice(1));\n  select(byId.has(initial) ? initial : locs[0].id, { from: 'boot' });\n})();\n"},"ctxHash":"4801e5c2936b","narrativeHash":"4801e5c2936b","note":"line 1066 -> 1072"}],"tree":[{"ref":"2a","children":[{"ref":"2b"},{"ref":"2c","via":"aplana trazas","children":[{"ref":"2d"}]},{"ref":"2e","children":[{"label":"localStorage 'waymark:\u003cid>'"}]},{"ref":"2f"},{"label":"Boot: renderMapPane() · renderLegend() · setView(state.view)"},{"ref":"2g","via":"#hash o locs[0]"}]}],"narrativeHash":"5b0812a8eebb"},{"id":"3","title":"Panel del mapa","description":"Render de cabecera, guías y árbol anotado, y delegación de clics.","diagramTitle":"Map Pane Rendering","motivation":"El panel es donde se lee el mapa: historia, motivación y detalles de cada traza, y el árbol de ubicaciones. Debe convertir prosa markdown en HTML seguro, hacer clicables las citas [1a] y ofrecer explicaciones bajo demanda sin pagar el coste de renderizarlas todas de entrada.","details":"`renderMapPane` [3a] genera de una vez todo el HTML del panel: chips de metadatos (fecha, commit, anclajes dudosos, explicaciones por revisar), resumen, botones de historia/explicaciones/guías y una sección por traza con su guía oculta, avisos de deriva y botón para copiarla. El árbol se construye recursivamente con `treeHtml` [3b], que usa un `Set` `seen` para pintar la primera aparición de una ubicación como tarjeta completa y las siguientes como referencia compacta [3c].\n\nToda la prosa pasa por `md` [3e] (párrafos, listas, encabezados, bloques de código) y por `inline`, que termina en `refs` [3d]: solo las citas cuyos ids existen se convierten en `\u003ca data-ref>`. Las explicaciones se renderizan perezosamente en `toggleExplain` [3f], la primera vez que se abren. Un único listener delegado [3g] en el panel enruta los clics: los botones de copiar traza/nodo van al portapapeles, referencias y tarjetas van a `select` [6a], y botones de guía, explicación e historia alternan visibilidad.","locations":[{"id":"3a","title":"renderMapPane","description":"Genera cabecera, guías y árboles de todas las trazas.","explanation":"Se llama una sola vez en el arranque y escribe `mapPane.innerHTML` de golpe; después, la interacción solo alterna clases y atributos `hidden`. Los chips leen `meta.anchors` para avisar de anclajes aproximados o rotos, y suman un chip «explanations to review» si hay nodos con deriva narrativa. La historia y cada guía de traza anteponen un `driftNote` cuando su prosa puede estar desactualizada. Cada sección de traza lleva `--tc` con su color [2b] y un botón ⧉ para copiar la traza como contexto.","path":"src/render/viewer.client.js","lineNumber":158,"lineContent":"function renderMapPane() {","symbol":"renderMapPane","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":155,"code":"  const STATUS = { fuzzy: '≈', unresolved: '⚠', missing: '⚠' };\n  const mapPane = $('#mapPane');\n\n  function renderMapPane() {\n    const a = meta.anchors || {};\n    const chips = [];\n    if (meta.createdAt) chips.push('\u003cspan class=\"chip\">Created ' + esc(new Date(meta.createdAt).toLocaleDateString()) + '\u003c/span>');\n    if (meta.commit) chips.push('\u003cspan class=\"chip\" title=\"' + esc(meta.commit) + '\">@ ' + esc(meta.commit.slice(0, 8)) + (meta.branch ? ' · ' + esc(meta.branch) : '') + '\u003c/span>');\n    chips.push('\u003cspan class=\"chip\">' + traces.length + ' traces · ' + locs.length + ' nodes\u003c/span>');\n    const broken = (a.unresolved || 0) + (a.missing || 0);\n    if (broken) chips.push('\u003cspan class=\"chip bad\">' + broken + ' unverified anchors\u003c/span>');\n    if (a.fuzzy) chips.push('\u003cspan class=\"chip warn\">' + a.fuzzy + ' approximate\u003c/span>');\n    if (staleNodes.size) chips.push('\u003cspan class=\"chip warn\" title=\"Code changed after these nodes were explained\">' + staleNodes.size + ' explanations to review\u003c/span>');\n\n    const head =\n      '\u003cdiv class=\"mp-head\">\u003ch1>' + esc(doc.title) + '\u003c/h1>\u003cdiv class=\"chips\">' + chips.join('') + '\u003c/div>' +\n      '\u003cdiv class=\"summary\">' + inline(doc.description) + '\u003c/div>' +\n      '\u003cdiv class=\"mp-actions\">' +"},"ctxHash":"547ed2e852e2","narrativeHash":"547ed2e852e2"},{"id":"3b","title":"treeHtml recursivo","description":"Convierte el árbol anotado en listas anidadas.","explanation":"Cada nodo del árbol puede ser una referencia a ubicación (`ref`) o un paso solo-etiqueta. Las ubicaciones se pintan como tarjetas con id, título, iconos de estado (≈/⚠ por anclaje, ◔ si la prosa tiene deriva), archivo, línea resaltada con `hl`, descripción y botones «Explain» y «Copy context». Las etiquetas se pintan como `.lbl` y el `via` encima como `↳ ...`. El resultado es `\u003cul class=\"tt\">` anidado que el CSS dibuja como árbol.","path":"src/render/viewer.client.js","lineNumber":181,"lineContent":"const treeHtml = (nodes) => {","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":178,"code":"      '\u003c/div>';\n\n    const seen = new Set();\n    const treeHtml = (nodes) => {\n      if (!nodes || !nodes.length) return '';\n      return '\u003cul class=\"tt\">' + nodes.map((n) => {\n        const l = n.ref && byId.get(n.ref);\n        let inner;\n        if (l && seen.has(l.id)) {\n          inner = '\u003cdiv class=\"loc ref-again\" data-id=\"' + l.id + '\" style=\"--tc:' + l.trace.color + '\">\u003cdiv class=\"loc-top\">\u003cspan class=\"lid\">' + l.id + '\u003c/span>\u003cspan class=\"lt\">' + esc(n.label || l.title) + '\u003c/span>\u003c/div>\u003c/div>';\n        } else if (l) {\n          seen.add(l.id);\n          const st =\n            (STATUS[l.status] ? '\u003cspan class=\"st ' + l.status + '\" title=\"' + esc(l.note || l.status) + '\">' + STATUS[l.status] + '\u003c/span>' : '') +\n            (staleNodes.has(l.id) ? '\u003cspan class=\"st drift\" title=\"Code changed after this node was explained\">◔\u003c/span>' : '');\n          inner =\n            '\u003cdiv class=\"loc\" data-id=\"' + l.id + '\" tabindex=\"0\" style=\"--tc:' + l.trace.color + '\">' +\n            '\u003cdiv class=\"loc-top\">\u003cspan class=\"lid\">' + l.id + '\u003c/span>\u003cspan class=\"lt\">' + esc(n.label || l.title) + '\u003c/span>' + st +"},"ctxHash":"2986baa29f8b","narrativeHash":"2986baa29f8b"},{"id":"3c","title":"Referencia repetida","description":"Segunda aparición de una ubicación: tarjeta compacta ref-again.","explanation":"Un árbol puede volver a una ubicación ya mostrada (`{\"ref\": \"1a\"}` más abajo). Para no duplicar tarjetas ni explicaciones, solo la primera aparición es completa; las demás llevan la clase `ref-again`. Por eso `select` [6b] y `toggleExplain` [3f] buscan siempre `.loc[data-id]:not(.ref-again)`: la tarjeta canónica es única.","path":"src/render/viewer.client.js","lineNumber":186,"lineContent":"if (l && seen.has(l.id)) {","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":183,"code":"      return '\u003cul class=\"tt\">' + nodes.map((n) => {\n        const l = n.ref && byId.get(n.ref);\n        let inner;\n        if (l && seen.has(l.id)) {\n          inner = '\u003cdiv class=\"loc ref-again\" data-id=\"' + l.id + '\" style=\"--tc:' + l.trace.color + '\">\u003cdiv class=\"loc-top\">\u003cspan class=\"lid\">' + l.id + '\u003c/span>\u003cspan class=\"lt\">' + esc(n.label || l.title) + '\u003c/span>\u003c/div>\u003c/div>';\n        } else if (l) {\n          seen.add(l.id);\n          const st =\n            (STATUS[l.status] ? '\u003cspan class=\"st ' + l.status + '\" title=\"' + esc(l.note || l.status) + '\">' + STATUS[l.status] + '\u003c/span>' : '') +\n            (staleNodes.has(l.id) ? '\u003cspan class=\"st drift\" title=\"Code changed after this node was explained\">◔\u003c/span>' : '');\n          inner =\n            '\u003cdiv class=\"loc\" data-id=\"' + l.id + '\" tabindex=\"0\" style=\"--tc:' + l.trace.color + '\">' +\n            '\u003cdiv class=\"loc-top\">\u003cspan class=\"lid\">' + l.id + '\u003c/span>\u003cspan class=\"lt\">' + esc(n.label || l.title) + '\u003c/span>' + st +\n            '\u003cspan class=\"lf\" title=\"' + esc(l.path) + '\">' + esc(base(l.path)) + '\u003c/span>\u003c/div>' +\n            '\u003cdiv class=\"loc-code\">\u003cspan class=\"ln\">' + l.lineNumber + '\u003c/span>\u003ccode>' + hl(l.lineContent || '', extOf(l.path)) + '\u003c/code>\u003c/div>' +\n            '\u003cdiv class=\"loc-more\">\u003cdiv class=\"loc-desc\">' + inline(l.description) + '\u003c/div>' +\n            '\u003cbutton class=\"explain\" data-explain=\"' + l.id + '\">' + (l.explanation ? 'Show explanation' : 'Explain') + '\u003c/button> ' +\n            '\u003cbutton class=\"explain\" data-copy-node=\"' + l.id + '\" title=\"Copy this node (with its trace context) as markdown for an agent\">Copy context\u003c/button>' +"},"ctxHash":"5be4b04fb6e8","narrativeHash":"5be4b04fb6e8"},{"id":"3d","title":"Citas clicables","description":"Convierte [1a, 2b] en enlaces data-ref si los ids existen.","explanation":"Esta es la magia que hace navegable la prosa: cualquier `[3b]` o `[1a, 2c]` en historia, guías o explicaciones se vuelve un enlace con `data-ref`. Si algún id de la lista no existe en `byId` [2c], se deja el texto intacto, evitando enlaces rotos. Los clics sobre estos enlaces los capturan los listeners delegados [3g, 4g] y terminan en `select` [6a].","path":"src/render/viewer.client.js","lineNumber":52,"lineContent":"return html.replace(REF_RE, (m, list) => {","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":49,"code":"  // ---------------------------------------------------------------- text helpers\n  const REF_RE = /\\[((?:\\d+[a-z]{1,2})(?:\\s*,\\s*\\d+[a-z]{1,2})*)\\]/g;\n  function refs(html) {\n    return html.replace(REF_RE, (m, list) => {\n      const ids = list.split(/\\s*,\\s*/);\n      if (!ids.every((id) => byId.has(id))) return m;\n      return '\u003cspan class=\"refs\">[' + ids.map((id) => '\u003ca class=\"ref\" data-ref=\"' + id + '\">' + id + '\u003c/a>').join(', ') + ']\u003c/span>';\n    });\n  }\n  function inline(s) {\n    return refs(\n      esc(s)\n        .replace(/`([^`]+)`/g, '\u003ccode>$1\u003c/code>')\n        .replace(/\\*\\*([^*]+)\\*\\*/g, '\u003cstrong>$1\u003c/strong>')\n        .replace(/(^|[^*\\w])\\*([^*\\n]+)\\*(?!\\w)/g, '$1\u003cem>$2\u003c/em>')\n        .replace(/\\[([^\\]]+)\\]\\((https?:[^)\\s]+)\\)/g, '\u003ca href=\"$2\" target=\"_blank\" rel=\"noopener\">$1\u003c/a>'),\n    );\n  }"},"ctxHash":"1ee17e768e3b","narrativeHash":"1ee17e768e3b"},{"id":"3e","title":"Mini-markdown","description":"Renderizador markdown mínimo: párrafos, listas, encabezados, código.","explanation":"En vez de incluir una librería, el cliente implementa lo justo: bloques de código cercados, encabezados (todos como `\u003ch5>` para no competir con la jerarquía del panel), listas ordenadas y no ordenadas y párrafos. El texto en línea pasa por `inline`, que escapa HTML antes de aplicar código, negritas, cursivas y enlaces, y luego `refs` [3d]. Escapar primero es lo que mantiene seguro el contenido generado por agentes.","path":"src/render/viewer.client.js","lineNumber":67,"lineContent":"function md(src) {","symbol":"md","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":64,"code":"        .replace(/\\[([^\\]]+)\\]\\((https?:[^)\\s]+)\\)/g, '\u003ca href=\"$2\" target=\"_blank\" rel=\"noopener\">$1\u003c/a>'),\n    );\n  }\n  function md(src) {\n    const out = [];\n    let list = null;\n    let para = [];\n    let code = null;\n    const flushPara = () => { if (para.length) { out.push('\u003cp>' + inline(para.join(' ')) + '\u003c/p>'); para = []; } };\n    const closeList = () => { if (list) { out.push('\u003c/' + list + '>'); list = null; } };\n    for (const raw of String(src || '').split(/\\r?\\n/)) {\n      if (code !== null) {\n        if (/^\\s*```/.test(raw)) { out.push('\u003cpre>\u003ccode>' + esc(code.join('\\n')) + '\u003c/code>\u003c/pre>'); code = null; } else code.push(raw);\n        continue;\n      }\n      if (/^\\s*```/.test(raw)) { flushPara(); closeList(); code = []; continue; }\n      const h = raw.match(/^#{1,6}\\s+(.*)/);\n      if (h) { flushPara(); closeList(); out.push('\u003ch5>' + inline(h[1]) + '\u003c/h5>'); continue; }"},"ctxHash":"7429d1208d73","narrativeHash":"7429d1208d73"},{"id":"3f","title":"toggleExplain perezoso","description":"Renderiza la explicación solo la primera vez que se abre.","explanation":"La caja `.expl` nace vacía y oculta; al abrirla por primera vez se llena con `explanationHtml`, que usa `md` [3e] o un aviso de «pide `/waymark enrich`» si falta prosa. El parámetro `force` permite que «Explain all nodes» abra o cierre todas a la vez y que la tecla `e` [6g] alterne la seleccionada.","path":"src/render/viewer.client.js","lineNumber":242,"lineContent":"function toggleExplain(id, force) {","symbol":"toggleExplain","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":239,"code":"    if (show) sec.classList.remove('closed');\n  }\n\n  function toggleExplain(id, force) {\n    const card = $('.loc[data-id=\"' + id + '\"]:not(.ref-again)', mapPane);\n    if (!card) return;\n    const box = $('.expl', card);\n    const btn = $('.explain', card);\n    const l = byId.get(id);\n    const show = force == null ? box.hidden : force;\n    if (show && !box.innerHTML) box.innerHTML = explanationHtml(l);\n    box.hidden = !show;\n    card.classList.toggle('open', show);\n    btn.classList.toggle('on', show);\n    btn.textContent = show ? 'Hide explanation' : l.explanation ? 'Show explanation' : 'Explain';\n  }\n\n  mapPane.addEventListener('click', (e) => {"},"ctxHash":"5a287a32da03","narrativeHash":"5a287a32da03"},{"id":"3g","title":"Clic delegado","description":"Un único listener enruta copias, refs, guías, explicaciones y tarjetas.","explanation":"Como el panel se genera con `innerHTML`, poner listeners por elemento sería frágil; la delegación con `closest` resuelve todo en un sitio. El orden importa: primero los botones de copiar traza/nodo (que leen `traceMd`/`nodeMd` [1f]), luego enlaces `data-ref`, «See more», «Explain», historia y botones globales, y solo al final la tarjeta completa (`select(card.dataset.id)`) y el plegado de trazas. Los botones internos llaman a `stopPropagation`, así que pulsar «Explain» o «Copy context» dentro de una tarjeta no la selecciona por accidente.","path":"src/render/viewer.client.js","lineNumber":256,"lineContent":"mapPane.addEventListener('click', (e) => {","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":253,"code":"    btn.textContent = show ? 'Hide explanation' : l.explanation ? 'Show explanation' : 'Explain';\n  }\n\n  mapPane.addEventListener('click', (e) => {\n    const ct = e.target.closest('[data-copy-trace]');\n    if (ct) { e.stopPropagation(); return copy(ct, (DATA.traceMd || {})[ct.dataset.copyTrace] || '', '⧉'); }\n    const cn = e.target.closest('[data-copy-node]');\n    if (cn) { e.stopPropagation(); return copy(cn, (DATA.nodeMd || {})[cn.dataset.copyNode] || '', 'Copy context'); }\n    const r = e.target.closest('[data-ref]');\n    if (r) { e.preventDefault(); return select(r.dataset.ref); }\n    const sm = e.target.closest('[data-guide]');\n    if (sm) { e.stopPropagation(); return toggleGuide(sm.dataset.guide); }\n    const ex = e.target.closest('[data-explain]');\n    if (ex) { e.stopPropagation(); return toggleExplain(ex.dataset.explain); }\n    if (e.target.closest('#storyBtn')) {\n      const s = $('#story');\n      s.hidden = !s.hidden;\n      e.target.textContent = s.hidden ? 'Read the full story' : 'Hide the story';"},"ctxHash":"7209107ee8e8","narrativeHash":"7209107ee8e8"}],"tree":[{"ref":"3a","children":[{"label":"chips: fecha · commit · anclajes dudosos"},{"ref":"3e","via":"story / motivation / details","children":[{"ref":"3d","via":"inline()"}]},{"ref":"3b","via":"por traza","children":[{"ref":"3c","via":"si ya vista"},{"label":"tarjeta .loc con hl(lineContent)","via":"primera aparición"}]}]},{"ref":"3g","children":[{"label":"data-ref / tarjeta → select(id)","via":"clic"},{"ref":"3f","via":"botón Explain"},{"label":"toggleGuide · story · explain-all"}]}],"narrativeHash":"b275b3a48cb6"},{"id":"4","title":"Vista de código con archivos embebidos","description":"Pinta el archivo embebido con marcadores y la anotación de la ubicación seleccionada.","diagramTitle":"Code View","motivation":"Leer la prosa no basta: el lector quiere ver la línea en su contexto. Como el HTML trae la instantánea de los archivos [1b], la vista de código puede mostrar el archivo completo, marcar todas las ubicaciones ancladas en él y desplazarse a la seleccionada, sin abrir el editor.","details":"`renderFile` [4a] se ejecuta cuando cambia el archivo activo. Primero agrupa las ubicaciones del archivo por número de línea [4b] para pintar marcadores de color en el canalón. Si el archivo está en `FILES` [4c], pinta cada línea con resaltado sintáctico; si no (omitido por tamaño o inexistente) [4d], muestra un aviso y reconstruye solo los fragmentos guardados, separados por `⋯`.\n\n`showInCode` [4e] es lo que llama `select`: renderiza el archivo si cambió, limpia el resaltado anterior, marca la fila y le inserta encima una anotación [4f] con id, descripción, botón «Explain», marca de deriva si aplica, «open ↗» dentro de VS Code y enlaces prev/next calculados sobre `locs`. Si `annoExpl` está activo, añade también la explicación completa. Por último hace scroll para dejar la línea a un tercio de la altura. Los clics en esta vista [4g] — prev/next, marcadores del canalón o citas — vuelven a `select` [6a]; «open ↗» se delega a la extensión.","locations":[{"id":"4a","title":"renderFile","description":"Renderiza el archivo activo y actualiza las pestañas.","explanation":"Fija `state.file` y repinta las pestañas, que se ordenan por `fileOrder` [2d] y muestran cuántas ubicaciones tiene cada archivo. Construye todas las filas como cadenas y hace un único `innerHTML`, lo que es rápido incluso para archivos de miles de líneas. Al pulsar una pestaña no se abre el archivo directamente: se selecciona su primera ubicación, para que el resto de vistas sigan sincronizadas.","path":"src/render/viewer.client.js","lineNumber":319,"lineContent":"function renderFile(p) {","symbol":"renderFile","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":316,"code":"    if (first) select(first.id);\n  });\n\n  function renderFile(p) {\n    state.file = p;\n    renderTabs();\n    const ext = extOf(p);\n    const markers = new Map();\n    for (const l of locs) if (l.path === p) {\n      if (!markers.has(l.lineNumber)) markers.set(l.lineNumber, []);\n      markers.get(l.lineNumber).push(l);\n    }\n    const rows = [];\n    const emit = (no, text) => {\n      const mk = markers.get(no);\n      const gut = mk ? mk.map((l) => '\u003ca class=\"gm\" data-ref=\"' + l.id + '\" style=\"--tc:' + l.trace.color + '\" title=\"' + esc(l.title) + '\">' + l.id + '\u003c/a>').join('') : '';\n      rows.push('\u003cdiv class=\"cl' + (mk ? ' anchored' : '') + '\" data-line=\"' + no + '\">\u003cspan class=\"gut\">' + gut + '\u003c/span>\u003cspan class=\"no\">' + no + '\u003c/span>\u003cspan class=\"tx\">' + hl(text, ext) + '\u003c/span>\u003c/div>');\n    };"},"ctxHash":"3bb9de9d89b1","narrativeHash":"3bb9de9d89b1"},{"id":"4b","title":"Marcadores por línea","description":"Agrupa ubicaciones por número de línea para el canalón.","explanation":"Varias ubicaciones (incluso de trazas distintas) pueden apuntar a la misma línea, así que el mapa guarda arrays. `emit` usa este mapa para pintar uno o más `\u003ca class=\"gm\" data-ref>` coloreados por traza en el canalón y la clase `anchored` en la fila. Es como poner chinchetas de colores en el margen de un libro.","path":"src/render/viewer.client.js","lineNumber":324,"lineContent":"for (const l of locs) if (l.path === p) {","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":321,"code":"    renderTabs();\n    const ext = extOf(p);\n    const markers = new Map();\n    for (const l of locs) if (l.path === p) {\n      if (!markers.has(l.lineNumber)) markers.set(l.lineNumber, []);\n      markers.get(l.lineNumber).push(l);\n    }\n    const rows = [];\n    const emit = (no, text) => {\n      const mk = markers.get(no);\n      const gut = mk ? mk.map((l) => '\u003ca class=\"gm\" data-ref=\"' + l.id + '\" style=\"--tc:' + l.trace.color + '\" title=\"' + esc(l.title) + '\">' + l.id + '\u003c/a>').join('') : '';\n      rows.push('\u003cdiv class=\"cl' + (mk ? ' anchored' : '') + '\" data-line=\"' + no + '\">\u003cspan class=\"gut\">' + gut + '\u003c/span>\u003cspan class=\"no\">' + no + '\u003c/span>\u003cspan class=\"tx\">' + hl(text, ext) + '\u003c/span>\u003c/div>');\n    };\n    if (FILES[p] != null) {\n      FILES[p].split('\\n').forEach((t, i) => emit(i + 1, t));\n    } else {\n      rows.push('\u003cdiv class=\"code-note\">Only snippets are available for this file (it was missing or too large to embed).\u003c/div>');\n      const lines = new Map();"},"ctxHash":"e386ef1e64d4","narrativeHash":"e386ef1e64d4"},{"id":"4c","title":"Archivo embebido","description":"Si el archivo está embebido, pinta todas sus líneas.","explanation":"Camino feliz: el contenido normalizado en [1d] se divide por `\\n` y cada línea se emite con número y resaltado `hl`. Que la numeración coincida con `lineNumber` depende de que el servidor haya quitado los `\\r`. Comparar con `!= null` permite archivos vacíos (cadena vacía) como válidos.","path":"src/render/viewer.client.js","lineNumber":334,"lineContent":"if (FILES[p] != null) {","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":331,"code":"      const gut = mk ? mk.map((l) => '\u003ca class=\"gm\" data-ref=\"' + l.id + '\" style=\"--tc:' + l.trace.color + '\" title=\"' + esc(l.title) + '\">' + l.id + '\u003c/a>').join('') : '';\n      rows.push('\u003cdiv class=\"cl' + (mk ? ' anchored' : '') + '\" data-line=\"' + no + '\">\u003cspan class=\"gut\">' + gut + '\u003c/span>\u003cspan class=\"no\">' + no + '\u003c/span>\u003cspan class=\"tx\">' + hl(text, ext) + '\u003c/span>\u003c/div>');\n    };\n    if (FILES[p] != null) {\n      FILES[p].split('\\n').forEach((t, i) => emit(i + 1, t));\n    } else {\n      rows.push('\u003cdiv class=\"code-note\">Only snippets are available for this file (it was missing or too large to embed).\u003c/div>');\n      const lines = new Map();\n      for (const l of locs) if (l.path === p && l.snippet) l.snippet.code.split('\\n').forEach((t, i) => lines.set(l.snippet.startLine + i, t));\n      if (!lines.size) for (const l of locs) if (l.path === p) lines.set(l.lineNumber, l.lineContent || '');\n      let prev = null;\n      for (const no of [...lines.keys()].sort((a, b) => a - b)) {\n        if (prev !== null && no !== prev + 1) rows.push('\u003cdiv class=\"gap\">⋯\u003c/div>');\n        emit(no, lines.get(no));\n        prev = no;\n      }\n    }\n    codeEl.innerHTML = rows.join('');"},"ctxHash":"c822cb265f1a","narrativeHash":"c822cb265f1a"},{"id":"4d","title":"Fallback a fragmentos","description":"Sin archivo embebido, muestra fragmentos guardados con huecos.","explanation":"Si `collectFiles` omitió el archivo por tamaño o porque no existía [1c], el visor muestra una nota y reconstruye las líneas a partir de `l.snippet` de cada ubicación; si ni siquiera hay fragmentos, usa `lineContent`. Las líneas se ordenan y entre bloques no contiguos se inserta `⋯`. Así el visor degrada con elegancia en lugar de quedarse en blanco.","path":"src/render/viewer.client.js","lineNumber":336,"lineContent":"} else {","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":333,"code":"    };\n    if (FILES[p] != null) {\n      FILES[p].split('\\n').forEach((t, i) => emit(i + 1, t));\n    } else {\n      rows.push('\u003cdiv class=\"code-note\">Only snippets are available for this file (it was missing or too large to embed).\u003c/div>');\n      const lines = new Map();\n      for (const l of locs) if (l.path === p && l.snippet) l.snippet.code.split('\\n').forEach((t, i) => lines.set(l.snippet.startLine + i, t));\n      if (!lines.size) for (const l of locs) if (l.path === p) lines.set(l.lineNumber, l.lineContent || '');\n      let prev = null;\n      for (const no of [...lines.keys()].sort((a, b) => a - b)) {\n        if (prev !== null && no !== prev + 1) rows.push('\u003cdiv class=\"gap\">⋯\u003c/div>');\n        emit(no, lines.get(no));\n        prev = no;\n      }\n    }\n    codeEl.innerHTML = rows.join('');\n  }\n"},"ctxHash":"c27accbb3bc9","narrativeHash":"c27accbb3bc9"},{"id":"4e","title":"showInCode","description":"Resalta la línea seleccionada, inserta anotación y desplaza.","explanation":"Lo llama `select` [6c] en cada selección, aunque la vista activa sea el diagrama, para que al volver al código todo esté en su sitio. Solo re-renderiza si cambia el archivo; si no, se limita a quitar la anotación previa y marcar la nueva fila. La anotación incluye el icono ◔ si la prosa del nodo tiene deriva. El scroll solo se aplica si la vista de código está visible, porque con el contenedor oculto `offsetTop` no es fiable; `setView` vuelve a llamarla al cambiar de vista [6f].","path":"src/render/viewer.client.js","lineNumber":351,"lineContent":"function showInCode(l) {","symbol":"showInCode","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":348,"code":"    codeEl.innerHTML = rows.join('');\n  }\n\n  function showInCode(l) {\n    if (state.file !== l.path) renderFile(l.path);\n    $$('.cl.hl', codeEl).forEach((e) => e.classList.remove('hl'));\n    $$('.anno, .anno-expl', codeEl).forEach((e) => e.remove());\n    const row = $('.cl[data-line=\"' + l.lineNumber + '\"]', codeEl);\n    if (!row) return;\n    row.classList.add('hl');\n    const i = locs.indexOf(byId.get(l.id));\n    const anno = document.createElement('div');\n    anno.className = 'anno';\n    anno.style.setProperty('--tc', l.trace.color);\n    anno.innerHTML =\n      '\u003cspan class=\"lid\">' + l.id + '\u003c/span>\u003cspan class=\"ad\">' + inline(l.description) + '\u003c/span>' +\n      '\u003cbutton class=\"xbtn\" data-anno-expl>' + (state.annoExpl ? 'Hide' : 'Explain') + '\u003c/button>' +\n      (staleNodes.has(l.id) ? '\u003cspan class=\"st drift\" title=\"Code changed after this node was explained\">◔\u003c/span>' : '') +"},"ctxHash":"8ad9f772085e","narrativeHash":"8ad9f772085e"},{"id":"4f","title":"Anotación prev/next","description":"Inserta id, descripción, Explain, open ↗ y enlaces prev/next sobre la línea.","explanation":"La anotación se inserta como un `\u003cdiv>` antes de la fila, de modo que aparece justo encima de la línea anclada. Los enlaces prev/next usan índices en `locs` [2c], recorriendo el mapa en orden de lectura aunque cruce archivos o trazas. Dentro de VS Code (`host`) se añade «open ↗» para revelar la línea en el editor. El botón «Explain» alterna `state.annoExpl`, que persiste entre selecciones: si lo abres, cada nueva ubicación aparece ya con su explicación.","path":"src/render/viewer.client.js","lineNumber":367,"lineContent":"(i > 0 ? '\u003ca data-go=\"' + (i - 1) + '\">← prev\u003c/a>' : '') + (i \u003c locs.length - 1 ? '\u003ca data-go=\"' + (i + 1) + '\">next →\u003c/a>' : '') + '\u003c/span>';","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":364,"code":"      '\u003cbutton class=\"xbtn\" data-anno-expl>' + (state.annoExpl ? 'Hide' : 'Explain') + '\u003c/button>' +\n      (staleNodes.has(l.id) ? '\u003cspan class=\"st drift\" title=\"Code changed after this node was explained\">◔\u003c/span>' : '') +\n      '\u003cspan class=\"an\">' + (host ? '\u003ca data-open-editor=\"' + l.id + '\" title=\"Reveal in the editor\">open ↗\u003c/a>' : '') +\n      (i > 0 ? '\u003ca data-go=\"' + (i - 1) + '\">← prev\u003c/a>' : '') + (i \u003c locs.length - 1 ? '\u003ca data-go=\"' + (i + 1) + '\">next →\u003c/a>' : '') + '\u003c/span>';\n    row.parentNode.insertBefore(anno, row);\n    if (state.annoExpl) {\n      const ex = document.createElement('div');\n      ex.className = 'anno-expl md';\n      ex.style.setProperty('--tc', l.trace.color);\n      ex.innerHTML = explanationHtml(l);\n      row.parentNode.insertBefore(ex, row);\n    }\n    if (state.view === 'code') codeScroll.scrollTop = Math.max(0, anno.offsetTop - codeScroll.clientHeight / 3);\n  }\n  codeEl.addEventListener('click', (e) => {\n    const oe = e.target.closest('[data-open-editor]');\n    if (oe) return openInHost(oe.dataset.openEditor);\n    const g = e.target.closest('[data-go]');"},"ctxHash":"76fa7235e5f7","narrativeHash":"76fa7235e5f7"},{"id":"4g","title":"Clics en el código","description":"open ↗, prev/next, toggle de explicación y marcadores vuelven a select.","explanation":"Igual que en el panel [3g], un listener delegado en `#code` resuelve todo. `data-open-editor` delega en `openInHost`, que envía un mensaje `open` a la extensión de VS Code; `data-go` navega por índice, `data-anno-expl` invierte `annoExpl` y repinta la anotación, y cualquier `data-ref` — marcadores del canalón o citas dentro de la explicación — llama a `select` [6a]. Nunca se manipulan las otras vistas desde aquí: esa responsabilidad es exclusiva de `select`.","path":"src/render/viewer.client.js","lineNumber":378,"lineContent":"codeEl.addEventListener('click', (e) => {","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":375,"code":"    }\n    if (state.view === 'code') codeScroll.scrollTop = Math.max(0, anno.offsetTop - codeScroll.clientHeight / 3);\n  }\n  codeEl.addEventListener('click', (e) => {\n    const oe = e.target.closest('[data-open-editor]');\n    if (oe) return openInHost(oe.dataset.openEditor);\n    const g = e.target.closest('[data-go]');\n    if (g) return select(locs[+g.dataset.go].id);\n    if (e.target.closest('[data-anno-expl]')) {\n      state.annoExpl = !state.annoExpl;\n      return showInCode(byId.get(state.sel));\n    }\n    const r = e.target.closest('[data-ref]');\n    if (r) select(r.dataset.ref);\n  });\n\n  // ---------------------------------------------------------------- diagram (custom SVG: tidy tree per trace + cross links)\n  const NODE_W = 200;"},"ctxHash":"26ac117d3e37","narrativeHash":"26ac117d3e37"}],"tree":[{"ref":"4e","children":[{"ref":"4a","via":"si cambia el archivo","children":[{"label":"renderTabs() con contador por archivo"},{"ref":"4b"},{"ref":"4c","via":"FILES[p] existe"},{"ref":"4d","via":"omitido / ausente"}]},{"label":"quitar .hl y anotaciones previas"},{"ref":"4f","via":"fila seleccionada"},{"label":"anno-expl si state.annoExpl"},{"label":"scrollTop = línea a 1/3 de altura","via":"si view = code"}]},{"ref":"4g","children":[{"label":"select(id) / toggle annoExpl"}]}],"narrativeHash":"87698bed127c"},{"id":"5","title":"Diagrama interactivo SVG","description":"Layout de árbol por traza, clústeres en filas, enfoque de ruta y tarjeta de detalle.","diagramTitle":"Interactive Diagram","motivation":"El árbol del panel muestra la jerarquía pero no la forma global ni los flujos entre trazas. El diagrama dibuja cada traza como un árbol ordenado dentro de un clúster de color, con enlaces cruzados, y permite enfocar la ruta de un nodo. Se implementa a mano en SVG para no depender de Mermaid ni de red.","details":"`buildDiagram` [5a] calcula la geometría. Para cada traza, `mk` [5b] convierte el árbol anotado en nodos con `kind` (`loc`, `again` o `label`), profundidad y padre. Un layout de árbol ordenado en dos pasadas calcula anchos de subárbol [5c] y luego posiciones, centrando cada padre sobre sus hijos [5d]. Los clústeres se reparten en filas de hasta 1700 px [5e], y `primary` [5f] indexa la primera aparición de cada ubicación para resolver enlaces cruzados y selección.\n\n`renderDiagram` [5g] dibuja capas (clústeres, aristas, enlaces, nodos, etiquetas) y crea cada nodo como `foreignObject` con HTML [5h], lo que permite texto con ellipsis y estilos CSS. Al seleccionar, `focusDiagram` [5i] marca el nodo y atenúa todo lo que no esté en su ruta (ancestros, descendientes y vecinos por enlaces). El clic en un nodo [5j] llama a `select` con `from: 'diagram'`, y `renderCard` [5k] muestra la tarjeta con explicación, fragmento de código del archivo embebido, «Copy context» y enlaces al editor (vía VS Code si hay host) o al remoto.","locations":[{"id":"5a","title":"buildDiagram","description":"Calcula nodos, aristas, clústeres y enlaces con coordenadas.","explanation":"Es pura geometría: no toca el DOM. Devuelve `{ clusters, nodes, links, primary, bounds }`, que `renderDiagram` [5g] traduce a SVG y que `focusDiagram` [5i] y `centerOn` reutilizan. Separar cálculo y dibujo hace que el layout sea fácil de ajustar con las constantes `NODE_W`, `ROW_H`, `HGAP`.","path":"src/render/viewer.client.js","lineNumber":410,"lineContent":"function buildDiagram() {","symbol":"buildDiagram","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":407,"code":"  let dg = null;\n  const view = { x: 0, y: 0, k: 1 };\n\n  function buildDiagram() {\n    const clusters = [];\n    const nodes = [];\n    for (const t of traces) {\n      const cn = [];\n      const ce = [];\n      const seenLocal = new Set();\n      let k = 0;\n      const mk = (n, depth, parent) => {\n        const l = n.ref ? byId.get(n.ref) : null;\n        const kind = l ? (seenLocal.has(l.id) ? 'again' : 'loc') : 'label';\n        if (l) seenLocal.add(l.id);\n        const node = { key: t.id + ':' + k++, kind, loc: l, label: n.label || (l ? l.title : '…'), via: n.via, depth, parent, children: [], trace: t };\n        node.h = kind === 'label' ? LBL_H : LOC_H;\n        cn.push(node);"},"ctxHash":"fd5a8268b6a2","narrativeHash":"fd5a8268b6a2"},{"id":"5b","title":"mk: nodos del árbol","description":"Convierte cada nodo del árbol en nodo con kind y padre.","explanation":"Recorre el árbol de la traza en profundidad. Igual que el panel [3c], distingue la primera aparición (`loc`) de repeticiones (`again`, pintadas con `↺`) y pasos solo-etiqueta (`label`, más bajos). Cada nodo guarda una clave única `traza:contador`, usada en `data-key` para atenuar y en las aristas `data-a`/`data-b`.","path":"src/render/viewer.client.js","lineNumber":418,"lineContent":"const mk = (n, depth, parent) => {","status":"ok","fileHash":"9845fbe7136b","snippet":{"startLine":415,"code":"      const ce = [];\n      const seenLocal = new Set();\n      let k = 0;\n      const mk = (n, depth, parent) => {\n        const l = n.ref ? byId.get(n.ref) : null;\n        const kind = l ? (seenLocal.has(l.id) ? 'again' : 'loc') : 'label';\n        if (l) seenLocal.add(l.id);\n        const node = { key: t.id + ':' + k++, kind, loc: l, label: n.label || (l ? l.title : '…'), via: n.via, depth, parent, children: [], trace: t };\n        node.h = kind === 'label' ? LBL_H : LOC_H;\n        cn.push(node);\n        node.children = (n.children || []).map((c) => mk(c, depth + 1, node));\n        for (const c of node.children) ce.push({ from: node, to: c, label: c.via });\n        return node;\n      };\n      const root
