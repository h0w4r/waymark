.split(/\\r?\\n/)) {\n      if (code !== null) {\n        if (/^\\s*```/.test(raw)) { out.push('\u003cpre>\u003ccode>' + esc(code.join('\\n')) + '\u003c/code>\u003c/pre>'); code = null; } else code.push(raw);\n        continue;\n      }\n      if (/^\\s*```/.test(raw)) { flushPara(); closeList(); code = []; continue; }\n      const h = raw.match(/^#{1,6}\\s+(.*)/);\n      if (h) { flushPara(); closeList(); out.push('\u003ch5>' + inline(h[1]) + '\u003c/h5>'); continue; }\n      const li = raw.match(/^\\s*([-*]|\\d+\\.)\\s+(.*)/);\n      if (li) {\n        flushPara();\n        const kind = /\\d/.test(li[1]) ? 'ol' : 'ul';\n        if (list !== kind) { closeList(); out.push('\u003c' + kind + '>'); list = kind; }\n        out.push('\u003cli>' + inline(li[2]) + '\u003c/li>');\n        continue;\n      }\n      if (!raw.trim()) { flushPara(); closeList(); continue; }\n      closeList();\n      para.push(raw.trim());\n    }\n    if (code !== null) out.push('\u003cpre>\u003ccode>' + esc(code.join('\\n')) + '\u003c/code>\u003c/pre>');\n    flushPara();\n    closeList();\n    return out.join('');\n  }\n\n  // ---------------------------------------------------------------- syntax highlight (tiny, language-agnostic)\n  const KW = new Set(('abstract and as async await break case catch class const continue def default defer del delete do elif else enum except export extends ' +\n    'false final finally fn for from func function global go if impl implements import in interface is lambda let match mod module mut namespace new nil ' +\n    'none None not null of or package pass private protected pub public raise return self static struct super switch this throw throws trait true True ' +\n    'False try type typeof use val var void when where while with yield dcl-s dcl-ds dcl-proc dcl-pi end-proc end-ds exec sql select update insert into values set').split(' '));\n  const TOK = /(\\/\\/.*$|#.*$|\\/\\*.*?\\*\\/|--.*$)|(\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*'|`(?:[^`\\\\]|\\\\.)*`)|(\\b\\d[\\d_.xXa-fA-F]*\\b)|([A-Za-z_$][\\w$-]*)(\\s*\\()?/g;\n  const HASH = /^(py|rb|sh|bash|zsh|yml|yaml|toml|r|pl|ps1|conf|cfg|ini|dockerfile|makefile|mk|cmake|nim|ex|exs)$/;\n  const DASH = /^(sql|lua|hs|elm|ada)$/;\n  function hl(line, ext) {\n    let out = '';\n    let last = 0;\n    let m;\n    TOK.lastIndex = 0;\n    while ((m = TOK.exec(line))) {\n      const t = m[0];\n      out += esc(line.slice(last, m.index));\n      if (m[1] && ((t[0] === '#' && !HASH.test(ext)) || (t.startsWith('--') && !DASH.test(ext)))) {\n        out += esc(t[0]);\n        TOK.lastIndex = m.index + 1;\n        last = m.index + 1;\n        continue;\n      }\n      if (m[1]) out += '\u003cspan class=\"tk-c\">' + esc(t) + '\u003c/span>';\n      else if (m[2]) out += '\u003cspan class=\"tk-s\">' + esc(t) + '\u003c/span>';\n      else if (m[3]) out += '\u003cspan class=\"tk-n\">' + esc(t) + '\u003c/span>';\n      else if (KW.has(m[4])) out += '\u003cspan class=\"tk-k\">' + esc(m[4]) + '\u003c/span>' + esc(m[5] || '');\n      else if (m[5]) out += '\u003cspan class=\"tk-f\">' + esc(m[4]) + '\u003c/span>' + esc(m[5]);\n      else out += esc(t);\n      last = m.index + t.length;\n    }\n    return out + esc(line.slice(last));\n  }\n\n  // ---------------------------------------------------------------- links\n  function editorUrl(l) {\n    if (!prefs.root) return null;\n    const abs = prefs.root.replace(/\\\\/g, '/').replace(/\\/$/, '') + '/' + l.path;\n    if (prefs.editor === 'idea') return 'idea://open?file=' + encodeURIComponent(abs) + '&line=' + l.lineNumber;\n    return prefs.editor + '://file' + encodeURI(abs.startsWith('/') ? abs : '/' + abs) + ':' + l.lineNumber;\n  }\n  function remoteUrl(l) {\n    const r = meta.remote;\n    const c = meta.commit;\n    if (!r || !c) return null;\n    if (/dev\\.azure\\.com|visualstudio\\.com/.test(r)) return r + '?path=/' + l.path + '&version=GC' + c + '&line=' + l.lineNumber + '&lineEnd=' + l.lineNumber + '&lineStartColumn=1&lineEndColumn=1';\n    if (/bitbucket\\./.test(r)) return r + '/src/' + c + '/' + l.path + '#lines-' + l.lineNumber;\n    if (/gitlab\\./.test(r)) return r + '/-/blob/' + c + '/' + l.path + '#L' + l.lineNumber;\n    return r + '/blob/' + c + '/' + l.path + '#L' + l.lineNumber;\n  }\n  function explanationHtml(l) {\n    if (l.explanation) return md(l.explanation);\n    return '\u003cp class=\"empty\">No storytelling explanation stored for this node yet. Ask your agent: \u003ccode>/waymark enrich ' + esc(doc.id) + '\u003c/code>\u003c/p>';\n  }\n\n  // ---------------------------------------------------------------- map pane\n  const STATUS = { fuzzy: '≈', unresolved: '⚠', missing: '⚠' };\n  const mapPane = $('#mapPane');\n\n  function renderMapPane() {\n    const a = meta.anchors || {};\n    const chips = [];\n    if (meta.createdAt) chips.push('\u003cspan class=\"chip\">Created ' + esc(new Date(meta.createdAt).toLocaleDateString()) + '\u003c/span>');\n    if (meta.commit) chips.push('\u003cspan class=\"chip\" title=\"' + esc(meta.commit) + '\">@ ' + esc(meta.commit.slice(0, 8)) + (meta.branch ? ' · ' + esc(meta.branch) : '') + '\u003c/span>');\n    chips.push('\u003cspan class=\"chip\">' + traces.length + ' traces · ' + locs.length + ' nodes\u003c/span>');\n    const broken = (a.unresolved || 0) + (a.missing || 0);\n    if (broken) chips.push('\u003cspan class=\"chip bad\">' + broken + ' unverified anchors\u003c/span>');\n    if (a.fuzzy) chips.push('\u003cspan class=\"chip warn\">' + a.fuzzy + ' approximate\u003c/span>');\n\n    const head =\n      '\u003cdiv class=\"mp-head\">\u003ch1>' + esc(doc.title) + '\u003c/h1>\u003cdiv class=\"chips\">' + chips.join('') + '\u003c/div>' +\n      '\u003cdiv class=\"summary\">' + inline(doc.description) + '\u003c/div>' +\n      '\u003cdiv class=\"mp-actions\">' +\n      (doc.story ? '\u003cbutton class=\"pill\" id=\"storyBtn\" aria-expanded=\"false\">Read the full story\u003c/button>' : '') +\n      '\u003cbutton class=\"pill\" id=\"explainAllBtn\" title=\"Expand every node with its explanation\">Explain all nodes\u003c/button>' +\n      '\u003cbutton class=\"pill\" id=\"guidesBtn\" title=\"Open every trace guide\">Open all guides\u003c/button>' +\n      '\u003c/div>' +\n      (doc.story ? '\u003cdiv class=\"story md\" id=\"story\" hidden>\u003cdiv class=\"ai-label\">AI generated story\u003c/div>' + md(doc.story) + '\u003c/div>' : '') +\n      '\u003c/div>';\n\n    const seen = new Set();\n    const treeHtml = (nodes) => {\n      if (!nodes || !nodes.length) return '';\n      return '\u003cul class=\"tt\">' + nodes.map((n) => {\n        const l = n.ref && byId.get(n.ref);\n        let inner;\n        if (l && seen.has(l.id)) {\n          inner = '\u003cdiv class=\"loc ref-again\" data-id=\"' + l.id + '\" style=\"--tc:' + l.trace.color + '\">\u003cdiv class=\"loc-top\">\u003cspan class=\"lid\">' + l.id + '\u003c/span>\u003cspan class=\"lt\">' + esc(n.label || l.title) + '\u003c/span>\u003c/div>\u003c/div>';\n        } else if (l) {\n          seen.add(l.id);\n          const st = STATUS[l.status] ? '\u003cspan class=\"st ' + l.status + '\" title=\"' + esc(l.note || l.status) + '\">' + STATUS[l.status] + '\u003c/span>' : '';\n          inner =\n            '\u003cdiv class=\"loc\" data-id=\"' + l.id + '\" tabindex=\"0\" style=\"--tc:' + l.trace.color + '\">' +\n            '\u003cdiv class=\"loc-top\">\u003cspan class=\"lid\">' + l.id + '\u003c/span>\u003cspan class=\"lt\">' + esc(n.label || l.title) + '\u003c/span>' + st +\n            '\u003cspan class=\"lf\" title=\"' + esc(l.path) + '\">' + esc(base(l.path)) + '\u003c/span>\u003c/div>' +\n            '\u003cdiv class=\"loc-code\">\u003cspan class=\"ln\">' + l.lineNumber + '\u003c/span>\u003ccode>' + hl(l.lineContent || '', extOf(l.path)) + '\u003c/code>\u003c/div>' +\n            '\u003cdiv class=\"loc-more\">\u003cdiv class=\"loc-desc\">' + inline(l.description) + '\u003c/div>' +\n            '\u003cbutton class=\"explain\" data-explain=\"' + l.id + '\">' + (l.explanation ? 'Show explanation' : 'Explain') + '\u003c/button>' +\n            '\u003cdiv class=\"expl md\" hidden>\u003c/div>\u003c/div>\u003c/div>';\n        } else {\n          inner = '\u003cdiv class=\"lbl\">' + esc(n.label || '…') + '\u003c/div>';\n        }\n        const via = n.via ? '\u003cdiv class=\"via\">↳ ' + esc(n.via) + '\u003c/div>' : '';\n        return '\u003cli>' + via + inner + treeHtml(n.children) + '\u003c/li>';\n      }).join('') + '\u003c/ul>';\n    };\n\n    const body = traces.map((t) => {\n      const hasGuide = t.motivation || t.details;\n      return (\n        '\u003csection class=\"trace\" data-trace=\"' + esc(t.id) + '\" style=\"--tc:' + t.color + '\">' +\n        '\u003cdiv class=\"tr-head\" data-toggle=\"' + esc(t.id) + '\">\u003cspan class=\"tr-num\">' + esc(t.id) + '\u003c/span>\u003cdiv class=\"tr-text\">' +\n        '\u003cdiv class=\"tr-title\">' + esc(t.title) + '\u003c/div>\u003cdiv class=\"tr-desc\">' + inline(t.description) +\n        (hasGuide ? ' \u003cbutton class=\"see-more\" data-guide=\"' + esc(t.id) + '\">See more\u003c/button>' : '') + '\u003c/div>\u003c/div>' +\n        '\u003cspan class=\"caret\">▾\u003c/span>\u003c/div>' +\n        (hasGuide\n          ? '\u003cdiv class=\"guide md\" hidden>\u003cdiv class=\"ai-label\">AI generated guide\u003c/div>' +\n            (t.motivation ? '\u003ch4>Motivation\u003c/h4>' + md(t.motivation) : '') +\n            (t.details ? '\u003ch4>Details\u003c/h4>' + md(t.details) : '') + '\u003c/div>'\n          : '') +\n        '\u003cdiv class=\"tr-body\">\u003cdiv class=\"tree-title\">' + esc(t.diagramTitle || t.title) + '\u003c/div>' + treeHtml(t.tree) + '\u003c/div>\u003c/section>'\n      );\n    }).join('');\n    mapPane.innerHTML = head + body;\n  }\n\n  function toggleGuide(tid, force) {\n    const sec = $('.trace[data-trace=\"' + tid + '\"]', mapPane);\n    if (!sec) return;\n    const g = $('.guide', sec);\n    const btn = $('.see-more', sec);\n    if (!g) eturn; }\n    const l = byId.get(d.dataset.id);\n    const box = $('#diagramView').getBoundingClientRect();\n    dgTip.style.setProperty('--tc', l.trace.color);\n    dgTip.innerHTML = '\u003cb>' + l.id + '\u003c/b>' + esc(l.title) + '\u003cdiv>' + inline(l.description) + '\u003c/div>';\n    dgTip.hidden = false;\n    dgTip.style.left = Math.min(e.clientX - box.left + 14, box.width - 350) + 'px';\n    dgTip.style.top = e.clientY - box.top + 16 + 'px';\n  });\n  svg.addEventListener('pointerleave', () => { dgTip.hidden = true; });\n  svg.addEventListener('pointerup', (e) => {\n    if (pan) {\n      svg.classList.remove('panning');\n      if (!pan.moved) clearFocus();\n      pan = null;\n    }\n  });\n  svg.addEventListener('click', (e) => {\n    const d = e.target.closest('.dn[data-id]');\n    if (d) return select(d.dataset.id, { from: 'diagram' });\n    const h = e.target.closest('[data-fit]');\n    if (h) {\n      const c = dg.clusters.find((x) => x.trace.id === h.dataset.fit);\n      fitBox(c.x, c.y, c.w, c.h, 1.2);\n    }\n  });\n  svg.addEventListener('dblclick', (e) => {\n    const d = e.target.closest('.dn[data-id]');\n    if (d) { select(d.dataset.id); setView('code'); }\n  });\n\n  function relatedKeys(n) {\n    const keys = new Set([n.key]);\n    for (let p = n.parent; p; p = p.parent) keys.add(p.key);\n    const down = (x) => { for (const c of x.children) { keys.add(c.key); down(c); } };\n    down(n);\n    for (const L of dg.links) {\n      if (L.a === n) keys.add(L.b.key);\n      if (L.b === n) keys.add(L.a.key);\n    }\n    return keys;\n  }\n  function focusDiagram(id) {\n    if (!dg) return;\n    const n = dg.primary.get(id);\n    $$('.dn.sel', svg).forEach((e) => e.classList.remove('sel'));\n    if (!n) return;\n    $$('.dn[data-id=\"' + id + '\"]', svg).forEach((e) => e.classList.add('sel'));\n    const keys = relatedKeys(n);\n    svg.classList.add('focus');\n    $$('.node', svg).forEach((g) => g.classList.toggle('dim', !keys.has(g.dataset.key)));\n    $$('[data-a]', svg).forEach((p) => p.classList.toggle('dim', !(keys.has(p.dataset.a) && keys.has(p.dataset.b))));\n    return n;\n  }\n  function clearFocus() {\n    svg.classList.remove('focus');\n    $$('.dim', svg).forEach((e) => e.classList.remove('dim'));\n    $$('.dn.sel', svg).forEach((e) => e.classList.remove('sel'));\n    dgCard.hidden = true;\n  }\n  function renderCard(l) {\n    const lines = FILES[l.path] != null ? FILES[l.path].split('\\n') : null;\n    let snippet = '';\n    const from = Math.max(1, l.lineNumber - 3);\n    const ext = extOf(l.path);\n    if (lines) {\n      const to = Math.min(lines.length, l.lineNumber + 6);\n      for (let i = from; i \u003c= to; i++) snippet += '\u003cspan class=\"r' + (i === l.lineNumber ? ' hl' : '') + '\">\u003cspan class=\"n\">' + i + '\u003c/span>' + hl(lines[i - 1], ext) + '\u003c/span>';\n    } else if (l.snippet) {\n      l.snippet.code.split('\\n').slice(0, 10).forEach((t, i) => {\n        const no = l.snippet.startLine + i;\n        snippet += '\u003cspan class=\"r' + (no === l.lineNumber ? ' hl' : '') + '\">\u003cspan class=\"n\">' + no + '\u003c/span>' + hl(t, ext) + '\u003c/span>';\n      });\n    }\n    const ed = editorUrl(l);\n    const rm = remoteUrl(l);\n    dgCard.style.setProperty('--tc', l.trace.color);\n    dgCard.innerHTML =\n      '\u003cdiv class=\"ch\">\u003cspan class=\"lid\">' + l.id + '\u003c/span>\u003ch3>' + esc(l.title) + '\u003c/h3>\u003cbutton class=\"x\" data-close title=\"Close\">×\u003c/button>\u003c/div>' +\n      '\u003cdiv class=\"where\">' + esc(l.path) + ':' + l.lineNumber + '\u003c/div>' +\n      '\u003cdiv class=\"cdesc\">' + inline(l.description) + '\u003c/div>' +\n      '\u003cdiv class=\"expl md\" style=\"--tc:' + l.trace.color + '\">' + explanationHtml(l) + '\u003c/div>' +\n      (snippet ? '\u003cpre>' + snippet + '\u003c/pre>' : '') +\n      '\u003cdiv class=\"acts\">\u003cbutton class=\"pill\" data-open-code>Open in code view\u003c/button>' +\n      (ed ? '\u003ca class=\"pill\" href=\"' + esc(ed) + '\">Open in editor\u003c/a>' : '') +\n      (rm ? '\u003ca class=\"pill\" href=\"' + esc(rm) + '\" target=\"_blank\" rel=\"noopener\">View on remote\u003c/a>' : '') + '\u003c/div>';\n    dgCard.hidden = false;\n  }\n  dgCard.addEventListener('click', (e) => {\n    if (e.target.closest('[data-close]')) return clearFocus();\n    if (e.target.closest('[data-open-code]')) return setView('code');\n    const r = e.target.closest('[data-ref]');\n    if (r) select(r.dataset.ref, { from: 'diagram' });\n  });\n\n  function renderLegend() {\n    $('#legend').innerHTML = traces.map((t) =>\n      '\u003cbutton class=\"lg' + (hidden.has(t.id) ? ' off' : '') + '\" data-lg=\"' + esc(t.id) + '\" style=\"--tc:' + t.color + '\" title=\"Show/hide trace ' + esc(t.id) + '\">\u003cspan class=\"dot\">\u003c/span>\u003cspan>' + esc(t.id + '. ' + t.title) + '\u003c/span>\u003c/button>').join('');\n  }\n  function applyHidden() {\n    $$('[data-t]', vp).forEach((e) => {\n      const ts = e.getAttribute('data-t').split(' ');\n      e.classList.toggle('hid', ts.some((t) => hidden.has(t)));\n    });\n  }\n  $('#legend').addEventListener('click', (e) => {\n    const b = e.target.closest('[data-lg]');\n    if (!b) return;\n    const id = b.dataset.lg;\n    if (hidden.has(id)) hidden.delete(id); else if (hidden.size \u003c traces.length - 1) hidden.add(id);\n    renderLegend();\n    applyHidden();\n    fit(true);\n  });\n  $('#zin').onclick = () => zoomBy(1.25);\n  $('#zout').onclick = () => zoomBy(0.8);\n  $('#zfit').onclick = () => fit(true);\n  $('#zsel').onclick = () => { const n = state.sel && dg && dg.primary.get(state.sel); if (n) centerOn(n); };\n\n  // ---------------------------------------------------------------- selection & views\n  function select(id, opts = {}) {\n    const l = byId.get(id);\n    if (!l) return;\n    state.sel = id;\n    $$('.loc.sel', mapPane).forEach((e) => e.classList.remove('sel'));\n    const card = $('.loc[data-id=\"' + id + '\"]:not(.ref-again)', mapPane);\n    if (card) {\n      card.classList.add('sel');\n      card.closest('.trace').classList.remove('closed');\n      if (opts.from !== 'map') card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n    }\n    showInCode(l);\n    if (dg) {\n      const n = focusDiagram(id);\n      if (state.view === 'diagram') {\n        renderCard(l);\n        if (n && opts.from !== 'diagram') centerOn(n);\n      }\n    }\n    history.replaceState(null, '', '#' + id);\n  }\n\n  function setView(v) {\n    state.view = v;\n    prefs.view = v;\n    savePrefs();\n    $('#vCode').classList.toggle('on', v === 'code');\n    $('#vDiagram').classList.toggle('on', v === 'diagram');\n    $('#codeView').hidden = v !== 'code';\n    $('#diagramView').hidden = v !== 'diagram';\n    if (v === 'diagram') {\n      if (!dg) renderDiagram();\n      if (state.sel) {\n        const n = focusDiagram(state.sel);\n        renderCard(byId.get(state.sel));\n        if (n) centerOn(n);\n      }\n    } else if (state.sel) {\n      showInCode(byId.get(state.sel));\n    }\n  }\n  $('#vCode').onclick = () => setView('code');\n  $('#vDiagram').onclick = () => setView('diagram');\n\n  document.addEventListener('keydown', (e) => {\n    if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;\n    const i = locs.findIndex((x) => x.id === state.sel);\n    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); if (locs[i + 1]) select(locs[i + 1].id); }\n    else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); if (i > 0) select(locs[i - 1].id); }\n    else if (e.key === 'e' && state.sel) toggleExplain(state.sel);\n    else if (e.key === 'd') setView(state.view === 'code' ? 'diagram' : 'code');\n    else if (e.key === 'f' && state.view === 'diagram') fit(true);\n    else if (e.key === 'Escape') clearFocus();\n  });\n\n  // ---------------------------------------------------------------- splitter, settings, copy\n  const splitter = $('#splitter');\n  if (prefs.mapW) document.documentElement.style.setProperty('--map-w', prefs.mapW);\n  splitter.addEventListener('pointerdown', (e) => {\n    splitter.setPointerCapture(e.pointerId);\n    splitter.classList.add('drag');\n    const move = (ev) => {\n      const pct = clamp((ev.clientX / window.innerWidth) * 100, 22, 75).toFixed(1) + '%';\n      document.documentElement.style.setProperty('--map-w', pct);\n      prefs.mapW = pct;\n    };\n    const up = () => {\n      splitter.classList.remove('drag');\n      splitter.removeEventListener('pointermove', move);\n      savePrefs();\n      window.dispatchEvent(new Event('resize'));\n    };\n    splitter.addEventListener('pointermove', move);\n    splitter.addEventListener('pointerup', up, { once: true });\n  });\n\n  $('#settingsBtn').onclick = () => { $('#settings').hidden = !$('#settings').hidden; };\n  $('#setRoot').value = prefs.root;\n  $('#setEditor').value = prefs.editor;\n  const onPrefs = () => {\n    prefs.root = $('#setRoot').value.trim();\n    prefs.editor = $('#setEditor').value;\n    savePrefs();\n    if (state.sel && state.view === 'diagram') renderCard(byId.get(state.sel));\n  };\n  $('#setRoot').onchange = onPrefs;\n  $('#setEditor').onchange = onPrefs;\n\n  async function copy(btn, text, label) {\n    try { await navigator.clipboard.writeText(text); btn.textContent = '✓'; } catch { btn.textContent = '✗'; }\n    if (label.length > 2) btn.textContent = btn.textContent === '✓' ? 'Copied ✓' : 'Copy failed';\n    setTimeout(() => (btn.textContent = label), 1400);\n  }\n  $('#copyCtx').onclick = (e) => copy(e.currentTarget, DATA.markdown || '', 'Copy context');\n  $('#copyMmd').onclick = (e) => copy(e.currentTarget, DATA.mermaid || '', '⧉');\n\n  let resizeTimer = null;\n  window.addEventListener('resize', () => {\n    clearTimeout(resizeTimer);\n    resizeTimer = setTimeout(() => {\n      if (!dg) return;\n      const r = svg.getBoundingClientRect();\n      if (!r.width || !r.height) return;\n      // Only re-flow clusters when the viewport shape really changed; keep the user's pan/zoom otherwise.\n      const ratio = r.width / r.height / dg.aspect;\n      if (ratio > 0.75 && ratio \u003c 1.33) return;\n      if (state.view !== 'diagram') { dg = null; return; } // rebuilt with the new aspect on next open\n      renderDiagram();\n      if (state.sel) focusDiagram(state.sel);\n    }, 250);\n  });\n\n  // ---------------------------------------------------------------- boot\n  $('.top-title').textContent = doc.title;\n  document.title = 'Waymark · ' + doc.title;\n  renderMapPane();\n  renderLegend();\n  setView(state.view);\n  const initial = decodeURIComponent(location.hash.slice(1));\n  select(byId.has(initial) ? initial : locs[0].id, { from: 'boot' });\n})();\n","src/render/markdown.js":"import { renderMermaid } from './mermaid.js';\n\n/** ASCII call tree, e.g. \"├── [1a] handleLogin  auth/login.ts:42\". */\nexport function renderTextTree(trace) {\n  const byId = new Map(trace.locations.map((l) => [l.id, l]));\n  const lines = [];\n  const walk = (nodes, prefix) => {\n    (nodes || []).forEach((n, i) => {\n      const last = i === nodes.length - 1;\n      const loc = n.ref ? byId.get(n.ref) : null;\n      const text = loc\n        ? `[${loc.id}] ${n.label || loc.title}  ${loc.path}:${loc.lineNumber}`\n        : n.label || '(group)';\n      lines.push(`${prefix}${last ? '└── ' : '├── '}${n.via ? `(${n.via}) ` : ''}${text}`);\n      walk(n.children, prefix + (last ? '    ' : '│   '));\n    });\n  };\n  walk(trace.tree, '');\n  return lines.join('\\n');\n}\n\nconst STATUS_MARK = { ok: '', moved: '', relocated: '', fuzzy: ' (~approx)', unresolved: ' (!unverified)', missing: ' (!missing)' };\n\n/**\n * Context-oriented rendering for agents (what an @-mention injects).\n * detail: \"full\" includes the narrative (story, guides, explanations) and snippets;\n * \"compact\" keeps only structure, one-line descriptions and anchors.\n */\nexport function renderMarkdown(doc, { detail = 'full', diagram = false } = {}) {\n  const o = [];\n  o.push(`# Waymark: ${doc.title}`);\n  o.push('');\n  o.push(doc.description);\n  const m = doc.meta || {};\n  o.push('');\n  o.push(\n    `_id: \\`${doc.id}\\`${m.commit ? ` · commit ${m.commit.slice(0, 8)}` : ''}${m.branch ? ` (${m.branch})` : ''}` +\n      `${m.updatedAt ? ` · updated ${m.updatedAt.slice(0, 10)}` : ''}${doc.query ? ` · query: \"${doc.query}\"` : ''}_`,\n  );\n\n  const full = detail === 'full';\n  if (full && doc.story) o.push('', '## The story', '', doc.story);\n\n  for (const trace of doc.traces) {\n    o.push('', `## Trace ${trace.id}: ${trace.title}`, '', trace.description);\n    if (full && trace.motivation) o.push('', '### Motivation', '', trace.motivation);\n    if (full && (trace.details || trace.guide)) o.push('', '### Details', '', trace.details || trace.guide);\n    o.push('', `### ${trace.diagramTitle || 'Tree'}`, '', '```text', renderTextTree(trace), '```', '');\n    for (const loc of trace.locations) {\n      o.push(\n        `- **[${loc.id}] ${loc.title}** — \\`${loc.path}:${loc.lineNumber}\\`${loc.symbol ? ` (\\`${loc.symbol}\\`)` : ''}${STATUS_MARK[loc.status] || ''}`,\n      );\n      o.push(`  ${loc.description}`);\n      if (full && loc.explanation) o.push(`  ${loc.explanation.replace(/\\n/g, '\\n  ')}`);\n      if (full && loc.snippet?.code) {\n        const numbered = loc.snippet.code\n          .split('\\n')\n          .map((l, i) => {\n            const n = loc.snippet.startLine + i;\n            return `${n === loc.lineNumber ? '>' : ' '}${String(n).padStart(5)}  ${l}`;\n          })\n          .join('\\n');\n        o.push('  ```', numbered.replace(/^/gm, '  '), '  ```');\n      } else if (loc.lineContent) {\n        o.push(`  \\`${loc.lineContent}\\``);\n      }\n    }\n  }\n  if (doc.links?.length) {\n    o.push('', '## Cross-trace links', '');\n    for (const l of doc.links) o.push(`- [${l.from}] → [${l.to}]${l.label ? `: ${l.label}` : ''}`);\n  }\n  if (diagram) o.push('', '## Diagram', '', '```mermaid', renderMermaid(doc), '```');\n  return o.join('\\n');\n}\n","src/verify.js":"import { FileCache, anchorLocation } from './anchor.js';\nimport { headCommit } from './git.js';\nimport { loadMap, persist, writeHtml } from './store.js';\n\n/**\n * Re-checks every anchor of a stored waymark against the current working tree.\n * With fix=true, corrected line numbers/snippets are written back.\n */\nexport function verifyMap(root, id, { fix = false } = {}) {\n  const doc = loadMap(root, id);\n  const cache = new FileCache(root);\n  const changes = [];\n  const changedFiles = new Set();\n  const counts = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0 };\n\n  for (const trace of doc.traces) {\n    trace.locations = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      counts[r.status]++;\n      if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      if (r.status !== 'ok' || r.lineNumber !== loc.lineNumber || r.path !== loc.path) {\n        changes.push({\n          id: loc.id,\n          status: r.status,\n          from: `${loc.path}:${loc.lineNumber}`,\n          to: `${r.path}:${r.lineNumber}`,\n          note: r.note,\n        });\n      }\n      return fix ? r : loc;\n    });\n  }\n\n  const broken = counts.unresolved + counts.missing;\n  const result = {\n    id: doc.id,\n    title: doc.title,\n    mapCommit: doc.meta?.commit?.slice(0, 8) || null,\n    headCommit: headCommit(root)?.slice(0, 8) || null,\n    counts,\n    changedFiles: [...changedFiles],\n    changes,\n    stale: changes.length > 0 || changedFiles.size > 0,\n    broken,\n    fixed: false,\n  };\n  if (fix && (changes.length || changedFiles.size)) {\n    doc.meta = { ...doc.meta, verifiedAt: new Date().toISOString(), commit: headCommit(root), anchors: { ...counts } };\n    persist(root, doc);\n    writeHtml(root, doc);\n    result.fixed = true;\n  }\n  return result;\n}\n"},"markdown":"# Waymark: waymark_create: from tool call to shareable viewer\n\nHow an agent's waymark_create call becomes a verified JSON map and a self-contained HTML viewer, and how it is later reused as context. Key takeaway: every location is re-anchored against the working tree by its exact line text, so line numbers from the LLM are hints, not truth.\n\n_id: `waymark-create-flow` · commit 92eefc33 (main) · updated 2026-10-20 · query: \"how does waymark_create work end to end?\"_\n\n## The story\n\nAn agent has just traced a flow through a codebase and wants to save it. It calls the `waymark_create` MCP tool [1a] with a title, some traces and a list of locations. Each location has a path, a line number it *believes* is correct, and the exact text of that line. Nothing in that payload is trusted. The handler resolves the repository root and passes the raw map to `saveMap` [1b][1d]. This is the only path that writes maps to disk.\n\n`saveMap` first runs `normalizeMap` [1e]. It parses the input with Zod, fills in missing ids (`1`, `1a`, `1b`…), builds a linear call tree when none was given, and rejects tree refs or cross-trace links that point to unknown nodes. Then the key step: `anchorMap` [1f] → [2a] checks every location against the files actually on disk. For each one, `anchorLocation` [2b] opens the file through a root-jailed cache [2g]. If the path has disappeared, it looks for a renamed file [2c]. It then tries, in order, the claimed line [2d], the same text on a different line [2e], and finally a partial or symbol match [2f]. The result is a status (`ok`, `moved`, `relocated`, `fuzzy`, `unresolved`, `missing`), a corrected line number, a code snippet and a file hash. **The LLM's line numbers are hints. The line text is the anchor.**\n\nOnce anchored, the document gets git metadata (commit, branch, remote) and is written as `.waymark/\u003cid>.json` [1g], the canonical, committable artifact. A self-contained HTML viewer is written next to it [1h]. The server then sends `resourceListChanged` [1c] so clients can @-mention `waymark://\u003cid>` immediately. The tool's reply includes the anchor report and tells the agent to fix and resubmit with the same id if anything is unhealthy.\n\nFrom there the map has three audiences (trace 3). Humans open the HTML viewer [3a] and click through nodes [3b]. Agents load it as markdown context through the `waymark://` resource [3c], rendered by `renderMarkdown` [3d]. CI and maintainers run `verifyMap` [3e], which reuses the same `anchorLocation` [2b] to catch drift: lines that moved, anchors that broke, files whose hash changed. One anchoring algorithm handles both creating a map and keeping it honest afterwards.\n\n## Trace 1: MCP entry and persistence\n\nThe MCP tool handler resolves the repo root, delegates to the store, and notifies clients that the resource list changed.\n\n### Motivation\n\nAn MCP tool call is untrusted input from an LLM. This trace makes sure there is **exactly one writer** (`saveMap`), so every map on disk has been normalized, anchored and stamped in the same way, whether it came from MCP, the CLI or a re-save. Keeping the MCP handler thin also lets the CLI (`waymark create map.json`) share the same behavior.\n\n### Details\n\nThe tool is registered with the flattened `MapInput` schema [1a], so the model sees a flat, documented argument list instead of a nested blob. The handler's only real work is resolving the root (explicit `root`, then `WAYMARK_ROOT`, then the client's root) and calling the store [1b].\n\nInside **saveMap** [1d] the order matters. Normalization [1e] comes first so the anchorer gets ids and clean POSIX paths. Anchoring [1f] runs next so the stored snippets and line numbers reflect the working tree. Only then is the JSON written [1g], followed by the HTML viewer rendered from that same document [1h]. When `id` is passed, the existing map's `createdAt` is kept, so an update does not look like a brand-new map.\n\nAfter the write, [1c] notifies MCP clients that the resource list changed, which makes `@waymark:waymark://\u003cid>` usable straight away. The response returns the anchor report so a weak map is caught and resubmitted within the same agent turn.\n\n### Tree\n\n```text\n└── [1a] Tool registration  src/mcp.js:100\n    ├── [1b] Delegate to store  src/mcp.js:113\n    │   └── [1d] saveMap  src/store.js:32\n    │       ├── [1e] Normalize  src/store.js:33\n    │       ├── [1f] Anchor  src/store.js:34\n    │       ├── [1g] Write JSON  src/store.js:52\n    │       └── [1h] Write HTML  src/store.js:53\n    └── [1c] Notify resource change  src/mcp.js:114\n```\n\n- **[1a] Tool registration** — `src/mcp.js:100` (`waymark_create`)\n  Registers waymark_create with a flat MapInput schema plus optional id/root.\n  This is where the whole flow starts: the MCP server publishes `waymark_create` to the client. The input schema spreads `MapInput.shape` and adds `id` and `root`, so the model sees a flat list of documented arguments instead of a nested object. That makes well-formed calls more likely. The tool description tells the model up front that line numbers will be auto-corrected and that unresolved anchors must be fixed and resubmitted, which sets expectations for the reply. The handler is wrapped in `safe(...)`, so a validation error (for example a duplicate location id from [1e]) comes back as an `isError` tool result instead of crashing the server.\n  ```\n      97    );\n      98  \n      99    server.registerTool(\n  >  100      'waymark_create',\n     101      {\n     102        title: 'Create or update a waymark',\n     103        description:\n     104          'Validates a waymark, verifies every location against the working tree (auto-correcting shifted line numbers), stores it under .waymark/ and writes a shareable HTML viewer. Pass `id` to overwrite an existing map. Returns an anchor report: fix any unresolved/missing locations and resubmit.',\n     105        inputSchema: {\n     106          ...MapInput.shape,\n     107          id: z.string().optional().describe('Existing waymark id to overwrite'),\n     108          root: rootArg,\n     109        },\n     110      },\n     111      safe(async ({ id, root, ...map }) => {\n     112        const r = rootOf(root);\n     113        const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });\n     114        server.sendResourceListChanged();\n  ```\n- **[1b] Delegate to store** — `src/mcp.js:113`\n  Handler resolves the root and hands the raw map to saveMap.\n  The handler pulls `id` and `root` out of the arguments and treats everything else as the map. `rootOf` resolves the repository root from the explicit argument, then `WAYMARK_ROOT`, then the root the client announced. Getting this wrong would anchor against the wrong tree, which is why the waymark agent always passes `root`. All the real work is delegated to `saveMap` [1d], which returns the stored document, the anchor report and the file paths. The handler then builds the reply: the `waymark://` URI, file paths, the report, and a `next` hint that tells the agent to resubmit with the same `id` if the map is unhealthy.\n  ```\n     110      },\n     111      safe(async ({ id, root, ...map }) => {\n     112        const r = rootOf(root);\n  >  113        const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });\n     114        server.sendResourceListChanged();\n     115        const next = [];\n     116        if (!report.healthy) {\n     117          next.push('Some locations could not be verified. Fix them (waymark_find_anchor helps) and call waymark_create again with id=\"' + doc.id + '\".');\n     118        }\n     119        if (!narrative.complete) {\n     120          next.push('Narrative is incomplete (see \"narrative\"). Fill the story, trace motivation/details and per-location explanations with waymark_annotate(id=\"' + doc.id + '\").');\n     121        }\n     122        if (!next.length) next.push('All anchors verified and narrative complete. Share the HTML file or reference waymark://' + doc.id);\n     123        return text({ id: doc.id, resource: `waymark://${doc.id}`, html: htmlPath, json: jsonPath, anchors: report, narrative, next });\n     124      }),\n     125    );\n     126  \n     127    const prose = () => z.string().optional();\n  ```\n- **[1c] Notify resource change** — `src/mcp.js:114`\n  Notifies MCP clients that the waymark:// resource list changed.\n  Right after the map is written, the server sends `resourceListChanged`. Clients such as Claude Code then re-query the resource template's `list` callback [3c] and the new map appears in @-mention autocompletion straight away, with no server restart. Without this call, the map would exist on disk but clients would not see it until they refreshed on their own. Note that it fires even when the anchor report is unhealthy: the map is saved either way, and health is reported separately.\n  ```\n     111      safe(async ({ id, root, ...map }) => {\n     112        const r = rootOf(root);\n     113        const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });\n  >  114        server.sendResourceListChanged();\n     115        const next = [];\n     116        if (!report.healthy) {\n     117          next.push('Some locations could not be verified. Fix them (waymark_find_anchor helps) and call waymark_create again with id=\"' + doc.id + '\".');\n     118        }\n     119        if (!narrative.complete) {\n     120          next.push('Narrative is incomplete (see \"narrative\"). Fill the story, trace motivation/details and per-location explanations with waymark_annotate(id=\"' + doc.id + '\").');\n     121        }\n     122        if (!next.length) next.push('All anchors verified and narrative complete. Share the HTML file or reference waymark://' + doc.id);\n     123        return text({ id: doc.id, resource: `waymark://${doc.id}`, html: htmlPath, json: jsonPath, anchors: report, narrative, next });\n     124      }),\n     125    );\n     126  \n     127    const prose = () => z.string().optional();\n     128    server.registerTool(\n  ```\n- **[1d] saveMap** — `src/store.js:32` (`saveMap`)\n  Single writer: normalize, anchor, stamp git metadata, write JSON and HTML.\n  `saveMap` is the only function that turns input into a stored map, and both the MCP tool [1b] and the CLI use it. It runs normalization [1e] and anchoring [1f] in order, then builds the document. The id is either the caller's `id` (overwrite) or a slug of the title plus 3 random bytes, which keeps collisions unlikely without a registry. When overwriting, it loads the existing map just to keep its `createdAt`. It also stamps `commit`, `branch` and `remote` so later readers know which revision the anchors were taken from and the viewer can build remote links. The anchor counts go into `meta.anchors`, with the noisy `issues` list removed.\n  ```\n      29  }\n      30  \n      31  /** Validates, anchors against the working tree, persists JSON (+ HTML viewer). */\n  >   32  export function saveMap(root, input, { id, html = true } = {}) {\n      33    const map = normalizeMap(input);\n      34    const report = anchorMap(root, map);\n      35    const existing = id ? loadMap(root, id, { quiet: true }) : null;\n      36    const now = new Date().toISOString();\n      37    const doc = {\n      38      schemaVersion: SCHEMA_VERSION,\n      39      id: id || `${slugify(map.title)}-${crypto.randomBytes(3).toString('hex')}`,\n      40      ...map,\n      41      meta: {\n      42        createdAt: existing?.meta?.createdAt || now,\n      43        updatedAt: now,\n      44        root,\n      45        commit: headCommit(root),\n      46        branch: currentBranch(root),\n  ```\n- **[1e] Normalize** — `src/store.js:33`\n  Zod-validates the input, assigns ids, defaults the tree, rejects dangling refs.\n  `normalizeMap` parses the input with the Zod `MapInput` schema, then fills in what the LLM left out. Missing trace ids become `1`, `2`… and missing location ids become `1a`, `1b`…. Ids must match `[A-Za-z0-9_-]{1,16}` and be unique across the whole map. Paths are converted to POSIX form and stripped of a leading `./`, so Windows-style input anchors the same way. A legacy `guide` field is moved to `details`. If no `tree` is given, a linear chain is built (each step nested under the previous one). Finally, every tree ref and cross-trace link is checked, and a reference to an unknown location throws before anything touches the disk.\n  ```\n      30  \n      31  /** Validates, anchors against the working tree, persists JSON (+ HTML viewer). */\n      32  export function saveMap(root, input, { id, html = true } = {}) {\n  >   33    const map = normalizeMap(input);\n      34    const report = anchorMap(root, map);\n      35    const existing = id ? loadMap(root, id, { quiet: true }) : null;\n      36    const now = new Date().toISOString();\n      37    const doc = {\n      38      schemaVersion: SCHEMA_VERSION,\n      39      id: id || `${slugify(map.title)}-${crypto.randomBytes(3).toString('hex')}`,\n      40      ...map,\n      41      meta: {\n      42        createdAt: existing?.meta?.createdAt || now,\n      43        updatedAt: now,\n      44        root,\n      45        commit: headCommit(root),\n      46        branch: currentBranch(root),\n      47        remote: remoteWebUrl(root),\n  ```\n- **[1f] Anchor** — `src/store.js:34`\n  Verifies every location against the working tree; see trace 2.\n  This single call links the store to the anchoring engine [2a]. It changes `map.traces[*].locations` in place, replacing each location with its anchored version (corrected line, real line text, snippet, file hash, status). It returns the health report that ends up in both the tool reply and `meta.anchors`. Because it runs before the JSON write [1g], the stored snippets always match the tree as it was at save time, never the LLM's guess. An unhealthy report does not stop the save: the map is still persisted so the agent can fix it under the same id.\n  ```\n      31  /** Validates, anchors against the working tree, persists JSON (+ HTML viewer). */\n      32  export function saveMap(root, input, { id, html = true } = {}) {\n      33    const map = normalizeMap(input);\n  >   34    const report = anchorMap(root, map);\n      35    const existing = id ? loadMap(root, id, { quiet: true }) : null;\n      36    const now = new Date().toISOString();\n      37    const doc = {\n      38      schemaVersion: SCHEMA_VERSION,\n      39      id: id || `${slugify(map.title)}-${crypto.randomBytes(3).toString('hex')}`,\n      40      ...map,\n      41      meta: {\n      42        createdAt: existing?.meta?.createdAt || now,\n      43        updatedAt: now,\n      44        root,\n      45        commit: headCommit(root),\n      46        branch: currentBranch(root),\n      47        remote: remoteWebUrl(root),\n      48        anchors: { ...report, issues: undefined },\n  ```\n- **[1g] Write JSON** — `src/store.js:52`\n  Writes the canonical .waymark/\u003cid>.json, meant to be committed.\n  The `.waymark/` directory is created if needed and the full document is written as pretty-printed JSON. That file is the source of truth: the HTML viewer, the markdown resource and `verify` are all derived from it. Pretty-printing with 2-space indentation keeps git diffs readable when a map is re-anchored or annotated. Writing it before the HTML means that if rendering fails, the canonical data is already safe.\n  ```\n      49      },\n      50    };\n      51    fs.mkdirSync(mapDir(root), { recursive: true });\n  >   52    fs.writeFileSync(filePath(root, doc.id), JSON.stringify(doc, null, 2));\n      53    const htmlPath = html ? writeHtml(root, doc) : null;\n      54    return { doc, report, narrative: narrativeGaps(doc), jsonPath: filePath(root, doc.id), htmlPath };\n      55  }\n      56  \n      57  export function writeHtml(root, doc) {\n      58    const p = filePath(root, doc.id, 'html');\n      59    fs.writeFileSync(p, renderHtml(doc, { files: collectFiles(root, doc) }));\n      60    return p;\n      61  }\n      62  \n      63  const MAX_FILE_BYTES = 512 * 1024;\n      64  const MAX_TOTAL_BYTES = 8 * 1024 * 1024;\n      65  \n      66  /** Snapshot of every referenced file, embedded in the viewer (code tabs, gutter markers). */\n  ```\n- **[1h] Write HTML** — `src/store.js:53`\n  Renders the self-contained HTML viewer next to the JSON.\n  Unless `html: false` is passed, `writeHtml` renders the document with `renderHtml` [3a] and saves it as `.waymark/\u003cid>.html`. The viewer is regenerated from the stored document on every save, annotate or `verify --fix`, so it never drifts from the JSON. The returned `htmlPath` goes back to the agent so it can hand the user a file to open or share.\n  ```\n      50    };\n      51    fs.mkdirSync(mapDir(root), { recursive: true });\n      52    fs.writeFileSync(filePath(root, doc.id), JSON.stringify(doc, null, 2));\n  >   53    const htmlPath = html ? writeHtml(root, doc) : null;\n      54    return { doc, report, narrative: narrativeGaps(doc), jsonPath: filePath(root, doc.id), htmlPath };\n      55  }\n      56  \n      57  export function writeHtml(root, doc) {\n      58    const p = filePath(root, doc.id, 'html');\n      59    fs.writeFileSync(p, renderHtml(doc, { files: collectFiles(root, doc) }));\n      60    return p;\n      61  }\n      62  \n      63  const MAX_FILE_BYTES = 512 * 1024;\n      64  const MAX_TOTAL_BYTES = 8 * 1024 * 1024;\n      65  \n      66  /** Snapshot of every referenced file, embedded in the viewer (code tabs, gutter markers). */\n      67  export function collectFiles(root, doc) {\n  ```\n\n## Trace 2: Anchoring locations to real code\n\nEach location carries the exact text of its line; the anchorer finds it again even when lines shift or files move.\n\n### Motivation\n\nCode moves all the time, and LLMs get line numbers wrong. A map pinned to bare line numbers would rot within a commit or two. Anchoring on the **text** of a line, with a graded set of fallbacks, keeps maps accurate for longer and makes drift visible instead of silent.\n\n### Details\n\n[2a] creates one `FileCache` for the whole map, so each file is read and hashed once however many locations point at it. It runs [2b] for every location and tallies the statuses into a health report. A map counts as `healthy` only if nothing is `unresolved` or `missing`.\n\n**File resolution:** every read goes through [2g], which refuses paths that escape the repo root. If the file no longer exists, [2c] searches git-tracked files for the same basename and breaks ties by the longest shared path suffix. If more than one candidate ties, it returns nothing rather than guessing.\n\n**Line resolution**, from cheapest to loosest: [2d] checks whether the claimed line holds the claimed text after whitespace normalization. [2e] looks for that exact text elsewhere in the file and takes the occurrence nearest the claimed line. [2f] accepts a substring match (for lines of at least 6 characters) or, failing that, a word-boundary match on `symbol`, and marks the result `fuzzy`. Whatever matches, the location comes back with a corrected `lineNumber`, the real `lineContent`, a snippet (3 lines before, 14 after) and a 12-character SHA-1 `fileHash` of the CRLF-normalized file. That hash is what [3e] later compares.\n\n### Tree\n\n```text\n└── [2a] anchorMap  src/anchor.js:155\n    └── [2b] anchorLocation  src/anchor.js:80\n        ├── file resolution\n        │   ├── [2g] safeJoin guard  src/anchor.js:13\n        │   └── [2c] Renamed file fallback  src/anchor.js:85\n        └── line resolution (in order)\n            ├── [2d] Exact line match  src/anchor.js:101\n            ├── [2e] Moved line  src/anchor.js:107\n            └── [2f] Fuzzy fallback  src/anchor.js:124\n```\n\n- **[2a] anchorMap** — `src/anchor.js:155` (`anchorMap`)\n  Anchors all locations with one shared FileCache and builds a health report.\n  `anchorMap` sets up a single `FileCache` for the whole map, so each file is read, split and hashed only once even if many locations point at it. It replaces each location with the result of [2b] and adds one to the matching status counter. Anything that isn't `ok` goes into `issues` with its note, which is what tells the agent exactly what to fix. `healthy` is defined narrowly as no `unresolved` and no `missing`: a `moved` or `fuzzy` location still counts as healthy but is reported for review.\n  ```\n     152  }\n     153  \n     154  /** Anchors every location of a normalized map in place; returns a summary report. */\n  >  155  export function anchorMap(root, map) {\n     156    const cache = new FileCache(root);\n     157    const report = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0, issues: [] };\n     158    for (const trace of map.traces) {\n     159      trace.locations = trace.locations.map((loc) => {\n     160        const r = anchorLocation(cache, loc);\n     161        report[r.status]++;\n     162        if (r.status !== 'ok') report.issues.push({ id: r.id, status: r.status, path: r.path, note: r.note });\n     163        return r;\n     164      });\n     165    }\n     166    report.total = map.traces.reduce((n, t) => n + t.locations.length, 0);\n     167    report.healthy = report.unresolved === 0 && report.missing === 0;\n     168    return report;\n     169  }\n  ```\n- **[2b] anchorLocation** — `src/anchor.js:80` (`anchorLocation`)\n  Resolves one location: file, line, status, snippet and file hash.\n  This is the core of Waymark, and both creation [2a] and verification [3e] use it. It resolves the file first (with a rename fallback [2c]) and returns `missing` immediately if nothing is found. Then it compares whitespace-normalized text: the claimed line [2d], an exact match elsewhere [2e], then a partial  >   85      const alt = cache.findByBasename(relPath);\n      86      if (alt && (file = cache.read(alt))) {\n      87        relocatedFrom = relPath;\n      88        relPath = alt;\n      89      }\n      90    }\n      91    if (!file) {\n      92      return { ...loc, status: 'missing', note: `File not found: ${loc.path}` };\n      93    }\n      94  \n      95    const { lines } = file;\n      96    const wanted = norm(loc.lineContent);\n      97    const idx0 = Math.min(Math.max(loc.lineNumber - 1, 0), lines.length - 1);\n      98    let idx = -1;\n      99    let status = 'unresolved';\n  ```\n- **[2d] Exact line match** — `src/anchor.js:101`\n  Fast path: the claimed line holds the claimed text.\n  Both sides go through `norm`, which trims and collapses whitespace, so re-indentation or CRLF vs LF line endings never break an anchor. If the claimed line matches, the location is `ok` and no correction is made. This is the common case right after the LLM has read the file. Note the `!wanted` short-circuit: a location without `lineContent` is accepted on whatever line it claims, with nothing actually checked.\n  ```\n      98    let idx = -1;\n      99    let status = 'unresolved';\n     100  \n  >  101    if (!wanted || norm(lines[idx0]) === wanted) {\n     102      idx = idx0;\n     103      status = 'ok';\n     104    } else {\n     105      const exact = [];\n     106      lines.forEach((l, i) => norm(l) === wanted && exact.push(i));\n     107      if (exact.length) {\n     108        idx = nearest(exact, idx0);\n     109        status = 'moved';\n     110      } else {\n     111        const partial = [];\n     112        if (wanted.length >= 6) {\n     113          lines.forEach((l, i) => {\n     114            const n = norm(l);\n     115            if (n.length >= 6 && (n.includes(wanted) || wanted.includes(n))) partial.push(i);\n  ```\n- **[2e] Moved line** — `src/anchor.js:107`\n  Same text elsewhere in the file; picks the occurrence nearest the claimed line.\n  If the claimed line doesn't match, every line in the file is compared exactly (after normalization). When there are several hits, as with a repeated `return null;`, `nearest` picks the one closest to the claimed line number, on the assumption that code drifts a little rather than jumping across the file. The location becomes `moved` and the note records the correction (`line X -> Y`). This is the case that keeps maps working after edits above the anchor shift every line down.\n  ```\n     104    } else {\n     105      const exact = [];\n     106      lines.forEach((l, i) => norm(l) === wanted && exact.push(i));\n  >  107      if (exact.length) {\n     108        idx = nearest(exact, idx0);\n     109        status = 'moved';\n     110      } else {\n     111        const partial = [];\n     112        if (wanted.length >= 6) {\n     113          lines.forEach((l, i) => {\n     114            const n = norm(l);\n     115            if (n.length >= 6 && (n.includes(wanted) || wanted.includes(n))) partial.push(i);\n     116          });\n     117        }\n     118        if (!partial.length && loc.symbol) {\n     119          const re = new RegExp(`\\\\b${loc.symbol.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')}\\\\b`);\n     120          lines.forEach((l, i) => re.test(l) && partial.push(i));\n     121        }\n  ```\n- **[2f] Fuzzy fallback** — `src/anchor.js:124`\n  Partial text or symbol match, flagged fuzzy for a manual check.\n  The last resort before `unresolved`. First it looks for substring containment either way, limited to lines of at least 6 normalized characters so short tokens like `}` don't match everywhere. If that finds nothing and the location has a `symbol`, it tries a regex-escaped word-boundary match on the symbol. The nearest hit wins and the status is `fuzzy`, with a \"double-check\" note, because the anchor may now point at a similar but different line. If even this fails, the location stays `unresolved` at the clamped original line, renced file (collected by `collectFiles` in the store) and inlines four things into a single page: the CSS, the client script from `viewer.client.js`, the map JSON and those file contents. Nothing is fetched at view time, so the file works offline, from an email attachment or from a CI artifact, and it keeps showing the code *as it was* when the map was made. The only escaping that matters is in the JSON island: every `\u003c` is neutralised so a snippet containing `\u003c/script>` cannot break out of the data block. Selection itself happens client-side in [3b].\n  ```\n      21   * explanations; code view with embedded files; interactive SVG diagram.\n      22   * `files` is a snapshot { path: content } of the referenced files.\n      23   */\n  >   24  export function renderHtml(doc, { files = {} } = {}) {\n      25    const data = {\n      26      doc,\n      27      files,\n      28      markdown: renderMarkdown(doc, { detail: 'full' }),\n      29      mermaid: renderMermaid({ ...doc, diagram: undefined }),\n      30    };\n      31    return `\u003c!doctype html>\n      32  \u003chtml lang=\"${escHtml(doc.language || 'en')}\">\n      33  \u003chead>\n      34  \u003cmeta charset=\"utf-8\">\n      35  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n      36  \u003cmeta name=\"generator\" content=\"waymark\">\n      37  \u003ctitle>Waymark · ${escHtml(doc.title)}\u003c/title>\n      38  \u003cstyle>${CSS}\u003c/style>\n  ```\n- **[3b] Node selection** — `src/render/viewer.client.js:767` (`select`)\n  One primitive syncs map pane, code view and diagram.\n  `select` is the single navigation primitive of the viewer: every interaction (clicking a card, a `[1a]` reference in a guide, a gutter marker, a diagram node, prev/next or the arrow keys) ends up here. It highlights the card in the map pane and opens its trace, then `showInCode` switches the file tab, highlights the anchor line and inserts the inline annotation with the one-line description, an Explain toggle and prev/next. If the diagram has been built it also focuses the node and its path (everything else dims) and, in diagram view, opens the detail card and pans to it. Finally it writes `#id` to the URL, which is what makes deep links like `waymark-create-flow.html#2e` shareable. Because all views go through this one function they can never disagree about what is selected.\n  ```\n     764    $('#zsel').onclick = () => { const n = state.sel && dg && dg.primary.get(state.sel); if (n) centerOn(n); };\n     765  \n     766    // ---------------------------------------------------------------- selection & views\n  >  767    function select(id, opts = {}) {\n     768      const l = byId.get(id);\n     769      if (!l) return;\n     770      state.sel = id;\n     771      $$('.loc.sel', mapPane).forEach((e) => e.classList.remove('sel'));\n     772      const card = $('.loc[data-id=\"' + id + '\"]:not(.ref-again)', mapPane);\n     773      if (card) {\n     774        card.classList.add('sel');\n     775        card.closest('.trace').classList.remove('closed');\n     776        if (opts.from !== 'map') card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n     777      }\n     778      showInCode(l);\n     779      if (dg) {\n     780        const n = focusDiagram(id);\n     781        if (state.view === 'diagram') {\n  ```\n- **[3c] waymark:// resource** — `src/mcp.js:267`\n  waymark://{id} resource: lists maps and serves them as markdown.\n  This resource template makes maps @-mentionable. Its `list` callback lists every stored map with title and description, and `complete` autocompletes ids by prefix. Reading `waymark://\u003cid>` loads the JSON and returns `renderMarkdown` [3d] output as `text/markdown`. It re-reads `.waymark/` on each request, which is why the `resourceListChanged` signal from [1c] is enough to show new maps without server state. It always uses the default root (`rootOf()`), so it serves maps from the server's configured repository.\n  ```\n     264    );\n     265  \n     266    // @-mentionable context: waymark://\u003cid>\n  >  267    server.registerResource(\n     268      'waymark',\n     269      new ResourceTemplate('waymark://{id}', {\n     270        list: async () => ({\n     271          resources: listMaps(rootOf()).map((m) => ({\n     272            uri: `waymark://${m.id}`,\n     273            name: m.title,\n     274            description: m.description,\n     275            mimeType: 'text/markdown',\n     276          })),\n     277        }),\n     278        complete: { id: (v) => listMaps(rootOf()).map((m) => m.id).filter((i) => i.startsWith(v)) },\n     279      }),\n     280      { title: 'Waymark', description: 'A waymark rendered as markdown context', mimeType: 'text/markdown' },\n     281      async (uri, { id }) => ({\n  ```\n- **[3d] renderMarkdown** — `src/render/markdown.js:29` (`renderMarkdown`)\n  Renders a map as agent-oriented markdown with tree and snippets.\n  This is the text an agent actually reads when it loads a map. It writes a header with id, commit, branch, date and the original query. Then, for each trace, it writes the description, an ASCII call tree and one entry per location: title, `path:line`, symbol, description and, at `full` detail, a numbered snippet with the anchor line marked `>`. `compact` drops the snippets for a cheaper overview (used for the copy embedded in the HTML [3a]). The format is built for an LLM: node ids like [1a] match the tree, so the model can cross-reference quickly.\n  ```\n      26   * detail: \"full\" includes the narrative (story, guides, explanations) and snippets;\n      27   * \"compact\" keeps only structure, one-line descriptions and anchors.\n      28   */\n  >   29  export function renderMarkdown(doc, { detail = 'full', diagram = false } = {}) {\n      30    const o = [];\n      31    o.push(`# Waymark: ${doc.title}`);\n      32    o.push('');\n      33    o.push(doc.description);\n      34 t r = anchorLocation(cache, loc);\n      19        counts[r.status]++;\n      20        if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      21        if (r.status !== 'ok' || r.lineNumber !== loc.lineNumber || r.path !== loc.path) {\n      22          changes.push({\n      23            id: loc.id,\n  ```\n\n## Cross-trace links\n\n- [1f] → [2a]: anchorWaymark map(root, map)\n- [1h] → [3a]: renderHtml(doc)\n- [3e] → [2b]: re-anchor each location","mermaid":"flowchart TD\n  subgraph T1[\"1. MCP entry and persistence\"]\n    direction TB\n    n_1a[\"\u003cb>1a\u003c/b> Tool registration\u003cbr/>\u003csmall>mcp.js:100\u003c/small>\"]\n    n_1b[\"\u003cb>1b\u003c/b> Delegate to store\u003cbr/>\u003csmall>mcp.js:113\u003c/small>\"]\n    n_1c[\"\u003cb>1c\u003c/b> Notify resource change\u003cbr/>\u003csmall>mcp.js:114\u003c/small>\"]\n    n_1d[\"\u003cb>1d\u003c/b> saveMap\u003cbr/>\u003csmall>store.js:32\u003c/small>\"]\n    n_1e[\"\u003cb>1e\u003c/b> Normalize\u003cbr/>\u003csmall>store.js:33\u003c/small>\"]\n    n_1f[\"\u003cb>1f\u003c/b> Anchor\u003cbr/>\u003csmall>store.js:34\u003c/small>\"]\n    n_1g[\"\u003cb>1g\u003c/b> Write JSON\u003cbr/>\u003csmall>store.js:52\u003c/small>\"]\n    n_1h[\"\u003cb>1h\u003c/b> Write HTML\u003cbr/>\u003csmall>store.js:53\u003c/small>\"]\n    n_1a --> n_1b\n    n_1b --> n_1d\n    n_1d --> n_1e\n    n_1d --> n_1f\n    n_1d --> n_1g\n    n_1d --> n_1h\n    n_1a --> n_1c\n  end\n  subgraph T2[\"2. Anchoring locations to real code\"]\n    direction TB\n    n_2a[\"\u003cb>2a\u003c/b> anchorMap\u003cbr/>\u003csmall>anchor.js:155\u003c/small>\"]\n    n_2b[\"\u003cb>2b\u003c/b> anchorLocation\u003cbr/>\u003csmall>anchor.js:80\u003c/small>\"]\n    n_2c[\"\u003cb>2c\u003c/b> Renamed file fallback\u003cbr/>\u003csmall>anchor.js:85\u003c/small>\"]\n    n_2d[\"\u003cb>2d\u003c/b> Exact line match\u003cbr/>\u003csmall>anchor.js:101\u003c/small>\"]\n    n_2e[\"\u003cb>2e\u003c/b> Moved line\u003cbr/>\u0 <script>/* Waymark viewer — runs inside the self-contained HTML. No dependencies, no network. */
(() => {
  'use strict';

  const DATA = JSON.parse(document.getElementById('waymark-data').textContent);
  const { doc } = DATA;
  const FILES = DATA.files || {};
  const meta = doc.meta || {};
  const PALETTE = ['#5b8cff', '#e8803a', '#3fae6a', '#c04fd0', '#d4a72c', '#2fb3c4', '#e0566b', '#8a7dff', '#7fb800', '#ff6fa8'];
  const SVGNS = 'http://www.w3.org/2000/svg';

  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const esc = (s) =>
    String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const base = (p) => p.split('/').pop();
  const extOf = (p) => (base(p).includes('.') ? base(p).split('.').pop().toLowerCase() : base(p).toLowerCase());
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------------------------------------------------------------- model
  const traces = doc.traces.map((t, i) => ({ ...t, color: PALETTE[i % PALETTE.length], details: t.details || t.guide }));
  const locs = [];
  const byId = new Map();
  for (const t of traces) for (const l of t.locations) {
    const x = { ...l, trace: t };
    locs.push(x);
    byId.set(l.id, x);
  }
  const fileOrder = [...new Set(locs.map((l) => l.path))];

  const prefsKey = 'waymark:' + doc.id;
  const prefs = Object.assign({ root: meta.root || '', editor: 'vscode', mapW: null, view: 'code' }, safeJson(localStorage.getItem(prefsKey)));
  function safeJson(s) { try { return JSON.parse(s) || {}; } catch { return {}; } }
  const savePrefs = () => { try { localStorage.setItem(prefsKey, JSON.stringify(prefs)); } catch { /* private mode */ } };

  const state = { sel: null, view: prefs.view === 'diagram' ? 'diagram' : 'code', file: null, explainOpen: new Set(), annoExpl: false };

  // ---------------------------------------------------------------- text helpers
  const REF_RE = /\[((?:\d+[a-z]{1,2})(?:\s*,\s*\d+[a-z]{1,2})*)\]/g;
  function refs(html) {
    return html.replace(REF_RE, (m, list) => {
      const ids = list.split(/\s*,\s*/);
      if (!ids.every((id) => byId.has(id))) return m;
      return '<span class="refs">[' + ids.map((id) => '<a class="ref" data-ref="' + id + '">' + id + '</a>').join(', ') + ']</span>';
    });
  }
  function inline(s) {
    return refs(
      esc(s)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
        .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>'),
    );
  }

    const out = [];
    let list = null;
    let para = [];
    let code = null;
    const flushPara = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
    const closeList = () => { if (list) { out.push('</' + list + '>'); list = null; } };
    for (const raw of String(src || '').split(/\r?\n/)) {
      if (code !== null) {
        if (/^\s*```/.test(raw)) { out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); code = null; } else code.push(raw);
        continue;
      }
      if (/^\s*```/.test(raw)) { flushPara(); closeList(); code = []; continue; }
      const h = raw.match(/^#{1,6}\s+(.*)/);
      if (h) { flushPara(); closeList(); out.push('<h5>' + inline(h[1]) + '</h5>'); continue; }
      const li = raw.match(/^\s*([-*]|\d+\.)\s+(.*)/);
      if (li) {
        flushPara();
        const kind = /\d/.test(li[1]) ? 'ol' : 'ul';
        if (list !== kind) { closeList(); out.push('<' + kind + '>'); list = kind; }
        out.push('<li>' + inline(li[2]) + '</li>');
        continue;
      }
      if (!raw.trim()) { flushPara(); closeList(); continue; }
      closeList();
      para.push(raw.trim());
    }
    if (code !== null) out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>');
    flushPara();
    closeList();
    return out.join('');
  }

  // ---------------------------------------------------------------- syntax highlight (tiny, language-agnostic)
  const KW = new Set(('abstract and as async await break case catch class const continue def default defer del delete do elif else enum except export extends ' +
    'false final finally fn for from func function global go if impl implements import in interface is lambda let match mod module mut namespace new nil ' +
    'none None not null of or package pass private protected pub public raise return self static struct super switch this throw throws trait true True ' +
    'False try type typeof use val var void when where while with yield dcl-s dcl-ds dcl-proc dcl-pi end-proc end-ds exec sql select update insert into values set').split(' '));
  const TOK = /(\/\/.*$|#.*$|\/\*.*?\*\/|--.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b\d[\d_.xXa-fA-F]*\b)|([A-Za-z_$][\w$-]*)(\s*\()?/g;
  const HASH = /^(py|rb|sh|bash|zsh|yml|yaml|toml|r|pl|ps1|conf|cfg|ini|dockerfile|makefile|mk|cmake|nim|ex|exs)$/;
  const DASH = /^(sql|lua|hs|elm|ada)$/;
  function hl(line, ext) {
    let out = '';
    let last = 0;
    let m;
    TOK.lastIndex = 0;
    while ((m = TOK.exec(line))) {
      const t = m[0];
      out += esc(line.slice(last, m.index));
      if (m[1] && ((t[0] === '#' && !HASH.test(ext)) || (t.startsWith('--') && !DASH.test(ext)))) {
        out += esc(t[0]);
        TOK.lastIndex = m.index + 1;
        last = m.index + 1;
        continue;
      }
      if (m[1]) out += '<span class="tk-c">' + esc(t) + '</span>';
      else if (m[2]) out += '<span class="tk-s">' + esc(t) + '</span>';
      else if (m[3]) out += '<span class="tk-n">' + esc(t) + '</span>';
      else if (KW.has(m[4])) out += '<span class="tk-k">' + esc(m[4]) + '</span>' + esc(m[5] || '');
      else if (m[5]) out += '<span class="tk-f">' + esc(m[4]) + '</span>' + esc(m[5]);
      else out += esc(t);
      last = m.index + t.length;
    }
    return out + esc(line.slice(last));
  }

  // ---------------------------------------------------------------- links
  function editorUrl(l) {
    if (!prefs.root) return null;
    const abs = prefs.root.replace(/\\/g, '/').replace(/\/$/, '') + '/' + l.path;
    if (prefs.editor === 'idea') return 'idea://open?file=' + encodeURIComponent(abs) + '&line=' + l.lineNumber;
    return prefs.editor + '://file' + encodeURI(abs.startsWith('/') ? abs : '/' + abs) + ':' + l.lineNumber;
  }
  function remoteUrl(l) {
    const r = meta.remote;
    const c = meta.commit;
    if (!r || !c) return null;
    if (/dev\.azure\.com|visualstudio\.com/.test(r)) return r + '?path=/' + l.path + '&version=GC' + c + '&line=' + l.lineNumber + '&lineEnd=' + l.lineNumber + '&lineStartColumn=1&lineEndColumn=1';
    if (/bitbucket\./.test(r)) return r + '/src/' + c + '/' + l.path + '#lines-' + l.lineNumber;
    if (/gitlab\./.test(r)) return r + '/-/blob/' + c + '/' + l.path + '#L' + l.lineNumber;
    return r + '/blob/' + c + '/' + l.path + '#L' + l.lineNumber;
  }
  function explanationHtml(l) {

  // ---------------------------------------------------------------- map pane

  const mapPane = $('#mapPane');

  function renderMapPane() {

    if (meta.createdAt) chips.push('<span class="chip">Created ' + esc(new Date(meta.createdAt).toLocaleDateString()) + '</span>');

    chips.push('<span class="chip">' + traces.length + ' traces · ' + locs.length + ' nodes</span>');

    const head =

        } else if (l) {

            '<div class="loc-top"><span class="lid">' + l.id + '</span><span class="lt">' + esc(n.label || l.title) + '</span>' + st +

        (hasGuide ? ' <button class="see-more" data-guide="' + esc(t.id) + '">See more</button>' : '') + '</div></div>' +
        '<span class="caret">▾</span></div>' +
        (hasGuide
          ? '<div class="guide md" hidden><div class="ai-label">AI generated guide</div>' +
            (t.motivation ? '<h4>Motivation</h4>' + md(t.motivation) : '') +
            (t.details ? '<h4>Details</h4>' + md(t.details) : '') + '</div>'
          : '') +
        '<div class="tr-body"><div class="tree-title">' + esc(t.diagramTitle || t.title) + '</div>' + treeHtml(t.tree) + '</div></section>'
      );
    }).join('');
    mapPane.innerHTML = head + body;
  }

  function renderFile(p) {
    state.file = p;
    renderTabs();
    const ext = extOf(p);
    const markers = new Map();
    for (const l of locs) if (l.path === p) {
      if (!markers.has(l.lineNumber)) markers.set(l.lineNumber, []);
      markers.get(l.lineNumber).push(l);
    }
    const rows = [];
    const emit = (no, text) => {
      const mk = markers.get(no);
      const gut = mk ? mk.map((l) => '<a class="gm" data-ref="' + l.id + '" style="--tc:' + l.trace.color + '" title="' + esc(l.title) + '">' + l.id + '</a>').join('') : '';
      rows.push('<div class="cl' + (mk ? ' anchored' : '') + '" data-line="' + no + '"><span class="gut">' + gut + '</span><span class="no">' + no + '</span><span class="tx">' + hl(text, ext) + '</span></div>');
    };
    if (FILES[p] != null) {
      FILES[p].split('\n').forEach((t, i) => emit(i + 1, t));
    } else {
      rows.push('<div class="code-note">Only snippets are available for this file (it was missing or too large to embed).</div>');
      const lines = new Map();
      for (const l of locs) if (l.path === p && l.snippet) l.snippet.code.split('\n').forEach((t, i) => lines.set(l.snippet.startLine + i, t));
      if (!lines.size) for (const l of locs) if (l.path === p) lines.set(l.lineNumber, l.lineContent || '');
      let prev = null;
      for (const no of [...lines.keys()].sort((a, b) => a - b)) {
        if (prev !== null && no !== prev + 1) rows.push('<div class="gap">⋯</div>');
        emit(no, lines.get(no));
