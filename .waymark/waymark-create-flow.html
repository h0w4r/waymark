* { box-sizing: border-box; }

/* ---------- top bar ---------- */

/* annotated tree */
.tt { list-style: none; margin: 0; padding-left: 14px; position: relative; }

svg .cluster rect.box { fill: color-mix(in srgb, var(--tc) 9%, transparent); stroke: color-mix(in srgb, var(--tc) 55%, transparent); stroke-width: 1.2; }
svg .cluster .chead { cursor: pointer; }

.dn { width: 100%; height: 100%; border-radius: 9px; border: 1.5px solid color-mix(in srgb, var(--tc) 70%, var(--line)); background: var(--panel); padding: 6px 9px; font: 12px/1.3 var(--sans); color: var(--ink); cursor: pointer; overflow: hidden; display: flex; flex-direction: column; justify-content: center; transition: opacity .15s, box-shadow .15s; }
.dn:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 35%, transparent); }
.dn .h { display: flex; gap: 6px; align-items: baseline; }

/* ---------- narrow screens ---------- */

  body { overflow: auto; }
  #main { flex-direction: column; }
  #mapPane { width: auto !important; max-width: none; max-height: 48vh; }

  #rightPane { min-height: 60vh; }
  .top-title { display: none; }
  .anno, .anno-expl { margin-left: 16px; }

<body>
<div id="app">
  <header id="topbar">
    <span class="brand">WAYMARK</span><span class="brand-sep"></span>
    <span class="top-title"></span>
    <div class="seg" role="tablist" aria-label="View">
      <button id="vCode" role="tab" title="Code view (d)">Code</button>
      <button id="vDiagram" role="tab" title="Diagram view (d)">Diagram</button>
    </div>
    <button class="tbtn" id="copyCtx" title="Copy the map as markdown context for an agent">Copy context</button>
    <button class="tbtn" id="settingsBtn" title="Editor link settings">⚙</button>
  </header>
  <div id="settings" hidden>
    <label>Local repo path <input id="setRoot" spellcheck="false"></label>
    <label>Editor
      <select id="setEditor">
        <option value="vscode">VS Code</option><option value="cursor">Cursor</option>
        <option value="windsurf">Windsurf / Devin Desktop</option><option value="idea">JetBrains</option>
      </select>
    </label>
  </div>
  <div id="main">
    <aside id="mapPane" aria-label="Map"></aside>
    <div id="splitter" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
    <section id="rightPane">
      <div id="codeView">
        <div id="fileTabs"></div>
        <div id="codeScroll"><div id="code"></div></div>
      </div>
      <div id="diagramView" hidden>
        <div class="dg-toolbar">
          <div class="legend" id="legend"></div>
          <div class="zoom">
            <button id="zin" title="Zoom in">+</button>
            <button id="zout" title="Zoom out">−</button>
            <button id="zfit" title="Fit all (f)">⤢</button>
            <button id="zsel" title="Center selected node">◎</button>
            <button id="copyMmd" title="Copy the diagram as Mermaid source">⧉</button>
          </div>
        </div>
        <svg id="dg" xmlns="http://www.w3.org/2000/svg" aria-label="Interactive diagram">
          <defs>
            <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" style="color:var(--muted)"/></marker>
            <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" style="color:var(--ink2)"/></marker>
          </defs>
          <g id="vp"></g>
        </svg>
        <div id="dgTip" hidden></div>
        <div id="dgCard" hidden></div>
        <div class="dg-hint">Drag to pan · wheel to zoom · click a node to focus its path · double-click to open the code</div>
      </div>
    </section>

<script id="waymark-data" type="application/json">{"doc":{"schemaVersion":1,"id":"waymark-create-flow","title":"waymark_create: from tool call to shareable viewer","description":"How an agent's waymark_create call becomes a verified JSON map and a self-contained HTML viewer, and how it is later reused as context. Key takeaway: every location is re-anchored against the working tree by its exact line text, so line numbers from the LLM are hints, not truth.","story":"An agent has just traced a flow through a codebase and wants to save it. It calls the `waymark_create` MCP tool [1a] with a title, some traces and a list of locations. Each location has a path, a line number it *believes* is correct, and the exact text of that line. Nothing in that payload is trusted. The handler resolves the repository root and passes the raw map to `saveMap` [1b][1d]. This is the only path that writes maps to disk.\n\n`saveMap` first runs `normalizeMap` [1e]. It parses the input with Zod, fills in missing ids (`1`, `1a`, `1b`…), builds a linear call tree when none was given, and rejects tree refs or cross-trace links that point to unknown nodes. Then the key step: `anchorMap` [1f] → [2a] checks every location against the files actually on disk. For each one, `anchorLocation` [2b] opens the file through a root-jailed cache [2g]. If the path has disappeared, it looks for a renamed file [2c]. It then tries, in order, the claimed line [2d], the same text on a different line [2e], and finally a partial or symbol match [2f]. The result is a status (`ok`, `moved`, `relocated`, `fuzzy`, `unresolved`, `missing`), a corrected line number, a code snippet and a file hash. **The LLM's line numbers are hints. The line text is the anchor.**\n\nOnce anchored, the document gets git metadata (commit, branch, remote) and is written as `.waymark/\u003cid>.json` [1g], the canonical, committable artifact. A self-contained HTML viewer is written next to it [1h]. The server then sends `resourceListChanged` [1c] so clients can @-mention `waymark://\u003cid>` immediately. The tool's reply includes the anchor report and tells the agent to fix and resubmit with the same id if anything is unhealthy.\n\nFrom there the map has three audiences (trace 3). Humans open the HTML viewer [3a] and click through nodes [3b]. Agents load it as markdown context through the `waymark://` resource [3c], rendered by `renderMarkdown` [3d]. CI and maintainers run `verifyMap` [3e], which reuses the same `anchorLocation` [2b] to catch drift: lines that moved, anchors that broke, files whose hash changed. One anchoring algorithm handles both creating a map and keeping it honest afterwards.","query":"how does waymark_create work end to end?","traces":[{"id":"1","title":"MCP entry and persistence","description":"The MCP tool handler resolves the repo root, delegates to the store, and notifies clients that the resource list changed.","motivation":"An MCP tool call is untrusted input from an LLM. This trace makes sure there is **exactly one writer** (`saveMap`), so every map on disk has been normalized, anchored and stamped in the same way, whether it came from MCP, the CLI or a re-save. Keeping the MCP handler thin also lets the CLI (`waymark create map.json`) share the same behavior.","details":"The tool is registered with the flattened `MapInput` schema [1a], so the model sees a flat, documented argument list instead of a nested blob. The handler's only real work is resolving the root (explicit `root`, then `WAYMARK_ROOT`, then the client's root) and calling the store [1b].\n\nInside **saveMap** [1d] the order matters. Normalization [1e] comes first so the anchorer gets ids and clean POSIX paths. Anchoring [1f] runs next so the stored snippets and line numbers reflect the working tree. Only then is the JSON written [1g], followed by the HTML viewer rendered from that same document [1h]. When `id` is passed, the existing map's `createdAt` is kept, so an update does not look like a brand-new map.\n\nAfter the write, [1c] notifies MCP clients that the resource list changed, which makes `@waymark:waymark://\u003cid>` usable straight away. The response returns the anchor report so a weak map is caught and resubmitted within the same agent turn.","locations":[{"id":"1a","title":"Tool registration","description":"Registers waymark_create with a flat MapInput schema plus optional id/root.","explanation":"This is where the whole flow starts: the MCP server publishes `waymark_create` to the client. The input schema spreads `MapInput.shape` and adds `id` and `root`, so the model sees a flat list of documented arguments instead of a nested object. That makes well-formed calls more likely. The tool description tells the model up front that line numbers will be auto-corrected and that unresolved anchors must be fixed and resubmitted, which sets expectations for the reply. The handler is wrapped in `safe(...)`, so a validation error (for example a duplicate location id from [1e]) comes back as an `isError` tool result instead of crashing the server.","path":"src/mcp.js","lineNumber":100,"lineContent":"'waymark_create',","symbol":"waymark_create","status":"ok","fileHash":"4e0358df1b7a","snippet":{"startLine":97,"code":"  );\n\n  server.registerTool(\n    'waymark_create',\n    {\n      title: 'Create or update a waymark',\n      description:\n        'Validates a waymark, verifies every location against the working tree (auto-correcting shifted line numbers), stores it under .waymark/ and writes a shareable HTML viewer. Pass `id` to overwrite an existing map. Returns an anchor report: fix any unresolved/missing locations and resubmit.',\n      inputSchema: {\n        ...MapInput.shape,\n        id: z.string().optional().describe('Existing waymark id to overwrite'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...map }) => {\n      const r = rootOf(root);\n      const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });\n      server.sendResourceListChanged();"}},{"id":"1b","title":"Delegate to store","description":"Handler resolves the root and hands the raw map to saveMap.","explanation":"The handler pulls `id` and `root` out of the arguments and treats everything else as the map. `rootOf` resolves the repository root from the explicit argument, then `WAYMARK_ROOT`, then the root the client announced. Getting this wrong would anchor against the wrong tree, which is why the waymark agent always passes `root`. All the real work is delegated to `saveMap` [1d], which returns the stored document, the anchor report and the file paths. The handler then builds the reply: the `waymark://` URI, file paths, the report, and a `next` hint that tells the agent to resubmit with the same `id` if the map is unhealthy.","path":"src/mcp.js","lineNumber":113,"lineContent":"const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });","status":"ok","fileHash":"4e0358df1b7a","snippet":{"startLine":110,"code":"    },\n    safe(async ({ id, root, ...map }) => {\n      const r = rootOf(root);\n      const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });\n      server.sendResourceListChanged();\n      const next = [];\n      if (!report.healthy) {\n        next.push('Some locations could not be verified. Fix them (waymark_find_anchor helps) and call waymark_create again with id=\"' + doc.id + '\".');\n      }\n      if (!narrative.complete) {\n        next.push('Narrative is incomplete (see \"narrative\"). Fill the story, trace motivation/details and per-location explanations with waymark_annotate(id=\"' + doc.id + '\").');\n      }\n      if (!next.length) next.push('All anchors verified and narrative complete. Share the HTML file or reference waymark://' + doc.id);\n      return text({ id: doc.id, resource: `waymark://${doc.id}`, html: htmlPath, json: jsonPath, anchors: report, narrative, next });\n    }),\n  );\n\n  const prose = () => z.string().optional();"}},{"id":"1c","title":"Notify resource change","description":"Notifies MCP clients that the waymark:// resource list changed.","explanation":"Right after the map is written, the server sends `resourceListChanged`. Clients such as Claude Code then re-query the resource template's `list` callback [3c] and the new map appears in @-mention autocompletion straight away, with no server restart. Without this call, the map would exist on disk but clients would not see it until they refreshed on their own. Note that it fires even when the anchor report is unhealthy: the map is saved either way, and health is reported separately.","path":"src/mcp.js","lineNumber":114,"lineContent":"server.sendResourceListChanged();","status":"ok","fileHash":"4e0358df1b7a","snippet":{"startLine":111,"code":"    safe(async ({ id, root, ...map }) => {\n      const r = rootOf(root);\n      const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });\n      server.sendResourceListChanged();\n      const next = [];\n      if (!report.healthy) {\n        next.push('Some locations could not be verified. Fix them (waymark_find_anchor helps) and call waymark_create again with id=\"' + doc.id + '\".');\n      }\n      if (!narrative.complete) {\n        next.push('Narrative is incomplete (see \"narrative\"). Fill the story, trace motivation/details and per-location explanations with waymark_annotate(id=\"' + doc.id + '\").');\n      }\n      if (!next.length) next.push('All anchors verified and narrative complete. Share the HTML file or reference waymark://' + doc.id);\n      return text({ id: doc.id, resource: `waymark://${doc.id}`, html: htmlPath, json: jsonPath, anchors: report, narrative, next });\n    }),\n  );\n\n  const prose = () => z.string().optional();\n  server.registerTool("}},{"id":"1d","title":"saveMap","description":"Single writer: normalize, anchor, stamp git metadata, write JSON and HTML.","explanation":"`saveMap` is the only function that turns input into a stored map, and both the MCP tool [1b] and the CLI use it. It runs normalization [1e] and anchoring [1f] in order, then builds the document. The id is either the caller's `id` (overwrite) or a slug of the title plus 3 random bytes, which keeps collisions unlikely without a registry. When overwriting, it loads the existing map just to keep its `createdAt`. It also stamps `commit`, `branch` and `remote` so later readers know which revision the anchors were taken from and the viewer can build remote links. The anchor counts go into `meta.anchors`, with the noisy `issues` list removed.","path":"src/store.js","lineNumber":32,"lineContent":"export function saveMap(root, input, { id, html = true } = {}) {","symbol":"saveMap","status":"ok","fileHash":"29bc4924767b","snippet":{"startLine":29,"code":"}\n\n/** Validates, anchors against the working tree, persists JSON (+ HTML viewer). */\nexport function saveMap(root, input, { id, html = true } = {}) {\n  const map = normalizeMap(input);\n  const report = anchorMap(root, map);\n  const existing = id ? loadMap(root, id, { quiet: true }) : null;\n  const now = new Date().toISOString();\n  const doc = {\n    schemaVersion: SCHEMA_VERSION,\n    id: id || `${slugify(map.title)}-${crypto.randomBytes(3).toString('hex')}`,\n    ...map,\n    meta: {\n      createdAt: existing?.meta?.createdAt || now,\n      updatedAt: now,\n      root,\n      commit: headCommit(root),\n      branch: currentBranch(root),"}},{"id":"1e","title":"Normalize","description":"Zod-validates the input, assigns ids, defaults the tree, rejects dangling refs.","explanation":"`normalizeMap` parses the input with the Zod `MapInput` schema, then fills in what the LLM left out. Missing trace ids become `1`, `2`… and missing location ids become `1a`, `1b`…. Ids must match `[A-Za-z0-9_-]{1,16}` and be unique across the whole map. Paths are converted to POSIX form and stripped of a leading `./`, so Windows-style input anchors the same way. A legacy `guide` field is moved to `details`. If no `tree` is given, a linear chain is built (each step nested under the previous one). Finally, every tree ref and cross-trace link is checked, and a reference to an unknown location throws before anything touches the disk.","path":"src/store.js","lineNumber":33,"lineContent":"const map = normalizeMap(input);","status":"ok","fileHash":"29bc4924767b","snippet":{"startLine":30,"code":"\n/** Validates, anchors against the working tree, persists JSON (+ HTML viewer). */\nexport function saveMap(root, input, { id, html = true } = {}) {\n  const map = normalizeMap(input);\n  const report = anchorMap(root, map);\n  const existing = id ? loadMap(root, id, { quiet: true }) : null;\n  const now = new Date().toISOString();\n  const doc = {\n    schemaVersion: SCHEMA_VERSION,\n    id: id || `${slugify(map.title)}-${crypto.randomBytes(3).toString('hex')}`,\n    ...map,\n    meta: {\n      createdAt: existing?.meta?.createdAt || now,\n      updatedAt: now,\n      root,\n      commit: headCommit(root),\n      branch: currentBranch(root),\n      remote: remoteWebUrl(root),"}},{"id":"1f","title":"Anchor","description":"Verifies every location against the working tree; see trace 2.","explanation":"This single call links the store to the anchoring engine [2a]. It changes `map.traces[*].locations` in place, replacing each location with its anchored version (corrected line, real line text, snippet, file hash, status). It returns the health report that ends up in both the tool reply and `meta.anchors`. Because it runs before the JSON write [1g], the stored snippets always match the tree as it was at save time, never the LLM's guess. An unhealthy report does not stop the save: the map is still persisted so the agent can fix it under the same id.","path":"src/store.js","lineNumber":34,"lineContent":"const report = anchorMap(root, map);","status":"ok","fileHash":"29bc4924767b","snippet":{"startLine":31,"code":"/** Validates, anchors against the working tree, persists JSON (+ HTML viewer). */\nexport function saveMap(root, input, { id, html = true } = {}) {\n  const map = normalizeMap(input);\n  const report = anchorMap(root, map);\n  const existing = id ? loadMap(root, id, { quiet: true }) : null;\n  const now = new Date().toISOString();\n  const doc = {\n    schemaVersion: SCHEMA_VERSION,\n    id: id || `${slugify(map.title)}-${crypto.randomBytes(3).toString('hex')}`,\n    ...map,\n    meta: {\n      createdAt: existing?.meta?.createdAt || now,\n      updatedAt: now,\n      root,\n      commit: headCommit(root),\n      branch: currentBranch(root),\n      remote: remoteWebUrl(root),\n      anchors: { ...report, issues: undefined },"}},{"id":"1g","title":"Write JSON","description":"Writes the canonical .waymark/\u003cid>.json, meant to be committed.","explanation":"The `.waymark/` directory is created if needed and the full document is written as pretty-printed JSON. That file is the source of truth: the HTML viewer, the markdown resource and `verify` are all derived from it. Pretty-printing with 2-space indentation keeps git diffs readable when a map is re-anchored or annotated. Writing it before the HTML means that if rendering fails, the canonical data is already safe.","path":"src/store.js","lineNumber":52,"lineContent":"fs.writeFileSync(filePath(root, doc.id), JSON.stringify(doc, null, 2));","status":"ok","fileHash":"29bc4924767b","snippet":{"startLine":49,"code":"    },\n  };\n  fs.mkdirSync(mapDir(root), { recursive: true });\n  fs.writeFileSync(filePath(root, doc.id), JSON.stringify(doc, null, 2));\n  const htmlPath = html ? writeHtml(root, doc) : null;\n  return { doc, report, narrative: narrativeGaps(doc), jsonPath: filePath(root, doc.id), htmlPath };\n}\n\nexport function writeHtml(root, doc) {\n  const p = filePath(root, doc.id, 'html');\n  fs.writeFileSync(p, renderHtml(doc, { files: collectFiles(root, doc) }));\n  return p;\n}\n\nconst MAX_FILE_BYTES = 512 * 1024;\nconst MAX_TOTAL_BYTES = 8 * 1024 * 1024;\n\n/** Snapshot of every referenced file, embedded in the viewer (code tabs, gutter markers). */"}},{"id":"1h","title":"Write HTML","description":"Renders the self-contained HTML viewer next to the JSON.","explanation":"Unless `html: false` is passed, `writeHtml` renders the document with `renderHtml` [3a] and saves it as `.waymark/\u003cid>.html`. The viewer is regenerated from the stored document on every save, annotate or `verify --fix`, so it never drifts from the JSON. The returned `htmlPath` goes back to the agent so it can hand the user a file to open or share.","path":"src/store.js","lineNumber":53,"lineContent":"const htmlPath = html ? writeHtml(root, doc) : null;","status":"ok","fileHash":"29bc4924767b","snippet":{"startLine":50,"code":"  };\n  fs.mkdirSync(mapDir(root), { recursive: true });\n  fs.writeFileSync(filePath(root, doc.id), JSON.stringify(doc, null, 2));\n  const htmlPath = html ? writeHtml(root, doc) : null;\n  return { doc, report, narrative: narrativeGaps(doc), jsonPath: filePath(root, doc.id), htmlPath };\n}\n\nexport function writeHtml(root, doc) {\n  const p = filePath(root, doc.id, 'html');\n  fs.writeFileSync(p, renderHtml(doc, { files: collectFiles(root, doc) }));\n  return p;\n}\n\nconst MAX_FILE_BYTES = 512 * 1024;\nconst MAX_TOTAL_BYTES = 8 * 1024 * 1024;\n\n/** Snapshot of every referenced file, embedded in the viewer (code tabs, gutter markers). */\nexport function collectFiles(root, doc) {"}}],"tree":[{"ref":"1a","children":[{"ref":"1b","children":[{"ref":"1d","children":[{"ref":"1e"},{"ref":"1f"},{"ref":"1g"},{"ref":"1h"}]}]},{"ref":"1c"}]}]},{"id":"2","title":"Anchoring locations to real code","description":"Each location carries the exact text of its line; the anchorer finds it again even when lines shift or files move.","motivation":"Code moves all the time, and LLMs get line numbers wrong. A map pinned to bare line numbers would rot within a commit or two. Anchoring on the **text** of a line, with a graded set of fallbacks, keeps maps accurate for longer and makes drift visible instead of silent.","details":"[2a] creates one `FileCache` for the whole map, so each file is read and hashed once however many locations point at it. It runs [2b] for every location and tallies the statuses into a health report. A map counts as `healthy` only if nothing is `unresolved` or `missing`.\n\n**File resolution:** every read goes through [2g], which refuses paths that escape the repo root. If the file no longer exists, [2c] searches git-tracked files for the same basename and breaks ties by the longest shared path suffix. If more than one candidate ties, it returns nothing rather than guessing.\n\n**Line resolution**, from cheapest to loosest: [2d] checks whether the claimed line holds the claimed text after whitespace normalization. [2e] looks for that exact text elsewhere in the file and takes the occurrence nearest the claimed line. [2f] accepts a substring match (for lines of at least 6 characters) or, failing that, a word-boundary match on `symbol`, and marks the result `fuzzy`. Whatever matches, the location comes back with a corrected `lineNumber`, the real `lineContent`, a snippet (3 lines before, 14 after) and a 12-character SHA-1 `fileHash` of the CRLF-normalized file. That hash is what [3e] later compares.","locations":[{"id":"2a","title":"anchorMap","description":"Anchors all locations with one shared FileCache and builds a health report.","explanation":"`anchorMap` sets up a single `FileCache` for the whole map, so each file is read, split and hashed only once even if many locations point at it. It replaces each location with the result of [2b] and adds one to the matching status counter. Anything that isn't `ok` goes into `issues` with its note, which is what tells the agent exactly what to fix. `healthy` is defined narrowly as no `unresolved` and no `missing`: a `moved` or `fuzzy` location still counts as healthy but is reported for review.","path":"src/anchor.js","lineNumber":155,"lineContent":"export function anchorMap(root, map) {","symbol":"anchorMap","status":"ok","fileHash":"dfa36f28dad8","snippet":{"startLine":152,"code":"}\n\n/** Anchors every location of a normalized map in place; returns a summary report. */\nexport function anchorMap(root, map) {\n  const cache = new FileCache(root);\n  const report = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0, issues: [] };\n  for (const trace of map.traces) {\n    trace.locations = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      report[r.status]++;\n      if (r.status !== 'ok') report.issues.push({ id: r.id, status: r.status, path: r.path, note: r.note });\n      return r;\n    });\n  }\n  report.total = map.traces.reduce((n, t) => n + t.locations.length, 0);\n  report.healthy = report.unresolved === 0 && report.missing === 0;\n  return report;\n}"}},{"id":"2b","title":"anchorLocation","description":"Resolves one location: file, line, status, snippet and file hash.","explanation":"This is the core of Waymark, and both creation [2a] and verification [3e] use it. It resolves the file first (with a rename fallback [2c]) and returns `missing` immediately if nothing is found. Then it compares whitespace-normalized text: the claimed line [2d], an exact match elsewhere [2e], then a partial or symbol match [2f]. The claimed line number is clamped into the file's range, so an out-of-range hint cannot crash it. The returned location carries the corrected `lineNumber`, the real `lineContent` (only if a match was found), a snippet from 3 lines before to 14 after, the file hash, and a note describing any correction. Pitfall: an empty `lineContent` counts as `ok` on any line, so locations must always include the line text.","path":"src/anchor.js","lineNumber":80,"lineContent":"export function anchorLocation(cache, loc) {","symbol":"anchorLocation","status":"ok","fileHash":"dfa36f28dad8","snippet":{"startLine":77,"code":" * status: ok | moved (same text, other line) | fuzzy (partial match) | relocated (file moved)\n *         | unresolved (text not found) | missing (file not found)\n */\nexport function anchorLocation(cache, loc) {\n  let relPath = loc.path;\n  let file = cache.read(relPath);\n  let relocatedFrom = null;\n  if (!file) {\n    const alt = cache.findByBasename(relPath);\n    if (alt && (file = cache.read(alt))) {\n      relocatedFrom = relPath;\n      relPath = alt;\n    }\n  }\n  if (!file) {\n    return { ...loc, status: 'missing', note: `File not found: ${loc.path}` };\n  }\n"}},{"id":"2c","title":"Renamed file fallback","description":"Finds a renamed or moved file by basename and longest path suffix.","explanation":"When the claimed path no longer exists, `findByBasename` searches the git-tracked files (loaded lazily, once per cache) for the same file name. A single hit is accepted. With several hits, it scores each by how many trailing path segments match the original and picks the best only if it shares more than the basename and is not tied. If git is unavailable or the result is ambiguous, it returns null and the location ends up `missing`. A successful match becomes `relocated` instead of `ok` or `moved`, so file moves are always reported.","path":"src/anchor.js","lineNumber":85,"lineContent":"const alt = cache.findByBasename(relPath);","status":"ok","fileHash":"dfa36f28dad8","snippet":{"startLine":82,"code":"  let file = cache.read(relPath);\n  let relocatedFrom = null;\n  if (!file) {\n    const alt = cache.findByBasename(relPath);\n    if (alt && (file = cache.read(alt))) {\n      relocatedFrom = relPath;\n      relPath = alt;\n    }\n  }\n  if (!file) {\n    return { ...loc, status: 'missing', note: `File not found: ${loc.path}` };\n  }\n\n  const { lines } = file;\n  const wanted = norm(loc.lineContent);\n  const idx0 = Math.min(Math.max(loc.lineNumber - 1, 0), lines.length - 1);\n  let idx = -1;\n  let status = 'unresolved';"}},{"id":"2d","title":"Exact line match","description":"Fast path: the claimed line holds the claimed text.","explanation":"Both sides go through `norm`, which trims and collapses whitespace, so re-indentation or CRLF vs LF line endings never break an anchor. If the claimed line matches, the location is `ok` and no correction is made. This is the common case right after the LLM has read the file. Note the `!wanted` short-circuit: a location without `lineContent` is accepted on whatever line it claims, with nothing actually checked.","path":"src/anchor.js","lineNumber":101,"lineContent":"if (!wanted || norm(lines[idx0]) === wanted) {","status":"ok","fileHash":"dfa36f28dad8","snippet":{"startLine":98,"code":"  let idx = -1;\n  let status = 'unresolved';\n\n  if (!wanted || norm(lines[idx0]) === wanted) {\n    idx = idx0;\n    status = 'ok';\n  } else {\n    const exact = [];\n    lines.forEach((l, i) => norm(l) === wanted && exact.push(i));\n    if (exact.length) {\n      idx = nearest(exact, idx0);\n      status = 'moved';\n    } else {\n      const partial = [];\n      if (wanted.length >= 6) {\n        lines.forEach((l, i) => {\n          const n = norm(l);\n          if (n.length >= 6 && (n.includes(wanted) || wanted.includes(n))) partial.push(i);"}},{"id":"2e","title":"Moved line","description":"Same text elsewhere in the file; picks the occurrence nearest the claimed line.","explanation":"If the claimed line doesn't match, every line in the file is compared exactly (after normalization). When there are several hits, as with a repeated `return null;`, `nearest` picks the one closest to the claimed line number, on the assumption that code drifts a little rather than jumping across the file. The location becomes `moved` and the note records the correction (`line X -> Y`). This is the case that keeps maps working after edits above the anchor shift every line down.","path":"src/anchor.js","lineNumber":107,"lineContent":"if (exact.length) {","status":"ok","fileHash":"dfa36f28dad8","snippet":{"startLine":104,"code":"  } else {\n    const exact = [];\n    lines.forEach((l, i) => norm(l) === wanted && exact.push(i));\n    if (exact.length) {\n      idx = nearest(exact, idx0);\n      status = 'moved';\n    } else {\n      const partial = [];\n      if (wanted.length >= 6) {\n        lines.forEach((l, i) => {\n          const n = norm(l);\n          if (n.length >= 6 && (n.includes(wanted) || wanted.includes(n))) partial.push(i);\n        });\n      }\n      if (!partial.length && loc.symbol) {\n        const re = new RegExp(`\\\\b${loc.symbol.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')}\\\\b`);\n        lines.forEach((l, i) => re.test(l) && partial.push(i));\n      }"}},{"id":"2f","title":"Fuzzy fallback","description":"Partial text or symbol match, flagged fuzzy for a manual check.","explanation":"The last resort before `unresolved`. First it looks for substring containment either way, limited to lines of at least 6 normalized characters so short tokens like `}` don't match everywhere. If that finds nothing and the location has a `symbol`, it tries a regex-escaped word-boundary match on the symbol. The nearest hit wins and the status is `fuzzy`, with a \"double-check\" note, because the anchor may now point at a similar but different line. If even this fails, the location stays `unresolved` at the clamped original line, so it still gets a snippet.","path":"src/anchor.js","lineNumber":124,"lineContent":"status = 'fuzzy';","status":"ok","fileHash":"dfa36f28dad8","snippet":{"startLine":121,"code":"      }\n      if (partial.length) {\n        idx = nearest(partial, idx0);\n        status = 'fuzzy';\n      }\n    }\n  }\n  if (relocatedFrom && (status === 'ok' || status === 'moved')) status = 'relocated';\n\n  const anchorIdx = idx >= 0 ? idx : idx0;\n  const start = Math.max(0, anchorIdx - SNIPPET_BEFORE);\n  const end = Math.min(lines.length, anchorIdx + SNIPPET_AFTER + 1);\n  const result = {\n    ...loc,\n    path: relPath,\n    lineNumber: anchorIdx + 1,\n    status,\n    fileHash: file.hash,"}},{"id":"2g","title":"safeJoin guard","description":"Resolves repo-relative paths and refuses anything outside the root.","explanation":"Map paths come from an LLM, or from a shared JSON file, so they must not be able to read arbitrary files. `safeJoin` resolves the path against the root and checks the relative path back: anything starting with `..` or still absolute (for example another drive on Windows) throws. `FileCache.read` calls it inside a `try`, so an escaping path shows up as `missing` instead of an exception. The cache also skips files over 4 MB to avoid loading huge generated artifacts.","path":"src/anchor.js","lineNumber":13,"lineContent":"export function safeJoin(root, rel) {","symbol":"safeJoin","status":"ok","fileHash":"dfa36f28dad8","snippet":{"startLine":10,"code":"const norm = (s) => (s || '').trim().replace(/\\s+/g, ' ');\n\n/** Resolves a repo-relative path, refusing anything that escapes the root. */\nexport function safeJoin(root, rel) {\n  const abs = path.resolve(root, rel);\n  const relBack = path.relative(root, abs);\n  if (relBack.startsWith('..') || path.isAbsolute(relBack)) {\n    throw new Error(`Path \"${rel}\" is outside the repository root`);\n  }\n  return abs;\n}\n\nexport class FileCache {\n  constructor(root) {\n    this.root = root;\n    this.files = new Map();\n    this._tracked = undefined;\n  }"}}],"tree":[{"ref":"2a","children":[{"ref":"2b","children":[{"label":"file resolution","children":[{"ref":"2g"},{"ref":"2c"}]},{"label":"line resolution (in order)","children":[{"ref":"2d"},{"ref":"2e"},{"ref":"2f"}]}]}]}]},{"id":"3","title":"Reuse: viewer, context and drift","description":"The stored map is consumed by humans (HTML), by agents (markdown resource) and by CI (verify).","motivation":"A map is only worth something if people read it and it stays correct. This trace shows the three ways a stored map is consumed: a human-friendly viewer, agent-friendly context and a CI check. All three work from the same JSON document.","details":"For humans, [3a] packs the document, a clickable Mermaid diagram and a compact markdown copy into a single HTML file that can be shared without a server. Inside it, selecting a node [3b] shows that node's code with the anchor line highlighted, links to the editor and the remote, and the trace guide.\n\nFor agents, the `waymark://{id}` resource template [3c] lists every map (with id autocompletion) and, when read, returns [3d]'s markdown: header, text call tree and numbered snippets per location. That is exactly what an @-mention injects into context.\n\nFor maintenance, [3e] loads the stored map and re-runs [2b] on every location. It reports status changes, moved lines and files whose hash changed since the map was written. With `fix`, it writes the corrected anchors back and regenerates the HTML. `waymark verify --strict` turns that report into a CI failure.","locations":[{"id":"3a","title":"renderHtml","description":"Inlines map, file snapshots, CSS and client into one HTML.","explanation":"This is where a stored map becomes something a human can open with a double-click. `renderHtml` receives the map plus a snapshot of every referenced file (collected by `collectFiles` in the store) and inlines four things into a single page: the CSS, the client script from `viewer.client.js`, the map JSON and those file contents. Nothing is fetched at view time, so the file works offline, from an email attachment or from a CI artifact, and it keeps showing the code *as it was* when the map was made. The only escaping that matters is in the JSON island: every `\u003c` is neutralised so a snippet containing `\u003c/script>` cannot break out of the data block. Selection itself happens client-side in [3b].","path":"src/render/html.js","lineNumber":24,"lineContent":"export function renderHtml(doc, { files = {} } = {}) {","symbol":"renderHtml","status":"ok","fileHash":"37fc4f3366e8","snippet":{"startLine":21,"code":" * explanations; code view with embedded files; interactive SVG diagram.\n * `files` is a snapshot { path: content } of the referenced files.\n */\nexport function renderHtml(doc, { files = {} } = {}) {\n  const data = {\n    doc,\n    files,\n    markdown: renderMarkdown(doc, { detail: 'full' }),\n    mermaid: renderMermaid({ ...doc, diagram: undefined }),\n  };\n  return `\u003c!doctype html>\n\u003chtml lang=\"${escHtml(doc.language || 'en')}\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"generator\" content=\"waymark\">\n\u003ctitle>Waymark · ${escHtml(doc.title)}\u003c/title>\n\u003cstyle>${CSS}\u003c/style>"}},{"id":"3b","title":"Node selection","description":"One primitive syncs map pane, code view and diagram.","explanation":"`select` is the single navigation primitive of the viewer: every interaction (clicking a card, a `[1a]` reference in a guide, a gutter marker, a diagram node, prev/next or the arrow keys) ends up here. It highlights the card in the map pane and opens its trace, then `showInCode` switches the file tab, highlights the anchor line and inserts the inline annotation with the one-line description, an Explain toggle and prev/next. If the diagram has been built it also focuses the node and its path (everything else dims) and, in diagram view, opens the detail card and pans to it. Finally it writes `#id` to the URL, which is what makes deep links like `waymark-create-flow.html#2e` shareable. Because all views go through this one function they can never disagree about what is selected.","path":"src/render/viewer.client.js","lineNumber":767,"lineContent":"function select(id, opts = {}) {","symbol":"select","status":"moved","fileHash":"1bc3f9f0cefb","snippet":{"startLine":764,"code":"  $('#zsel').onclick = () => { const n = state.sel && dg && dg.primary.get(state.sel); if (n) centerOn(n); };\n\n  // ---------------------------------------------------------------- selection & views\n  function select(id, opts = {}) {\n    const l = byId.get(id);\n    if (!l) return;\n    state.sel = id;\n    $$('.loc.sel', mapPane).forEach((e) => e.classList.remove('sel'));\n    const card = $('.loc[data-id=\"' + id + '\"]:not(.ref-again)', mapPane);\n    if (card) {\n      card.classList.add('sel');\n      card.closest('.trace').classList.remove('closed');\n      if (opts.from !== 'map') card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n    }\n    showInCode(l);\n    if (dg) {\n      const n = focusDiagram(id);\n      if (state.view === 'diagram') {"},"note":"line 723 -> 767"},{"id":"3c","title":"waymark:// resource","description":"waymark://{id} resource: lists maps and serves them as markdown.","explanation":"This resource template makes maps @-mentionable. Its `list` callback lists every stored map with title and description, and `complete` autocompletes ids by prefix. Reading `waymark://\u003cid>` loads the JSON and returns `renderMarkdown` [3d] output as `text/markdown`. It re-reads `.waymark/` on each request, which is why the `resourceListChanged` signal from [1c] is enough to show new maps without server state. It always uses the default root (`rootOf()`), so it serves maps from the server's configured repository.","path":"src/mcp.js","lineNumber":267,"lineContent":"server.registerResource(","status":"ok","fileHash":"4e0358df1b7a","snippet":{"startLine":264,"code":"  );\n\n  // @-mentionable context: waymark://\u003cid>\n  server.registerResource(\n    'waymark',\n    new ResourceTemplate('waymark://{id}', {\n      list: async () => ({\n        resources: listMaps(rootOf()).map((m) => ({\n          uri: `waymark://${m.id}`,\n          name: m.title,\n          description: m.description,\n          mimeType: 'text/markdown',\n        })),\n      }),\n      complete: { id: (v) => listMaps(rootOf()).map((m) => m.id).filter((i) => i.startsWith(v)) },\n    }),\n    { title: 'Waymark', description: 'A waymark rendered as markdown context', mimeType: 'text/markdown' },\n    async (uri, { id }) => ({"}},{"id":"3d","title":"renderMarkdown","description":"Renders a map as agent-oriented markdown with tree and snippets.","explanation":"This is the text an agent actually reads when it loads a map. It writes a header with id, commit, branch, date and the original query. Then, for each trace, it writes the description, an ASCII call tree and one entry per location: title, `path:line`, symbol, description and, at `full` detail, a numbered snippet with the anchor line marked `>`. `compact` drops the snippets for a cheaper overview (used for the copy embedded in the HTML [3a]). The format is built for an LLM: node ids like [1a] match the tree, so the model can cross-reference quickly.","path":"src/render/markdown.js","lineNumber":29,"lineContent":"export function renderMarkdown(doc, { detail = 'full', diagram = false } = {}) {","symbol":"renderMarkdown","status":"ok","fileHash":"a668e9603f14","snippet":{"startLine":26,"code":" * detail: \"full\" includes the narrative (story, guides, explanations) and snippets;\n * \"compact\" keeps only structure, one-line descriptions and anchors.\n */\nexport function renderMarkdown(doc, { detail = 'full', diagram = false } = {}) {\n  const o = [];\n  o.push(`# Waymark: ${doc.title}`);\n  o.push('');\n  o.push(doc.description);\n  const m = doc.meta || {};\n  o.push('');\n  o.push(\n    `_id: \\`${doc.id}\\`${m.commit ? ` · commit ${m.commit.slice(0, 8)}` : ''}${m.branch ? ` (${m.branch})` : ''}` +\n      `${m.updatedAt ? ` · updated ${m.updatedAt.slice(0, 10)}` : ''}${doc.query ? ` · query: \"${doc.query}\"` : ''}_`,\n  );\n\n  const full = detail === 'full';\n  if (full && doc.story) o.push('', '## The story', '', doc.story);\n"}},{"id":"3e","title":"verifyMap","description":"Re-anchors a stored map, reports drift, optionally writes fixes back.","explanation":"`verifyMap` loads a stored map and runs every location through the same `anchorLocation` [2b] used at creation, with a fresh `FileCache`. It records a change whenever the status is not `ok` or the line or path differs. Separately, it compares each stored `fileHash` with the current one to list files that changed even when the anchor line didn't move. The map is `stale` if either list is non-empty and `broken` counts unresolved plus missing. With `fix`, the corrected locations replace the old ones, `commit` and `verifiedAt` are updated, and both JSON and HTML are rewritten. Without `fix`, nothing on disk changes, which is what makes `waymark verify --strict` safe to run in CI.","path":"src/verify.js","lineNumber":9,"lineContent":"export function verifyMap(root, id, { fix = false } = {}) {","symbol":"verifyMap","status":"ok","fileHash":"214d66bfa2c2","snippet":{"startLine":6,"code":" * Re-checks every anchor of a stored waymark against the current working tree.\n * With fix=true, corrected line numbers/snippets are written back.\n */\nexport function verifyMap(root, id, { fix = false } = {}) {\n  const doc = loadMap(root, id);\n  const cache = new FileCache(root);\n  const changes = [];\n  const changedFiles = new Set();\n  const counts = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0 };\n\n  for (const trace of doc.traces) {\n    trace.locations = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      counts[r.status]++;\n      if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      if (r.status !== 'ok' || r.lineNumber !== loc.lineNumber || r.path !== loc.path) {\n        changes.push({\n          id: loc.id,"}}],"tree":[{"label":"humans","children":[{"ref":"3a","children":[{"ref":"3b"}]}]},{"label":"agents","children":[{"ref":"3c","children":[{"ref":"3d"}]}]},{"label":"CI / maintenance","children":[{"ref":"3e"}]}]}],"links":[{"from":"1f","to":"2a","label":"anchorWaymark map(root, map)"},{"from":"1h","to":"3a","label":"renderHtml(doc)"},{"from":"3e","to":"2b","label":"re-anchor each location"}],"tags":["meta","architecture"],"meta":{"createdAt":"2026-10-01T16:36:38.822Z","updatedAt":"2026-10-20T01:44:35.102Z","root":"C:\\DATOS\\codemaps-custom","commit":"92eefc332fc861c3d1deda83e2180271900b86ec","branch":"main","remote":"https://github.com/h0w4r/waymark","anchors":{"ok":19,"moved":1,"fuzzy":0,"relocated":0,"unresolved":0,"missing":0},"verifiedAt":"2026-10-20T01:53:34.906Z"}},"files":{"src/mcp.js":"#!/usr/bin/env node\nimport * as z from 'zod';\nimport { McpServer, ResourceTemplate } from '@modelcontextprotocol/sdk/server/mcp.js';\nimport { StdioServerTransport } from '@modelcontextprotocol/sdk/server/stdio.js';\nimport { MapInput } from './schema.js';\nimport { fileURLToPath } from 'node:url';\nimport { resolveRoot } from './git.js';\nimport { saveMap, loadMap, listMaps, writeHtml, deleteMap, annotateMap, narrativeGaps } from './store.js';\nimport { verifyMap } from './verify.js';\nimport { findInFile } from './anchor.js';\nimport { suggestTopics } from './suggest.js';\nimport { waymarkGuide, enrichGuide } from './guide.js';\nimport { renderMarkdown } from './render/markdown.js';\nimport { renderMermaid } from './render/mermaid.js';\nimport { openFile } from './open.js';\n\nconst VERSION = '0.1.0';\nconst rootArg = z.string().optional().describe('Repository root. Defaults to the server working directory / WAYMARK_ROOT');\n\nconst text = (t) => ({ content: [{ type: 'text', text: typeof t === 'string' ? t : JSON.stringify(t, null, 2) }] });\nconst fail = (e) => ({ isError: true, content: [{ type: 'text', text: String(e?.message || e) }] });\nconst safe = (fn) => async (args) => {\n  try {\n    return await fn(args);\n  } catch (e) {\n    return fail(e);\n  }\n};\n\n// Workspace announced by the client (MCP roots). Lets a globally installed server\n// (e.g. ~/.codex/config.toml used by Codex desktop) target the open project.\nlet clientRoot = null;\nconst rootOf = (root) => resolveRoot(root || process.env.WAYMARK_ROOT || clientRoot || undefined);\n\nexport function createServer() {\n  const server = new McpServer(\n    { name: 'waymark', version: VERSION },\n    {\n      instructions:\n        'Waymark: hierarchical, line-anchored maps of how code executes. To create one, call waymark_start(query) and follow the returned procedure, then waymark_create. ' +\n        'To use an existing map as context, read resource waymark://\u003cid> or call waymark_get. Run waymark_verify before trusting an old map.',\n    },\n  );\n\n  server.registerTool(\n    'waymark_start',\n    {\n      title: 'Start a waymark',\n      description:\n        'Begin generating a waymark map for a topic/question. Returns the Waymark agent procedure (structure + storytelling rules), the input format, repo hints (recent files, entry points) and existing maps. Call this first, then explore the code and submit with waymark_create.',\n      inputSchema: {\n        query: z.string().describe('Topic or question, e.g. \"how does checkout payment work?\"'),\n        mode: z.enum(['fast', 'smart']).optional().describe('fast: short map quickly; smart (default): thorough map with full storytelling'),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ query, mode, root }) => {\n      const r = rootOf(root);\n      const hints = suggestTopics(r, { limit: 5 });\n      const existing = listMaps(r).slice(0, 15).map(({ id, title, query: q, updatedAt }) => ({ id, title, query: q, updatedAt }));\n      return text(\n        `${waymarkGuide(query, { mode })}\\n## Repository\\n\\nroot: ${r}\\n\\n` +\n          `Entry points: ${hints.entryPoints.join(', ') || '(none detected)'}\\n\\n` +\n          `Recently touched: ${hints.recentFiles.slice(0, 12).map((f) => f.file).join(', ') || '(none)'}\\n\\n` +\n          `Existing waymark (reuse/update instead of duplicating): ${existing.length ? JSON.stringify(existing) : 'none'}`,\n      );\n    }),\n  );\n\n  server.registerTool(\n    'waymark_suggest_topics',\n    {\n      title: 'Suggest waymark topics',\n      description: 'Suggests waymark topics from recent work (uncommitted and recently committed files, commit subjects) and detected entry points.',\n      inputSchema: { root: rootArg, limit: z.number().int().min(1).max(20).optional() },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ root, limit }) => text(suggestTopics(rootOf(root), { limit }))),\n  );\n\n  server.registerTool(\n    'waymark_find_anchor',\n    {\n      title: 'Find anchor lines',\n      description: 'Returns line numbers and exact line text in a file matching a literal string or regex. Use it to get precise lineNumber/lineContent for locations.',\n      inputSchema: {\n        path: z.string().describe('File path relative to repo root'),\n        pattern: z.string(),\n        regex: z.boolean().optional(),\n        limit: z.number().int().min(1).max(100).optional(),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ path, pattern, regex, limit, root }) => text(findInFile(rootOf(root), path, pattern, { regex, limit }))),\n  );\n\n  server.registerTool(\n    'waymark_create',\n    {\n      title: 'Create or update a waymark',\n      description:\n        'Validates a waymark, verifies every location against the working tree (auto-correcting shifted line numbers), stores it under .waymark/ and writes a shareable HTML viewer. Pass `id` to overwrite an existing map. Returns an anchor report: fix any unresolved/missing locations and resubmit.',\n      inputSchema: {\n        ...MapInput.shape,\n        id: z.string().optional().describe('Existing waymark id to overwrite'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...map }) => {\n      const r = rootOf(root);\n      const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });\n      server.sendResourceListChanged();\n      const next = [];\n      if (!report.healthy) {\n        next.push('Some locations could not be verified. Fix them (waymark_find_anchor helps) and call waymark_create again with id=\"' + doc.id + '\".');\n      }\n      if (!narrative.complete) {\n        next.push('Narrative is incomplete (see \"narrative\"). Fill the story, trace motivation/details and per-location explanations with waymark_annotate(id=\"' + doc.id + '\").');\n      }\n      if (!next.length) next.push('All anchors verified and narrative complete. Share the HTML file or reference waymark://' + doc.id);\n      return text({ id: doc.id, resource: `waymark://${doc.id}`, html: htmlPath, json: jsonPath, anchors: report, narrative, next });\n    }),\n  );\n\n  const prose = () => z.string().optional();\n  server.registerTool(\n    'waymark_annotate',\n    {\n      title: 'Annotate a waymark (narrative)',\n      description:\n        'Adds or rewrites the prose of an existing map without re-sending or re-anchoring it: map story/description/title, trace motivation/details/description/diagramTitle, location explanation/description/title. Only the fields you pass change. Regenerates the HTML viewer and returns which narrative fields are still missing.',\n      inputSchema: {\n        id: z.string().describe('Map id (a unique prefix is enough)'),\n        title: prose(),\n        description: prose().describe('Map summary citing nodes as [1a]'),\n        story: prose().describe('Holistic storytelling narrative (markdown)'),\n        language: prose(),\n        traces: z\n          .array(\n            z.object({\n              id: z.string(),\n              title: prose(),\n              description: prose(),\n              diagramTitle: prose(),\n              motivation: prose().describe('Why this part exists (markdown)'),\n              details: prose().describe('Narrative walkthrough citing nodes (markdown)'),\n            }),\n          )\n          .optional(),\n        locations: z\n          .array(\n            z.object({\n              id: z.string(),\n              title: prose(),\n              description: prose().describe('One sentence \u003c= 15 words'),\n              explanation: prose().describe('Storytelling explanation, 3-6 sentences (markdown)'),\n            }),\n          )\n          .optional(),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...patch }) => text(annotateMap(rootOf(root), id, patch))),\n  );\n\n  server.registerTool(\n    'waymark_enrich',\n    {\n      title: 'Enrich a waymark with storytelling',\n      description:\n        'Returns the procedure to upgrade an existing map with full storytelling (holistic story, Motivation/Details guides per trace, an explanation per location), the list of missing narrative and the map itself. Follow it and save with waymark_annotate.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const doc = loadMap(rootOf(root), id);\n      return text(\n        enrichGuide(doc.id) +\n          '\\n\\n## Missing narrative\\n\\n' +\n          JSON.stringify(narrativeGaps(doc)) +\n          '\\n\\n## Current map\\n\\n' +\n          renderMarkdown(doc, { detail: 'full' }),\n      );\n    }),\n  );\n\n  server.registerTool(\n    'waymark_list',\n    {\n      title: 'List waymark',\n      description: 'Lists waymark stored in the repository (.waymark/).',\n      inputSchema: { root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ root }) => text(listMaps(rootOf(root)))),\n  );\n\n  server.registerTool(\n    'waymark_get',\n    {\n      title: 'Get a waymark',\n      description:\n        'Returns a waymark for use as context. format: \"markdown\" (structure + code snippets, default), \"compact\" (structure + anchor lines only), \"json\", \"mermaid\".',\n      inputSchema: {\n        id: z.string().describe('Waymark id (a unique prefix is enough)'),\n        format: z.enum(['markdown', 'compact', 'json', 'mermaid']).optional(),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, format = 'markdown', root }) => {\n      const doc = loadMap(rootOf(root), id);\n      if (format === 'json') return text(doc);\n      if (format === 'mermaid') return text(renderMermaid(doc));\n      return text(renderMarkdown(doc, { detail: format === 'compact' ? 'compact' : 'full' }));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_verify',\n    {\n      title: 'Verify waymark anchors',\n      description:\n        'Re-checks waymark locations against the current code: detects moved lines, renamed files and removed code. With fix=true, writes corrected anchors back. Omit id to verify all maps.',\n      inputSchema: { id: z.string().optional(), fix: z.boolean().optional(), root: rootArg },\n    },\n    safe(async ({ id, fix, root }) => {\n      const r = rootOf(root);\n      const ids = id ? [id] : listMaps(r).map((m) => m.id);\n      return text(ids.map((i) => verifyMap(r, i, { fix })));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_render',\n    {\n      title: 'Render waymark viewer',\n      description: 'Regenerates the self-contained HTML viewer of a waymark and optionally opens it in the default browser.',\n      inputSchema: { id: z.string(), open: z.boolean().optional(), root: rootArg },\n    },\n    safe(async ({ id, open, root }) => {\n      const r = rootOf(root);\n      const p = writeHtml(r, loadMap(r, id));\n      if (open) openFile(p);\n      return text({ html: p });\n    }),\n  );\n\n  server.registerTool(\n    'waymark_delete',\n    {\n      title: 'Delete a waymark',\n      description: 'Deletes a waymark (JSON and HTML) from .waymark/. Only use when the user asks.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { destructiveHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const removed = deleteMap(rootOf(root), id);\n      server.sendResourceListChanged();\n      return text({ deleted: removed });\n    }),\n  );\n\n  // @-mentionable context: waymark://\u003cid>\n  server.registerResource(\n    'waymark',\n    new ResourceTemplate('waymark://{id}', {\n      list: async () => ({\n        resources: listMaps(rootOf()).map((m) => ({\n          uri: `waymark://${m.id}`,\n          name: m.title,\n          description: m.description,\n          mimeType: 'text/markdown',\n        })),\n      }),\n      complete: { id: (v) => listMaps(rootOf()).map((m) => m.id).filter((i) => i.startsWith(v)) },\n    }),\n    { title: 'Waymark', description: 'A waymark rendered as markdown context', mimeType: 'text/markdown' },\n    async (uri, { id }) => ({\n      contents: [{ uri: uri.href, mimeType: 'text/markdown', text: renderMarkdown(loadMap(rootOf(), String(id))) }],\n    }),\n  );\n\n  server.registerPrompt(\n    'create_waymark',\n    {\n      title: 'Create a waymark',\n      description: 'Generate a hierarchical waymark of how the code works for a topic',\n      argsSchema: { query: z.string().describe('Topic or question') },\n    },\n    ({ query }) => ({ messages: [{ role: 'user', content: { type: 'text', text: waymarkGuide(query) } }] }),\n  );\n\n  server.server.oninitialized = async () => {\n    if (!server.server.getClientCapabilities()?.roots) return;\n    try {\n      const { roots } = await server.server.listRoots();\n      const first = roots.find((x) => x.uri.startsWith('file://'));\n      if (first) clientRoot = fileURLToPath(first.uri);\n    } catch {\n      /* client advertised roots but failed to list them: fall back to cwd */\n    }\n  };\n\n  return server;\n}\n\nexport async function startStdio() {\n  const server = createServer();\n  await server.connect(new StdioServerTransport());\n}\n\nif (import.meta.url === `file://${process.argv[1]}` || process.argv[1]?.endsWith('mcp.js')) {\n  startStdio().catch((e) => {\n    console.error(e);\n    process.exit(1);\n  });\n}\n","src/store.js":"import fs from 'node:fs';\nimport path from 'node:path';\nimport crypto from 'node:crypto';\nimport { normalizeMap } from './schema.js';\nimport { anchorMap, safeJoin } from './anchor.js';\nimport { headCommit, currentBranch, remoteWebUrl } from './git.js';\nimport { renderHtml } from './render/html.js';\n\nexport const SCHEMA_VERSION = 1;\n\nexport function mapDir(root) {\n  return path.join(root, process.env.WAYMARK_DIR || '.waymark');\n}\n\nconst slugify = (s) =>\n  s\n    .normalize('NFKD')\n    .replace(/[̀-ͯ]/g, '')\n    .toLowerCase()\n    .replace(/[^a-z0-9]+/g, '-')\n    .replace(/^-|-$/g, '')\n    .slice(0, 48) || 'waymark';\n\nconst validId = (id) => /^[a-z0-9][a-z0-9-]{0,80}$/.test(id);\n\nfunction filePath(root, id, ext = 'json') {\n  if (!validId(id)) throw new Error(`Invalid waymark id \"${id}\"`);\n  return path.join(mapDir(root), `${id}.${ext}`);\n}\n\n/** Validates, anchors against the working tree, persists JSON (+ HTML viewer). */\nexport function saveMap(root, input, { id, html = true } = {}) {\n  const map = normalizeMap(input);\n  const report = anchorMap(root, map);\n  const existing = id ? loadMap(root, id, { quiet: true }) : null;\n  const now = new Date().toISOString();\n  const doc = {\n    schemaVersion: SCHEMA_VERSION,\n    id: id || `${slugify(map.title)}-${crypto.randomBytes(3).toString('hex')}`,\n    ...map,\n    meta: {\n      createdAt: existing?.meta?.createdAt || now,\n      updatedAt: now,\n      root,\n      commit: headCommit(root),\n      branch: currentBranch(root),\n      remote: remoteWebUrl(root),\n      anchors: { ...report, issues: undefined },\n    },\n  };\n  fs.mkdirSync(mapDir(root), { recursive: true });\n  fs.writeFileSync(filePath(root, doc.id), JSON.stringify(doc, null, 2));\n  const htmlPath = html ? writeHtml(root, doc) : null;\n  return { doc, report, narrative: narrativeGaps(doc), jsonPath: filePath(root, doc.id), htmlPath };\n}\n\nexport function writeHtml(root, doc) {\n  const p = filePath(root, doc.id, 'html');\n  fs.writeFileSync(p, renderHtml(doc, { files: collectFiles(root, doc) }));\n  return p;\n}\n\nconst MAX_FILE_BYTES = 512 * 1024;\nconst MAX_TOTAL_BYTES = 8 * 1024 * 1024;\n\n/** Snapshot of every referenced file, embedded in the viewer (code tabs, gutter markers). */\nexport function collectFiles(root, doc) {\n  const files = {};\n  let total = 0;\n  const paths = [...new Set(doc.traces.flatMap((t) => t.locations.map((l) => l.path)))];\n  for (const rel of paths) {\n    try {\n      const abs = safeJoin(root, rel);\n      const st = fs.statSync(abs);\n      if (!st.isFile() || st.size > MAX_FILE_BYTES || total + st.size > MAX_TOTAL_BYTES) continue;\n      const text = fs.readFileSync(abs, 'utf8');\n      if (text.indexOf(String.fromCharCode(0)) !== -1) continue; // binary\n      files[rel] = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));\n      total += st.size;\n    } catch {\n      /* missing file: the viewer falls back to the stored snippet */\n    }\n  }\n  return files;\n}\n\n/** Which narrative fields are still empty (drives the \"fill with waymark_annotate\" hint). */\nexport function narrativeGaps(doc) {\n  const gaps = { story: !doc.story, motivation: [], details: [], explanation: [] };\n  for (const t of doc.traces) {\n    if (!t.motivation) gaps.motivation.push(t.id);\n    if (!t.details) gaps.details.push(t.id);\n    for (const l of t.locations) if (!l.explanation) gaps.explanation.push(l.id);\n  }\n  gaps.complete = !gaps.story && !gaps.motivation.length && !gaps.details.length && !gaps.explanation.length;\n  return gaps;\n}\n\n/**\n * Patches prose on an existing map without re-anchoring: story/description/title at map level,\n * title/description/diagramTitle/motivation/details per trace, title/description/explanation per location.\n */\nexport function annotateMap(root, id, patch) {\n  const doc = loadMap(root, id);\n  const unknown = [];\n  let changed = 0;\n  const set = (obj, key, val) => {\n    if (typeof val === 'string' && obj[key] !== val) {\n      obj[key] = val;\n      changed++;\n    }\n  };\n  for (const k of ['title', 'description', 'story', 'language']) set(doc, k, patch[k]);\n  for (const tp of patch.traces || []) {\n    const t = doc.traces.find((x) => x.id === String(tp.id));\n    if (!t) {\n      unknown.push(`trace ${tp.id}`);\n      continue;\n    }\n    for (const k of ['title', 'description', 'diagramTitle', 'motivation', 'details']) set(t, k, tp[k]);\n  }\n  for (const lp of patch.locations || []) {\n    const l = doc.traces.flatMap((t) => t.locations).find((x) => x.id === lp.id);\n    if (!l) {\n      unknown.push(`location ${lp.id}`);\n      continue;\n    }\n    for (const k of ['title', 'description', 'explanation']) set(l, k, lp[k]);\n  }\n  for (const t of doc.traces) {\n    if (t.guide && !t.details) t.details = t.guide;\n    delete t.guide;\n  }\n  doc.meta = { ...doc.meta, updatedAt: new Date().toISOString() };\n  persist(root, doc);\n  const htmlPath = writeHtml(root, doc);\n  return { id: doc.id, changed, unknown, narrative: narrativeGaps(doc), htmlPath };\n}\n\nexport function persist(root, doc) {\n  fs.writeFileSync(filePath(root, doc.id), JSON.stringify(doc, null, 2));\n}\n\nexport function loadMap(root, id, { quiet = false } = {}) {\n  let p;\n  try {\n    p = filePath(root, id);\n  } catch (e) {\n    if (quiet) return null;\n    throw e;\n  }\n  if (!fs.existsSync(p)) {\n    // Allow unique prefix lookups (\"auth-flow\" -> \"auth-flow-1a2b3c\").\n    const hit = listMaps(root).filter((m) => m.id.startsWith(id));\n    if (hit.length === 1) return loadMap(root, hit[0].id);\n    if (quiet) return null;\n    throw new Error(\n      hit.length > 1 ? `Ambiguous waymark id \"${id}\": ${hit.map((h) => h.id).join(', ')}` : `Waymark \"${id}\" not found`,\n    );\n  }\n  return JSON.parse(fs.readFileSync(p, 'utf8'));\n}\n\nexport function listMaps(root) {\n  const dir = mapDir(root);\n  if (!fs.existsSync(dir)) return [];\n  return fs\n    .readdirSync(dir)\n    .filter((f) => f.endsWith('.json'))\n    .map((f) => {\n      try {\n        const d = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));\n        return {\n          id: d.id,\n          title: d.title,\n          description: d.description,\n          query: d.query,\n          traces: d.traces.length,\n          locations: d.traces.reduce((n, t) => n + t.locations.length, 0),\n          updatedAt: d.meta?.updatedAt,\n          commit: d.meta?.commit?.slice(0, 8),\n          tags: d.tags,\n        };\n      } catch {\n        return null;\n      }\n    })\n    .filter(Boolean)\n    .sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));\n}\n\nexport function deleteMap(root, id) {\n  const doc = loadMap(root, id);\n  for (const ext of ['json', 'html']) {\n    const p = filePath(root, doc.id, ext);\n    if (fs.existsSync(p)) fs.unlinkSync(p);\n  }\n  return doc.id;\n}\n","src/anchor.js":"import fs from 'node:fs';\nimport path from 'node:path';\nimport crypto from 'node:crypto';\nimport { trackedFiles } from './git.js';\n\nconst MAX_FILE_BYTES = 4 * 1024 * 1024;\nconst SNIPPET_BEFORE = 3;\nconst SNIPPET_AFTER = 14;\n\nconst norm = (s) => (s || '').trim().replace(/\\s+/g, ' ');\n\n/** Resolves a repo-relative path, refusing anything that escapes the root. */\nexport function safeJoin(root, rel) {\n  const abs = path.resolve(root, rel);\n  const relBack = path.relative(root, abs);\n  if (relBack.startsWith('..') || path.isAbsolute(relBack)) {\n    throw new Error(`Path \"${rel}\" is outside the repository root`);\n  }\n  return abs;\n}\n\nexport class FileCache {\n  constructor(root) {\n    this.root = root;\n    this.files = new Map();\n    this._tracked = undefined;\n  }\n\n  read(rel) {\n    if (this.files.has(rel)) return this.files.get(rel);\n    let entry = null;\n    try {\n      const abs = safeJoin(this.root, rel);\n      const stat = fs.statSync(abs);\n      if (stat.isFile() && stat.size \u003c= MAX_FILE_BYTES) {\n        const text = fs.readFileSync(abs, 'utf8');\n        entry = {\n          lines: text.split(/\\r?\\n/),\n          hash: crypto.createHash('sha1').update(text.replace(/\\r\\n/g, '\\n')).digest('hex').slice(0, 12),\n        };\n      }\n    } catch {\n      entry = null;\n    }\n    this.files.set(rel, entry);\n    return entry;\n  }\n\n  /** Finds a moved/renamed file by basename when the original path is gone. */\n  findByBasename(rel) {\n    if (this._tracked === undefined) this._tracked = trackedFiles(this.root);\n    if (!this._tracked) return null;\n    const base = path.posix.basename(rel);\n    const hits = this._tracked.filter((f) => path.posix.basename(f) === base);\n    if (hits.length === 1) return hits[0];\n    // Prefer the candidate sharing the longest path suffix.\n    const parts = rel.split('/');\n    let best = null;\n    let bestScore = 0;\n    for (const h of hits) {\n      const hp = h.split('/');\n      let s = 0;\n      while (s \u003c parts.length && s \u003c hp.length && parts[parts.length - 1 - s] === hp[hp.length - 1 - s]) s++;\n      if (s > bestScore) [best, bestScore] = [h, s];\n      else if (s === bestScore) best = null;\n    }\n    return bestScore > 1 ? best : null;\n  }\n}\n\nfunction nearest(indices, target) {\n  return indices.reduce((a, b) => (Math.abs(b - target) \u003c Math.abs(a - target) ? b : a));\n}\n\n/**\n * Checks a location against the working tree and corrects its line number.\n * status: ok | moved (same text, other line) | fuzzy (partial match) | relocated (file moved)\n *         | unresolved (text not found) | missing (file not found)\n */\nexport function anchorLocation(cache, loc) {\n  let relPath = loc.path;\n  let file = cache.read(relPath);\n  let relocatedFrom = null;\n  if (!file) {\n    const alt = cache.findByBasename(relPath);\n    if (alt && (file = cache.read(alt))) {\n      relocatedFrom = relPath;\n      relPath = alt;\n    }\n  }\n  if (!file) {\n    return { ...loc, status: 'missing', note: `File not found: ${loc.path}` };\n  }\n\n  const { lines } = file;\n  const wanted = norm(loc.lineContent);\n  const idx0 = Math.min(Math.max(loc.lineNumber - 1, 0), lines.length - 1);\n  let idx = -1;\n  let status = 'unresolved';\n\n  if (!wanted || norm(lines[idx0]) === wanted) {\n    idx = idx0;\n    status = 'ok';\n  } else {\n    const exact = [];\n    lines.forEach((l, i) => norm(l) === wanted && exact.push(i));\n    if (exact.length) {\n      idx = nearest(exact, idx0);\n      status = 'moved';\n    } else {\n      const partial = [];\n      if (wanted.length >= 6) {\n        lines.forEach((l, i) => {\n          const n = norm(l);\n          if (n.length >= 6 && (n.includes(wanted) || wanted.includes(n))) partial.push(i);\n        });\n      }\n      if (!partial.length && loc.symbol) {\n        const re = new RegExp(`\\\\b${loc.symbol.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')}\\\\b`);\n        lines.forEach((l, i) => re.test(l) && partial.push(i));\n      }\n      if (partial.length) {\n        idx = nearest(partial, idx0);\n        status = 'fuzzy';\n      }\n    }\n  }\n  if (relocatedFrom && (status === 'ok' || status === 'moved')) status = 'relocated';\n\n  const anchorIdx = idx >= 0 ? idx : idx0;\n  const start = Math.max(0, anchorIdx - SNIPPET_BEFORE);\n  const end = Math.min(lines.length, anchorIdx + SNIPPET_AFTER + 1);\n  const result = {\n    ...loc,\n    path: relPath,\n    lineNumber: anchorIdx + 1,\n    status,\n    fileHash: file.hash,\n    snippet: { startLine: start + 1, code: lines.slice(start, end).join('\\n') },\n  };\n  if (idx >= 0) result.lineContent = lines[anchorIdx].trim();\n  const notes = [];\n  if (relocatedFrom) notes.push(`file moved from ${relocatedFrom}`);\n  if (status !== 'ok' && status !== 'unresolved' && loc.lineNumber !== anchorIdx + 1) {\n    notes.push(`line ${loc.lineNumber} -> ${anchorIdx + 1}`);\n  }\n  if (status === 'fuzzy') notes.push('partial text match; double-check');\n  if (status === 'unresolved') notes.push(`line content not found in ${relPath}: \"${loc.lineContent}\"`);\n  if (notes.length) result.note = notes.join('; ');\n  else delete result.note;\n  return result;\n}\n\n/** Anchors every location of a normalized map in place; returns a summary report. */\nexport function anchorMap(root, map) {\n  const cache = new FileCache(root);\n  const report = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0, issues: [] };\n  for (const trace of map.traces) {\n    trace.locations = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      report[r.status]++;\n      if (r.status !== 'ok') report.issues.push({ id: r.id, status: r.status, path: r.path, note: r.note });\n      return r;\n    });\n  }\n  report.total = map.traces.reduce((n, t) => n + t.locations.length, 0);\n  report.healthy = report.unresolved === 0 && report.missing === 0;\n  return report;\n}\n\n/** Search helper for agents: lines in a file matching a regex or literal, with numbers. */\nexport function findInFile(root, rel, pattern, { regex = false, limit = 20 } = {}) {\n  const cache = new FileCache(root);\n  const file = cache.read(rel.replace(/\\\\/g, '/'));\n  if (!file) throw new Error(`File not found or unreadable: ${rel}`);\n  const re = regex ? new RegExp(pattern) : null;\n  const hits = [];\n  file.lines.forEach((l, i) => {\n    if (hits.length \u003c limit && (re ? re.test(l) : l.includes(pattern))) {\n      hits.push({ lineNumber: i + 1, lineContent: l.trim() });\n    }\n  });\n  return { path: rel, totalLines: file.lines.length, hits };\n}\n","src/render/html.js":"import fs from 'node:fs';\nimport path from 'node:path';\nimport { fileURLToPath } from 'node:url';\nimport { renderMermaid } from './mermaid.js';\nimport { renderMarkdown } from './markdown.js';\n\nconst HERE = path.dirname(fileURLToPath(import.meta.url));\nconst CSS = fs.readFileSync(path.join(HERE, 'viewer.css'), 'utf8');\nconst CLIENT = fs.readFileSync(path.join(HERE, 'viewer.client.js'), 'utf8');\nconst BS = String.fromCharCode(92);\n\nconst escHtml = (s) =>\n  String(s ?? '').replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n\n// JSON inside \u003cscript type=\"application/json\">: only \"\u003c\" must be neutralized (no \"\u003c/script>\").\nconst inlineJson = (v) => JSON.stringify(v).split('\u003c').join(BS + 'u003c');\nconst inlineScript = (s) => s.replace(/\u003c\\/script/gi, '\u003c' + BS + '/script');\n\n/**\n * Self-contained, shareable viewer (no network): map pane with story, guides and\n * explanations; code view with embedded files; interactive SVG diagram.\n * `files` is a snapshot { path: content } of the referenced files.\n */\nexport function renderHtml(doc, { files = {} } = {}) {\n  const data = {\n    doc,\n    files,\n    markdown: renderMarkdown(doc, { detail: 'full' }),\n    mermaid: renderMermaid({ ...doc, diagram: undefined }),\n  };\n  return `\u003c!doctype html>\n\u003chtml lang=\"${escHtml(doc.language || 'en')}\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"generator\" content=\"waymark\">\n\u003ctitle>Waymark · ${escHtml(doc.title)}\u003c/title>\n\u003cstyle>${CSS}\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"app\">\n  \u003cheader id=\"topbar\">\n    \u003cspan class=\"brand\">WAYMARK\u003c/span>\u003cspan class=\"brand-sep\">\u003c/span>\n    \u003cspan class=\"top-title\">\u003c/span>\n    \u003cdiv class=\"seg\" role=\"tablist\" aria-label=\"View\">\n      \u003cbutton id=\"vCode\" role=\"tab\" title=\"Code view (d)\">Code\u003c/button>\n      \u003cbutton id=\"vDiagram\" role=\"tab\" title=\"Diagram view (d)\">Diagram\u003c/button>\n    \u003c/div>\n    \u003cbutton class=\"tbtn\" id=\"copyCtx\" title=\"Copy the map as markdown context for an agent\">Copy context\u003c/button>\n    \u003cbutton class=\"tbtn\" id=\"settingsBtn\" title=\"Editor link settings\">⚙\u003c/button>\n  \u003c/header>\n  \u003cdiv id=\"settings\" hidden>\n    \u003clabel>Local repo path \u003cinput id=\"setRoot\" spellcheck=\"false\">\u003c/label>\n    \u003clabel>Editor\n      \u003cselect id=\"setEditor\">\n        \u003coption value=\"vscode\">VS Code\u003c/option>\u003coption value=\"cursor\">Cursor\u003c/option>\n        \u003coption value=\"windsurf\">Windsurf / Devin Desktop\u003c/option>\u003coption value=\"idea\">JetBrains\u003c/option>\n      \u003c/select>\n    \u003c/label>\n  \u003c/div>\n  \u003cdiv id=\"main\">\n    \u003caside id=\"mapPane\" aria-label=\"Map\">\u003c/aside>\n    \u003cdiv id=\"splitter\" role=\"separator\" aria-orientation=\"vertical\" title=\"Drag to resize\">\u003c/div>\n    \u003csection id=\"rightPane\">\n      \u003cdiv id=\"codeView\">\n        \u003cdiv id=\"fileTabs\">\u003c/div>\n        \u003cdiv id=\"codeScroll\">\u003cdiv id=\"code\">\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"diagramView\" hidden>\n        \u003cdiv class=\"dg-toolbar\">\n          \u003cdiv class=\"legend\" id=\"legend\">\u003c/div>\n          \u003cdiv class=\"zoom\">\n            \u003cbutton id=\"zin\" title=\"Zoom in\">+\u003c/button>\n            \u003cbutton id=\"zout\" title=\"Zoom out\">−\u003c/button>\n            \u003cbutton id=\"zfit\" title=\"Fit all (f)\">⤢\u003c/button>\n            \u003cbutton id=\"zsel\" title=\"Center selected node\">◎\u003c/button>\n            \u003cbutton id=\"copyMmd\" title=\"Copy the diagram as Mermaid source\">⧉\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003csvg id=\"dg\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Interactive diagram\">\n          \u003cdefs>\n            \u003cmarker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\" style=\"color:var(--muted)\"/>\u003c/marker>\n            \u003cmarker id=\"arr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\" style=\"color:var(--ink2)\"/>\u003c/marker>\n          \u003c/defs>\n          \u003cg id=\"vp\">\u003c/g>\n        \u003c/svg>\n        \u003cdiv id=\"dgTip\" hidden>\u003c/div>\n        \u003cdiv id=\"dgCard\" hidden>\u003c/div>\n        \u003cdiv class=\"dg-hint\">Drag to pan · wheel to zoom · click a node to focus its path · double-click to open the code\u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/div>\n\u003c/div>\n\u003cscript id=\"waymark-data\" type=\"application/json\">${inlineJson(data)}\u003c/script>\n\u003cscript>${inlineScript(CLIENT)}\u003c/script>\n\u003c/body>\n\u003c/html>`;\n}\n","src/render/viewer.client.js":"/* Waymark viewer — runs inside the self-contained HTML. No dependencies, no network. */\n(() => {\n  'use strict';\n\n  const DATA = JSON.parse(document.getElementById('waymark-data').textContent);\n  const { doc } = DATA;\n  const FILES = DATA.files || {};\n  const meta = doc.meta || {};\n  const PALETTE = ['#5b8cff', '#e8803a', '#3fae6a', '#c04fd0', '#d4a72c', '#2fb3c4', '#e0566b', '#8a7dff', '#7fb800', '#ff6fa8'];\n  const SVGNS = 'http://www.w3.org/2000/svg';\n\n  const $ = (s, el = document) => el.querySelector(s);\n  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));\n  const esc = (s) =>\n    String(s == null ? '' : s).replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n  const base = (p) => p.split('/').pop();\n  const extOf = (p) => (base(p).includes('.') ? base(p).split('.').pop().toLowerCase() : base(p).toLowerCase());\n  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));\n\n  // ---------------------------------------------------------------- model\n  const traces = doc.traces.map((t, i) => ({ ...t, color: PALETTE[i % PALETTE.length], details: t.details || t.guide }));\n  const locs = [];\n  const byId = new Map();\n  for (const t of traces) for (const l of t.locations) {\n    const x = { ...l, trace: t };\n    locs.push(x);\n    byId.set(l.id, x);\n  }\n  const fileOrder = [...new Set(locs.map((l) => l.path))];\n\n  const prefsKey = 'waymark:' + doc.id;\n  const prefs = Object.assign({ root: meta.root || '', editor: 'vscode', mapW: null, view: 'code' }, safeJson(localStorage.getItem(prefsKey)));\n  function safeJson(s) { try { return JSON.parse(s) || {}; } catch { return {}; } }\n  const savePrefs = () => { try { localStorage.setItem(prefsKey, JSON.stringify(prefs)); } catch { /* private mode */ } };\n\n  const state = { sel: null, view: prefs.view === 'diagram' ? 'diagram' : 'code', file: null, explainOpen: new Set(), annoExpl: false };\n\n  // ---------------------------------------------------------------- text helpers\n  const REF_RE = /\\[((?:\\d+[a-z]{1,2})(?:\\s*,\\s*\\d+[a-z]{1,2})*)\\]/g;\n  function refs(html) {\n    return html.replace(REF_RE, (m, list) => {\n      const ids = list.split(/\\s*,\\s*/);\n      if (!ids.every((id) => byId.has(id))) return m;\n      return '\u003cspan class=\"refs\">[' + ids.map((id) => '\u003ca class=\"ref\" data-ref=\"' + id + '\">' + id + '\u003c/a>').join(', ') + ']\u003c/span>';\n    });\n  }\n  function inline(s) {\n    return refs(\n      esc(s)\n        .replace(/`([^`]+)`/g, '\u003ccode>$1\u003c/code>')\n        .replace(/\\*\\*([^*]+)\\*\\*/g, '\u003cstrong>$1\u003c/strong>')\n        .replace(/(^|[^*\\w])\\*([^*\\n]+)\\*(?!\\w)/g, '$1\u003cem>$2\u003c/em>')\n        .replace(/\\[([^\\]]+)\\]\\((https?:[^)\\s]+)\\)/g, '\u003ca href=\"$2\" target=\"_blank\" rel=\"noopener\">$1\u003c/a>'),\n    );\n  }\n  function md(src) {\n    const out = [];\n    let list = null;\n    let para = [];\n    let code = null;\n    const flushPara = () => { if (para.length) { out.push('\u003cp>' + inline(para.join(' ')) + '\u003c/p>'); para = []; } };\n    const closeList = () => { if (list) { out.push('\u003c/' + list + '>'); list = null; } };\n    for (const raw of String(src || '')
