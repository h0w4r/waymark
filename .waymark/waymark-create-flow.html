<script id="waymark-data" type="application/json">{"doc":{"schemaVersion":1,"id":"waymark-create-flow","title":"waymark_create: from tool call to shareable viewer","description":"How an agent's waymark_create call becomes a verified JSON map and a self-contained HTML viewer, and how it is later reused as context. Key takeaway: every location is re-anchored against the working tree by its exact line text, so line numbers from the LLM are hints, not truth.","story":"An agent has just traced a flow through a codebase and wants to save it. It calls the `waymark_create` MCP tool [1a] with a title, some traces and a list of locations. Each location has a path, a line number it *believes* is correct, and the exact text of that line. Nothing in that payload is trusted. The handler resolves the repository root and passes the raw map to `saveMap` [1b][1d]. This is the single path that creates (or overwrites) a map from input; later edits such as annotations, notes, verdicts and `verify --fix` only patch the stored JSON.\n\n`saveMap` first runs `normalizeMap` [1e]. It parses the input with Zod, fills in missing ids (`1`, `1a`, `1b`…), builds a linear call tree when none was given, and rejects tree refs or cross-trace links that point to unknown nodes. Then the key step: `anchorMap` [1f] → [2a] checks every location against the files actually on disk. For each one, `anchorLocation` [2b] opens the file through a root-jailed cache [2g]. If the path has disappeared, it looks for a renamed file [2c]. It then tries, in order, the claimed line [2d], the same text on a different line [2e], and finally a partial or symbol match [2f]. The result is a status (`ok`, `moved`, `relocated`, `fuzzy`, `unresolved`, `missing`), a corrected line number, a code snippet, a file hash and a context hash of the code around the anchor. **The LLM's line numbers are hints. The line text is the anchor.**\n\nOnce anchored, the narrative is baselined: each node, trace and the story remember the context hashes of the code they were written for. If the map is being overwritten, what humans and tools attached to it survives: notes stay, and fact-check verdicts and execution evidence are kept only where the code they vouch for has not changed. The document gets git metadata (commit, branch, remote) and is written as `.waymark/\u003cid>.json` [1g], the canonical, committable artifact. A self-contained HTML viewer is written next to it [1h]. The server then sends `resourceListChanged` [1c] so clients can @-mention `waymark://\u003cid>` immediately. The tool's reply includes the anchor report, missing narrative and lint results, and tells the agent what to fix and resubmit under the same id.\n\nFrom there the map has three audiences (trace 3). Humans open the HTML viewer [3a] and click through nodes [3b], optionally inside an editor that follows the selection. Agents load it as markdown context through the `waymark://` resource [3c], rendered by `renderMarkdown` [3d], whole or one trace/node at a time. CI and maintainers run `verifyMap` [3e], which reuses the same `anchorLocation` [2b] to catch drift: lines that moved, anchors that broke, files whose hash changed, and prose that describes code which has since been edited. One anchoring algorithm handles creating a map, keeping its anchors honest and keeping its story honest.","query":"how does waymark_create work end to end?","traces":[{"id":"1","title":"MCP entry and persistence","description":"The MCP tool handler resolves the repo root, delegates to the store, and notifies clients that the resource list changed.","motivation":"An MCP tool call is untrusted input from an LLM. This trace makes sure there is **exactly one entry point that creates maps** (`saveMap`), so every map on disk has been normalized, anchored and stamped in the same way, whether it came from MCP, the CLI or a re-save. Keeping the MCP handler thin also lets the CLI (`waymark create map.json`) share the same behavior.","details":"The tool is registered with the flattened `MapInput` schema [1a], so the model sees a flat, documented argument list instead of a nested blob. The handler's only real work is resolving the root (explicit `root`, then `WAYMARK_ROOT`, then the client's root) and calling the store [1b].\n\nInside **saveMap** [1d] the order matters. Normalization [1e] comes first so the anchorer gets ids and clean POSIX paths. Anchoring [1f] runs next so the stored snippets, line numbers and context hashes reflect the working tree. Then the narrative is baselined against those context hashes, so later code edits can flag the prose as stale. When `id` is passed, the existing map is loaded so its `createdAt` is kept and human-owned state is carried over: notes always, fact-check verdicts and execution evidence only while the code (and prose) they were recorded for is unchanged. Only then is the JSON written [1g], followed by the HTML viewer rendered from that same document [1h], which also refreshes the `.waymark/index.html` listing.\n\nAfter the write, [1c] notifies MCP clients that the resource list changed, which makes `@waymark:waymark://\u003cid>` usable straight away. The response returns the anchor report, the narrative gaps and a lint pass, with `next` hints telling the agent to resubmit with the same id, fill missing prose with `waymark_annotate`, or fix lint errors, so a weak map is corrected within the same agent turn.","locations":[{"id":"1a","title":"Tool registration","description":"Registers waymark_create with a flat MapInput schema plus optional id/root.","explanation":"This is where the whole flow starts: the MCP server publishes `waymark_create` to the client. The input schema spreads `MapInput.shape` and adds `id` and `root`, so the model sees a flat list of documented arguments instead of a nested object. That makes well-formed calls more likely. The tool description tells the model up front that line numbers will be auto-corrected and that unresolved anchors must be fixed and resubmitted, which sets expectations for the reply. The handler is wrapped in `safe(...)`, so a validation error (for example a duplicate location id from [1e]) comes back as an `isError` tool result instead of crashing the server.","path":"src/mcp.js","lineNumber":113,"lineContent":"'waymark_create',","symbol":"waymark_create","status":"ok","fileHash":"2b0b28761299","snippet":{"startLine":110,"code":"  );\n\n  server.registerTool(\n    'waymark_create',\n    {\n      title: 'Create or update a waymark',\n      description:\n        'Validates a waymark, verifies every location against the working tree (auto-correcting shifted line numbers), stores it under .waymark/ and writes a shareable HTML viewer. Pass `id` to overwrite an existing map. Returns an anchor report: fix any unresolved/missing locations and resubmit.',\n      inputSchema: {\n        ...MapInput.shape,\n        id: z.string().optional().describe('Existing waymark id to overwrite'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...map }) => {\n      const r = rootOf(root);\n      const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });\n      server.sendResourceListChanged();"},"ctxHash":"b50f3ad567fb","narrativeHash":"b50f3ad567fb","exec":{"hit":true,"count":1,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"b50f3ad567fb"},"check":{"verdict":"supported","issues":[],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"b50f3ad567fb","proseHash":"4830ecc10432"}},{"id":"1b","title":"Delegate to store","description":"Handler resolves the root and hands the raw map to saveMap.","explanation":"The handler pulls `id` and `root` out of the arguments and treats everything else as the map. `rootOf` resolves the repository root from the explicit argument, then `WAYMARK_ROOT`, then the root the client announced. Getting this wrong would anchor against the wrong tree, which is why the waymark agent always passes `root`. All the real work is delegated to `saveMap` [1d], which returns the stored document, the anchor report and the file paths. The handler then builds the reply: the `waymark://` URI, file paths, the report, and a `next` hint that tells the agent to resubmit with the same `id` if the map is unhealthy.","path":"src/mcp.js","lineNumber":126,"lineContent":"const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });","status":"ok","fileHash":"2b0b28761299","snippet":{"startLine":123,"code":"    },\n    safe(async ({ id, root, ...map }) => {\n      const r = rootOf(root);\n      const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });\n      server.sendResourceListChanged();\n      const next = [];\n      if (!report.healthy) {\n        next.push('Some locations could not be verified. Fix them (waymark_find_anchor helps) and call waymark_create again with id=\"' + doc.id + '\".');\n      }\n      if (!narrative.complete) {\n        next.push('Narrative is incomplete (see \"narrative\"). Fill the story, trace motivation/details and per-location explanations with waymark_annotate(id=\"' + doc.id + '\").');\n      }\n      const lint = lintMap(doc, { mapIds: new Set(listMaps(r).map((m) => m.id)) });\n      if (lint.errors) next.push('Lint found ' + lint.errors + ' error(s) (e.g. references to unknown nodes): fix them with waymark_annotate.');\n      if (!next.length) next.push('All anchors verified and narrative complete. Share the HTML file or reference waymark://' + doc.id);\n      return text({\n        id: doc.id,\n        resource: `waymark://${doc.id}`,"},"ctxHash":"5a4b4e7ff99f","narrativeHash":"5a4b4e7ff99f","exec":{"hit":true,"count":4,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"5a4b4e7ff99f"},"check":{"verdict":"partial","issues":["'the waymark agent always passes root' is about agent instructions, not verifiable in this code."],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"5a4b4e7ff99f","proseHash":"284a616ef712"}},{"id":"1c","title":"Notify resource change","description":"Notifies MCP clients that the waymark:// resource list changed.","explanation":"Right after the map is written, the server sends `resourceListChanged`. Clients such as Claude Code then re-query the resource template's `list` callback [3c] and the new map appears in @-mention autocompletion straight away, with no server restart. Without this call, the map would exist on disk but clients would not see it until they refreshed on their own. Note that it fires even when the anchor report is unhealthy: the map is saved either way, and health is reported separately.","path":"src/mcp.js","lineNumber":127,"lineContent":"server.sendResourceListChanged();","status":"ok","fileHash":"2b0b28761299","snippet":{"startLine":124,"code":"    safe(async ({ id, root, ...map }) => {\n      const r = rootOf(root);\n      const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });\n      server.sendResourceListChanged();\n      const next = [];\n      if (!report.healthy) {\n        next.push('Some locations could not be verified. Fix them (waymark_find_anchor helps) and call waymark_create again with id=\"' + doc.id + '\".');\n      }\n      if (!narrative.complete) {\n        next.push('Narrative is incomplete (see \"narrative\"). Fill the story, trace motivation/details and per-location explanations with waymark_annotate(id=\"' + doc.id + '\").');\n      }\n      const lint = lintMap(doc, { mapIds: new Set(listMaps(r).map((m) => m.id)) });\n      if (lint.errors) next.push('Lint found ' + lint.errors + ' error(s) (e.g. references to unknown nodes): fix them with waymark_annotate.');\n      if (!next.length) next.push('All anchors verified and narrative complete. Share the HTML file or reference waymark://' + doc.id);\n      return text({\n        id: doc.id,\n        resource: `waymark://${doc.id}`,\n        html: htmlPath,"},"ctxHash":"90b2b6dd2cb9","narrativeHash":"90b2b6dd2cb9","exec":{"hit":true,"count":4,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"90b2b6dd2cb9"},"check":{"verdict":"partial","issues":["Client behaviour (Claude Code re-querying list, autocompletion) is unverifiable from server code."],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"90b2b6dd2cb9","proseHash":"ef7086da4994"}},{"id":"1d","title":"saveMap","description":"Single writer: normalize, anchor, baseline narrative, carry over human state, write files.","explanation":"`saveMap` is the only function that turns input into a stored map, and the MCP tool [1b], the CLI and the parallel finalize flow all use it. It runs normalization [1e] and anchoring [1f] in order, then calls `baselineNarrative(map, { force: true })`: since the prose was just written, every node, trace and the story record a hash of the code they describe, which later lets verify [3e] flag prose that has gone stale. The id is either the caller's `id` (overwrite) or a slug of the title plus 3 random bytes. When overwriting, it loads the existing map and runs `carryOver`: human notes on a node always survive, while fact-check verdicts (`check`) and execution evidence (`exec`) are kept only if the node's `ctxHash` (and, for checks, its prose hash) is unchanged, so a stale verdict is never carried onto new code. The original `createdAt` is preserved too. It stamps `commit`, `branch` and `remote`, stores the anchor counts in `meta.anchors` (without the noisy `issues` list), and returns `narrativeGaps(doc)` so the handler can tell the agent which story, motivation, details or explanations are still empty.","path":"src/store.js","lineNumber":35,"lineContent":"export function saveMap(root, input, { id, html = true } = {}) {","symbol":"saveMap","status":"ok","fileHash":"3c9966c81adf","snippet":{"startLine":32,"code":"}\n\n/** Validates, anchors against the working tree, persists JSON (+ HTML viewer). */\nexport function saveMap(root, input, { id, html = true } = {}) {\n  const map = normalizeMap(input);\n  const report = anchorMap(root, map);\n  baselineNarrative(map, { force: true });\n  const existing = id ? loadMap(root, id, { quiet: true }) : null;\n  if (existing) carryOver(existing, map);\n  const now = new Date().toISOString();\n  const doc = {\n    schemaVersion: SCHEMA_VERSION,\n    id: id || `${slugify(map.title)}-${crypto.randomBytes(3).toString('hex')}`,\n    ...map,\n    meta: {\n      createdAt: existing?.meta?.createdAt || now,\n      updatedAt: now,\n      root,"},"ctxHash":"45159e8044ab","narrativeHash":"45159e8044ab","exec":{"hit":true,"count":4,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"45159e8044ab"},"check":{"verdict":"supported","issues":["fixed: said only MCP and CLI use saveMap; parallel finalize (src/parallel.js) also calls it."],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"45159e8044ab","proseHash":"0c0685c98d2b"}},{"id":"1e","title":"Normalize","description":"Zod-validates the input, assigns ids, defaults the tree, rejects dangling refs.","explanation":"`normalizeMap` parses the input with the Zod `MapInput` schema, then fills in what the LLM left out. Missing trace ids become `1`, `2`… and missing location ids become `1a`, `1b`…. Trace and location ids must match `[A-Za-z0-9_-]{1,16}`, and location ids must be unique across the whole map. Paths are converted to POSIX form and stripped of a leading `./`, so Windows-style input anchors the same way. A legacy `guide` field is moved to `details`. If no `tree` is given, a linear chain is built (each step nested under the previous one). Finally, every tree ref and cross-trace link is checked, and a reference to an unknown location throws before anything touches the disk.","path":"src/store.js","lineNumber":36,"lineContent":"const map = normalizeMap(input);","status":"ok","fileHash":"3c9966c81adf","snippet":{"startLine":33,"code":"\n/** Validates, anchors against the working tree, persists JSON (+ HTML viewer). */\nexport function saveMap(root, input, { id, html = true } = {}) {\n  const map = normalizeMap(input);\n  const report = anchorMap(root, map);\n  baselineNarrative(map, { force: true });\n  const existing = id ? loadMap(root, id, { quiet: true }) : null;\n  if (existing) carryOver(existing, map);\n  const now = new Date().toISOString();\n  const doc = {\n    schemaVersion: SCHEMA_VERSION,\n    id: id || `${slugify(map.title)}-${crypto.randomBytes(3).toString('hex')}`,\n    ...map,\n    meta: {\n      createdAt: existing?.meta?.createdAt || now,\n      updatedAt: now,\n      root,\n      commit: headCommit(root),"},"ctxHash":"112e22efbe85","narrativeHash":"112e22efbe85","exec":{"hit":true,"count":4,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"112e22efbe85"},"check":{"verdict":"supported","issues":["fixed: said all ids must be unique; only location ids are uniqueness-checked (trace ids are only format-checked)."],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"112e22efbe85","proseHash":"e8610c74be4b"}},{"id":"1f","title":"Anchor","description":"Verifies every location against the working tree and computes context hashes; see trace 2.","explanation":"This single call links the store to the anchoring engine [2a]. It changes `map.traces[*].locations` in place, replacing each location with its anchored version: corrected line, real line text, snippet, file hash, status and a `ctxHash` of the code block around the anchor. It returns the health report that ends up in both the tool reply and `meta.anchors`. Because it runs before the narrative baseline on the next line and before the JSON write [1g], both the stored snippets and the narrative hashes reflect the tree at save time, never the LLM's guess. An unhealthy report does not stop the save: the map is still persisted so the agent can fix it under the same id.","path":"src/store.js","lineNumber":37,"lineContent":"const report = anchorMap(root, map);","status":"ok","fileHash":"3c9966c81adf","snippet":{"startLine":34,"code":"/** Validates, anchors against the working tree, persists JSON (+ HTML viewer). */\nexport function saveMap(root, input, { id, html = true } = {}) {\n  const map = normalizeMap(input);\n  const report = anchorMap(root, map);\n  baselineNarrative(map, { force: true });\n  const existing = id ? loadMap(root, id, { quiet: true }) : null;\n  if (existing) carryOver(existing, map);\n  const now = new Date().toISOString();\n  const doc = {\n    schemaVersion: SCHEMA_VERSION,\n    id: id || `${slugify(map.title)}-${crypto.randomBytes(3).toString('hex')}`,\n    ...map,\n    meta: {\n      createdAt: existing?.meta?.createdAt || now,\n      updatedAt: now,\n      root,\n      commit: headCommit(root),\n      branch: currentBranch(root),"},"ctxHash":"592c1ab4fb58","narrativeHash":"592c1ab4fb58","exec":{"hit":true,"count":4,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"592c1ab4fb58"},"check":{"verdict":"supported","issues":[],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"592c1ab4fb58","proseHash":"1d6d50ff1ca5"}},{"id":"1g","title":"Write JSON","description":"Writes the canonical .waymark/\u003cid>.json, meant to be committed.","explanation":"The `.waymark/` directory is created if needed and the full document is written as pretty-printed JSON. That file is the source of truth: the HTML viewer, the markdown resource and `verify` are all derived from it. Pretty-printing with 2-space indentation keeps git diffs readable when a map is re-anchored or annotated. Writing it before the HTML means that if rendering fails, the canonical data is already safe.","path":"src/store.js","lineNumber":57,"lineContent":"fs.writeFileSync(filePath(root, doc.id), JSON.stringify(doc, null, 2));","status":"ok","fileHash":"3c9966c81adf","snippet":{"startLine":54,"code":"    },\n  };\n  fs.mkdirSync(mapDir(root), { recursive: true });\n  fs.writeFileSync(filePath(root, doc.id), JSON.stringify(doc, null, 2));\n  const htmlPath = html ? writeHtml(root, doc) : null;\n  return { doc, report, narrative: narrativeGaps(doc), jsonPath: filePath(root, doc.id), htmlPath };\n}\n\nexport function writeHtml(root, doc) {\n  const p = filePath(root, doc.id, 'html');\n  fs.writeFileSync(p, renderHtml(doc, { files: collectFiles(root, doc), maps: mapIndex(root, doc.id) }));\n  writeIndex(root);\n  return p;\n}\n\n/** Light index of the other maps (for mapRef links between maps). */\nfunction mapIndex(root, selfId) {\n  return listMaps(root)"},"ctxHash":"51ba5a2f2cea","narrativeHash":"51ba5a2f2cea","exec":{"hit":true,"count":4,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"51ba5a2f2cea"},"check":{"verdict":"supported","issues":[],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"51ba5a2f2cea","proseHash":"3381c296db5a"}},{"id":"1h","title":"Write HTML","description":"Renders the self-contained HTML viewer next to the JSON.","explanation":"Unless `html: false` is passed, `writeHtml` renders the document with `renderHtml` [3a] and saves it as `.waymark/\u003cid>.html`, then refreshes `.waymark/index.html`. The viewer is regenerated from the stored document on every save, annotate, note, recorded check and `verify --fix` that writes changes, so it never drifts from the JSON. The returned `htmlPath` goes back to the agent so it can hand the user a file to open or share.","path":"src/store.js","lineNumber":58,"lineContent":"const htmlPath = html ? writeHtml(root, doc) : null;","status":"ok","fileHash":"3c9966c81adf","snippet":{"startLine":55,"code":"  };\n  fs.mkdirSync(mapDir(root), { recursive: true });\n  fs.writeFileSync(filePath(root, doc.id), JSON.stringify(doc, null, 2));\n  const htmlPath = html ? writeHtml(root, doc) : null;\n  return { doc, report, narrative: narrativeGaps(doc), jsonPath: filePath(root, doc.id), htmlPath };\n}\n\nexport function writeHtml(root, doc) {\n  const p = filePath(root, doc.id, 'html');\n  fs.writeFileSync(p, renderHtml(doc, { files: collectFiles(root, doc), maps: mapIndex(root, doc.id) }));\n  writeIndex(root);\n  return p;\n}\n\n/** Light index of the other maps (for mapRef links between maps). */\nfunction mapIndex(root, selfId) {\n  return listMaps(root)\n    .filter((m) => m.id !== selfId)"},"ctxHash":"0481119e2bf2","narrativeHash":"0481119e2bf2","exec":{"hit":true,"count":4,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"0481119e2bf2"},"check":{"verdict":"supported","issues":["fixed: verify --fix only rewrites HTML when something changed; also note/check writes regenerate it, and writeHtml refreshes index.html."],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"0481119e2bf2","proseHash":"d4e056746e09"}}],"tree":[{"ref":"1a","children":[{"ref":"1b","children":[{"ref":"1d","children":[{"ref":"1e"},{"ref":"1f"},{"ref":"1g"},{"ref":"1h"}]}]},{"ref":"1c"}]}],"narrativeHash":"5879feb5d24e","check":{"verdict":"supported","issues":["fixed: motivation said saveMap is the only writer; persist() also writes on annotate/note/check/verify --fix. Now says single entry point that creates maps."],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","hash":"5879feb5d24e"}},{"id":"2","title":"Anchoring locations to real code","description":"Each location carries the exact text of its line; the anchorer finds it again even when lines shift or files move.","motivation":"Code moves all the time, and LLMs get line numbers wrong. A map pinned to bare line numbers would rot within a commit or two. Anchoring on the **text** of a line, with a graded set of fallbacks, keeps maps accurate for longer and makes drift visible instead of silent.","details":"[2a] creates one `FileCache` for the whole map, so each file is read and hashed once however many locations point at it. It runs [2b] for every location and tallies the statuses into a health report. A map counts as `healthy` only if nothing is `unresolved` or `missing`.\n\n**File resolution:** every read goes through [2g], which refuses paths that escape the repo root. If the file no longer exists, [2c] searches git-tracked files for the same basename and breaks ties by the longest shared path suffix. If more than one candidate ties, it returns nothing rather than guessing.\n\n**Line resolution**, from cheapest to loosest: [2d] checks whether the claimed line holds the claimed text after whitespace normalization. [2e] looks for that exact text elsewhere in the file and takes the occurrence nearest the claimed line. [2f] accepts a substring match (for lines of at least 6 characters) or, failing that, a word-boundary match on `symbol`, and marks the result `fuzzy`. Whatever matches, the location comes back with a corrected `lineNumber`, the real `lineContent`, a snippet (3 lines before, 14 after), a 12-character SHA-1 `fileHash` of the CRLF-normalized file and a `ctxHash` of the code block the anchor introduces. [3e] later compares both: the file hash to report changed files, the context hash to detect prose that no longer matches its code.","locations":[{"id":"2a","title":"anchorMap","description":"Anchors all locations with one shared FileCache and builds a health report.","explanation":"`anchorMap` sets up a single `FileCache` for the whole map, so each file is read, split and hashed only once even if many locations point at it. It replaces each location with the result of [2b] and adds one to the matching status counter. Anything that isn't `ok` goes into `issues` with its note, which is what tells the agent exactly what to fix. `healthy` is defined narrowly as no `unresolved` and no `missing`: a `moved` or `fuzzy` location still counts as healthy but is reported for review.","path":"src/anchor.js","lineNumber":218,"lineContent":"export function anchorMap(root, map) {","symbol":"anchorMap","status":"ok","fileHash":"bb82554c2c45","snippet":{"startLine":215,"code":"}\n\n/** Anchors every location of a normalized map in place; returns a summary report. */\nexport function anchorMap(root, map) {\n  const cache = new FileCache(root);\n  const report = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0, issues: [] };\n  for (const trace of map.traces) {\n    trace.locations = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      report[r.status]++;\n      if (r.status !== 'ok') report.issues.push({ id: r.id, status: r.status, path: r.path, note: r.note });\n      return r;\n    });\n  }\n  report.total = map.traces.reduce((n, t) => n + t.locations.length, 0);\n  report.healthy = report.unresolved === 0 && report.missing === 0;\n  return report;\n}"},"ctxHash":"3e16c9c5c719","narrativeHash":"3e16c9c5c719","exec":{"hit":true,"count":3,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"3e16c9c5c719"},"check":{"verdict":"supported","issues":[],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"3e16c9c5c719","proseHash":"6e7c114ae4ba"}},{"id":"2b","title":"anchorLocation","description":"Resolves one location: file, line, status, snippet, file hash and context hash.","explanation":"This is the core of Waymark, and both creation [2a] and verification [3e] use it. It resolves the file first (with a rename fallback [2c]) and returns `missing` immediately if nothing is found. Then it compares whitespace-normalized text: the claimed line [2d], an exact match elsewhere [2e], then a partial or symbol match [2f]. The claimed line number is clamped into the file's range, so an out-of-range hint cannot crash it. The returned location carries the corrected `lineNumber`, the real `lineContent` (only if a match was found), a snippet from 3 lines before to 14 after, the file hash, a `ctxHash` (hash of the block the anchor line opens, or a few sibling lines) and a note describing any correction. The `ctxHash` survives moves but changes when that block is edited, which is how narrative drift is detected. Pitfall: an empty `lineContent` counts as `ok` on any line, so locations must always include the line text.","path":"src/anchor.js","lineNumber":80,"lineContent":"export function anchorLocation(cache, loc) {","symbol":"anchorLocation","status":"ok","fileHash":"bb82554c2c45","snippet":{"startLine":77,"code":" * status: ok | moved (same text, other line) | fuzzy (partial match) | relocated (file moved)\n *         | unresolved (text not found) | missing (file not found)\n */\nexport function anchorLocation(cache, loc) {\n  let relPath = loc.path;\n  let file = cache.read(relPath);\n  let relocatedFrom = null;\n  if (!file) {\n    const alt = cache.findByBasename(relPath);\n    if (alt && (file = cache.read(alt))) {\n      relocatedFrom = relPath;\n      relPath = alt;\n    }\n  }\n  if (!file) {\n    return { ...loc, status: 'missing', note: `File not found: ${loc.path}` };\n  }\n"},"ctxHash":"eb2635fd3913","narrativeHash":"eb2635fd3913","exec":{"hit":true,"count":21,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"eb2635fd3913"},"notes":[{"text":"Ejemplo de nota humana: si cambias el orden de búsqueda (exacta → parcial → símbolo), los mapas existentes pueden re-anclarse en otra línea.","author":"demo","at":"2026-10-20T03:08:43.440Z","ctxHash":"eb2635fd3913"}],"check":{"verdict":"supported","issues":[],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"eb2635fd3913","proseHash":"672c60cf7771"}},{"id":"2c","title":"Renamed file fallback","description":"Finds a renamed or moved file by basename and longest path suffix.","explanation":"When the claimed path no longer exists, `findByBasename` searches the git-tracked files (loaded lazily, once per cache) for the same file name. A single hit is accepted. With several hits, it scores each by how many trailing path segments match the original and picks the best only if it shares more than the basename and is not tied. If git is unavailable or the result is ambiguous, it returns null and the location ends up `missing`. A successful match turns an `ok` or `moved` result into `relocated` (a `fuzzy` or `unresolved` result keeps its status), and the note always records `file moved from …`, so file moves are always reported.","path":"src/anchor.js","lineNumber":85,"lineContent":"const alt = cache.findByBasename(relPath);","status":"ok","fileHash":"bb82554c2c45","snippet":{"startLine":82,"code":"  let file = cache.read(relPath);\n  let relocatedFrom = null;\n  if (!file) {\n    const alt = cache.findByBasename(relPath);\n    if (alt && (file = cache.read(alt))) {\n      relocatedFrom = relPath;\n      relPath = alt;\n    }\n  }\n  if (!file) {\n    return { ...loc, status: 'missing', note: `File not found: ${loc.path}` };\n  }\n\n  const { lines } = file;\n  const wanted = norm(loc.lineContent);\n  const idx0 = Math.min(Math.max(loc.lineNumber - 1, 0), lines.length - 1);\n  let idx = -1;\n  let status = 'unresolved';"},"ctxHash":"6ea2b704c68a","narrativeHash":"6ea2b704c68a","exec":{"hit":true,"count":2,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"6ea2b704c68a"},"check":{"verdict":"supported","issues":["fixed: said any successful basename match becomes relocated; only ok/moved become relocated, fuzzy/unresolved keep status (note still records the move)."],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"6ea2b704c68a","proseHash":"9ffaf527af4d"}},{"id":"2d","title":"Exact line match","description":"Fast path: the claimed line holds the claimed text.","explanation":"Both sides go through `norm`, which trims and collapses whitespace, so re-indentation or CRLF vs LF line endings never break an anchor. If the claimed line matches, the location is `ok` and no correction is made. This is the common case right after the LLM has read the file. Note the `!wanted` short-circuit: a location without `lineContent` is accepted on whatever line it claims, with nothing actually checked.","path":"src/anchor.js","lineNumber":101,"lineContent":"if (!wanted || norm(lines[idx0]) === wanted) {","status":"ok","fileHash":"bb82554c2c45","snippet":{"startLine":98,"code":"  let idx = -1;\n  let status = 'unresolved';\n\n  if (!wanted || norm(lines[idx0]) === wanted) {\n    idx = idx0;\n    status = 'ok';\n  } else {\n    const exact = [];\n    lines.forEach((l, i) => norm(l) === wanted && exact.push(i));\n    if (exact.length) {\n      idx = nearest(exact, idx0);\n      status = 'moved';\n    } else {\n      const partial = [];\n      if (wanted.length >= 6) {\n        lines.forEach((l, i) => {\n          const n = norm(l);\n          if (n.length >= 6 && (n.includes(wanted) || wanted.includes(n))) partial.push(i);"},"ctxHash":"e0d62e67aaa5","narrativeHash":"e0d62e67aaa5","exec":{"hit":true,"count":10,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"e0d62e67aaa5"},"check":{"verdict":"supported","issues":[],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"e0d62e67aaa5","proseHash":"720986d1f494"}},{"id":"2e","title":"Moved line","description":"Same text elsewhere in the file; picks the occurrence nearest the claimed line.","explanation":"If the claimed line doesn't match, every line in the file is compared exactly (after normalization). When there are several hits, as with a repeated `return null;`, `nearest` picks the one closest to the claimed line number, on the assumption that code drifts a little rather than jumping across the file. The location becomes `moved` and the note records the correction (`line X -> Y`). This is the case that keeps maps working after edits above the anchor shift every line down.","path":"src/anchor.js","lineNumber":107,"lineContent":"if (exact.length) {","status":"ok","fileHash":"bb82554c2c45","snippet":{"startLine":104,"code":"  } else {\n    const exact = [];\n    lines.forEach((l, i) => norm(l) === wanted && exact.push(i));\n    if (exact.length) {\n      idx = nearest(exact, idx0);\n      status = 'moved';\n    } else {\n      const partial = [];\n      if (wanted.length >= 6) {\n        lines.forEach((l, i) => {\n          const n = norm(l);\n          if (n.length >= 6 && (n.includes(wanted) || wanted.includes(n))) partial.push(i);\n        });\n      }\n      if (!partial.length && loc.symbol) {\n        const re = new RegExp(`\\\\b${loc.symbol.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')}\\\\b`);\n        lines.forEach((l, i) => re.test(l) && partial.push(i));\n      }"},"ctxHash":"7bea5a0d91b7","narrativeHash":"7bea5a0d91b7","exec":{"hit":true,"count":7,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"7bea5a0d91b7"},"check":{"verdict":"supported","issues":[],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"7bea5a0d91b7","proseHash":"cf389168b729"}},{"id":"2f","title":"Fuzzy fallback","description":"Partial text or symbol match, flagged fuzzy for a manual check.","explanation":"The last resort before `unresolved`. First it looks for substring containment either way, limited to lines of at least 6 normalized characters so short tokens like `}` don't match everywhere. If that finds nothing and the location has a `symbol`, it tries a regex-escaped word-boundary match on the symbol. The nearest hit wins and the status is `fuzzy`, with a \"double-check\" note, because the anchor may now point at a similar but different line. If even this fails, the location stays `unresolved` at the clamped original line, so it still gets a snippet.","path":"src/anchor.js","lineNumber":124,"lineContent":"status = 'fuzzy';","status":"ok","fileHash":"bb82554c2c45","snippet":{"startLine":121,"code":"      }\n      if (partial.length) {\n        idx = nearest(partial, idx0);\n        status = 'fuzzy';\n      }\n    }\n  }\n  if (relocatedFrom && (status === 'ok' || status === 'moved')) status = 'relocated';\n\n  const anchorIdx = idx >= 0 ? idx : idx0;\n  const start = Math.max(0, anchorIdx - SNIPPET_BEFORE);\n  const end = Math.min(lines.length, anchorIdx + SNIPPET_AFTER + 1);\n  const result = {\n    ...loc,\n    path: relPath,\n    lineNumber: anchorIdx + 1,\n    status,\n    fileHash: file.hash,"},"ctxHash":"9486745b2c6a","narrativeHash":"9486745b2c6a","exec":{"hit":false,"count":0,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"9486745b2c6a"},"check":{"verdict":"supported","issues":[],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"9486745b2c6a","proseHash":"b9f2a38f546c"}},{"id":"2g","title":"safeJoin guard","description":"Resolves repo-relative paths and refuses anything outside the root.","explanation":"Map paths come from an LLM, or from a shared JSON file, so they must not be able to read arbitrary files. `safeJoin` resolves the path against the root and checks the relative path back: anything starting with `..` or still absolute (for example another drive on Windows) throws. `FileCache.read` calls it inside a `try`, so an escaping path is read as `null` instead of throwing; the location then goes through the basename fallback [2c] and normally ends up `missing`. The cache also skips files over 4 MB to avoid loading huge generated artifacts.","path":"src/anchor.js","lineNumber":13,"lineContent":"export function safeJoin(root, rel) {","symbol":"safeJoin","status":"ok","fileHash":"bb82554c2c45","snippet":{"startLine":10,"code":"const norm = (s) => (s || '').trim().replace(/\\s+/g, ' ');\n\n/** Resolves a repo-relative path, refusing anything that escapes the root. */\nexport function safeJoin(root, rel) {\n  const abs = path.resolve(root, rel);\n  const relBack = path.relative(root, abs);\n  if (relBack.startsWith('..') || path.isAbsolute(relBack)) {\n    throw new Error(`Path \"${rel}\" is outside the repository root`);\n  }\n  return abs;\n}\n\nexport class FileCache {\n  constructor(root) {\n    this.root = root;\n    this.files = new Map();\n    this._tracked = undefined;\n  }"},"ctxHash":"5429a2d2e5ae","narrativeHash":"5429a2d2e5ae","exec":{"hit":true,"count":28,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"5429a2d2e5ae"},"check":{"verdict":"supported","issues":["fixed: said an escaping path always shows up as missing; read returns null and the basename fallback still runs first."],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"5429a2d2e5ae","proseHash":"eac5db43448b"}}],"tree":[{"ref":"2a","children":[{"ref":"2b","children":[{"label":"file resolution","children":[{"ref":"2g"},{"ref":"2c"}]},{"label":"line resolution (in order)","children":[{"ref":"2d"},{"ref":"2e"},{"ref":"2f"}]}]}]}],"narrativeHash":"513ac3898a23","check":{"verdict":"supported","issues":[],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","hash":"513ac3898a23"}},{"id":"3","title":"Reuse: viewer, context and drift","description":"The stored map is consumed by humans (HTML), by agents (markdown resource) and by CI (verify).","motivation":"A map is only worth something if people read it and it stays correct. This trace shows the three ways a stored map is consumed: a human-friendly viewer, agent-friendly context and a CI check. All three work from the same JSON document.","details":"For humans, [3a] packs the document, the referenced files, an index of the other maps, precomputed per-node check/execution states, a Mermaid diagram and full, per-trace and per-node markdown copies into a single HTML file that can be shared without a server. Inside it, selecting a node [3b] shows that node's code with the anchor line highlighted, focuses it in the diagram and, when embedded in an editor host, tells the host which file and line to reveal.\n\nFor agents, the `waymark://{id}` resource template [3c] lists every map (with id autocompletion) and, when read, returns [3d]'s markdown: header, story, guides, text call tree and numbered snippets per location, with nodes whose code changed since they were explained clearly marked. [3d] can also render a single trace or node, which keeps context small.\n\nFor maintenance, [3e] loads the stored map and re-runs [2b] on every location. It reports status changes, moved lines, files whose hash changed and narrative drift (nodes, traces or the story whose code changed after the prose was written). With `fix`, when something changed, it writes the corrected anchors and drift list back and regenerates the HTML. `waymark verify` exits with an error when anchors are broken, and `--strict` also fails on stale anchors, which turns the report into a CI check.","locations":[{"id":"3a","title":"renderHtml","description":"Inlines map, file snapshots, node states, markdown context, CSS and client into one HTML.","explanation":"This is where a stored map becomes something a human can open with a double-click. `renderHtml` receives the map, a snapshot of the referenced files (collected by `collectFiles` in the store, which skips binary and oversized files) and a light index of the other maps in the repo (used to resolve links between maps). It builds a `data` object: the document, the files, that map index, a precomputed per-node `states` entry (fact-check verdict validity and execution evidence, which need hashes the browser cannot compute synchronously), the full markdown of the map from [3d], smaller per-trace and per-node markdown blocks for the \"copy as context\" buttons, and a Mermaid source of the diagram. That object, the CSS and the client script from `viewer.client.js` are inlined into a single page. Nothing is fetched at view time, so the file works offline, from an email attachment or from a CI artifact, and it keeps showing the code *as it was* when the viewer was last rendered. The key escaping is in the JSON island: every `\u003c` is neutralised so a snippet containing `\u003c/script>` cannot break out of the data block (the inlined client script and the title are escaped separately). Selection itself happens client-side in [3b].","path":"src/render/html.js","lineNumber":25,"lineContent":"export function renderHtml(doc, { files = {}, maps = [] } = {}) {","symbol":"renderHtml","status":"ok","fileHash":"8417b34b8047","snippet":{"startLine":22,"code":" * explanations; code view with embedded files; interactive SVG diagram.\n * `files` is a snapshot { path: content } of the referenced files.\n */\nexport function renderHtml(doc, { files = {}, maps = [] } = {}) {\n  const data = {\n    doc,\n    files,\n    maps,\n    // Precomputed per-node state (fact-check verdict validity needs hashes the browser can't do sync).\n    states: Object.fromEntries(\n      doc.traces.flatMap((t) => t.locations.map((l) => [l.id, { check: checkState(l), exec: execState(l) }])),\n    ),\n    markdown: renderMarkdown(doc, { detail: 'full' }),\n    // Smaller context blocks for \"copy trace / node as context\".\n    traceMd: Object.fromEntries(doc.traces.map((t) => [t.id, renderMarkdown(doc, { trace: t.id })])),\n    nodeMd: Object.fromEntries(doc.traces.flatMap((t) => t.locations.map((l) => [l.id, renderMarkdown(doc, { node: l.id })]))),\n    mermaid: renderMermaid({ ...doc, diagram: undefined }),\n  };"},"ctxHash":"0922e822543f","narrativeHash":"0922e822543f","exec":{"hit":true,"count":4,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"0922e822543f"},"check":{"verdict":"supported","issues":["fixed: collectFiles skips binary/oversized files, so not every file is snapshotted; the client script and title are escaped too, not only the JSON island."],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"0922e822543f","proseHash":"a65140828ac6"}},{"id":"3b","title":"Node selection","description":"One primitive syncs map pane, code view, diagram and an embedding host.","explanation":"`select` is the single navigation primitive of the viewer: every interaction (clicking a card, a `[1a]` reference in a guide, a gutter marker, a diagram node, prev/next or the arrow keys) ends up here. When the viewer runs inside a host such as the VS Code extension, it first posts a `select` message with the node's path and line so the editor can follow, unless the selection came from the host itself or from boot (which avoids echo loops). It then highlights the card in the map pane and opens its trace, and `showInCode` switches the file tab, highlights the anchor line and inserts the inline annotation. If the diagram has been built it also focuses the node and its path and, in diagram view, opens the detail card and pans to it. Finally it writes `#id` to the URL, which makes deep links like `waymark-create-flow.html#2e` shareable. Because all views go through this one function they can never disagree about what is selected.","path":"src/render/viewer.client.js","lineNumber":1032,"lineContent":"function select(id, opts = {}) {","symbol":"select","status":"ok","fileHash":"ac1ff9154972","snippet":{"startLine":1029,"code":"  }\n\n  // ---------------------------------------------------------------- selection & views\n  function select(id, opts = {}) {\n    const l = byId.get(id);\n    if (!l) return;\n    state.sel = id;\n    if (host && opts.from !== 'host' && opts.from !== 'boot') host.postMessage({ type: 'select', id, path: l.path, line: l.lineNumber });\n    $$('.loc.sel', mapPane).forEach((e) => e.classList.remove('sel'));\n    const card = $('.loc[data-id=\"' + id + '\"]:not(.ref-again)', mapPane);\n    if (card) {\n      card.classList.add('sel');\n      card.closest('.trace').classList.remove('closed');\n      if (opts.from !== 'map') card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n    }\n    showInCode(l);\n    if (dg) {\n      const n = focusDiagram(id);"},"ctxHash":"bfe356e2774e","narrativeHash":"bfe356e2774e","check":{"verdict":"supported","issues":[],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"bfe356e2774e","proseHash":"4264861e667e"}},{"id":"3c","title":"waymark:// resource","description":"waymark://{id} resource: lists maps and serves them as markdown.","explanation":"This resource template makes maps @-mentionable. Its `list` callback lists every stored map with title and description, and `complete` autocompletes ids by prefix. Reading `waymark://\u003cid>` loads the JSON and returns `renderMarkdown` [3d] output as `text/markdown`. It re-reads `.waymark/` on each request, which is why the `resourceListChanged` signal from [1c] is enough to show new maps without server state. It always uses the default root (`rootOf()`), so it serves maps from the server's configured repository.","path":"src/mcp.js","lineNumber":547,"lineContent":"server.registerResource(","status":"ok","fileHash":"2b0b28761299","snippet":{"startLine":544,"code":"  );\n\n  // @-mentionable context: waymark://\u003cid>\n  server.registerResource(\n    'waymark',\n    new ResourceTemplate('waymark://{id}', {\n      list: async () => ({\n        resources: listMaps(rootOf()).map((m) => ({\n          uri: `waymark://${m.id}`,\n          name: m.title,\n          description: m.description,\n          mimeType: 'text/markdown',\n        })),\n      }),\n      complete: { id: (v) => listMaps(rootOf()).map((m) => m.id).filter((i) => i.startsWith(v)) },\n    }),\n    { title: 'Waymark', description: 'A waymark rendered as markdown context', mimeType: 'text/markdown' },\n    async (uri, { id }) => ({"},"ctxHash":"dd0446b9229a","narrativeHash":"dd0446b9229a","exec":{"hit":true,"count":1,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"dd0446b9229a"},"check":{"verdict":"supported","issues":[],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"dd0446b9229a","proseHash":"1828b0fd1b08"}},{"id":"3d","title":"renderMarkdown","description":"Renders a map, one trace or one node as agent-oriented markdown.","explanation":"This is the text an agent actually reads when it loads a map. It writes a header with id, commit, branch, date and the original query. With `node`, it renders just that location with its trace motivation, parent, next steps and links; with `trace`, only that trace plus its cross-trace links. Otherwise it renders the story and every trace: description, motivation and details, an ASCII call tree and one entry per location with title, `path:line`, symbol, description and, at `full` detail, the explanation and a numbered snippet with the anchor line marked `>`. Nodes listed in `meta.narrativeDrift` get a \"code changed since this was explained\" marker, so an agent knows which prose to distrust. `compact` drops narrative and snippets for a cheaper overview. The HTML viewer [3a] embeds the full, per-trace and per-node variants.","path":"src/render/markdown.js","lineNumber":97,"lineContent":"export function renderMarkdown(doc, { detail = 'full', diagram = false, trace: traceId = null, node: nodeId = null } = {}) {","symbol":"renderMarkdown","status":"ok","fileHash":"314557c1859a","snippet":{"startLine":94,"code":" * \"compact\" keeps only structure, one-line descriptions and anchors.\n * trace / node: render only that trace, or one node with its trace context.\n */\nexport function renderMarkdown(doc, { detail = 'full', diagram = false, trace: traceId = null, node: nodeId = null } = {}) {\n  const o = [];\n  const full = detail === 'full';\n  const staleNodes = new Set(doc.meta?.narrativeDrift?.nodes || []);\n  header(doc, o);\n\n  if (nodeId) {\n    const trace = doc.traces.find((t) => t.locations.some((l) => l.id === nodeId));\n    if (!trace) throw new Error(`Node \"${nodeId}\" not found in ${doc.id}`);\n    const loc = trace.locations.find((l) => l.id === nodeId);\n    const byId = new Map(trace.locations.map((l) => [l.id, l]));\n    const label = (n) => (n.ref && byId.get(n.ref) ? `[${n.ref}] ${byId.get(n.ref).title}` : n.label || '(group)');\n    o.push('', `## Trace ${trace.id}: ${trace.title}`, '', trace.description);\n    if (full && trace.motivation) o.push('', '### Motivation', '', trace.motivation);\n    o.push('', `## Node [${loc.id}]`, '');"},"ctxHash":"9692858d7e00","narrativeHash":"9692858d7e00","exec":{"hit":true,"count":22,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"9692858d7e00"},"check":{"verdict":"supported","issues":[],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"9692858d7e00","proseHash":"540a2578f0cb"}},{"id":"3e","title":"verifyMap","description":"Re-anchors a stored map, reports anchor and narrative drift, optionally writes fixes.","explanation":"`verifyMap` loads a stored map and runs every location through the same `anchorLocation` [2b] used at creation, with a fresh `FileCache`. It records a change whenever the status is not `ok` or the line or path differs, and separately lists files whose stored `fileHash` no longer matches. It also notices when any `ctxHash` changed and computes **narrative drift**: nodes, traces and the story whose recorded baseline hash differs from the current code (old maps without baselines get one instead of a false alarm). The map is `stale` if anchors moved or files changed, and `broken` counts unresolved plus missing. With `fix`, corrected locations replace the old ones, `commit`, `verifiedAt`, `anchors` and `narrativeDrift` are updated, and JSON and HTML are rewritten; narrative baselines are kept, so drifted prose stays flagged until it is rewritten or marked reviewed. Without `fix`, nothing on disk changes, which keeps `waymark verify --strict` safe for CI.","path":"src/verify.js","lineNumber":11,"lineContent":"export function verifyMap(root, id, { fix = false } = {}) {","symbol":"verifyMap","status":"ok","fileHash":"0d87234eb5bf","snippet":{"startLine":8,"code":" * With fix=true, corrected line numbers/snippets/context hashes are written back\n * (narrative baselines are kept, so drifted prose stays flagged until it is rewritten).\n */\nexport function verifyMap(root, id, { fix = false } = {}) {\n  const doc = loadMap(root, id);\n  const cache = new FileCache(root);\n  const changes = [];\n  const changedFiles = new Set();\n  const counts = { ok: 0, moved: 0, fuzzy: 0, relocated: 0, unresolved: 0, missing: 0 };\n  let ctxChanged = false;\n\n  const fresh = { ...doc, traces: [] };\n  for (const trace of doc.traces) {\n    const results = trace.locations.map((loc) => {\n      const r = anchorLocation(cache, loc);\n      counts[r.status]++;\n      if (loc.fileHash && r.fileHash && loc.fileHash !== r.fileHash) changedFiles.add(r.path);\n      if (r.ctxHash !== loc.ctxHash) ctxChanged = true;"},"ctxHash":"471a1a97a020","narrativeHash":"471a1a97a020","exec":{"hit":true,"count":4,"at":"2026-10-20T03:13:29.628Z","source":"v8","ctxHash":"471a1a97a020"},"check":{"verdict":"supported","issues":[],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","ctxHash":"471a1a97a020","proseHash":"ad76d3469019"}}],"tree":[{"label":"humans","children":[{"ref":"3a","children":[{"ref":"3b"}]}]},{"label":"agents","children":[{"ref":"3c","children":[{"ref":"3d"}]}]},{"label":"CI / maintenance","children":[{"ref":"3e"}]}],"narrativeHash":"9e0d07e8332d","check":{"verdict":"supported","issues":["fixed: said --strict turns the report into a CI failure; plain verify already exits 1 on broken anchors, --strict adds stale ones. verify --fix writes only when something changed."],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)","hash":"9e0d07e8332d"}}],"links":[{"from":"1f","to":"2a","label":"anchorMap(root, map)"},{"from":"1h","to":"3a","label":"renderHtml(doc)"},{"from":"3e","to":"2b","label":"re-anchor each location"}],"tags":["meta","architecture"],"meta":{"createdAt":"2026-10-01T16:36:38.822Z","updatedAt":"2026-10-20T03:51:35.135Z","root":"C:\\DATOS\\codemaps-custom","commit":"9fce4e38f8797d3e72d7948c3f5e3646a2783d12","branch":"main","remote":"https://github.com/h0w4r/waymark","anchors":{"ok":20,"moved":0,"fuzzy":0,"relocated":0,"unresolved":0,"missing":0},"verifiedAt":"2026-10-20T04:02:58.142Z","exec":{"hit":18,"miss":1,"unknown":1,"at":"2026-10-20T03:13:29.628Z","source":"v8","command":"node --test test/waymark.test.js"},"check":{"supported":18,"partial":2,"unsupported":0,"unchecked":0,"stale":0,"total":20}},"narrativeHash":"e9e4d75e90d5","storyCheck":{"verdict":"supported","issues":["fixed: said saveMap is the only path that writes maps to disk; annotate/note/check/verify --fix also persist via persist()."],"at":"2026-10-20T03:50:45.737Z","checker":"claude-opus-5-5 (waymark fact-checker)"}},"files":{"src/mcp.js":"#!/usr/bin/env node\nimport * as z from 'zod';\nimport { McpServer, ResourceTemplate } from '@modelcontextprotocol/sdk/server/mcp.js';\nimport { StdioServerTransport } from '@modelcontextprotocol/sdk/server/stdio.js';\nimport { MapInput } from './schema.js';\nimport { fileURLToPath } from 'node:url';\nimport { resolveRoot } from './git.js';\nimport { saveMap, loadMap, listMaps, writeHtml, deleteMap, annotateMap, narrativeGaps } from './store.js';\nimport { lintMap } from './lint.js';\nimport { noteMap, recordCheck } from './store.js';\nimport { diffMaps, renderDiff } from './diff.js';\nimport { applyCoverage, parseLcov, runWithV8Coverage } from './coverage.js';\nimport { createPlan, addTrace, draftStatus, draftTraces, finalizeDraft, listDrafts } from './parallel.js';\nimport { checkGuide, planGuide, traceGuide, finalizeGuide, overviewGuide } from './procedures.js';\nimport { TraceInput, LinkInput } from './schema.js';\nimport fsSync from 'node:fs';\nimport { mapsForFile, renderFileContext, forFileSummary } from './context.js';\nimport { verifyMap } from './verify.js';\nimport { findInFile } from './anchor.js';\nimport { suggestTopics } from './suggest.js';\nimport { waymarkGuide, enrichGuide, refreshGuide } from './guide.js';\nimport { renderMarkdown } from './render/markdown.js';\nimport { renderMermaid } from './render/mermaid.js';\nimport { openFile } from './open.js';\n\nconst VERSION = '0.3.0';\nconst rootArg = z.string().optional().describe('Repository root. Defaults to the server working directory / WAYMARK_ROOT');\n\nconst text = (t) => ({ content: [{ type: 'text', text: typeof t === 'string' ? t : JSON.stringify(t, null, 2) }] });\nconst fail = (e) => ({ isError: true, content: [{ type: 'text', text: String(e?.message || e) }] });\nconst safe = (fn) => async (args) => {\n  try {\n    return await fn(args);\n  } catch (e) {\n    return fail(e);\n  }\n};\n\n// Workspace announced by the client (MCP roots). Lets a globally installed server\n// (e.g. ~/.codex/config.toml used by Codex desktop) target the open project.\nlet clientRoot = null;\nconst rootOf = (root) => resolveRoot(root || process.env.WAYMARK_ROOT || clientRoot || undefined);\n\nexport function createServer() {\n  const server = new McpServer(\n    { name: 'waymark', version: VERSION },\n    {\n      instructions:\n        'Waymark: hierarchical, line-anchored, narrated maps of how code executes. To create one, call waymark_start(query) and follow the returned procedure, then waymark_create (or the parallel flow waymark_plan → waymark_add_trace × N → waymark_finalize). Fact-check with waymark_check. ' +\n        'To use an existing map as context, read resource waymark://\u003cid> or call waymark_get. Run waymark_verify before trusting an old map.',\n    },\n  );\n\n  server.registerTool(\n    'waymark_start',\n    {\n      title: 'Start a waymark',\n      description:\n        'Begin generating a waymark map for a topic/question. Returns the Waymark agent procedure (structure + storytelling rules), the input format, repo hints (recent files, entry points) and existing maps. Call this first, then explore the code and submit with waymark_create.',\n      inputSchema: {\n        query: z.string().describe('Topic or question, e.g. \"how does checkout payment work?\"'),\n        mode: z\n          .enum(['fast', 'smart', 'overview', 'parallel'])\n          .optional()\n          .describe('fast: short map quickly; smart (default): thorough map with full storytelling; overview: map of the whole system linking to detailed maps; parallel: plan traces for parallel builders'),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ query, mode, root }) => {\n      const r = rootOf(root);\n      const hints = suggestTopics(r, { limit: 5 });\n      const existing = listMaps(r).slice(0, 15).map(({ id, title, query: q, updatedAt }) => ({ id, title, query: q, updatedAt }));\n      return text(\n        `${mode === 'overview' ? overviewGuide(query) + '\\n\\n' + waymarkGuide(query, { mode: 'fast' }) : mode === 'parallel' ? planGuide(query) : waymarkGuide(query, { mode })}\\n## Repository\\n\\nroot: ${r}\\n\\n` +\n          `Entry points: ${hints.entryPoints.join(', ') || '(none detected)'}\\n\\n` +\n          (hints.viewedFiles.length ? `Recently viewed in the editor: ${hints.viewedFiles.map((f) => f.file).join(', ')}\\n\\n` : '') +\n          `Recently touched: ${hints.recentFiles.slice(0, 12).map((f) => f.file).join(', ') || '(none)'}\\n\\n` +\n          `Existing waymark (reuse/update instead of duplicating): ${existing.length ? JSON.stringify(existing) : 'none'}`,\n      );\n    }),\n  );\n\n  server.registerTool(\n    'waymark_suggest_topics',\n    {\n      title: 'Suggest waymark topics',\n      description: 'Suggests waymark topics from recent work (uncommitted and recently committed files, commit subjects) and detected entry points.',\n      inputSchema: { root: rootArg, limit: z.number().int().min(1).max(20).optional() },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ root, limit }) => text(suggestTopics(rootOf(root), { limit }))),\n  );\n\n  server.registerTool(\n    'waymark_find_anchor',\n    {\n      title: 'Find anchor lines',\n      description: 'Returns line numbers and exact line text in a file matching a literal string or regex. Use it to get precise lineNumber/lineContent for locations.',\n      inputSchema: {\n        path: z.string().describe('File path relative to repo root'),\n        pattern: z.string(),\n        regex: z.boolean().optional(),\n        limit: z.number().int().min(1).max(100).optional(),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ path, pattern, regex, limit, root }) => text(findInFile(rootOf(root), path, pattern, { regex, limit }))),\n  );\n\n  server.registerTool(\n    'waymark_create',\n    {\n      title: 'Create or update a waymark',\n      description:\n        'Validates a waymark, verifies every location against the working tree (auto-correcting shifted line numbers), stores it under .waymark/ and writes a shareable HTML viewer. Pass `id` to overwrite an existing map. Returns an anchor report: fix any unresolved/missing locations and resubmit.',\n      inputSchema: {\n        ...MapInput.shape,\n        id: z.string().optional().describe('Existing waymark id to overwrite'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...map }) => {\n      const r = rootOf(root);\n      const { doc, report, narrative, jsonPath, htmlPath } = saveMap(r, map, { id });\n      server.sendResourceListChanged();\n      const next = [];\n      if (!report.healthy) {\n        next.push('Some locations could not be verified. Fix them (waymark_find_anchor helps) and call waymark_create again with id=\"' + doc.id + '\".');\n      }\n      if (!narrative.complete) {\n        next.push('Narrative is incomplete (see \"narrative\"). Fill the story, trace motivation/details and per-location explanations with waymark_annotate(id=\"' + doc.id + '\").');\n      }\n      const lint = lintMap(doc, { mapIds: new Set(listMaps(r).map((m) => m.id)) });\n      if (lint.errors) next.push('Lint found ' + lint.errors + ' error(s) (e.g. references to unknown nodes): fix them with waymark_annotate.');\n      if (!next.length) next.push('All anchors verified and narrative complete. Share the HTML file or reference waymark://' + doc.id);\n      return text({\n        id: doc.id,\n        resource: `waymark://${doc.id}`,\n        html: htmlPath,\n        json: jsonPath,\n        anchors: report,\n        narrative,\n        lint: { errors: lint.errors, warnings: lint.warnings, issues: lint.issues.slice(0, 15) },\n        next,\n      });\n    }),\n  );\n\n  const prose = () => z.string().optional();\n  server.registerTool(\n    'waymark_annotate',\n    {\n      title: 'Annotate a waymark (narrative)',\n      description:\n        'Adds or rewrites the prose of an existing map without re-sending or re-anchoring it: map story/description/title, trace motivation/details/description/diagramTitle, location explanation/description/title. Only the fields you pass change. Regenerates the HTML viewer and returns which narrative fields are still missing.',\n      inputSchema: {\n        id: z.string().describe('Map id (a unique prefix is enough)'),\n        title: prose(),\n        description: prose().describe('Map summary citing nodes as [1a]'),\n        story: prose().describe('Holistic storytelling narrative (markdown)'),\n        language: prose(),\n        traces: z\n          .array(\n            z.object({\n              id: z.string(),\n              title: prose(),\n              description: prose(),\n              diagramTitle: prose(),\n              motivation: prose().describe('Why this part exists (markdown)'),\n              details: prose().describe('Narrative walkthrough citing nodes (markdown)'),\n            }),\n          )\n          .optional(),\n        locations: z\n          .array(\n            z.object({\n              id: z.string(),\n              title: prose(),\n              description: prose().describe('One sentence \u003c= 15 words'),\n              explanation: prose().describe('Storytelling explanation, 3-6 sentences (markdown)'),\n            }),\n          )\n          .optional(),\n        links: z.array(LinkInput).optional().describe('Replaces the whole list of cross-trace links (fix labels or ends)'),\n        reviewed: z\n          .array(z.string())\n          .optional()\n          .describe('Prose confirmed still accurate after a code change: node ids (\"2b\"), \"trace:\u003cid>\" or \"story\"'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...patch }) => text(annotateMap(rootOf(root), id, patch))),\n  );\n\n  server.registerTool(\n    'waymark_enrich',\n    {\n      title: 'Enrich a waymark with storytelling',\n      description:\n        'Returns the procedure to upgrade an existing map with full storytelling (holistic story, Motivation/Details guides per trace, an explanation per location), the list of missing narrative and the map itself. Follow it and save with waymark_annotate.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const doc = loadMap(rootOf(root), id);\n      return text(\n        enrichGuide(doc.id) +\n          '\\n\\n## Missing narrative\\n\\n' +\n          JSON.stringify(narrativeGaps(doc)) +\n          '\\n\\n## Current map\\n\\n' +\n          renderMarkdown(doc, { detail: 'full' }),\n      );\n    }),\n  );\n\n  server.registerTool(\n    'waymark_list',\n    {\n      title: 'List waymark',\n      description: 'Lists waymark stored in the repository (.waymark/).',\n      inputSchema: { root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ root }) => text(listMaps(rootOf(root)))),\n  );\n\n  server.registerTool(\n    'waymark_get',\n    {\n      title: 'Get a waymark',\n      description:\n        'Returns a map for use as context. format: \"markdown\" (narrative + structure + snippets, default), \"compact\" (structure + one-line descriptions), \"json\", \"mermaid\". Pass trace (\"2\") or node (\"2b\") to get only that part — much smaller context.',\n      inputSchema: {\n        id: z.string().describe('Map id (a unique prefix is enough)'),\n        format: z.enum(['markdown', 'compact', 'json', 'mermaid']).optional(),\n        trace: z.string().optional().describe('Only this trace, e.g. \"2\"'),\n        node: z.string().optional().describe('Only this node with its trace context, e.g. \"2b\"'),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, format = 'markdown', trace, node, root }) => {\n      const doc = loadMap(rootOf(root), id);\n      if (format === 'json') return text(doc);\n      if (format === 'mermaid') return text(renderMermaid(doc));\n      return text(renderMarkdown(doc, { detail: format === 'compact' ? 'compact' : 'full', trace, node }));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_for_file',\n    {\n      title: 'Maps covering a file',\n      description:\n        'Lists the maps, traces and nodes that cover a file (optionally the node nearest to a line), with their one-line descriptions, the explanation of the nearest node and a flag when the code changed since a node was explained. Call it before modifying a file to understand the flow it belongs to.',\n      inputSchema: {\n        path: z.string().describe('File path (absolute or relative to the repo root)'),\n        line: z.number().int().positive().optional(),\n        format: z.enum(['markdown', 'json']).optional(),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ path: file, line, format = 'markdown', root }) => {\n      const res = mapsForFile(rootOf(root), file, { line });\n      if (format === 'json') return text(forFileSummary(res));\n      return text(renderFileContext(res, { maxChars: 12000 }) || `No waymark map covers ${res.path}.`);\n    }),\n  );\n\n  server.registerTool(\n    'waymark_lint',\n    {\n      title: 'Lint maps',\n      description:\n        'Static quality checks on maps: references to unknown nodes (errors), missing narrative, nodes not cited in their trace details, nodes missing from the tree, over-long titles/descriptions, very short explanations. Omit id to lint all maps.',\n      inputSchema: { id: z.string().optional(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const r = rootOf(root);\n      const ids = id ? [loadMap(r, id).id] : listMaps(r).map((m) => m.id);\n      const mapIds = new Set(listMaps(r).map((m) => m.id));\n      return text(ids.map((i) => lintMap(loadMap(r, i), { mapIds })));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_refresh',\n    {\n      title: 'Refresh outdated narrative',\n      description:\n        'Finds prose whose code changed since it was written (narrative drift: nodes, trace guides, story) and returns the procedure to bring it back in sync with waymark_annotate (or mark it reviewed). Use after code changes in areas covered by a map.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const r = rootOf(root);\n      const v = verifyMap(r, id);\n      const doc = loadMap(r, v.id);\n      if (!v.narrative.stale && !v.broken) return text(`Map ${v.id}: narrative is in sync with the code. Nothing to refresh.`);\n      const brokenIds = v.changes.filter((c) => c.status === 'unresolved' || c.status === 'missing').map((c) => c.id);\n      const nodes = [...new Set([...brokenIds, ...v.narrative.nodes])].map((n) => renderMarkdown(doc, { node: n })).join('\\n\\n---\\n\\n');\n      return text(\n        refreshGuide(v.id, v.narrative, brokenIds) +\n          (nodes ? '\\n\\n## Stale nodes (stored prose + last snippet)\\n\\n' + nodes : ''),\n      );\n    }),\n  );\n\n  // ---------------- fact-checking\n  server.registerTool(\n    'waymark_check',\n    {\n      title: 'Fact-check a map',\n      description:\n        'Returns the fact-checking procedure for a map plus the full map (prose + code snippets). A skeptical verifier checks every claim against the code, fixes wrong prose with waymark_annotate and records verdicts with waymark_record_check. Best run by a fresh agent/subagent that did not write the map.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const doc = loadMap(rootOf(root), id);\n      return text(checkGuide(doc.id) + '\\n\\n## Map to check\\n\\n' + renderMarkdown(doc, { detail: 'full' }));\n    }),\n  );\n\n  const verdict = z.enum(['supported', 'partial', 'unsupported']);\n  server.registerTool(\n    'waymark_record_check',\n    {\n      title: 'Record fact-check verdicts',\n      description:\n        'Stores fact-check verdicts. A verdict stays valid while the node\\'s code block and prose are unchanged; it becomes \"stale\" otherwise. unsupported verdicts are lint errors.',\n      inputSchema: {\n        id: z.string(),\n        nodes: z.array(z.object({ id: z.string(), verdict, issues: z.array(z.string()).optional() })).optional(),\n        traces: z.array(z.object({ id: z.string(), verdict, issues: z.array(z.string()).optional() })).optional(),\n        story: z.object({ verdict, issues: z.array(z.string()).optional() }).optional(),\n        checker: z.string().optional().describe('Who checked (model/agent name)'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, root, ...v }) => text(recordCheck(rootOf(root), id, v))),\n  );\n\n  // ---------------- human notes\n  server.registerTool(\n    'waymark_note',\n    {\n      title: 'Add or remove a human note',\n      description:\n        'Adds a human note to a node (team knowledge: gotchas, decisions, links). Notes are never rewritten by agents and survive map regeneration. Use only when the user asks to record something. remove=\u003cindex> deletes one.',\n      inputSchema: {\n        id: z.string(),\n        node: z.string(),\n        text: z.string().optional(),\n        author: z.string().optional(),\n        remove: z.number().int().min(0).optional(),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, node, text: t, author, remove, root }) => text(noteMap(rootOf(root), id, node, { text: t, author, remove }))),\n  );\n\n  // ---------------- change impact (PRs)\n  server.registerTool(\n    'waymark_diff',\n    {\n      title: 'Impact of changes on the maps',\n      description:\n        'Which map nodes a change set touches (their code blocks intersect changed lines), which anchors it breaks and which prose it leaves outdated. base \"HEAD\" (default) = uncommitted changes; with range=true compares base...HEAD (a branch or PR).',\n      inputSchema: {\n        base: z.string().optional(),\n        range: z.boolean().optional(),\n        format: z.enum(['markdown', 'json']).optional(),\n        root: rootArg,\n      },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ base = 'HEAD', range = false, format = 'markdown', root }) => {\n      const rep = diffMaps(rootOf(root), base, { range });\n      return text(format === 'json' ? rep : renderDiff(rep));\n    }),\n  );\n\n  // ---------------- verification by execution\n  server.registerTool(\n    'waymark_exec',\n    {\n      title: 'Mark nodes executed by tests',\n      description:\n        'Marks which nodes actually ran, from coverage: pass lcov (path to an lcov.info from any language) or command (a test command run with NODE_V8_COVERAGE, Node/JS only). Results show as ▶ in viewers and in context.',\n      inputSchema: {\n        id: z.string().optional().describe('Map id; omit for all maps'),\n        lcov: z.string().optional(),\n        command: z.string().optional().describe('e.g. \"npm test\"'),\n        root: rootArg,\n      },\n    },\n    safe(async ({ id, lcov, command, root }) => {\n      const r = rootOf(root);\n      let coverage;\n      let source;\n      if (lcov) {\n        coverage = parseLcov(fsSync.readFileSync(lcov, 'utf8'), r);\n        source = 'lcov';\n      } else if (command) {\n        const parts = command.split(' ');\n        const res = runWithV8Coverage(r, parts[0], parts.slice(1));\n        coverage = res.coverage;\n        source = 'v8';\n      } else throw new Error('Pass lcov or command');\n      return text(applyCoverage(r, coverage, { ids: id ? [id] : null, source, command: command || lcov }));\n    }),\n  );\n\n  // ---------------- parallel generation\n  server.registerTool(\n    'waymark_plan',\n    {\n      title: 'Plan a map for parallel builders',\n      description:\n        'Phase 1 of parallel generation: registers the traces to build (title, focus, hints) and returns a draft id plus one ready-to-use builder prompt per trace. Launch one builder (subagent) per trace in parallel; each submits with waymark_add_trace; then waymark_finalize.',\n      inputSchema: {\n        query: z.string(),\n        title: z.string(),\n        language: z.string().optional(),\n        kind: z.enum(['flow', 'overview']).optional(),\n        traces: z.array(z.object({ title: z.string(), focus: z.string(), hints: z.array(z.string()).optional() })).min(1),\n        root: rootArg,\n      },\n    },\n    safe(async ({ root, ...p }) => {\n      const r = rootOf(root);\n      const plan = createPlan(r, p);\n      return text({\n        draft: plan.draft,\n        traces: plan.traces.map((t) => ({ n: t.n, title: t.title, builderPrompt: traceGuide(plan.draft, t.n, plan) })),\n        next: 'Run one builder per trace in parallel (e.g. one waymark subagent each, all in the same message), then call waymark_finalize after reading waymark_draft.',\n      });\n    }),\n  );\n\n  server.registerTool(\n    'waymark_add_trace',\n    {\n      title: 'Submit one trace of a draft',\n      description: 'Phase 2: validates, renumbers (ids \u003cn>a, \u003cn>b…) and anchors ONE trace of a planned draft. Safe to call from parallel builders.',\n      inputSchema: { draft: z.string(), n: z.number().int().positive(), trace: TraceInput, root: rootArg },\n    },\n    safe(async ({ draft, n, trace, root }) => text(addTrace(rootOf(root), draft, n, trace))),\n  );\n\n  server.registerTool(\n    'waymark_draft',\n    {\n      title: 'Read a draft',\n      description: 'Status of a draft (finished/missing traces) and the finished traces as markdown, for the finalize step. Omit draft to list drafts.',\n      inputSchema: { draft: z.string().optional(), root: rootArg },\n      annotations: { readOnlyHint: true },\n    },\n    safe(async ({ draft, root }) => {\n      const r = rootOf(root);\n      if (!draft) return text(listDrafts(r).map(({ plan, ...d }) => d));\n      const st = draftStatus(r, draft);\n      const traces = draftTraces(r, draft);\n      const md = traces.length\n        ? renderMarkdown({ id: draft, title: st.title, description: '', traces }, { detail: 'compact' })\n        : '(no finished traces yet)';\n      const { plan, ...rest } = st;\n      return text(JSON.stringify(rest, null, 2) + '\\n\\n' + md);\n    }),\n  );\n\n  server.registerTool(\n    'waymark_finalize',\n    {\n      title: 'Finalize a parallel draft',\n      description: 'Phase 3: merges the finished traces into a regular map with the map-level description, story and cross-trace links, then removes the draft.',\n      inputSchema: {\n        draft: z.string(),\n        title: z.string().optional(),\n        description: z.string(),\n        story: z.string().optional(),\n        language: z.string().optional(),\n        links: z.array(LinkInput).optional(),\n        id: z.string().optional(),\n        root: rootArg,\n      },\n    },\n    safe(async ({ draft, root, ...rest }) => {\n      const r = rootOf(root);\n      const { doc, report, narrative, htmlPath } = finalizeDraft(r, draft, rest);\n      server.sendResourceListChanged();\n      return text({ id: doc.id, html: htmlPath, anchors: report, narrative, lint: lintMap(doc, { mapIds: new Set(listMaps(r).map((m) => m.id)) }) });\n    }),\n  );\n\n  server.registerTool(\n    'waymark_verify',\n    {\n      title: 'Verify waymark anchors',\n      description:\n        'Re-checks waymark locations against the current code: detects moved lines, renamed files and removed code. With fix=true, writes corrected anchors back. Omit id to verify all maps.',\n      inputSchema: { id: z.string().optional(), fix: z.boolean().optional(), root: rootArg },\n    },\n    safe(async ({ id, fix, root }) => {\n      const r = rootOf(root);\n      const ids = id ? [id] : listMaps(r).map((m) => m.id);\n      return text(ids.map((i) => verifyMap(r, i, { fix })));\n    }),\n  );\n\n  server.registerTool(\n    'waymark_render',\n    {\n      title: 'Render waymark viewer',\n      description: 'Regenerates the self-contained HTML viewer of a waymark and optionally opens it in the default browser.',\n      inputSchema: { id: z.string(), open: z.boolean().optional(), root: rootArg },\n    },\n    safe(async ({ id, open, root }) => {\n      const r = rootOf(root);\n      const p = writeHtml(r, loadMap(r, id));\n      if (open) openFile(p);\n      return text({ html: p });\n    }),\n  );\n\n  server.registerTool(\n    'waymark_delete',\n    {\n      title: 'Delete a waymark',\n      description: 'Deletes a waymark (JSON and HTML) from .waymark/. Only use when the user asks.',\n      inputSchema: { id: z.string(), root: rootArg },\n      annotations: { destructiveHint: true },\n    },\n    safe(async ({ id, root }) => {\n      const removed = deleteMap(rootOf(root), id);\n      server.sendResourceListChanged();\n      return text({ deleted: removed });\n    }),\n  );\n\n  // @-mentionable context: waymark://\u003cid>\n  server.registerResource(\n    'waymark',\n    new ResourceTemplate('waymark://{id}', {\n      list: async () => ({\n        resources: listMaps(rootOf()).map((m) => ({\n          uri: `waymark://${m.id}`,\n          name: m.title,\n          description: m.description
