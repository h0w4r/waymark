name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      # The Claude Code plugin is installed straight from git: its bundle must be committed up to date.
      - run: git diff --exit-code -- plugin
        if: matrix.os == 'ubuntu-latest'
      - run: npm test
      # Dogfooding: the example maps in .waymark/ document this repo; fail if they drift.
      - run: node src/cli.js verify --strict
      - run: node src/cli.js lint
