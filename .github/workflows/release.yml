name: release
# Push a tag like v0.3.0 (after `npm run version:set -- 0.3.0`) to publish a GitHub Release
# with the packaged VS Code extension (.vsix). Installed extensions pick it up on their daily check.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Versions must match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$TAG"
          test "$(node -p "require('./vscode/package.json').version")" = "$TAG"
      - name: Package extension
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          cd vscode && npx --yes @vscode/vsce@latest package --no-dependencies -o "waymark-vscode-$TAG.vsix"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vscode/*.vsix --title "Waymark $GITHUB_REF_NAME" --generate-notes
